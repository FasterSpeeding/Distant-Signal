# Local stack: postgres + redis + api + the four RDM pollers + poller-tfl +
# aggregator + enricher + frontend.
#
# Real secrets/URLs go in git-ignored env files. There is no automatically
# loaded `.env` any more: which mode you get is decided entirely by which
# file you pass to `--env-file`, and each of the two files is
# self-contained (it carries the complete variable set, secrets included).
#
#   cp local.env.example local.env   # then fill in real values
#   cp dev.env.example   dev.env     # ...and again — see the drift warning
#                                    # at the top of both example files
#
# Usage:
#   docker compose --env-file local.env up --build   # optimized release
#                                                    # builds, `next start`
#   docker compose --env-file dev.env   up --build   # fast debug builds +
#                                                    # frontend hot reload
#
# Each env file sets `COMPOSE_FILE` itself, so the two commands above are
# all there is to it — `local.env` selects this file alone, `dev.env`
# selects this file plus `docker-compose.dev.yml` (the thin debug/hot-reload
# override). No Compose profiles are involved; a bare `docker compose up`
# with no `--env-file` will simply fail on unset variables.
#
# In dev mode `frontend` bind-mounts `./frontend` into the container and
# runs `next dev`, so editing a file on the host recompiles in place with no
# rebuild and no restart. One caveat: dependencies live in an anonymous
# volume that Compose carries across recreates, so after changing
# `frontend/package.json` you need
#   docker compose --env-file dev.env up --build --force-recreate -V frontend
# (`-V` renews the anonymous volume) or the container keeps the stale deps.
# See docker-compose.dev.yml for the details.
#
# Build caching: every Dockerfile here starts with
# `# syntax=docker/dockerfile:1` and uses BuildKit cache mounts — the cargo
# registry/git/target dirs for the nine Rust services (api, aggregator,
# enricher, trust-consumer and the five pollers), npm's download cache and
# Next's `.next/cache` for the frontend. Rebuilds therefore recompile only
# what changed rather than the whole dependency tree. One consequence worth
# knowing: the target-dir cache is keyed by rustc version (all nine Rust
# services build with rust:1.88-bookworm, so they all share one
# `cargo-target-1.88` id — this only forks into separate ids again if a
# future Dockerfile pins a different rustc version), and the `# syntax=`
# directive makes BuildKit pull the `docker/dockerfile:1` frontend image, so
# the FIRST build on a machine needs network access even if every base image
# is already local. Inspect the caches with `docker buildx du`.
#
# Nothing in this file or in the `*.env.example` templates is a real Rail
# Data Marketplace endpoint or credential; see `local.env.example` for why
# the RDM_*_BASE_URL placeholders are deliberately non-functional
# (`*.example.invalid`).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # crates/api/src/data/config.rs: ServiceArguments
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BIND_URL: 0.0.0.0:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      # All five are required by the binary with no defaults, so they use
      # `:?` (fail at `docker compose` config-resolution time with the
      # message below) rather than passing an unset variable through as an
      # empty string — which clap accepts as "explicitly set to empty" and
      # only rejects later, inside the container, as a crash loop. Same
      # convention as TFL_APP_KEY in poller-tfl below.
      SSO_ISSUER_URL: ${SSO_ISSUER_URL:?SSO_ISSUER_URL must be set — see the OIDC section of local.env.example}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:?SSO_CLIENT_ID must be set — see the OIDC section of local.env.example}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:?SSO_CLIENT_SECRET must be set — see the OIDC section of local.env.example}
      SSO_REDIRECT_URL: ${SSO_REDIRECT_URL:?SSO_REDIRECT_URL must be set — the frontend origin plus /api/auth/callback}
      SSO_POST_LOGIN_REDIRECT_URL: ${SSO_POST_LOGIN_REDIRECT_URL:?SSO_POST_LOGIN_REDIRECT_URL must be set — the frontend root URL}
      # Unlike the five above this one HAS a Rust-side default
      # (default_value_t = 14), but that default only applies when the env
      # var is absent — a bare ${SESSION_TTL_DAYS} would hand clap an empty
      # string and fail to parse as i64. Repeat the default here.
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      # Must be kept equal to the aggregator service's own
      # HISTORY_RETENTION_DAYS below -- see
      # crates/api/src/data/config.rs's history_retention_days doc comment.
      # Same variable, same default, read from the one env file.
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-7}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/public/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  poller-incidents:
    build:
      context: .
      dockerfile: docker/poller-incidents.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/poller-incidents/src/config.rs: Config. GAP: no confirmed
      # RDM endpoint path for this product — RDM_INCIDENTS_BASE_URL is a
      # placeholder until real account data resolves it (see
      # local.env.example).
      RDM_INCIDENTS_BASE_URL: ${RDM_INCIDENTS_BASE_URL}
      RDM_API_KEY: ${RDM_INCIDENTS_API_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_INCIDENTS:-300}
      RUST_LOG: ${RUST_LOG:-info}
      API_INGEST_URL: http://api:8080/private/incidents

  poller-stations:
    build:
      context: .
      dockerfile: docker/poller-stations.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/poller-stations/src/config.rs: Config. GAP: exact JSON
      # field casing for this feed is unconfirmed (see schema.rs module
      # docs).
      RDM_STATIONS_BASE_URL: ${RDM_STATIONS_BASE_URL}
      RDM_API_KEY: ${RDM_STATIONS_API_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # Real-world cadence per RSPS5050 P-03-00 Rev A §6 is 86400s (24h);
      # shortened via dev.env for local verification of the poll loop.
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_STATIONS:-86400}
      RUST_LOG: ${RUST_LOG:-info}
      API_INGEST_URL: http://api:8080/private/stations

  poller-tocs:
    build:
      context: .
      dockerfile: docker/poller-tocs.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/poller-tocs/src/config.rs: Config. GAP: no confirmed RDM
      # endpoint path for this product — RDM_TOCS_BASE_URL is a
      # placeholder until real account data resolves it (see
      # local.env.example).
      RDM_TOCS_BASE_URL: ${RDM_TOCS_BASE_URL}
      RDM_API_KEY: ${RDM_TOCS_API_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # Real-world cadence per RSPS5050 P-03-00 Rev A §3 is 86400s (24h);
      # shortened via dev.env for local verification of the poll loop.
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_TOCS:-86400}
      RUST_LOG: ${RUST_LOG:-info}
      API_INGEST_URL: http://api:8080/private/tocs

  poller-ldbws:
    build:
      context: .
      dockerfile: docker/poller-ldbws.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/poller-ldbws/src/config.rs: Config. GAP: RDM product-slug
      # segment is unconfirmed (two variants seen in research); GAP: this
      # feed's real rate limit is unconfirmed (see the implementation
      # plan's Global Constraints).
      LDBWS_BASE_URL: ${LDBWS_BASE_URL}
      RDM_API_KEY: ${LDBWS_API_KEY}
      NUM_ROWS: ${LDBWS_NUM_ROWS:-10}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # DESIGN.md §4 target cadence is 30-60s; 60 is the conservative end
      # given this feed's rate limit is unconfirmed.
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_LDBWS:-60}
      RUST_LOG: ${RUST_LOG:-info}
      API_SAMPLE_STATIONS_URL: http://api:8080/private/sample-stations
      API_INGEST_URL: http://api:8080/private/station-samples

  poller-tfl:
    build:
      context: .
      dockerfile: docker/poller-tfl.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/poller-tfl/src/config.rs: Config. No endpoint GAP here,
      # unlike the four RDM pollers — TfL's Unified API is public and
      # documented, so the base URL has a real default.
      TFL_BASE_URL: ${TFL_BASE_URL:-https://api.tfl.gov.uk}
      TFL_APP_KEY: ${TFL_APP_KEY:?TFL_APP_KEY must be set — see api-portal.tfl.gov.uk}
      TFL_MODES: ${TFL_MODES:-tube,dlr,overground,elizabeth-line,tram}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # TfL publishes no recommended cadence and offers no push or
      # conditional requests; 300s mirrors poller-incidents.
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_TFL:-300}
      RUST_LOG: ${RUST_LOG:-info}
      API_INGEST_URL: http://api:8080/private/tfl-line-status

  aggregator:
    build:
      context: .
      dockerfile: docker/aggregator.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/aggregator/src/config.rs: Config
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LINES_DIR: /app/lines
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_AGGREGATOR:-60}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-7}
      RUST_LOG: ${RUST_LOG:-info}

  enricher:
    build:
      context: .
      dockerfile: docker/enricher.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # crates/enricher/src/config.rs: Config
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL}
      SWEEP_INTERVAL_SECS: ${SWEEP_INTERVAL_SECS:-3600}
      RUST_LOG: ${RUST_LOG:-info}

  trust-consumer:
    build:
      context: .
      dockerfile: docker/trust-consumer.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/trust-consumer/src/config.rs: Config. GAP: KAFKA_BROKERS,
      # KAFKA_TOPIC, and KAFKA_SASL_MECHANISM are unconfirmed against a
      # live RDM Train Movements catalogue entry -- placeholders until a
      # real subscription resolves them (see local.env.example and this
      # plan's Prerequisites).
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-distant-signal-trust-consumer}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
      # No `:-PLAIN` fallback, deliberately: config.rs gives this field no
      # clap default precisely so a wrong guess can't run silently (RDM's
      # mechanism is still a GAP), and a compose-level default reintroduced
      # exactly that. Same posture as the Helm chart's `fail` guard on
      # trustConsumer.kafka.saslMechanism. Verified both ways by running the
      # binary: with the variable unset clap refuses to start ("the following
      # required arguments were not provided: --kafka-sasl-mechanism"), and
      # with it set empty -- what compose passes through for an unset var --
      # librdkafka refuses at connect ("Invalid value for configuration
      # property \"sasl.mechanisms\""). Either way it stops, loudly.
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM}
      API_INGEST_URL: http://api:8080/private/train-events
      API_TRACKED_TRAINS_URL: http://api:8080/private/tracked-trains
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # Matches docker/trust-consumer.Dockerfile's COPY of reference-data/
      # into the image, same pattern as aggregator's/api's own explicit
      # LINES_DIR: /app/lines above.
      STANOX_CRS_FILE: /app/reference-data/stanox-crs.csv
      REFERENCE_RELOAD_SECS: ${REFERENCE_RELOAD_SECS:-60}
      RETENTION_DAYS: ${RETENTION_DAYS_TRAIN_EVENTS:-90}
      HEALTH_BIND_URL: 0.0.0.0:8081
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # schedule-sftp + schedule-ingest: the local-dev equivalent of the Helm
  # chart's single Pod with two containers sharing one PVC (see
  # charts/distant-signal/templates/schedulefeed-deployment.yaml). Compose
  # has no native "two containers, one Pod" primitive, so two services
  # sharing one named volume (schedule_feed_data below) is the closest
  # local-dev approximation, not a literal reproduction of that shape.
  schedule-sftp:
    image: drakkan/sftpgo:latest   # tag pinning is an implementation-time
                                    # decision, not sketched further here
    restart: unless-stopped
    ports:
      - "${SCHEDULE_SFTP_PORT:-2222}:2022"
    volumes:
      - schedule_feed_data:/data/schedule-feed
      - ./schedule-sftp-host-keys:/srv/sftpgo/host_keys:ro
    environment:
      SFTPGO_SFTPD__BINDINGS__0__PORT: "2022"
      # Real credentials for DTD's push client -- placeholder here, matching
      # this repo's *.env.example convention for feeds with no confirmed
      # endpoint yet (see docs/superpowers/plans/2026-09-01-schedule-feed-push-ingestion.md
      # Task 1). Never auto-generated -- see Credentials in the push design
      # doc.
      SCHEDULE_SFTP_USERNAME: ${SCHEDULE_SFTP_USERNAME:?SCHEDULE_SFTP_USERNAME must be set once DTD's push account details are known -- see docs/superpowers/plans/2026-09-01-schedule-feed-push-ingestion.md Task 1}

  schedule-ingest:
    build:
      context: .
      dockerfile: docker/schedule-ingest.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      schedule-sftp:
        condition: service_started
    environment:
      # crates/schedule-ingest/src/config.rs: Config
      WATCH_DIR: /data/schedule-feed/incoming
      STORAGE_DIR: /data/schedule-feed
      CHECK_TIMES: ${SCHEDULE_FEED_CHECK_TIMES:-22:00,22:30,23:00,23:30,00:00,00:30,01:00,01:30,16:00}
      RETENTION_KEEP_SEQUENCES: ${RETENTION_KEEP_SEQUENCES:-2}
      STABILITY_CYCLES: ${SCHEDULE_FEED_STABILITY_CYCLES:-2}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      RUST_LOG: ${RUST_LOG:-info}
      API_INGEST_URL: http://api:8080/private/schedule-feed-ingests
    volumes:
      - schedule_feed_data:/data/schedule-feed

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # frontend/lib/api.ts: baseUrl(). Server-side only — resolved
      # inside the docker-compose network, not exposed to the browser.
      API_BASE_URL: http://api:8080
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"

volumes:
  postgres_data:
  schedule_feed_data:

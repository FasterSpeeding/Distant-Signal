# Local stack: postgres + redis + api + the four RDM pollers + poller-tfl +
# aggregator + enricher + frontend.
#
# Real secrets/URLs go in git-ignored env files. There is no automatically
# loaded `.env` any more: which mode you get is decided entirely by which
# file you pass to `--env-file`, and each of the two files is
# self-contained (it carries the complete variable set, secrets included).
#
#   cp local.env.example local.env   # then fill in real values
#   cp dev.env.example   dev.env     # ...and again — see the drift warning
#                                    # at the top of both example files
#
# Usage:
#   docker compose --env-file local.env up --build   # optimized release
#                                                    # builds, `next start`
#   docker compose --env-file dev.env   up --build   # fast debug builds +
#                                                    # frontend hot reload
#
# Each env file sets `COMPOSE_FILE` itself, so the two commands above are
# all there is to it — `local.env` selects this file alone, `dev.env`
# selects this file plus `docker-compose.dev.yml` (the thin debug/hot-reload
# override). Compose profiles are NOT used to switch between those two
# modes (see docker-compose.dev.yml's own comment on why that split was
# removed); a bare `docker compose up` with no `--env-file` will simply
# fail on unset variables. One service, `rail-mcp`, is a deliberate,
# narrower exception: it carries its own `profiles: ["rail-mcp"]` tag so it
# stays out of BOTH commands above unless you also pass `--profile
# rail-mcp` (see that service's own comment for why). Its variables still
# need real or placeholder entries in both `*.env.example` files even
# though it's opt-in -- Compose interpolates every `${VAR}` in the whole
# file before it filters by profile, so an unset one warns regardless of
# whether the service the profile gates ever actually starts.
#
# In dev mode `frontend` bind-mounts `./frontend` into the container and
# runs `next dev`, so editing a file on the host recompiles in place with no
# rebuild and no restart. One caveat: dependencies live in an anonymous
# volume that Compose carries across recreates, so after changing
# `frontend/package.json` you need
#   docker compose --env-file dev.env up --build --force-recreate -V frontend
# (`-V` renews the anonymous volume) or the container keeps the stale deps.
# See docker-compose.dev.yml for the details.
#
# Build caching: every Dockerfile here starts with
# `# syntax=docker/dockerfile:1` and uses BuildKit cache mounts — the cargo
# registry/git/target dirs for the nine Rust services (api, aggregator,
# enricher, trust-consumer and the five pollers), npm's download cache and
# Next's `.next/cache` for the frontend. Rebuilds therefore recompile only
# what changed rather than the whole dependency tree. One consequence worth
# knowing: the target-dir cache is keyed by rustc version (all nine Rust
# services build with rust:1.88-bookworm, so they all share one
# `cargo-target-1.88` id — this only forks into separate ids again if a
# future Dockerfile pins a different rustc version), and the `# syntax=`
# directive makes BuildKit pull the `docker/dockerfile:1` frontend image, so
# the FIRST build on a machine needs network access even if every base image
# is already local. Inspect the caches with `docker buildx du`.
#
# Nothing in this file or in the `*.env.example` templates is a real Rail
# Data Marketplace endpoint or credential; see `local.env.example` for why
# the RDM_*_BASE_URL placeholders are deliberately non-functional
# (`*.example.invalid`).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # crates/api/src/data/config.rs: ServiceArguments
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BIND_URL: 0.0.0.0:8080
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      REDIS_URL: redis://redis:6379
      RUST_LOG: ${RUST_LOG:-info}
      # All five are required by the binary with no defaults, so they use
      # `:?` (fail at `docker compose` config-resolution time with the
      # message below) rather than passing an unset variable through as an
      # empty string — which clap accepts as "explicitly set to empty" and
      # only rejects later, inside the container, as a crash loop. Same
      # convention as TFL_APP_KEY in poller-tfl below.
      SSO_ISSUER_URL: ${SSO_ISSUER_URL:?SSO_ISSUER_URL must be set — see the OIDC section of local.env.example}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:?SSO_CLIENT_ID must be set — see the OIDC section of local.env.example}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:?SSO_CLIENT_SECRET must be set — see the OIDC section of local.env.example}
      SSO_REDIRECT_URL: ${SSO_REDIRECT_URL:?SSO_REDIRECT_URL must be set — the frontend origin plus /api/auth/callback}
      SSO_POST_LOGIN_REDIRECT_URL: ${SSO_POST_LOGIN_REDIRECT_URL:?SSO_POST_LOGIN_REDIRECT_URL must be set — the frontend root URL}
      # Unlike the five above this one HAS a Rust-side default
      # (default_value_t = 14), but that default only applies when the env
      # var is absent — a bare ${SESSION_TTL_DAYS} would hand clap an empty
      # string and fail to parse as i64. Repeat the default here.
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      # Must be kept equal to the aggregator service's own
      # HISTORY_RETENTION_DAYS below -- see
      # crates/api/src/data/config.rs's history_retention_days doc comment.
      # Same variable, same default, read from the one env file.
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-7}
      # Public VAPID key served (unauthenticated) at
      # GET /public/notifications/vapid-public-key for the browser's
      # PushManager.subscribe() call -- same value the notifier service
      # below signs pushes with (VAPID_PUBLIC_KEY there). Required by
      # clap with no default, but deliberately defaulted to empty here
      # (not `:?`) rather than blocking the whole stack from starting:
      # unlike notifier, api has no startup fail-fast on this being
      # empty -- an unset value just means the notifications feature is
      # inert (an empty applicationServerKey the browser will reject),
      # not a crash loop.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/public/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  poller-incidents:
    build:
      context: .
      dockerfile: docker/poller-incidents.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/poller-incidents/src/config.rs: Config. GAP: no confirmed
      # RDM endpoint path for this product — RDM_INCIDENTS_BASE_URL is a
      # placeholder until real account data resolves it (see
      # local.env.example).
      RDM_INCIDENTS_BASE_URL: ${RDM_INCIDENTS_BASE_URL}
      RDM_API_KEY: ${RDM_INCIDENTS_API_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_INCIDENTS:-300}
      RUST_LOG: ${RUST_LOG:-info}
      API_INGEST_URL: http://api:8080/private/incidents

  poller-stations:
    build:
      context: .
      dockerfile: docker/poller-stations.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/poller-stations/src/config.rs: Config. GAP: exact JSON
      # field casing for this feed is unconfirmed (see schema.rs module
      # docs).
      RDM_STATIONS_BASE_URL: ${RDM_STATIONS_BASE_URL}
      RDM_API_KEY: ${RDM_STATIONS_API_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # Real-world cadence per RSPS5050 P-03-00 Rev A §6 is 86400s (24h);
      # shortened via dev.env for local verification of the poll loop.
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_STATIONS:-86400}
      RUST_LOG: ${RUST_LOG:-info}
      API_INGEST_URL: http://api:8080/private/stations

  poller-tocs:
    build:
      context: .
      dockerfile: docker/poller-tocs.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/poller-tocs/src/config.rs: Config. GAP: no confirmed RDM
      # endpoint path for this product — RDM_TOCS_BASE_URL is a
      # placeholder until real account data resolves it (see
      # local.env.example).
      RDM_TOCS_BASE_URL: ${RDM_TOCS_BASE_URL}
      RDM_API_KEY: ${RDM_TOCS_API_KEY}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # Real-world cadence per RSPS5050 P-03-00 Rev A §3 is 86400s (24h);
      # shortened via dev.env for local verification of the poll loop.
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_TOCS:-86400}
      RUST_LOG: ${RUST_LOG:-info}
      API_INGEST_URL: http://api:8080/private/tocs

  poller-ldbws:
    build:
      context: .
      dockerfile: docker/poller-ldbws.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/poller-ldbws/src/config.rs: Config. GAP: RDM product-slug
      # segment is unconfirmed (two variants seen in research); GAP: this
      # feed's real rate limit is unconfirmed (see the implementation
      # plan's Global Constraints).
      LDBWS_BASE_URL: ${LDBWS_BASE_URL}
      RDM_API_KEY: ${LDBWS_API_KEY}
      NUM_ROWS: ${LDBWS_NUM_ROWS:-10}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # DESIGN.md §4 target cadence is 30-60s; 60 is the conservative end
      # given this feed's rate limit is unconfirmed.
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_LDBWS:-60}
      RUST_LOG: ${RUST_LOG:-info}
      API_SAMPLE_STATIONS_URL: http://api:8080/private/sample-stations
      API_INGEST_URL: http://api:8080/private/station-samples

  poller-tfl:
    build:
      context: .
      dockerfile: docker/poller-tfl.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/poller-tfl/src/config.rs: Config. No endpoint GAP here,
      # unlike the four RDM pollers — TfL's Unified API is public and
      # documented, so the base URL has a real default.
      TFL_BASE_URL: ${TFL_BASE_URL:-https://api.tfl.gov.uk}
      TFL_APP_KEY: ${TFL_APP_KEY:?TFL_APP_KEY must be set — see api-portal.tfl.gov.uk}
      TFL_MODES: ${TFL_MODES:-tube,dlr,overground,elizabeth-line,tram}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # TfL publishes no recommended cadence and offers no push or
      # conditional requests; 300s mirrors poller-incidents.
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_TFL:-300}
      RUST_LOG: ${RUST_LOG:-info}
      API_INGEST_URL: http://api:8080/private/tfl-line-status

  aggregator:
    build:
      context: .
      dockerfile: docker/aggregator.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/aggregator/src/config.rs: Config
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LINES_DIR: /app/lines
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_AGGREGATOR:-60}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-7}
      RUST_LOG: ${RUST_LOG:-info}

  notifier:
    build:
      context: .
      dockerfile: docker/notifier.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/notifier/src/config.rs: Config. VAPID_PRIVATE_KEY/
      # VAPID_PUBLIC_KEY/VAPID_SUBJECT are required by clap with no
      # default -- unlike api's own VAPID_PUBLIC_KEY above, notifier
      # itself fails fast at startup (crates/notifier/src/main.rs's
      # `ensure!`s) if any of the three is empty, so an unconfigured
      # deployment crash-loops this one service loudly rather than
      # silently sending no pushes. Still defaulted to empty (not `:?`)
      # here so `docker compose up` without VAPID configured doesn't
      # block the REST of the stack from starting.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POLL_INTERVAL_SECS: ${POLL_INTERVAL_SECS_NOTIFIER:-60}
      COOLDOWN_MINUTES: ${COOLDOWN_MINUTES_NOTIFIER:-20}
      TRAIN_DELAY_THRESHOLD_MINUTES: ${TRAIN_DELAY_THRESHOLD_MINUTES_NOTIFIER:-15}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}

  enricher:
    build:
      context: .
      dockerfile: docker/enricher.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # crates/enricher/src/config.rs: Config
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL}
      SWEEP_INTERVAL_SECS: ${SWEEP_INTERVAL_SECS:-3600}
      RUST_LOG: ${RUST_LOG:-info}

  trust-consumer:
    build:
      context: .
      dockerfile: docker/trust-consumer.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # crates/trust-consumer/src/config.rs: Config. GAP: KAFKA_BROKERS,
      # KAFKA_TOPIC, and KAFKA_SASL_MECHANISM are unconfirmed against a
      # live RDM Train Movements catalogue entry -- placeholders until a
      # real subscription resolves them (see local.env.example and this
      # plan's Prerequisites).
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-distant-signal-trust-consumer}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
      # No `:-PLAIN` fallback, deliberately: config.rs gives this field no
      # clap default precisely so a wrong guess can't run silently (RDM's
      # mechanism is still a GAP), and a compose-level default reintroduced
      # exactly that. Same posture as the Helm chart's `fail` guard on
      # trustConsumer.kafka.saslMechanism. Verified both ways by running the
      # binary: with the variable unset clap refuses to start ("the following
      # required arguments were not provided: --kafka-sasl-mechanism"), and
      # with it set empty -- what compose passes through for an unset var --
      # librdkafka refuses at connect ("Invalid value for configuration
      # property \"sasl.mechanisms\""). Either way it stops, loudly.
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM}
      API_INGEST_URL: http://api:8080/private/train-events
      API_TRACKED_TRAINS_URL: http://api:8080/private/tracked-trains
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # Matches docker/trust-consumer.Dockerfile's COPY of reference-data/
      # into the image, same pattern as aggregator's/api's own explicit
      # LINES_DIR: /app/lines above.
      STANOX_CRS_FILE: /app/reference-data/stanox-crs.csv
      REFERENCE_RELOAD_SECS: ${REFERENCE_RELOAD_SECS:-60}
      RETENTION_DAYS: ${RETENTION_DAYS_TRAIN_EVENTS:-90}
      HEALTH_BIND_URL: 0.0.0.0:8081
      RUST_LOG: ${RUST_LOG:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # schedule-sftp + schedule-ingest: the local-dev equivalent of the Helm
  # chart's single Pod with two containers sharing one PVC (see
  # charts/distant-signal/templates/schedulefeed-deployment.yaml). Compose
  # has no native "two containers, one Pod" primitive, so two services
  # sharing one named volume (schedule_feed_data below) is the closest
  # local-dev approximation, not a literal reproduction of that shape.
  # One-shot init step, Compose's closest equivalent to the Helm chart's
  # `fsGroup: 1000` pod-level fix (charts/distant-signal/values.yaml's
  # scheduleFeed.podSecurityContext) -- Compose has no fsGroup mechanism at
  # all, so an explicit chown/chmod step is the only option here.
  # LOAD-BEARING, not optional: drakkan/sftpgo's official image runs as a
  # fixed non-root `USER 1000:1000` (its own Dockerfile) and does NOT chown
  # a freshly created empty named volume for you -- reproduced for real
  # against this exact setup: sftpgo's own attempt to create the DTD
  # account's home_dir on first login failed with a plain OS-level "error
  # creating root directory ... mkdir ...: permission denied", because a
  # fresh Docker named volume is root-owned by default and UID 1000 cannot
  # mkdir under it. `busybox` is used only because it's tiny and does one
  # chown/chmod then exits -- no relation to any other service in this file.
  #
  # `chmod -R g+rwX` (not just `chown`) plus schedule-ingest's own
  # `group_add: ["1000"]` below matters for a second, distinct reason:
  # schedule-ingest's own container runs as its Dockerfile's `poller` user
  # (a `useradd --system`-assigned uid, NOT 1000 -- confirmed different
  # from sftpgo's fixed 1000 by checking docker/schedule-ingest.Dockerfile),
  # and it also needs write access to this same volume (moving files
  # between WATCH_DIR/STORAGE_DIR). Owner-only permissions for uid 1000
  # would fix sftpgo's mkdir but leave schedule-ingest hitting the identical
  # permission-denied error the moment a real delivery arrives -- group-
  # writable plus schedule-ingest joining group 1000 covers both
  # containers, mirroring what Kubernetes' fsGroup does automatically for
  # every container in a Pod (the Helm chart needs no equivalent extra
  # step, since fsGroup already covers `ingest` there too).
  schedule-feed-volume-permissions:
    image: busybox:latest
    command: ["sh", "-c", "chown -R 1000:1000 /data/schedule-feed && chmod -R g+rwX /data/schedule-feed"]
    volumes:
      - schedule_feed_data:/data/schedule-feed
    restart: "no"

  schedule-sftp:
    image: drakkan/sftpgo:latest   # tag pinning is an implementation-time
                                    # decision, not sketched further here
    restart: unless-stopped
    depends_on:
      schedule-feed-volume-permissions:
        condition: service_completed_successfully
    ports:
      - "${SCHEDULE_SFTP_PORT:-2222}:2022"
    volumes:
      - schedule_feed_data:/data/schedule-feed
      - ./schedule-sftp-host-keys:/srv/sftpgo/host_keys:ro
      - ./docker/schedule-sftp-entrypoint.sh:/docker-entrypoint.d/schedule-sftp-entrypoint.sh:ro
    # Overrides the image's own `CMD ["sftpgo", "serve"]` (no ENTRYPOINT is
    # set, so `command:` replaces it outright, matching Compose's default
    # override semantics). The script provisions the real SFTP-login
    # account via SFTPGo's own --loaddata-from mechanism, then execs
    # `sftpgo serve` itself -- see the script for the full mechanism and
    # citations against SFTPGo's real source.
    command: ["/bin/sh", "/docker-entrypoint.d/schedule-sftp-entrypoint.sh"]
    environment:
      SFTPGO_SFTPD__BINDINGS__0__PORT: "2022"
      # This app mints this account, not DTD -- CORRECTED 2026-09-01 from
      # this comment's earlier "never auto-generated, placeholder until
      # DTD's push account details are known" framing, which wrongly
      # treated this like a credential an external system assigns (see
      # charts/distant-signal/templates/schedulefeed-secret.yaml's own
      # corrected comment for the full reasoning, and values.yaml's
      # scheduleFeed.sftp.username/password there for the Helm-side
      # equivalent: a fixed default username, an auto-generated password).
      # Compose has no template-engine equivalent of the Helm chart's
      # randAlphaNum-and-preserve generation, so SCHEDULE_SFTP_PASSWORD
      # just gets a real (arbitrary, low-stakes for local dev) default
      # below instead -- change it before actually giving these details to
      # DTD for a real delivery.
      #
      # CORRECTED 2026-09-01 (this task): SFTPGO_DEFAULT_ADMIN_USERNAME/
      # PASSWORD -- this comment's own earlier guess -- were proven wrong
      # by a real running container's log ("error authenticating user...
      # not found: sql: no rows in result set"): those env vars bootstrap
      # SFTPGo's web-UI/REST-API *admin* account, never an SFTP-login
      # *user* (confirmed against SFTPGo's own Go source -- see
      # docker/schedule-sftp-entrypoint.sh's header comment for the exact
      # source references). SCHEDULE_SFTP_USERNAME/PASSWORD below now feed
      # that script directly (via SFTPGo's real --loaddata-from mechanism)
      # instead of a nonfunctional SFTPGO_DEFAULT_ADMIN_* pair.
      # SCHEDULE_FEED_DESTINATION_PATH (already used by the schedule-ingest
      # service below for WATCH_DIR) is read by the same script to compute
      # this account's home_dir/chroot root, so both sides agree on where
      # files land without a separate variable.
      SCHEDULE_SFTP_USERNAME: ${SCHEDULE_SFTP_USERNAME:-dtd-push}
      SCHEDULE_SFTP_PASSWORD: ${SCHEDULE_SFTP_PASSWORD:-changeme-local-dev-password}
      SCHEDULE_FEED_DESTINATION_PATH: ${SCHEDULE_FEED_DESTINATION_PATH:-incoming}

  schedule-ingest:
    build:
      context: .
      dockerfile: docker/schedule-ingest.Dockerfile
      args:
        CARGO_PROFILE: release
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      schedule-sftp:
        condition: service_started
      schedule-feed-volume-permissions:
        condition: service_completed_successfully
    # Joins group 1000 (this volume's group ownership, set by
    # schedule-feed-volume-permissions above) as a supplementary group,
    # without changing this container's own uid (still Dockerfile's
    # `poller`) -- see that service's comment for why this is needed in
    # addition to the chown/chmod step, not instead of it.
    group_add:
      - "1000"
    environment:
      # crates/schedule-ingest/src/config.rs: Config
      #
      # WATCH_DIR must resolve to DTD's account's landing folder.
      # CORRECTED 2026-09-01 (this task): SCHEDULE_FEED_DESTINATION_PATH is
      # no longer "relative to that account's SFTP home directory" -- the
      # schedule-sftp service's account now has this exact path
      # (/data/schedule-feed/${SCHEDULE_FEED_DESTINATION_PATH}) AS its
      # home_dir/chroot root (see docker/schedule-sftp-entrypoint.sh), so
      # DTD's push client sees itself uploading to "/" once connected, and
      # those uploads land here, at WATCH_DIR, directly -- the same
      # concept as the Helm chart's
      # scheduleFeed.sftp.destinationFolder/folderPath (see
      # charts/distant-signal/templates/_helpers.tpl's
      # distant-signal.scheduleFeedDestinationPath), but collapsed to one
      # value here: Compose's variable interpolation is a single-pass
      # substitution (docker-compose.yml has no template-helper
      # equivalent), and nesting a `${FOLDER_PATH:+/${FOLDER_PATH}}`-style
      # expression inside another substitution is not something this repo
      # can verify works without a real `docker compose config` run in
      # this sandbox -- so the two path segments are combined into one
      # operator-filled value instead of risking that.
      WATCH_DIR: /data/schedule-feed/${SCHEDULE_FEED_DESTINATION_PATH:-incoming}
      STORAGE_DIR: /data/schedule-feed
      CHECK_TIMES: ${SCHEDULE_FEED_CHECK_TIMES:-22:00,22:30,23:00,23:30,00:00,00:30,01:00,01:30,16:00}
      RETENTION_KEEP_SEQUENCES: ${RETENTION_KEEP_SEQUENCES:-2}
      STABILITY_CYCLES: ${SCHEDULE_FEED_STABILITY_CYCLES:-2}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      RUST_LOG: ${RUST_LOG:-info}
      API_INGEST_URL: http://api:8080/private/schedule-feed-ingests
    volumes:
      - schedule_feed_data:/data/schedule-feed

  rail-mcp:
    # Externally-built image -- this repo's own CI does not build the
    # derived MCP service's source (a fork of train-mcp living in its own
    # repository, per
    # docs/superpowers/specs/2026-09-01-train-mcp-integration-design.md
    # Decision 1) -- same shape as schedule-sftp's drakkan/sftpgo entry
    # above, not a `build:` context into this repo. Tag pinning is an
    # implementation-time decision, not sketched further here (same
    # posture schedule-sftp's own comment takes).
    #
    # GATING (fixed 2026-09-02): this service is genuinely opt-in, matching
    # `railMcp.enabled: false` in charts/distant-signal/values.yaml for the
    # exact same component -- unlike every other service in this file, a
    # plain `docker compose --env-file <local|dev>.env up` should NOT try to
    # start it. `profiles: ["rail-mcp"]` is Compose's own mechanism for
    # exactly that: a service tagged with a profile only starts when that
    # profile is explicitly activated (`--profile rail-mcp` or
    # `COMPOSE_PROFILES=rail-mcp`); every other service here carries no
    # `profiles:` key at all, so it stays in the implicit "default" group
    # and is unaffected. This is NOT a revival of the dual prod/dev profile
    # split cb2993b removed (see docker-compose.dev.yml's own comment) --
    # that scheme gave every core service two full copies behind
    # `--profile prod`/`--profile dev`, so a bare `docker compose up`
    # started nothing at all; this is one profile on one add-on service, so
    # a bare `docker compose up` still starts the entire rest of the stack
    # exactly as before, it just no longer also tries (and fails) to pull
    # this one.
    #
    # Without this, plain `docker compose up` unconditionally tried to
    # resolve `image:` below -- and its default value, `CHANGE-ME`, is a
    # deliberately-invalid placeholder repo name (see below), so every
    # `docker compose up` hard-failed with "invalid reference format"
    # before anything else could start. Reproduced and confirmed via this
    # exact failure mode this session.
    profiles: ["rail-mcp"]
    # Deliberately left unresolved, not "fixed": once this service is
    # actually gated behind `--profile rail-mcp`, resolving this image only
    # happens when someone has explicitly opted in -- at that point failing
    # loudly with "invalid reference format" until RAIL_MCP_IMAGE is set to
    # a real image is the desired behaviour (same posture as
    # schedule-sftp's `image:` comment on tag pinning being an
    # implementation-time decision), not a bug to paper over here.
    image: ${RAIL_MCP_IMAGE:-ghcr.io/CHANGE-ME/distant-signal-mcp:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${RAIL_MCP_PORT:-3100}:3000"
    environment:
      # The fork's own src/config.ts: Config.
      PORT: "3000"
      PUBLIC_URL: ${RAIL_MCP_PUBLIC_URL:-http://localhost:3100}
      # In-network hostname every other compose service already uses to
      # reach `api` (see api:'s own BIND_URL / frontend's API_BASE_URL
      # above). resolve_station/GET /public/lines/GET /Line/.../Status
      # remain anonymous DS calls (Decision 4, unchanged) -- see
      # railmcp-deployment.yaml's own updated comment for what this no
      # longer covers now that the adapter auth layer exists.
      DS_API_BASE_URL: http://api:8080
      DS_LINE_CATALOGUE_TTL_MS: ${DS_LINE_CATALOGUE_TTL_MS:-900000}
      # Plain, non-secret config -- an Authentik group name, not a
      # credential (Decision 3 of
      # docs/superpowers/specs/2026-09-02-mcp-server-oauth-access-groups-design.md).
      # Defaults match charts/distant-signal/values.yaml's own
      # railMcp.accessGroups.* defaults.
      MCP_USERS_GROUP: ${RAIL_MCP_USERS_GROUP:-mcp-users}
      MCP_LIVE_BOARDS_GROUP: ${RAIL_MCP_LIVE_BOARDS_GROUP:-mcp-live-boards}
      # The adapter auth layer (embedded-chatbot-shared-foundation-and-
      # option-c plan, Tasks 1-7) -- replaces the DISCORD_CLIENT_ID/
      # DISCORD_ALLOWED_USER_IDS env vars this block used to render here
      # (retired, not kept alongside: that plan's Task 8). Reuses the
      # same `redis` service every other compose service already shares
      # (see api:'s own REDIS_URL above) -- src/oauth/store.ts namespaces
      # its own keys under `railmcp:oauth:` to avoid collision.
      OAUTH_REDIS_URL: redis://redis:6379
      DS_FRONTEND_ORIGIN: ${RAIL_MCP_DS_FRONTEND_ORIGIN:-http://localhost:${FRONTEND_HOST_PORT:-3000}}
      OAUTH_INTERNAL_COMPLETE_TOKEN: ${RAIL_MCP_INTERNAL_COMPLETE_TOKEN}
      # LDBWS/Rail Data Marketplace credentials the fork's board/service-
      # detail tools still call directly (Decision 5 -- unchanged by this
      # integration, board tools are not routed through DS).
      LDBWS_DEPARTURES_URL: ${LDBWS_DEPARTURES_URL}
      LDBWS_DEPARTURES_KEY: ${LDBWS_DEPARTURES_KEY}
      LDBWS_ARRIVALS_URL: ${LDBWS_ARRIVALS_URL}
      LDBWS_ARRIVALS_KEY: ${LDBWS_ARRIVALS_KEY}
      LDBWS_SERVICE_URL: ${LDBWS_SERVICE_URL}
      LDBWS_SERVICE_KEY: ${LDBWS_SERVICE_KEY}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime-prod
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # frontend/lib/api.ts: baseUrl(). Server-side only — resolved
      # inside the docker-compose network, not exposed to the browser.
      API_BASE_URL: http://api:8080
      # frontend/app/connect-claude/{authorize/route.ts,page.tsx} --
      # embedded-chatbot-shared-foundation-and-option-c plan, Tasks 6/9.
      # Harmless to always set, even when the `rail-mcp` service isn't
      # started (it's opt-in behind the `rail-mcp` Compose profile, see
      # that service's own comment above): these are only read at request
      # time, when a request actually reaches /connect-claude, not at
      # frontend boot.
      RAILMCP_BASE_URL: http://rail-mcp:3000
      RAILMCP_INTERNAL_COMPLETE_TOKEN: ${RAIL_MCP_INTERNAL_COMPLETE_TOKEN}
      NEXT_PUBLIC_RAILMCP_PUBLIC_URL: ${RAIL_MCP_PUBLIC_URL:-http://localhost:3100}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"

volumes:
  postgres_data:
  schedule_feed_data:

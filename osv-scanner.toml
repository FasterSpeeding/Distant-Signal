# Time-boxed exceptions for .github/workflows/dependency-scan.yml, for the
# lockfiles in the repo root (Cargo.lock, uv.lock). frontend/ has its own
# osv-scanner.toml. Every entry needs a reason and an ignoreUntil, so the
# finding is reported again at expiry: as a blocking error if it is
# CVSS >= 9.0 with a fixed version by then, otherwise as a non-blocking
# warning (see that workflow's header).

[[IgnoredVulns]]
id = "RUSTSEC-2026-0369"
ignoreUntil = 2026-12-18T00:00:00Z
reason = """\
zip 8.6.0 (GHSA-4684-h2q9-2vcp, Unix permissions applied through symlinks \
by ZipArchive::extract()/ZipStreamReader::extract()). Unreachable: no code in \
this workspace calls extract() or creates symlinks, and the only zip 8 user, \
gtfs-structures 0.50 (via poller-irish-rail-gtfs), only reads entries in \
memory (by_index, name). Our own crates are on zip 9. gtfs-structures still \
requires zip ^8.6; the upstream zip 9 fix is tracked as DS-58 \
(work log). Accepted by the user 2026-10-19; at expiry, bump \
gtfs-structures and `cargo update -p zip` if a release has shipped, \
otherwise review again.\
"""


# Direct-ingest overlay for docker-compose.yml: local dev mirrors production
# (ingest phase 5, Q10; docs/ingest-phase5-runbook.md step 5.3b). OPT-IN,
# never loaded unless you append ":docker-compose.direct.yml" to COMPOSE_FILE
# in your own local.env / dev.env (see the comment beside COMPOSE_FILE in
# either *.env.example):
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.direct.yml
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml:docker-compose.direct.yml
#
# Without it the default path is unchanged: every producer POSTs to the
# api's /private/* routes. With it, nothing calls /private:
#
#   - an `ingest-writer` service (crates/ingest-writer) runs the train-domain
#     loops (INGEST_WRITER_LOOPS) and applies the station-samples,
#     full-coverage, tfl and reference streams, as the chart's
#     `ingestWriter` does in production;
#   - each producer uses the sink production uses, against the local
#     `postgres` and `redis`:
#       db      poller-incidents, poller-stations, trust-consumer,
#               trust-backlog-consumer, schedule-ingest, schedule-reference
#       stream  poller-tocs, poller-tfl, poller-ldbws, full-coverage-consumer
#     and the readers (trust-consumer, full-coverage-consumer, poller-ldbws)
#     read Postgres directly (`*_SOURCE=db`);
#   - the api runs no background loops (API_BACKGROUND_LOOPS=false, the
#     writer owns them, as in production); an `api-maintenance` service runs
#     the api image's `maintenance` pass (expired sessions, dead links,
#     personal-data retention) once an hour, standing in for production's
#     hourly api-maintenance CronJob; and the api answers /private/* with a
#     counted 404 (API_PRIVATE_ROUTES=false, the phase 5 soak setting), so a
#     local caller still on /private shows up in its log and in
#     distant_signal_api_private_route_retired_total.
#
# Everything connects as the local superuser (POSTGRES_USER) and Redis's
# default user. The per-service roles and Redis ACL users the chart demands
# are render-time chart checks, not checks in the binaries; CI's per-role
# suites (scripts/test-postgres-roles.py --mode per-service) cover the
# grants. A superuser also bypasses line_status's row policy for the writer.
#
# The producers still declare the internal OAuth variables as required, so
# docker-compose.yml's INTERNAL_OAUTH_* (and each API_*_URL) stay as they
# are. Nothing uses them in this mode: no token is ever fetched, so
# placeholders are fine. They go with the HTTP paths in phase 5 step 5.3.

x-direct-database-url: &direct-database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  api:
    environment:
      API_BACKGROUND_LOOPS: "false"
      API_PRIVATE_ROUTES: "false"

  # Production's hourly api-maintenance CronJob
  # (templates/api-maintenance-cronjob.yaml), as a loop: one `maintenance`
  # pass at start, then one an hour. A failed pass is logged and retried an
  # hour later, as the CronJob would. Same image as the api (the build is
  # cached), same retention variables and defaults.
  api-maintenance:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        CARGO_PROFILE: ${DIRECT_CARGO_PROFILE:-release}
    restart: unless-stopped
    depends_on:
      # The api migrates at startup locally.
      api:
        condition: service_healthy
    entrypoint: ["/usr/bin/tini", "--", "/bin/sh", "-c"]
    command:
      - |
        while :; do
          /usr/local/bin/maintenance || echo "maintenance pass failed; next try in an hour" >&2
          sleep "$${MAINTENANCE_INTERVAL_SECS}"
        done
    environment:
      # crates/api/src/bin/maintenance.rs
      DATABASE_URL: *direct-database-url
      MAINTENANCE_INTERVAL_SECS: ${MAINTENANCE_INTERVAL_SECS:-3600}
      PAST_TRAVEL_RETENTION_DAYS: ${PAST_TRAVEL_RETENTION_DAYS:-548}
      STALE_PUSH_SUBSCRIPTION_DAYS: ${STALE_PUSH_SUBSCRIPTION_DAYS:-365}
      INACTIVE_ACCOUNT_RETENTION_DAYS: ${INACTIVE_ACCOUNT_RETENTION_DAYS:-0}
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

  ingest-writer:
    build:
      context: .
      dockerfile: docker/ingest-writer.Dockerfile
      args:
        # dev.env.example sets DIRECT_CARGO_PROFILE=debug.
        CARGO_PROFILE: ${DIRECT_CARGO_PROFILE:-release}
    restart: unless-stopped
    depends_on:
      # The api migrates at startup locally (there is no migrate Job); the
      # writer's schema gate waits for it either way.
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No healthcheck: the image has no curl. /healthz and /livez are on
    # port 8090 inside the container.
    environment:
      # crates/ingest-writer/src/config.rs
      DATABASE_URL: *direct-database-url
      REDIS_URL: redis://redis:6379
      INGEST_WRITER_LOOPS: "true"
      INGEST_WRITER_STREAMS: station-samples:apply,full-coverage:apply,tfl:apply,reference:apply
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}

  poller-incidents:
    depends_on:
      ingest-writer:
        condition: service_started
    environment:
      # Writes Postgres and XADDs incident-text-changed itself.
      INGEST_SINK: db
      DATABASE_URL: *direct-database-url
      REDIS_URL: redis://redis:6379

  poller-stations:
    depends_on:
      # The writer's CORPUS crosswalk loop rebuilds after a stations refresh.
      ingest-writer:
        condition: service_started
    environment:
      INGEST_SINK: db
      DATABASE_URL: *direct-database-url

  poller-tocs:
    depends_on:
      ingest-writer:
        condition: service_started
    environment:
      # ds:ingest:reference, applied by the writer.
      INGEST_SINK: stream
      REDIS_URL: redis://redis:6379

  poller-tfl:
    depends_on:
      ingest-writer:
        condition: service_started
    environment:
      # ds:ingest:tfl, applied by the writer.
      INGEST_SINK: stream
      REDIS_URL: redis://redis:6379

  poller-ldbws:
    depends_on:
      ingest-writer:
        condition: service_started
    environment:
      # ds:ingest:station-samples, applied by the writer; its sample
      # stations come from Postgres.
      INGEST_SINK: stream
      REDIS_URL: redis://redis:6379
      SAMPLE_STATIONS_SOURCE: db
      DATABASE_URL: *direct-database-url

  trust-consumer:
    depends_on:
      # Subscription changes reach the api through the writer's
      # train_event_outbox loop.
      ingest-writer:
        condition: service_started
    environment:
      INGEST_SINK: db
      TRACKED_TRAINS_SOURCE: db
      STANOX_CRS_SOURCE: db
      DATABASE_URL: *direct-database-url

  full-coverage-consumer:
    depends_on:
      ingest-writer:
        condition: service_started
    environment:
      # ds:ingest:full-coverage, applied by the writer.
      INGEST_SINK: stream
      POPULATION_SOURCE: db
      STANOX_CRS_SOURCE: db
      DATABASE_URL: *direct-database-url

  trust-backlog-consumer:
    environment:
      INGEST_SINK: db
      DATABASE_URL: *direct-database-url

  schedule-ingest:
    environment:
      # CIF markers and CORPUS loads alike.
      INGEST_SINK: db
      DATABASE_URL: *direct-database-url

  schedule-reference:
    environment:
      INGEST_SINK: db
      DATABASE_URL: *direct-database-url

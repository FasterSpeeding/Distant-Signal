# promtool unit tests for the distant-signal.full-coverage-window group
# (see recorded-alerts.yaml's header for how rules.yaml is rendered; the
# group renders because fullCoverageConsumer.windowedStats.enabled is set).
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  # Window rows are written (XADDed to ds:ingest:full-coverage) every
  # minute until 10m, then none: zero over the 10m window from 20m, firing
  # once that has held for 15m. (DistantSignalFullCoverageWindowPostErrors
  # went with the /private POST in release B, ingest phase 5.)
  - interval: 1m
    input_series:
      - series: 'distant_signal_full_coverage_consumer_window_rows_posted_total{namespace="distant-signal", pod="fcc"}'
        values: '0+40x10 400x50'
    alert_rule_test:
      - eval_time: 25m
        alertname: DistantSignalFullCoverageWindowStatsStalled
        exp_alerts: []
      - eval_time: 40m
        alertname: DistantSignalFullCoverageWindowStatsStalled
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal}
            exp_annotations:
              summary: no full-coverage window rows written
              description: "None over 10m for 15m: a stuck replay, a population that never loaded, or failing stream writes."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalfullcoveragewindowstatsstalled

# promtool unit tests for the transit networks' alerts (see
# recorded-alerts.yaml's header for how rules.yaml is rendered; the
# metrolink network is on there). DistantSignalTransitFeedRefused: any
# refusal in 26h; DistantSignalTransitUnmappedLineRef: any unmapped
# LineRef in 1h. No `for`.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  # One sharp_drop refusal at minute 10; nothing else.
  - interval: 1m
    input_series:
      - series: 'distant_signal_transit_feed_refused_total{namespace="distant-signal", pod="p", network="metrolink", reason="sharp_drop"}'
        values: '0x10 1x50'
      - series: 'distant_signal_transit_feed_refused_total{namespace="distant-signal", pod="p", network="metrolink", reason="empty"}'
        values: '0x60'
    alert_rule_test:
      - eval_time: 5m
        alertname: DistantSignalTransitFeedRefused
        exp_alerts: []
      - eval_time: 30m
        alertname: DistantSignalTransitFeedRefused
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, network: metrolink, reason: sharp_drop}
            exp_annotations:
              summary: metrolink timetable refused (sharp_drop)
              description: "In the last 26h. The previous timetable stays active. Check the producer's log."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignaltransitfeedrefused
  # An unmapped ref seen at minute 5 alerts until it leaves the 1h window.
  - interval: 1m
    input_series:
      - series: 'distant_signal_transit_situation_unmapped_line_refs_total{namespace="distant-signal", pod="p", network="metrolink", ref="ORANGE"}'
        values: '0x5 2x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: DistantSignalTransitUnmappedLineRef
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, network: metrolink, ref: ORANGE}
            exp_annotations:
              summary: "metrolink unknown disruption line ORANGE"
              description: "In the last 1h. Its disruptions show on no line until the network file has the alias."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignaltransitunmappedlineref
      - eval_time: 110m
        alertname: DistantSignalTransitUnmappedLineRef
        exp_alerts: []

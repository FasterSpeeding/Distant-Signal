# promtool unit tests for the alerts that read a recording rule
# (scripts/check-alert-payloads.py renders the chart, every alert on, as
# release `distant-signal` in namespace `distant-signal`, into rules.yaml).
# Each case is what the alert's former inline expression fired on.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  # Lag + pending over the MAXLEN cap (the relay's gauge, 1000 here).
  - interval: 1m
    input_series:
      - series: 'distant_signal_movement_relay_stream_maxlen{namespace="distant-signal", pod="relay"}'
        values: '1000x30'
      - series: 'distant_signal_movement_relay_stream_lag{namespace="distant-signal", pod="relay", group="trust-consumer"}'
        values: '100x30'
      - series: 'distant_signal_movement_relay_stream_pending{namespace="distant-signal", pod="relay", group="trust-consumer"}'
        values: '200x30'
      # No pending series: counts as 0.
      - series: 'distant_signal_movement_relay_stream_lag{namespace="distant-signal", pod="relay", group="trust-backlog-consumer"}'
        values: '600x30'
      - series: 'distant_signal_movement_relay_stream_lag{namespace="distant-signal", pod="relay", group="full-coverage-consumer"}'
        values: '100x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: DistantSignalMovementLagHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: DistantSignalMovementLagHigh
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, group: trust-consumer}
            exp_annotations:
              summary: trust-consumer is 30% of the movement-events cap behind
              description: "Unread plus un-ACKed entries are over 0.25 of MAXLEN; at the cap they are trimmed unread. Check the consumer and api."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalmovementlaghigh
          - exp_labels: {severity: warning, namespace: distant-signal, group: trust-backlog-consumer}
            exp_annotations:
              summary: trust-backlog-consumer is 60% of the movement-events cap behind
              description: "Unread plus un-ACKed entries are over 0.25 of MAXLEN; at the cap they are trimmed unread. Check the consumer and api."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalmovementlaghigh
      - eval_time: 15m
        alertname: DistantSignalMovementLagCritical
        exp_alerts:
          - exp_labels: {severity: critical, namespace: distant-signal, group: trust-backlog-consumer}
            exp_annotations:
              summary: trust-backlog-consumer is 60% of the movement-events cap behind
              description: "Over 0.5 of MAXLEN: a stream gap (data loss) is close. Fix the consumer, or raise streamMaxLen and Redis maxmemory."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalmovementlagcritical

  # Without the relay's maxlen gauge, movementRelay.streamMaxLen (1048576)
  # stands in.
  - interval: 1m
    input_series:
      - series: 'distant_signal_movement_relay_stream_lag{namespace="distant-signal", pod="relay", group="trust-consumer"}'
        values: '600000x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: DistantSignalMovementLagCritical
        exp_alerts:
          - exp_labels: {severity: critical, namespace: distant-signal, group: trust-consumer}
            exp_annotations:
              summary: trust-consumer is 57.22% of the movement-events cap behind
              description: "Over 0.5 of MAXLEN: a stream gap (data loss) is close. Fix the consumer, or raise streamMaxLen and Redis maxmemory."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalmovementlagcritical

  # Lag rising 300 entries a minute: past 5000 net over 30m, then 10m `for`.
  - interval: 1m
    input_series:
      - series: 'distant_signal_movement_relay_stream_lag{namespace="distant-signal", pod="relay", group="trust-consumer"}'
        values: '0+300x60'
      - series: 'distant_signal_movement_relay_stream_lag{namespace="distant-signal", pod="relay", group="full-coverage-consumer"}'
        values: '0+100x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: DistantSignalMovementLagGrowing
        exp_alerts: []
      - eval_time: 45m
        alertname: DistantSignalMovementLagGrowing
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, group: trust-consumer}
            exp_annotations:
              summary: trust-consumer movement-events lag keeps growing
              description: "Lag rose over 5000 entries net in 30m: the group consumes slower than movement-relay publishes."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalmovementlaggrowing

  # A stream gap, a recreated group (consumer and relay), parse drops.
  - interval: 1m
    input_series:
      - series: 'distant_signal_trust_consumer_stream_gap_detected_total{namespace="distant-signal", pod="tc"}'
        values: '0x20 1x20'
      - series: 'distant_signal_full_coverage_consumer_stream_gap_detected_total{namespace="distant-signal", pod="fcc"}'
        values: '0x40'
      - series: 'distant_signal_trust_backlog_consumer_stream_gap_detected_total{namespace="distant-signal", pod="tbc"}'
        values: '0x40'
      - series: 'distant_signal_movement_feed_group_recreated_total{namespace="distant-signal", pod="fcc", group="full-coverage-consumer"}'
        values: '0x20 1x20'
      - series: 'distant_signal_movement_relay_stream_created_total{namespace="distant-signal", pod="relay"}'
        values: '0x20 1x20'
      - series: 'distant_signal_trust_consumer_errors_total{namespace="distant-signal", pod="tc", operation="parse_envelope", msg_type="0003"}'
        values: '0x20 2x20'
      - series: 'distant_signal_trust_backlog_consumer_errors_total{namespace="distant-signal", pod="tbc", operation="parse_envelope", msg_type="0001"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 15m
        alertname: DistantSignalStreamGap
        exp_alerts: []
      - eval_time: 25m
        alertname: DistantSignalStreamGap
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, consumer: trust_consumer}
            exp_annotations:
              summary: trust_consumer lost movement-events entries (stream gap)
              description: "Entries were trimmed before it read them in the last 1h. Treat that rail day's derived data as partial."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalstreamgap
      - eval_time: 25m
        alertname: DistantSignalMovementGroupRecreated
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, group: full-coverage-consumer}
            exp_annotations:
              summary: movement-events group full-coverage-consumer was recreated
              description: "Its group went missing (NOGROUP) in the last 1h: Redis lost data or it was deleted. Treat that rail day as partial."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalmovementgrouprecreated
          - exp_labels: {severity: warning, namespace: distant-signal, group: (all)}
            exp_annotations:
              summary: movement-events group (all) was recreated
              description: "Its group went missing (NOGROUP) in the last 1h: Redis lost data or it was deleted. Treat that rail day as partial."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalmovementgrouprecreated
      - eval_time: 25m
        alertname: DistantSignalTrustEnvelopeParseDrops
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, consumer: trust-consumer, msg_type: "0003"}
            exp_annotations:
              summary: trust-consumer dropped bad TRUST 0003 envelopes
              description: "2 in 1h did not match the known shape. A steady rate means the feed's schema changed."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignaltrustenvelopeparsedrops

  # movement-relay: every XADD failing and nothing published, including a
  # relay that restarted into the failure (no published series at all).
  - interval: 1m
    input_series:
      - series: 'distant_signal_movement_relay_errors_total{namespace="distant-signal", pod="relay", operation="publish_event"}'
        values: '0x10 0+5x30'
      - series: 'distant_signal_movement_relay_events_published_total{namespace="distant-signal", pod="relay"}'
        values: '0+100x10 1000x30'
    alert_rule_test:
      - eval_time: 18m
        alertname: DistantSignalMovementRelayPublishFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: DistantSignalMovementRelayPublishFailing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: distant-signal}
            exp_annotations:
              summary: movement-relay cannot publish to movement-events
              description: "Every XADD failed for 10m: TRUST ingestion is stopped. Check Redis (OOM, AOF, auth) and the relay's logs."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalmovementrelaypublishfailing
  - interval: 1m
    input_series:
      - series: 'distant_signal_movement_relay_errors_total{namespace="distant-signal", pod="relay2", operation="redis_oom"}'
        values: '0+5x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: DistantSignalMovementRelayPublishFailing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: distant-signal}
            exp_annotations:
              summary: movement-relay cannot publish to movement-events
              description: "Every XADD failed for 10m: TRUST ingestion is stopped. Check Redis (OOM, AOF, auth) and the relay's logs."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalmovementrelaypublishfailing

  # Redis AOF: a failed rewrite fires; all-ok does not.
  - interval: 1m
    input_series:
      - series: 'distant_signal_redis_aof_last_write_ok{namespace="distant-signal", pod="relay"}'
        values: '1x20'
      - series: 'distant_signal_redis_aof_last_bgrewrite_ok{namespace="distant-signal", pod="relay"}'
        values: '1x5 0x15'
      - series: 'distant_signal_redis_aof_enabled{namespace="distant-signal", pod="relay"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: DistantSignalRedisPersistenceFailing
        exp_alerts: []
      - eval_time: 12m
        alertname: DistantSignalRedisPersistenceFailing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: distant-signal}
            exp_annotations:
              summary: Redis AOF persistence is failing
              description: "A failed AOF write makes Redis refuse writes, a failed rewrite fills the disk, and AOF off loses the streams on restart."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalredispersistencefailing
  - interval: 1m
    input_series:
      - series: 'distant_signal_redis_aof_last_write_ok{namespace="distant-signal", pod="relay"}'
        values: '1x20'
      - series: 'distant_signal_redis_aof_last_bgrewrite_ok{namespace="distant-signal", pod="relay"}'
        values: '1x20'
      - series: 'distant_signal_redis_aof_enabled{namespace="distant-signal", pod="relay"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: DistantSignalRedisPersistenceFailing
        exp_alerts:
          - exp_labels: {severity: critical, namespace: distant-signal}
            exp_annotations:
              summary: Redis AOF persistence is failing
              description: "A failed AOF write makes Redis refuse writes, a failed rewrite fills the disk, and AOF off loses the streams on restart."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalredispersistencefailing

  # Enricher: over half failing with at least 3 failures, for 15m.
  - interval: 1m
    input_series:
      - series: 'distant_signal_enricher_llm_call_total{namespace="distant-signal", pod="enr", call="summarise", outcome="success"}'
        values: '0+1x60'
      - series: 'distant_signal_enricher_llm_call_total{namespace="distant-signal", pod="enr", call="summarise", outcome="error"}'
        values: '0+2x60'
      - series: 'distant_signal_enricher_llm_call_total{namespace="distant-signal", pod="enr", call="classify", outcome="success"}'
        values: '0+5x60'
      - series: 'distant_signal_enricher_llm_call_total{namespace="distant-signal", pod="enr", call="classify", outcome="error"}'
        values: '0+1x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: DistantSignalEnricherErrors
        exp_alerts: []
      - eval_time: 30m
        alertname: DistantSignalEnricherErrors
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, call: summarise}
            exp_annotations:
              summary: enricher LLM summarise calls failing (66.67%)
              description: "Over 0.5 of calls failed in 30m (at least 3). Check enricher.llm.baseUrl and enricher's logs."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalenrichererrors

  # Container memory over 0.8 of its limit for 10m; pods outside this
  # release are ignored.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{namespace="distant-signal", pod="distant-signal-api-7f9-x", container="api"}'
        values: '900x20'
      - series: 'kube_pod_container_resource_limits{namespace="distant-signal", pod="distant-signal-api-7f9-x", container="api", resource="memory"}'
        values: '1000x20'
      - series: 'container_memory_working_set_bytes{namespace="distant-signal", pod="other-0", container="x"}'
        values: '990x20'
      - series: 'kube_pod_container_resource_limits{namespace="distant-signal", pod="other-0", container="x", resource="memory"}'
        values: '1000x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: DistantSignalComponentMemoryHigh
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, pod: distant-signal-api-7f9-x, container: api}
            exp_annotations:
              summary: distant-signal-api-7f9-x/api at 90% of memory limit
              description: "Over 0.8 of its memory limit for 10m: at risk of an OOMKill. Raise resources.limits.memory or find the growth."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalcomponentmemoryhigh

  # pgBackRest: a recent failed check Job and a failed full backup Job; an
  # old failed check Job (started over 26h ago) is ignored.
  - interval: 1h
    input_series:
      - series: 'kube_job_failed{namespace="distant-signal", job_name="distant-signal-pgbackrest-check-29000000", condition="true"}'
        values: '1x30'
      - series: 'kube_job_status_start_time{namespace="distant-signal", job_name="distant-signal-pgbackrest-check-29000000"}'
        values: '0x30'
      - series: 'kube_job_failed{namespace="distant-signal", job_name="distant-signal-pgbackrest-full-29000001", condition="true"}'
        values: '1x30'
      - series: 'kube_job_status_start_time{namespace="distant-signal", job_name="distant-signal-pgbackrest-full-29000001"}'
        values: '3600x30'
    alert_rule_test:
      - eval_time: 2h
        alertname: DistantSignalPgBackRestCheckFailed
        exp_alerts:
          - exp_labels: {severity: critical, namespace: distant-signal, job_name: distant-signal-pgbackrest-check-29000000}
            exp_annotations:
              summary: pgBackRest check or verify failed (distant-signal-pgbackrest-check-29000000)
              description: "WAL archiving is broken, verify found a bad file, or WAL is missing (a PITR gap). The Job's log says which."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalpgbackrestcheckfailed
      - eval_time: 2h
        alertname: DistantSignalPgBackRestBackupFailed
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, job_name: distant-signal-pgbackrest-full-29000001}
            exp_annotations:
              summary: pgBackRest backup failed (distant-signal-pgbackrest-full-29000001)
              description: "The restore window keeps growing from the last good backup. WAL archiving is separate and may still work."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalpgbackrestbackupfailed
      - eval_time: 26h
        alertname: DistantSignalPgBackRestCheckFailed
        exp_alerts: []

# promtool unit tests for DistantSignalSchedulePublishStagedMismatch (see
# recorded-alerts.yaml's header for how rules.yaml is rendered):
# schedule-reference's db sink's `store_` counter (ingest plan 2a.5). Since
# release D (ingest phase 5, Q1) the api's old `api_` name is not read.
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  # An old api_ series counting a mismatch is not read (release D): quiet.
  - interval: 1m
    input_series:
      - series: 'distant_signal_api_schedule_publish_staged_mismatch_total{namespace="distant-signal", pod="api", product="schedule_calling_points_full"}'
        values: '0x5 1x10'
      - series: 'distant_signal_store_schedule_publish_staged_mismatch_total{namespace="distant-signal", pod="sf", product="schedule_calling_points_full"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: DistantSignalSchedulePublishStagedMismatch
        exp_alerts: []
  # The db sink counts one: fires at once (`for: 0m`).
  - interval: 1m
    input_series:
      - series: 'distant_signal_store_schedule_publish_staged_mismatch_total{namespace="distant-signal", pod="sf", product="schedule_destination_departures"}'
        values: '0x5 1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: DistantSignalSchedulePublishStagedMismatch
        exp_alerts: []
      - eval_time: 10m
        alertname: DistantSignalSchedulePublishStagedMismatch
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, product: schedule_destination_departures}
            exp_annotations:
              summary: schedule_destination_departures publish kept stale rows
              description: "Its staged key count did not match the publisher's total, so rows it left out stay until the next complete publish."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalschedulepublishstagedmismatch
  # A larger count: fires.
  - interval: 1m
    input_series:
      - series: 'distant_signal_store_schedule_publish_staged_mismatch_total{namespace="distant-signal", pod="sf", product="schedule_destination_departures"}'
        values: '0x5 2x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: DistantSignalSchedulePublishStagedMismatch
        exp_alerts:
          - exp_labels: {severity: warning, namespace: distant-signal, product: schedule_destination_departures}
            exp_annotations:
              summary: schedule_destination_departures publish kept stale rows
              description: "Its staged key count did not match the publisher's total, so rows it left out stay until the next complete publish."
              runbook_url: https://github.com/FasterSpeeding/Distant-Signal/blob/main/docs/alerts.md#distantsignalschedulepublishstagedmismatch
  # At 0, or another namespace's mismatch: never fires.
  - interval: 1m
    input_series:
      - series: 'distant_signal_store_schedule_publish_staged_mismatch_total{namespace="distant-signal", pod="sf", product="schedule_calling_points_full"}'
        values: '0x15'
      - series: 'distant_signal_store_schedule_publish_staged_mismatch_total{namespace="other", pod="sf", product="schedule_calling_points_full"}'
        values: '0x5 1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: DistantSignalSchedulePublishStagedMismatch
        exp_alerts: []

name: Containers

# Build (and, on push to main/master, publish) all 14 container images this
# repo defines: the 13 Rust service Dockerfiles under docker/, and
# frontend/Dockerfile's `runtime-prod` target. This is the "main aim"
# CI/CD job per the repo owner's request.
#
# Why this is a hand-rolled matrix job rather than a call into
# FasterSpeeding/Piped's own `build-container.yml` reusable workflow --
# read before changing this file:
#
# Piped's build-container.yml (buildah/podman, multi-arch via a job
# matrix, cosign-signs on push, defaults to ghcr.io) is a genuine, clean,
# self-contained `workflow_call` workflow -- it doesn't depend on the
# justfile/mise submodule convention the way rustfmt.yml/lint.yml do. It
# was seriously considered and is a good fit for a *single-image* repo.
# It does not cleanly fit *this* repo's shape, for two concrete reasons
# confirmed by reading its source (raw.githubusercontent.com/.../
# build-container.yml, and redhat-actions/buildah-build's action.yml):
#
#   1. No build-stage `target` input. buildah-build (which it wraps) has
#      no `target` field at all, and build-container.yml doesn't expose
#      one either. frontend/Dockerfile's *last* stage is `runtime-dev`
#      (ships full source + `next dev`) -- the real image this repo wants
#      is the earlier `runtime-prod` stage, which is unreachable without a
#      `--target` flag. Building frontend/Dockerfile through this
#      reusable workflow as-is would silently publish the dev image.
#
#   2. Artifact-name collision under multi-image reuse. The `build` job
#      uploads each per-architecture image as artifact
#      `container-build-<arch>-<uuid>`, and the `push` job downloads by
#      the *unscoped* glob pattern `container-build-*` (not namespaced by
#      image-name/inputs). Artifacts are scoped to the whole workflow
#      *run*, not to one reusable-workflow invocation, so calling this
#      workflow N times in one run (e.g. from a matrix of 9-10 services)
#      would have every service's `push` job also pick up every other
#      service's in-flight artifacts and merge them into its own
#      manifest. Confirmed by reading the workflow's own artifact
#      upload/download steps; not something that shows up for Piped's own
#      (single-image) consumers, which is presumably why it hasn't come
#      up before. Splitting into one caller workflow file per service
#      would dodge this (separate runs -> separate artifact scopes) but
#      trades one file for ten near-duplicates.
#
# UPSTREAM SUGGESTION (for FasterSpeeding/Piped, which the repo owner also
# owns): build-container.yml would become usable for monorepos like this
# one with two changes -- (a) an optional `target` input threaded into the
# buildah-build step (or documented as unsupported upstream in
# buildah-build itself), and (b) namespacing the upload/download artifact
# name and pattern with the resolved `image-name` (or a new `artifact-key`
# input) so parallel/matrixed calls in one run don't collide. Until that
# lands, this repo uses its own matrix job below.
#
# This job is instead modelled closely on how FasterSpeeding's own
# Cursed-Solutions/Reinhard repo hand-rolls its container publish
# (.github/workflows/docker-publish.yml there): docker/setup-buildx-action
# + docker/login-action + docker/metadata-action + docker/build-push-action
# + sigstore/cosign-installer, gated the same way (build on every PR as a
# sanity check, push+sign only outside pull_request) -- just parameterised
# over a matrix of all 10 images instead of one. Reinhard does not call
# Piped's build-container.yml either, for what it's worth.
#
# Registry & naming: ghcr.io/fasterspeeding/distant-signal/<service>.
# ghcr.io matches both Piped's own default registry and Reinhard's
# hand-rolled default. `distant-signal/<service>` (rather than
# `network-rail-status/<service>`) matches this repo's OWN existing
# convention: charts/distant-signal/values.yaml already sets every
# workload's `image.repository` to `distant-signal/<service>` (see e.g.
# `api.image.repository: distant-signal/api`), and the chart's README
# ("Building and pushing the images (manual)") documents the exact same
# per-Dockerfile -> `distant-signal/<service>` mapping used in this
# file's matrix. Publishing under that path means someone can point the
# chart at the published images with nothing more than
# `--set global.imageRegistry=ghcr.io/fasterspeeding` (or per-service
# `image.repository` overrides prefixed with the registry).
#
# Tagging: docker/metadata-action's own bare defaults are actually just
# `type=schedule` + `type=ref,event={branch,tag,pr}` -- confirmed against
# the action's README, and against this registry's own real package
# history (`gh api /users/fasterspeeding/packages/container/distant-signal
# %2Fapi/versions`), which before this change showed every build landing
# on a *single* mutable tag equal to the branch name (`main`), silently
# overwritten on every push, and nothing else -- no sha tag, no `latest`
# (that needs an explicit `flavor`/`type=raw` rule or a tag/semver event,
# neither of which this repo has). An older version of this comment
# claimed a `sha` tag was already part of the defaults; it wasn't -- that
# was wrong, which is exactly why `push-helm-chart` below (see its own
# comment) had nothing reliable to pin the chart's default image tag to.
#
# `type=sha` is now added explicitly (below, in the `meta` step) on top
# of that same default set, purely so every image also gets a second,
# immutable `sha-<short-sha>` tag alongside the existing mutable branch
# tag -- this is the one piece `push-helm-chart` needs to make the
# chart's packaged `appVersion` (and therefore every workload's default
# `image.tag`) point at the *exact* images this run just built, not
# whatever `main` happens to resolve to by the time someone installs the
# chart. `git tag` shows no tags exist in this repo yet, so no semver
# pattern is configured; add `type=semver,pattern={{version}}` here
# if/when release tags start.
#
# The `push-helm-chart` job below packages and pushes
# charts/distant-signal to this same ghcr.io org's OCI registry (as an
# OCI artifact, via `helm push`, not a container image) once every image
# above has built and pushed successfully -- see that job's own comment
# for the `needs:`/versioning rationale.

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, master, dev]
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/fasterspeeding/distant-signal

jobs:
  build-and-push:
    name: ${{ matrix.service }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # required for cosign's keyless/OIDC signing

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: docker/api.Dockerfile
            target: ""
          - service: aggregator
            dockerfile: docker/aggregator.Dockerfile
            target: ""
          - service: enricher
            dockerfile: docker/enricher.Dockerfile
            target: ""
          - service: notifier
            dockerfile: docker/notifier.Dockerfile
            target: ""
          - service: poller-incidents
            dockerfile: docker/poller-incidents.Dockerfile
            target: ""
          - service: poller-stations
            dockerfile: docker/poller-stations.Dockerfile
            target: ""
          - service: poller-tocs
            dockerfile: docker/poller-tocs.Dockerfile
            target: ""
          - service: poller-ldbws
            dockerfile: docker/poller-ldbws.Dockerfile
            target: ""
          - service: poller-tfl
            dockerfile: docker/poller-tfl.Dockerfile
            target: ""
          - service: poller-irish-rail-gtfs
            dockerfile: docker/poller-irish-rail-gtfs.Dockerfile
            target: ""
          - service: poller-irish-rail-live
            dockerfile: docker/poller-irish-rail-live.Dockerfile
            target: ""
          - service: poller-nir-stations
            dockerfile: docker/poller-nir-stations.Dockerfile
            target: ""
          - service: trust-consumer
            dockerfile: docker/trust-consumer.Dockerfile
            target: ""
          - service: full-coverage-consumer
            dockerfile: docker/full-coverage-consumer.Dockerfile
            target: ""
          - service: trust-backlog-consumer
            dockerfile: docker/trust-backlog-consumer.Dockerfile
            target: ""
          - service: movement-relay
            dockerfile: docker/movement-relay.Dockerfile
            target: ""
          - service: schedule-ingest
            dockerfile: docker/schedule-ingest.Dockerfile
            target: ""
          - service: schedule-reference
            dockerfile: docker/schedule-reference.Dockerfile
            target: ""
          # The only image needing an explicit target: frontend/Dockerfile's
          # last stage is `runtime-dev`; the image this repo wants published
          # is the earlier `runtime-prod` stage (optimized `next build` +
          # `next start`), same as charts/distant-signal/README.md's manual
          # `docker build --target runtime-prod` example.
          - service: frontend
            dockerfile: frontend/Dockerfile
            target: runtime-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      # Skipped on pull_request: forked/external PRs don't get a
      # packages:write GITHUB_TOKEN, and there's nothing to push anyway
      # since this run only builds as a sanity check.
      - name: Log into ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Explicit `tags:` here reproduces the action's own bare defaults
      # (schedule/branch/tag/pr -- see this file's top-of-file "Tagging"
      # comment) and adds `type=sha` on top, so every image also gets an
      # immutable `sha-<short-sha>` tag that `push-helm-chart` can pin the
      # chart's default `appVersion`/image references to.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_BASE }}/${{ matrix.service }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      # Build on every trigger (including PRs, as a build-sanity check);
      # push+cache only outside pull_request. Mirrors Piped's own
      # build-container.yml push gating and Reinhard's hand-rolled
      # docker-publish.yml.
      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless/OIDC signing via sigstore's public Fulcio/Rekor instances,
      # same approach Piped's build-container.yml and Reinhard's
      # docker-publish.yml both use.
      - name: Sign the published image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  # Package and push the Helm chart to ghcr.io, once every image in the
  # matrix above has built and pushed successfully.
  #
  # `needs: build-and-push` on a matrix job waits for every combination in
  # the matrix, not just one -- so this only starts after all 19 images
  # are confirmed built (and, outside pull_request, pushed). A chart push
  # referencing a half-finished or partially-failed image matrix would be
  # worse than not pushing at all, so `fail-fast: false` above combined
  # with this plain `needs:` is deliberate: if any one image fails,
  # build-and-push's own overall conclusion is failure and this job is
  # skipped, same as any other `needs:` dependent job.
  #
  # Gated by the same `github.event_name != 'pull_request'` condition as
  # the image push itself, for the same reason: PRs (including forked
  # ones) don't get a packages:write GITHUB_TOKEN, and there is nothing
  # worth publishing from an unmerged PR anyway.
  #
  # Registry & auth: ghcr.io, the same registry (and GITHUB_TOKEN --
  # already scoped packages:write below, no separate secret needed) the
  # container images above already use. GHCR is a normal, properly-TLS'd
  # public-CA registry, so unlike a self-hosted/HTTP-only registry this
  # needs no `--insecure`/`http`-style Helm or BuildKit configuration --
  # `helm registry login` here is the standard GHCR-via-GitHub-Actions
  # pattern.
  #
  # Path: pushed under ghcr.io/fasterspeeding/charts/distant-signal (i.e.
  # `helm push ... oci://ghcr.io/fasterspeeding/charts`, which appends the
  # chart's own name from Chart.yaml) -- a `charts/` sibling of
  # IMAGE_BASE's own `distant-signal/<service>` image paths under the same
  # `fasterspeeding` org, rather than nested inside `distant-signal/`
  # itself, so the packaged chart doesn't read as one more "service"
  # alongside api/aggregator/frontend/etc.
  #
  # Versioning -- rewritten from this job's original version, which just
  # pushed whatever `version:`/`appVersion:` were statically set in
  # Chart.yaml. That had two real bugs, confirmed against this registry's
  # actual package history before this change:
  #
  #   1. `helm push`'s destination tag is `Chart.yaml`'s `version:`
  #      field, bumped manually and "for chart-only changes" only (see
  #      git log on that file: 0.2.0, 0.2.2, ... one bump per chart-only
  #      change). But this job runs on *every* push to main, chart files
  #      touched or not. So a push that only changes application code
  #      re-pushes the exact same version string -- `gh api .../packages/
  #      container/charts%2Fdistant-signal/versions` showed exactly one
  #      version (`0.2.2`) ever recorded in the registry despite many
  #      pushes, i.e. every one of those pushes silently overwrote that
  #      same immutable-looking OCI tag in place.
  #   2. Worse, `appVersion:` (which `_helpers.tpl`'s `distant-signal.
  #      image` helper uses as the DEFAULT `image.tag` for every workload)
  #      was equally static, manually tracking crates/api/Cargo.toml's
  #      version. So even a chart-only bump that *did* produce a new
  #      pushed chart version still pointed every workload's default
  #      image reference at whatever `appVersion` was last hand-set to --
  #      not the images this run just built and pushed above.
  #
  # Schemes considered for fixing both:
  #
  #   - CalVer (e.g. `2026.9.23[+<short-sha>]`). Readable at a glance, but
  #     this chart has already published real `0.2.x` SemVer releases
  #     (see git log above) -- switching format now means mixing two
  #     incompatible version eras in the same OCI tag list, and breaks
  #     the ordering/pinning expectations of anyone who already pulled a
  #     `0.2.x` tag. Rejected: the compatibility cost outweighs the
  #     readability gain for a chart that isn't starting from zero.
  #   - CI bumps Chart.yaml's `version:` itself and commits it back to
  #     main. Gives clean, strictly-ordered SemVer with no build-metadata
  #     ambiguity, but no workflow in this repo commits back to main
  #     today -- this would be a first, and a real one: it needs a
  #     `[skip ci]`-style guard or a bot identity/PAT distinct from
  #     GITHUB_TOKEN (whose commits don't retrigger `on: push`, by GitHub
  #     design) to avoid `push-helm-chart`'s own commit re-triggering
  #     this same workflow in a loop. Rejected as disproportionate: it
  #     solves problem 1 but does nothing for problem 2 (appVersion) on
  #     its own, and the bot-commit machinery is a bigger, riskier change
  #     than either problem actually calls for.
  #   - Plain SemVer + build metadata, e.g. `0.2.2+sha.<short-sha>`,
  #     replacing Chart.yaml's version wholesale at package time. Valid
  #     SemVer 2, immutable per-commit tag, no bot-commit needed -- close
  #     to what's chosen below, but rejected in this exact form because
  #     build-metadata is explicitly ignored for precedence by semver-
  #     aware tooling (two tags differing only in `+sha.*` compare as
  #     EQUAL precedence), and a bare commit SHA has no inherent temporal
  #     order -- given two such tags side by side, neither a human nor a
  #     semver-sorting tool can tell which one is newer without cross-
  #     referencing git history. That gap is exactly what the chosen
  #     scheme below closes.
  #
  # Chosen: a hybrid. Chart.yaml's `version:` field keeps its existing
  # meaning and discipline completely unchanged -- a human still bumps it
  # manually, only for chart-schema/template/values changes, exactly as
  # documented in that file's own comment and git history. This job reads
  # that field as a BASE and appends CI-computed build metadata to it on
  # every run, valid or not: `<base>+build.<run_number>.sha.<short_sha>`.
  # `run_number` is monotonically increasing per-workflow (GitHub-assigned,
  # never reused), so unlike a bare sha suffix, two of this chart's tags
  # CAN be told apart at a glance or by plain string/lexicographic-ish
  # comparison of the run-number segment -- solving the ordering gap the
  # plain-sha scheme above had, while `sha.<short_sha>` still ties the
  # build back to the exact commit for traceability. This is still valid
  # SemVer 2 build metadata (dot-separated alphanumeric identifiers), so
  # `helm package --version` happily accepts it, and it's a pure additive
  # suffix -- Chart.yaml on its own (e.g. packaged locally, outside CI)
  # still resolves to a perfectly valid bare version with no CI step
  # required. Example: base `0.2.2` + this run -> `0.2.2+build.42.sha.
  # 860c190`. This directly fixes bug 1: chart-file changes or not, every
  # push mints a new, distinguishable, immutable OCI tag.
  #
  # For bug 2, `appVersion` is packaged as `sha-<short_sha>` -- the SAME
  # short SHA, in the SAME `sha-<short>` format docker/metadata-action's
  # own `type=sha` tag rule (added to the `meta` step above) mints for
  # every one of the 19 images this job's `needs:` just confirmed were
  # built and pushed from this exact commit. That means the packaged
  # chart's default `image.tag` (via `distant-signal.image` in
  # _helpers.tpl) resolves to a real, already-pushed, immutable tag that
  # is guaranteed to exist, because it's the same tag every image in the
  # matrix above was just tagged with. `short_sha` here is derived as a
  # plain 7-character prefix of `$GITHUB_SHA` (a default Actions env var,
  # no `${{ }}` interpolated directly into the shell script) -- the same
  # length and derivation docker/metadata-action's `type=sha` uses by
  # default, so the two are guaranteed to match without needing to plumb
  # an output through the matrix job.
  #
  # Chart.yaml's own `appVersion:` field is left as a human-managed
  # local-dev fallback only (see that file's own updated comment) -- it's
  # unconditionally overridden here, so it no longer needs to track
  # anything CI-relevant, just to remain a sane default for someone
  # running `helm package`/`helm template` straight from a checkout.
  push-helm-chart:
    name: Package and push Helm chart
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same action and pinned Helm version as ci.yml's `helm-lint` job,
      # for consistency rather than introducing a second Helm setup/
      # version into this repo's CI.
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Log into ${{ env.REGISTRY }} (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      # Reads $GITHUB_SHA/$GITHUB_RUN_NUMBER (default Actions env vars --
      # not interpolated via `${{ }}` into the script body) rather than
      # `github.sha`/`github.run_number` expressions, so nothing here
      # risks the classic script-injection footgun of splicing an
      # Actions expression straight into a shell string. See this job's
      # top comment block for the version-format rationale.
      - name: Compute chart & app version
        id: version
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          base_version="$(sed -n 's/^version: *"\?\([^"[:space:]]*\)"\?.*/\1/p' charts/distant-signal/Chart.yaml)"
          if [ -z "${base_version}" ]; then
            echo "::error::could not parse version: from charts/distant-signal/Chart.yaml" >&2
            exit 1
          fi
          echo "chart_version=${base_version}+build.${GITHUB_RUN_NUMBER}.sha.${short_sha}" >> "$GITHUB_OUTPUT"
          echo "app_version=sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: helm package
        id: package
        run: |
          set -euo pipefail
          helm package charts/distant-signal \
            --version "${{ steps.version.outputs.chart_version }}" \
            --app-version "${{ steps.version.outputs.app_version }}" \
            --destination /tmp/helm-package
          chart_tgz=$(find /tmp/helm-package -maxdepth 1 -name 'distant-signal-*.tgz' -print -quit)
          echo "chart_tgz=${chart_tgz}" >> "$GITHUB_OUTPUT"

      - name: helm push
        run: helm push "${{ steps.package.outputs.chart_tgz }}" oci://${{ env.REGISTRY }}/fasterspeeding/charts

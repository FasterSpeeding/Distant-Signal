name: CI

# Lint, build and test the Rust workspace, the frontend and the Helm chart.
#
# Runs on every pull request targeting main/dev, and on every push to
# main/master/dev. This is a superset of the "push validation" bullet in
# the CI design doc: pushes and PRs run the same job set, there is no
# reduced subset, because none of these jobs are slow/expensive enough to
# warrant skipping on push (the container build/publish pipeline, which IS
# expensive, lives in containers.yml instead).
#
# `actionlint` calls FasterSpeeding/Piped's own reusable `workflow_call`
# workflow directly (see the comment on that job). `clippy` originally did
# too, but Piped's clippy.yml passes a broken `args: --all-features` to
# auguwu/clippy-action (lands after cargo's `--` separator, so it reaches
# clippy-driver/rustc, not cargo), so it's now a custom job running plain
# `cargo clippy ... -- -D warnings` (see that job's comment). Piped's
# remaining workflows (rustfmt.yml,
# lint.yml, type-check.yml, py-test.yml, verify-types.yml,
# freeze-for-pr.yml, ...) are not used here: they are either Python/nox-
# oriented (this repo's only Python is a standalone script under scripts/,
# with no package or nox sessions; the `scripts-lint` job below checks it)
# or depend on a `justfile` +
# `mise.toml` vendored from the `piped` git submodule via the
# `just-jobs`/`handle-diff-file` composite actions in Piped-actions, which
# this repo does not have and this change does not introduce. See the PR
# description this workflow shipped with for the fuller "what was checked
# and why" writeup, including upstream-gap notes for Piped/Piped-actions.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  # Custom: NOT using FasterSpeeding/Piped's clippy.yml reusable workflow.
  # It calls auguwu/clippy-action with `args: --all-features`, which the
  # action puts AFTER cargo's `--` separator, so `--all-features` reaches
  # clippy-driver and fails with "Unrecognized option: 'all-features'"
  # (an upstream Piped bug; the reusable workflow takes no inputs). This job
  # used to call the action directly with `check-args`, but the action had
  # no deny level set, so warnings never failed it.
  #
  # Now plain cargo, per the "Strict Config Starting Points" guide: cargo
  # flags before `--`, clippy-driver flags after it. `-D warnings` makes the
  # [workspace.lints] in Cargo.toml (all + pedantic + a few restriction
  # lints, kept at "warn" there so a newer local toolchain doesn't break
  # builds) a hard gate. `--all-targets` lints tests, benches and examples
  # too. Both feature sets run so code behind a feature flag
  # (`line-catalogue-validator`'s `db`, `common`'s `postgres`/`redis`, and
  # the code compiled only without them) is linted. Findings show in the
  # job log rather than as PR annotations.
  #
  # Also installs the same system packages docker/trust-consumer.Dockerfile
  # documents needing for rdkafka's `cmake-build`/`ssl`/`sasl` features
  # (trust-consumer is part of this workspace, so `--workspace` compiles it
  # too): cmake + libssl-dev + pkg-config to build vendored librdkafka,
  # libsasl2-dev for the `sasl2-sys` crate's build script (dynamic linking
  # against a real libsasl2, matching production -- see the `rust-test` job
  # below for the fuller rationale), and libcurl4-openssl-dev because
  # librdkafka's vendored C source unconditionally `#include`s
  # <curl/curl.h>.
  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          components: clippy

      - name: Install rdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config libsasl2-dev libcurl4-openssl-dev

      # Shared with the msrv job (same toolchain, same dependency builds:
      # clippy-driver only wraps the workspace crates). See rust-test's
      # cache step for why only main saves.
      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check-all-features
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy (all features)
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: cargo clippy (no default features)
        run: cargo clippy --workspace --locked --all-targets --no-default-features -- -D warnings

  # MSRV: `rust-version = "1.88"` in Cargo.toml's [workspace.package] is a
  # promise, so check it explicitly with exactly that toolchain, separately
  # from whichever toolchain the other jobs pin. Today every job (and every
  # Dockerfile) uses 1.88.0 too, so this mostly guards the day those move
  # forward: it then keeps the workspace building on the MSRV until
  # rust-version is bumped on purpose.
  msrv:
    name: cargo +1.88.0 check (MSRV)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0

      - name: Install rdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config libsasl2-dev libcurl4-openssl-dev

      # Shared with the clippy job; see there.
      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: check-all-features
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo +1.88.0 check
        run: cargo +1.88.0 check --workspace --locked --all-features --all-targets

  # cargo-deny with deny.toml: licences, bans (wildcards; duplicate versions
  # are warnings), sources (crates.io only) and advisories (RustSec, plus
  # yanked crates). Advisories overlap dependency-scan.yml's OSV scan on
  # purpose -- see deny.toml. The binary comes from taiki-e/install-action,
  # which verifies the release checksum; the version is pinned exactly.
  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check
        run: cargo deny --locked check

  # Reusable workflow_call from FasterSpeeding/Piped: runs actionlint over
  # this repo's own .github/workflows/*.yml via reviewdog. Self-contained
  # (checkout + one third-party action), no justfile dependency -- a clean
  # fit for validating the workflow files this change adds.
  actionlint:
    uses: FasterSpeeding/Piped/.github/workflows/lint-actions.yml@5bbddb5d32d5bde939b18f6c6bcfa0e36779412f # master @ 2026-09-01

  # Custom step: Piped's rustfmt.yml exists but pipes its diff through the
  # `handle-diff-file` composite action, which shells out to `just
  # check-diff-file` -- i.e. it assumes the `piped` submodule's justfile is
  # vendored into the repo. This repo has no justfile/mise.toml and this
  # change deliberately does not add the Piped submodule just to satisfy
  # one check, so a plain `cargo fmt --check` step is used instead.
  #
  # Hard gate: `cargo fmt --all` has been run across the whole workspace, so
  # `cargo fmt --all --check` is clean on `main` and any drift from here on
  # is a real regression a PR introduced.
  rustfmt:
    name: cargo fmt --check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  # Custom: cargo build/test across the whole workspace (the tests that need
  # no database). The DATABASE_URL/REDIS_URL-gated `#[ignore]`d tests run in
  # `rust-db-test` below, in parallel: they are serial (--test-threads=1)
  # and took ~10 of this job's ~19-23 minutes when both lived here.
  rust-test:
    name: cargo build & test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0

      # trust-consumer's `rdkafka` dependency needs a real, dynamically
      # linked libsasl2 to build+run (see docker/trust-consumer.Dockerfile,
      # which installs the same packages for the same reason): its `sasl`
      # feature pulls in the `sasl2-sys` crate, whose build script panics
      # with "Unable to find libsasl2 on your system" without
      # libsasl2-dev. `rdkafka` was deliberately left on dynamic linking
      # (no `vendored`/`gssapi-vendored` feature enabled in
      # crates/trust-consumer/Cargo.toml) rather than switched to a
      # vendored/bundled libsasl2, so this needs to match the Dockerfile's
      # system-package approach rather than diverge from it: this app does
      # real SASL/SCRAM auth against a live Kafka broker in production (see
      # charts/distant-signal's trustConsumer.kafka.saslMechanism), so CI
      # should build against the same kind of libsasl2 production actually
      # links, not a bundled stand-in that could behave differently.
      # cmake/libssl-dev/pkg-config are for rdkafka's `cmake-build`/`ssl`
      # features (vendored librdkafka C library), libcurl4-openssl-dev
      # because librdkafka's vendored C source unconditionally `#include`s
      # <curl/curl.h> at build time (not linked at runtime).
      - name: Install rdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config libsasl2-dev libcurl4-openssl-dev

      # save-if: only main writes caches (every job's rust-cache step does
      # the same). A PR's save could only ever be restored by later runs
      # of that same PR, and the repo's 10 GB Actions cache was over its
      # cap and evicting main's entries for them. PRs still restore main's.
      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace (ignored tests skipped)
        run: cargo test --workspace

      # Fast, no-secrets tier of the lines/*.toml external-identifier
      # validator (crates/line-catalogue-validator): checks every `crs`,
      # `tiploc` and `operators` value against the vendored snapshot in
      # reference-data/crs-tiploc.csv and reference-data/toc-codes.csv --
      # deterministic, no network access, no rate limits, runs in well
      # under a second. Added as a step here rather than a separate job:
      # it's already covered by this job's own `cargo build --workspace`
      # above (no extra toolchain/deps needed) and is fast enough that a
      # dedicated job with its own checkout/toolchain-install overhead
      # would cost more than it saves. See
      # crates/line-catalogue-validator/src/main.rs's module doc for the
      # thorough, live-external-source counterpart to this check, which
      # runs on its own weekly schedule instead (see
      # .github/workflows/validate-line-catalogue.yml, currently disabled
      # pending credentials).
      - name: Validate lines/*.toml external identifiers (fast tier)
        run: cargo run -p line-catalogue-validator

  # Custom: the DATABASE_URL-gated `#[ignore]`d integration tests in `api`,
  # `aggregator` and `notifier` (confirmed by grepping every
  # `#[ignore = "..."]` reason in the workspace to need only a live
  # Postgres), plus the Postgres/Redis-backed ones in `common`, `enricher`
  # and `movement-feed`. Split out of `rust-test` (same commands, same
  # services) so the two run in parallel; it has its own rust-cache entry
  # (the default key includes the job id), since it builds only these
  # packages' test binaries.
  #
  # `notifier` joined this list here: it already had several
  # DATABASE_URL-gated `#[ignore]`d tests
  # of its own (`queries.rs`'s poll/push-subscription round trips,
  # `main.rs`'s `run_cycle` transition test) that CI simply never ran, plus
  # two more this plan's own Tasks 8/9 added --
  # `list_committed_legs_for_today` and the `skip_notification_state`/
  # `upsert_skip_notification_state` round-trip -- and `skip_check.rs`'s new
  # `leg_is_skipped` test from this fix wave. Every one of them calls
  # `queries.rs`/`skip_check.rs` functions (or, for `run_cycle`, passes a
  # literal fake VAPID key straight into the function call) directly against
  # a live Postgres, never through `main()`'s own env-var parsing, so none
  # need anything beyond the same `DATABASE_URL` this job already sets up
  # for `api`/`aggregator`.
  #
  # `enricher` is a mixed bag, so it's handled in its own step below instead
  # of being folded into the `-p api -p aggregator -p notifier` step: five
  # of its six `#[ignore]`d tests (`llm.rs`'s `live_eval_*`) call
  # `live_client_from_env()` and genuinely need a real `LLM_BASE_URL` with
  # live model access, so those five stay excluded here -- there is no such
  # credential in CI. But `main.rs`'s
  # `process_incident_writes_successfully_and_advances_hash_and_version_when_primary_extraction_is_truncated`
  # only needs `DATABASE_URL`: it mocks all three LLM calls it makes against
  # its own `wiremock` server (see that test's doc comment), so it now runs
  # here too -- verified locally with `DATABASE_URL=postgres://postgres:
  # postgres@localhost:5432/postgres cargo test -p enricher process_incident
  # -- --ignored --test-threads=1` against a live Postgres, which passes.
  # The step below runs every other ignored enricher test too, with
  # `--skip live_eval --skip replay_` rather than a bare `-p enricher`
  # addition to the step above, because without the skips the LLM-gated
  # tests get pulled in and fail with "LLM_BASE_URL must be set for live
  # eval" (and the replay harness with "REPLAY_HISTORY_JSONL must be set").
  rust-db-test:
    name: cargo test -- --ignored (DB/Redis-backed)
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # movement-feed's RedisStreamMovementFeed tests (Task 3 of
      # docs/superpowers/plans/2026-09-04-movement-relay-plan.md) are the
      # first #[ignore]d tests in this repo needing a live Redis rather than
      # a live Postgres -- mirrors the postgres: block above exactly.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0

      # The same packages as rust-test (see there for each one's reason).
      # Only libssl-dev/pkg-config (openssl-sys, via native-tls) matter to
      # the packages tested here today; the rest keeps the two jobs' build
      # environments identical, so a package gaining an rdkafka dependency
      # can't fail only here.
      - name: Install rdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config libsasl2-dev libcurl4-openssl-dev

      # See rust-test's cache step for save-if.
      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres,rustls --locked

      - name: Run the migrations (crates/ds-store/migrations)
        working-directory: crates/ds-store
        run: sqlx migrate run

      # The Python tooling below (gen-db-grants.py, test-postgres-roles.py
      # --mode per-service) needs the pinned PyYAML: same uv setup as the
      # scripts-lint job.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the pinned script tools
        run: uv sync --locked --group lint

      # Ingest architecture phase 0b: every table, view, sequence and
      # function the migrations create must be classified in
      # charts/distant-signal/files/db-grants.yaml (a new table without a
      # classification fails here, not in production), and
      # postgres-grants.sql must be what that file renders to.
      - name: every public table, view and sequence is classified (db-grants.yaml)
        run: uv run --no-sync scripts/gen-db-grants.py check --database-url "${DATABASE_URL}"

      # ds-store: the api's data access as it moves out (ingest architecture
      # plan phase 1A); its DB tests run everywhere the api's do. ds-migrate
      # (plan 1B.1): `run` against the migrated database.
      - name: cargo test -p api -p ds-store -p ds-migrate -p aggregator -p notifier -- --ignored (DB-backed tests)
        run: cargo test -p api -p ds-store -p ds-migrate -p aggregator -p notifier -- --ignored --test-threads=1

      # common::pg's pool-settings tests (statement/idle timeouts actually
      # applied, a timed-out statement cancelled without leaking, acquire
      # timeout). Behind common's `postgres` feature.
      - name: cargo test -p common --features postgres pg::tests -- --ignored (DB-backed tests)
        run: cargo test -p common --features postgres pg::tests -- --ignored --test-threads=1

      # Every ignored enricher test except the LLM-gated live evals and the
      # offline replay harness (needs an exported history file): the
      # DB-backed process_incident/reclaim/carry-forward/query tests, which
      # mock the LLM with wiremock, and stream.rs's Redis tests.
      - name: cargo test -p enricher -- --ignored (DB/Redis-backed tests; LLM-gated evals and replays stay excluded)
        run: cargo test -p enricher -- --ignored --skip live_eval --skip replay_ --test-threads=1

      - name: cargo test -p movement-feed -- --ignored (Redis-backed tests)
        run: cargo test -p movement-feed -- --ignored --test-threads=1

      # Ingest architecture phase 0c: every Redis ACL user in
      # charts/distant-signal/files/redis-users.acl.tpl, with its narrow
      # rights, runs its client's command sequence and is refused the
      # commands it must not have (crates/common/tests/redis_acl.rs).
      - name: cargo test -p common --test redis_acl -- --ignored (Redis ACL users)
        run: cargo test -p common --test redis_acl -- --ignored --test-threads=1

      # Ingest architecture plan 1B.6: the ingest-writer's loop runner under
      # Postgres advisory locks (crates/ingest-writer/tests/loop_locks.rs).
      - name: cargo test -p ingest-writer -- --ignored (DB-backed tests)
        run: cargo test -p ingest-writer -- --ignored --test-threads=1

      # Ingest architecture phase 3a: the stream runtime (produce/consume,
      # reclaim, dead letters, retries, MAXLEN, the producer policies while
      # Redis is down, and the poller-ldbws / ingest-writer ACL users).
      - name: cargo test -p ingest-stream --test redis_stream -- --ignored (Redis-backed tests)
        run: cargo test -p ingest-stream --test redis_stream -- --ignored --test-threads=1

      # The Postgres role split (docs/postgres-app-role.md): proves no runtime
      # path needs a superuser. scripts/test-postgres-roles.py makes a fresh
      # database and roles with the chart's own setup script
      # (charts/distant-signal/files/postgres-roles.sql), then runs the
      # DB-backed suites with DATABASE_URL as the DML-only app role and
      # MIGRATION_DATABASE_URL as the schema owner, as the chart wires them.
      # `existing` converts a database migrated as the superuser (today's
      # production); `new` creates the roles first and migrates as the owner
      # (a new cluster). The #[sqlx::test] modules are skipped: they create a
      # throwaway database per test, which needs CREATEDB, a test-harness
      # right, not a runtime one; their DML runs in the step above.
      - name: DB-backed tests as the non-superuser app role (existing cluster)
        run: >-
          scripts/test-postgres-roles.py --mode existing -- sh -c '
          cargo test -p api -p ds-store -p aggregator -p notifier -- --ignored --test-threads=1
          --skip corpus::db_tests --skip corpus_crosswalk::db_tests --skip freshness::db_tests --skip line_timetable::db_tests
          && cargo test -p common --features postgres pg::tests -- --ignored --test-threads=1
          && cargo test -p ingest-writer -- --ignored --test-threads=1
          && cargo test -p enricher -- --ignored --skip live_eval --skip replay_ --test-threads=1'

      - name: DB-backed tests as the non-superuser app role (new cluster)
        run: >-
          scripts/test-postgres-roles.py --mode new --
          cargo test -p api -p ds-store -- --ignored --test-threads=1
          migrate::tests schedule_publish

      # Stage 0b (postgresql.roles.perService): the same suites, each as its
      # own service's role from files/postgres-grants.sql. The roles are
      # still members of the app role, so this passes today; it is the
      # harness each later narrowing (phases 2-5) runs against. ds-store's
      # tests run as the api role: in phase 1A they are the api's moved
      # tests; spec §6.5 runs them per narrowed role later.
      - name: DB-backed tests as each service's own role (Stage 0b)
        run: |
          # shellcheck disable=SC2016 # expanded by the inner sh, from the env test-postgres-roles.py sets
          uv run --no-sync scripts/test-postgres-roles.py --mode per-service -- sh -c '
            skip="--skip corpus::db_tests --skip corpus_crosswalk::db_tests --skip freshness::db_tests --skip line_timetable::db_tests"
            DATABASE_URL="$DATABASE_URL_API" cargo test -p api -- --ignored --test-threads=1 $skip &&
            DATABASE_URL="$DATABASE_URL_API" cargo test -p ds-store -- --ignored --test-threads=1 $skip &&
            DATABASE_URL="$DATABASE_URL_AGGREGATOR" cargo test -p aggregator -- --ignored --test-threads=1 $skip &&
            DATABASE_URL="$DATABASE_URL_NOTIFIER" cargo test -p notifier -- --ignored --test-threads=1 $skip &&
            DATABASE_URL="$DATABASE_URL_ENRICHER" cargo test -p enricher -- --ignored --skip live_eval --skip replay_ --test-threads=1'

  # Custom: no reusable Piped workflow covers Node/npm at all (its
  # ecosystem coverage is Python + Rust). frontend/package.json now has a
  # `lint` script (`eslint .`, flat config in frontend/eslint.config.mjs
  # built on eslint-config-next's `core-web-vitals`/`typescript` configs --
  # Next.js 16 removed the `next lint` CLI in favor of running ESLint
  # directly). `npx tsc --noEmit` remains a separate step alongside it:
  # ESLint's typescript-eslint rules are style/correctness lint, not a
  # substitute for a full type-check.
  #
  # `npm run test:e2e` (Playwright, testDir: ./e2e) is deliberately NOT run
  # here -- it needs a live `api` + Postgres + Redis + seeded fixtures and a
  # built/started frontend, none of which this job stands up. See the
  # `frontend-e2e` job below for that.
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # Covers the whole frontend except what frontend/.prettierignore
      # lists (build output, generated files, minified test fixtures).
      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      # The plain-JS files tsconfig.json leaves out (allowJs: false): the
      # service worker (tsconfig.sw.json, WebWorker lib) and the Node-run
      # scripts and configs (tsconfig.scripts.json), both checkJs + strict.
      - name: Typecheck JS scripts (tsc, checkJs)
        run: npm run typecheck:scripts

      - name: npm test (vitest)
        run: npm test

      - name: npm run build (next build)
        run: npm run build

  # Custom: Playwright e2e + full-default-ruleset axe-core accessibility
  # sweep (frontend/e2e/, 7 spec files -- accessibility.spec.ts is the axe
  # sweep, the rest cover nav/layout/chat/connectivity/service-worker/push
  # notifications). This is the job the `frontend` job's own comment used to
  # say was deliberately deferred until e2e specs existed; they now do.
  #
  # Needs a real, reachable `api` (Postgres + Redis behind it) to render
  # anything beyond a skeleton/error state -- extends `rust-db-test`'s own
  # `services:` pattern (same images, same health-check options) rather
  # than `docker-compose.yml`: that file needs dummy values for ~20+
  # unrelated service credentials (Kafka, RDM/TfL/LDBWS pollers, five
  # services' worth of internal-OAuth pairs) just to resolve config, and its
  # `api`/`frontend` images would rebuild from scratch in-container with no
  # cache reuse, unlike this job's `Swatinem/rust-cache` and
  # `actions/setup-node`'s npm cache. (That rust-cache entry is this job's
  # own: rust-cache's default key includes the job id, so it is not shared
  # with `rust-test`'s, and it only holds `cargo build -p api`'s debug
  # artifacts.)
  #
  # The `INTERNAL_OAUTH_*`/`SSO_*` values below are dummy-but-syntactically-
  # valid, matching local dev's own `.devdata/api.env` pattern: `api` only
  # syntax-checks an issuer URL at startup (OIDC discovery is lazy -- see
  # `crates/api/src/data/config.rs`'s own doc comments on `sso_issuer_url`),
  # never actually contacting it unless a real OAuth redirect happens,
  # which no spec here drives.
  frontend-e2e:
    name: Playwright e2e + accessibility
    runs-on: ubuntu-24.04

    # Same two services, same images, same health-check options as
    # `rust-db-test` above -- copied rather than factored out into a
    # reusable block, matching this file's existing per-job `services:`
    # duplication.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      BIND_URL: 127.0.0.1:8080
      API_BASE_URL: http://127.0.0.1:8080
      RUST_LOG: info
      # See this job's own top comment for why these are safe dummies.
      INTERNAL_OAUTH_ISSUER_URL: http://internal-oauth.example.invalid
      INTERNAL_OAUTH_CLIENT_ID: distant-signal-internal-dummy
      SSO_ISSUER_URL: http://sso.example.invalid
      SSO_CLIENT_ID: distant-signal-dummy
      SSO_CLIENT_SECRET: distant-signal-dummy-secret
      SSO_REDIRECT_URL: http://localhost:3000/api/auth/callback
      SSO_POST_LOGIN_REDIRECT_URL: http://localhost:3000/
      VAPID_PUBLIC_KEY: BDummyVapidPublicKeyForLocalDevOnlyNotARealKeyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      LINES_DIR: ${{ github.workspace }}/lines
      # The railMcp public URL, read by the frontend server at REQUEST time
      # (FE-2: frontend/lib/csp.ts's runtimeRailMcpPublicUrl, passed to the
      # chat page as a prop), not inlined at `npm run build`; it only has
      # to be in `next start`'s environment. chat.spec.ts's `**/mcp` mocks
      # intercept every request this fixture host resolves to, matching by
      # path glob rather than by host -- see that file's own comments.
      NEXT_PUBLIC_RAILMCP_PUBLIC_URL: http://mcp.example.invalid
      # Renders the draft legal pages (/privacy, /terms, /cookies, /contact)
      # so accessibility.spec.ts can sweep them. Read at request time by
      # `next start`; see frontend/lib/legal.ts. Production leaves it unset.
      LEGAL_PAGES_PREVIEW: "true"
      # frontend/e2e/fixtures/seed.sql's own fixture ids -- see that file's
      # header comment for what each backs and why the dates are fixed.
      E2E_REAL_LINE_ID: lner-ecml
      E2E_CUSTOM_LINE_ID: custom-fixture-commute
      E2E_REAL_STATION_CRS: KGX
      E2E_REAL_INCIDENT_ID: FIXTURE-INCIDENT-1
      E2E_TRAIN_UID: W12345
      E2E_TRAIN_DATE: 2026-09-17
      E2E_TRACKING_ID: "1"
      E2E_GROUP_ID: fixture-group-1
      E2E_GROUP_INVITE_TOKEN: fixture-invite-token-123456789
      E2E_SESSION_COOKIE: qhE59Tg8RipXqulYsgOav1p46-YsflwgjQxMa1K5lKY
      E2E_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0

      # See rust-test's cache step for save-if.
      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo build -p api
        run: cargo build -p api

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres,rustls --locked

      - name: Run the migrations (crates/ds-store/migrations)
        working-directory: crates/ds-store
        run: sqlx migrate run

      - name: Seed e2e fixtures
        run: psql "${DATABASE_URL}" -f frontend/e2e/fixtures/seed.sql

      - name: Start api in the background
        run: |
          nohup ./target/debug/api > api.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/public/health > /dev/null; then
              echo "api is up"
              exit 0
            fi
            sleep 1
          done
          echo "api did not become healthy in time"
          cat api.log
          exit 1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (chromium, firefox)
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: npm run build (next build)
        working-directory: frontend
        run: npm run build

      - name: Start frontend in the background
        working-directory: frontend
        run: |
          nohup npm run start -- -p 3000 > frontend.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "frontend is up"
              exit 0
            fi
            sleep 1
          done
          echo "frontend did not become ready in time"
          cat frontend.log
          exit 1

      - name: npx playwright test
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/e2e-report/
            frontend/test-results/
          retention-days: 7

  # A4 (DB review 2026-09-27): a migration added by this PR/push must have a
  # version above every migration already on the base. sqlx applies a
  # missing lower version late and silently, out of order. INF-16/DB2-35:
  # the same script fails when a migration the base already had is
  # modified, deleted or renamed, so it needs no lock-file upkeep;
  # crates/api/tests/migration_checksums.rs is the second line of defence.
  # Ingest plan 1B.5: it also fails on destructive DDL (DROP, RENAME, a
  # column type change, SET NOT NULL) without a `-- contract: ...` header,
  # in migrations added since the base or newer than its cutoff.
  # The job name is unchanged in case a branch-protection rule requires it.
  migration-order:
    name: migration versions are newer than the base
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The script is stdlib-only; uv provides .python-version's interpreter.
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.12.21"
          # Nothing to cache: no dependencies are installed.
          enable-cache: false

      - name: Check migration order
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" = "pull_request" ]]; then
            base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          elif [[ -n "${BEFORE}" ]] && [[ "${BEFORE}" != "0000000000000000000000000000000000000000" ]] \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="${BEFORE}"
          else
            echo "no usable base commit (new branch or force push); skipping"
            exit 0
          fi
          uv run --locked --no-default-groups scripts/check-migration-order.py "${base}"

  # Lint, format-check and type-check the repo's scripts, strict by default:
  #   - every tracked *.sh: shellcheck with every optional check at style
  #     severity (.shellcheckrc) and shfmt (style from .editorconfig);
  #   - scripts/*.py: ruff check (select ALL), ruff format --check and mypy
  #     --strict (pyproject.toml);
  #   - the workflow run: blocks: actionlint with SHELLCHECK_OPTS
  #     '--enable=all --severity=style'. The `actionlint` job above uses
  #     Piped's reviewdog wrapper, which runs shellcheck with its default
  #     checks only;
  #   - every tracked Dockerfile: hadolint, every rule, failing down to
  #     style level, trusted registry docker.io only (.hadolint.yaml);
  #   - scripts/lint-containers.py: shellcheck, as for *.sh, over every
  #     Dockerfile RUN body (hadolint's embedded shellcheck runs default
  #     checks only) and the docker-compose*.yml inline shell (CMD-SHELL
  #     healthchecks, `sh -c` commands); and every image a Dockerfile or
  #     compose file pulls (`# syntax=`, FROM, COPY --from, `image:`) must
  #     be pinned by @sha256 digest.
  # Every tool is pinned in pyproject.toml's `lint` dependency group and,
  # with the rest of the tree and its hashes, in uv.lock; `uv sync --locked`
  # fails if uv.lock is stale. The interpreter is .python-version's (3.14),
  # which uv installs on this GitHub-hosted runner. scripts/lint-scripts.py
  # runs the same checks locally (`uv run scripts/lint-scripts.py`).
  scripts-lint:
    name: scripts lint (shellcheck, shfmt, ruff, mypy, actionlint, hadolint)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv itself, pinned (Ranma-Config new-service guidance 3.3a); the
          # annotation is for renovate.json5's customManagers.
          # renovate: datasource=pypi depName=uv
          version: "0.12.21"
          # Caches uv's download/wheel cache, keyed on uv.lock.
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the pinned lint tools
        run: uv sync --locked --group lint

      - name: Lint scripts
        run: uv run --no-sync scripts/lint-scripts.py

      # scripts/tests: stdlib unittest, e.g. check-migration-order.py's
      # behaviour against throwaway git repos and the schedulefeed sftp
      # entrypoint's account policy.
      - name: Test scripts
        run: uv run --no-sync python -m unittest discover -s scripts/tests -v

      # Every chart values.yaml key needs a row in the chart README's "Values
      # reference" tables, and every row must name a real key.
      # `scripts/chart-values-doc.py table <section>` drafts missing rows.
      # Here rather than in helm-lint: it needs the pinned PyYAML above.
      - name: chart values reference is complete
        run: uv run --no-sync scripts/chart-values-doc.py check

      # Every alert's summary, description, expr and estimated 3-alert
      # webhook JSON stay under ntfy's 4,096-byte limit (the 2026-10-01
      # outage's undelivered alerts), every alert has its docs/alerts.md
      # runbook section, and the rendered rules pass `promtool check rules`
      # and the unit tests in scripts/alert-rules-tests/. Here rather than
      # in helm-lint: it needs the pinned PyYAML above. The script downloads
      # promtool and verifies its checksum.
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.3

      - name: alert payload sizes and promtool tests
        run: uv run --no-sync scripts/check-alert-payloads.py --report --download-promtool "${RUNNER_TEMP}/promtool"

      # charts/ds-ingest-bucket's GCS settings and IAM, rendered in each
      # mode: both buckets private (UBLA, enforced public access
      # prevention), the delivery bucket's versioning, soft delete and
      # lifecycle, every grant bucket-level and to service accounts only,
      # exactly the publisher and reader bindings, the kill-switch labels
      # and no crossplane.io/paused, bad values (no publisher members,
      # public members, admin roles) refuse to render, and every resource
      # validates against provider-upjet-gcp's CRD schemas (downloaded and
      # checksum-verified by the script). Here rather than in helm-lint:
      # it needs the pinned PyYAML above.
      - name: ds-ingest-bucket chart policies
        run: uv run --no-sync scripts/check-ingest-bucket-chart.py --download-crds "${RUNNER_TEMP}/crossplane-crds"

      # charts/distant-signal's schedulefeed in each source mode (SFTP only,
      # bucket only, both, neither): what renders, the ingest env contract,
      # the reader key mount, alerts, and bad values refusing to render.
      - name: schedulefeed chart sources
        run: uv run --no-sync scripts/check-schedulefeed-chart.py

      # Ingest architecture phase 0 (postgresql.roles.perService and
      # redis.acl): both off by default and rendering nothing then; each
      # switch changes only what it should; the role-limit budget; the
      # Redis ACL ConfigMap equals scripts/render-redis-acl.py's.
      - name: ingest phase 0 chart switches
        run: uv run --no-sync scripts/check-ingest-phase0-chart.py

      # Ingest architecture spec §5.1: ds-store's (and ds-migrate's) normal
      # dependency closure holds no axum, tower, hyper, redis, reqwest,
      # oauth2, openidconnect or api. `cargo tree` only (no build), so no
      # rdkafka packages.
      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0

      - name: ds-store and ds-migrate dependency boundary
        run: uv run --no-sync scripts/check-crate-deps.py

  # Custom: no reusable Piped/Piped-actions workflow covers Helm at all.
  # `helm lint` + `helm template` against both the chart's own defaults and
  # values-example.yaml (which turns on the optional pollers/devAuthentik
  # sections) gives real template-rendering coverage without needing a
  # cluster. `--strict` turns lint warnings into failures too; the only
  # finding left is the [INFO] "icon is recommended", which doesn't fail.
  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.3

      - name: helm lint --strict (default values)
        run: helm lint --strict charts/distant-signal

      - name: helm lint --strict (values-example.yaml)
        run: helm lint --strict charts/distant-signal -f charts/distant-signal/values-example.yaml

      # The GCS landing-zone chart: off by default (renders nothing), and
      # with its CI values plus the optional alerts and Pub/Sub (every
      # resource). It renders Crossplane managed resources, so
      # lint/template need no CRDs; install would. The project number is a
      # placeholder.
      - name: helm lint --strict (ds-ingest-bucket)
        run: |
          helm lint --strict charts/ds-ingest-bucket
          helm lint --strict charts/ds-ingest-bucket -f charts/ds-ingest-bucket/ci/example-values.yaml
          helm template ds-ingest-bucket charts/ds-ingest-bucket \
            -f charts/ds-ingest-bucket/ci/example-values.yaml \
            --set usageAlerts.enabled=true \
            --set 'usageAlerts.notificationChannels[0]=projects/example-project/notificationChannels/0' \
            --set notifications.pubsub.enabled=true \
            --set gcp.projectNumber=000000000000 > /dev/null

      # `enricher` (no `enabled` toggle) and movement-relay (on by default)
      # `fail()` at render time if their required connection settings are
      # left empty, even though `helm lint` itself tolerates it: the LLM
      # endpoint, SSO, and a Kafka connection. movement-relay falls back to
      # trustConsumer.kafka.*, so these --set dummy values configure it too.
      # They exist only to satisfy the guard rails for this smoke test; they
      # are not meant to be real settings.
      - name: helm template (default values)
        run: |
          helm template distant-signal charts/distant-signal \
            --set trustConsumer.kafka.brokers=kafka.example.com:9094 \
            --set trustConsumer.kafka.topic=test-topic \
            --set trustConsumer.kafka.saslMechanism=PLAIN \
            --set enricher.llm.baseUrl=http://llm.example.com/v1 \
            --set enricher.llm.model=test-model \
            --set api.sso.issuerUrl=https://sso.example.com \
            --set api.sso.clientId=test-client \
            --set api.sso.clientSecret=test-secret \
            --set api.sso.redirectUrl=https://app.example.com/callback \
            --set api.sso.postLoginRedirectUrl=https://app.example.com/ \
            > /dev/null

      # Keyless OpenAI auth (enricher.llm.auth, docs/enricher-openai.md):
      # off by default, with exactly the old enricher (shared ServiceAccount,
      # LLM_API_KEY, llm-api-key). In each WIF mode: a dedicated
      # ServiceAccount with no automounted token, a projected volume with
      # ONLY an audience-bound serviceAccountToken, the WIF env and no
      # static secret, the token URLs' ports in the egress rule, the
      # token-exchange alert; and every unsafe or incomplete config refuses
      # to render.
      - name: helm template (enricher workload identity)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=https://api.openai.com/v1
            --set enricher.llm.model=gpt-6-luna
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          ids=(
            --set enricher.llm.workloadIdentity.identityProviderId=idp_test
            --set enricher.llm.workloadIdentity.serviceAccountId=svc_acct_test
          )
          authentik=(
            --set enricher.llm.auth=openaiWifAuthentik
            --set enricher.serviceAccount.create=true
            "${ids[@]}"
            --set enricher.llm.workloadIdentity.authentik.tokenUrl=https://sso.example.com:8443/application/o/token/
            --set enricher.llm.workloadIdentity.authentik.clientId=test-enricher-client
          )
          kubernetes=(
            --set enricher.llm.auth=openaiWifKubernetes
            --set enricher.serviceAccount.create=true
            "${ids[@]}"
            --set enricher.llm.workloadIdentity.tokenAudience=https://api.openai.com/v1
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }
          # One document by kind and name.
          doc() { awk -v k="$1" -v n="$2" 'BEGIN{RS="\n---\n"} $0 ~ "\nkind: " k "\n" && $0 ~ "\n  name: " n "\n" {print}'; }
          env_is() { grep -A1 "name: $2\$" <<<"$1" | grep -q "value: \"$3\"" || fail "$2 must be \"$3\""; }

          # Default: the old enricher, byte for byte.
          out=$(render)
          dep=$(doc Deployment distant-signal-enricher <<<"${out}")
          grep -q 'serviceAccountName: distant-signal$' <<<"${dep}" || fail "default must use the shared ServiceAccount"
          grep -A4 'name: LLM_API_KEY$' <<<"${dep}" | grep -q 'key: llm-api-key' || fail "default must read LLM_API_KEY"
          if grep -E -q 'LLM_AUTH|OPENAI_|openai-identity-token|volumes:' <<<"${dep}"; then fail "default must render no WIF env or volume"; fi
          sa=$(doc ServiceAccount distant-signal-enricher <<<"${out}")
          [[ -z "${sa}" ]] || fail "default must not create an enricher ServiceAccount"
          secret=$(doc Secret distant-signal <<<"${out}")
          grep -q '  llm-api-key: ' <<<"${secret}" || fail "default must render llm-api-key"

          # Primary: k8s token -> Authentik -> OpenAI.
          out=$(render "${authentik[@]}" --set enricher.llm.workloadIdentity.authentik.scope=profile)
          dep=$(doc Deployment distant-signal-enricher <<<"${out}")
          sa=$(doc ServiceAccount distant-signal-enricher <<<"${out}")
          grep -q 'automountServiceAccountToken: false' <<<"${sa}" || fail "the enricher ServiceAccount must not automount"
          grep -q 'serviceAccountName: distant-signal-enricher$' <<<"${dep}" || fail "WIF must use the dedicated ServiceAccount"
          grep -q 'automountServiceAccountToken: false' <<<"${dep}" || fail "the enricher pod must not automount"
          env_is "${dep}" LLM_AUTH openai-wif-authentik
          env_is "${dep}" OPENAI_IDENTITY_PROVIDER_ID idp_test
          env_is "${dep}" OPENAI_SERVICE_ACCOUNT_ID svc_acct_test
          env_is "${dep}" LLM_IDENTITY_TOKEN_FILE /var/run/secrets/openai/token
          env_is "${dep}" LLM_TOKEN_EXCHANGE_URL https://auth.openai.com/oauth/token
          env_is "${dep}" LLM_AUTHENTIK_TOKEN_URL https://sso.example.com:8443/application/o/token/
          env_is "${dep}" LLM_AUTHENTIK_CLIENT_ID test-enricher-client
          env_is "${dep}" LLM_AUTHENTIK_SCOPE profile
          if grep -q 'LLM_API_KEY' <<<"${dep}"; then fail "WIF must not render LLM_API_KEY"; fi
          if grep -q 'llm-api-key' <<<"${out}"; then fail "WIF must not render an llm-api-key Secret entry"; fi
          # The volume holds ONLY the audience-bound token, read-only.
          vol=$(awk '/^      volumes:/{f=1} f' <<<"${dep}")
          grep -q 'audience: "test-enricher-client"' <<<"${vol}" || fail "authentik mode's audience must default to the client ID"
          grep -q 'expirationSeconds: 3600' <<<"${vol}" || fail "the projected token must expire after 3600s"
          grep -q 'path: token$' <<<"${vol}" || fail "the projected token must be at path token"
          n=$(grep -c -E '^              - [a-zA-Z]+:' <<<"${vol}" || true)
          [[ "${n}" == 1 ]] || fail "the projected volume must have exactly one source, got ${n}"
          if grep -E -q 'configMap|downwardAPI|secret:|ca.crt|clusterTrustBundle' <<<"${vol}"; then fail "the projected volume must hold only the token"; fi
          grep -A2 'mountPath: /var/run/secrets/openai$' <<<"${dep}" | grep -q 'readOnly: true' || fail "the token mount must be read-only"
          # Egress: the token URLs' ports (8443 for this Authentik URL).
          eg=$(render "${authentik[@]}" --set networkPolicy.enabled=true --set networkPolicy.egress.enabled=true \
            --show-only templates/networkpolicy.yaml)
          ports=$(awk -v n="distant-signal-enricher" 'BEGIN{RS="\n---\n"} $0 ~ "\n  name: " n "\n" {print}' <<<"${eg}" \
            | awk '/^  egress:/{f=1} f' | awk '/cidr: "::\/0"/{f=1} f && /port:/{print $2}' | sort -n | tr '\n' ' ')
          [[ "${ports}" == "443 8443 " ]] || fail "enricher internet ports: want '443 8443 ', got '${ports}'"
          # The token-exchange alert renders in WIF modes only.
          rule=$(render "${authentik[@]}" --set metrics.prometheusRule.enabled=true --show-only templates/prometheusrule.yaml)
          grep -q 'alert: DistantSignalEnricherTokenExchangeFailing' <<<"${rule}" || fail "WIF must render the token-exchange alert"
          rule=$(render --set metrics.prometheusRule.enabled=true --show-only templates/prometheusrule.yaml)
          if grep -q 'TokenExchange' <<<"${rule}"; then fail "apiKey mode must not render the token-exchange alert"; fi

          # Fallback: the k8s token straight to OpenAI.
          out=$(render "${kubernetes[@]}")
          dep=$(doc Deployment distant-signal-enricher <<<"${out}")
          env_is "${dep}" LLM_AUTH openai-wif-kubernetes
          grep -q 'audience: "https://api.openai.com/v1"' <<<"${dep}" || fail "kubernetes mode must use tokenAudience"
          if grep -E -q 'LLM_AUTHENTIK_|LLM_API_KEY' <<<"${dep}"; then fail "kubernetes mode must render no Authentik env or API key"; fi
          # An existing dedicated ServiceAccount, by name.
          out=$(render "${kubernetes[@]}" --set enricher.serviceAccount.create=false --set enricher.serviceAccount.name=ds-enricher)
          dep=$(doc Deployment distant-signal-enricher <<<"${out}")
          grep -q 'serviceAccountName: ds-enricher$' <<<"${dep}" || fail "enricher.serviceAccount.name must be used"
          sa=$(doc ServiceAccount ds-enricher <<<"${out}")
          [[ -z "${sa}" ]] || fail "an existing enricher ServiceAccount must not be created"

          # Refuses to render: no dedicated account, the shared one, a
          # static secret, missing IDs/URLs/audience, an unknown mode.
          refuses() {
            local why="$1"; shift
            if helm template distant-signal charts/distant-signal "${base[@]}" "$@" >/dev/null 2>&1; then
              fail "must refuse to render: ${why}"
            fi
          }
          refuses "WIF without a dedicated ServiceAccount" "${authentik[@]}" --set enricher.serviceAccount.create=false
          refuses "WIF on the shared ServiceAccount" "${authentik[@]}" --set enricher.serviceAccount.create=false \
            --set enricher.serviceAccount.name=distant-signal
          refuses "a dedicated account named like the shared one" "${authentik[@]}" --set enricher.serviceAccount.name=distant-signal
          refuses "WIF with an API key" "${authentik[@]}" --set enricher.llm.apiKey=sk-test
          refuses "WIF with an existingSecret" "${authentik[@]}" --set enricher.llm.existingSecret=llm
          refuses "no identityProviderId" "${authentik[@]}" --set enricher.llm.workloadIdentity.identityProviderId=
          refuses "no serviceAccountId" "${authentik[@]}" --set enricher.llm.workloadIdentity.serviceAccountId=
          refuses "no tokenExchangeUrl" "${authentik[@]}" --set enricher.llm.workloadIdentity.tokenExchangeUrl=
          refuses "authentik without tokenUrl" "${authentik[@]}" --set enricher.llm.workloadIdentity.authentik.tokenUrl=
          refuses "authentik without clientId" "${authentik[@]}" --set enricher.llm.workloadIdentity.authentik.clientId=
          refuses "kubernetes without tokenAudience" "${kubernetes[@]}" --set enricher.llm.workloadIdentity.tokenAudience=
          refuses "an unknown auth mode" --set enricher.llm.auth=openaiWifGcp
          echo "enricher workload identity renders OK"

      # Disabled (the default) must render no ARCHIVE_* env at all; enabled
      # must wire the credentials from the named existing Secret.
      - name: helm template (cold archive enabled)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          disabled=$(helm template distant-signal charts/distant-signal "${base[@]}")
          if grep -q 'ARCHIVE_' <<<"${disabled}"; then
            echo "archive disabled but ARCHIVE_* env rendered" >&2; exit 1
          fi
          out=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --set archive.enabled=true \
            --set archive.s3.bucket=archive-bucket \
            --set archive.s3.existingSecret=archive-creds \
            --set archive.s3.lifecycleConfirmed=true)
          grep -q 'name: ARCHIVE_S3_SECRET_ACCESS_KEY' <<<"${out}"
          grep -q 'name: archive-creds' <<<"${out}"
          # DQ14: enabling the archive without confirming an S3 lifecycle
          # (expiry) rule on the bucket must fail the render.
          if helm template distant-signal charts/distant-signal "${base[@]}" \
              --set archive.enabled=true \
              --set archive.s3.bucket=archive-bucket \
              --set archive.s3.existingSecret=archive-creds >/dev/null 2>&1; then
            echo "archive enabled without lifecycleConfirmed but the render succeeded" >&2; exit 1
          fi
          # Client-side expiry stands in for the lifecycle rule and is
          # dry-run unless dryRun is set false.
          expiry=(
            --set archive.enabled=true
            --set archive.s3.bucket=archive-bucket
            --set archive.s3.existingSecret=archive-creds
            --set archive.s3.prefix=cluster/distant-signal-archive
            --set archive.expiry.enabled=true
          )
          out=$(helm template distant-signal charts/distant-signal "${base[@]}" "${expiry[@]}")
          grep -A1 'name: ARCHIVE_EXPIRY_DRY_RUN' <<<"${out}" | grep -q 'value: "true"'
          grep -A1 'name: ARCHIVE_EXPIRY_RETENTION_DAYS' <<<"${out}" | grep -q 'value: "730"'
          # The 90-day floor, the two-segment prefix, and "expiry needs the
          # archive" must each fail the render.
          for bad in archive.expiry.retentionDays=89 archive.s3.prefix=archive archive.enabled=false; do
            if helm template distant-signal charts/distant-signal "${base[@]}" "${expiry[@]}" \
                --set "${bad}" >/dev/null 2>&1; then
              echo "archive expiry with ${bad} but the render succeeded" >&2; exit 1
            fi
          done

      # postgresql.config must render as sorted `-c name=value` args, with
      # whole YAML numbers as integers (not 1e+08) and bools as on/off,
      # plus the memory-backed /dev/shm. `config: null` and
      # `shm.enabled=false` must render neither.
      - name: helm template (postgres config and /dev/shm)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
            --show-only templates/postgres-statefulset.yaml
          )
          out=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            -f - <<'EOF'
          postgresql:
            config:
              temp_file_limit: 100000000
              jit: off
          EOF
          )
          grep -q -- '- "shared_buffers=1GB"' <<<"${out}"
          grep -q -- '- "effective_cache_size=3584MB"' <<<"${out}"
          grep -q -- '- "max_wal_size=4GB"' <<<"${out}"
          grep -q -- '- "wal_compression=lz4"' <<<"${out}"
          grep -q -- '- "random_page_cost=1.1"' <<<"${out}"
          grep -q -- '- "huge_pages=off"' <<<"${out}"
          grep -q -- '- "temp_file_limit=100000000"' <<<"${out}"
          grep -q -- '- "jit=off"' <<<"${out}"
          # Server-level backstops (Train Register N4), and never a
          # server-wide statement_timeout (pgBackRest's pg_backup_stop).
          grep -q -- '- "idle_in_transaction_session_timeout=10min"' <<<"${out}"
          grep -q -- '- "client_connection_check_interval=10s"' <<<"${out}"
          grep -q -- '- "tcp_keepalives_idle=60"' <<<"${out}"
          if grep -q -- '"statement_timeout=' <<<"${out}"; then
            echo "server-wide statement_timeout rendered" >&2; exit 1
          fi
          grep -q 'mountPath: /dev/shm' <<<"${out}"
          grep -q 'medium: Memory' <<<"${out}"
          grep -q 'sizeLimit: 1Gi' <<<"${out}"
          grep -q 'memory: 5Gi' <<<"${out}"
          bare=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --set postgresql.config=null --set postgresql.shm.enabled=false)
          if grep -E -q 'args:|/dev/shm|name: dshm' <<<"${bare}"; then
            echo "postgres config/shm rendered despite being disabled" >&2; exit 1
          fi

      # Redis must render --save "" and --maxmemory/--maxmemory-policy by
      # default; null must drop --save/--maxmemory. movement-relay must get
      # MOVEMENT_STREAM_MAXLEN as a plain integer (not 1.048576e+06).
      - name: helm template (redis memory and stream cap)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          redis=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --show-only templates/redis-deployment.yaml)
          grep -A1 -- '- --save' <<<"${redis}" | grep -q -- '- ""'
          grep -A1 -- '- --maxmemory$' <<<"${redis}" | grep -q -- '- "1536mb"'
          grep -A1 -- '- --maxmemory-policy' <<<"${redis}" | grep -q -- '- "noeviction"'
          grep -q 'memory: 2560Mi' <<<"${redis}"
          # DQ15: 4Gi default (no cluster here, so the existing-PVC lookup is
          # empty and the value renders as-is).
          helm template distant-signal charts/distant-signal "${base[@]}" \
            --show-only templates/redis-pvc.yaml | grep -q 'storage: "4Gi"'
          bare=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --set redis.save=null --set redis.maxmemory=null \
            --show-only templates/redis-deployment.yaml)
          if grep -E -q -- '- --save|- --maxmemory$' <<<"${bare}"; then
            echo "redis --save/--maxmemory rendered despite being null" >&2; exit 1
          fi
          relay=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --show-only templates/movement-relay-deployment.yaml)
          grep -A1 'name: MOVEMENT_STREAM_MAXLEN' <<<"${relay}" | grep -q 'value: "1048576"'

      # Windowed full coverage's sparse all-cancelled rule: shadow-only by
      # default (its own allowlist is empty, separate from enforceLines),
      # minimum 2 cancelled trains, and both values reach the aggregator.
      - name: helm template (full-coverage sparse rule)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          fail() { echo "::error::$*" >&2; exit 1; }
          agg=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --show-only templates/aggregator-deployment.yaml)
          grep -A1 'name: FULL_COVERAGE_WINDOW_SPARSE_ENFORCE_LINES$' <<<"${agg}" | grep -q 'value: ""' \
            || fail "sparse verdicts must be shadow-only by default"
          grep -A1 'name: FULL_COVERAGE_SPARSE_MIN_CANCELLED$' <<<"${agg}" | grep -q 'value: "2"' \
            || fail "the sparse rule must need 2 cancelled trains by default"
          agg=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --set aggregator.fullCoverageWindow.mode=enforce \
            --set 'aggregator.fullCoverageWindow.enforceLines=gwr-windsor-branch' \
            --set 'aggregator.fullCoverageWindow.sparseEnforceLines=gwr-looe-valley\,swr-lymington-branch' \
            --set aggregator.fullCoverageWindow.sparseMinCancelled=3 \
            --show-only templates/aggregator-deployment.yaml)
          grep -A1 'name: FULL_COVERAGE_WINDOW_ENFORCE_LINES$' <<<"${agg}" | grep -q 'value: "gwr-windsor-branch"' \
            || fail "enforceLines must stay its own setting"
          grep -A1 'name: FULL_COVERAGE_WINDOW_SPARSE_ENFORCE_LINES$' <<<"${agg}" \
            | grep -q 'value: "gwr-looe-valley,swr-lymington-branch"' \
            || fail "sparseEnforceLines must reach the aggregator"
          grep -A1 'name: FULL_COVERAGE_SPARSE_MIN_CANCELLED$' <<<"${agg}" | grep -q 'value: "3"' \
            || fail "sparseMinCancelled must reach the aggregator"

      # The sftp entrypoint ConfigMap embeds files/schedule-sftp-entrypoint.sh
      # (also bind-mounted by docker-compose.yml) with .Files.Get; the
      # rendered script must be that file, byte for byte.
      - name: helm template (sftp entrypoint is the shared script)
        run: |
          set -euo pipefail
          cm=$(helm template distant-signal charts/distant-signal \
            --set trustConsumer.kafka.brokers=kafka.example.com:9094 \
            --set trustConsumer.kafka.topic=test-topic \
            --set trustConsumer.kafka.saslMechanism=PLAIN \
            --set enricher.llm.baseUrl=http://llm.example.com/v1 \
            --set enricher.llm.model=test-model \
            --set api.sso.issuerUrl=https://sso.example.com \
            --set api.sso.clientId=test-client \
            --set api.sso.clientSecret=test-secret \
            --set api.sso.redirectUrl=https://app.example.com/callback \
            --set api.sso.postLoginRedirectUrl=https://app.example.com/ \
            --set scheduleFeed.enabled=true \
            --set scheduleFeed.sftp.authMethod=password \
            --show-only templates/schedulefeed-configmap.yaml)
          script=$(sed -n '/^  entrypoint.sh: |$/,$p' <<<"${cm}" | tail -n +2 | sed 's/^    //')
          diff -u charts/distant-signal/files/schedule-sftp-entrypoint.sh <(printf '%s\n' "${script}")

      # SFTPGo must serve the chart's preserved host keys (not regenerate
      # fresh ones each start), must not run its web admin, and must pass
      # extraEnv through; the key files must be group-readable for uid 1000.
      - name: helm template (sftp host keys, no web admin, extraEnv)
        run: |
          set -euo pipefail
          render() {
            helm template distant-signal charts/distant-signal \
              --set trustConsumer.kafka.brokers=kafka.example.com:9094 \
              --set trustConsumer.kafka.topic=test-topic \
              --set trustConsumer.kafka.saslMechanism=PLAIN \
              --set enricher.llm.baseUrl=http://llm.example.com/v1 \
              --set enricher.llm.model=test-model \
              --set api.sso.issuerUrl=https://sso.example.com \
              --set api.sso.clientId=test-client \
              --set api.sso.clientSecret=test-secret \
              --set api.sso.redirectUrl=https://app.example.com/callback \
              --set api.sso.postLoginRedirectUrl=https://app.example.com/ \
              --set scheduleFeed.enabled=true \
              --set scheduleFeed.sftp.authMethod=password "$@"
          }
          fail() { echo "::error::$1"; exit 1; }
          dep=$(render --show-only templates/schedulefeed-deployment.yaml)
          grep -q 'value: "/srv/sftpgo/host_keys/ssh_host_ecdsa_key,/srv/sftpgo/host_keys/ssh_host_ed25519_key"' <<<"${dep}" \
            || fail "SFTPGO_SFTPD__HOST_KEYS must list the mounted keys"
          grep -A1 'SFTPGO_HTTPD__BINDINGS__0__PORT' <<<"${dep}" | grep -q 'value: "0"' \
            || fail "the SFTPGo web admin must be off by default"
          modes=$(grep -c 'mode: 0440' <<<"${dep}" || true)
          [[ "${modes}" -eq 2 ]] || fail "both host keys must be mounted 0440"
          sec=$(render --show-only templates/schedulefeed-secret.yaml)
          grep -q 'ssh_host_ecdsa_key:' <<<"${sec}" || fail "the chart must generate an ECDSA host key"
          dep=$(render --set scheduleFeed.sftp.webAdmin.enabled=true \
            --set 'scheduleFeed.sftp.extraEnv[0].name=SFTPGO_TELEMETRY__BIND_PORT' \
            --set-string 'scheduleFeed.sftp.extraEnv[0].value=9097' \
            --show-only templates/schedulefeed-deployment.yaml)
          if grep -q 'SFTPGO_HTTPD__BINDINGS__0__PORT' <<<"${dep}"; then fail "webAdmin.enabled must drop the port override"; fi
          grep -q 'SFTPGO_TELEMETRY__BIND_PORT' <<<"${dep}" || fail "extraEnv must reach the SFTPGo container"
          dep=$(render --set 'scheduleFeed.sftp.hostKeys=null' --show-only templates/schedulefeed-deployment.yaml)
          if grep -q 'SFTPGO_SFTPD__HOST_KEYS' <<<"${dep}"; then fail "an empty hostKeys list must not set HOST_KEYS"; fi

      # extraEnv is merged with the chart's env by name (distant-signal.mergeEnv):
      # a name the chart already sets is rendered once, with the extraEnv
      # value, in the chart's place. A repeated name makes server-side apply
      # reject the Deployment (the 2026-10-02 prod deploy).
      - name: helm template (extraEnv overrides chart env by name)
        run: |
          set -euo pipefail
          render() {
            helm template distant-signal charts/distant-signal \
              --set trustConsumer.kafka.brokers=kafka.example.com:9094 \
              --set trustConsumer.kafka.topic=test-topic \
              --set trustConsumer.kafka.saslMechanism=PLAIN \
              --set enricher.llm.baseUrl=http://llm.example.com/v1 \
              --set enricher.llm.model=test-model \
              --set api.sso.issuerUrl=https://sso.example.com \
              --set api.sso.clientId=test-client \
              --set api.sso.clientSecret=test-secret \
              --set api.sso.redirectUrl=https://app.example.com/callback \
              --set api.sso.postLoginRedirectUrl=https://app.example.com/ \
              --set scheduleFeed.enabled=true \
              --set scheduleFeed.sftp.authMethod=password "$@"
          }
          fail() { echo "::error::$1"; exit 1; }
          once() {
            local n
            n=$(grep -c "name: $1\$" <<<"${dep}" || true)
            [[ "${n}" -eq 1 ]] || fail "$1 must be rendered once, got ${n}"
            grep -A1 "name: $1\$" <<<"${dep}" | grep -q "value: \"$2\"" || fail "$1 must be \"$2\""
          }
          dep=$(render \
            --set 'scheduleFeed.sftp.extraEnv[0].name=SFTPGO_COMMON__DEFENDER__THRESHOLD' \
            --set-string 'scheduleFeed.sftp.extraEnv[0].value=12' \
            --set 'scheduleFeed.sftp.extraEnv[1].name=SFTPGO_EXTRA_ONLY' \
            --set-string 'scheduleFeed.sftp.extraEnv[1].value=7' \
            --set 'scheduleFeed.sftp.extraEnv[2].name=SFTPGO_COMMON__DEFENDER__THRESHOLD' \
            --set-string 'scheduleFeed.sftp.extraEnv[2].value=16' \
            --show-only templates/schedulefeed-deployment.yaml)
          once SFTPGO_COMMON__DEFENDER__THRESHOLD 16
          once SFTPGO_EXTRA_ONLY 7
          once SFTPGO_COMMON__DEFENDER__SCORE_VALID 2
          # The override keeps the chart's place: before SCORE_INVALID.
          grep -A3 'name: SFTPGO_COMMON__DEFENDER__THRESHOLD$' <<<"${dep}" | grep -q 'SFTPGO_COMMON__DEFENDER__SCORE_INVALID' \
            || fail "an override must stay in the chart entry's place"
          # A valueFrom entry passes through, and can replace a value entry.
          dep=$(render \
            --set 'api.extraEnv[0].name=RUST_LOG' \
            --set 'api.extraEnv[0].valueFrom.secretKeyRef.name=s' \
            --set 'api.extraEnv[0].valueFrom.secretKeyRef.key=k' \
            --show-only templates/api-deployment.yaml)
          n=$(grep -c 'name: RUST_LOG$' <<<"${dep}" || true)
          [[ "${n}" -eq 1 ]] || fail "api RUST_LOG must be rendered once, got ${n}"
          grep -A4 'name: RUST_LOG$' <<<"${dep}" | grep -q 'secretKeyRef' || fail "an extraEnv valueFrom must replace the chart's value"
          if grep -A1 'name: RUST_LOG$' <<<"${dep}" | grep -q 'value:'; then fail "the replaced entry must not keep the chart's value"; fi
          # No container anywhere repeats a name (containers are the
          # 8-space list items, their env entries the 12-space ones),
          # including schedulefeed's ingest with the bucket source's env.
          all=$(render -f charts/distant-signal/values-example.yaml \
            --set scheduleFeed.enabled=true --set scheduleFeed.sftp.authMethod=password \
            --set scheduleFeed.bucket.enabled=true \
            --set scheduleFeed.bucket.name=example-ds-ingest \
            --set scheduleFeed.bucket.existingSecret=distant-signal-schedulefeed-bucket \
            --set 'pollers.tfl.extraEnv[0].name=RUST_LOG' --set-string 'pollers.tfl.extraEnv[0].value=debug')
          dups=$(awk '/^---/{doc++} /^        - name: /{c=$NF} /^            - name: [A-Z_][A-Z0-9_]*$/{print doc, c, $NF}' <<<"${all}" | sort | uniq -d)
          [[ -z "${dups}" ]] || fail "repeated env names: ${dups}"

      # Keyless bucket access (scheduleFeed.bucket.auth=workloadIdentity):
      # the projected token and the external_account config reach ingest,
      # no key does, and the pod runs as its own ServiceAccount (Google's
      # trust is pinned to its subject). scripts/check-schedulefeed-chart.py
      # checks the rest (volumes exactly, guards, egress, key mode unchanged).
      - name: helm template (schedulefeed keyless bucket)
        run: |
          set -euo pipefail
          render() {
            helm template distant-signal charts/distant-signal \
              --set trustConsumer.kafka.brokers=kafka.example.com:9094 \
              --set trustConsumer.kafka.topic=test-topic \
              --set trustConsumer.kafka.saslMechanism=PLAIN \
              --set enricher.llm.baseUrl=http://llm.example.com/v1 \
              --set enricher.llm.model=test-model \
              --set api.sso.issuerUrl=https://sso.example.com \
              --set api.sso.clientId=test-client \
              --set api.sso.clientSecret=test-secret \
              --set api.sso.redirectUrl=https://app.example.com/callback \
              --set api.sso.postLoginRedirectUrl=https://app.example.com/ \
              --set scheduleFeed.enabled=true \
              --set scheduleFeed.sftp.enabled=false \
              --set scheduleFeed.bucket.enabled=true \
              --set scheduleFeed.bucket.name=example-ds-ingest \
              --set scheduleFeed.bucket.auth=workloadIdentity \
              --set scheduleFeed.serviceAccount.create=true "$@"
          }
          fail() { echo "::error::$1"; exit 1; }
          cm=(--set scheduleFeed.bucket.workloadIdentity.credentialConfigMap=ds-ingest-gcp-wif)
          dep=$(render "${cm[@]}" --show-only templates/schedulefeed-deployment.yaml)
          grep -A1 'name: GOOGLE_APPLICATION_CREDENTIALS$' <<<"${dep}" \
            | grep -q 'value: /var/run/secrets/distant-signal/gcs/credential-config.json' \
            || fail "ingest must get GOOGLE_APPLICATION_CREDENTIALS"
          if grep -q 'GOOGLE_SERVICE_ACCOUNT_PATH' <<<"${dep}"; then fail "keyless must not render the key path"; fi
          if grep -q 'secretName: distant-signal-schedulefeed-bucket' <<<"${dep}"; then fail "keyless must not mount a key Secret"; fi
          grep -q 'audience: "gcp-ds-ingest"' <<<"${dep}" || fail "the projected token needs the gcp-ds-ingest audience"
          grep -q 'mountPath: /var/run/secrets/distant-signal/gcs-token$' <<<"${dep}" \
            || fail "the projected token must be mounted where credential_source.file points"
          grep -q 'serviceAccountName: distant-signal-schedulefeed$' <<<"${dep}" \
            || fail "keyless needs the dedicated schedulefeed ServiceAccount"
          sa=$(render "${cm[@]}" --show-only templates/schedulefeed-serviceaccount.yaml)
          grep -q 'automountServiceAccountToken: false' <<<"${sa}" \
            || fail "the schedulefeed ServiceAccount must not automount its token"
          set +e
          out=$(render 2>&1)
          status=$?
          set -e
          [[ "${status}" -ne 0 ]] || fail "keyless without a credential ConfigMap must fail the render"
          grep -q 'workloadIdentity.credentialConfigMap' <<<"${out}" || fail "the error must name credentialConfigMap"

      # The push account's least-privilege policy reaches the entrypoint
      # (scripts/tests/ checks what the entrypoint does with it), and a
      # change to the entrypoint script rolls the pod.
      - name: helm template (sftp push account policy)
        run: |
          set -euo pipefail
          render() {
            helm template distant-signal charts/distant-signal \
              --set trustConsumer.kafka.brokers=kafka.example.com:9094 \
              --set trustConsumer.kafka.topic=test-topic \
              --set trustConsumer.kafka.saslMechanism=PLAIN \
              --set enricher.llm.baseUrl=http://llm.example.com/v1 \
              --set enricher.llm.model=test-model \
              --set api.sso.issuerUrl=https://sso.example.com \
              --set api.sso.clientId=test-client \
              --set api.sso.clientSecret=test-secret \
              --set api.sso.redirectUrl=https://app.example.com/callback \
              --set api.sso.postLoginRedirectUrl=https://app.example.com/ \
              --set scheduleFeed.enabled=true \
              --set scheduleFeed.sftp.authMethod=password "$@" \
              --show-only templates/schedulefeed-deployment.yaml
          }
          fail() { echo "::error::$1"; exit 1; }
          dep=$(render)
          grep -A1 'name: SCHEDULE_SFTP_PERMISSIONS' <<<"${dep}" | grep -q 'value: "upload,overwrite,list"' \
            || fail "the push account must default to upload,overwrite,list"
          grep -A1 'name: SCHEDULE_SFTP_MAX_SESSIONS' <<<"${dep}" | grep -q 'value: "2"' \
            || fail "maxSessions must reach the entrypoint"
          grep -A1 'name: SCHEDULE_SFTP_MAX_UPLOAD_FILE_SIZE' <<<"${dep}" | grep -q 'value: "536870912"' \
            || fail "maxUploadFileSize must reach the entrypoint"
          sum=$(grep 'checksum/sftp-entrypoint:' <<<"${dep}") || fail "the pod must carry the entrypoint checksum"
          [[ "${sum}" =~ [0-9a-f]{64} ]] || fail "the entrypoint checksum must be a sha256"
          dep=$(render --set 'scheduleFeed.sftp.permissions={upload}')
          grep -A1 'name: SCHEDULE_SFTP_PERMISSIONS' <<<"${dep}" | grep -q 'value: "upload"' \
            || fail "scheduleFeed.sftp.permissions must be configurable"
          # Password strength: the entrypoint gets the policy, and a short
          # password in values fails the render (with its length, not value).
          grep -A1 'name: SCHEDULE_SFTP_PASSWORD_MIN_LENGTH' <<<"${dep}" | grep -q 'value: "24"' \
            || fail "the password minimum must reach the entrypoint"
          grep -A1 'name: SCHEDULE_SFTP_PASSWORD_POLICY' <<<"${dep}" | grep -q 'value: "enforce"' \
            || fail "the password policy must default to enforce"
          set +e
          out=$(render --set scheduleFeed.sftp.password=tooShort-2026 2>&1)
          status=$?
          set -e
          [[ "${status}" -ne 0 ]] || fail "a short scheduleFeed.sftp.password must fail the render"
          grep -q '13 characters' <<<"${out}" || fail "the render error must give the length"
          if grep -q 'tooShort-2026' <<<"${out}"; then fail "the render error must not print the password"; fi
          # A 24-character one renders (set -e fails the step otherwise).
          render --set scheduleFeed.sftp.password=abcdefghijklmnopqrstuvwx >/dev/null

      # Brute-force protection is on by default: SSH commands off, the
      # defender (never scoring probe connections), the per-host cap and
      # the per-source rate limiter; the safelist reaches the entrypoint.
      - name: helm template (sftp defender, rate limit, no SSH commands)
        run: |
          set -euo pipefail
          render() {
            helm template distant-signal charts/distant-signal \
              --set trustConsumer.kafka.brokers=kafka.example.com:9094 \
              --set trustConsumer.kafka.topic=test-topic \
              --set trustConsumer.kafka.saslMechanism=PLAIN \
              --set enricher.llm.baseUrl=http://llm.example.com/v1 \
              --set enricher.llm.model=test-model \
              --set api.sso.issuerUrl=https://sso.example.com \
              --set api.sso.clientId=test-client \
              --set api.sso.clientSecret=test-secret \
              --set api.sso.redirectUrl=https://app.example.com/callback \
              --set api.sso.postLoginRedirectUrl=https://app.example.com/ \
              --set scheduleFeed.enabled=true \
              --set scheduleFeed.sftp.authMethod=password "$@" \
              --show-only templates/schedulefeed-deployment.yaml
          }
          fail() { echo "::error::$1"; exit 1; }
          has() { grep -A1 "name: $1\$" <<<"${dep}" | grep -q "value: \"$2\"" || fail "$1 must be \"$2\""; }
          dep=$(render)
          has SFTPGO_SFTPD__ENABLED_SSH_COMMANDS ''
          has SFTPGO_COMMON__DEFENDER__ENABLED true
          has SFTPGO_COMMON__DEFENDER__SCORE_NO_AUTH 0
          has SFTPGO_COMMON__DEFENDER__THRESHOLD 8
          has SFTPGO_COMMON__MAX_PER_HOST_CONNECTIONS 8
          has SFTPGO_COMMON__RATE_LIMITERS__0__AVERAGE 20
          has SFTPGO_COMMON__RATE_LIMITERS__0__GENERATE_DEFENDER_EVENTS true
          has SFTPGO_COMMON__RATE_LIMITERS__0__ENTRIES_SOFT_LIMIT 100
          has SFTPGO_COMMON__RATE_LIMITERS__0__ENTRIES_HARD_LIMIT 150
          dep=$(render --set scheduleFeed.sftp.rateLimit.entriesSoftLimit=200 --set scheduleFeed.sftp.rateLimit.entriesHardLimit=300)
          has SFTPGO_COMMON__RATE_LIMITERS__0__ENTRIES_SOFT_LIMIT 200
          has SFTPGO_COMMON__RATE_LIMITERS__0__ENTRIES_HARD_LIMIT 300
          set +e
          render --set scheduleFeed.sftp.rateLimit.entriesSoftLimit=150 >/dev/null 2>&1
          status=$?
          set -e
          [[ "${status}" -ne 0 ]] || fail "a soft entries limit not below the hard one must fail the render"
          dep=$(render)
          if grep -q 'SCHEDULE_SFTP_SAFELIST' <<<"${dep}"; then fail "no safelist by default"; fi
          dep=$(render --set 'scheduleFeed.sftp.defender.safelist={192.0.2.0/24,198.51.100.7}')
          has SCHEDULE_SFTP_SAFELIST '192.0.2.0/24 198.51.100.7'
          has SFTPGO_LOG_LEVEL debug
          has SFTPGO_LOG_UTC_TIME true
          dep=$(render --set scheduleFeed.sftp.defender.enabled=false --set scheduleFeed.sftp.rateLimit.average=0)
          has SFTPGO_COMMON__DEFENDER__ENABLED false
          if grep -q 'SFTPGO_COMMON__DEFENDER__THRESHOLD\|SFTPGO_COMMON__RATE_LIMITERS' <<<"${dep}"; then
            fail "a disabled defender and rate limiter must render no settings"
          fi

      # SFTPGo telemetry (on by default with metrics.enabled): the
      # sftp-metrics container port, a PodMonitor endpoint, the
      # monitoring-only NetworkPolicy port and the schedule-sftp alerts;
      # never a port on the NodePort Service, which keeps exactly one.
      - name: helm template (sftp telemetry)
        run: |
          set -euo pipefail
          render() {
            helm template distant-signal charts/distant-signal \
              --set trustConsumer.kafka.brokers=kafka.example.com:9094 \
              --set trustConsumer.kafka.topic=test-topic \
              --set trustConsumer.kafka.saslMechanism=PLAIN \
              --set enricher.llm.baseUrl=http://llm.example.com/v1 \
              --set enricher.llm.model=test-model \
              --set api.sso.issuerUrl=https://sso.example.com \
              --set api.sso.clientId=test-client \
              --set api.sso.clientSecret=test-secret \
              --set api.sso.redirectUrl=https://app.example.com/callback \
              --set api.sso.postLoginRedirectUrl=https://app.example.com/ \
              --set scheduleFeed.enabled=true \
              --set scheduleFeed.sftp.authMethod=password \
              --set metrics.enabled=true \
              --set metrics.podMonitor.enabled=true \
              --set metrics.prometheusRule.enabled=true \
              --set networkPolicy.enabled=true "$@"
          }
          fail() { echo "::error::$1"; exit 1; }
          dep=$(render --show-only templates/schedulefeed-deployment.yaml)
          grep -A1 'name: sftp-metrics' <<<"${dep}" | grep -q 'containerPort: 9097' || fail "sftp-metrics must be port 9097"
          grep -A1 'name: SFTPGO_TELEMETRY__BIND_PORT' <<<"${dep}" | grep -q 'value: "9097"' || fail "telemetry must bind 9097"
          grep -A1 'name: SFTPGO_TELEMETRY__BIND_ADDRESS' <<<"${dep}" | grep -q 'value: "0.0.0.0"' || fail "telemetry must bind all addresses"
          grep -A1 'name: SFTPGO_TELEMETRY__ENABLE_PROFILER' <<<"${dep}" | grep -q 'value: "false"' || fail "the profiler must stay off"
          svc=$(render --show-only templates/schedulefeed-service.yaml)
          ports=$(grep -c 'targetPort:' <<<"${svc}" || true)
          [[ "${ports}" -eq 1 ]] || fail "the schedulefeed Service must keep exactly one port"
          if grep -q '9097\|sftp-metrics' <<<"${svc}"; then fail "telemetry must not be on the Service"; fi
          pm=$(render --show-only templates/podmonitor.yaml)
          grep -q 'port: sftp-metrics' <<<"${pm}" || fail "the PodMonitor must scrape sftp-metrics"
          np=$(render --show-only templates/networkpolicy.yaml)
          grep -A60 'name: distant-signal-schedulefeed$' <<<"${np}" | grep -q 'port: 9097' \
            || fail "the schedulefeed NetworkPolicy must admit monitoring on 9097"
          rule=$(render --show-only templates/prometheusrule.yaml)
          for alert in DistantSignalSftpNoUpload DistantSignalSftpUploadErrors DistantSignalSftpUserStoreDown; do
            grep -q "alert: ${alert}\$" <<<"${rule}" || fail "missing ${alert}"
          done
          off=$(render --set scheduleFeed.sftp.telemetry.enabled=false)
          if grep -q 'sftp-metrics\|SFTPGO_TELEMETRY\|alert: DistantSignalSftp' <<<"${off}"; then
            fail "telemetry.enabled=false must render no telemetry, endpoint or alerts"
          fi
          nometrics=$(render --set metrics.enabled=false --show-only templates/schedulefeed-deployment.yaml)
          if grep -q 'sftp-metrics\|SFTPGO_TELEMETRY' <<<"${nometrics}"; then
            fail "telemetry needs metrics.enabled"
          fi

      # movement-relay is on by default (the three movement consumers read
      # only its stream). Empty movementRelay.kafka.* fields fall back to
      # trustConsumer.kafka.*, including trust-consumer's SASL credential;
      # its own values win. With no Kafka config anywhere the render must
      # fail with a clear error, enabled=false must render nothing
      # movement-relay-shaped, and the removed consumer Kafka backend
      # (movementFeed=kafka, Deploy C) must fail the render while the
      # consumers get no KAFKA_* env at all.
      - name: helm template (movement-relay default and fallback)
        run: |
          set -euo pipefail
          base=(
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          kafka=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }
          # expect_env NAME VALUE MESSAGE <<<"${manifest}": fail unless env var
          # NAME is set to VALUE.
          expect_env() {
            if ! grep -A1 "name: ${1}\$" | grep -q "value: \"${2}\""; then fail "${3}"; fi
          }

          relay=$(render "${kafka[@]}" --show-only templates/movement-relay-deployment.yaml)
          expect_env KAFKA_BROKERS kafka.example.com:9094 "brokers must fall back to trustConsumer" <<<"${relay}"
          expect_env KAFKA_TOPIC test-topic "topic must fall back to trustConsumer" <<<"${relay}"
          expect_env KAFKA_CONSUMER_GROUP distant-signal-trust-consumer \
            "consumer group must fall back to trustConsumer" <<<"${relay}"
          grep -A4 'name: KAFKA_SASL_USERNAME' <<<"${relay}" | grep -q 'key: kafka-sasl-username' \
            || fail "with no credential of its own the relay must read trust-consumer's"

          own=$(render "${kafka[@]}" --set movementRelay.kafka.brokers=relay.example.com:9094 \
            --set movementRelay.kafka.consumerGroup=relay-group \
            --set movementRelay.kafka.saslUsername=u --set movementRelay.kafka.saslPassword=p)
          expect_env KAFKA_BROKERS relay.example.com:9094 "movementRelay.kafka.brokers must win" <<<"${own}"
          expect_env KAFKA_CONSUMER_GROUP relay-group "movementRelay.kafka.consumerGroup must win" <<<"${own}"
          grep -A4 'name: KAFKA_SASL_USERNAME' <<<"${own}" | grep -q 'key: movement-relay-kafka-sasl-username' \
            || fail "an inline relay credential must use the movement-relay-kafka-sasl-* keys"
          grep -q '  movement-relay-kafka-sasl-username: ' <<<"${own}" || fail "inline relay credential not rendered"

          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if err=$(render 2>&1 >/dev/null); then fail "no Kafka config but the render succeeded"; fi
          grep -q 'movementRelay.enabled=false' <<<"${err}" || fail "missing-Kafka error must mention the opt-out: ${err}"

          off=$(render --set movementRelay.enabled=false)
          if grep -E -q 'component: movement-relay|name: distant-signal-movement-relay|movement-relay-kafka-sasl' <<<"${off}"; then fail "movementRelay.enabled=false still rendered movement-relay"; fi

          for consumer in trustConsumer fullCoverageConsumer; do
            # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
            if err=$(render "${kafka[@]}" --set "${consumer}.movementFeed=kafka" 2>&1 >/dev/null); then
              fail "${consumer}.movementFeed=kafka must fail the render (Deploy C)"
            fi
            grep -q 'no longer supported' <<<"${err}" || fail "unexpected ${consumer}.movementFeed error: ${err}"
            # A leftover explicit redis-stream (production's old value) still renders.
            render "${kafka[@]}" --set "${consumer}.movementFeed=redis-stream" >/dev/null
          done
          for template in trust-consumer-deployment full-coverage-consumer-deployment; do
            consumer=$(render "${kafka[@]}" --show-only "templates/${template}.yaml")
            if grep -E -q 'name: (KAFKA_|MOVEMENT_FEED_BACKEND)' <<<"${consumer}"; then
              fail "${template} must get no Kafka settings (Deploy C)"
            fi
          done
          expect_env MOVEMENT_CONSUMER_GROUPS trust-consumer,full-coverage-consumer,trust-event-backlog \
            "movement-relay must create every consumer group" <<<"${relay}"

      # INF-3 Redis AUTH. Off (the default) must render no REDIS_PASSWORD,
      # no --requirepass and no redis-password Secret key. On must give all
      # six Redis clients REDIS_PASSWORD from the Secret (never inline),
      # start Redis with --requirepass and authenticate its probes;
      # requirePass=false (rollout step 1) must leave the Redis pod alone;
      # an external Redis without existingSecret must fail the render.
      - name: helm template (redis auth)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }

          off=$(render)
          if grep -E -q 'REDIS_PASSWORD|REDISCLI_AUTH|requirepass|redis-password' <<<"${off}"; then
            fail "redis.auth disabled but auth settings rendered"
          fi

          on=$(render --set redis.auth.enabled=true \
            --set redis.auth.existingSecret=redis-auth --set redis.auth.existingSecretKey=pw)
          n_pw=$(grep -c 'name: REDIS_PASSWORD' <<<"${on}" || true)
          [[ "${n_pw}" -eq 7 ]] \
            || fail "expected REDIS_PASSWORD on the six clients plus redis"
          n_secret=$(grep -A3 'name: REDIS_PASSWORD' <<<"${on}" | grep -c 'name: redis-auth' || true)
          [[ "${n_secret}" -eq 7 ]] \
            || fail "REDIS_PASSWORD must come from redis.auth.existingSecret"
          grep -A1 'name: REDIS_URL' <<<"${on}" | grep 'value:' | grep -q -v '@' \
            || fail "REDIS_URL must stay credential-free"
          redis=$(render --set redis.auth.enabled=true --set redis.auth.existingSecret=redis-auth \
            --show-only templates/redis-deployment.yaml)
          # shellcheck disable=SC2016 # "$(REDIS_PASSWORD)" is Kubernetes env-var syntax matched literally, not a shell expansion
          grep -A1 -- '- --requirepass' <<<"${redis}" | grep -q -- '- "$(REDIS_PASSWORD)"' \
            || fail "redis must start with --requirepass from the Secret"
          grep -q 'name: REDISCLI_AUTH' <<<"${redis}" || fail "redis probes must authenticate"

          gen=$(render --set redis.auth.enabled=true)
          grep -q '  redis-password: ' <<<"${gen}" || fail "chart-generated redis-password missing"

          step1=$(render --set redis.auth.enabled=true --set redis.auth.requirePass=false \
            --set redis.auth.existingSecret=redis-auth --show-only templates/redis-deployment.yaml)
          redis_default=$(render --show-only templates/redis-deployment.yaml)
          [[ "${step1}" = "${redis_default}" ]] \
            || fail "requirePass=false must leave the Redis Deployment unchanged"

          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if render --set redis.enabled=false --set redis.externalUrl=redis://ext:6379 \
              --set redis.auth.enabled=true >/dev/null 2>&1; then
            fail "external Redis with auth but no existingSecret must fail the render"
          fi
          render --set redis.enabled=false --set redis.externalUrl=redis://ext:6379 \
            --set redis.auth.enabled=true --set redis.auth.existingSecret=ext >/dev/null
          render --set redis.auth.enabled=true --set networkPolicy.enabled=true >/dev/null

      # postgresql.roles (docs/postgres-app-role.md): off renders nothing new;
      # on, every pool is the app role, api migrates as the owner, the
      # pgBackRest CronJobs run as the backup role, and turning it on without
      # initScript leaves the Postgres pod (and so Postgres) untouched.
      - name: helm template (postgres roles)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          pgbackrest=(
            --set postgresql.pgbackrest.enabled=true
            --set postgresql.pgbackrest.image.repository=registry.example.com/postgres-pgbackrest
            --set postgresql.pgbackrest.image.tag=pg16.15-pgbackrest2.59.1-tini0.19.0
            --set postgresql.pgbackrest.repo.path=/test/pgbackrest
            --set postgresql.pgbackrest.repo.s3.endpoint=s3.example.com
            --set postgresql.pgbackrest.repo.s3.bucket=test-bucket
            --set postgresql.pgbackrest.repo.s3.existingSecret=pgbackrest-creds
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }

          off=$(render "${pgbackrest[@]}" --set networkPolicy.enabled=true)
          if grep -E -q 'postgres-roles|MIGRATION_DATABASE_URL|DS_PG_|_owner|_app:|PGBACKREST_PG1_USER=' <<<"${off}"; then
            fail "postgresql.roles disabled but role settings rendered"
          fi
          # The DATABASE_URL / MIGRATION_DATABASE_URL values of every container.
          off_urls=$(grep -A1 -E 'name: (MIGRATION_)?DATABASE_URL$' <<<"${off}")
          n_super=$(grep -c 'value: "postgres://distant_signal:' <<<"${off_urls}" || true)
          [[ "${n_super}" -eq 4 ]] || fail "roles off: the four DATABASE_URLs must stay the superuser's"

          on=$(render "${pgbackrest[@]}" --set networkPolicy.enabled=true \
            --set postgresql.roles.enabled=true --set postgresql.roles.setupJob.enabled=true \
            --set postgresql.roles.app.existingSecret=pg-roles \
            --set postgresql.roles.owner.existingSecret=pg-roles)
          on_urls=$(grep -A1 -E 'name: (MIGRATION_)?DATABASE_URL$' <<<"${on}")
          # shellcheck disable=SC2016 # "$(PGPASSWORD)" is Kubernetes env-var syntax matched literally, not a shell expansion
          n_app=$(grep -c 'postgres://distant_signal_app:\$(PGPASSWORD)@' <<<"${on_urls}" || true)
          [[ "${n_app}" -eq 4 ]] || fail "api, aggregator, enricher and notifier must connect as the app role"
          # shellcheck disable=SC2016 # "$(PG_MIGRATION_PASSWORD)" is Kubernetes env-var syntax, matched literally
          n_owner=$(grep -c 'postgres://distant_signal_owner:\$(PG_MIGRATION_PASSWORD)@' <<<"${on_urls}" || true)
          [[ "${n_owner}" -eq 1 ]] || fail "only api's MIGRATION_DATABASE_URL may be the owner role"
          grep -A4 'name: PGPASSWORD$' <<<"${on}" | grep -q 'key: postgres-app-password' \
            || fail "PGPASSWORD must come from the app role's Secret key"
          grep -A3 'name: PG_MIGRATION_PASSWORD$' <<<"${on}" | grep -q 'name: pg-roles' \
            || fail "PG_MIGRATION_PASSWORD must come from roles.owner.existingSecret"
          n_cron=$(grep -c -- '- "PGBACKREST_PG1_USER=distant_signal_backup"' <<<"${on}" || true)
          [[ "${n_cron}" -eq 4 ]] || fail "all four pgBackRest CronJobs must run as the backup role"
          grep -q 'helm.sh/hook: post-install,post-upgrade' <<<"${on}" || fail "the setup Job must be a hook"
          grep -q "'--variable=app_connection_limit=75'" <<<"${on}" \
            || fail "app CONNECTION LIMIT must default to the chart's pools (50 + 10 + 5 + 5) + 5"
          grep -q "'--variable=owner_connection_limit=3'" <<<"${on}" \
            || fail "owner CONNECTION LIMIT must default to api.replicaCount + 2"
          grep -q 'mountPath: /docker-entrypoint-initdb.d' <<<"${on}" || fail "initScript must mount the initdb script"
          np=$(render --set networkPolicy.enabled=true --set postgresql.roles.setupJob.enabled=true \
            --show-only templates/networkpolicy.yaml)
          grep -q -- '- postgres-roles$' <<<"${np}" || fail "the setup Job must be allowed into Postgres"
          secret=$(render --set postgresql.roles.setupJob.enabled=true --show-only templates/secret.yaml)
          for key in owner app exporter dump backup; do
            grep -q "  postgres-${key}-password: " <<<"${secret}" || fail "chart-generated postgres-${key}-password missing"
          done
          job=$(render --set postgresql.roles.setupJob.enabled=true \
            --set postgresql.roles.backup.existingSecret=pg-backup --show-only templates/postgres-roles.yaml)
          grep -A4 'name: DS_PG_BACKUP_PASSWORD$' <<<"${job}" | grep -q 'name: pg-backup' \
            || fail "the setup Job must read the backup password from roles.backup.existingSecret"
          grep -A4 'name: DS_PG_BACKUP_PASSWORD$' <<<"${job}" | grep -q 'key: postgres-backup-password' \
            || fail "the backup password key must default to postgres-backup-password"
          if grep -q 'PASSWORD=' <<<"${on}"; then fail "no password may be passed on a command line"; fi

          # Flipping roles.enabled on an existing cluster (initScript off) must
          # not touch the Postgres pod, so Postgres does not restart.
          sts_off=$(render "${pgbackrest[@]}" --show-only templates/postgres-statefulset.yaml)
          sts_on=$(render "${pgbackrest[@]}" --set postgresql.roles.enabled=true \
            --set postgresql.roles.initScript=false --show-only templates/postgres-statefulset.yaml)
          [[ "${sts_off}" = "${sts_on}" ]] || fail "roles.enabled with initScript=false must leave the StatefulSet unchanged"

          limit=$(render --set postgresql.roles.enabled=true --set postgresql.roles.app.connectionLimit=40)
          grep -q "'--variable=app_connection_limit=40'" <<<"${limit}" || fail "an explicit connectionLimit must win"
          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if render --set postgresql.roles.enabled=true --set postgresql.roles.app.connectionLimit=lots \
              >/dev/null 2>&1; then
            fail "a non-numeric connectionLimit must fail the render"
          fi
          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if render --set postgresql.enabled=false --set externalDatabase.url=postgres://x@db/ds \
              --set postgresql.roles.enabled=true >/dev/null 2>&1; then
            fail "postgresql.roles.enabled with an external database must fail the render"
          fi

      # Ingest plan 1B.4: migrate.job (off by default) renders a
      # pre-upgrade,post-install hook Job that holds the schema owner's
      # credentials; with api.migrateOnStartup false the api has none. Its
      # hook NetworkPolicies, and the role setup Job's egress policy, let
      # both Jobs reach Postgres.
      - name: helm template (migrate hook Job)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          roles=(
            --set postgresql.roles.enabled=true --set postgresql.roles.setupJob.enabled=true
            --set networkPolicy.enabled=true --set networkPolicy.egress.enabled=true
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }
          doc() { awk -v k="$1" -v n="$2" 'BEGIN{RS="\n---\n"} $0 ~ "\nkind: " k "\n" && $0 ~ "\n  name: " n "\n" {print}'; }

          off=$(render "${roles[@]}")
          if grep -E -q 'migrate-job.yaml|API_MIGRATE_ON_STARTUP|component: migrate' <<<"${off}"; then
            fail "migrate.job off must render nothing of it"
          fi

          on=$(render "${roles[@]}" --set migrate.job.enabled=true)
          job=$(doc Job distant-signal-migrate <<<"${on}")
          [[ -n "${job}" ]] || fail "no migrate Job rendered"
          for want in 'helm.sh/hook: pre-upgrade,post-install' 'helm.sh/hook-weight: "-5"' \
              'helm.sh/hook-delete-policy: before-hook-creation' 'backoffLimit: 1' \
              'activeDeadlineSeconds: 900' 'until pg_isready' '- /usr/local/bin/ds-migrate' '- run'; do
            grep -q -F -- "${want}" <<<"${job}" || fail "migrate Job lacks: ${want}"
          done
          urls=$(grep -A1 'name: MIGRATION_DATABASE_URL$' <<<"${job}")
          n=$(grep -c 'value: "postgres://distant_signal_owner:' <<<"${urls}" || true)
          [[ "${n}" -eq 2 ]] || fail "the Job's wait and migrate containers must use the owner role"
          api=$(doc Deployment distant-signal-api <<<"${on}")
          grep -q 'name: MIGRATION_DATABASE_URL$' <<<"${api}" \
            || fail "with migrateOnStartup still true the api keeps MIGRATION_DATABASE_URL"

          moved=$(render "${roles[@]}" --set migrate.job.enabled=true --set api.migrateOnStartup=false)
          api=$(doc Deployment distant-signal-api <<<"${moved}")
          if grep -E -q 'MIGRATION_DATABASE_URL|PG_MIGRATION_PASSWORD|distant_signal_owner' <<<"${api}"; then
            fail "migrateOnStartup=false: the api must hold no owner credentials"
          fi
          grep -A1 'name: API_MIGRATE_ON_STARTUP$' <<<"${api}" | grep -q 'value: "false"' \
            || fail "migrateOnStartup=false must render API_MIGRATE_ON_STARTUP=false"
          deployments=$(awk 'BEGIN{RS="\n---\n"} /\nkind: (Deployment|CronJob)\n/ {print}' <<<"${moved}")
          if grep -q 'postgres-owner-password' <<<"${deployments}"; then
            fail "no Deployment or CronJob may read the owner's password"
          fi

          # The hook policies exist before the Job (weight -10) and admit it.
          np=$(doc NetworkPolicy distant-signal-postgres-from-migrate <<<"${moved}")
          grep -q 'helm.sh/hook: pre-install,pre-upgrade' <<<"${np}" || fail "the Postgres admission must be a hook"
          grep -q 'helm.sh/hook-weight: "-10"' <<<"${np}" || fail "the Postgres admission must precede the Job"
          grep -q 'app.kubernetes.io/component: migrate' <<<"${np}" || fail "the Postgres admission must name the Job's pods"
          for c in migrate postgres-roles; do
            eg=$(doc NetworkPolicy "distant-signal-${c}" <<<"${moved}")
            grep -q 'port: 5432' <<<"${eg}" || fail "${c} must be allowed out to Postgres"
          done
          pg=$(doc NetworkPolicy distant-signal-postgres <<<"${moved}")
          grep -q -- '- postgres-roles$' <<<"${pg}" || fail "the setup Job must be admitted to Postgres"

          # Without the role split the Job migrates as the bootstrap superuser,
          # with an external database as its URL.
          plain=$(render --set migrate.job.enabled=true --show-only templates/migrate-job.yaml)
          # shellcheck disable=SC2016 # "$(PG_MIGRATION_PASSWORD)" is Kubernetes env-var syntax, matched literally
          grep -A1 'name: MIGRATION_DATABASE_URL$' <<<"${plain}" \
            | grep -q 'value: "postgres://distant_signal:\$(PG_MIGRATION_PASSWORD)@' \
            || fail "roles off: the Job must migrate as postgresql.auth.username"
          ext=$(render --set migrate.job.enabled=true --set postgresql.enabled=false \
            --set externalDatabase.existingSecret=ext-db --show-only templates/migrate-job.yaml)
          grep -A4 'name: MIGRATION_DATABASE_URL$' <<<"${ext}" | grep -q 'name: ext-db' \
            || fail "an external database: the Job must read externalDatabase.existingSecret"

          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if render --set api.migrateOnStartup=false >/dev/null 2>&1; then
            fail "api.migrateOnStartup=false without migrate.job.enabled must fail the render"
          fi

      # Ingest plan 1B.10: api.strategy.type stays Recreate by default;
      # RollingUpdate (maxSurge 1, maxUnavailable 0) renders only once the
      # hook Job migrates instead of the api, and its surge pod's pool counts
      # in the INF-7 connection budget.
      - name: helm template (api rollout strategy)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
            --show-only templates/api-deployment.yaml
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }
          job=(--set migrate.job.enabled=true --set api.migrateOnStartup=false)

          out=$(render)
          grep -q '^    type: Recreate$' <<<"${out}" || fail "the default strategy must stay Recreate"
          if grep -q 'rollingUpdate:' <<<"${out}"; then fail "Recreate must render no rollingUpdate"; fi

          out=$(render "${job[@]}" --set api.strategy.type=RollingUpdate --set api.database.maxConnections=35)
          grep -q '^    type: RollingUpdate$' <<<"${out}" || fail "RollingUpdate must render"
          grep -A2 'rollingUpdate:' <<<"${out}" | grep -q 'maxSurge: 1' || fail "maxSurge must be 1"
          grep -A2 'rollingUpdate:' <<<"${out}" | grep -q 'maxUnavailable: 0' || fail "maxUnavailable must be 0"

          # shellcheck disable=SC2310 # each render is expected to fail; that failure is the assertion
          {
            if render --set api.strategy.type=RollingUpdate --set api.database.maxConnections=35 >/dev/null 2>&1; then
              fail "RollingUpdate while the api migrates at startup must fail the render"
            fi
            if render --set migrate.job.enabled=true --set api.strategy.type=RollingUpdate \
                --set api.database.maxConnections=35 >/dev/null 2>&1; then
              fail "RollingUpdate with the Job but migrateOnStartup still true must fail the render"
            fi
            if render "${job[@]}" --set api.strategy.type=Rolling >/dev/null 2>&1; then
              fail "an unknown strategy type must fail the render"
            fi
            # 2 pods x 36 + 21 other pools + 5 reserved = 98 > 97; x 35 = 96 fits.
            if render "${job[@]}" --set api.strategy.type=RollingUpdate \
                --set api.database.maxConnections=36 >/dev/null 2>&1; then
              fail "the surge pod's pool must count in the connection budget"
            fi
          }

      # Reboot resilience: redis must roll with Recreate (single RWO AOF
      # volume, INF-1); postgres needs a startupProbe so WAL redo is never
      # killed by liveness (INF-4); the frontend probes must hit the
      # dependency-free /healthz (FE-1); every background worker needs a
      # /livez liveness probe (SVC-08/INF-9), and the DB-backed ones a
      # /healthz readiness probe (INF-5).
      - name: helm template (reboot resilience probes)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }

          redis=$(render --show-only templates/redis-deployment.yaml)
          grep -A1 '^  strategy:' <<<"${redis}" | grep -q 'type: Recreate' \
            || fail "redis Deployment must use strategy Recreate"

          pg=$(render --show-only templates/postgres-statefulset.yaml)
          grep -A5 'startupProbe:' <<<"${pg}" | grep -q 'pg_isready' \
            || fail "postgres must have a pg_isready startupProbe"
          grep -A10 'startupProbe:' <<<"${pg}" | grep -q 'failureThreshold: 90' \
            || fail "postgres startupProbe budget must default to 90 x 10s"

          api=$(render --show-only templates/api-deployment.yaml)
          grep -A6 'startupProbe:' <<<"${api}" | grep -q 'periodSeconds: 2' \
            || fail "api startupProbe period must default to 2s"
          grep -A6 'startupProbe:' <<<"${api}" | grep -q 'failureThreshold: 450' \
            || fail "api startupProbe budget must default to 450 x 2s (900s, matching postgres)"

          fe=$(render --show-only templates/frontend-deployment.yaml)
          n_healthz=$(grep -c 'path: /healthz' <<<"${fe}" || true)
          [[ "${n_healthz}" -eq 2 ]] \
            || fail "frontend readiness and liveness must both hit /healthz"

          for t in aggregator notifier enricher; do
            out=$(render --show-only "templates/${t}-deployment.yaml")
            grep -A2 'livenessProbe:' <<<"${out}" | grep -q 'path: /livez' \
              || fail "${t} needs a /livez liveness probe"
            grep -A2 'readinessProbe:' <<<"${out}" | grep -q 'path: /healthz' \
              || fail "${t} needs a /healthz readiness probe"
            grep -q 'name: HEALTH_BIND_URL' <<<"${out}" || fail "${t} needs HEALTH_BIND_URL"
          done

          # The movement-stream consumers and movement-relay: /healthz is
          # readiness (needs Redis/Kafka), /livez is liveness (progress only).
          # Liveness on /healthz killed them whenever the Redis pod was
          # recreated in the same rollout.
          for t in trust-consumer trust-backlog-consumer full-coverage-consumer movement-relay; do
            out=$(render --show-only "templates/${t}-deployment.yaml")
            grep -A2 'livenessProbe:' <<<"${out}" | grep -q 'path: /livez' \
              || fail "${t} liveness must hit /livez, not the Redis/Kafka-dependent /healthz"
            grep -A2 'readinessProbe:' <<<"${out}" | grep -q 'path: /healthz' \
              || fail "${t} needs a /healthz readiness probe"
            grep -q 'name: PROGRESS_STALL_SECS' <<<"${out}" || fail "${t} needs PROGRESS_STALL_SECS"
          done

          pollers=$(render -f charts/distant-signal/values-example.yaml \
            --set pollerIrishRailGtfs.enabled=true \
            --set pollerIrishRailLive.enabled=true \
            --set pollerNirStations.enabled=true \
            --show-only templates/poller-deployments.yaml \
            --show-only templates/poller-irish-rail-gtfs-deployment.yaml \
            --show-only templates/poller-irish-rail-live-deployment.yaml \
            --show-only templates/poller-nir-stations-deployment.yaml)
          deployments=$(grep -c '^kind: Deployment' <<<"${pollers}")
          probes=$(grep -c 'path: /livez' <<<"${pollers}")
          [[ "${deployments}" -ge 4 ]] || fail "expected the pollers to render, got ${deployments}"
          [[ "${probes}" -eq "${deployments}" ]] \
            || fail "every poller needs a /livez liveness probe (${probes} of ${deployments})"

          feed=$(render --set scheduleFeed.enabled=true --set scheduleFeed.sftp.authMethod=password \
            --show-only templates/schedulefeed-deployment.yaml)
          n_livez=$(grep -c 'path: /livez' <<<"${feed}" || true)
          [[ "${n_livez}" -eq 2 ]] \
            || fail "schedulefeed ingest and reference need /livez liveness probes"
          grep -q 'tcpSocket:' <<<"${feed}" || fail "schedulefeed sftp needs a tcpSocket liveness probe"
          grep -A1 'name: HEALTH_BIND_URL' <<<"${feed}" | grep -q '0.0.0.0:8091' \
            || fail "schedulefeed reference must bind its own health port"

      # metrics.prometheusRule: disabled (the default) must render no
      # PrometheusRule; enabled must render one whose every alert name
      # starts with `DistantSignal` -- the cluster's own rules
      # (Ranma-Config) own every other name, and dedupe against this prefix.
      - name: helm template (PrometheusRule)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          disabled=$(helm template distant-signal charts/distant-signal "${base[@]}")
          if grep -q 'kind: PrometheusRule' <<<"${disabled}"; then
            echo "prometheusRule disabled but a PrometheusRule rendered" >&2; exit 1
          fi
          rule=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --set metrics.prometheusRule.enabled=true \
            --show-only templates/prometheusrule.yaml)
          grep -q 'kind: PrometheusRule' <<<"${rule}"
          names=$(sed -n 's/^ *- alert: *//p' <<<"${rule}")
          count=$(grep -c . <<<"${names}")
          if [[ "${count}" -lt 9 ]]; then
            echo "expected at least 9 alerts, got ${count}:" >&2; echo "${names}" >&2; exit 1
          fi
          if bad=$(grep -v '^DistantSignal' <<<"${names}"); then
            echo "alert names must start with DistantSignal:" >&2; echo "${bad}" >&2; exit 1
          fi
          # No "new series" clause (`x unless x offset <window>`): the
          # counters are registered at 0 on startup, and every rollout makes
          # new per-pod series, so that clause fired on every rollout.
          if grep -n ' unless ' <<<"${rule}"; then
            echo "PrometheusRule must not use an 'x unless x offset' new-series clause" >&2; exit 1
          fi
          echo "${names}"
          # 2026-10-01 outage: a critical DistantSignalPostgresDown on pg_up
          # or, with the bundled Postgres, its StatefulSet's ready replicas.
          grep -q 'max by (namespace) (pg_up{namespace="[^"]*"}) == 0$' <<<"${rule}"
          grep -q 'kube_statefulset_status_replicas_ready{namespace="[^"]*", statefulset="distant-signal-postgres"}) < 1$' <<<"${rule}"
          external_pg=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --set metrics.prometheusRule.enabled=true \
            --set postgresql.enabled=false \
            --set externalDatabase.url=postgres://u:p@db.example.com/ds \
            --set metrics.prometheusRule.postgresDown.pgUpSelector='job="pg"' \
            --show-only templates/prometheusrule.yaml)
          grep -q 'pg_up{namespace="[^"]*", job="pg"}' <<<"${external_pg}"
          if grep -q 'kube_statefulset_status_replicas_ready' <<<"${external_pg}"; then
            echo "PostgresDown must not read the bundled StatefulSet with postgresql.enabled=false" >&2; exit 1
          fi
          grep -q 'min by (namespace) (distant_signal_api_db_up{namespace="[^"]*"}) == 0$' <<<"${rule}"
          # The three consumers' failed api calls (one recorded series each).
          n_api=$(grep -c 'label_replace(sum by (namespace) (increase(distant_signal_[a-z_]*_errors_total{namespace="[^"]*", operation=~"[a-z_|]*"}\[5m\])), "consumer"' <<<"${rule}" || true)
          [[ "${n_api}" -eq 3 ]] || { echo "expected 3 consumer api-error clauses, got ${n_api}" >&2; exit 1; }
          grep -q 'alert: DistantSignalConsumerApiCallsFailing' <<<"${rule}"
          # No successful aggregator / notifier cycle for 15m.
          grep -q 'time() - max by (namespace, cycle) (distant_signal_aggregator_last_success_timestamp_seconds{namespace="[^"]*"}) > 900$' <<<"${rule}"
          grep -q 'distant_signal_notifier_last_success_timestamp_seconds{namespace="[^"]*", cycle!="template_sweep"}) > 900$' <<<"${rule}"
          # R-040/R-097: stuck entries and TRUST parse drops alert, one
          # parse-drop clause per consumer.
          grep -q 'increase(distant_signal_movement_feed_long_pending_total{namespace="[^"]*"}\[1h\])) > 0$' <<<"${rule}"
          n_parse=$(grep -c '_errors_total{namespace="[^"]*", operation="parse_envelope"}\[1h\])), "consumer"' <<<"${rule}" || true)
          [[ "${n_parse}" -eq 3 ]] || { echo "expected 3 parse_envelope clauses, got ${n_parse}" >&2; exit 1; }
          # Open sign-up: a burst of new accounts alerts, and the metric and
          # threshold come from values.
          grep -q 'alert: DistantSignalUserSignupSpike' <<<"${rule}"
          grep -q 'increase(distant_signal_api_users_created_total{namespace="[^"]*"}\[1h\])) > 20$' <<<"${rule}"
          spike=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --set metrics.prometheusRule.enabled=true \
            --set metrics.prometheusRule.userSignupSpike.metric=users_total \
            --set metrics.prometheusRule.userSignupSpike.threshold=5 \
            --show-only templates/prometheusrule.yaml)
          grep -q 'increase(users_total{namespace="[^"]*"}\[1h\])) > 5$' <<<"${spike}"
          # SVC-04/SVC-08: the poller rules render (as <fullname>-pollers)
          # once a poller is enabled.
          pollers=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --set metrics.prometheusRule.enabled=true \
            --set pollers.ldbws.enabled=true \
            --set pollers.ldbws.baseUrl=https://ldbws.example.com \
            --show-only templates/prometheusrule.yaml)
          grep -q 'alert: DistantSignalPollerFailing' <<<"${pollers}"
          # ...including the mostly-failing clause (failure ratio over 15m).
          grep -q '> bool 0.5,$' <<<"${pollers}"
          grep -q 'alert: DistantSignalLdbwsStationStale' <<<"${pollers}"
          grep -q 'alert: DistantSignalLdbwsInvalidCrs' <<<"${pollers}"
          grep -q 'max by (namespace, crs) (distant_signal_ldbws_invalid_crs_station{' <<<"${pollers}"
          # ...and neither LDBWS alert renders with the ldbws poller off.
          no_ldbws=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --set metrics.prometheusRule.enabled=true \
            --set pollers.incidents.enabled=true \
            --set pollers.incidents.baseUrl=https://incidents.example.com \
            --show-only templates/prometheusrule.yaml)
          grep -q 'alert: DistantSignalPollerFailing' <<<"${no_ldbws}"
          if grep -q 'alert: DistantSignalLdbws' <<<"${no_ldbws}"; then
            echo "LDBWS alerts rendered with pollers.ldbws disabled" >&2; exit 1
          fi
          # DistantSignalCorpusStale renders only with CORPUS ingest on.
          feed=(--set metrics.prometheusRule.enabled=true
            --set scheduleFeed.enabled=true --set scheduleFeed.sftp.authMethod=password
            --show-only templates/prometheusrule.yaml)
          corpus_off=$(helm template distant-signal charts/distant-signal "${base[@]}" "${feed[@]}")
          grep -q 'alert: DistantSignalScheduleReferencePublishStale' <<<"${corpus_off}"
          if grep -q 'alert: DistantSignalCorpusStale' <<<"${corpus_off}"; then
            echo "DistantSignalCorpusStale rendered with scheduleFeed.corpus disabled" >&2; exit 1
          fi
          corpus_on=$(helm template distant-signal charts/distant-signal "${base[@]}" "${feed[@]}" \
            --set scheduleFeed.corpus.enabled=true)
          grep -q 'alert: DistantSignalCorpusStale' <<<"${corpus_on}"
          grep -q 'distant_signal_api_corpus_last_delivered_at_seconds{.*> 3888000$' <<<"${corpus_on}"

      # LEG-18 LDBWS volume knobs: off by default, and while off none of
      # their env vars may render (production behaviour is unchanged); set,
      # each renders on the ldbws poller.
      - name: helm template (LDBWS volume knobs)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
            --set pollers.ldbws.enabled=true
            --set pollers.ldbws.baseUrl=https://ldbws.example.com
          )
          knobs='HOURLY_REQUEST_BUDGET|SAMPLE_PINNED_LINES_ONLY|SAMPLE_MAX_STATIONS'
          off=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --show-only templates/poller-deployments.yaml)
          if grep -nE "name: (${knobs})\$" <<<"${off}"; then
            echo "LDBWS volume knobs are off by default but their env rendered" >&2; exit 1
          fi
          on=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --set pollers.ldbws.hourlyRequestBudget=5000 \
            --set pollers.ldbws.samplePinnedLinesOnly=true \
            --set pollers.ldbws.sampleMaxStations=150 \
            --show-only templates/poller-deployments.yaml)
          grep -A1 'name: HOURLY_REQUEST_BUDGET$' <<<"${on}" | grep -q 'value: "5000"'
          grep -A1 'name: SAMPLE_PINNED_LINES_ONLY$' <<<"${on}" | grep -q 'value: "true"'
          grep -A1 'name: SAMPLE_MAX_STATIONS$' <<<"${on}" | grep -q 'value: "150"'

      # The PodMonitor must select every workload that serves a port named
      # "metrics". trust-backlog-consumer was missing (INF-6), so the
      # DistantSignalDeadLetter* alerts could never fire for it.
      - name: helm template (PodMonitor)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
            --set metrics.podMonitor.enabled=true
          )
          pm=$(helm template distant-signal charts/distant-signal "${base[@]}" \
            --show-only templates/podmonitor.yaml)
          for c in api aggregator enricher notifier trust-consumer trust-backlog-consumer \
              full-coverage-consumer movement-relay; do
            grep -q -- "- ${c}\$" <<<"${pm}" || { echo "PodMonitor must select ${c}" >&2; exit 1; }
          done

      # Ingest plan 1B.9: ingestWriter (off by default) is one Recreate
      # replica with its own NetworkPolicy (egress to Postgres only),
      # PodMonitor entry, IngestWriterDown alert and, with perService, the
      # distant_signal_writer role; its loops stay off until loops.enabled.
      - name: helm template (ingest-writer)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
            --set metrics.podMonitor.enabled=true --set metrics.prometheusRule.enabled=true
            --set networkPolicy.enabled=true --set networkPolicy.egress.enabled=true
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }
          doc() { awk -v k="$1" -v n="$2" 'BEGIN{RS="\n---\n"} $0 ~ "\nkind: " k "\n" && $0 ~ "\n  name: " n "\n" {print}'; }
          env_is() { grep -A1 "name: $2\$" <<<"$1" | grep -q "value: \"$3\"" || fail "$2 must be \"$3\""; }

          off=$(render)
          if grep -q -i 'ingest-writer\|IngestWriter' <<<"${off}"; then fail "ingestWriter off must render nothing of it"; fi

          on=$(render --set ingestWriter.enabled=true --set ingestWriter.image.tag=test)
          dep=$(doc Deployment distant-signal-ingest-writer <<<"${on}")
          [[ -n "${dep}" ]] || fail "no ingest-writer Deployment rendered"
          grep -q '^  replicas: 1$' <<<"${dep}" || fail "the ingest-writer must run one replica"
          grep -q '^    type: Recreate$' <<<"${dep}" || fail "the ingest-writer must roll with Recreate"
          grep -q 'image: "ghcr.io/fasterspeeding/distant-signal/ingest-writer:test"' <<<"${dep}" \
            || fail "ingestWriter.image must set the image"
          grep -q 'path: /livez' <<<"${dep}" || fail "the ingest-writer needs the worker liveness probe"
          env_is "${dep}" INGEST_WRITER_LOOPS false
          env_is "${dep}" RECONCILIATION_SWEEP_INTERVAL_SECS 300
          env_is "${dep}" DATABASE_MAX_CONNECTIONS 6
          loops=$(render --set ingestWriter.enabled=true --set ingestWriter.loops.enabled=true \
            --show-only templates/ingest-writer-deployment.yaml)
          env_is "${loops}" INGEST_WRITER_LOOPS true

          np=$(doc NetworkPolicy distant-signal-ingest-writer <<<"${on}")
          grep -q 'port: 5432' <<<"${np}" || fail "the ingest-writer must be allowed out to Postgres"
          if grep -q -E 'port: 6379|ipBlock' <<<"${np}"; then
            fail "phase 1B: the ingest-writer gets neither Redis nor the internet"
          fi
          pg=$(doc NetworkPolicy distant-signal-postgres <<<"${on}")
          grep -q -- '- ingest-writer$' <<<"${pg}" || fail "Postgres must admit the ingest-writer"
          pm=$(doc PodMonitor distant-signal <<<"${on}")
          grep -q -- '- ingest-writer$' <<<"${pm}" || fail "the PodMonitor must select the ingest-writer"
          rule=$(doc PrometheusRule distant-signal <<<"${on}")
          grep -q 'alert: DistantSignalIngestWriterDown$' <<<"${rule}" || fail "IngestWriterDown must render"
          grep -q 'deployment="distant-signal-ingest-writer"' <<<"${rule}" || fail "IngestWriterDown must name the Deployment"

          # The writer role: created with perService, used only with connect.
          roles=(--set postgresql.roles.enabled=true --set postgresql.roles.setupJob.enabled=true
            --set postgresql.roles.perService.enabled=true)
          ps=$(render "${roles[@]}")
          grep -q "'--variable=writer_connection_limit=7'" <<<"${ps}" || fail "the writer role's limit must be its pool (6) + the lock session"
          grep -q 'name: DS_PG_WRITER_PASSWORD$' <<<"${ps}" || fail "the setup Job must get the writer's password"
          ps=$(render "${roles[@]}" --set ingestWriter.enabled=true)
          dep=$(doc Deployment distant-signal-ingest-writer <<<"${ps}")
          # shellcheck disable=SC2016 # "$(PGPASSWORD)" is Kubernetes env-var syntax, matched literally
          grep -q 'postgres://distant_signal_app:\$(PGPASSWORD)@' <<<"${dep}" || fail "without connect the ingest-writer connects as app"
          grep -q "'--variable=app_connection_limit=82'" <<<"${ps}" || fail "the writer's pool (6) and lock session must count in app's limit (75)"
          ps=$(render "${roles[@]}" --set ingestWriter.enabled=true --set postgresql.roles.perService.writer.connect=true)
          dep=$(doc Deployment distant-signal-ingest-writer <<<"${ps}")
          # shellcheck disable=SC2016 # as above
          grep -q 'postgres://distant_signal_writer:\$(PGPASSWORD)@' <<<"${dep}" \
            || fail "writer.connect: the ingest-writer must connect as distant_signal_writer"
          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if render "${roles[@]}" --set postgresql.roles.perService.writer.connect=true >/dev/null 2>&1; then
            fail "writer.connect without ingestWriter.enabled must fail the render"
          fi

      # INF-7: with the bundled Postgres, api replicas x pool plus the other
      # pools must fit in max_connections - 3, or rendering fails.
      - name: helm template (Postgres connection budget)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
            --show-only templates/api-deployment.yaml
          )
          if helm template distant-signal charts/distant-signal "${base[@]}" \
              --set api.replicaCount=2 > /dev/null 2>&1; then
            echo "2 api replicas x 50 must exceed the default budget" >&2; exit 1
          fi
          helm template distant-signal charts/distant-signal "${base[@]}" \
            --set api.replicaCount=2 --set api.database.maxConnections=30 > /dev/null
          helm template distant-signal charts/distant-signal "${base[@]}" \
            --set api.replicaCount=2 --set postgresql.config.max_connections=200 > /dev/null
          # R-048: the budget also reserves postgresql.connectionBudget
          # (exporter + pg_dump 2, admin psql 3) and 2 for pgBackRest. Pools
          # other than api are 21, so api may have 97 - 21 - 5 = 71.
          helm template distant-signal charts/distant-signal "${base[@]}" \
            --set api.database.maxConnections=71 > /dev/null
          if helm template distant-signal charts/distant-signal "${base[@]}" \
              --set api.database.maxConnections=72 > /dev/null 2>&1; then
            echo "72 + 21 + 5 reserved must exceed 97" >&2; exit 1
          fi
          if helm template distant-signal charts/distant-signal "${base[@]}" \
              --set api.database.maxConnections=60 \
              --set postgresql.connectionBudget.adminSessions=20 > /dev/null 2>&1; then
            echo "postgresql.connectionBudget.adminSessions must count" >&2; exit 1
          fi
          pgbackrest=(
            --set postgresql.pgbackrest.enabled=true
            --set postgresql.pgbackrest.image.repository=registry.example.com/postgres-pgbackrest
            --set postgresql.pgbackrest.image.tag=pg16.15-pgbackrest2.59.1-tini0.19.0
            --set postgresql.pgbackrest.repo.path=/test/pgbackrest
            --set postgresql.pgbackrest.repo.s3.endpoint=s3.example.com
            --set postgresql.pgbackrest.repo.s3.bucket=test-bucket
            --set postgresql.pgbackrest.repo.s3.existingSecret=pgbackrest-creds
          )
          helm template distant-signal charts/distant-signal "${base[@]}" "${pgbackrest[@]}" \
            --set api.database.maxConnections=69 > /dev/null
          if helm template distant-signal charts/distant-signal "${base[@]}" "${pgbackrest[@]}" \
              --set api.database.maxConnections=70 > /dev/null 2>&1; then
            echo "pgBackRest must reserve 2 connections" >&2; exit 1
          fi

      # networkPolicy.enabled: every policy must keep the traffic its
      # workload needs. INF-2: the schedulefeed policy must admit SFTP.
      # INF-10: every background worker has a policy.
      - name: helm template (NetworkPolicy)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
            --set networkPolicy.enabled=true
            --set scheduleFeed.enabled=true
            --set scheduleFeed.sftp.authMethod=password
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }
          # One policy per document, keyed by name.
          policy() { awk -v n="$1" 'BEGIN{RS="\n---\n"} $0 ~ "\n  name: " n "\n" {print}'; }

          feed=$(render --show-only templates/networkpolicy.yaml | policy distant-signal-schedulefeed)
          [[ -n "${feed}" ]] || fail "no schedulefeed NetworkPolicy rendered"
          grep -q 'port: 2022' <<<"${feed}" || fail "schedulefeed policy must allow SFTP on 2022"
          if grep -q 'ipBlock' <<<"${feed}"; then fail "empty allowedCidrs must not restrict SFTP sources"; fi
          feed=$(render --set 'scheduleFeed.sftp.allowedCidrs={203.0.113.0/24}' \
            --show-only templates/networkpolicy.yaml | policy distant-signal-schedulefeed)
          grep -q 'cidr: "203.0.113.0/24"' <<<"${feed}" || fail "allowedCidrs must render as ipBlocks"
          # The allow-list needs the client IP, i.e. externalTrafficPolicy:
          # Local on the SFTP Service. Empty renders nothing; Local/Cluster
          # render; anything else, or a ClusterIP Service, fails.
          svc=$(render --show-only templates/schedulefeed-service.yaml)
          if grep -q 'externalTrafficPolicy' <<<"${svc}"; then fail "empty externalTrafficPolicy must render nothing"; fi
          for p in Local Cluster; do
            svc=$(render --set "scheduleFeed.service.externalTrafficPolicy=${p}" \
              --show-only templates/schedulefeed-service.yaml)
            grep -q "^  externalTrafficPolicy: ${p}\$" <<<"${svc}" || fail "externalTrafficPolicy=${p} must render"
          done
          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if render --set scheduleFeed.service.externalTrafficPolicy=local \
              --show-only templates/schedulefeed-service.yaml >/dev/null 2>&1; then
            fail "externalTrafficPolicy must reject values other than Local/Cluster"
          fi
          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if render --set scheduleFeed.service.externalTrafficPolicy=Local --set scheduleFeed.service.type=ClusterIP \
              --show-only templates/schedulefeed-service.yaml >/dev/null 2>&1; then
            fail "externalTrafficPolicy must fail on a ClusterIP Service"
          fi

          # INF-10: every background worker has its own policy, admitting its
          # health port (kubelet probes). Egress policies are opt-in.
          all=$(render --set pollerIrishRailGtfs.enabled=true \
            --set pollerIrishRailLive.enabled=true \
            --set pollerNirStations.enabled=true \
            --set api.internalOauth.groups.irishRailGtfs=svc-poller-irish-rail-gtfs \
            --set api.internalOauth.groups.irishRailLive=svc-poller-irish-rail-live \
            --set api.internalOauth.groups.nirStations=svc-poller-nir-stations \
            --show-only templates/networkpolicy.yaml)
          for c in aggregator:8090 enricher:8090 notifier:8090 trust-consumer:8081 \
              trust-backlog-consumer:8083 full-coverage-consumer:8082 movement-relay:8083 \
              poller-irish-rail-gtfs:8090 poller-irish-rail-live:8090 poller-nir-stations:8090; do
            p=$(policy "distant-signal-${c%%:*}" <<<"${all}")
            [[ -n "${p}" ]] || fail "no NetworkPolicy for ${c%%:*}"
            grep -q "port: ${c##*:}\$" <<<"${p}" || fail "${c%%:*} policy must admit health port ${c##*:}"
          done
          if grep -q -- '- Egress' <<<"${all}"; then fail "egress policies must be opt-in"; fi
          eg=$(render --set networkPolicy.egress.enabled=true --show-only templates/networkpolicy.yaml)
          notifier=$(policy distant-signal-notifier <<<"${eg}")
          grep -q -- '- Egress' <<<"${notifier}" || fail "notifier must get an egress policy"
          grep -q -- '- 10.0.0.0/8' <<<"${notifier}" || fail "notifier egress must exclude private ranges"
          # extraDeniedCidrs (the node's own public IPs) joins the internet
          # rule's except list, sorted by family, without dropping the
          # privateCidrs defaults; a bare address is rejected.
          eg=$(render --set networkPolicy.egress.enabled=true \
            --set 'networkPolicy.egress.extraDeniedCidrs={203.0.113.7/32,2001:db8::7/128}' \
            --show-only templates/networkpolicy.yaml)
          notifier=$(policy distant-signal-notifier <<<"${eg}")
          v4=$(awk '/cidr: 0.0.0.0\/0/{f=1;next} /cidr: "::\/0"/{f=0} f' <<<"${notifier}")
          v6=$(awk '/cidr: "::\/0"/{f=1;next} f' <<<"${notifier}")
          grep -q -- '- 203.0.113.7/32' <<<"${v4}" || fail "extraDeniedCidrs must join the IPv4 except list"
          grep -q -- '- 10.0.0.0/8' <<<"${v4}" || fail "extraDeniedCidrs must not replace privateCidrs"
          grep -q -- '- 2001:db8::7/128' <<<"${v6}" || fail "an IPv6 extraDeniedCidrs entry must join the IPv6 except list"
          if grep -q '2001:db8::7' <<<"${v4}"; then fail "an IPv6 entry must not land in the IPv4 except list"; fi
          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if render --set networkPolicy.egress.enabled=true --set 'networkPolicy.egress.extraDeniedCidrs={203.0.113.7}' \
              --show-only templates/networkpolicy.yaml >/dev/null 2>&1; then
            fail "extraDeniedCidrs must reject an entry without a prefix length"
          fi

          # egress.enabled gives every component an egress policy: DNS, the
          # in-cluster services it calls, and the internet only where needed.
          # egress_of <component> <render>: that policy's egress rules.
          egress_of() { awk -v n="distant-signal-$1" 'BEGIN{RS="\n---\n"} $0 ~ "\n  name: " n "\n" {print}' <<<"$2" | awk '/^  egress:/{f=1} f'; }
          eg=$(render --set networkPolicy.egress.enabled=true --show-only templates/networkpolicy.yaml)
          for c in api frontend aggregator enricher schedulefeed postgres redis notifier; do
            out=$(egress_of "${c}" "${eg}")
            grep -q 'port: 53$' <<<"${out}" || fail "${c} must get an egress policy allowing DNS"
          done
          for d in api:postgres api:redis frontend:api aggregator:postgres enricher:postgres \
              enricher:redis schedulefeed:api; do
            out=$(egress_of "${d%%:*}" "${eg}")
            grep -q "component: ${d##*:}\$" <<<"${out}" || fail "${d%%:*} egress must reach ${d##*:}"
          done
          for c in api enricher schedulefeed notifier; do
            out=$(egress_of "${c}" "${eg}")
            grep -q 'cidr: 0.0.0.0/0' <<<"${out}" || fail "${c} egress must reach the internet"
          done
          for c in frontend aggregator postgres redis; do
            out=$(egress_of "${c}" "${eg}")
            if grep -q 'cidr: 0.0.0.0/0' <<<"${out}"; then fail "${c} must not reach the internet by default"; fi
          done
          out=$(egress_of redis "${eg}")
          if grep -q 'podSelector' <<<"${out}"; then fail "redis egress must reach no pod"; fi
          out=$(egress_of api "${eg}")
          if grep -q 'component: api$' <<<"${out}"; then fail "api must not reach itself"; fi
          eg=$(render --set networkPolicy.egress.enabled=true \
            --set archive.enabled=true --set archive.s3.bucket=b --set archive.s3.existingSecret=s \
            --set archive.s3.lifecycleConfirmed=true \
            --set postgresql.pgbackrest.enabled=true \
            --set postgresql.pgbackrest.image.repository=registry.example.com/postgres-pgbackrest \
            --set postgresql.pgbackrest.image.tag=pg16.15-pgbackrest2.59.1-tini0.19.0 \
            --set postgresql.pgbackrest.repo.path=/test/pgbackrest \
            --set postgresql.pgbackrest.repo.s3.endpoint=s3.example.com \
            --set postgresql.pgbackrest.repo.s3.bucket=test-bucket \
            --set postgresql.pgbackrest.repo.s3.existingSecret=pgbackrest-creds \
            --show-only templates/networkpolicy.yaml)
          out=$(egress_of aggregator "${eg}")
          grep -q 'cidr: 0.0.0.0/0' <<<"${out}" || fail "archive.enabled must give the aggregator the internet"
          out=$(egress_of postgres "${eg}")
          grep -q 'cidr: 0.0.0.0/0' <<<"${out}" || fail "pgBackRest must give postgres the internet"
          # networkPolicy.components.<component> overrides, and rejects typos.
          eg=$(render --set networkPolicy.egress.enabled=true \
            --set networkPolicy.components.api.egress=false \
            --set networkPolicy.components.frontend.internet=true \
            --set networkPolicy.components.enricher.internet=false \
            --show-only templates/networkpolicy.yaml)
          out=$(egress_of api "${eg}")
          if [[ -n "${out}" ]]; then fail "components.api.egress=false must drop the api's egress policy"; fi
          out=$(egress_of frontend "${eg}")
          grep -q 'cidr: 0.0.0.0/0' <<<"${out}" || fail "components.frontend.internet=true must add the internet"
          out=$(egress_of enricher "${eg}")
          if grep -q 'cidr: 0.0.0.0/0' <<<"${out}"; then fail "components.enricher.internet=false must drop the internet"; fi
          # egress.dnsPeers limits every DNS rule to the named resolvers.
          eg=$(render --set networkPolicy.egress.enabled=true \
            --set 'networkPolicy.egress.dnsPeers[0].podSelector.matchLabels.k8s-app=kube-dns' \
            --show-only templates/networkpolicy.yaml)
          for c in api redis notifier; do
            out=$(egress_of "${c}" "${eg}")
            grep -A4 'port: 53$' <<<"${out}" | grep -q 'k8s-app: kube-dns' || fail "${c} DNS egress must use dnsPeers"
          done

          # The internet rule allows egress.internetPorts (443) plus each
          # component's own upstream ports: Kafka brokers, an http:// feed.
          # internet_ports_of <component> <render>: the ports after ::/0.
          internet_ports_of() { egress_of "$1" "$2" | awk '/cidr: "::\/0"/{f=1} f && /port:/{print $2}' | sort -n | tr '\n' ' '; }
          eg=$(render --set networkPolicy.egress.enabled=true --set pollerIrishRailLive.enabled=true \
            --set api.internalOauth.groups.irishRailLive=svc-poller-irish-rail-live \
            --show-only templates/networkpolicy.yaml)
          for c in 'notifier:443 ' 'api:443 ' 'trust-consumer:443 9094 ' 'full-coverage-consumer:443 9094 ' \
              'movement-relay:443 9094 ' 'poller-irish-rail-live:80 443 '; do
            got=$(internet_ports_of "${c%%:*}" "${eg}")
            [[ "${got}" == "${c#*:}" ]] || fail "${c%%:*} internet ports: want '${c#*:}', got '${got}'"
          done
          eg=$(render --set networkPolicy.egress.enabled=true --set-json 'networkPolicy.egress.internetPorts=[]' \
            --set 'networkPolicy.components.api.internetPorts={8443}' --show-only templates/networkpolicy.yaml)
          got=$(internet_ports_of notifier "${eg}")
          [[ -z "${got}" ]] || fail "internetPorts=[] must allow every port, got '${got}'"
          got=$(internet_ports_of api "${eg}")
          [[ "${got}" == "443 8443 " ]] || fail "components.api.internetPorts must replace the default (issuer ports still added), got '${got}'"

          # networkPolicy.healthIngress scopes the probe ports (default: any
          # source, checked above), or drops the rule.
          np=$(render --set 'networkPolicy.healthIngress.from[0].ipBlock.cidr=10.42.0.1/32' \
            --show-only templates/networkpolicy.yaml)
          for c in notifier:8090 schedulefeed:8091; do
            p=$(policy "distant-signal-${c%%:*}" <<<"${np}")
            grep -A5 "port: ${c##*:}\$" <<<"${p}" | grep -q 'cidr: 10.42.0.1/32' \
              || fail "healthIngress.from must scope ${c%%:*}'s health port"
          done
          np=$(render --set networkPolicy.healthIngress.enabled=false --show-only templates/networkpolicy.yaml)
          for c in notifier:8090 schedulefeed:8091; do
            p=$(policy "distant-signal-${c%%:*}" <<<"${np}")
            if grep -q "port: ${c##*:}\$" <<<"${p}"; then fail "healthIngress.enabled=false must drop ${c%%:*}'s health port rule"; fi
          done
          p=$(policy distant-signal-schedulefeed <<<"${np}")
          grep -q 'port: 2022' <<<"${p}" || fail "healthIngress.enabled=false must keep SFTP"

          # postgresClients/redisClients admit outside workloads (exporters,
          # the backup CronJob) on the service port only, and are off by default.
          np=$(render --show-only templates/networkpolicy.yaml)
          pg=$(policy distant-signal-postgres <<<"${np}")
          if grep -q 'postgres-exporter' <<<"${pg}"; then fail "postgresClients must be empty by default"; fi
          np=$(render --set 'networkPolicy.postgresClients[0].podSelector.matchLabels.app\.kubernetes\.io/name=postgres-exporter' \
            --set 'networkPolicy.redisClients[0].podSelector.matchLabels.app\.kubernetes\.io/name=redis-exporter' \
            --show-only templates/networkpolicy.yaml)
          pg=$(policy distant-signal-postgres <<<"${np}")
          rd=$(policy distant-signal-redis <<<"${np}")
          grep -A3 'app.kubernetes.io/name: postgres-exporter' <<<"${pg}" | grep -q 'port: 5432' \
            || fail "postgresClients must be admitted on the Postgres port"
          grep -A3 'app.kubernetes.io/name: redis-exporter' <<<"${rd}" | grep -q 'port: 6379' \
            || fail "redisClients must be admitted on the Redis port"

          # components.<component>.extraEgress/extraIngress reach that
          # component's policy only, including the frontend's otherwise
          # empty ingress.
          eg=$(render --set networkPolicy.egress.enabled=true \
            --set 'networkPolicy.components.aggregator.extraEgress[0].to[0].ipBlock.cidr=192.0.2.10/32' \
            --set 'networkPolicy.components.postgres.extraIngress[0].from[0].podSelector.matchLabels.probe=pg' \
            --set 'networkPolicy.components.frontend.extraIngress[0].from[0].podSelector.matchLabels.probe=fe' \
            --set 'networkPolicy.components.notifier.extraIngress[0].from[0].podSelector.matchLabels.probe=nt' \
            --show-only templates/networkpolicy.yaml)
          out=$(egress_of aggregator "${eg}")
          grep -q 'cidr: 192.0.2.10/32' <<<"${out}" || fail "aggregator extraEgress must render"
          out=$(egress_of enricher "${eg}")
          if grep -q '192.0.2.10' <<<"${out}"; then fail "extraEgress must not leak to another component"; fi
          for c in postgres:pg frontend:fe notifier:nt; do
            out=$(policy "distant-signal-${c%%:*}" <<<"${eg}" | awk '/^  ingress:/{f=1} /^  egress:/{f=0} f')
            grep -q "probe: ${c##*:}\$" <<<"${out}" || fail "${c%%:*} extraIngress must render under ingress"
          done
          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if render --set networkPolicy.components.no-such-thing.egress=false \
              --show-only templates/networkpolicy.yaml >/dev/null 2>&1; then
            fail "an unknown networkPolicy.components key must fail the render"
          fi

          # The api trusts X-Real-IP, so only its real callers may reach
          # api.service.port. An extra namespace is narrowed to the MCP pod by
          # default, and null clears the narrowing.
          api=$(render --set 'networkPolicy.apiExtraIngressNamespaces={ds-mcp}' \
            --show-only templates/networkpolicy.yaml | policy distant-signal-api)
          grep -A5 '"ds-mcp"' <<<"${api}" | grep -q 'app.kubernetes.io/name: distant-signal-mcp' \
            || fail "ds-mcp must be narrowed to the MCP pod by default"
          api=$(render --set 'networkPolicy.apiExtraIngressNamespaces={ds-mcp}' \
            --set networkPolicy.apiExtraIngressPodLabels.ds-mcp=null \
            --show-only templates/networkpolicy.yaml | policy distant-signal-api)
          if grep -q 'distant-signal-mcp' <<<"${api}"; then fail "a null apiExtraIngressPodLabels entry must admit the whole namespace"; fi
          # The tunnel (cloudflared) reaches the frontend, never the api unless
          # asked, and the api only with X-Real-IP trust off.
          tun=$(render --set networkPolicy.tunnel.enabled=true --show-only templates/networkpolicy.yaml)
          tun_frontend=$(policy distant-signal-frontend <<<"${tun}")
          tun_api=$(policy distant-signal-api <<<"${tun}")
          grep -q 'metadata.name: "cloudflared"' <<<"${tun_frontend}" \
            || fail "tunnel must be admitted to the frontend"
          if grep -q cloudflared <<<"${tun_api}"; then
            fail "tunnel must not reach the api by default"
          fi
          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if render --set networkPolicy.tunnel.enabled=true --set networkPolicy.tunnel.api=true \
              --show-only templates/networkpolicy.yaml >/dev/null 2>&1; then
            fail "tunnel.api must fail while api.rateLimit.trustXRealIp is on"
          fi
          tun=$(render --set networkPolicy.tunnel.enabled=true --set networkPolicy.tunnel.api=true \
            --set api.rateLimit.trustXRealIp=false --show-only templates/networkpolicy.yaml)
          tun_api=$(policy distant-signal-api <<<"${tun}")
          grep -q cloudflared <<<"${tun_api}" \
            || fail "tunnel.api must admit the tunnel to the api"

      - name: helm template (values-example.yaml)
        run: |
          helm template distant-signal charts/distant-signal -f charts/distant-signal/values-example.yaml \
            --set trustConsumer.kafka.brokers=kafka.example.com:9094 \
            --set trustConsumer.kafka.topic=test-topic \
            --set trustConsumer.kafka.saslMechanism=PLAIN \
            --set enricher.llm.baseUrl=http://llm.example.com/v1 \
            --set enricher.llm.model=test-model \
            --set api.sso.issuerUrl=https://sso.example.com \
            --set api.sso.clientId=test-client \
            --set api.sso.clientSecret=test-secret \
            --set api.sso.redirectUrl=https://app.example.com/callback \
            --set api.sso.postLoginRedirectUrl=https://app.example.com/ \
            > /dev/null

      # Every CronJob the chart renders must set an explicit spec.timeZone
      # (docs/superpowers/specs/2026-09-30-backup-and-observability-gaps-design.md,
      # item 2). Without one the schedule is read in the node's local zone,
      # which the cluster doesn't control: mine-bringer runs at UTC+2, so a
      # "02:00 UTC" backup really ran at 00:00 UTC. Backups and maintenance
      # use Etc/UTC; jobs tied to the GB rail day use Europe/London. The
      # zone must also exist in the runner's tzdata, because the API server
      # rejects an unknown name. Rendered with every optional feature that
      # adds a CronJob turned on.
      - name: helm template (every CronJob sets timeZone)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }
          # One "<name> <timeZone>" line per CronJob; "-" when timeZone is unset.
          cronjobs() {
            awk 'BEGIN { RS = "\n---\n" }
              /(^|\n)kind: CronJob\n/ {
                name = "?"; tz = "-"
                if (match($0, /\n  name: [^\n]+/)) name = substr($0, RSTART + 9, RLENGTH - 9)
                if (match($0, /\n  timeZone: [^\n]+/)) tz = substr($0, RSTART + 13, RLENGTH - 13)
                gsub(/"/, "", tz)
                print name, tz
              }'
          }
          # Reads a render on stdin; $1 labels the output, $2 is the number
          # of CronJobs that render must contain.
          check() {
            local label="$1" want="$2" found n=0 name tz
            found=$(cronjobs)
            while read -r name tz; do
              [[ -n "${name}" ]] || continue
              n=$((n + 1))
              [[ "${tz}" != "-" ]] || fail "${label}: CronJob ${name} has no spec.timeZone"
              [[ -f "/usr/share/zoneinfo/${tz}" ]] || fail "${label}: CronJob ${name} timeZone ${tz} is not a known zone"
              echo "${label}: ${name} ${tz}"
            done <<<"${found}"
            [[ "${n}" -eq "${want}" ]] || fail "${label}: expected ${want} CronJob(s), found ${n}"
          }
          render | check "default values" 0
          render -f charts/distant-signal/values-example.yaml | check "values-example.yaml" 0
          pgbackrest=(
            --set postgresql.pgbackrest.enabled=true
            --set postgresql.pgbackrest.image.repository=registry.example.com/postgres-pgbackrest
            --set postgresql.pgbackrest.image.tag=pg16.15-pgbackrest2.59.1-tini0.19.0
            --set postgresql.pgbackrest.repo.path=/test/pgbackrest
            --set postgresql.pgbackrest.repo.s3.endpoint=s3.example.com
            --set postgresql.pgbackrest.repo.s3.bucket=test-bucket
            --set postgresql.pgbackrest.repo.s3.existingSecret=pgbackrest-creds
          )
          render "${pgbackrest[@]}" | check "pgBackRest enabled" 4
          render "${pgbackrest[@]}" --set postgresql.pgbackrest.backup.verifySchedule= \
            | check "pgBackRest enabled, no weekly verify" 3
          render --set apiMaintenance.enabled=true | check "apiMaintenance enabled" 1

      # Ingest plan 1B.8: apiMaintenance (off by default) is an hourly
      # Forbid-concurrency CronJob running the api image's maintenance
      # binary as the api's database role, admitted to Postgres, with its
      # pool in the connection budgets.
      - name: helm template (api-maintenance CronJob)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }
          doc() { awk -v k="$1" -v n="$2" 'BEGIN{RS="\n---\n"} $0 ~ "\nkind: " k "\n" && $0 ~ "\n  name: " n "\n" {print}'; }
          on=(--set apiMaintenance.enabled=true --set networkPolicy.enabled=true --set networkPolicy.egress.enabled=true)

          off=$(render --set networkPolicy.enabled=true --set networkPolicy.egress.enabled=true)
          if grep -q 'api-maintenance' <<<"${off}"; then fail "apiMaintenance off must render nothing of it"; fi

          out=$(render "${on[@]}")
          cj=$(doc CronJob distant-signal-api-maintenance <<<"${out}")
          [[ -n "${cj}" ]] || fail "no api-maintenance CronJob rendered"
          for want in 'schedule: "17 * * * *"' 'timeZone: "Etc/UTC"' 'concurrencyPolicy: Forbid' \
              '- /usr/local/bin/maintenance' 'image: "ghcr.io/fasterspeeding/distant-signal/api:'; do
            grep -q -F -- "${want}" <<<"${cj}" || fail "api-maintenance CronJob lacks: ${want}"
          done
          for env in PAST_TRAVEL_RETENTION_DAYS STALE_PUSH_SUBSCRIPTION_DAYS INACTIVE_ACCOUNT_RETENTION_DAYS; do
            grep -q "name: ${env}\$" <<<"${cj}" || fail "api-maintenance CronJob lacks ${env}"
          done
          pg=$(doc NetworkPolicy distant-signal-postgres <<<"${out}")
          grep -q -- '- api-maintenance$' <<<"${pg}" || fail "Postgres must admit the CronJob"
          eg=$(doc NetworkPolicy distant-signal-api-maintenance <<<"${out}")
          grep -q 'port: 5432' <<<"${eg}" || fail "the CronJob must be allowed out to Postgres"

          # The api role: its own with perService.api.connect, else app.
          roles=(--set postgresql.roles.enabled=true --set postgresql.roles.setupJob.enabled=true)
          cj=$(render "${on[@]}" "${roles[@]}" --show-only templates/api-maintenance-cronjob.yaml)
          # shellcheck disable=SC2016 # "$(PGPASSWORD)" is Kubernetes env-var syntax, matched literally
          grep -q 'postgres://distant_signal_app:\$(PGPASSWORD)@' <<<"${cj}" || fail "roles on: the CronJob must connect as app"
          cj=$(render "${on[@]}" "${roles[@]}" --set postgresql.roles.perService.enabled=true \
            --set postgresql.roles.perService.api.connect=true --show-only templates/api-maintenance-cronjob.yaml)
          # shellcheck disable=SC2016 # as above
          grep -q 'postgres://distant_signal_api:\$(PGPASSWORD)@' <<<"${cj}" || fail "api.connect: the CronJob must connect as the api role"
          # Its 2 connections count: the app limit 75 -> 77, the INF-7 budget 71 -> 69.
          out=$(render "${on[@]}" "${roles[@]}")
          grep -q "'--variable=app_connection_limit=77'" <<<"${out}" || fail "the CronJob's pool must count in the app role's limit"
          render "${on[@]}" --set api.database.maxConnections=69 >/dev/null
          # shellcheck disable=SC2310 # render is expected to fail here; that failure is the assertion
          if render "${on[@]}" --set api.database.maxConnections=70 >/dev/null 2>&1; then
            fail "the CronJob's pool must count in the INF-7 budget"
          fi

      # postgresql.pgbackrest (docs/postgres-pitr.md). Off (the default)
      # must render nothing of it: the Postgres pod stays exactly as before.
      # On, it must swap the image, add the archiving settings, take every
      # secret from an existing Secret (never a plaintext value), scope the
      # CronJobs' Role to exec on the one Postgres pod, and refuse to render
      # without its required values.
      - name: helm template (pgBackRest)
        run: |
          set -euo pipefail
          base=(
            --set trustConsumer.kafka.brokers=kafka.example.com:9094
            --set trustConsumer.kafka.topic=test-topic
            --set trustConsumer.kafka.saslMechanism=PLAIN
            --set enricher.llm.baseUrl=http://llm.example.com/v1
            --set enricher.llm.model=test-model
            --set api.sso.issuerUrl=https://sso.example.com
            --set api.sso.clientId=test-client
            --set api.sso.clientSecret=test-secret
            --set api.sso.redirectUrl=https://app.example.com/callback
            --set api.sso.postLoginRedirectUrl=https://app.example.com/
            --set metrics.prometheusRule.enabled=true
          )
          on=(
            --set postgresql.pgbackrest.enabled=true
            --set postgresql.pgbackrest.image.repository=registry.example.com/postgres-pgbackrest
            --set postgresql.pgbackrest.image.tag=pg16.15-pgbackrest2.59.1-tini0.19.0
            --set postgresql.pgbackrest.repo.path=/test/pgbackrest
            --set postgresql.pgbackrest.repo.s3.endpoint=s3.example.com
            --set postgresql.pgbackrest.repo.s3.bucket=test-bucket
            --set postgresql.pgbackrest.repo.s3.existingSecret=pgbackrest-creds
          )
          render() { helm template distant-signal charts/distant-signal "${base[@]}" "$@"; }
          fail() { echo "$1" >&2; exit 1; }

          off=$(render)
          if grep -n -i -E 'pgbackrest|archive_mode|archive_command' <<<"${off}"; then
            fail "pgBackRest is off by default but rendered"
          fi
          grep -q 'image: "postgres:16' <<<"${off}" || fail "the default Postgres image must stay postgres:16"
          # Off, the Postgres pod keeps Kubernetes' default grace period
          # (no terminationGracePeriodSeconds) unless it is set explicitly.
          pg_off=$(render --show-only templates/postgres-statefulset.yaml)
          if grep -n 'terminationGracePeriodSeconds' <<<"${pg_off}"; then
            fail "with pgBackRest off the Postgres pod must not set terminationGracePeriodSeconds"
          fi
          pg_off=$(render --show-only templates/postgres-statefulset.yaml --set postgresql.terminationGracePeriodSeconds=45)
          grep -q '^      terminationGracePeriodSeconds: 45$' <<<"${pg_off}" \
            || fail "postgresql.terminationGracePeriodSeconds must render when set"

          pg=$(render "${on[@]}" --show-only templates/postgres-statefulset.yaml)
          grep -q 'image: "registry.example.com/postgres-pgbackrest:pg16.15-pgbackrest2.59.1-tini0.19.0"' <<<"${pg}" \
            || fail "pgBackRest must swap in the postgres-pgbackrest image"
          # The image's ENTRYPOINT (tini, then docker-entrypoint.sh) keeps
          # the postmaster off PID 1, where an async archive-push worker's
          # exit crash-restarts it (docs/postgres-pitr.md, "Why tini"). A
          # container `command:` would replace that ENTRYPOINT. The probes'
          # exec `command:` keys sit deeper, so only a container-level one
          # (10 spaces) matches.
          if grep -n -E '^ {10}command:' <<<"${pg}"; then
            fail "the Postgres container must not set command: it would bypass the image's tini ENTRYPOINT"
          fi
          grep -q -- '- "archive_mode=on"' <<<"${pg}" || fail "archive_mode=on missing"
          grep -q -- '- "archive_command=pgbackrest --stanza=ds --archive-timeout=30 archive-push %p"' <<<"${pg}" \
            || fail "archive_command missing, or without its --archive-timeout (archive.pushTimeoutSecs)"
          # A stop while S3 is unreachable waits for the archiver's last
          # attempts (up to 6 x pushTimeoutSecs); Kubernetes' default 30s
          # grace would SIGKILL it, and pg_ctl's default 60s fails a
          # first-start initdb. Both default to 6 x 30 + 60.
          grep -q '^      terminationGracePeriodSeconds: 240$' <<<"${pg}" \
            || fail "pgBackRest must default the Postgres pod's terminationGracePeriodSeconds to 240"
          grep -A1 'name: PGCTLTIMEOUT$' <<<"${pg}" | grep -q 'value: "240"' \
            || fail "pgBackRest must set PGCTLTIMEOUT for the entrypoint's initdb server"
          pg_tuned=$(render "${on[@]}" --show-only templates/postgres-statefulset.yaml \
            --set postgresql.pgbackrest.archive.pushTimeoutSecs=10 --set postgresql.terminationGracePeriodSeconds=90)
          grep -q -- '--archive-timeout=10 archive-push' <<<"${pg_tuned}" || fail "archive.pushTimeoutSecs must reach archive_command"
          grep -q '^      terminationGracePeriodSeconds: 90$' <<<"${pg_tuned}" \
            || fail "postgresql.terminationGracePeriodSeconds must override the pgBackRest default"
          grep -A1 'name: PGCTLTIMEOUT$' <<<"${pg_tuned}" | grep -q 'value: "120"' \
            || fail "PGCTLTIMEOUT must follow archive.pushTimeoutSecs"
          grep -q -- '- "archive_timeout=60"' <<<"${pg}" || fail "archive_timeout missing"
          grep -q -- '- "wal_compression=lz4"' <<<"${pg}" || fail "postgresql.config must still render"
          grep -A1 'name: PGBACKREST_ARCHIVE_PUSH_QUEUE_MAX$' <<<"${pg}" | grep -q 'value: "8GB"' \
            || fail "the archive-push-queue-max disk-full guard must default on"
          grep -A1 'name: PGBACKREST_REPO1_CIPHER_TYPE$' <<<"${pg}" | grep -q 'value: "aes-256-cbc"' \
            || fail "the repository must be encrypted client-side"
          for v in PGBACKREST_REPO1_S3_KEY PGBACKREST_REPO1_S3_KEY_SECRET PGBACKREST_REPO1_CIPHER_PASS; do
            grep -A3 "name: ${v}\$" <<<"${pg}" | grep -q 'name: "pgbackrest-creds"' \
              || fail "${v} must come from the existing Secret"
            if grep -A1 "name: ${v}\$" <<<"${pg}" | grep -q 'value:'; then fail "${v} rendered as a plain value"; fi
          done
          grep -A1 'name: PGBACKREST_SPOOL_PATH$' <<<"${pg}" | grep -q 'value: "/var/lib/postgresql/data/pgbackrest-spool"' \
            || fail "the spool must sit on the data volume, outside PGDATA"

          jobs=$(render "${on[@]}" --show-only templates/postgres-pgbackrest.yaml)
          role=$(awk 'BEGIN{RS="\n---\n"} /\nkind: Role\n/ {print}' <<<"${jobs}")
          n_scoped=$(grep -c 'resourceNames: \["distant-signal-postgres-0"\]' <<<"${role}" || true)
          [[ "${n_scoped}" -eq 2 ]] || fail "every Role rule must be scoped to the Postgres pod"
          n_rules=$(grep -c -- '- apiGroups:' <<<"${role}" || true)
          [[ "${n_rules}" -eq 2 ]] || fail "the Role must have exactly two rules"
          grep -q 'resources: \["pods/exec"\]' <<<"${role}" || fail "the Role must allow pods/exec"
          if grep -E -q 'secrets|delete|update|patch|list|watch|"\*"' <<<"${role}"; then
            fail "the Role must allow nothing beyond get/exec on the Postgres pod"
          fi
          for s in 'full:0 5 \* \* 0' 'diff:0 5 \* \* 1-6' 'check:0 7 \* \* \*' 'verify:0 8 \* \* 0'; do
            cj=$(awk -v n="distant-signal-pgbackrest-${s%%:*}" 'BEGIN{RS="\n---\n"} $0 ~ "\n  name: " n "\n" {print}' <<<"${jobs}")
            grep -q "schedule: \"${s#*:}\"" <<<"${cj}" || fail "${s%%:*} CronJob schedule"
            grep -q 'timeZone: "Etc/UTC"' <<<"${cj}" || fail "${s%%:*} CronJob must run in Etc/UTC"
            grep -q 'automountServiceAccountToken: true' <<<"${cj}" || fail "${s%%:*} CronJob needs its token"
          done
          # backup.startFast (default on): an immediate checkpoint, not a
          # 13.5-27 minute wait for spread ones inside pg_backup_start.
          for s in full diff; do
            cj=$(awk -v n="distant-signal-pgbackrest-${s}" 'BEGIN{RS="\n---\n"} $0 ~ "\n  name: " n "\n" {print}' <<<"${jobs}")
            grep -q -- '- "--start-fast"' <<<"${cj}" || fail "the ${s} backup must pass --start-fast"
          done
          slow_jobs=$(render "${on[@]}" --show-only templates/postgres-pgbackrest.yaml \
            --set postgresql.pgbackrest.backup.startFast=false)
          if grep -q -- '--start-fast' <<<"${slow_jobs}"; then fail "backup.startFast=false must drop --start-fast"; fi
          check_job=$(awk 'BEGIN{RS="\n---\n"} $0 ~ "\n  name: distant-signal-pgbackrest-check\n" {print}' <<<"${jobs}")
          if grep -q -- '--start-fast' <<<"${check_job}"; then fail "only the backups take --start-fast"; fi
          grep -A1 -- '- "pgbackrest-daily-check"' <<<"${check_job}" | grep -q -- '- "--no-verify"' \
            || fail "the daily check must skip verify (the weekly verify CronJob runs it)"
          verify_job=$(awk 'BEGIN{RS="\n---\n"} $0 ~ "\n  name: distant-signal-pgbackrest-verify\n" {print}' <<<"${jobs}")
          grep -q -- '- "verify"' <<<"${verify_job}" || fail "the weekly verify CronJob must run pgbackrest verify"

          rule=$(render "${on[@]}" --namespace distant-signal \
            --show-only templates/pgbackrest-prometheusrule.yaml)
          names=$(sed -n 's/^ *- alert: *//p' <<<"${rule}")
          n_alerts=$(grep -c . <<<"${names}" || true)
          [[ "${n_alerts}" -eq 6 ]] || fail "expected 6 pgBackRest alerts, got: ${names}"
          if bad=$(grep -v '^DistantSignal' <<<"${names}"); then fail "alert names must start with DistantSignal: ${bad}"; fi
          grep -q 'kube_job_failed{namespace="distant-signal", job_name=~"distant-signal-pgbackrest-(check|verify|full|diff)-\[0-9\]+", condition="true"}' <<<"${rule}" \
            || fail "the recorded failed-Job series must match every pgBackRest CronJob's Jobs"
          grep -q 'distant_signal:pgbackrest_job_failed:recent{namespace="distant-signal", job_name=~"distant-signal-pgbackrest-(check|verify)-\[0-9\]+"}' <<<"${rule}" \
            || fail "the check alert must match the check and verify CronJobs' Jobs"

          for unset in image.repository image.tag repo.path repo.s3.endpoint repo.s3.bucket repo.s3.existingSecret; do
            if helm template distant-signal charts/distant-signal "${base[@]}" "${on[@]}" \
                --set "postgresql.pgbackrest.${unset}=" >/dev/null 2>&1; then
              fail "pgBackRest rendered without postgresql.pgbackrest.${unset}"
            fi
          done
          # The chart has no default pgBackRest image: the error must say so.
          err=$(helm template distant-signal charts/distant-signal "${base[@]}" "${on[@]}" \
            --set postgresql.pgbackrest.image.repository= 2>&1 >/dev/null || true)
          grep -q 'postgresql.pgbackrest.image.repository is required' <<<"${err}" \
            || fail "a missing pgBackRest image repository must fail with a message naming it"
          if helm template distant-signal charts/distant-signal "${base[@]}" "${on[@]}" \
              --set postgresql.pgbackrest.archive.pushTimeoutSecs=0 >/dev/null 2>&1; then
            fail "pgBackRest rendered with archive.pushTimeoutSecs=0"
          fi
          if helm template distant-signal charts/distant-signal "${base[@]}" "${on[@]}" \
              --set postgresql.enabled=false \
              --set externalDatabase.url=postgres://u:p@db.example.com/d >/dev/null 2>&1; then
            fail "pgBackRest rendered without the bundled Postgres"
          fi

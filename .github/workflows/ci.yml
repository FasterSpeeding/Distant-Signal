name: CI

# Lint, build and test the Rust workspace, the frontend and the Helm chart.
#
# Runs on every pull request targeting main/dev, and on every push to
# main/master/dev. This is a superset of the "push validation" bullet in
# the CI design doc: pushes and PRs run the same job set, there is no
# reduced subset, because none of these jobs are slow/expensive enough to
# warrant skipping on push (the container build/publish pipeline, which IS
# expensive, lives in containers.yml instead).
#
# `actionlint` calls FasterSpeeding/Piped's own reusable `workflow_call`
# workflow directly (see the comment on that job). `clippy` originally did
# too, but Piped's clippy.yml passes a broken `args: --all-features` to
# auguwu/clippy-action (lands after cargo's `--` separator, so it reaches
# clippy-driver/rustc, not cargo -- see the comment on the `clippy` job for
# the full trace) so it's now a custom job calling the same clippy-action
# commit directly with the fix. Piped's remaining workflows (rustfmt.yml,
# lint.yml, type-check.yml, py-test.yml, verify-types.yml,
# freeze-for-pr.yml, ...) are not used here: they are either Python/nox-
# oriented (this repo has no Python code) or depend on a `justfile` +
# `mise.toml` vendored from the `piped` git submodule via the
# `just-jobs`/`handle-diff-file` composite actions in Piped-actions, which
# this repo does not have and this change does not introduce. See the PR
# description this workflow shipped with for the fuller "what was checked
# and why" writeup, including upstream-gap notes for Piped/Piped-actions.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  # Custom: NOT using FasterSpeeding/Piped's clippy.yml reusable workflow
  # here, because it is broken -- confirmed by tracing the exact pinned
  # commit's `auguwu/clippy-action@9817d076b82df0194935be9db6154c56ac07b317`
  # (v1.5.0) source (src/clippy.ts): the argv it builds is
  # `['clippy', '--message-format', 'json', ...check-args, (--all-features
  # if the deprecated boolean input is set), '--', ...args, ...forbid/deny/
  # warn/allow]` -- i.e. `check-args` land BEFORE the `cargo clippy --`
  # separator (so cargo sees them), but `args` land AFTER it, meaning they
  # get passed straight to `clippy-driver`/`rustc`, not to `cargo clippy`.
  # Piped's clippy.yml (both the pinned commit and current master, verified
  # via raw.githubusercontent.com) passes `args: --all-features` --
  # `--all-features` is a cargo-level flag, not a valid rustc/clippy-driver
  # flag, so it lands on the wrong side of `--` and clippy-driver rejects
  # it with exactly "error: Unrecognized option: 'all-features'" on the
  # first crate compiled. This is an upstream Piped bug (should be
  # `check-args: --all-features`), not something fixable from this repo's
  # workflow_call site since that reusable workflow takes no inputs.
  #
  # This job calls the same pinned clippy-action commit directly with the
  # corrected input name, preserving the original behaviour (workspace-wide
  # since the root Cargo.toml is a virtual manifest, all-features, inline
  # PR annotations) without the upstream bug. Revert to the Piped reusable
  # workflow once this is fixed upstream.
  #
  # Also installs the same system packages docker/trust-consumer.Dockerfile
  # documents needing for rdkafka's `cmake-build`/`ssl`/`sasl` features
  # (trust-consumer is part of this workspace, so `--all-features
  # --workspace` compiles it too): cmake + libssl-dev + pkg-config to build
  # vendored librdkafka, libsasl2-dev for the `sasl2-sys` crate's build
  # script (dynamic linking against a real libsasl2, matching production --
  # see the `rust-test` job below for the fuller rationale), and
  # libcurl4-openssl-dev because librdkafka's vendored C source
  # unconditionally `#include`s <curl/curl.h>.
  clippy:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy

      - name: Install rdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config libsasl2-dev libcurl4-openssl-dev

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy --workspace --all-features
        uses: auguwu/clippy-action@9817d076b82df0194935be9db6154c56ac07b317 # v1.5.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          check-args: --all-features

  # Reusable workflow_call from FasterSpeeding/Piped: runs actionlint over
  # this repo's own .github/workflows/*.yml via reviewdog. Self-contained
  # (checkout + one third-party action), no justfile dependency -- a clean
  # fit for validating the workflow files this change adds.
  actionlint:
    uses: FasterSpeeding/Piped/.github/workflows/lint-actions.yml@5bbddb5d32d5bde939b18f6c6bcfa0e36779412f # master @ 2026-09-01

  # Custom step: Piped's rustfmt.yml exists but pipes its diff through the
  # `handle-diff-file` composite action, which shells out to `just
  # check-diff-file` -- i.e. it assumes the `piped` submodule's justfile is
  # vendored into the repo. This repo has no justfile/mise.toml and this
  # change deliberately does not add the Piped submodule just to satisfy
  # one check, so a plain `cargo fmt --check` step is used instead.
  #
  # `continue-on-error: true`: `cargo fmt --check` is NOT clean on `main`
  # today (confirmed by running it locally -- widespread pre-existing
  # formatting drift in crates/aggregator/src/aggregation.rs and others,
  # predating this change). Gating on it now would turn every PR red for a
  # problem this change didn't create. The check still runs and reports so
  # the drift is visible, it just doesn't block merges. Flip this to a hard
  # gate once someone runs `cargo fmt` across the whole workspace.
  rustfmt:
    name: cargo fmt --check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all --check

  # Custom: cargo build/test across the whole workspace, plus the
  # DATABASE_URL-gated `#[ignore]`d integration tests in `api`, `aggregator`
  # and `notifier` (confirmed by grepping every `#[ignore = "..."]` reason
  # in the workspace to need only a live Postgres). `notifier` joined this
  # list here: it already had several DATABASE_URL-gated `#[ignore]`d tests
  # of its own (`queries.rs`'s poll/push-subscription round trips,
  # `main.rs`'s `run_cycle` transition test) that CI simply never ran, plus
  # two more this plan's own Tasks 8/9 added --
  # `list_committed_legs_for_today` and the `skip_notification_state`/
  # `upsert_skip_notification_state` round-trip -- and `skip_check.rs`'s new
  # `leg_is_skipped` test from this fix wave. Every one of them calls
  # `queries.rs`/`skip_check.rs` functions (or, for `run_cycle`, passes a
  # literal fake VAPID key straight into the function call) directly against
  # a live Postgres, never through `main()`'s own env-var parsing, so none
  # need anything beyond the same `DATABASE_URL` this job already sets up
  # for `api`/`aggregator`.
  #
  # `enricher` is a mixed bag, so it's handled in its own step below instead
  # of being folded into the `-p api -p aggregator -p notifier` step: five
  # of its six `#[ignore]`d tests (`llm.rs`'s `live_eval_*`) call
  # `live_client_from_env()` and genuinely need a real `LLM_BASE_URL` with
  # live model access, so those five stay excluded here -- there is no such
  # credential in CI. But `main.rs`'s
  # `process_incident_writes_successfully_and_advances_hash_and_version_when_primary_extraction_is_truncated`
  # only needs `DATABASE_URL`: it mocks all three LLM calls it makes against
  # its own `wiremock` server (see that test's doc comment), so it now runs
  # here too -- verified locally with `DATABASE_URL=postgres://postgres:
  # postgres@localhost:5432/postgres cargo test -p enricher process_incident
  # -- --ignored --test-threads=1` against a live Postgres, which passes.
  # The step below uses that same `process_incident` test-name filter
  # rather than a bare `-p enricher` addition to the step above, because
  # without the filter the five LLM-gated tests get pulled in too and fail
  # with "LLM_BASE_URL must be set for live eval".
  rust-test:
    name: cargo build & test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # movement-feed's RedisStreamMovementFeed tests (Task 3 of
      # docs/superpowers/plans/2026-09-04-movement-relay-plan.md) are the
      # first #[ignore]d tests in this repo needing a live Redis rather than
      # a live Postgres -- mirrors the postgres: block above exactly.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      # trust-consumer's `rdkafka` dependency needs a real, dynamically
      # linked libsasl2 to build+run (see docker/trust-consumer.Dockerfile,
      # which installs the same packages for the same reason): its `sasl`
      # feature pulls in the `sasl2-sys` crate, whose build script panics
      # with "Unable to find libsasl2 on your system" without
      # libsasl2-dev. `rdkafka` was deliberately left on dynamic linking
      # (no `vendored`/`gssapi-vendored` feature enabled in
      # crates/trust-consumer/Cargo.toml) rather than switched to a
      # vendored/bundled libsasl2, so this needs to match the Dockerfile's
      # system-package approach rather than diverge from it: this app does
      # real SASL/SCRAM auth against a live Kafka broker in production (see
      # charts/distant-signal's trustConsumer.kafka.saslMechanism), so CI
      # should build against the same kind of libsasl2 production actually
      # links, not a bundled stand-in that could behave differently.
      # cmake/libssl-dev/pkg-config are for rdkafka's `cmake-build`/`ssl`
      # features (vendored librdkafka C library), libcurl4-openssl-dev
      # because librdkafka's vendored C source unconditionally `#include`s
      # <curl/curl.h> at build time (not linked at runtime).
      - name: Install rdkafka build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libssl-dev pkg-config libsasl2-dev libcurl4-openssl-dev

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace (ignored tests skipped)
        run: cargo test --workspace

      # Fast, no-secrets tier of the lines/*.toml external-identifier
      # validator (crates/line-catalogue-validator): checks every `crs`,
      # `tiploc` and `operators` value against the vendored snapshot in
      # reference-data/crs-tiploc.csv and reference-data/toc-codes.csv --
      # deterministic, no network access, no rate limits, runs in well
      # under a second. Added as a step here rather than a separate job:
      # it's already covered by this job's own `cargo build --workspace`
      # above (no extra toolchain/deps needed) and is fast enough that a
      # dedicated job with its own checkout/toolchain-install overhead
      # would cost more than it saves. See
      # crates/line-catalogue-validator/src/main.rs's module doc for the
      # thorough, live-external-source counterpart to this check, which
      # runs on its own weekly schedule instead (see
      # .github/workflows/validate-line-catalogue.yml, currently disabled
      # pending credentials).
      - name: Validate lines/*.toml external identifiers (fast tier)
        run: cargo run -p line-catalogue-validator

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres,rustls --locked

      - name: Run api migrations
        working-directory: crates/api
        run: sqlx migrate run

      - name: cargo test -p api -p aggregator -p notifier -- --ignored (DB-backed tests)
        run: cargo test -p api -p aggregator -p notifier -- --ignored --test-threads=1

      - name: cargo test -p enricher process_incident -- --ignored (DB-backed test; LLM-gated evals stay excluded)
        run: cargo test -p enricher process_incident -- --ignored --test-threads=1

      - name: cargo test -p movement-feed -- --ignored (Redis-backed tests)
        run: cargo test -p movement-feed -- --ignored --test-threads=1

  # Custom: no reusable Piped workflow covers Node/npm at all (its
  # ecosystem coverage is Python + Rust). frontend/package.json now has a
  # `lint` script (`eslint .`, flat config in frontend/eslint.config.mjs
  # built on eslint-config-next's `core-web-vitals`/`typescript` configs --
  # Next.js 16 removed the `next lint` CLI in favor of running ESLint
  # directly). `npx tsc --noEmit` remains a separate step alongside it:
  # ESLint's typescript-eslint rules are style/correctness lint, not a
  # substitute for a full type-check.
  #
  # `npm run test:e2e` (Playwright, testDir: ./e2e) is deliberately NOT run
  # here -- it needs a live `api` + Postgres + Redis + seeded fixtures and a
  # built/started frontend, none of which this job stands up. See the
  # `frontend-e2e` job below for that.
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: npm test (vitest)
        run: npm test

      - name: npm run build (next build)
        run: npm run build

  # Custom: Playwright e2e + full-default-ruleset axe-core accessibility
  # sweep (frontend/e2e/, 7 spec files -- accessibility.spec.ts is the axe
  # sweep, the rest cover nav/layout/chat/connectivity/service-worker/push
  # notifications). This is the job the `frontend` job's own comment used to
  # say was deliberately deferred until e2e specs existed; they now do.
  #
  # Needs a real, reachable `api` (Postgres + Redis behind it) to render
  # anything beyond a skeleton/error state -- extends `rust-test`'s own
  # `services:` pattern (same images, same health-check options) rather
  # than `docker-compose.yml`: that file needs dummy values for ~20+
  # unrelated service credentials (Kafka, RDM/TfL/LDBWS pollers, five
  # services' worth of internal-OAuth pairs) just to resolve config, and its
  # `api`/`frontend` images would rebuild from scratch in-container with no
  # cache reuse, unlike this job's `Swatinem/rust-cache` (shared with
  # `rust-test`) and `actions/setup-node`'s npm cache.
  #
  # The `INTERNAL_OAUTH_*`/`SSO_*` values below are dummy-but-syntactically-
  # valid, matching local dev's own `.devdata/api.env` pattern: `api` only
  # syntax-checks an issuer URL at startup (OIDC discovery is lazy -- see
  # `crates/api/src/data/config.rs`'s own doc comments on `sso_issuer_url`),
  # never actually contacting it unless a real OAuth redirect happens,
  # which no spec here drives.
  frontend-e2e:
    name: Playwright e2e + accessibility
    runs-on: ubuntu-24.04

    # Same two services, same images, same health-check options as
    # `rust-test` above -- copied rather than factored out into a reusable
    # block, matching this file's existing per-job `services:` duplication
    # (there is no third job that would justify extracting one).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      BIND_URL: 127.0.0.1:8080
      API_BASE_URL: http://127.0.0.1:8080
      RUST_LOG: info
      # See this job's own top comment for why these are safe dummies.
      INTERNAL_OAUTH_ISSUER_URL: http://internal-oauth.example.invalid
      INTERNAL_OAUTH_CLIENT_ID: distant-signal-internal-dummy
      SSO_ISSUER_URL: http://sso.example.invalid
      SSO_CLIENT_ID: distant-signal-dummy
      SSO_CLIENT_SECRET: distant-signal-dummy-secret
      SSO_REDIRECT_URL: http://localhost:3000/api/auth/callback
      SSO_POST_LOGIN_REDIRECT_URL: http://localhost:3000/
      VAPID_PUBLIC_KEY: BDummyVapidPublicKeyForLocalDevOnlyNotARealKeyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
      LINES_DIR: ${{ github.workspace }}/lines
      # Frontend build-time var: NEXT_PUBLIC_-prefixed values are inlined
      # into the browser bundle at `npm run build`, not read at runtime, so
      # this must be set before that step (chat.spec.ts's `**/mcp` mocks
      # intercept every request this fixture host resolves to, matching by
      # path glob rather than by host -- see that file's own comments).
      NEXT_PUBLIC_RAILMCP_PUBLIC_URL: http://mcp.example.invalid
      # frontend/e2e/fixtures/seed.sql's own fixture ids -- see that file's
      # header comment for what each backs and why the dates are fixed.
      E2E_REAL_LINE_ID: lner-ecml
      E2E_CUSTOM_LINE_ID: custom-fixture-commute
      E2E_REAL_STATION_CRS: KGX
      E2E_REAL_INCIDENT_ID: FIXTURE-INCIDENT-1
      E2E_TRAIN_UID: W12345
      E2E_TRAIN_DATE: 2026-09-17
      E2E_TRACKING_ID: "1"
      E2E_GROUP_ID: fixture-group-1
      E2E_GROUP_INVITE_TOKEN: fixture-invite-token-123456789
      E2E_SESSION_COOKIE: qhE59Tg8RipXqulYsgOav1p46-YsflwgjQxMa1K5lKY
      E2E_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo registry/target
        uses: Swatinem/rust-cache@v2

      - name: cargo build -p api
        run: cargo build -p api

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres,rustls --locked

      - name: Run api migrations
        working-directory: crates/api
        run: sqlx migrate run

      - name: Seed e2e fixtures
        run: psql "$DATABASE_URL" -f frontend/e2e/fixtures/seed.sql

      - name: Start api in the background
        run: |
          nohup ./target/debug/api > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/public/health > /dev/null; then
              echo "api is up"
              exit 0
            fi
            sleep 1
          done
          echo "api did not become healthy in time"
          cat api.log
          exit 1

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (chromium, firefox)
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox

      - name: npm run build (next build)
        working-directory: frontend
        run: npm run build

      - name: Start frontend in the background
        working-directory: frontend
        run: |
          nohup npm run start -- -p 3000 > frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "frontend is up"
              exit 0
            fi
            sleep 1
          done
          echo "frontend did not become ready in time"
          cat frontend.log
          exit 1

      - name: npx playwright test
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report + traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e-report/
            frontend/test-results/
          retention-days: 7

  # Custom: no reusable Piped/Piped-actions workflow covers Helm at all.
  # `helm lint` + `helm template` against both the chart's own defaults and
  # values-example.yaml (which turns on the optional pollers/devAuthentik
  # sections) gives real template-rendering coverage without needing a
  # cluster.
  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: helm lint (default values)
        run: helm lint charts/distant-signal

      - name: helm lint (values-example.yaml)
        run: helm lint charts/distant-signal -f charts/distant-signal/values-example.yaml

      # `enricher` and `trustConsumer` (unlike the pollers) have no
      # `enabled` toggle and their templates `fail()` at render time if
      # their required connection settings are left empty -- confirmed
      # locally: `helm template` with no overrides exits 1 on
      # `trustConsumer.kafka.brokers` (and llm/sso) being unset, even
      # though `helm lint` itself tolerates it. These --set dummy values
      # exist only to satisfy the guard rails for this smoke test; they
      # are not meant to be real settings.
      - name: helm template (default values)
        run: |
          helm template distant-signal charts/distant-signal \
            --set trustConsumer.kafka.brokers=kafka.example.com:9094 \
            --set trustConsumer.kafka.topic=test-topic \
            --set trustConsumer.kafka.saslMechanism=PLAIN \
            --set enricher.llm.baseUrl=http://llm.example.com/v1 \
            --set enricher.llm.model=test-model \
            --set api.sso.issuerUrl=https://sso.example.com \
            --set api.sso.clientId=test-client \
            --set api.sso.clientSecret=test-secret \
            --set api.sso.redirectUrl=https://app.example.com/callback \
            --set api.sso.postLoginRedirectUrl=https://app.example.com/ \
            > /dev/null

      - name: helm template (values-example.yaml)
        run: |
          helm template distant-signal charts/distant-signal -f charts/distant-signal/values-example.yaml \
            --set trustConsumer.kafka.brokers=kafka.example.com:9094 \
            --set trustConsumer.kafka.topic=test-topic \
            --set trustConsumer.kafka.saslMechanism=PLAIN \
            --set enricher.llm.baseUrl=http://llm.example.com/v1 \
            --set enricher.llm.model=test-model \
            --set api.sso.issuerUrl=https://sso.example.com \
            --set api.sso.clientId=test-client \

name: Dependency vulnerability scan

# Independent supply-chain vulnerability scan for Cargo.lock (workspace-wide)
# and frontend/package-lock.json, distinct from what Renovate already does
# (renovate.json5's osvVulnerabilityAlerts/vulnerabilityAlerts only opens a
# version-bump PR when Renovate itself already knows to touch a dependency --
# see docs/specs/dependency-security-scanning-investigation.md in the
# Ranma-Config repo for the full cross-repo rationale this workflow
# implements). This job runs on every PR, every push to main, AND on a daily
# schedule, regardless of whether Renovate has opened anything.
#
# ============================================================================
# TOOL CHOICE: the plain OSV-Scanner CLI binary, not the osv-scanner-action
# ============================================================================
#
# google/osv-scanner v2.6.0 (confirmed live: `curl -sL
# https://api.github.com/repos/google/osv-scanner/releases/tags/v2.6.0`,
# published 2026-09-14) directly supports both lockfile formats used in this
# repo (Cargo.lock, package-lock.json) in one invocation:
# `osv-scanner scan source -r .`. The binary + checksum below are pinned to
# that exact release rather than resolved via `latest` or a floating tag.
#
# The GitHub-only `google/osv-scanner-action` was deliberately NOT used here
# even though this repo is real GitHub-hosted (unlike Distant-Signal-MCP/
# coder-templates on the self-hosted Forgejo instance) -- using the plain CLI
# binary keeps this workflow's actual scanning mechanism identical to what
# the same job needs to look like on Forgejo Actions elsewhere, rather than
# maintaining two different mechanisms for the same job across repos. A SARIF
# upload to GitHub's native Code Scanning tab remains a reasonable optional
# follow-on (GitHub-only, no Forgejo equivalent) but is not implemented here.
#
# ============================================================================
# SEVERITY THRESHOLD: no native --fail-on-severity flag exists in v2.6.0
# ============================================================================
#
# Confirmed live by actually running `osv-scanner scan source --help`
# against the pinned v2.6.0 binary: there is no severity-threshold/fail-on
# flag of any kind. `osv-scanner scan source` exits 1 if ANY vulnerability is
# found at ANY severity (confirmed live: a real run against this repo's own
# Cargo.lock/frontend/package-lock.json at the time this workflow was written
# found 42 total advisories, only 18 of them CVSS >= 7.0, and the bare exit
# code did not distinguish between the two). So this workflow ignores the
# binary's own exit code entirely and instead computes the HIGH/CRITICAL
# count itself from the `--format json` output's `results[].packages[].
# groups[].max_severity` field (a CVSS v3 base score string, using the
# standard >= 7.0 HIGH-and-up cutoff; empty for purely informational
# advisories with no CVSS score at all, e.g. unmaintained-crate notices like
# RUSTSEC-2021-0141 for `dotenv`, which this repo's own Cargo.lock currently
# carries and which should NOT fail this job on its own).
#
# ============================================================================
# TRIGGERS AND BLOCK-VS-ALERT
# ============================================================================
#
# - pull_request (branches: [main, dev], matching ci.yml's own branch set):
#   fails the job on any HIGH/CRITICAL finding -- a human is looking at this
#   PR right now, and this failing check can gate merge via branch
#   protection.
# - push (branches: [main] only -- deliberately narrower than ci.yml's
#   [main, master, dev], scoped to just what this workflow's own ask needs;
#   widen to match ci.yml if a reviewer prefers full consistency): same scan,
#   same threshold, still fails the job -- framed as a loud alert since
#   nothing can un-merge what already landed, catching a vulnerability
#   disclosed between PR approval and merge, or a direct push that bypassed
#   review.
# - schedule (daily, see the cron comment below): the identical scan against
#   the current tip of main, but NEVER fails the job -- a cron job failing
#   has no PR to block and no obvious owner watching it, so instead a second
#   `report-findings` job (gated `if: always()`, mirroring
#   validate-line-catalogue.yml's own `report-findings` job almost exactly,
#   down to the same actions/github-script pinned commit and the same
#   open-one-issue/comment-if-already-open/close-when-clean dedup design)
#   opens or updates a single tracking issue labeled `dependency-vulnerability`.

concurrency:
  group: dependency-scan-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  schedule:
    # Daily (not weekly, unlike validate-line-catalogue.yml's disabled
    # weekly cron): newly-disclosed CVEs in already-merged dependencies are
    # this trigger's entire reason to exist (per this spec's own stated
    # goal), and a same-day catch is meaningfully better than a week's worth
    # of exposure window for something like a RUSTSEC/GHSA advisory dropping
    # the day after a merge. 05:23 UTC is an arbitrary early-UTC off-peak
    # slot with no significance beyond avoiding the exact top of the hour,
    # matching validate-line-catalogue.yml's own stated reasoning for its
    # (currently disabled) weekly cron's minute choice.
    - cron: "23 5 * * *"

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-24.04
    outputs:
      high_or_critical_count: ${{ steps.scan.outputs.high_or_critical_count }}
      total_count: ${{ steps.scan.outputs.total_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify OSV-Scanner v2.6.0 (linux_amd64)
        # Pinned to the exact release tag + asset name + published SHA-256
        # checksum, all confirmed live against
        # github.com/google/osv-scanner/releases/tag/v2.6.0 (and its
        # published osv-scanner_SHA256SUMS file) at the time this workflow
        # was written -- not resolved via `latest` or a floating tag.
        run: |
          set -euo pipefail
          curl -sL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64"
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: Scan Cargo.lock + frontend/package-lock.json (OSV-Scanner)
        id: scan
        run: |
          set +e
          ./osv-scanner scan source -r . --format json --output-file osv-results.json
          echo "osv-scanner exited $? (ignored -- see this workflow's own header comment: the binary's exit code doesn't distinguish severity, so HIGH/CRITICAL is computed below instead)"
          set -e

          total=$(jq '[.results[]?.packages[]? | .groups[]?] | length' osv-results.json)
          high_or_critical=$(jq '
            [.results[]?.packages[]?
              | .groups[]?
              | select(.max_severity != null and .max_severity != "" and (.max_severity | tonumber) >= 7.0)
            ] | length
          ' osv-results.json)

          echo "total_count=$total" >> "$GITHUB_OUTPUT"
          echo "high_or_critical_count=$high_or_critical" >> "$GITHUB_OUTPUT"
          echo "Found $high_or_critical HIGH/CRITICAL (CVSS >= 7.0) finding(s) out of $total total advisory group(s)."

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osv-scanner-results
          path: osv-results.json
          retention-days: 30

      - name: Fail on HIGH/CRITICAL findings (pull_request/push only)
        if: github.event_name != 'schedule'
        run: |
          count="${{ steps.scan.outputs.high_or_critical_count }}"
          if [ "$count" -gt 0 ]; then
            echo "::error::$count HIGH/CRITICAL (CVSS >= 7.0) dependency vulnerability finding(s) -- see the osv-scanner-results artifact for full detail."
            exit 1
          fi
          echo "No HIGH/CRITICAL findings."

  # Cron-only alerting path -- mirrors validate-line-catalogue.yml's own
  # report-findings job almost exactly (same pinned actions/github-script
  # commit, same "one deduplicated open tracking issue, comment instead of a
  # second issue while one's already open, close-with-a-comment when clean"
  # design). See that workflow's own header comment for the full rationale;
  # not re-derived here since none of it is specific to dependency scanning.
  report-findings:
    needs: scan
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Download scan results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: osv-scanner-results

      - name: Open, update, or close the tracking issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const label = 'dependency-vulnerability';
            const highOrCritical = parseInt('${{ needs.scan.outputs.high_or_critical_count }}', 10) || 0;
            const total = '${{ needs.scan.outputs.total_count }}';
            const passed = highOrCritical === 0;

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (passed) {
              for (const issue of openIssues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `The daily dependency vulnerability scan is clean again (0 HIGH/CRITICAL findings): ${runUrl}`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
              return;
            }

            let osvJson = '(no osv-results.json captured)';
            try {
              osvJson = fs.readFileSync('osv-results.json', 'utf8');
            } catch (err) {
              osvJson = `(failed to read osv-results.json: ${err.message})`;
            }

            // Summarize rather than dump the full JSON (it can be large):
            // one line per affected package/group with its max CVSS score.
            let summaryLines = [];
            try {
              const parsed = JSON.parse(osvJson);
              for (const result of parsed.results ?? []) {
                for (const pkg of result.packages ?? []) {
                  for (const group of pkg.groups ?? []) {
                    const sev = group.max_severity || '(no CVSS score)';
                    summaryLines.push(`- ${pkg.package.ecosystem}/${pkg.package.name}@${pkg.package.version}: ${group.ids.join(', ')} (max CVSS ${sev})`);
                  }
                }
              }
            } catch (err) {
              summaryLines = [`(failed to parse osv-results.json: ${err.message})`];
            }
            if (summaryLines.length > 200) {
              summaryLines = summaryLines.slice(0, 200).concat(['... (truncated, see the full osv-scanner-results artifact on the workflow run below)']);
            }

            const body = [
              `The daily dependency vulnerability scan found ${highOrCritical} HIGH/CRITICAL (CVSS >= 7.0) finding(s), out of ${total} total advisory group(s).`,
              '',
              `Workflow run: ${runUrl}`,
              '',
              ...summaryLines,
            ].join('\n');

            if (openIssues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Dependency vulnerability scan: HIGH/CRITICAL findings',
                body,
                labels: [label],
              });
            }

# hadolint config for every tracked Dockerfile (docker/*.Dockerfile,
# frontend/Dockerfile). CI: the `scripts-lint` job, via
# scripts/lint-scripts.sh, which passes this file explicitly. hadolint is
# pinned in pyproject.toml's `lint` dependency group (hadolint-py).
#
# Strict by default: every rule on at its default severity, and any finding,
# down to style level, fails. hadolint also runs its embedded ShellCheck
# over each shell-form RUN (default checks only: it does not read
# .shellcheckrc, so the optional checks tracked *.sh files get do not apply).
# Opt out per instruction with the line directly above it:
#   # hadolint ignore=DLxxxx # reason
# never with a global `ignored:` list here, unless a rule genuinely
# conflicts repo-wide. There are none at present.
#
# Local opt-outs in use:
#   DL3008 (pin versions in apt-get install), every `apt-get install`: the
#   repo pins the base image by digest (Renovate bumps it, pinDigests) and
#   takes whatever Debian packages that release's archive carries at build
#   time. Pinning `pkg=version` would break rebuilds: each bookworm suite in
#   the archive keeps only its current version of a package (a security or
#   point release removes the old one), and Renovate has no built-in
#   manager for apt versions in a Dockerfile, so a pin would go stale and
#   the next rebuild would fail to install it.
failure-threshold: style

# Every FROM is a Docker Hub official image (rust, debian, node), pinned by
# tag and digest. A new registry (ghcr.io, quay.io, ...) fails DL3026 until
# it is added here deliberately.
trustedRegistries:
  - docker.io

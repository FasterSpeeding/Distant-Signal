apiVersion: v2
name: distant-signal
description: >-
  National Rail status stack: PostgreSQL, the api, the aggregator, the
  frontend and five optional pollers (four Rail Data Marketplace, plus TfL),
  mirroring the topology of the repository's docker-compose.yml.
type: application

# Chart version BASE: still bumped by hand, still only for chart-only
# changes (template/values/schema changes), same discipline as before --
# see git log on this file. What changed: this is no longer necessarily
# the literal version that ends up pushed to the OCI registry. CI (see
# `push-helm-chart` in .github/workflows/containers.yml) appends its own
# build-metadata suffix on every push to main -- chart files touched or
# not -- producing e.g. `0.2.2+build.42.sha.860c190` via
# `helm package --version`, so every push mints a genuinely new,
# immutable, distinguishable chart tag instead of silently re-pushing
# this same bare string. Bump this when the chart's own shape changes;
# CI's suffix is what makes each push distinct in the registry.
version: 0.2.2

# Local-dev fallback ONLY. CI unconditionally overrides this at package
# time (`helm package --app-version`, see `push-helm-chart`'s own comment
# in .github/workflows/containers.yml) to `sha-<short-sha>` of whatever
# commit that run's images were built from -- the same tag
# docker/metadata-action's `type=sha` rule mints for every one of those
# images, so the chart's default `image.tag` (via `_helpers.tpl`'s
# `distant-signal.image` helper) always resolves to the exact images
# that were just built and pushed alongside it, not stale ones from
# whenever this field was last hand-bumped. This static value is only
# ever seen by someone running `helm package`/`helm template`/`helm
# install` straight from a checkout without going through CI -- keep it
# tracking the workspace crate version (crates/api/Cargo.toml) for that
# case, but it is NOT the source of truth for anything CI publishes.
#
# SUPERSEDED, for first-party images, whenever that same `push-helm-chart`
# job also pins a per-service `*.image.digest` (values.yaml) -- see that
# job's "Pin first-party image digests into values.yaml" step and
# `distant-signal.image`'s own comment in templates/_helpers.tpl. A set
# `image.digest` renders `<repo>@<digest>` and ignores `tag`/appVersion
# entirely; appVersion (via `tag`) only remains the effective default for
# any service whose digest wasn't populated for some reason (see that
# step's own comment on when that happens).
appVersion: "0.1.0"

# templates/networkpolicy.yaml selects the ingress-controller namespace via
# the automatic `kubernetes.io/metadata.name` label, which is GA from 1.22.
kubeVersion: ">=1.23.0-0"

home: https://github.com/FasterSpeeding/nr-status-v2
sources:
  - https://github.com/FasterSpeeding/nr-status-v2

# Deliberately no `dependencies:` — the chart bundles its own PostgreSQL
# StatefulSet rather than pulling a subchart, so `helm dependency update` is
# never needed and the chart installs in an air-gapped cluster.

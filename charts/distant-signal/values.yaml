# ---------------------------------------------------------------------------
# pollerIrishRailLive (crates/poller-irish-rail-live/src/config.rs: Config)
# -- Tier B of docs/superpowers/specs/2026-09-05-ireland-rail-support-design.md.
# Gets its own bespoke Deployment template for the same reason
# pollerIrishRailGtfs does (Judgment Call #2): api.irishrail.ie's legacy
# realtime service is unauthenticated, no API key at all, so this crate's
# Config doesn't fit the generic `.Values.pollers` map's RDM-API-key shape
# either.

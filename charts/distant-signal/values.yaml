# ---------------------------------------------------------------------------
# scheduleFeed -- OPT-IN CIF SCHEDULE feed SFTP-push receiver
# (docs/superpowers/specs/2026-09-01-schedule-feed-push-design.md)
# ---------------------------------------------------------------------------
# Renders ONE Deployment with three containers (an SFTP server, this app's
# own schedule-ingest verifier, and schedule-reference) sharing one
# ReadWriteOnce PVC -- see the
# design doc's "The reader/writer problem push introduces" for why this is
# one Pod, not two. Off by default: enabling this without a real DTD push
# account configured (see docs/superpowers/plans/2026-09-01-schedule-feed-push-ingestion.md
# Task 1; pruned from the tree in b7f71a8a, read it from the repo history) stands up infrastructure nothing can reach yet, which is a
# legitimate thing to do ahead of time but not silently assumed to be "done."
scheduleFeed:
  enabled: false
  sftp:
    # -- Run the SFTP receiver (the `sftp` container, its Service/NodePort,
    # host keys and entrypoint). On by default, so existing values render
    # unchanged. Off for bucket-only delivery (scheduleFeed.bucket); the
    # PVC and the ingest/reference containers stay. scheduleFeed.enabled
    # with neither source enabled fails the render.
    enabled: true
    image:
      repository: drakkan/sftpgo
      # -- MUST be a real drakkan/sftpgo tag, NOT left empty: unlike every
      # distant-signal/* image above, an empty tag here does NOT track
      # "this app's own version" -- it falls through `distant-signal.image`
      # (templates/_helpers.tpl) straight to Chart.AppVersion, which is
      # THIS CHART's own version (0.1.0), not an sftpgo release. That
      # exact confusion previously shipped `0.1.0` as the effective
      # default here -- a tag that has never existed on Docker Hub for
      # drakkan/sftpgo -- causing every scheduleFeed.enabled=true install
      # to ImagePullBackOff. v2.7.5 confirmed live against Docker Hub's
      # real registry API (2026-09-03): its manifest digest
      # (sha256:9011fe...c58738) is byte-identical to drakkan/sftpgo's
      # own `latest` tag, and matches upstream's GitHub "latest release"
      # (github.com/drakkan/sftpgo/releases/tag/v2.7.5, published
      # 2026-07-17). Pinned rather than left on `latest`/`edge`, matching
      # this chart's other third-party images (devAuthentik.image.tag,
      # postgres/redis tags above) -- docker-compose.yml's schedule-sftp
      # service is pinned to the same tag for the same reason.
      # Digest-pinned (INF-11): the digest above, which production runs.
      tag: "v2.7.5@sha256:9011fe608d336d3daf6ed6224b16fd40443aab8f3335e0b20853d6a539c58738"
      pullPolicy: IfNotPresent
    # -- SFTPGo's own default container port -- not independently
    # re-verified against a real deployed instance by this plan.
    port: 2022
    # -- Source CIDRs allowed to reach the SFTP port when
    # networkPolicy.enabled (INF-2), e.g. DTD's published egress range.
    # Empty allows any source. Only effective when the pod sees the real
    # client IP (scheduleFeed.service.externalTrafficPolicy: Local, or a
    # load balancer that preserves it); behind source NAT a non-empty list
    # blocks every push. See templates/networkpolicy.yaml.
    allowedCidrs: []
    # -- Purely informational: the public hostname/DNS name an operator has
    # pointed at this Service's LoadBalancer, i.e. what actually gets
    # handed to DTD alongside the port/username/destination below. This
    # chart cannot set a Service's externally-visible hostname itself (that
    # comes from wherever the LoadBalancer/DNS is provisioned) -- setting
    # this value only makes it show up in `helm install`'s NOTES.txt output
    # as a single place to review everything DTD needs, instead of hunting
    # it down separately. Leave empty to have NOTES.txt tell you to fill it
    # in once known.
    publicHostname: ""
    # -- The push account's username on THIS app's server. This app mints
    # this account, not DTD -- so unlike a genuinely external credential
    # there's nothing to look up, and a fixed default is fine. Communicate
    # this (and the auto-generated password below) to DTD once its push
    # configuration is known -- see NOTES.txt.
    username: dtd-push
    # -- "password" or "public-key". NO DEFAULT: RSPS5046 states neither
    # mechanism for either delivery direction (design doc's own primary-
    # source re-check). Enabling without setting this aborts rendering.
    authMethod: ""
    # -- Used when authMethod=password. Auto-generated and preserved across
    # `helm upgrade`s when left empty -- CORRECTED 2026-09-01 from an
    # earlier "never auto-generated" rule that wrongly treated this like an
    # externally-assigned credential (see schedulefeed-secret.yaml's own
    # corrected comment): this app mints the account, so there's nothing
    # external for a random value to fail to match. Set explicitly only if
    # you need a specific value; otherwise see NOTES.txt for how to read
    # back what was generated, to hand to DTD.
    password: ""
    # -- DTD's public key, used when authMethod=public-key AND DTD's push
    # configuration turns out to support supplying one (unconfirmed).
    publicKey: ""
    # -- Minimum length for the push account password (authMethod:
    # password). A `password` set above is checked at render time; one from
    # existingSecret (e.g. a sealed secret) is checked by the sftp
    # entrypoint at start, which refuses to start (`enforce: true`) or only
    # logs a warning (`enforce: false`). Only the length is ever logged. The
    # generated default is 32 random alphanumerics, log2(62^32) ~ 190 bits.
    passwordPolicy:
      minLength: 24
      enforce: true
    existingSecret: ""
    existingSecretPasswordKey: schedule-sftp-password
    existingSecretPublicKeyKey: schedule-sftp-dtd-public-key
    # -- This app's OWN generated SSH host key, NOT DTD's -- inverted from
    # the (superseded) pull design's dtd_sftp_host_key_fingerprint. Leave
    # empty to have the chart generate and preserve one (Task 6).
    existingSecretHostKey: ""
    # -- Keys in the host-key Secret that SFTPGo serves as its SSH host
    # keys (SFTPGO_SFTPD__HOST_KEYS). Each must hold a PEM private key.
    # ecdsa (P-256) is included because DTD's push client (JSch 0.1.54)
    # has no ed25519 support; ed25519 serves modern clients. The chart
    # generates and preserves both when it owns the Secret; with
    # existingSecretHostKey, that Secret must hold every listed key. An
    # empty list leaves SFTPGo generating fresh, unpinnable keys on every
    # start (the pre-2026-10-01 behaviour).
    hostKeys:
      - ssh_host_ecdsa_key
      - ssh_host_ed25519_key
    # -- SFTPGo's web admin/REST (httpd) listener. Off: an enabled httpd
    # with no admin account lets whoever reaches /web/admin/setup first
    # create one and take over the server. Only enable with an admin
    # provisioned via extraEnv and a NetworkPolicy that limits access.
    webAdmin:
      enabled: false
    # -- Extra env vars for the SFTPGo container (e.g. SFTPGO_* settings
    # for telemetry, the defender or logging). Same shape as a container
    # `env` list. An entry named like one the chart sets replaces it (one
    # entry per name; server-side apply rejects a repeated name); other
    # entries follow the chart's own.
    extraEnv: []
    # -- SFTPGo permissions the push account has on its home directory
    # (the only directory it can see). Least privilege, from what DTD's
    # JSch 0.1.54 client was seen to do (docs/schedule-feed-sftp.md):
    # `upload` to write files; `overwrite` because DTD replaces
    # timetable_full.zip in place every day (schedule-ingest reads it where
    # it lands and never removes it); `list` because SFTP stat/lstat need
    # it, and a client that stats or cds before its put would fail without
    # it. No download, delete, rename, mkdir, symlink, chmod/chown/chtimes
    # or copy. Any SFTPGo permission name except "*" is accepted.
    permissions:
      - upload
      - overwrite
      - list
    # -- Simultaneous SFTP sessions for the push account (SFTPGo
    # max_sessions). DTD opens one per delivery; 2 leaves room for a retry
    # while a stalled session times out. 0 = unlimited.
    maxSessions: 2
    # -- Largest single upload the push account may write, in bytes (SFTPGo
    # filters.max_upload_file_size; an upload past it fails and the partial
    # file is deleted). The full CIF zip was 77,222,226 bytes on
    # 2026-09-30 and the CORPUS extract is under 1 MB, so 512 MiB is ~6.6x
    # the largest real file, and keeps one upload well inside the 5Gi PVC.
    # 0 = unlimited.
    maxUploadFileSize: 536870912
    # -- SSH commands SFTPGo runs besides the SFTP subsystem
    # (SFTPGO_SFTPD__ENABLED_SSH_COMMANDS; the image enables md5sum,
    # sha1sum, sha256sum, cd, pwd and scp). None: DTD only uses SFTP.
    sshCommands: []
    # -- SFTPGo's built-in defender (fail2ban-style, in-process): bans a
    # source IP whose score reaches `threshold` within `observationTime`
    # minutes. Scores: a wrong password for an existing account
    # (`scoreValid`), an unknown username (`scoreInvalid`), a rate-limit or
    # per-host connection-limit hit (`scoreLimitExceeded`), a connection
    # that never tried to authenticate (`scoreNoAuth`). Only meaningful when
    # the pod sees real client IPs (scheduleFeed.service.externalTrafficPolicy:
    # Local): behind source NAT every client shares one address, and a ban
    # locks everyone out, the feed provider included. Bans live in memory
    # (driver "memory"), so a pod restart clears them all. Rendered as
    # SFTPGO_COMMON__DEFENDER__* env vars. With these defaults a source is
    # banned after about 2 connections with a wrong password (OpenSSH and
    # JSch each try keyboard-interactive and then password, 2 x 2 x 2 = 8)
    # or 4 failed attempts at unknown usernames.
    defender:
      enabled: true
      # -- Minutes a host stays banned.
      banTime: 60
      # -- Each connection a banned host makes adds this percentage of
      # banTime to its ban (100 = another banTime per attempt).
      banTimeIncrement: 100
      threshold: 8
      scoreInvalid: 2
      scoreValid: 2
      scoreLimitExceeded: 4
      # -- 0 on purpose: the kubelet's TCP liveness probe and port scanners'
      # banner reads connect and close without authenticating, and must
      # never score.
      scoreNoAuth: 0
      # -- Minutes of history a host's score covers.
      observationTime: 30
      # -- Hosts (scored or banned) kept in memory; trimmed back to the soft
      # limit when the hard limit is reached.
      entriesSoftLimit: 500
      entriesHardLimit: 1000
      # -- Source IPs/CIDRs the defender never scores or bans, and the rate
      # limiter never limits (SFTPGo IP lists of type "defender" in allow
      # mode, and "rate limiter safe list"), loaded through the same
      # --loaddata-from file as the push account. Leave the kubelet's probe
      # source out unless scoreNoAuth is raised: its probes never
      # authenticate, so they never score, and behind source NAT the probe
      # address is every client's address.
      safelist: []
    # -- Max simultaneous connections from one source IP (SFTPGo
    # common.max_per_host_connections; upstream default 20). Exceeding it
    # scores defender.scoreLimitExceeded. 0 disables the limit.
    maxPerHostConnections: 8
    # -- Per-source-IP SSH connection rate limit (SFTPGo
    # common.rate_limiters[0], type 2 = per source). `average` connections
    # per `periodMs`, bursting to `burst`. Each rejected connection scores
    # defender.scoreLimitExceeded. average: 0 disables it. The kubelet's TCP
    # probe makes 2 connections a minute from the node address.
    rateLimit:
      average: 20
      periodMs: 60000
      burst: 10
      # -- Source IPs the per-source limiter keeps in memory; trimmed back to
      # the soft limit when the hard limit is reached (SFTPGo
      # rate_limiters[0].entries_soft_limit/entries_hard_limit). Set
      # explicitly, like the rest of the limiter, rather than left to the
      # image's config file; 100/150 are SFTPGo's documented defaults. Only
      # rendered while the limiter is on (average > 0). The soft limit must
      # be below the hard limit.
      entriesSoftLimit: 100
      entriesHardLimit: 150
    # -- SFTPGo log level (SFTPGO_LOG_LEVEL), set explicitly rather than
    # left to the image default. Keep "debug": SFTPGo logs failed logins
    # (sender "connection_failed") and defender score changes only at
    # debug; bans are at info. Log-based alerts on failed logins need it.
    # The time field is always UTC (SFTPGO_LOG_UTC_TIME).
    logLevel: debug
    # -- SFTPGo's telemetry listener (/metrics, /healthz) on `port`, scraped
    # by the PodMonitor's `sftp-metrics` endpoint. Needs metrics.enabled.
    # Never on the NodePort Service; the NetworkPolicy admits only the
    # monitoring namespace. Feeds the distant-signal.schedule-sftp alerts.
    telemetry:
      enabled: true
      port: 9097
    # -- The folder DTD's account lands files in. CORRECTED 2026-09-01
    # (this task): this account's SFTP home/chroot directory is set to
    # EXACTLY /data/schedule-feed/<this value+folderPath> (see
    # schedulefeed-deployment.yaml's SCHEDULE_SFTP_HOME_DIR and
    # schedulefeed-configmap.yaml's provisioning script), so DTD's push
    # client actually sees itself uploading to "/" once connected --
    # "incoming" here just names where that lands on this app's own
    # filesystem, not a subfolder DTD navigates into. Rendered into both
    # the ingest container's WATCH_DIR (schedulefeed-deployment.yaml) and
    # NOTES.txt's connection summary, so the two stay in sync -- there's
    # exactly one place this is set. SFTPGo's own account-provisioning
    # mechanism (--loaddata-from) is now confirmed against SFTPGo's real Go
    # source (see schedulefeed-configmap.yaml's header comment for the
    # citations); what remains unverified is only whether this exact
    # chart, deployed to a real cluster, behaves as that source reading
    # predicts (docker/podman were not available to test this in this
    # pass -- see this task's own report).
    # drakkan/sftpgo doing nothing but accepting one SFTP session a day and
    # streaming a zip to the shared PVC. The smallest container in the chart;
    # it holds no application state at all.
    #
    # Limit trimmed from 256Mi to 128Mi 2026-09-26: live `kubectl top` on the
    # mine-bringer cluster showed steady-state usage of ~33Mi -- 256Mi was
    # ~8x that. Halved rather than sized to the snapshot, since a large CIF
    # delivery can legitimately spike this.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    destinationFolder: incoming
    # -- Optional deeper subfolder within destinationFolder, e.g. "2026"
    # for DTD to land files in "/incoming/2026". Empty by default: RSPS5046
    # does not call for one, and neither push design doc's own manifest
    # research found any need for date/version subfolders -- this exists
    # only in case the real end-to-end test in an internet-exposed
    # environment finds DTD's push client wants one.
    folderPath: ""
  ingest:
    # -- /livez stall window (see workerHealth) for one scan cycle, which
    # includes posting a whole delivery to api. Served on workerHealth.port.
    progressStallSecs: 1800
    image:
      repository: ghcr.io/fasterspeeding/distant-signal/schedule-ingest
      tag: ""
      # -- Content digest override. See api.image.digest's own comment above
      # for the full rationale; same shape here.
      digest: ""
      pullPolicy: IfNotPresent
    checkTimes: "22:00,22:30,23:00,23:30,00:00,00:30,01:00,01:30,16:00"
    # -- Seconds between watch_dir scans. Replaces checkTimes as the thing
    # that controls scan *frequency* -- checkTimes' only remaining job is
    # marking the day's final realistic delivery window (its last entry)
    # for error-vs-info log severity once a delivery is still incomplete.
    # scan_incoming is a cheap local read_dir+stat with no network call, so
    # a short interval costs essentially nothing; this is what fixes a real
    # delivery landing outside every checkTimes slot sitting unprocessed
    # for hours.
    pollIntervalSecs: 120
    # -- How many complete deliveries to retain on disk (current +
    # fallback). Renamed from retentionKeepSequences: the real delivery is
    # a single overwritten-in-place zip with no sequence number, so
    # schedule-ingest now keys retained deliveries by their own timestamp
    # instead -- see docs/superpowers/specs/2026-09-03-schedule-feed-zip-delivery-correction.md.
    retentionKeepDeliveries: 3
    # -- Consecutive stable (unchanged mtime/size) polls before a file is
    # treated as complete. Raised from this crate's original default of 2
    # alongside shrinking pollIntervalSecs to 120s, so the time-based
    # stability window (now 5 * 120s = 10 minutes) stays a meaningful
    # signal rather than shrinking to 4 minutes.
    stabilityCycles: 5
    # -- Where the ingest container records each feed delivery and loads
    # each CORPUS extract (`INGEST_SINK`, ingest architecture plan 2d):
    # `http` (api's /private/schedule-feed-ingests and
    # /private/corpus-locations, as before) or `db` (Postgres directly,
    # with the same validation; adds DATABASE_URL, the NetworkPolicy
    # Postgres egress and ingress, and this pool to the connection
    # budgets). Under `db` the CORPUS freshness gauge and the post-load
    # comparison come from the ingest-writer's CORPUS loop, so turn
    # `ingestWriter` and its loops on first.
    sink: http
    database:
      # -- The pool under `sink: db` (DATABASE_MAX_CONNECTIONS; spec §6.6:
      # 1). Scans are sequential, so one connection is enough.
      maxConnections: 1
    # -- Extra env vars for the ingest container. Same shape as a
    # container `env` list. An entry named like one the chart sets
    # replaces it (one entry per name); other entries follow the chart's.
    extraEnv: []
    existingSecret: ""
    internalOauthUsername: ""
    internalOauthPassword: ""
    existingSecretInternalOauthUsernameKey: internal-oauth-username-schedule-ingest
    existingSecretInternalOauthPasswordKey: internal-oauth-password-schedule-ingest
    # A read_dir/stat scan loop plus an unzip of the delivered archive to the
    # same PVC. It streams rather than buffering the whole extract, so it sits
    # much closer to the sftp container than to `reference` below.
    #
    # Limit trimmed from 512Mi to 256Mi 2026-09-26: live `kubectl top` on the
    # mine-bringer cluster showed steady-state usage of ~5Mi -- 512Mi was
    # ~100x that. Halved rather than sized to the snapshot, since a large
    # CIF delivery can legitimately spike this.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    # -- Case-insensitive `*` globs (comma-separated) naming CIF deliveries
    # in the landing folder. Locked to DTD's exact delivery name
    # (2026-09-28) because the same SFTP account also receives other feeds;
    # every other file is logged once as a stray and left alone.
    cifFilePattern: "timetable_full.zip"
    # -- Globs that are never CIF deliveries even when they match
    # cifFilePattern. The same SFTP account also receives
    # CORPUSExtract.json.gz (CORPUS) and CORPUSExtract.csv.gz (SMART berth
    # data); a zip of either must never be published as the timetable.
    cifExcludePattern: "CORPUSExtract*"
    # -- Content checks on each extracted CIF delivery before it is marked
    # complete (crates/schedule-ingest/src/cif_check.rs). Always on: the MCA
    # must be a full CIF extract (an HD header with update indicator F,
    # known record types, one ZZ trailer) and the MSN must carry a
    # Generated date. A failure quarantines the delivery with the reason
    # (DistantSignalScheduleFeedZipRejected) and the previous timetable
    # stays in service. 0 disables each threshold below.
    cifChecks:
      # -- Days the MSN Generated date may trail the delivery (a replayed
      # old extract). Real deliveries are generated the same day.
      maxGeneratedAgeDays: 3
      # -- Fewest schedule (BS) records an MCA may have; the real full
      # extract has ~505,000.
      minSchedules: 100000
      # -- Largest drop, in percent, of the BS or TI record count since the
      # last accepted delivery. Real day-to-day changes are under 0.3%.
      maxRecordDropPercent: 20
  # -- Network Rail CORPUS location reference data, pushed by RDM to the SAME
  # SFTP account and landing folder as the CIF feed and loaded by the
  # `ingest` container into api's corpus_locations table (whole-table
  # replace per delivery). OFF by default: while off, a CORPUS file is left
  # in the landing folder with a one-time "stray file" warning. Before
  # enabling, add the schedule-ingest service account
  # (ingest.internalOauthUsername) to api.internalOauth.groups.corpus in
  # Authentik. See docs/superpowers/specs/2026-09-28-corpus-sftp-ingest-design.md.
  corpus:
    enabled: false
    # -- Globs naming the CORPUS extract. Only this gzipped-JSON shape is
    # loaded; CORPUSExtract.csv.gz (SMART) is deliberately ignored.
    filePattern: "CORPUSExtract.json.gz"
    # -- An extract with fewer rows is rejected (real: ~56,000), so a
    # truncated or placeholder file cannot wipe the table.
    minRows: 10000
    # -- gzip-bomb guard: the most bytes an extract may decompress to (the
    # real one is ~7 MB).
    maxDecompressedBytes: 268435456
    # -- Processed extracts are moved out of the landing folder into
    # /data/schedule-feed/corpus/ (rejected ones into corpus/rejected/);
    # this many of each are kept.
    retentionKeep: 3
  # -- The Google Cloud Storage delivery source (docs/schedule-feed-bucket.md):
  # schedule-ingest polls a dedicated bucket that the feed provider pushes
  # into, downloads only expected names, verifies size and CRC32C,
  # archives each object on the PVC, then deletes it from the bucket. Runs
  # alongside SFTP or instead of it. The bucket and its IAM are
  # charts/ds-ingest-bucket's. Off by default. Needs a schedule-ingest
  # image with the bucket source.
  bucket:
    enabled: false
    # -- Only `gcs` is implemented.
    provider: gcs
    # -- Bucket name. Required when enabled; set in deploy values.
    name: ""
    # -- Empty: https://storage.googleapis.com. Set only for a fake-GCS
    # test server.
    baseUrl: ""
    # -- How the reader authenticates to GCS. `key` (the default): a
    # sealed service-account key from existingSecret
    # (GOOGLE_SERVICE_ACCOUNT_PATH). `workloadIdentity`: keyless; Google
    # Workload Identity Federation trusts the cluster's service-account
    # token issuer, and the reader exchanges a projected token through STS
    # and service-account impersonation (GOOGLE_APPLICATION_CREDENTIALS,
    # see workloadIdentity below). Needs scheduleFeed.serviceAccount.
    # Anything else fails the render.
    auth: key
    # -- `key` mode only: pre-existing Secret holding the reader's
    # service-account key (sealed in deploy config, never in values).
    # Required in that mode, refused in workloadIdentity mode. Mounted
    # read-only into `ingest` only, as an optional volume, so a missing
    # Secret leaves SFTP running and raises
    # DistantSignalScheduleBucketAccessRevoked instead of blocking the pod.
    existingSecret: ""
    # -- `key` mode only: key in existingSecret holding the JSON key.
    serviceAccountKey: service-account.json
    workloadIdentity:
      # -- Audience of the projected service-account token: the audience
      # the Google workload identity pool provider allows.
      audience: gcp-ds-ingest
      # -- Pre-existing ConfigMap holding the `external_account` credential
      # configuration (no secret in it; deploy config owns it). Required in
      # workloadIdentity mode. Its `credential_source.file` must be
      # /var/run/secrets/distant-signal/gcs-token/token, where the chart
      # mounts the projected token. Mounted read-only into `ingest` only,
      # as an optional volume, like the key Secret.
      credentialConfigMap: ""
      # -- Key in credentialConfigMap holding that JSON.
      credentialConfigKey: credential-config.json
    # -- Object names (case-insensitive `*` globs, bucket root only) the
    # reader downloads. Anything else is flagged and deleted unread after
    # deleteMinAgeSecs.
    expectedKeys:
      - timetable_full.zip
      - CORPUSExtract.json.gz
    # -- Seconds between bucket listings. At least 60.
    pollIntervalSecs: 300
    # -- An object is deleted only once it is this old, so the
    # publisher's read-back and malware scan finish first. Under 6 days
    # (the bucket's lifecycle backstop is 7).
    deleteMinAgeSecs: 3600
    # -- Raw objects kept under /data/schedule-feed/sources/bucket/archive.
    archiveKeep: 5
    # -- Objects listed larger than this are never downloaded (flagged as
    # unexpected). At most maxDownloadBytesPerHour.
    maxObjectBytes: 268435456
    # -- Loop guards: downloads per poll, and bytes per rolling hour and
    # day. A capped hour or day raises DistantSignalScheduleBucketDownloadBudget.
    maxDownloadsPerPoll: 2
    maxDownloadBytesPerHour: 268435456
    maxDownloadBytesPerDay: 1073741824
    # -- Ceiling of the exponential backoff after errors, and the retry
    # interval while access is revoked. At least pollIntervalSecs.
    maxBackoffSecs: 3600
    # -- Ship the bucket's Cloud Audit Logs (from the audit-log bucket) to
    # stdout as `schedule_ingest::bucket_access` lines for Loki. Off.
    auditLogs:
      ship: false
      # -- Audit-log bucket name. Required with ship.
      bucket: ""
      pollIntervalSecs: 600
  # -- Third sibling container in this same Pod (crates/schedule-reference):
  # once `ingest` has moved a verified-complete delivery into
  # storage_dir/<n>/, parses that sequence's TI/A records into the
  # STANOX->CRS table and POSTs it to api's /private/stanox-crs. See
  # docs/superpowers/specs/2026-09-01-schedule-ingest-stanox-crs-table-design.md.
  reference:
    # -- Health port. Must differ from workerHealth.port: this container
    # shares its pod (network namespace) with the ingest container.
    healthPort: 8091
    # -- /livez stall window (see workerHealth). One cycle publishes every
    # derived product of a full-timetable delivery with per-product retries,
    # so it gets far more room than the other workers.
    progressStallSecs: 7200
    image:
      repository: ghcr.io/fasterspeeding/distant-signal/schedule-reference
      tag: ""
      # -- Content digest override. See api.image.digest's own comment above
      # for the full rationale; same shape here.
      digest: ""
      pullPolicy: IfNotPresent
    pollIntervalSecs: 1800
    # -- MUST differ from metrics.port: this container shares the
    # schedulefeed Pod's network namespace with `ingest`, which already
    # binds metrics.port for its own listener -- see
    # schedulefeed-deployment.yaml's own comment on this.
    metricsPort: 9092
    existingSecret: ""
    internalOauthUsername: ""
    internalOauthPassword: ""
    existingSecretInternalOauthUsernameKey: internal-oauth-username-schedule-reference
    existingSecretInternalOauthPasswordKey: internal-oauth-password-schedule-reference
    # BY FAR the largest allocation in this chart, and the other of the two
    # leak/spike risks the 2026-09-25 review called out. This container parses
    # the WHOLE-NETWORK CIF extract in memory and builds several derived
    # whole-network products from it before POSTing them -- the
    # schedule_calling_points_full publish alone is ~1.7-2 million rows at
    # ~30MB per day
    # (docs/superpowers/plans/2026-09-22-dynamic-trip-planning-phase2-connections-array-plan.md:113),
    # and it holds a per-line TIPLOC set for the entire line catalogue on top
    # of that. CPU is correspondingly the highest too: the parse is a genuine
    # single-threaded burst once per delivery, not a trickle.
    #
    # The limit is set with real slack rather than snugly: an OOMKill here
    # aborts the parse partway through, which (like every other publish in
    # this crate) is best-effort log-and-continue -- so it does not retry
    # loudly, it just leaves the product stale until the next delivery.
    #
    # Request raised from 1Gi to 2.25Gi 2026-09-26: live `kubectl top` on
    # the mine-bringer cluster showed steady-state usage of 2208-2565Mi --
    # this is documented, expected behavior (the whole-network CIF parse
    # plus its several derived in-memory products), not a leak, but a 1Gi
    # request against ~2.2-2.5Gi real usage badly understated this pod's
    # true footprint to both the scheduler and node-pressure eviction
    # ranking. The limit stays at 3Gi, unchanged.
    #
    # Resized footprint after the 2026-09-26 OOM fix. Adding the per-calling-
    # point `platform` string pushed this container past its 3Gi limit on
    # every run (~7.9M calling points in a ~735MB MCA). Three changes brought
    # it back down: calling-point strings are stored inline (`SmallStr`,
    # 128 -> 104 bytes per point, and no heap allocations); the MCA text is
    # streamed into the index instead of being held as a ~700MB String; and
    # per-date rows are built and POSTed 50k at a time instead of all at
    # once. `crates/schedule-query/examples/index_memory.rs` measures this on
    # a production-shaped synthetic extract. Peak RSS went from 3.0Gi at
    # index build and 3.5Gi building one date's destination rows, to 0.9Gi
    # for the index and ~1.2Gi peak.
    #
    # 3Gi/4Gi are DELIBERATELY GENEROUS, stopgap-derived sizes: they are the
    # production overrides that carried this container through the OOMs
    # above (at the old 2.25Gi/3Gi) before the fix landed, moved into the
    # chart defaults. With the streamed compact timetable index and chunked
    # per-date rows now on main, actual usage is expected to sit well below
    # them (~1.2Gi peak by the estimate above). Once live usage confirms
    # it, bring both down -- resize from live `kubectl top`, not from this
    # estimate.
    resources:
      requests:
        cpu: 250m
        memory: 3Gi
      limits:
        memory: 4Gi
  # -- Which source wins when SFTP and the bucket deliver different
  # content within disagreementWindowMinutes (decision D5: the bucket).
  # Must be a permutation of [bucket, sftp].
  sourcePrecedence:
    - bucket
    - sftp
  # -- Different content from the two sources within this many minutes
  # counts as a disagreement (DistantSignalScheduleFeedSourcesDisagree).
  disagreementWindowMinutes: 120
  service:
    # -- LoadBalancer or NodePort + an operator-managed external LB/DNS --
    # NOT an Ingress (HTTP(S)-only by spec, cannot carry SFTP). Actually
    # exposing this to DTD is gated behind Task 1's outcome, per this
    # plan's own Task 1 -- rendering/lint-checking it is not.
    type: LoadBalancer
    annotations: {}
    # -- Explicit NodePort for the sftp port, e.g. when type is NodePort (or
    # LoadBalancer on a provider that still allocates one) and an operator
    # needs a stable, pre-known port to hand to an external LB/DNS or a
    # firewall rule, rather than whatever Kubernetes auto-assigns. Empty by
    # default -- Kubernetes auto-assigns from its NodePort range as before;
    # only rendered onto ports[0] when explicitly set (schedulefeed-
    # service.yaml), since an empty/0 nodePort in the manifest is invalid
    # and would break `kubectl apply`. If set, MUST be a real port in the
    # cluster's NodePort range (default 30000-32767).
    nodePort: null
    # -- The Service's externalTrafficPolicy: "Local", "Cluster", or empty
    # (the default), which renders nothing and leaves Kubernetes' own
    # default, Cluster. Anything else fails the render, and so does setting
    # it while type is not NodePort or LoadBalancer (Kubernetes rejects it
    # on a ClusterIP Service). Cluster lets any node forward the push to
    # the pod, source-NATing it on the way, so the pod sees a node address
    # rather than DTD's. Local keeps the client's real IP, which
    # sftp.allowedCidrs needs: the NetworkPolicy ipBlock allow-list matches
    # on the source address, and behind source NAT a non-empty list drops
    # every push. The cost of Local is that a node only accepts the traffic
    # when it runs a ready schedulefeed pod (other nodes drop it, and a
    # cloud LB's health check takes them out of rotation). On a single-node
    # cluster that is no cost at all; on several nodes, point the LB/DNS at
    # the node(s) that run the pod.
    externalTrafficPolicy: ""
  persistence:
    enabled: true
    # -- With scheduleFeed.bucket on, budget (bucket.archiveKeep + 1) x
    # bucket.maxObjectBytes on top of today's use: the defaults fit in 5Gi
    # (about 0.5 GB for real 78 MB objects, against about 2.3 GB for three
    # extracted deliveries).
    size: 5Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    existingClaim: ""
  logLevel: info
  # FALLBACK ONLY. Each of this Pod's three containers has its own
  # `resources` block above (sftp/ingest/reference); this is what
  # schedulefeed-deployment.yaml falls back to for any container whose
  # own block is left empty. Leaving it `{}` is correct now that all
  # three are set individually -- it exists so an operator's
  # pre-existing single-block override keeps working.
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  serviceAccount:
    # -- Create `<fullname>-schedulefeed` (or `name`): a dedicated
    # ServiceAccount with no RBAC and automountServiceAccountToken false.
    # Off: the pod uses the shared `serviceAccount`. Required (or `name`)
    # by scheduleFeed.bucket.auth=workloadIdentity, whose Google trust is
    # pinned to system:serviceaccount:<namespace>:<this name>.
    create: false
    # -- Its name. With `create: false`, an existing ServiceAccount, which
    # must not be the shared one in workloadIdentity mode.
    name: ""
  # -- fsGroup: 1000 is load-bearing, not a stylistic default -- confirmed
  # against a real deployment (docker-compose, same underlying image) that
  # drakkan/sftpgo's official image runs as a fixed non-root `USER
  # 1000:1000` (its own Dockerfile), and does NOT chown a freshly-mounted
  # empty volume for you. Without this, sftpgo's own attempt to create the
  # DTD account's home_dir (destinationFolder/folderPath above) on first
  # login fails with a plain OS-level "permission denied" -- reproduced for
  # real: "error creating root directory ... mkdir ...: permission denied"
  # -- because a fresh PVC/volume is root-owned by default and UID 1000
  # cannot mkdir under it. Kubernetes' fsGroup mechanism recursively
  # chgrp's the mounted volume to this GID (and adds it as a supplementary
  # group to every container in the pod, including `ingest`, which also
  # needs write access to the same shared volume) before either container
  # starts, which is exactly the standard fix for this exact class of
  # problem. Merged over (not replacing) the chart-wide pod securityContext
  # defaults (runAsNonRoot: true, seccompProfile: RuntimeDefault).
  podSecurityContext:
    fsGroup: 1000

# ---------------------------------------------------------------------------
# railMcp: OPTIONAL link from the in-app chat (/chat) to the derived MCP
# service ("distant-signal-mcp", a fork of train-mcp -- see
# docs/superpowers/specs/2026-09-01-train-mcp-integration-design.md
# Decision 1). This chart does NOT deploy or configure that service's own
# process -- it has its own repository, its own CI/tests, and its own Helm
# chart (Distant-Signal-MCP). Deploy it as its OWN separate Helm release,
# then set the values below so this chart's frontend can point the browser
# at it. That is all railMcp does now: the frontend makes no
# server-to-server call to the MCP service. The browser talks to it
# directly (the /chat MCP client and its /chat/callback OAuth exchange, plus
# the CSP connect-src entry that allows it), and the /connect-claude
# instructions page shows `<publicUrl>/mcp` as Claude's connector URL. Login is
# the MCP service's own business: it is its own Authentik OIDC client, so
# the old DS consent bridge (/connect-claude/authorize, railMcp.baseUrl and
# the shared internal-complete-token) is retired. Everything here stays
# optional, gated on `enabled` staying false by default -- frontend renders
# no railMcp env vars at all until you opt in.
# ---------------------------------------------------------------------------
railMcp:
  # -- Opt-in; false by default. Set true once you have deployed the derived
  # MCP service as its own separate release and want the frontend's chat
  # (and the /connect-claude instructions page) to link to it.
  enabled: false
  # -- The MCP service's own PUBLIC_URL as configured on that separate
  # release (its OAuth discovery metadata needs a real, reachable origin --
  # see the fork's own src/config.ts). Surfaced to frontend as
  # NEXT_PUBLIC_RAILMCP_PUBLIC_URL, read at request time: /chat connects the
  # browser to `<publicUrl>/mcp`, and proxy.ts adds its origin to the CSP
  # connect-src. Left blank by default; with it blank /chat reports "not
  # configured" and /connect-claude shows a placeholder.
  publicUrl: ""

# ---------------------------------------------------------------------------
# frontend (frontend/lib/api.ts)
# ---------------------------------------------------------------------------
frontend:
  image:
    repository: ghcr.io/fasterspeeding/distant-signal/frontend
    tag: ""
    # -- Content digest override. See api.image.digest's own comment above
    # for the full rationale; same shape here.
    digest: ""
    pullPolicy: IfNotPresent
  # -- Safe to raise, with one documented caveat. frontend/lib/liveDataCache.ts
  # keeps a process-local stale-data cache so a backend outage shows the
  # last-known line status instead of an error page
  # (docs/superpowers/specs/2026-09-02-frontend-disconnect-reconnect-ux-design.md).
  # That cache is per-pod: with more than one replica, during an outage one
  # visitor may get stale-but-useful content from a warm pod while another
  # gets the auto-retrying error page from a cold one. Each pod stays
  # internally consistent and no stale data crosses users (entries are
  # session-scoped), so this is a degraded-experience caveat, not a
  # correctness one -- deliberately documented rather than blocked, unlike
  # postgresql.replicaCount above. (helm-docs `# --` here rather than the
  # plain `#` at :72 and :563: those two document the *absence* of a
  # replicaCount key and so have no table row to annotate, whereas this one
  # does -- see charts/distant-signal/README.md.)
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  probes:
    # -- Dependency-free health route (frontend/app/healthz/route.ts). It
    # must never call the api: "/" server-renders 5-7 api calls, so probing
    # it killed the frontend whenever the api was down (FE-1, every node
    # reboot), and CrashLoopBackOff then kept it down after the api was back.
    path: /healthz
    readiness:
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
    liveness:
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
  # -- Override the api base URL the server-side render calls. Leave empty to
  # use the in-cluster api Service. API_BASE_URL is read at REQUEST time in
  # Server Components, not baked at build time, so this is a runtime value.
  apiBaseUrl: ""
  # -- The deployment's own public origin (e.g. https://rail.example.com),
  # used for share/invite links and same-origin checks
  # (frontend/lib/siteOrigin.ts). SET THIS IN PRODUCTION.
  #
  # When empty, the chart derives it from ingress.frontend.host (https if
  # ingress.tls is set) whenever this chart's own ingress publishes the
  # frontend -- see the "distant-signal.frontendSiteUrl" helper. Only when
  # there is no such host either (port-forward installs, or an externally
  # managed ingress/proxy) does the frontend fall back to each request's
  # own Host + X-Forwarded-Proto headers: every group invite link and
  # journey share link is then built from request headers a client or a
  # misconfigured proxy can spoof, instead of a pinned value. The frontend
  # logs a one-time warning in that case and NOTES.txt prints one at
  # install time. If TLS terminates somewhere the chart can't see (so the
  # derived scheme would be http), set this explicitly.
  siteUrl: ""
  # -- Publish the DRAFT legal pages (/privacy, /terms, /cookies, /contact)
  # and their footer links. Off by default: the text is a draft that needs
  # the operator's and a lawyer's review, and the operator values in
  # frontend/lib/legal.ts must be filled in first. Even when true, the
  # pages stay 404 while any placeholder is left in that file. /attribution
  # is always public. To review the drafts on a staging install, add
  # LEGAL_PAGES_PREVIEW=true through frontend.extraEnv (never in production:
  # it renders them with a "draft" banner, placeholders and all).
  legalPagesPublished: false
  extraEnv: []
  # A Next.js server render process -- Node's heap dominates, and it is
  # fairly insensitive to load here because the heavy lifting is api's.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # -- Merged over the chart-wide pod securityContext defaults
  # (runAsNonRoot: true, seccompProfile: RuntimeDefault).
  podSecurityContext: {}

# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
# SEPARATE HOSTNAMES, NOT PATH-SPLITTING ONE HOST. The api serves its
# TfL-compatible routes at UNPREFIXED top-level paths -- GET /Line/... and
# GET /StopPoint/{crs}/Disruption -- alongside /public/... and /private/...
# (crates/api/src/routes/mod.rs explains why: clients built against TfL's own
# API must work unchanged). Splitting a single host by path prefix would
# either collide with Next.js's own routes or break that compatibility.
ingress:
  enabled: false
  # -- IngressClass name, e.g. "nginx" or "traefik". Empty uses the cluster
  # default IngressClass.
  className: ""
  # -- Annotations applied to the single Ingress object, e.g.
  # cert-manager.io/cluster-issuer: letsencrypt-prod
  annotations: {}
  frontend:
    enabled: true
    # -- Hostname for the web UI, e.g. status.example.com. Required when
    # ingress.enabled and ingress.frontend.enabled are both true.
    host: ""
  api:
    # SECURITY: enabling this exposes /private/* to the internet as well.
    # Those endpoints are protected by internal-service OAuth2
    # (require_internal_oauth, crates/api/src/auth.rs) -- there is no other
    # authentication in front of them. If you do not need external API
    # access, leave this off; the frontend reaches the api over the
    # in-cluster Service either way.
    enabled: false
    # -- Hostname for the api, e.g. api.example.com.
    host: ""
  # -- TLS blocks passed through verbatim. Shaped for cert-manager (pair it
  # with a cluster-issuer annotation above) but issuer-agnostic.
  tls: []
  # - secretName: distant-signal-tls
  #   hosts:
  #     - status.example.com
  #     - api.example.com

# ---------------------------------------------------------------------------
# Metrics (Prometheus)
# ---------------------------------------------------------------------------
# -- Health endpoints of the background workers (aggregator, notifier,
# enricher, every poller, scheduleFeed's ingest/reference containers):
# SVC-08/INF-9 (no liveness probes: a wedged loop was never restarted) and
# INF-5 (readiness false until the initial database connection is up). See
# the "distant-signal.workerHealthProbes" helper for the /livez vs /healthz
# semantics. Each component's own `progressStallSecs` sets how long ONE loop
# iteration may run before /livez reports "stalled"; waiting for the next
# iteration never counts, so a 24h poller is not "stalled" between polls.
workerHealth:
  # -- Port every single-Rust-container worker pod serves /livez and
  # /healthz on (scheduleFeed.reference uses its own healthPort, as it shares
  # a pod with scheduleFeed's ingest container).
  port: 8090
  # -- Generous: the stall window itself already absorbs slow iterations, so
  # this only has to ride out a GC-pause-sized blip. 6 x 30s = 3 minutes.
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # -- Stall window for the pollers in `.Values.pollers` (no per-poller
  # override needed so far): one fetch plus up to 15 minutes of ingest-POST
  # retries (SVC-09).
  pollerProgressStallSecs: 1800

metrics:
  # Cheap, in-process, no new runtime dependency once the images are built
  # -- unlike podMonitor.enabled below, safe to default on. Renders the
  # metrics containerPort/env on every Rust workload (aggregator, enricher,
  # notifier, api, the consumers, movement-relay, every enabled poller and
  # schedulefeed), plus the prometheus.io/scrape pod annotations (the CRD-free
  # fallback) on every workload. Setting this false leaves every service
  # working exactly as it does today with metrics wiring absent entirely,
  # not merely un-scraped.
  enabled: true
  # aggregator, enricher, notifier, api, the five `pollers.*` and schedule-ingest
  # each listen on this port for their own embedded Prometheus exporter (the
  # consumers, movement-relay, the three island-of-Ireland pollers and
  # schedule-reference have their own `metricsPort` values) -- aggregator/enricher/the
  # pollers via crates/common::metrics::install, api via its own
  # crates/api/src/main.rs::spawn_metrics_listener (see
  # docs/superpowers/specs/2026-08-29-metrics-design.md). Until 2026-09-25
  # api was the one exception, serving /metrics on its own api.service.port
  # instead of this value -- a Low finding, since that port is also what
  # the chart's Ingress routes public traffic to (see
  # crates/api/src/data/config.rs's metrics_port doc for the full story).
  # Distinct from api.service.port (8080), frontend.service.port (3000),
  # postgresql.service.port (5432), and redis.service.port (6379).
  port: 9091
  podMonitor:
    # Prometheus Operator's PodMonitor CRD -- off by default, mirroring
    # networkPolicy.enabled's identical reasoning: many clusters don't have
    # Prometheus Operator installed, and rendering a CRD that doesn't exist
    # would fail `helm install` outright rather than degrade gracefully.
    # Not purely theoretical: at least one real cluster (mine-bringer, via
    # Ranma-Config) does run Prometheus Operator and flips this to true in
    # its own values overlay -- see
    # docs/superpowers/specs/2026-09-05-status-observability-grafana-design.md
    # and docs/superpowers/plans/2026-09-05-status-observability-grafana-plan.md.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    # Prometheus Operator's PrometheusRule CRD with Distant-Signal-specific
    # alerts (templates/prometheusrule.yaml). Off by default for the same
    # reason as podMonitor.enabled: the CRD may be absent. Also needs
    # metrics.enabled. Rules only fire on series the PodMonitor (or an
    # equivalent scrape that sets a `namespace` label) collects.
    #
    # Scope is deliberately narrow: generic cluster-level alerts (OOMKilled,
    # restart spikes, pods not ready) belong to the cluster's own rules
    # (mine-bringer: Ranma-Config's monitoring-rules.yaml). Every alert here
    # is named `DistantSignal*`, and this chart is their source: the
    # cluster's rules should not redefine any of them.
    enabled: false
    # Extra labels on the PrometheusRule object itself, e.g. whatever the
    # Prometheus CR's ruleSelector matches (`release: kube-prometheus-stack`
    # on a stock kube-prometheus-stack; mine-bringer selects every rule, so
    # nothing is needed there).
    labels: {}
    # Extra annotations on the PrometheusRule object.
    annotations: {}
    # Extra labels added to every alert (e.g. `team: distant-signal`), next
    # to its `severity`.
    ruleLabels: {}
    # Prefix for each alert's runbook_url; the repo-relative doc path is
    # appended.
    runbookBaseUrl: https://github.com/FasterSpeeding/Distant-Signal/blob/main
    # pgBackRest alerts, rendered as a separate `<fullname>-pgbackrest`
    # PrometheusRule and only while postgresql.pgbackrest.enabled is also
    # true. Runbook: docs/postgres-pitr.md.
    #
    # DistantSignalPgBackRestCheckFailed (critical): the daily check or the
    # weekly verify Job failed within `recentJobWindow`: archiving is
    # broken, `verify` found a
    # bad file, or WAL is missing (a PITR gap, e.g. dropped at queueMax).
    # DistantSignalPgBackRestBackupFailed: a full or diff backup Job failed
    # within `recentJobWindow`.
    # DistantSignalPgBackRestBackupStale: no full or diff backup succeeded
    # for `backupMaxAge`; DistantSignalPgBackRestFullBackupStale: no full
    # backup for `fullBackupMaxAge`. Both read kube-state-metrics' CronJob
    # series.
    # DistantSignalPgBackRestArchiveFailing: pg_stat_archiver's failed count
    # rose within `archiveWindow`. DistantSignalPgBackRestArchiveStalled: no
    # WAL segment archived within `archiveStallWindow` (archive_timeout
    # forces one a minute while anything writes). Both read
    # postgres_exporter's stat_archiver collector (on by default), which
    # this chart doesn't deploy: `archiverSelector` adds label matchers for
    # its series, next to namespace="<release namespace>".
    pgbackrest:
      enabled: true
      recentJobWindow: 26h
      backupMaxAge: 30h
      fullBackupMaxAge: 8d
      archiveWindow: 15m
      archiveStallWindow: 15m
      archiverSelector: ""
      severity: warning
    # DistantSignalPostgresDown (critical): the database is down, for
    # `for`: postgres_exporter's pg_up is 0, or (with postgresql.enabled)
    # the bundled Postgres StatefulSet has no ready replica
    # (kube-state-metrics). The exporter is not part of this chart:
    # `pgUpSelector` adds label matchers for its pg_up series, next to
    # namespace="<release namespace>". Runbook: docs/alerts.md.
    postgresDown:
      enabled: true
      for: 3m
      severity: critical
      pgUpSelector: ""
    # DistantSignalIngestWriterDown (critical; ingest spec §14.2): the
    # ingest-writer's scrape target is down, or its Deployment has no
    # available replica (kube-state-metrics), for `for`. Renders only with
    # ingestWriter.enabled. Runbook: docs/alerts.md.
    ingestWriterDown:
      enabled: true
      for: 5m
      severity: critical
    # DistantSignalApiDatabaseDown (critical): api's own `SELECT 1` probe
    # through its request pool (distant_signal_api_db_up, every 15s) has
    # failed on some replica for `for`. Covers what pg_up cannot see: a
    # rotated password, an exhausted pool or max_connections, a
    # NetworkPolicy, an external database. Critical because api is the only
    # writer for every ingest path: while it cannot query, TRUST, poller
    # and schedule data stop landing and the queues in front of it only
    # hold so much.
    apiDatabaseDown:
      enabled: true
      for: 2m
      severity: critical
    # DistantSignalSchemaGateWaiting (critical; ingest spec §14.2): a
    # service's schema gate (distant_signal_db_schema_ready) has been 0 for
    # `for`: the database lacks the newest migration in its image, or its
    # role lacks a db-grants.yaml grant. One alert per component.
    # Runbook: docs/alerts.md.
    schemaGateWaiting:
      enabled: true
      for: 10m
      severity: critical
    # DistantSignalConsumerApiCallsFailing: trust-consumer,
    # trust-backlog-consumer or full-coverage-consumer failed at least
    # minErrors calls to api (POSTs, the tracked-trains / population /
    # stanox reloads; *_errors_total by operation) within `window`,
    # continuously for `for`, so a short api blip (a rollout) does not fire.
    consumerApiErrors:
      enabled: true
      window: 5m
      minErrors: 3
      for: 10m
      severity: warning
    # DistantSignalApiPublic5xx / DistantSignalApiIngest5xx: the share of
    # api's requests answered 5xx (a dependency-unavailable 503 included)
    # over `window`, split by route: `public` is every route except
    # /private/*, /public/health and unmatched paths (scanner noise);
    # `ingest` is /private/*. Fires when the ratio is above `ratio` AND at
    # least `minErrors` 5xx happened in the window (public traffic is a few
    # requests a minute, so one 500 would otherwise be 100%), for `for`.
    # `for` is longer than `window`, so a burst shorter than for - window
    # (an api rollout) never fires.
    # routeLabel is the series' route label as Prometheus stores it:
    # axum-prometheus calls it `endpoint`, and the PodMonitor scrape's own
    # `endpoint` label renames it to `exported_endpoint`.
    api5xx:
      enabled: true
      window: 5m
      routeLabel: exported_endpoint
      public:
        ratio: 0.05
        minErrors: 3
        for: 10m
        severity: warning
      ingest:
        ratio: 0.05
        minErrors: 30
        for: 10m
        severity: warning
    # DistantSignalAggregatorCycleFailing / DistantSignalNotifierCycleFailing:
    # no successful aggregation cycle, or no successful run of one of the
    # notifier's line_status / forward_queue / skip_check loops, for
    # maxAgeSeconds (<service>_last_success_timestamp_seconds{cycle}; the
    # process start counts until a cycle succeeds). The notifier's hourly
    # template_sweep is left out.
    cycleStalled:
      enabled: true
      maxAgeSeconds: 900
      for: 0m
      severity: warning
    # Needs movementRelay.enabled (all rules in this group read
    # movement-events state).
    #
    # DistantSignalMovementLagHigh (warning) / ...Critical (critical): a
    # consumer group's movement-events lag plus pending (delivered but
    # un-ACKed: a consumer whose downstream is failing keeps reading, so its
    # backlog sits in pending, not lag) as a fraction of the stream's
    # MAXLEN cap (movement-relay's stream_maxlen gauge, falling back to
    # movementRelay.streamMaxLen). Lag never reads 0 (baseline is a few
    # hundred entries), hence ratios rather than `> 0`.
    movementLag:
      enabled: true
      for: 10m
      warningRatio: 0.25
      criticalRatio: 0.5
    # DistantSignalMovementLagGrowing: a group's lag rose over `window`
    # (positive deriv AND net delta above minIncrease entries).
    movementLagGrowing:
      enabled: true
      window: 30m
      minIncrease: 5000
      for: 10m
      severity: warning
    # DistantSignalStreamGap: trust-consumer, full-coverage-consumer or
    # trust-backlog-consumer detected entries trimmed before it read them.
    streamGap:
      enabled: true
      window: 1h
      for: 0m
      severity: warning
    # DistantSignalDeadLetterGrowing: any record dead-lettered within
    # `window`. DistantSignalDeadLetterNearFull: movement-events-deadletter
    # above nearFullRatio of its fixed 10,000-record cap.
    deadLetter:
      enabled: true
      window: 1h
      nearFullRatio: 0.8
      for: 0m
      severity: warning
    # DistantSignalDeadLetterFull: a dead-letter write was refused because
    # the stream is at its cap -- those records now stay pending.
    deadLetterFull:
      enabled: true
      window: 1h
      for: 0m
      severity: critical
    # DistantSignalMovementRelayPublishFailing: movement-relay failed every
    # XADD over `window` and published nothing (Redis refusing writes: OOM,
    # a failed AOF write, NOAUTH, or down). TRUST ingestion is stopped and
    # no lag alert fires, since the stream simply stops growing.
    relayPublishFailing:
      enabled: true
      window: 10m
      for: 5m
      severity: critical
    # DistantSignalRedisPersistenceFailing: Redis's last AOF write or AOF
    # rewrite failed, or (bundled Redis with redis.persistence.enabled) AOF
    # is off. Read from movement-relay's INFO persistence gauges.
    redisPersistence:
      enabled: true
      for: 5m
      severity: critical
    # DistantSignalMovementGroupRecreated: within `window`, a consumer
    # found its movement-events group missing (NOGROUP) and recreated it,
    # or movement-relay found the stream itself missing and recreated it
    # with every group: Redis lost its data, or the group was deleted.
    groupRecreated:
      enabled: true
      window: 1h
      for: 0m
      severity: warning
    # DistantSignalDeadLetterExpiring: the oldest dead letter is within
    # warnBeforeTrimSecs of movementRelay.deadLetterMaxAgeSecs, after which
    # movement-relay deletes it. Re-inject or export it before then.
    deadLetterExpiring:
      enabled: true
      warnBeforeTrimSecs: 14400
      for: 5m
      severity: warning
    # DistantSignalMovementFeedLongPending (R-040): a consumer group re-read
    # entries already delivered more than 240 times
    # (movement_feed_long_pending_total) more than `threshold` times within
    # `window`. Such entries are retried forever, never dead-lettered.
    longPending:
      enabled: true
      window: 1h
      threshold: 0
      for: 0m
      severity: warning
    # DistantSignalTrustEnvelopeParseDrops (R-097): trust-consumer,
    # full-coverage-consumer or trust-backlog-consumer dropped more than
    # `threshold` TRUST envelopes of one msg_type within `window` because
    # their body did not parse (*_errors_total{operation="parse_envelope"}).
    parseEnvelope:
      enabled: true
      window: 1h
      threshold: 0
      for: 0m
      severity: warning
    # DistantSignalEnricherErrors: over `window`, more than errorRatio of an
    # LLM call site's calls failed, with at least minErrors failures.
    enricherErrors:
      enabled: true
      window: 30m
      errorRatio: 0.5
      minErrors: 3
      for: 15m
      severity: warning
    # DistantSignalEnricherTokenExchangeFailing: in a workload identity mode
    # (enricher.llm.auth), at least minFailures token requests to one stage
    # (authentik or openai) failed over `window` with none succeeding, for
    # `for`. Rendered only in those modes (the metric exists only there).
    # The enricher keeps using a cached token until it expires, so this
    # can fire before extractions start failing.
    enricherTokenExchange:
      enabled: true
      window: 30m
      minFailures: 3
      for: 10m
      severity: warning
    # DistantSignalComponentMemoryHigh: a container in this release's pods
    # using more than `ratio` of its memory limit. Reads cadvisor
    # (container_memory_working_set_bytes) and kube-state-metrics
    # (kube_pod_container_resource_limits), not this app's own metrics.
    componentMemory:
      enabled: true
      ratio: 0.8
      for: 10m
      severity: warning
    # Windowed full-coverage stats. The whole group renders ONLY when
    # fullCoverageConsumer.windowedStats.enabled is also true, so none of
    # these can fire while the feature is off (the default).
    # DistantSignalFullCoverageWindowFeedStale: the consumer has marked its
    # windows feed_stale (too few Activations in the last hour, or no event
    # for feedStaleSecs) for `feedStaleFor` -- no window influences severity
    # meanwhile. Expected during a known TRUST outage.
    # DistantSignalFullCoverageWindowPostErrors: at least
    # `postErrorsThreshold` POSTs to /private/full-coverage-window-stats
    # failed within `postErrorsWindow`, continuously for `postErrorsFor`
    # (the shape of DistantSignalConsumerApiCallsFailing), so the one POST
    # lost to an api rollout does not fire; a persistent failure (an api
    # without the route answers 404 every minute) still does.
    # DistantSignalFullCoverageWindowStatsStalled: no window rows posted
    # over `stalledWindow` for `stalledFor` while the consumer is running.
    fullCoverageWindow:
      enabled: true
      feedStaleFor: 15m
      postErrorsWindow: 5m
      postErrorsThreshold: 3
      postErrorsFor: 10m
      stalledWindow: 10m
      stalledFor: 15m
      severity: warning
    # DistantSignalPollerFailing (SVC-08): a poller (any of
    # .Values.pollers or the three island-of-Ireland ones) completed no
    # successful cycle and at least one failed one over `window`. Keyed on
    # distant_signal_poller_cycle_total{result}. Rendered in a separate
    # `<fullname>-pollers` PrometheusRule. It also fires when more than
    # failureRatio of the poller's cycles over ratioWindow failed, so a
    # mostly-failing poller is caught too; set failureRatio to 0 to drop
    # that clause. `for` applies to both clauses. 15m/10m (was 1h with no
    # `for`): on 2026-10-01 the 1h ratio fired 40-55 minutes after the
    # pollers started failing; now about 18 minutes for a poller that fails
    # every cycle, with 10 minutes of `for` to ride out a short blip.
    pollerFailures:
      enabled: true
      window: 2h
      failureRatio: 0.5
      ratioWindow: 15m
      for: 10m
      severity: warning
    # DistantSignalLdbwsStationStale (SVC-04): the least recently sampled
    # LDBWS station was last sampled more than `maxAgeSeconds` ago
    # (distant_signal_ldbws_stalest_station_age_seconds), i.e. the rotation
    # has stopped reaching part of the list. 900s is the aggregator's
    # sample-age limit (common::STATION_SAMPLE_MAX_AGE_MINUTES): an older
    # station is already dropped from inference. Production's 7-day max was
    # 126s (2026-10-01; a full rotation takes 2-3 cycles). Only when
    # pollers.ldbws.enabled.
    ldbwsStalestStation:
      enabled: true
      maxAgeSeconds: 900
      for: 15m
      severity: warning
    # DistantSignalLdbwsInvalidCrs: LDBWS answers "Invalid crs code
    # supplied" for a sampled station (distant_signal_ldbws_invalid_crs_station
    # {crs} is 1), i.e. a lines/*.toml typo such as "ANV" for Andover's
    # "ADV" (2026-09-28). The poller stops counting that station as stale
    # and only re-probes it hourly, so this, not the stale alert, is what
    # reports it. Only when pollers.ldbws.enabled.
    ldbwsInvalidCrs:
      enabled: true
      for: 15m
      severity: warning
    # DistantSignalIncidentRemovalStalled: over `window`, api skipped the
    # "Ended (no longer listed)" inference for an incomplete, empty or
    # more-than-50%-shrunken incidents snapshot and applied it to none
    # (distant_signal_api_incident_removal_inference_total{outcome}), so
    # incidents that leave the Knowledgebase feed stay "active". 2h is 24
    # polls at the 300s interval. Only when pollers.incidents.enabled.
    incidentRemovalStalled:
      enabled: true
      window: 2h
      for: 15m
      severity: warning
    # DistantSignalNotifierPushDropped: at least minDrops decided push
    # notifications ended undelivered (queue full, every endpoint failed,
    # or the job errored) within `window`, per reason. Notifier delivery is
    # at-most-once by decision (triage DQ9), so these may be lost for good.
    notifierPushDropped:
      enabled: true
      window: 1h
      minDrops: 5
      for: 0m
      severity: warning
    # DistantSignalUserSignupSpike: more than `threshold` new user accounts
    # within `window`. Sign-up is open to any account the IdP admits (in
    # production, any Discord account), so a burst is either real growth or
    # scripted sign-ups. `metric` is api's counter of created users rows;
    # it needs the api build that exports it, and never fires without it.
    userSignupSpike:
      enabled: true
      metric: distant_signal_api_users_created_total
      window: 1h
      threshold: 20
      for: 0m
      severity: warning
    # DistantSignalArchiveUploadFailures: at least minFailures cold-archive
    # batch uploads (or their verification) failed within `window`. Renders
    # only when archive.enabled is also true.
    archiveUploadFailures:
      enabled: true
      window: 1h
      minFailures: 3
      for: 0m
      severity: warning
    # Cold-archive expiry (archive.expiry). Renders only when archive.enabled
    # and archive.expiry.enabled are also true. Expiry runs once a day, so
    # keep `window` at least 1d.
    # DistantSignalArchiveExpiryErrors: any expiry error (failed LIST or
    # DELETE, or a key refused by the pre-delete check) within `window`.
    # DistantSignalArchiveExpiryUnmatchedKeys: keys under an archive table
    # prefix that do not match the archive layout (never deleted).
    # DistantSignalArchiveExpiryCapReached: a run hit
    # archive.expiry.maxDeletesPerRun.
    # DistantSignalArchiveExpiryOverdue: the oldest archived service_date is
    # older than archive.expiry.retentionDays + overdueGraceDays, for
    # `overdueFor` -- expiry is not running, failing, or still in dry-run.
    archiveExpiry:
      enabled: true
      window: 1d
      for: 0m
      overdueGraceDays: 7
      overdueFor: 1h
      severity: warning
    # The schedule (CIF) pipeline: schedule-ingest and schedule-reference.
    # Renders only when scheduleFeed.enabled.
    # DistantSignalScheduleReferenceNotSeeded: schedule-reference has not
    # read its last completed publish from api for `notSeededFor` since it
    # started, so it publishes nothing.
    # DistantSignalScheduleFeedZipRejected: schedule-ingest quarantined an
    # uploaded delivery zip within `zipRejectedWindow` (PL-5 caps).
    # DistantSignalCorpusRejected: schedule-ingest refused a CORPUS extract
    # within `zipRejectedWindow` (only while scheduleFeed.corpus.enabled).
    # DistantSignalCorpusStale: the newest loaded CORPUS delivery is older
    # than `corpusStaleAfterDays` (only while scheduleFeed.corpus.enabled;
    # never before the first load). CORPUS is published monthly, so 45 days
    # is one full cycle (at most 31 days) plus two weeks' grace for a late
    # publication or upload: a single missed month alerts, a slightly late
    # one does not.
    # DistantSignalScheduleReferencePublishStale: the last fully published
    # delivery is older than `staleAfterHours` (deliveries land nightly).
    # DistantSignalSchedulePublishStagedMismatch: api skipped a publish's
    # delete (staged key count mismatch) within `mismatchWindow`.
    # DistantSignalScheduleReferencePublishRejected: api answered 400/413/422
    # to a product within `rejectedWindow` (permanent for that delivery).
    # DistantSignalScheduleFeedIngestRejected: api answered 400/413/422 to
    # schedule-ingest's delivery record within `rejectedWindow`.
    # DistantSignalLinePopulationMissing: past 06:00 London, some line still
    # has no schedule population for today's rail day (full-coverage-consumer
    # metric) for `populationMissingFor`.
    schedulePipeline:
      enabled: true
      notSeededFor: 30m
      zipRejectedWindow: 6h
      staleAfterHours: 30
      corpusStaleAfterDays: 45
      mismatchWindow: 6h
      rejectedWindow: 6h
      populationMissingFor: 15m
      severity: warning
    # -- The schedulefeed SFTP server's own alerts
    # (distant-signal.schedule-sftp), from SFTPGo's telemetry counters.
    # Renders with scheduleFeed.enabled and scheduleFeed.sftp.telemetry.enabled.
    # No failed-login alert here: the counters carry no username or IP, so
    # Loki rules own that (docs/schedule-feed-sftp.md).
    scheduleSftp:
      enabled: true
      # DistantSignalSftpNoUpload: no upload at all in this window. DTD
      # pushes daily (~20:00 UTC), so 30h allows one late delivery.
      noUploadWindow: 30h
      noUploadFor: 30m
      # DistantSignalSftpUploadErrors: any failed or interrupted upload.
      uploadErrorsWindow: 1h
      # DistantSignalSftpUserStoreDown: SFTPGo's user store unavailable, so
      # every login fails.
      userStoreDownFor: 5m
      severity: warning
      userStoreDownSeverity: critical
    # The schedule-feed bucket source (scheduleFeed.bucket): rendered only
    # with scheduleFeed.bucket.enabled. Runbooks: docs/alerts.md "schedule
    # bucket" and docs/schedule-feed-bucket.md.
    scheduleBucket:
      enabled: true
      # DistantSignalScheduleBucketAccessRevoked: every bucket call answered
      # 401/403 (the kill switch removed the reader, or the key was rotated,
      # disabled or is missing).
      accessRevokedFor: 10m
      # DistantSignalScheduleBucketNoNewObject: no new expected object for
      # this many hours, once one has been seen. Daily CIF at ~20:00 UTC.
      noNewObjectHours: 30
      noNewObjectFor: 30m
      # DistantSignalScheduleBucketReadErrors: list/get/verify/delete errors.
      readErrorsWindow: 1h
      readErrorsFor: 15m
      # DistantSignalScheduleBucketUnexpectedObject.
      unexpectedWindow: 1h
      # DistantSignalScheduleFeedSourcesDisagree (both sources on).
      disagreeWindow: 1d
      severity: warning
      criticalSeverity: critical

# ---------------------------------------------------------------------------
# NetworkPolicy (optional)
# ---------------------------------------------------------------------------
# Off by default: many clusters run a CNI that does not enforce
# NetworkPolicy at all, and a silently-unenforced policy is worse than an
# absent one because it looks like protection.
#
# Ingress: every workload gets a default-deny policy plus the allows it
# needs (INF-10: the background workers get their metrics port from
# monitoringNamespace and their health ports per healthIngress below,
# since kubelet probes come from the node).
#
# Egress is unrestricted unless networkPolicy.egress.enabled (below).
networkPolicy:
  enabled: false
  # -- Namespace your ingress controller runs in. Matched via the automatic
  # `kubernetes.io/metadata.name` namespace label. Only used when
  # ingress.enabled is true.
  ingressControllerNamespace: ingress-nginx
  # Namespace Prometheus (or whatever scrapes metrics.port) runs in. Only
  # consulted when both networkPolicy.enabled and metrics.enabled are true.
  # Same pattern as the existing ingressControllerNamespace value.
  monitoringNamespace: monitoring
  # -- Extra namespaces allowed to reach api.service.port, matched by
  # `kubernetes.io/metadata.name`. For callers deployed as separate
  # releases, e.g. `[ds-mcp]` for the Distant-Signal-MCP, which calls
  # api's public routes in-cluster. Empty adds nothing. Narrow an entry to
  # the calling pods with apiExtraIngressPodLabels below.
  apiExtraIngressNamespaces: []
  # -- Pod labels narrowing an apiExtraIngressNamespaces entry to the pods
  # that actually call the api, keyed by namespace name. Only consulted for
  # namespaces listed in apiExtraIngressNamespaces. A namespace with no
  # entry here admits every pod in it. The api trusts X-Real-IP for rate
  # limiting (api.rateLimit.trustXRealIp), so every pod that can reach it
  # can pick its own rate-limit key: admit only the real caller. The
  # default matches the Distant-Signal-MCP chart's mcp Deployment
  # (`app.kubernetes.io/name: distant-signal-mcp`, `component: mcp`); set
  # its `name` label to your MCP release's nameOverride if you use one. To
  # admit a whole namespace again, set its entry to null (`ds-mcp: null`);
  # an empty map `{}` does NOT clear it, because Helm merges maps with the
  # defaults.
  apiExtraIngressPodLabels:
    ds-mcp:
      app.kubernetes.io/name: distant-signal-mcp
      app.kubernetes.io/component: mcp
  # Ingress to the background workers' and schedulefeed's health ports
  # (kubelet liveness/readiness probes). By default any source may connect,
  # because the probes come from the node, which no pod or namespace
  # selector can name. Most CNIs never apply NetworkPolicy to traffic from
  # a pod's own node: kube-router accepts it outright (k3s's default
  # policy controller; its pod chains start with a `--src-type LOCAL`
  # ACCEPT), and Calico and Cilium allow host-to-local-pod traffic by
  # default. On such a CNI the rule only matters to other pods.
  healthIngress:
    # -- Render the health-port rule. false drops it, which closes the
    # ports to every pod while probes keep working on a CNI that exempts
    # node-local traffic (see above). Check that on yours first: a CNI
    # that does filter it would fail every probe and restart the pods.
    enabled: true
    # -- NetworkPolicyPeers allowed to reach the health ports. Empty (the
    # default) allows any source. To keep them reachable from the nodes
    # only, list the nodes' addresses as ipBlocks: the node IPs and, on
    # flannel/kube-router, each node's pod-CIDR gateway (e.g.
    # 10.42.0.1/32), which is the source address of probe traffic.
    #   - ipBlock: {cidr: 10.42.0.1/32}
    from: []
  # -- Extra NetworkPolicyPeers (podSelector and/or namespaceSelector)
  # admitted to the bundled Postgres on postgresql.service.port, for
  # clients this chart does not render: a postgres-exporter, a pg_dump
  # backup CronJob. Empty (the default) adds nothing. The pgBackRest
  # CronJobs need no entry: they `kubectl exec` into the Postgres pod
  # through the API server, not over the pod network. A peer without a
  # namespaceSelector means this release's namespace. e.g.
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: postgres-exporter
  #         app.kubernetes.io/instance: distant-signal-postgres
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: distant-signal-postgres-backup
  # The same can be written as components.postgres.extraIngress (a whole
  # rule, so it can name other ports), or kept as a policy outside the
  # chart: policies are additive.
  postgresClients: []
  # -- The same for the bundled Redis on redis.service.port, e.g. a
  # redis-exporter:
  #   - podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: redis-exporter
  #         app.kubernetes.io/instance: distant-signal-redis
  redisClients: []
  # A tunnel connector running in the cluster (e.g. cloudflared) that
  # publishes the frontend without an Ingress. OFF by default. When
  # enabled, the pods matching `podLabels` in `namespace` may reach the
  # frontend on frontend.service.port. They reach the api only with
  # `api: true`.
  tunnel:
    enabled: false
    # -- Namespace the connector runs in, matched by
    # `kubernetes.io/metadata.name`.
    namespace: cloudflared
    # -- Labels selecting the connector pods in that namespace. Empty
    # admits every pod in the namespace.
    podLabels:
      app.kubernetes.io/name: cloudflared
    # -- Also admit the connector to api.service.port, for a public
    # hostname routed straight to the api. Leave false unless such a route
    # exists: the frontend reaches the api in-cluster either way. A request
    # arriving straight from the tunnel carries whatever X-Real-IP the
    # client sent, so it can choose its own rate-limit key. The render
    # therefore fails unless api.rateLimit.trustXRealIp is false; with that
    # off, requests the frontend proxies share its pod's bucket.
    api: false
  # Opt-in egress policies (INF-10, SVC-03 defence in depth) for every
  # component: api, frontend, aggregator, enricher, notifier, the
  # Kafka/Redis consumers, movement-relay, every poller, schedulefeed,
  # postgres and redis. OFF by default. Each may then reach only DNS (port
  # 53), the in-cluster services it calls (api, the bundled Redis/Postgres,
  # the bundled dev IdP) and, where it needs it, the public internet minus
  # `privateCidrs`/`privateCidrsV6`/`extraDeniedCidrs` -- so a notifier
  # tricked into pushing to a private address, or a compromised poller,
  # cannot reach the rest of the cluster or the node's network. Public
  # internet: api (OIDC issuers), enricher (LLM API), schedulefeed and
  # every ingest worker (OAuth token endpoint, upstream feeds, Kafka),
  # notifier (Web Push), aggregator only with archive.enabled (S3),
  # postgres only with postgresql.pgbackrest.enabled (S3). frontend and
  # redis get none. Override per component with components.<name>.internet
  # below, or opt one out entirely with components.<name>.egress: false.
  #
  # BEFORE ENABLING, add a rule (components.<name>.extraEgress, or
  # extraRules for all) for anything reached at a private address: an
  # external Redis or Postgres (redis.enabled/postgresql.enabled false), an
  # in-cluster or tailnet (100.64.0.0/10) OAuth/OIDC endpoint, a private
  # Kafka broker, LLM endpoint (enricher.llm.baseUrl), archive or
  # pgBackRest S3 endpoint, or a proxy.
  egress:
    enabled: false
    # -- Excluded from the public-internet allow: RFC 1918, CGNAT/tailnet,
    # loopback, link-local (cloud metadata), "this network", IETF
    # protocol assignments, benchmarking, multicast and reserved -- the same
    # ranges the notifier's outbound guard refuses
    # (crates/common/src/outbound_endpoint_guard.rs).
    privateCidrs:
      - 0.0.0.0/8
      - 10.0.0.0/8
      - 100.64.0.0/10
      - 127.0.0.0/8
      - 169.254.0.0/16
      - 172.16.0.0/12
      - 192.0.0.0/24
      - 192.168.0.0/16
      - 198.18.0.0/15
      - 224.0.0.0/4
      - 240.0.0.0/4
    # -- IPv6 equivalents: loopback, ULA, link-local, multicast, and the
    # NAT64/6to4/Teredo prefixes that can embed a private IPv4 address.
    privateCidrsV6:
      - ::1/128
      - 64:ff9b::/96
      - 2001::/32
      - 2002::/16
      - fc00::/7
      - fe80::/10
      - ff00::/8
    # -- More addresses excluded from the public-internet allow, on top of
    # privateCidrs/privateCidrsV6 (so the defaults above need not be
    # repeated). IPv4 and IPv6 may be mixed: an entry containing ":" goes to
    # the IPv6 rule. SET THE NODES' OWN PUBLIC ADDRESSES HERE (as /32 and
    # /128): privateCidrs only names reserved ranges, so a node with a
    # public IP is otherwise reachable through it -- the API server (6443),
    # the kubelet (10250) and every host-published port. Policies are
    # additive, so no other policy can take that allowance away.
    extraDeniedCidrs: []
    # -- NetworkPolicyPeers every egress policy's DNS rule (UDP/TCP 53) is
    # limited to. Empty (the default) allows port 53 to any destination,
    # which works with any resolver, NodeLocal DNSCache included, but also
    # reaches a DNS server on the node or a private address. To use only
    # the cluster DNS (CoreDNS's usual labels):
    #   - namespaceSelector:
    #       matchLabels: {kubernetes.io/metadata.name: kube-system}
    #     podSelector:
    #       matchLabels: {k8s-app: kube-dns}
    dnsPeers: []
    # -- TCP ports the public-internet rule allows. Each component also
    # gets the ports its own configured upstreams use, read from their
    # URLs (an explicit port, else 443 for https and 80 for http: e.g.
    # pollerIrishRailLive.irishRailBaseUrl is http), the Kafka brokers'
    # ports (trust-consumer, full-coverage-consumer, movement-relay) and
    # postgresql.pgbackrest.repo.s3.port. Web Push, OIDC and the OAuth
    # token endpoint use 443. Override one component with
    # components.<name>.internetPorts. Empty (`[]`) allows every port.
    internetPorts:
      - 443
    # -- Extra NetworkPolicyEgressRule entries appended to every egress
    # policy the chart renders. Prefer components.<name>.extraEgress for
    # something only one component needs, e.g.
    #   - to:
    #       - ipBlock: {cidr: 10.0.5.20/32}
    #     ports:
    #       - {protocol: TCP, port: 5432}
    extraRules: []
  # -- Per-component settings, keyed by the app.kubernetes.io/component
  # label: api, frontend, aggregator, enricher, notifier, postgres, redis,
  # schedulefeed, trust-consumer, trust-backlog-consumer,
  # full-coverage-consumer, movement-relay, poller-<name> (each
  # pollers.<name>), poller-irish-rail-gtfs, poller-irish-rail-live,
  # poller-nir-stations. An unknown key fails the render. Each entry may
  # set:
  #   egress: false    # no egress policy for this component, even with
  #                    # egress.enabled (its egress is then unrestricted
  #                    # by the chart)
  #   internet: true   # add or drop the public-internet rule
  #   internetPorts: [443]  # replaces egress.internetPorts for this
  #                    # component (its upstreams' ports are still added;
  #                    # [] allows every port)
  #   extraEgress: []  # NetworkPolicyEgressRule entries appended to this
  #                    # component's egress policy (with egress.enabled)
  #   extraIngress: [] # NetworkPolicyIngressRule entries appended to this
  #                    # component's ingress policy
  # e.g. a private archive and LLM endpoint:
  #   components:
  #     aggregator:
  #       internet: false
  #       extraEgress:
  #         - to: [{ipBlock: {cidr: 100.90.247.108/32}}]
  #           ports: [{protocol: TCP, port: 50140}]
  #     enricher:
  #       internet: false
  #       extraEgress:
  #         - to:
  #             - namespaceSelector:
  #                 matchLabels: {kubernetes.io/metadata.name: tailscale}
  #               podSelector:
  #                 matchLabels: {tailscale.com/parent-resource: ollama-web-proxies}
  components: {}

# ---------------------------------------------------------------------------
# helm test
# ---------------------------------------------------------------------------
tests:
  # -- Render the `helm test` pod. Running it requires a live cluster with
  # the images available.
  enabled: true
  image:
    # -- Empty means "reuse the api image", which already ships curl
    # (docker/api.Dockerfile installs it for the compose HEALTHCHECK). That
    # keeps `helm test` working in an air-gapped cluster with no extra pull.
    # Set a repository here only if you want a different probe image.
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent

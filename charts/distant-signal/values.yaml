# Values for the distant-signal chart.
#
# The layout mirrors .env.example so the docker-compose path and the Helm
# path do not drift. Every service section names the crate whose
# `config.rs` defines its environment contract.

# -- Override the chart name used in resource names and labels.
nameOverride: ""
# -- Override the fully-qualified release name entirely.
fullnameOverride: ""

# -- Image pull secrets applied to every pod in the chart.
imagePullSecrets: []
# - name: my-registry-creds

global:
  # -- Registry (and, optionally, org/path prefix) substituted in front of
  # every image this chart renders, in place of whichever registry each
  # `image.repository` below already carries -- e.g.
  # `--set global.imageRegistry=registry.example.com/myfork` turns
  # `ghcr.io/fasterspeeding/distant-signal/api` into
  # `registry.example.com/myfork/distant-signal/api` (see
  # `distant-signal.image` in templates/_helpers.tpl for exactly how the
  # split is made -- the last two `/`-separated path segments of
  # `image.repository` are kept, everything before them is replaced).
  # Leave empty to use every `image.repository` exactly as written --
  # this project's own images already default to the real
  # `ghcr.io/fasterspeeding/distant-signal/<service>` path
  # `.github/workflows/containers.yml` publishes to, so no override is
  # needed for a plain `helm install` to work.
  imageRegistry: ""

serviceAccount:
  # -- Create a ServiceAccount for the chart's workloads.
  create: true
  # -- Name to use. When empty and `create` is true, the fullname is used.
  name: ""
  # -- Annotations for the ServiceAccount (e.g. cloud workload identity).
  annotations: {}

# ---------------------------------------------------------------------------
# Shared secrets
# ---------------------------------------------------------------------------
# Every secret value in this chart follows the same three-way rule:
#   1. `existingSecret` set  -> the chart renders NO key for it; the workloads
#                               read the named Secret directly. Use this with
#                               External Secrets Operator, Vault or SOPS.
#   2. an explicit value set -> the chart renders that value.
#   3. neither               -> for the postgres password ONLY, a
#                               32-character alphanumeric value is
#                               generated, and PRESERVED across `helm upgrade`
#                               by reading the live Secret back (see README).
#
# The shared internal-token header this block used to hold is retired --
# every internal caller now authenticates to api's /private/* routes via
# its own Authentik service-account OAuth2 credential instead, see
# internalOauth below. This top-level `secrets` block is kept (rather than
# removed outright) as the home for any future chart-wide secret that isn't
# tied to one specific service.
secrets: {}

# ---------------------------------------------------------------------------
# internalOauth -- shared, non-secret OAuth2 client-credentials config every
# real caller of api's /private/* routes uses to obtain its own access
# token (docs/superpowers/specs/2026-09-02-internal-service-oauth2-design.md
# Decision 6). One shared Authentik OAuth2 Provider/Application services
# all 8 real callers (Decision 1). Defining that Provider, its 8 Service
# Accounts, and their groups is explicitly OUT OF SCOPE for this chart
# (operator/deployment-time work) -- these values only configure how this
# chart's own Deployments REACH whatever an operator has already
# provisioned.
# ---------------------------------------------------------------------------
internalOauth:
  # -- Authentik's client-credentials token endpoint, e.g.
  # https://sso.example.com/application/o/token/. Required whenever any
  # real caller is enabled.
  tokenUrl: ""
  # -- The shared OAuth2 Provider's client_id -- same value as
  # api.internalOauth.clientId below (the expected `aud`). Required.
  clientId: ""
  # -- Scope requested on every client-credentials POST -- must match
  # whatever scope mapping the operator attached to the provider to
  # surface the `groups` claim (Decision 3).
  scope: groups

# ---------------------------------------------------------------------------
# postgres
# ---------------------------------------------------------------------------
# There is intentionally no `replicaCount` here: this is a single-replica
# StatefulSet with no replication, backup or restore story (an explicit
# non-goal of the design). If you need HA, set `postgresql.enabled: false`
# and point `externalDatabase` at a managed database.
postgresql:
  # -- Deploy the bundled single-replica PostgreSQL StatefulSet. Set to false
  # to use a managed database, and fill in `externalDatabase` below.
  enabled: true
  auth:
    # -- Database role the api and aggregator connect as.
    username: distant_signal
    # -- Database name.
    database: distant_signal
    # -- Password. Generated (32 alphanumeric chars) when empty.
    #
    # IMPORTANT: DATABASE_URL is assembled as a URL, and the chart never sees
    # this value at render time when `existingSecret` is used, so it cannot
    # percent-encode it for you. A password containing any of
    #   @ : / ? # [ ] %
    # must be percent-encoded by YOU before being put here. Generated
    # passwords use randAlphaNum (letters and digits only), so the default
    # path is never affected.
    password: ""
    # -- Read `postgres-password` from this pre-existing Secret instead.
    existingSecret: ""
    # -- Key within `existingSecret` holding the password.
    existingSecretPasswordKey: postgres-password
  image:
    repository: postgres
    # -- Pinned to the same major the docker-compose stack uses.
    tag: "16"
    pullPolicy: IfNotPresent
  service:
    # -- Port the headless Service and the container listen on.
    port: 5432
  probes:
    # -- startupProbe budget (INF-4). Liveness only begins once pg_isready
    # succeeds, so crash recovery (WAL redo after a node reboot) is never
    # killed mid-way. periodSeconds x failureThreshold = 10s x 90 = 15
    # minutes, generous for up to max_wal_size (4GB) of redo while every
    # other pod on the node is also starting; the 2026-09-27 00:29 recovery
    # replayed 1.7GB in 20s on an idle node. After startup the liveness probe
    # keeps its normal 60s (10s x 6) budget.
    startup:
      periodSeconds: 10
      failureThreshold: 90
  persistence:
    # -- Attach a PersistentVolumeClaim. When false, an emptyDir is used and
    # ALL DATA IS LOST when the pod is rescheduled -- ephemeral testing only.
    enabled: true
    # -- Bumped from 8Gi: the shared trains/train_movement_events/
    # train_current_state tables (national-scope TRUST ingestion, 30-day
    # retention -- see docs/superpowers/specs/2026-09-06-shared-train-
    # identity-design.md) can reach a several-GB ceiling on their own before
    # accounting for WAL and autovacuum bloat on their high-churn
    # append/prune pattern, which left 8Gi with too little headroom.
    size: 20Gi
    # -- StorageClass name. Empty means the cluster default.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # -- Use a pre-existing PVC instead of a volumeClaimTemplates entry.
    existingClaim: ""
  # -- Extra PostgreSQL container env vars. Server settings go in
  # `config` below, not here: the postgres image reads no env var for them.
  extraEnv: []
  # -- postgresql.conf settings, passed as `-c name=value` args (see
  # postgres-statefulset.yaml). Command-line settings outrank both
  # postgresql.conf and ALTER SYSTEM. Any change rolls the StatefulSet,
  # i.e. restarts Postgres -- which shared_buffers, wal_buffers and
  # huge_pages need anyway. Quote values carrying units ("512MB",
  # "15min"). Set a key to null to drop it and fall back to Postgres's own
  # default; set `config: {}` to drop them all.
  #
  # These defaults are the production (mine-bringer) settings, SIZED FOR
  # THE DEFAULT 5Gi MEMORY LIMIT in `resources` below: if you change that
  # limit, scale shared_buffers (~20-25% of it) and effective_cache_size
  # (~70% of it) with it. Rough budget at 5Gi: 1GB shared_buffers + 32MB
  # WAL buffers + up to 3 x 128MB autovacuum + 256MB for one manual
  # VACUUM/CREATE INDEX (held in /dev/shm when the VACUUM runs in
  # parallel) + per-backend memory (typically 10-30MB idle, far more
  # briefly while detoasting large JSONB) + parallel-query /dev/shm,
  # leaving the rest to the page cache.
  #
  # random_page_cost 1.1 ASSUMES SSD-CLASS STORAGE (SSD/NVMe, or network
  # block storage backed by it), which is what essentially every managed
  # Kubernetes default StorageClass provides. On spinning disks set it
  # back to 4 (Postgres's own default). effective_io_concurrency is left
  # at Postgres's default.
  config:
    # Postgres default 128MB. ~20% of the memory limit.
    shared_buffers: "1GB"
    # Planner hint only (no allocation): shared_buffers + the page cache
    # the container can realistically keep, ~70% of the limit.
    effective_cache_size: "3584MB"
    # Per sort/hash node per backend, and hash nodes may use
    # hash_mem_multiplier (2) times this. Keep it modest -- the chart's
    # services hold ~15-20 pooled connections, max_connections is 100.
    work_mem: "16MB"
    # Manual VACUUM, CREATE INDEX, ALTER TABLE ADD FOREIGN KEY.
    maintenance_work_mem: "256MB"
    # Per autovacuum worker (autovacuum_max_workers = 3). Set explicitly
    # so raising maintenance_work_mem for migrations doesn't triple into
    # the autovacuum budget. 128MB holds ~22M dead tuple ids per pass.
    autovacuum_work_mem: "128MB"
    # The automatic value is shared_buffers/32 capped at 16MB; pinned
    # above that cap because bulk whole-day schedule publishes fill small
    # WAL buffers fast.
    wal_buffers: "32MB"
    # Postgres defaults 1GB / 80MB / 5min. Fewer, larger checkpoints mean
    # fewer full-page images in WAL after each one; the cost is a longer
    # crash recovery (bounded by max_wal_size) and more pg_wal disk (up
    # to ~max_wal_size, on the 20Gi `persistence.size`). min_wal_size
    # keeps 1GB of segments recycled rather than removed and recreated.
    max_wal_size: "4GB"
    min_wal_size: "1GB"
    checkpoint_timeout: "15min"
    # Compresses the full-page images written after each checkpoint.
    # lz4 needs Postgres 15+ built with lz4 (the official postgres
    # image is); use "pglz" or "on" on an older server.
    wal_compression: "lz4"
    # Planner cost of a random page read relative to a sequential one
    # (Postgres default 4, which models spinning disks). See the note
    # above: SSD-class storage only; set 4 on spinning disks.
    random_page_cost: "1.1"
    # The pod requests no hugepages-2Mi resource, and "try" (the default)
    # can SIGBUS on nodes that have hugepages configured but not granted
    # to this cgroup. Quoted: a bare `off` is a YAML boolean.
    huge_pages: "off"
    # max_connections is deliberately NOT set here: it stays at Postgres's
    # default 100 (97 usable by non-superusers). The services' pools add up
    # to api 50 per replica (`api.database.maxConnections`) + aggregator 10
    # + notifier 5 + enricher 5 = 70 at `api.replicaCount: 1`, plus the
    # migration connection, the backup job and psql/kubectl exec. Each
    # extra api replica adds another 50, so before scaling api to 2
    # replicas either raise max_connections here (needs a restart; check
    # the memory budget first -- work_mem is per sort/hash node per
    # backend) or lower `api.database.maxConnections`
    # (DATABASE_MAX_CONNECTIONS). Not raised by default: at 1GB
    # shared_buffers, 16MB work_mem and a 5Gi limit, 200 backends risk
    # memory pressure (INF-7, 2026-09-27).
    # --- Observability (DB review 2026-09-27, F6: slow queries were
    # invisible). ---
    # Per-query statistics: `SELECT ... FROM pg_stat_statements`. The
    # extension itself is created by migration
    # 20260927070000_pg_stat_statements.sql. A preload library only loads at
    # server start, so this takes effect on the next Postgres restart (any
    # change to this `config` block rolls the StatefulSet, which restarts
    # it). Costs a few % of CPU on very hot tiny queries and ~5000 x ~1KB of
    # shared memory.
    shared_preload_libraries: "pg_stat_statements"
    # Top-level statements only (not statements run inside functions).
    pg_stat_statements.track: "top"
    # Log every statement that runs 1s or longer, with its duration. Expect
    # a line per schedule-publish bulk batch (3-8s each, a few per day).
    log_min_duration_statement: "1s"
    # ...but never their bind parameters: the bulk schedule inserts bind
    # arrays of ~250k rows, and some parameters are user data or session
    # tokens.
    log_parameter_max_length: 0
    # Log a lock wait that lasts longer than deadlock_timeout (1s).
    log_lock_waits: "on"
    # I/O timings in EXPLAIN (ANALYZE, BUFFERS), pg_stat_statements and
    # pg_stat_database. Cheap on Linux's clock source; verify with
    # pg_test_timing if in doubt.
    track_io_timing: "on"
  # A memory-backed /dev/shm for Postgres's dynamic shared memory
  # (dynamic_shared_memory_type=posix). The runtime default is 64MiB, and
  # that has ALREADY FAILED IN PRODUCTION: a manual
  # `VACUUM (ANALYZE) train_movement_events` died with "could not resize
  # shared memory segment ... to 67145344 bytes: No space left on device",
  # because a parallel VACUUM (max_parallel_maintenance_workers = 2) keeps
  # its whole dead-tuple array -- up to maintenance_work_mem -- in DSM.
  # Parallel hash joins also live here: up to work_mem * hash_mem_multiplier
  # per participant (leader + max_parallel_workers_per_gather = 3) per hash
  # node. (Autovacuum is never parallel; shared_buffers is an anonymous
  # mmap -- neither uses /dev/shm.)
  #
  # Size it as maintenance_work_mem + a few concurrent parallel hash nodes
  # + ~50% headroom: with the defaults above, 256MB + 4 x (16MB x 2 x 3)
  # = ~640MB, so 1Gi. tmpfs pages COUNT AGAINST THE CONTAINER MEMORY
  # LIMIT while in use (they are freed when the segment is), so budget
  # the worst case into `resources.limits.memory`, and raise this with
  # maintenance_work_mem/work_mem.
  shm:
    # -- Mount a memory-backed emptyDir at /dev/shm.
    enabled: true
    # -- Size of /dev/shm (the kubelet sizes the tmpfs to this). Empty
    # means no sizeLimit, i.e. bounded only by the pod's memory limit.
    sizeLimit: 1Gi
  # -- Merged over the pod securityContext. The uid/gid/fsGroup 999 pins are
  # required by the postgres image -- override them only if you know why.
  podSecurityContext: {}
  # -- Starting-point resources, NOT a tuning pass. Every block in this file
  # was `{}` until 2026-09-25, which put EVERY pod in this chart in the
  # BestEffort QoS class -- the first thing the kubelet evicts under node
  # memory pressure, in no particular order, INCLUDING the bundled Postgres
  # StatefulSet. A `schedule-reference` CIF parse or a leaking
  # `full-coverage-consumer` cache could therefore take the database down
  # with it. Sizes below are reasoned from what each workload actually
  # does (see each block's own note); replace them with real numbers from
  # production monitoring.
  #
  # MEMORY gets a request AND a limit: it is the non-compressible resource,
  # so a limit is what turns a leak into one OOMKilled pod instead of a
  # degraded node. CPU gets a request but deliberately NO limit: a CPU
  # limit throttles via CFS quota, which on these async Rust services
  # shows up as latency spikes rather than a clean failure, and the
  # requests alone are enough for scheduling and for proportional sharing
  # under contention.
  # Every table in the app, plus shared_buffers/work_mem for the
  # aggregation and schedule queries. The request is deliberately
  # well ABOVE steady-state usage: eviction ranks Burstable pods by
  # how far over their request they are, so a generous request is what
  # keeps the database near the bottom of that list. For the strongest
  # protection set requests == limits here (Guaranteed QoS), accepting
  # that the postmaster is then OOMKilled rather than throttled if it
  # ever genuinely exceeds the limit.
  #
  # 3Gi/5Gi (production values, moved into the chart defaults
  # 2026-09-26; previously 1Gi/2Gi): the limit covers the `config`
  # budget above -- 1GB shared_buffers, up to 1Gi of /dev/shm in the
  # worst case, autovacuum and backends -- with the rest left to the
  # page cache that effective_cache_size assumes.
  resources:
    requests:
      cpu: 250m
      memory: 3Gi
    limits:
      memory: 5Gi
    # requests:
    #   cpu: 100m
    #   memory: 256Mi
    # limits:
    #   memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# ---------------------------------------------------------------------------
# External database (used only when postgresql.enabled is false)
# ---------------------------------------------------------------------------
# Exactly one of `url` or `existingSecret` must be set when
# postgresql.enabled is false; otherwise rendering fails with an explicit
# message. `existingSecret` is the preferred form -- it keeps the password
# out of `helm get values` as well as out of the Deployment spec.
externalDatabase:
  # -- Full libpq/sqlx connection URL, e.g.
  # postgres://user:pass@host.example.com:5432/distant_signal
  url: ""
  # -- Pre-existing Secret holding the whole connection URL.
  existingSecret: ""
  # -- Key within `existingSecret` holding the URL.
  existingSecretUrlKey: database-url

# Session settings every Postgres pool (api, aggregator, notifier, enricher)
# sends at connect time -- see crates/common/src/pg.rs. Rendered as the
# DATABASE_* env vars by the `distant-signal.databaseEnv` helper. Seconds;
# 0 disables a timeout (falls back to the server's own setting, which is 0
# on the bundled Postgres). Each connection also reports
# `application_name` (distant-signal-api, -aggregator, -notifier,
# -enricher, -api-migrations) in pg_stat_activity.
databasePool:
  # -- Server-side statement_timeout. Code paths that legitimately run
  # longer raise it for their own transaction with SET LOCAL: schedule
  # publish chunks (120s), retention prunes and archive batches (600s).
  statementTimeoutSecs: 60
  # -- idle_in_transaction_session_timeout: ends a session that opened a
  # transaction and stopped talking, which would otherwise hold its locks
  # and pin vacuum's xmin horizon.
  idleInTransactionTimeoutSecs: 30
  # -- How long a request waits for a free pool connection before failing
  # (sqlx's own default is 30s).
  acquireTimeoutSecs: 5

# ---------------------------------------------------------------------------
# Rail Data Marketplace pollers
# ---------------------------------------------------------------------------
# ALL FOUR ARE DISABLED BY DEFAULT. As documented in .env.example, no
# confirmed RDM endpoint exists for any of these feeds -- every base URL in
# the repository today is a deliberately non-functional `*.example.invalid`
# placeholder. A default install therefore brings up postgres + api +
# aggregator + frontend and works immediately, instead of four pods logging
# connection failures.
#
# Enabling a poller without setting its `baseUrl` aborts rendering with an
# explicit message rather than deploying a pod that cannot work.
#
# `baseUrlEnvVar` and `ingestPath` are part of each poller's contract with
# its binary (see crates/poller-*/src/config.rs) -- change them only if that
# code changes.
pollers:
  incidents:
    enabled: false
    image:
      repository: ghcr.io/fasterspeeding/distant-signal/poller-incidents
      tag: ""
      # -- Content digest override. See api.image.digest's own comment below
      # for the full rationale; same shape here.
      digest: ""
      pullPolicy: IfNotPresent
    # -- RDM Knowledgebase Incidents feed base URL. Required when enabled.
    baseUrl: ""
    # -- Env var this binary reads the base URL from. Do not change.
    baseUrlEnvVar: RDM_INCIDENTS_BASE_URL
    # -- Path on the api Service this poller POSTs its results to.
    ingestPath: /private/incidents
    # -- RSPS5050 P-03-00 Rev A section 10: "Recommend every 5 minutes."
    pollIntervalSecs: 300
    # -- RDM API key, sent as the `x-apikey` header. Rendered into the chart
    # Secret as `rdm-incidents-api-key` when `existingSecret` is empty.
    apiKey: ""
    existingSecret: ""
    existingSecretApiKeyKey: rdm-incidents-api-key
    # -- This poller's own Authentik service-account credential -- see
    # top-level internalOauth for the shared, non-secret token URL/
    # client_id/scope. Never auto-generated (Authentik, an external
    # system, assigns these) -- same posture as apiKey above, not
    # secrets.internalToken's old auto-generate posture.
    internalOauthUsername: ""
    internalOauthPassword: ""
    existingSecretInternalOauthUsernameKey: internal-oauth-username-poller-incidents
    existingSecretInternalOauthPasswordKey: internal-oauth-password-poller-incidents
    logLevel: info
    extraEnv: []
    # Fetches and diffs one RDM incident feed per tick.
    #
    # Limit trimmed from 256Mi to 128Mi 2026-09-26: live `kubectl top` on
    # the mine-bringer cluster showed steady-state usage in the 5-13Mi
    # range across all 5 pollers -- 256Mi was ~20-50x that. Halved rather
    # than sized to the snapshot, since these are event-driven workloads
    # that can spike under a burst of incoming messages.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podSecurityContext: {}
  stations:
    enabled: false
    image:
      repository: ghcr.io/fasterspeeding/distant-signal/poller-stations
      tag: ""
      # -- Content digest override. See api.image.digest's own comment below
      # for the full rationale; same shape here.
      digest: ""
      pullPolicy: IfNotPresent
    baseUrl: ""
    baseUrlEnvVar: RDM_STATIONS_BASE_URL
    ingestPath: /private/stations
    # -- RSPS5050 P-03-00 Rev A section 6: once every 24 hours, overnight.
    pollIntervalSecs: 86400
    apiKey: ""
    existingSecret: ""
    existingSecretApiKeyKey: rdm-stations-api-key
    # -- This poller's own Authentik service-account credential -- see
    # top-level internalOauth for the shared, non-secret token URL/
    # client_id/scope. Never auto-generated (Authentik, an external
    # system, assigns these) -- same posture as apiKey above, not
    # secrets.internalToken's old auto-generate posture.
    internalOauthUsername: ""
    internalOauthPassword: ""
    existingSecretInternalOauthUsernameKey: internal-oauth-username-poller-stations
    existingSecretInternalOauthPasswordKey: internal-oauth-password-poller-stations
    logLevel: info
    extraEnv: []
    # Holds the whole ~2,600-row station catalogue in memory to build one
    # ingest body.
    #
    # Limit trimmed from 384Mi to 192Mi 2026-09-26: live `kubectl top` on
    # the mine-bringer cluster showed steady-state usage in the 5-13Mi
    # range across all 5 pollers -- 384Mi was ~30-75x that. Halved rather
    # than sized to the snapshot, since these are event-driven workloads
    # that can spike under a burst of incoming messages.
    #
    # Size this one from its startup poll, not from `kubectl top`. It sits
    # idle between the 24-hour polls, and the poll runs at every start. It
    # fetches the whole ~37MB feed and POSTs a body of about the same size.
    # Before the 2026-09-27 fix in crates/poller-stations/src/schema.rs,
    # that poll peaked at ~320MB RSS, so every 192Mi pod was OOMKilled
    # about 4s after it started. After the fix it peaks at 117-133MB
    # (VmHWM, release binary, 38.6MB feed rebuilt from production). 192Mi
    # leaves ~35% headroom for feed growth.
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 192Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podSecurityContext: {}
  tfl:
    enabled: false
    image:
      repository: ghcr.io/fasterspeeding/distant-signal/poller-tfl
      tag: ""
      # -- Content digest override. See api.image.digest's own comment below
      # for the full rationale; same shape here.
      digest: ""
      pullPolicy: IfNotPresent
    # -- TfL Unified API root. Unlike the RDM feeds this is a real, public,
    # documented endpoint, so it has a working default rather than "".
    baseUrl: "https://api.tfl.gov.uk"
    baseUrlEnvVar: TFL_BASE_URL
    # -- tfl only. TfL sends its subscription key in its own header, so the
    # binary reads TFL_APP_KEY where the RDM pollers read RDM_API_KEY.
    apiKeyEnvVar: TFL_APP_KEY
    ingestPath: /private/tfl-line-status
    # -- TfL publishes no recommended cadence for the line-status endpoint,
    # and offers no push or conditional requests. 300s mirrors incidents.
    pollIntervalSecs: 300
    # -- TfL subscription key from api-portal.tfl.gov.uk. Rendered into the
    # chart Secret as `rdm-tfl-api-key` when `existingSecret` is empty — the
    # `rdm-` prefix is the chart's uniform per-poller key naming
    # (distant-signal.pollerSecretKey), not a claim that this is an RDM key.
    apiKey: ""
    existingSecret: ""
    existingSecretApiKeyKey: rdm-tfl-api-key
    # -- This poller's own Authentik service-account credential -- see
    # top-level internalOauth for the shared, non-secret token URL/
    # client_id/scope. Never auto-generated (Authentik, an external
    # system, assigns these) -- same posture as apiKey above, not
    # secrets.internalToken's old auto-generate posture.
    internalOauthUsername: ""
    internalOauthPassword: ""
    existingSecretInternalOauthUsernameKey: internal-oauth-username-poller-tfl
    existingSecretInternalOauthPasswordKey: internal-oauth-password-poller-tfl
    logLevel: info
    extraEnv:
      - name: TFL_MODES
        value: "tube,dlr,overground,elizabeth-line,tram"
    # -- Enables the DLR arrivals-diffing pilot -- see
    # crates/poller-tfl/src/config.rs's dlr_pilot_enabled doc for why this
    # defaults off (never yet run a clean cycle against a real deployment).
    dlrPilotEnabled: false
    # -- Poplar's Naptan id, the pilot's one fixed station -- see
    # crates/poller-tfl/src/config.rs's dlr_pilot_stop_point_id doc.
    dlrPilotStopPointId: "940GZZDLPOP"
    # One TfL line-status JSON document per tick.
    #
    # Limit trimmed from 384Mi to 192Mi 2026-09-26: live `kubectl top` on
    # the mine-bringer cluster showed steady-state usage in the 5-13Mi
    # range across all 5 pollers -- 384Mi was ~30-75x that. Halved rather
    # than sized to the snapshot, since these are event-driven workloads
    # that can spike under a burst of incoming messages.
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 192Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podSecurityContext: {}
  tocs:
    enabled: false
    image:
      repository: ghcr.io/fasterspeeding/distant-signal/poller-tocs
      tag: ""
      # -- Content digest override. See api.image.digest's own comment below
      # for the full rationale; same shape here.
      digest: ""
      pullPolicy: IfNotPresent
    baseUrl: ""
    baseUrlEnvVar: RDM_TOCS_BASE_URL
    ingestPath: /private/tocs
    # -- RSPS5050 P-03-00 Rev A section 3: at least once every 24 hours.
    pollIntervalSecs: 86400
    apiKey: ""
    existingSecret: ""
    existingSecretApiKeyKey: rdm-tocs-api-key
    # -- This poller's own Authentik service-account credential -- see
    # top-level internalOauth for the shared, non-secret token URL/
    # client_id/scope. Never auto-generated (Authentik, an external
    # system, assigns these) -- same posture as apiKey above, not
    # secrets.internalToken's old auto-generate posture.
    internalOauthUsername: ""
    internalOauthPassword: ""
    existingSecretInternalOauthUsernameKey: internal-oauth-username-poller-tocs
    existingSecretInternalOauthPasswordKey: internal-oauth-password-poller-tocs
    logLevel: info
    extraEnv: []
    # The smallest poller in the chart: a short operator list per tick.
    #
    # Limit trimmed from 256Mi to 128Mi 2026-09-26: live `kubectl top` on
    # the mine-bringer cluster showed steady-state usage in the 5-13Mi
    # range across all 5 pollers -- 256Mi was ~20-50x that. Halved rather
    # than sized to the snapshot, since these are event-driven workloads
    # that can spike under a burst of incoming messages.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podSecurityContext: {}
  ldbws:
    enabled: false
    image:
      repository: ghcr.io/fasterspeeding/distant-signal/poller-ldbws
      tag: ""
      # -- Content digest override. See api.image.digest's own comment below
      # for the full rationale; same shape here.
      digest: ""
      pullPolicy: IfNotPresent
    # -- LDBWS base URL up to and including the /LDBWS/api/20220120 segment;
    # the binary appends /GetDepBoardWithDetails/{crs} itself.
    baseUrl: ""
    baseUrlEnvVar: LDBWS_BASE_URL
    ingestPath: /private/station-samples
    # -- ldbws only: the api endpoint listing which stations to sample. This
    # is a SECOND api URL, separate from ingestPath -- see
    # crates/poller-ldbws/src/config.rs.
    sampleStationsPath: /private/sample-stations
    # -- ldbws only: LDBWS `numRows` query parameter (upstream default 10).
    numRows: 10
    # -- DESIGN.md section 4 targets 30-60s; 60 is the conservative end
    # because this feed's real rate limit is unconfirmed.
    pollIntervalSecs: 60
    apiKey: ""
    existingSecret: ""
    existingSecretApiKeyKey: rdm-ldbws-api-key
    # -- This poller's own Authentik service-account credential -- see
    # top-level internalOauth for the shared, non-secret token URL/
    # client_id/scope. Never auto-generated (Authentik, an external
    # system, assigns these) -- same posture as apiKey above, not
    # secrets.internalToken's old auto-generate posture.
    internalOauthUsername: ""
    internalOauthPassword: ""
    existingSecretInternalOauthUsernameKey: internal-oauth-username-poller-ldbws
    existingSecretInternalOauthPasswordKey: internal-oauth-password-poller-ldbws
    logLevel: info
    extraEnv: []
    # Parses Darwin LDBWS SOAP responses, which are verbose XML and the
    # largest bodies any RDM poller handles.
    #
    # Limit trimmed from 384Mi to 192Mi 2026-09-26: live `kubectl top` on
    # the mine-bringer cluster showed steady-state usage in the 5-13Mi
    # range across all 5 pollers -- 384Mi was ~30-75x that. Halved rather
    # than sized to the snapshot, since these are event-driven workloads
    # that can spike under a burst of incoming messages.
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 192Mi
    nodeSelector: {}
    tolerations: []
    affinity: {}
    podAnnotations: {}
    podSecurityContext: {}

# ---------------------------------------------------------------------------
# api (crates/api/src/data/config.rs: ServiceArguments)
# ---------------------------------------------------------------------------
api:
  image:
    repository: ghcr.io/fasterspeeding/distant-signal/api
    # -- Empty means "use the chart's appVersion".
    tag: ""
    # -- Exact content digest (e.g. sha256:<64 hex chars>) of the image CI
    # just built and pushed for this run, e.g.
    # `sha256:1234...abcd`. Empty by default. When set,
    # `distant-signal.image` (templates/_helpers.tpl) renders
    # `<repository>@<digest>`, ignoring `tag`/`appVersion` entirely --
    # `repo:tag@digest` is valid OCI syntax, but the digest silently wins on
    # pull anyway, so rendering the tag alongside it would just be
    # misleading. A digest is the only fully immutable image reference (a
    # tag, even the `sha-<short-sha>` one this chart's appVersion normally
    # resolves to, can in principle be re-pushed to point at different
    # content; `repo@sha256:...` cannot). `.github/workflows/containers.yml`'s
    # `push-helm-chart` job populates this for every first-party image from
    # that same run's own `docker/build-push-action` digest output, plumbed
    # via per-service artifacts (see that job's own comment) -- see that
    # job's comment for what happens when a digest is legitimately missing
    # (e.g. a re-run of just that job without a fresh image build): it falls
    # back cleanly to this same tag/appVersion behavior rather than baking a
    # broken `@` reference into the packaged chart. Left empty here (and in
    # every other first-party service's `image.digest` below) as the
    # human-facing default -- nothing in this chart or a plain `helm
    # install`/`helm template` run ever sets it for you.
    digest: ""
    pullPolicy: IfNotPresent
  # -- Replicas. >1 does not corrupt anything: crates/api/src/main.rs runs
  # sqlx::migrate!() in process at startup, and sqlx's Migrator takes a
  # Postgres advisory lock, so concurrent startups serialise their migrations
  # rather than racing.
  #
  # It does NOT buy zero-downtime rollouts, though: api-deployment.yaml pins
  # `strategy: type: Recreate` (see its own comment there for why -- the same
  # in-process migration run is why), so every replica is terminated before
  # any new one starts, whatever this is set to. Raise it for read throughput
  # and node-failure tolerance, not for rollout availability.
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  # -- tracing-subscriber EnvFilter syntax: "info", "api=debug", "warn", ...
  logLevel: info
  # OIDC single sign-on. REQUIRED -- there is no `enabled` toggle and no
  # anonymous fallback: `crates/api`'s clap config declares all five SSO_*
  # fields with no default, so an api pod without them exits immediately
  # with "required arguments were not provided" and CrashLoopBackOffs.
  # Leaving any of the four non-secret values (or `clientSecret`, unless an
  # `existingSecret` supplies it) empty therefore ABORTS THE RENDER with an
  # explicit message, the same fail-fast posture `enricher.llm.baseUrl`
  # and the pollers' `baseUrl` already use, rather than deploying a pod
  # that cannot start.
  #
  # Sign-in is only needed for per-user features (pinning, authoring custom
  # lines); the line-status pages themselves stay readable anonymously.
  sso:
    # -- OIDC issuer base URL, e.g. https://sso.example.com/realms/rail.
    # Everything else (authorization, token and JWKS endpoints) is
    # discovered from this URL's .well-known/openid-configuration. Required.
    issuerUrl: ""
    # -- OIDC client id this deployment is registered as with the issuer.
    # Required.
    clientId: ""
    # -- OIDC client secret paired with `clientId`. Follows the chart's
    # normal secrets rule -- an `existingSecret` takes priority; otherwise
    # this value is rendered into the chart Secret as `sso-client-secret`.
    # Never auto-generated: a random value would be rejected by the issuer,
    # unlike a chart-generated value whose only peer is this chart itself.
    # Required (the api refuses to start on an empty client secret --
    # crates/api/src/app.rs).
    clientSecret: ""
    # -- Read `sso-client-secret` from this pre-existing Secret instead.
    existingSecret: ""
    # -- Key within `existingSecret` holding the client secret.
    existingSecretClientSecretKey: sso-client-secret
    # -- The exact redirect URI registered with the SSO server, e.g.
    # https://status.example.com/api/auth/callback. This must be the
    # FRONTEND's public origin, not the api's: the callback's Set-Cookie
    # has to be scoped to the origin the browser talks to for everything
    # else, or the session cookie never comes back. `/api/auth/callback` is
    # proxied through to the api by frontend/app/api/[...path]/route.ts.
    # Required.
    redirectUrl: ""
    # -- Where the callback and logout handlers send the browser once
    # they're done -- the frontend's own root URL, e.g.
    # https://status.example.com/. One fixed target, not a round-tripped
    # "return to the page you were on". Required.
    postLoginRedirectUrl: ""
  # -- How long a session stays valid after sign-in, in days. A fixed
  # expiry stamped at login, not a sliding window refreshed by activity.
  # Matches the binary's own default.
  sessionTtlDays: 14
  # -- How often the reconciliation sweep re-attempts fixing a stuck
  # tracked-train row -- see crates/api/src/data/config.rs's
  # reconciliation_sweep_interval_secs doc. 2026-09-25 Signal Box Audit Low
  # finding: declared with a working default but never wired into this
  # chart, alongside the three tunables immediately below it.
  reconciliationSweepIntervalSecs: 300
  # -- Grace period (minutes) the reconciliation sweep's schedule-
  # enrichment half waits past a candidate's true origin departure before
  # attempting a CIF-only match -- see config.rs's own
  # schedule_enrichment_grace_minutes doc. Same "declared but never wired"
  # gap as reconciliationSweepIntervalSecs above.
  scheduleEnrichmentGraceMinutes: 30
  # -- How often the backlog-match sweep retries `attempt_backlog_match`
  # against still-pending pins -- see config.rs's own
  # backlog_match_sweep_interval_secs doc. Same "declared but never wired"
  # gap as the two tunables above.
  backlogMatchSweepIntervalSecs: 300
  # -- How often the session-cleanup sweep deletes expired `sessions` rows
  # -- see config.rs's own session_cleanup_interval_secs doc. Same
  # "declared but never wired" gap as the three tunables above.
  sessionCleanupIntervalSecs: 3600
  # -- Personal-data retention (UK legal audit LEG-5), applied hourly by
  # the session-cleanup sweep -- see docs/personal-data-retention.md and
  # config.rs. 0 disables each limit.
  # Days after the travel date that tracked trains, tickets, journeys and
  # template skip markers are kept (548 = 18 months).
  pastTravelRetentionDays: 548
  # Push subscriptions are dropped once their user has not logged in (and
  # the subscription has not been renewed) for this many days.
  stalePushSubscriptionDays: 365
  # Whole accounts with no login and no live session for this many days are
  # deleted. OFF (0) by default: users without an email address cannot be
  # warned first, so enabling it is an operator decision the privacy notice
  # must state. The audit suggests 730 (24 months).
  inactiveAccountRetentionDays: 0
  # Internal-service OAuth2 verification -- see
  # docs/superpowers/specs/2026-09-02-internal-service-oauth2-design.md.
  # REQUIRED -- crates/api's clap config declares issuerUrl/clientId/13
  # group fields with no default for the first two, so a pod without them
  # exits immediately, same fail-fast posture as sso.* above.
  #
  # The group fields DO have defaults, which is precisely why a missing one is
  # dangerous rather than fail-fast: api silently falls back to the crate's
  # own suggested name, and if the operator's real Authentik group differs,
  # that caller's /private/* POSTs 403 forever. The count above must match
  # `groups:` below one-for-one -- enforced by
  # crates/api/src/data/config.rs's `chart_env_wiring_tests` module, which
  # fails the build if this template stops setting any declared
  # INTERNAL_OAUTH_GROUP_* var.
  internalOauth:
    # -- OIDC issuer base URL for the internal-service OAuth2 provider.
    # JWKS is discovered from this URL's .well-known/openid-configuration,
    # same mechanism as sso.issuerUrl. May be the same Authentik instance
    # as sso (a different Application/Provider) or a different one.
    issuerUrl: ""
    # -- Expected `aud` claim on a verified token -- SAME value as the
    # top-level internalOauth.clientId above.
    clientId: ""
    # -- Required Authentik group name per real caller (Decision 3). Not
    # secret. Suggested defaults only.
    groups:
      incidents: svc-poller-incidents
      stations: svc-poller-stations
      tocs: svc-poller-tocs
      ldbws: svc-poller-ldbws
      tfl: svc-poller-tfl
      trustConsumer: svc-trust-consumer
      scheduleIngest: svc-schedule-ingest
      scheduleReference: svc-schedule-reference
      fullCoverage: svc-full-coverage-consumer
      # Gates POST /private/trust-event-backlog -- trust-backlog-consumer's
      # own service-account group. MUST equal
      # trustBacklogConsumer.internalOauthUsername's own Authentik group
      # below, or every POST that workload makes is rejected 403 forever and
      # its Redis backlog grows without bound, with nothing but the
      # consumer's own error log as evidence. (Declared as
      # `internal_oauth_group_trust_backlog` in crates/api/src/data/config.rs
      # since 2026-09-05 but only wired into api-deployment.yaml here on
      # 2026-09-25 -- which is exactly the drift
      # crates/api/src/data/config.rs's `chart_env_wiring_tests` module now
      # makes impossible to reintroduce.)
      trustBacklog: svc-trust-backlog-consumer
      irishRailGtfs: svc-poller-irish-rail-gtfs
      irishRailLive: svc-poller-irish-rail-live
      nirStations: svc-poller-nir-stations
  # -- Authentik/SSO group (via the `groups` OIDC claim, NOT one of the
  # machine/service-account groups above) that grants a real, logged-in
  # user access to the embedded chatbot -- crate::auth::ChatbotAuthorizedUser
  # checks this against that user's own resolved `groups`. Suggested default
  # only; an operator's actual Authentik group name is not mandated.
  # Supersedes the former per-user `chatbot_allowed_users` DB allowlist.
  chatbotAccessGroup: distant-signal-chatbot-users
  # -- Authentik/SSO end-user group (same `groups` OIDC claim as
  # chatbotAccessGroup) whose members may end any user's sessions through
  # POST /api/admin/users/revoke-sessions. OFF by default: empty means
  # nobody is an admin and that endpoint returns 403 to everyone. Group
  # membership is read at login, so adding or removing someone takes effect
  # at their next login. See docs/session-revocation.md.
  adminGroup: ""
  # -- Global override for every catalogued line's own `full_coverage_enabled`
  # (per-line `lines/*.toml` field, `crates/common/src/lib.rs`). When `true`,
  # `data::station_stats::full_coverage_enabled_for` (crates/api) treats
  # EVERY line as full-coverage-enabled regardless of what its own TOML
  # entry sets -- a single flag to flip on real TRUST-vs-schedule delay/
  # cancellation data everywhere at once, instead of editing 100+ TOML
  # files. SAME value name/semantics as `aggregator.fullCoverageEnabledDefault`
  # below -- both services independently gate on `full_coverage_enabled`, so
  # both need setting to actually flip full coverage on everywhere.
  #
  # Flipped to `true` 2026-09-12, an explicit repo-owner decision overriding
  # docs/superpowers/plans/2026-08-29-trust-schedule-delay-validation.md's
  # own Task 8 "NOT YET" recommendation (see
  # docs/superpowers/specs/2026-08-29-trust-schedule-delay-validation-findings.md's
  # final section): the validation's own N (2 real disruption instances,
  # zero counterexamples, across three fix-and-reverify passes) was judged
  # too small to hit that plan's own statistical bar on its own, but every
  # mechanism-level blocker this exercise found (SSO, STANOX/CRS
  # translation, TRUST timestamp corruption, backlog-match wrong-train
  # contamination) is now fixed and independently re-verified with zero
  # remaining data-integrity caveats -- so the decision was to flip live
  # and keep collecting real-world monitoring data as an ongoing test,
  # rather than hold the switch off pending a larger sample first.
  fullCoverageEnabledDefault: true
  database:
    # -- api's Postgres pool size, per replica (DATABASE_MAX_CONNECTIONS).
    # Pools: api this x replicaCount, aggregator 10, notifier 5, enricher 5
    # -- keep the sum under postgresql.config.max_connections minus a few
    # for psql/kubectl exec and the migration connection. Timeouts shared by
    # every pool are in `databasePool`.
    maxConnections: 50
  # Settings for the dedicated connection api migrates on at startup,
  # before it binds (crates/api/src/migrate.rs). It first drops any INVALID
  # index a failed CREATE INDEX CONCURRENTLY left behind, so a retry
  # rebuilds it instead of crash-looping on "relation already exists".
  migrations:
    # -- lock_timeout: a DDL statement that cannot get its lock within this
    # fails (and the pod restarts and retries) instead of queueing behind a
    # long transaction -- and blocking every other query on that table
    # behind its own lock request -- until the startup probe kills it.
    # Also bounds a CREATE INDEX CONCURRENTLY's wait for old transactions.
    lockTimeoutSecs: 10
    # -- statement_timeout per migration statement. MUST stay below the
    # startup probe budget (`probes.startup`, 150 x 2s = 300s) so a slow
    # statement fails with a logged error rather than a SIGKILL. It is per
    # statement: several long ones can still add up past 300s. A migration
    # that needs longer: raise this and the startup probe together.
    statementTimeoutSecs: 240
  probes:
    # -- Path served by crates/api/src/routes/health.rs, nested under /public
    # by main.rs. Changing this must be matched in tests/test-api-health.yaml.
    path: /public/health
    startup:
      # 150 x 2s = 300s (5 minutes) of headroom. `api.migrations` below
      # bounds each migration statement inside it (240s statement_timeout,
      # 10s lock_timeout): raise the two together. The api runs
      # sqlx::migrate!() BEFORE it binds its listener
      # (crates/api/src/main.rs:118), so /public/health does not answer at
      # all until every pending migration has committed -- the startup
      # probe's total budget is therefore a hard ceiling on migration
      # wall-clock, not just on process boot.
      #
      # RAISED from 30 x 2s = 60s on 2026-09-25. 60s was sized for "a cold
      # start against an empty database", which is no longer the interesting
      # case: a single DDL step against a production-sized table can exceed
      # it on its own. The largest tables here are
      # `schedule_calling_points_full` (~1.7-2 million rows, torn down and
      # rebuilt daily -- docs/superpowers/plans/2026-09-22-dynamic-trip-planning-phase2-connections-array-plan.md:113)
      # and `schedule_destination_departures` (~377,000 rows per rail day at
      # 1-2 days' retention -- docs/superpowers/specs/2026-09-07-train-listing-destination-search-sizing-design.md:369),
      # and this crate's migration history is full of index builds against
      # exactly those (e.g.
      # 20260908150000_schedule_destination_departures_train_uid_idx.sql).
      # A multi-million-row btree build is seconds on warm local NVMe but
      # readily 1-2 minutes on throttled network-attached storage with the
      # default 64MB maintenance_work_mem, and a GIN build (the
      # incidents_affected_lines_gin shape) is several times slower again.
      # At 60s such a migration was SIGKILLed mid-transaction, rolled back,
      # and retried from scratch on the next restart -- a permanent
      # crash-loop that never converges, rather than a slow-but-successful
      # rollout.
      #
      # 300s is ~10x the estimated worst case at today's real row counts, so
      # it absorbs a slow index build without hiding a genuinely wedged
      # start for long. It costs nothing on the normal path: periodSeconds
      # stays at 2, so a pod with no pending migrations still becomes ready
      # within ~2s -- which matters, because api now rolls with
      # `strategy: Recreate` (see api-deployment.yaml) and that readiness
      # delay is real downtime. A config/connection failure is unaffected
      # either way: the process exits and the container restarts regardless
      # of this budget, which only governs "alive but not yet answering".
      periodSeconds: 2
      failureThreshold: 150
      timeoutSeconds: 3
    readiness:
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
    liveness:
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 3
  # -- Extra env vars appended to the container.
  extraEnv: []
  # glibc malloc tuning for the api container (debian:bookworm-slim, so
  # glibc's ptmalloc is the allocator; these env vars are read by glibc
  # itself at process start, no code involved). Set a key to "" to drop
  # that env var and fall back to glibc's default.
  #
  # Why (2026-09-26 OOM-kill investigation): the api pod's working set sat
  # at 1.2-1.4GiB of its 1536Mi limit even when idle, then tipped over
  # during bursts of multi-MB schedule-line-population requests. Two glibc
  # defaults make a tokio server hold on to freed memory:
  #   * one malloc arena per concurrently-allocating thread, up to 8 x CPUs
  #     of them, each keeping its own freed memory for reuse by itself only;
  #   * a DYNAMIC mmap threshold: after a large mmap'd block (say a 20MB
  #     response buffer) is freed, glibc raises the threshold to that size
  #     (up to 32MB), so every later allocation below it comes from an arena
  #     heap instead -- where freeing it rarely returns memory to the OS.
  # The code fix (no serde_json::Value round-trip for populations) removes
  # most of those big transient allocations; these settings keep whatever
  # large buffers remain from being retained afterwards.
  malloc:
    # -- MALLOC_ARENA_MAX. 2 caps retained per-arena memory; the cost is
    # more lock contention in malloc, negligible at this service's request
    # rates.
    arenaMax: "2"
    # -- MALLOC_MMAP_THRESHOLD_, in bytes. Setting it at all pins the
    # threshold (disabling the dynamic raise above), so every allocation of
    # at least this size is its own mmap and goes straight back to the OS on
    # free. 131072 is glibc's own starting value.
    mmapThreshold: "131072"
  # The biggest single driver here is NOT steady-state serving, it is
  # the /private/* schedule publishes: schedule-reference POSTs a
  # whole-network day in one body (~30MB of JSON, ~60MB worst case per
  # docs/superpowers/specs/2026-09-07-train-listing-destination-search-sizing-design.md
  # Task 1), and api buffers and deserialises that. Plus the line
  # catalogue, the sqlx pool, and one arena per concurrent request.
  #
  # 1Gi/3Gi are DELIBERATELY GENEROUS, stopgap-derived sizes: they are the
  # production overrides that kept the pod from being OOMKilled (at the
  # old 512Mi/1536Mi) during the 2026-09-26 investigation above, moved
  # into the chart defaults. The fixes since merged -- line populations
  # relayed as raw JSON text instead of a serde_json::Value round-trip,
  # ETag conditional reloads, and the `malloc` tuning above -- are
  # expected to bring real usage well below them. Resize from live
  # `kubectl top` once they have run in production for a while, not from
  # this estimate.
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 3Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # -- Merged over the chart-wide pod securityContext defaults
  # (runAsNonRoot: true, seccompProfile: RuntimeDefault).
  podSecurityContext: {}

# ---------------------------------------------------------------------------
# devAuthentik -- OPT-IN local dev-only OIDC identity provider
# (docs/superpowers/specs/2026-08-29-dev-oidc-server-design.md)
# ---------------------------------------------------------------------------
# A hand-rolled (NOT the goauthentik/helm subchart -- see the design doc's
# Non-goals) Authentik deployment for exercising this app's own login flow
# against a local/dev Kubernetes cluster with zero manual IdP-side setup,
# mirroring docker-compose.authentik.yml's job for the compose path.
# Strictly a dev convenience: no HA, no TLS automation, no backup/restore --
# see the design doc's Non-goals, which apply with equal force here.
#
# When enabled AND api.sso.* is left at its empty default, the chart
# computes api.sso.issuerUrl/clientId/clientSecret/redirectUrl/
# postLoginRedirectUrl from the values below and the fixed blueprint-
# provisioned client_id/client_secret in
# charts/distant-signal/files/devauthentik-blueprints/oauth2-client.yaml (the
# SAME fixed values docker-compose.authentik.yml's blueprint uses -- see
# authentik-blueprints/oauth2-client.yaml). An operator who sets any
# api.sso.* value explicitly keeps it; devAuthentik never overrides an
# explicit value.
devAuthentik:
  # -- Opt-in; false by default. An install that already points api.sso.*
  # at a real external IdP is completely unaffected either way.
  enabled: false
  # -- The ONE hostname both the developer's browser and the api Pod must
  # resolve identically -- see "Discovery reachability under Kubernetes" in
  # the design doc. Resolves to loopback with no /etc/hosts entry needed in
  # modern browsers (RFC 6761 .localhost handling), the same trick
  # docker-compose.authentik.yml uses.
  hostname: authentik.localhost
  image:
    repository: ghcr.io/goauthentik/server
    # -- Pinned, same rationale/finite-shelf-life caveat as the compose
    # path's tag (design doc Research + Open questions: Authentik's
    # 3-month release cadence and 2-version support window mean this needs
    # periodic bumping -- not automated by this chart).
    tag: "2026.8.0"
    pullPolicy: IfNotPresent
  # -- AUTHENTIK_SECRET_KEY. Chart-generated via the same lookup-then-
  # randAlphaNum pattern secret.yaml already uses for postgres-password/
  # internal-token when left empty, so it survives `helm upgrade`. No
  # existingSecret override -- this is a throwaway dev IdP, not a value an
  # operator would reasonably already have externally managed.
  secretKey: ""
  service:
    # -- ClusterIP-facing port AND NodePort. MUST be the same number as
    # nodePort below -- see "Discovery reachability under Kubernetes" in
    # the design doc: an in-cluster caller and a caller on the node's
    # published port must reach Authentik on an identical port number.
    # devauthentik-service.yaml aborts the render if these two ever differ.
    port: 30900
    # -- Must equal `port` above. Default 30900 is inside Kubernetes'
    # default 30000-32767 NodePort range (a nodePort can't be an arbitrary
    # value like the compose path's 9000 without a nonstandard
    # --service-node-port-range on the apiserver).
    nodePort: 30900
  # -- Explicit override for the IP the api Deployment's hostAliases entry
  # points devAuthentik.hostname at. Leave empty to use `lookup` against
  # devauthentik-service's live ClusterIP at render time (the chart's usual
  # pattern) -- BUT on a from-scratch `helm install`, devauthentik-service
  # doesn't exist yet when api is first rendered in the SAME release, so
  # `lookup` returns nothing and NO hostAliases entry is written at all.
  # Either set this explicitly on first install (predictable on e.g. kind's
  # commonly-default 10.96.0.0/12 service CIDR), or run `helm upgrade` once
  # immediately after the first `helm install` -- see NOTES.txt and the
  # chart README. THIS IS THE SINGLE BIGGEST GAP BETWEEN "DESIGNED" AND
  # "KNOWN TO WORK" ON THIS PATH, per the design doc's Open questions /
  # risks, Helm path section -- not resolved by this chart.
  hostAliasIP: ""
  # -- Dedicated Postgres for Authentik's own state -- NOT a second
  # database on this chart's own bundled `postgresql`. Same reasoning as
  # the compose path (design doc's Data services section): independent
  # migration lifecycles, reset-friendliness. Always rendered when
  # devAuthentik.enabled -- unlike the app's own postgresql/externalDatabase
  # pair there is no external-database escape hatch here, because this is a
  # throwaway dev-only database with no production posture to accommodate.
  postgresql:
    image: postgres:16-alpine
    persistence:
      enabled: true
      size: 1Gi
      storageClass: ""
    # Dev-only throwaway database for devAuthentik's own state -- tiny
    # next to the app's own postgresql above.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  # Dev-only, and a Django/Celery stack rather than a Rust binary --
  # its floor is set by the Python interpreter and its own workers, not
  # by load. Shared by BOTH the server and worker Deployments.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ---------------------------------------------------------------------------
# aggregator (crates/aggregator/src/config.rs: Config)
# ---------------------------------------------------------------------------
# There is intentionally no `replicaCount` here. The aggregator is a
# singleton write loop against Postgres: two copies would double-write
# line_status and race the history prune. The Deployment is pinned to
# replicas: 1 with strategy Recreate for the same reason -- a RollingUpdate
# would briefly run two.
aggregator:
  # -- /livez stall window (see workerHealth): one aggregation pass plus the retention prunes (and cold-archive uploads when archive.enabled).
  progressStallSecs: 1800
  image:
    repository: ghcr.io/fasterspeeding/distant-signal/aggregator
    tag: ""
    # -- Content digest override. See api.image.digest's own comment above
    # for the full rationale; same shape here.
    digest: ""
    pullPolicy: IfNotPresent
  # -- DESIGN.md section 4 targets every 30-60s; 60 is the conservative end.
  pollIntervalSecs: 60
  # -- How long line_status_history rows are kept before being pruned. Also
  # sourced by the api Deployment (api-deployment.yaml's own
  # HISTORY_RETENTION_DAYS) so it can report the real ceiling to the
  # frontend's history range picker -- deliberately one value, not a
  # separate api.historyRetentionDays, so the two can't drift apart.
  historyRetentionDays: 7
  # -- How long line_status_daily_stats rows (LDBWS-derived daily rollups)
  # are kept before being pruned. Must stay strictly under 365: RDM's Live
  # Departure Board licence (Schedule 1 §9) requires deleting all data
  # received within 1 year, and unlike historyRetentionDays this is the
  # gap that actually closes the production compliance risk -- an
  # unset/omitted value here previously meant "never pruned" (see
  # docs/superpowers/plans/2026-09-01-ldbws-data-retention.md). Matches
  # crates/aggregator/src/config.rs's own default_value_t.
  dailyStatsRetentionDays: 300
  # -- Retention for the half-hourly rollup table (line_status_half_hourly_stats,
  # 30-minute buckets since the trend-chart granularity was doubled -- formerly
  # line_status_hourly_stats, 1-hour buckets). Bumped from 48 hours to 840
  # (35 days) by
  # docs/superpowers/specs/2026-09-05-configurable-trend-granularity-design.md
  # Decision 3: this table is now read directly (30-minute granularity) AND
  # grouped into 1-hour/6-hour buckets by the History page's Trends tab, over
  # the user's actual selected range, not just the line-info page's fixed
  # rolling-24-hour embed. Measured in wall-clock hours, unchanged from the
  # table's original hourly-bucket era. Same RDM Live Departure Board licence
  # lineage as dailyStatsRetentionDays above -- the repo owner confirmed
  # directly that "half-hourly is still fine as long as we aren't retaining
  # for more than 300 days"; 840 hours (35 days) clears that with enormous
  # margin. Matches crates/aggregator/src/config.rs's own default_value_t.
  halfHourlyStatsRetentionHours: 840
  # -- Global override for every catalogued line's own `full_coverage_enabled`
  # (per-line `lines/*.toml` field, `crates/common/src/lib.rs`). When `true`,
  # `aggregation::merge_full_coverage` (crates/aggregator) treats EVERY line
  # as full-coverage-enabled regardless of what its own TOML entry sets -- a
  # single flag to flip on real TRUST-vs-schedule delay/cancellation data
  # everywhere at once, instead of editing 100+ TOML files. SAME value
  # name/semantics as `api.fullCoverageEnabledDefault` above -- both services
  # independently gate on `full_coverage_enabled`, so both need setting to
  # actually flip full coverage on everywhere.
  #
  # Flipped to `true` 2026-09-12 -- see `api.fullCoverageEnabledDefault`
  # above for the full repo-owner decision this mirrors.
  fullCoverageEnabledDefault: true
  # -- Windowed full-coverage severity
  # (docs/superpowers/specs/2026-09-27-full-coverage-windowed-stats-design.md,
  # and its "Decisions (2026-09-27)" section). All OFF by default.
  fullCoverageWindow:
    # -- off (today's behaviour exactly) | shadow (record a verdict per
    # line in full_coverage_window_verdicts, change nothing) | enforce
    # (also escalate the lines named in enforceLines). Rollback: off.
    mode: "off"
    # -- Lines enforce may change: comma list, or "*" for every
    # full-coverage-enabled line (fullCoverageEnabledDefault is true, so
    # that is every line). EMPTY by default: nothing is enforced until the
    # pilot lines are named (pick ~5 of different volumes from
    # `compare_full_coverage --windows --all-lines`).
    enforceLines: ""
    # -- Only verdicts of at least this severity_rank are enforced: 4 is
    # Severe Delays / Part Suspended. Lower tiers (Minor Delays, Reduced
    # Service; rank 3) are still recorded as would_escalate_to with
    # below_min_rank, for the evidence to lower this later.
    minEscalationRank: 4
    # -- Retention of full_coverage_line_window_stats and
    # full_coverage_window_verdicts (pruned in every mode).
    retentionDays: 14
  # -- How long trust_event_backlog rows are kept before aggregator prunes
  # them (crates/aggregator/src/queries.rs::prune_trust_event_backlog).
  # DEFAULT IS 1 DAY, DELIBERATELY -- see
  # crates/aggregator/src/config.rs's own
  # trust_event_backlog_retention_days doc comment and
  # docs/superpowers/plans/2026-09-05-trust-event-backlog-plan.md's own
  # "Scope decision: retention tier and the licensing safeguard" section.
  # A human must confirm TRUST's real Train Movements licence terms
  # directly with RDM before this is ever set above 1 in a real
  # production deployment -- do not bump this default without that
  # confirmation happening first. See also
  # trustBacklogConsumer.retentionDaysWarningAcknowledged below, which
  # exists purely to document that this decision has been made, not to
  # gate anything itself.
  trustEventBacklogRetentionDays: 1
  # -- How long to keep schedule_destination_departures rows, in whole
  # service dates. This table holds one row per departure (~377,000 per
  # day) and its wholesale replace is scoped to a single service date, so
  # unlike schedule_network_departures it genuinely accrues and genuinely
  # needs pruning. NOT a licensing safeguard -- purely disk and keeping
  # GET /public/trains/search's 7-day backward search window intact with
  # a 1-day safety margin. See
  # Config::schedule_destination_departures_retention_days
  # (crates/aggregator/src/config.rs) and
  # docs/superpowers/specs/2026-09-09-trains-search-multi-day-design.md.
  scheduleDestinationDeparturesRetentionDays: 8
  # -- How long trains rows (and, via CASCADE, train_movement_events/
  # train_current_state) are kept before aggregator prunes them, for a
  # train that HAS at least one train_subscriptions row referencing it --
  # a real user tracked that journey. Matches
  # crates/aggregator/src/config.rs's own trains_retention_days
  # default_value_t. See untrackedTrainsRetentionDays below for the
  # shorter tier applied to trains nobody is tracking.
  trainsRetentionDays: 30
  # -- How long a trains row is kept when NO train_subscriptions row
  # references it at all -- i.e. nobody ever pinned this journey. Shorter
  # than trainsRetentionDays above on purpose: these orphan rows (this
  # service's own schedule/TRUST-resolved data, not something a user is
  # actively watching) make up the bulk of trains at national scale and
  # have no per-user value once stale. A train WITH a subscription always
  # keeps the longer trainsRetentionDays window regardless of this value.
  # Matches crates/aggregator/src/config.rs's own
  # untracked_trains_retention_days default_value_t.
  untrackedTrainsRetentionDays: 14
  logLevel: info
  extraEnv: []
  # A singleton loop: one line-catalogue copy plus one batch of
  # line_status/history rows in flight at a time.
  #
  # Limit trimmed from 768Mi to 384Mi 2026-09-26: live `kubectl top` on the
  # mine-bringer cluster showed steady-state usage of ~22Mi -- 768Mi was
  # ~35x that. Halved rather than sized to the snapshot, since this is an
  # event-driven workload that can spike under a burst of upstream changes.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 384Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # -- Merged over the chart-wide pod securityContext defaults
  # (runAsNonRoot: true, seccompProfile: RuntimeDefault).
  podSecurityContext: {}

# ---------------------------------------------------------------------------
# Cold archive (crates/aggregator/src/archive.rs) -- OPTIONAL
# ---------------------------------------------------------------------------
# "Archive, then delete" for the aggregator's retention prunes: rows about to
# be pruned are first written to S3-compatible object storage as
# zstd-compressed JSON Lines, and deleted only once their objects are
# confirmed written. See docs/cold-archive.md for the object layout and how
# to read an archive offline (the app itself never reads it back).
#
# DISABLED BY DEFAULT. With `enabled: false` no ARCHIVE_* env is rendered at
# all, none of the settings below are required, and pruning just deletes,
# exactly as before.
archive:
  enabled: false
  # -- Tables to archive before pruning (explicit opt-in). Supported:
  #   - trains  -> the trains row plus its cascaded train_movement_events and
  #                train_current_state rows, one object per table per batch
  #                under service_date=YYYY-MM-DD/.
  # Deliberately NOT archivable (the binary refuses to start if listed):
  # trust_event_backlog (its 1-day retention is a TRUST licensing
  # safeguard) and every LDBWS-derived table (line_status_history,
  # line_status_*_stats, line_coverage_*_stats, station_samples -- RDM's
  # 300-day ceiling applies to every copy).
  tables:
    - trains
  # -- What to do when an upload fails. `retain` (default): keep the rows,
  # roll the batch back and retry next retention cycle -- the table grows
  # past its window while storage is unreachable
  # (aggregator_archive_upload_failures_total counts these). `delete`:
  # delete the rows anyway, unarchived, as if archiving were disabled.
  failurePolicy: retain
  s3:
    # -- S3 endpoint URL, e.g. https://thoth.<tailnet>.ts.net. Empty means
    # AWS's own regional endpoint.
    endpoint: ""
    # -- Required when enabled.
    bucket: ""
    # -- Key prefix inside the bucket, e.g. distant-signal/archive.
    prefix: ""
    # -- Used for request signing; most non-AWS servers accept any value.
    region: us-east-1
    # -- Path-style addressing (https://endpoint/bucket/key), which most
    # non-AWS S3 servers need. false = virtual-hosted style.
    pathStyle: true
    # -- Permit a plain http:// endpoint.
    allowHttp: false
    # -- Required when enabled: a pre-existing Secret holding the access key
    # pair. The chart never renders the credentials itself.
    existingSecret: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key

# ---------------------------------------------------------------------------
# notifier (crates/notifier -- Web Push for pinned-line/tracked-train
# notifications). Same "no HTTP surface, replicas: 1" shape as aggregator
# above -- see notifier-deployment.yaml's own comment on why two replicas
# would double-send every push.
# ---------------------------------------------------------------------------
notifier:
  # -- /livez stall window (see workerHealth): one cycle can legitimately take tens of minutes while push endpoints time out (SVC-02).
  progressStallSecs: 3600
  image:
    repository: ghcr.io/fasterspeeding/distant-signal/notifier
    tag: ""
    # -- Content digest override. See api.image.digest's own comment above
    # for the full rationale; same shape here.
    digest: ""
    pullPolicy: IfNotPresent
  # -- Same "reasonable round number, not load-tested" posture as
  # aggregator.pollIntervalSecs.
  pollIntervalSecs: 60
  # -- Decision 5: how long a de-escalation/lateral notification is
  # suppressed after the last one sent to this user for this line.
  cooldownMinutes: 20
  # -- Decision 4: the delay, in minutes, at or above which a tracked
  # train's delay reading becomes notify-worthy.
  trainDelayThresholdMinutes: 15
  # -- How long a watermark proposal must age before being promoted into a
  # cursor's real last_processed_id -- see config.rs's own
  # cursor_grace_seconds doc.
  cursorGraceSeconds: 120
  # -- Task 17/18: cadence for the forwarding-queue poll, deliberately
  # faster than pollIntervalSecs above -- see config.rs's own comment on
  # why this is a judgment call, not a researched figure.
  forwardQueuePollIntervalSecs: 15
  # -- Station-skip check cadence (Task 9, §5.2) -- see config.rs's own
  # skip_check_poll_interval_secs doc.
  skipCheckPollIntervalSecs: 90
  # -- Recurring-journey materialization sweep cadence (spec §3.1) -- see
  # config.rs's own template_sweep_poll_interval_secs doc.
  templateSweepPollIntervalSecs: 3600
  # -- 'auto'-mode leg commit-check lead time, minutes (spec §3.2 addendum)
  # -- see config.rs's own auto_commit_lead_minutes doc.
  autoCommitLeadMinutes: 120
  # Web Push worker pool (services review SVC-02): cycles only decide and
  # enqueue; these workers send. See crates/notifier/src/push_queue.rs.
  push:
    # -- Notifications being sent at once (each fans out to all of that
    # user's subscriptions concurrently).
    workers: 8
    # -- Notifications waiting for a worker; beyond this new ones are
    # dropped (distant_signal_notifier_push_dropped_total) and re-decided
    # only if their source row is polled again.
    queueCapacity: 1024
    # -- At most this many of one user's notifications in flight, so one
    # user's slow or tarpitting endpoints can't take the whole pool.
    perUserInFlight: 2
    # -- At most this many of one user's notifications waiting.
    perUserQueued: 64
    # -- Delete a subscription after this many consecutive timeouts
    # (in-memory count, resets on restart). 404/410/401 are deleted at once.
    pruneAfterTimeouts: 3
    # -- On SIGTERM, seconds to let queued/in-flight pushes finish. Keep
    # below the pod's terminationGracePeriodSeconds (30).
    shutdownGraceSecs: 20
  vapid:
    # -- mailto: or https: contact, required by RFC 8292's VAPID "sub" claim.
    subject: ""
    # -- PEM EC private key / uncompressed base64url public key
    # (openssl ecparam -genkey -name prime256v1). Never auto-generated --
    # see secret.yaml's own comment on why this differs from
    # postgres-password/internal-token. The public key is also read by the
    # api Deployment (api.extraEnv-free, wired directly in
    # api-deployment.yaml) to serve GET /public/notifications/vapid-public-key.
    publicKey: ""
    privateKey: ""
    existingSecret: ""
    existingSecretPublicKeyKey: "vapid-public-key"
    existingSecretPrivateKeyKey: "vapid-private-key"
  logLevel: info
  extraEnv: []
  # Polls Postgres and signs web-push payloads. No caches, no batching
  # beyond one poll's worth of rows.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # -- Merged over the chart-wide pod securityContext defaults
  # (runAsNonRoot: true, seccompProfile: RuntimeDefault).
  podSecurityContext: {}

# ---------------------------------------------------------------------------
# redis (crates/enricher's trigger queue; crates/api publishes to it)
# ---------------------------------------------------------------------------
redis:
  enabled: true
  # -- Connection URL of an externally-managed Redis. Used ONLY when
  # `redis.enabled` is false, in which case it is required: setting
  # `redis.enabled: false` with this left empty aborts the render rather
  # than pointing api and enricher at an in-chart Service that was never
  # created. Same contract as `postgresql.enabled: false` +
  # `externalDatabase.*`.
  externalUrl: ""
  image:
    repository: redis
    tag: "7"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  persistence:
    # -- Attach a PersistentVolumeClaim, and run redis with `--appendonly
    # yes` (AOF persistence). When false, an emptyDir is used instead and
    # ALL DATA IS LOST when the pod is rescheduled -- ephemeral testing
    # only. Defaults to true (unlike a typical "disposable cache" Redis)
    # because this Redis is no longer just enricher's disposable
    # incident-text-changed trigger queue: it is also the sole transport
    # (via a Redis Stream, no replay source behind it) between
    # movement-relay and its trust-consumer/full-coverage-consumer
    # consumer groups. A 2026-09-04 production incident confirmed a
    # restart with no persistence wipes that stream and both consumer
    # groups outright -- see redis-deployment.yaml's own comment for the
    # full account.
    enabled: true
    # -- Requested volume size. Both streams are capped (movement-events
    # by movementRelay.streamMaxLen), so the AOF is bounded: its RDB base
    # file compresses the dataset about 4:1 (a ~105 MB base for ~400 MB in
    # memory, 2026-09-26), the incremental file grows to about the base's
    # size before a rewrite, and a rewrite briefly writes a new base
    # alongside the old one. At the default 1536mb maxmemory that can
    # reach 1-2 GB on disk, i.e. past this 1Gi. Many provisioners round
    # up or don't enforce the size (hostPath/local-path), but on a
    # StorageClass that enforces it, raise this (e.g. to 4Gi) -- a full
    # volume fails the AOF write and Redis refuses writes. If you raise
    # maxmemory further, raise this with it.
    size: 1Gi
    # -- StorageClass name. Empty means the cluster default.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    # -- Use a pre-existing PVC instead of a chart-rendered one.
    existingClaim: ""
  # -- Redis `maxmemory`, passed as `--maxmemory`. Empty or null leaves
  # Redis unbounded (its own default), so a runaway would be OOMKilled by
  # the container limit instead of refused.
  #
  # With `maxmemoryPolicy: noeviction` this turns "the pod is OOMKilled
  # mid-write" into "writes are refused": movement-relay's XADD gets an
  # OOM error, retains the Kafka record, pauses its partitions and retries
  # every 2s without committing (crates/movement-relay/src/main.rs
  # run_cycle, event_sink.rs), so Kafka holds the backlog and nothing is
  # dropped. On each refusal it also XTRIMs the stream to its cap (XTRIM
  # is allowed at maxmemory), so lowering movementRelay.streamMaxLen is
  # enough to recover. api's XADD to incident-text-changed fails the same
  # way; enricher's hourly sweep covers anything that missed.
  #
  # 1536mb (Redis units: mebibytes) is movementRelay.streamMaxLen's 1 GiB
  # budget plus 50% for larger-than-planned entries, the small
  # incident-text-changed stream and consumer-group PELs. Keep it at or
  # below ~65% of the memory limit (it is 60% of 2560Mi); see `resources`
  # for the arithmetic.
  maxmemory: 1536mb
  # -- Redis `maxmemory-policy`. Keep `noeviction`: every other policy
  # would evict whole stream keys (a stream is one key), i.e. delete
  # movement-events and all three consumer groups outright.
  maxmemoryPolicy: noeviction
  # -- RDB snapshot schedule, passed as `--save`. "" (the default)
  # disables RDB snapshots; null leaves the image's built-in schedule
  # (`3600 1 300 100 60 10000`).
  #
  # Disabled because AOF already covers durability and each snapshot is a
  # fork plus a full rewrite of the dataset. At movement-events' write
  # rate the `60 10000` point fires every ~2 minutes: in production
  # (2026-09-26) that was a fork and a ~105 MB dump.rdb write every 2
  # minutes, for a file nothing reads. When AOF is on, Redis loads the AOF
  # at startup and ignores dump.rdb entirely. The AOF itself (Redis 7
  # multi-part, `aof-use-rdb-preamble yes`) already has a compact RDB base
  # file, which is what gives a fast restart (~3.7s for ~400 MB in
  # production). AOF rewrites still fork, but only when the AOF has doubled
  # in size (`auto-aof-rewrite-percentage 100`), not every 2 minutes.
  save: ""
  # A trigger/queue store, not a cache. Sized for movement-events at its
  # cap, which is nearly all of the memory.
  #
  #   dataset at maxmemory (worst case):     1536 MiB
  #   x 1.06 fragmentation (measured):       ~1628 MiB RSS
  #   + AOF-rewrite copy-on-write, 25%:      +384 MiB  -> ~2012 MiB
  #   + process baseline, client buffers:    +~30 MiB  -> ~2042 MiB (~2.0 GiB)
  #   limit 2560Mi                           -> ~520 MiB (20%) spare
  #
  # Steady state is well under that: 1,048,576 entries at the 920 B/entry
  # measured in production is ~920 MiB used, ~975 MiB RSS, about 38% of
  # the limit. The 1536Mi request covers steady state plus a fork.
  #
  # The 25% copy-on-write figure is deliberately pessimistic. Measured
  # BGSAVE CoW in production was 1-2 MB, because stream writes append to
  # new nodes rather than dirtying old pages. But an AOF rewrite that
  # overlaps a burst, or transparent huge pages magnifying each dirtied
  # page to 2 MiB, can push it far higher, and CoW is exactly the part the
  # container limit sees that `maxmemory` does not.
  #
  # History: 128Mi/512Mi until 2026-09-26, when the stream at its old
  # 500,000-entry cap measured 392 MB used / 417 MB RSS -- ~90% of the
  # limit before any fork. Then 640Mi/1Gi with a 640mb maxmemory and a
  # 524,288-entry (~12h) cap, until the production values (1536mb,
  # 1536Mi/2560Mi, ~24h cap) were moved into the chart defaults the
  # same day.
  resources:
    requests:
      cpu: 50m
      memory: 1536Mi
    limits:
      memory: 2560Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # -- Merged over the chart-wide pod securityContext defaults
  # (runAsNonRoot: true, seccompProfile: RuntimeDefault) via the same
  # distant-signal.podSecurityContext helper every other non-postgres
  # workload here uses. runAsUser/runAsGroup are pinned here (unlike most
  # other callers of that helper, which leave this empty and rely on the
  # image's own numeric USER) because the official `redis` image runs as
  # root with no USER set at all -- confirmed 2026-09-03 by pulling this
  # exact repository:tag's manifest/config from Docker Hub's real registry
  # API: `redis:7`'s resolved digest (org.opencontainers.image.version
  # 7.4.11, debian/bookworm-slim base) has Config.User == null, which is
  # exactly what makes kubelet's runAsNonRoot admission check fail with
  # "container has runAsNonRoot and image will run as root" -- distinct
  # from the "non-numeric user, cannot verify" failure the chart's 12
  # custom Rust images hit before their own Dockerfiles pinned a numeric
  # USER. redis's own docker-entrypoint.sh drops root to a `redis` user via
  # gosu when started as root; 999 is that user's real uid/gid, confirmed
  # against docker-library/redis's own Dockerfile source for the exact
  # revision this digest was built from (debian/Dockerfile:
  # `groupadd -r -g 999 redis; useradd -r -g redis -u 999 redis`) -- the
  # same uid postgres:16 happens to use, verified independently rather
  # than assumed from that coincidence. Pinning both runAsUser AND
  # runAsGroup (not just runAsUser) skips the image's own root-to-999 gosu
  # step entirely, matching how postgres-statefulset.yaml's inline
  # equivalent already works.
  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999

# ---------------------------------------------------------------------------
# enricher (crates/enricher/src/config.rs)
# ---------------------------------------------------------------------------
enricher:
  # -- /livez stall window (see workerHealth): one incident's extraction is up to three LLM calls of llmRequestTimeoutSecs (300s) each.
  progressStallSecs: 1800
  image:
    repository: ghcr.io/fasterspeeding/distant-signal/enricher
    tag: ""
    # -- Content digest override. See api.image.digest's own comment above
    # for the full rationale; same shape here.
    digest: ""
    pullPolicy: IfNotPresent
  llm:
    baseUrl: ""
    model: ""
    # -- API key for the OpenAI-compatible endpoint. Empty is valid for
    # local servers that don't require one. Follows the chart's normal
    # secrets rule: an existingSecret takes priority; otherwise this
    # value (possibly empty) is rendered as-is -- never auto-generated,
    # since a random LLM API key is meaningless.
    apiKey: ""
    existingSecret: ""
    existingSecretApiKeyKey: llm-api-key
  # -- Per-request timeout for a single LLM call, in seconds. One incident
  # makes three sequential calls (primary, resolution-adversarial,
  # severity-adversarial), so the worst case for one incident is roughly
  # 3x this value. Raise this for a slow/remote endpoint. Behind a gateway
  # that cuts calls itself (e.g. a 504 at ~302 s), set it slightly above
  # the gateway's cutoff (e.g. 320) so the 504 is what gets reported.
  #
  # Raised from 120 to 300 (2026-08-21) after a live eval against a real
  # self-hosted endpoint (Ollama, qwen3.5:4b) measured single-call
  # latencies of 86-104s for the flat single-period case alone -- within
  # striking distance of the old 120s default, and multi-period payloads
  # push that further. See
  # docs/superpowers/specs/2026-08-21-multi-period-extraction-design.md.
  llmRequestTimeoutSecs: 300
  sweepIntervalSecs: 3600
  # -- How often (seconds) the reclaim loop checks the Redis Stream
  # consumer group's pending-entries list for entries stuck longer than
  # reclaimMinIdleSecs -- the debounced retry path for a request that
  # timed out, or a process that crashed between processing and acking.
  reclaimIntervalSecs: 60
  # -- How long (seconds) a pending entry must have sat unacked before
  # it's eligible for reclaim, i.e. the retry delay for a failed
  # extraction. An entry whose incident is still being processed is
  # skipped, however long it runs, so this is not a correctness bound.
  # Keeping it above the usual worst case (3 x llmRequestTimeoutSecs, more
  # with in-call retries) avoids needless claim-and-skip passes.
  reclaimMinIdleSecs: 1000
  logLevel: info
  # -- Extra env vars. The enricher's off-by-default settings (provider
  # policy: LLM_REASONING_EFFORT, LLM_MAX_TOKENS, LLM_MAX_IN_FLIGHT,
  # LLM_RATE_LIMIT_RETRIES, LLM_RATE_LIMIT_RETRY_SECS, LLM_GATEWAY_RETRIES;
  # and CARRY_FORWARD_SEMANTIC_NOOPS) are set here -- see the README.
  extraEnv: []
  # Reads one incident at a time off Redis and calls out to the LLM
  # over HTTP. Almost all of its wall-clock is waiting on that call, so
  # both numbers are small.
  #
  # Limit trimmed from 512Mi to 256Mi 2026-09-26: live `kubectl top` on the
  # mine-bringer cluster showed steady-state usage of ~6Mi -- 512Mi was
  # ~85x that. Halved rather than sized to the snapshot, since this is an
  # event-driven workload that can spike under a burst of incidents.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}

# ---------------------------------------------------------------------------
# trust-consumer (crates/trust-consumer/src/config.rs)
#
# Unlike every poller and unlike enricher, this is a persistent Kafka
# consumer with real connected/disconnected liveness semantics -- see
# templates/trust-consumer-deployment.yaml's probes.
# ---------------------------------------------------------------------------
trustConsumer:
  image:
    repository: ghcr.io/fasterspeeding/distant-signal/trust-consumer
    tag: ""
    # -- Content digest override. See api.image.digest's own comment above
    # for the full rationale; same shape here.
    digest: ""
    pullPolicy: IfNotPresent
  kafka:
    brokers: ""
    topic: ""
    consumerGroup: distant-signal-trust-consumer
    saslMechanism: ""
    # -- Consumer key/secret. Follows the chart's normal secrets rule: an
    # existingSecret takes priority; otherwise these values (possibly
    # empty pre-subscription) are rendered as-is -- never auto-generated,
    # a random Kafka credential is meaningless.
    saslUsername: ""
    saslPassword: ""
    existingSecret: ""
    existingSecretUsernameKey: kafka-sasl-username
    existingSecretPasswordKey: kafka-sasl-password
  # -- Read this service's OAuth2 credential from a pre-existing Secret
  # instead of the chart-rendered one.
  existingSecret: ""
  internalOauthUsername: ""
  internalOauthPassword: ""
  existingSecretInternalOauthUsernameKey: internal-oauth-username-trust-consumer
  existingSecretInternalOauthPasswordKey: internal-oauth-password-trust-consumer
  referenceReloadSecs: 60
  # -- How often trust-consumer reloads the live STANOX->CRS table from
  # api's /private/stanox-crs. Deliberately coarser than
  # referenceReloadSecs -- see
  # docs/superpowers/specs/2026-09-01-schedule-ingest-stanox-crs-table-design.md
  # Decision 4. UNRESEARCHED starting figure (see that design's Open
  # Questions #1).
  stanoxCrsReloadSecs: 3600
  retentionDays: 90
  healthPort: 8081
  # -- Liveness watchdog (PROGRESS_STALL_SECS): /healthz answers 503 "stalled"
  # once no consume-loop iteration has completed for this many seconds, so a
  # wedged loop is restarted by the liveness probe (after its own
  # failureThreshold * periodSeconds = 90s on top). See the binary's
  # --progress-stall-secs doc for how the default is sized.
  progressStallSecs: 300
  # -- Values-driven replica count, added specifically to support the
  # Deploy B cutover runbook's B1 step (stop trust-consumer's Kafka
  # connection cleanly, by scaling to 0 via `helm upgrade`, not an
  # out-of-band `kubectl scale` a later `helm upgrade` could silently
  # undo). See docs/superpowers/plans/2026-09-04-movement-relay-plan.md,
  # "Judgment calls," item 2.
  replicaCount: 1
  # -- Which MovementFeed transport this deployment uses: "redis-stream"
  # (the default: reads what movement-relay publishes, as production has
  # since Deploy B) or "kafka" (the legacy direct connection: no dead-letter
  # stream, no gap check, and a second RDM consumer group; PL-15a).
  movementFeed: redis-stream
  redisAutoclaimMinIdleSecs: 30
  redisGapCheckSecs: 60
  # -- Prometheus metrics port. New as of the movement-relay work
  # (crates/trust-consumer previously had no metrics listener at all) --
  # added so trust_consumer_stream_gap_detected_total (only meaningful
  # under movementFeed=redis-stream) has somewhere real to be scraped
  # from. Gated on the same top-level metrics.enabled toggle every other
  # workload in this chart already uses.
  metricsPort: 9095
  logLevel: info
  # -- Kill switch for the TRUST timestamp Europe/London-mislabelling
  # correction (crates/common/src/trust_timestamp.rs). The hypothesis this
  # correction applies is well-evidenced but NOT vendor-confirmed, and its
  # own plausibility guard can only catch under-correction, never
  # over-correction -- see crates/trust-consumer/src/config.rs's
  # trust_timestamp_correction_enabled doc comment for the full reasoning.
  # Default `true` (correction on, since this codebase is choosing to ship
  # it) -- same semantics/pattern as aggregator.fullCoverageEnabledDefault
  # below: an operator flips this to `false` to disable the correction
  # entirely, without a rebuild, the instant the correction itself becomes
  # the suspect (e.g. the upstream feed vendor silently fixes their bug).
  trustTimestampCorrectionEnabled: true
  extraEnv: []
  # The highest sustained message rate in the stack (the live TRUST
  # movement feed). Memory is librdkafka's own fetch buffers plus the
  # STANOX/CRS crosswalk it caches; CPU is per-message parsing, which
  # is why its request is one of the larger ones.
  #
  # Limit trimmed from 768Mi to 384Mi 2026-09-26: live `kubectl top` on the
  # mine-bringer cluster showed steady-state usage of ~7Mi -- 768Mi was
  # ~100x that. Halved rather than sized to the snapshot, since this is an
  # event-driven workload that can spike under a burst of movement events.
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 384Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}

# ---------------------------------------------------------------------------
# fullCoverageConsumer -- a second, independent Kafka consumer against the
# same RDM Train Movements feed trustConsumer reads, correlating every
# event against the FULL scheduled population of every shadow-computed
# line (docs/superpowers/specs/2026-09-04-option-b-live-consumer-design.md).
# SHADOW MODE ONLY -- see that design doc's binding condition: nothing
# reads this component's output into a real line's severity/DataQuality
# while every lines/*.toml entry's full_coverage_enabled stays false.
#
# Kafka connection settings (brokers/topic/saslMechanism/saslUsername/
# saslPassword/existingSecret*) are DELIBERATELY NOT repeated here --
# reused from trustConsumer.kafka.* above (same RDM connection, per
# Decision 1's "connection vs. group membership" reasoning). Only this
# component's own group id and everything else below is new.
# ---------------------------------------------------------------------------
fullCoverageConsumer:
  image:
    repository: ghcr.io/fasterspeeding/distant-signal/full-coverage-consumer
    tag: ""
    # -- Content digest override. See api.image.digest's own comment above
    # for the full rationale; same shape here.
    digest: ""
    pullPolicy: IfNotPresent
  kafka:
    consumerGroup: distant-signal-full-coverage-consumer
  # -- Read this service's OAuth2 credential from a pre-existing Secret
  # instead of the chart-rendered one.
  existingSecret: ""
  internalOauthUsername: ""
  internalOauthPassword: ""
  existingSecretInternalOauthUsernameKey: internal-oauth-username-full-coverage-consumer
  existingSecretInternalOauthPasswordKey: internal-oauth-password-full-coverage-consumer
  # -- Decision 4: comma-separated line ids to shadow-compute, or "*" for
  # every catalogued line with at least one tiploc. Does NOT gate whether
  # a line's stats are ever shown/escalated -- that's each line's own
  # full_coverage_enabled in lines/*.toml, untouched by this value.
  shadowLines: "*"
  populationReloadSecs: 300
  stanoxCrsReloadSecs: 3600
  statsWriteIntervalSecs: 60
  healthPort: 8082
  # -- Liveness watchdog (PROGRESS_STALL_SECS): /healthz answers 503 "stalled"
  # once no consume-loop iteration has completed for this many seconds, so a
  # wedged loop is restarted by the liveness probe (after its own
  # failureThreshold * periodSeconds = 90s on top). See the binary's
  # --progress-stall-secs doc for how the default is sized.
  progressStallSecs: 900
  metricsPort: 9093
  # -- Values-driven replica count -- symmetry with trustConsumer's own
  # knob (see that block's comment). Not load-bearing for the Deploy B B1
  # step itself (this component never held real Kafka group membership --
  # design doc Decision 6), but a consistent mental model for an operator
  # reading this file is worth the two extra lines.
  replicaCount: 1
  # -- See trustConsumer.movementFeed.
  movementFeed: redis-stream
  redisAutoclaimMinIdleSecs: 30
  redisGapCheckSecs: 60
  # -- Windowed full-coverage stats
  # (docs/superpowers/specs/2026-09-27-full-coverage-windowed-stats-design.md).
  # OFF by default: with enabled=false the consumer writes exactly the
  # legacy whole-day rows and posts no windows. Turn on only after api
  # (the /full-coverage-window-stats route and its migrations) and
  # schedule-reference (operator/train status on the population) are
  # deployed; aggregator.fullCoverageWindow.mode is a separate switch.
  windowedStats:
    enabled: false
    # -- W: the `recent` window covers trains due in the last W minutes.
    recentWindowMinutes: 60
    # -- Windows end this many minutes ago (feed lag p99 + write cadence).
    graceMinutes: 10
    # -- Feed health: fewer Activations than this in the last hour, or a
    # newest event older than feedStaleSecs, marks the write feed_stale
    # (no window from it may influence severity; no presumed cancellations).
    activationsMin: 20
    feedStaleSecs: 300
  logLevel: info
  extraEnv: []
  # Called out by the 2026-09-25 review as one of the two real leak/
  # spike risks in this chart: it holds PER-LINE population caches
  # (schedule_line_population) alongside the same movement feed
  # trust-consumer reads, so its footprint scales with the line
  # catalogue rather than staying flat. Sized with materially more
  # headroom than trust-consumer for exactly that reason.
  #
  # Measured 2026-09-27 (docs/full-coverage-consumer.md): startup peak RSS
  # 381,492 KB (~373 MiB) with a production-sized population (243 lines,
  # ~171k uid memberships per date) plus a startup replay of a full rail
  # day (1M stream entries). The 1Gi limit keeps well over 1.5x that peak.
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}

# ---------------------------------------------------------------------------
# trustBacklogConsumer (crates/trust-backlog-consumer) -- a third,
# independent Redis Streams consumer group on movement-events, retaining a
# short, catalogued-line-scoped backlog of real TRUST calling-point events
# for late-tracking pins. See
# docs/superpowers/plans/2026-09-05-trust-event-backlog-plan.md. Unlike
# fullCoverageConsumer, this crate is Redis-Streams-only (no legacy Kafka
# backend) -- no movementFeed/kafka.* block here.
# ---------------------------------------------------------------------------
trustBacklogConsumer:
  image:
    repository: ghcr.io/fasterspeeding/distant-signal/trust-backlog-consumer
    tag: ""
    # -- Content digest override. See api.image.digest's own comment above
    # for the full rationale; same shape here.
    digest: ""
    pullPolicy: IfNotPresent
  # -- Read this service's OAuth2 credential from a pre-existing Secret
  # instead of the chart-rendered one.
  existingSecret: ""
  internalOauthUsername: ""
  internalOauthPassword: ""
  existingSecretInternalOauthUsernameKey: internal-oauth-username-trust-backlog-consumer
  existingSecretInternalOauthPasswordKey: internal-oauth-password-trust-backlog-consumer
  stanoxCrsReloadSecs: 3600
  redisAutoclaimMinIdleSecs: 30
  redisGapCheckSecs: 60
  healthPort: 8083
  # -- Liveness watchdog (PROGRESS_STALL_SECS): /healthz answers 503 "stalled"
  # once no consume-loop iteration has completed for this many seconds, so a
  # wedged loop is restarted by the liveness probe (after its own
  # failureThreshold * periodSeconds = 90s on top). See the binary's
  # --progress-stall-secs doc for how the default is sized.
  progressStallSecs: 300
  metricsPort: 9096
  # -- A purely documentation-level flag: this plan's real retention
  # safeguard is aggregator.trustEventBacklogRetentionDays (above), a
  # Rust-level default of 1 with a loud startup/per-cycle warning above
  # that. This value is NOT wired to any gating logic in this chart or in
  # any crate -- it exists only so a human editing this file sees a
  # clearly named place documenting that a real licensing decision is
  # required before going beyond the 1-day default. See
  # docs/superpowers/plans/2026-09-05-trust-event-backlog-plan.md's own
  # "Scope decision: retention tier and the licensing safeguard" section.
  retentionDaysWarningAcknowledged: false
  logLevel: info
  # -- Kill switch for the TRUST timestamp Europe/London-mislabelling
  # correction, mirroring trustConsumer.trustTimestampCorrectionEnabled
  # exactly (same underlying crates/common/src/trust_timestamp.rs
  # correction, same default, same reasoning).
  trustTimestampCorrectionEnabled: true
  extraEnv: []
  # Drains a Redis list in bounded batches and POSTs them on. The
  # backlog itself lives in Redis, not in this process.
  #
  # Limit trimmed from 512Mi to 256Mi 2026-09-26: live `kubectl top` on the
  # mine-bringer cluster showed steady-state usage of ~8Mi -- 512Mi was
  # ~64x that. Halved rather than sized to the snapshot, since this is an
  # event-driven workload that can spike under a burst of backlog entries.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}

# ---------------------------------------------------------------------------
# movementRelay -- the sole real Kafka client against RDM's Train Movements
# product from Deploy B onward (docs/superpowers/specs/2026-09-04-movement-relay-design.md).
# Off by default: `movementRelay.enabled: false` means this Deployment does
# not render at all, and neither trustConsumer nor fullCoverageConsumer's
# production Kafka behavior changes until a human executes the Deploy B
# runbook (docs/superpowers/plans/2026-09-04-movement-relay-plan.md).
#
# Kafka connection settings here are DELIBERATELY SEPARATE from
# trustConsumer.kafka.* (unlike fullCoverageConsumer's own values block,
# which reuses trustConsumer.kafka.* by design) -- Decision 4's own B2 step
# describes the real credential as MOVING from trustConsumer.kafka.* to
# movementRelay.kafka.* during the cutover, which only makes sense if these
# are genuinely separate value paths an operator sets independently, not
# the same one two components both read.
# ---------------------------------------------------------------------------
movementRelay:
  enabled: false
  image:
    repository: ghcr.io/fasterspeeding/distant-signal/movement-relay
    tag: ""
    # -- Content digest override. See api.image.digest's own comment above
    # for the full rationale; same shape here.
    digest: ""
    pullPolicy: IfNotPresent
  kafka:
    brokers: ""
    topic: ""
    consumerGroup: ""
    saslMechanism: ""
    saslUsername: ""
    saslPassword: ""
    existingSecret: ""
    # -- NOT "kafka-sasl-username"/"kafka-sasl-password": those keys are
    # trustConsumer's own, in the SAME chart-rendered Secret whenever
    # movementRelay.kafka.existingSecret is left unset (the default
    # distant-signal.secretName is shared) -- reusing them here would read
    # trustConsumer's credential instead of movement-relay's own. See
    # secret.yaml's own comment on why these are separate data keys.
    existingSecretUsernameKey: movement-relay-kafka-sasl-username
    existingSecretPasswordKey: movement-relay-kafka-sasl-password
  streamLagPollSecs: 30
  # -- `MAXLEN ~` cap on the movement-events stream, in entries
  # (MOVEMENT_STREAM_MAXLEN). The default is a 1 GiB memory budget at a
  # planning figure of 1 KiB of Redis memory per entry (920 B measured in
  # production). At the ~1M entries/day measured on 2026-09-26 that is
  # about 24h of traffic. (movement-relay's own built-in default,
  # crates/movement-relay/src/config.rs, is still the older 524,288 /
  # ~12h; the chart always sets this env var, so that only applies
  # outside Helm.) It is the ONLY replay window
  # trust-consumer, full-coverage-consumer and trust-backlog-consumer have:
  # RDM issues one Kafka group, which movement-relay holds, so a
  # downstream consumer that is down for longer than this loses the gap
  # for good (detected and logged by check_gap, not recovered).
  #
  # This and redis.maxmemory / redis.resources move together: every extra
  # 100,000 entries needs ~100 MiB more `maxmemory` and ~130 MiB more
  # memory limit. Minimum 1000.
  streamMaxLen: 1048576
  healthPort: 8083
  metricsPort: 9094
  logLevel: info
  extraEnv: []
  # A pure Kafka -> Redis-stream passthrough: one message in flight
  # plus librdkafka's fetch buffers.
  #
  # Limit trimmed from 384Mi to 192Mi 2026-09-26: live `kubectl top` on the
  # mine-bringer cluster showed steady-state usage of ~7Mi -- 384Mi was
  # ~55x that. Halved rather than sized to the snapshot, since this is an
  # event-driven workload that can spike under a burst of movement events.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 192Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}

# ---------------------------------------------------------------------------
# pollerIrishRailGtfs (crates/poller-irish-rail-gtfs/src/config.rs: Config)
# -- Tier A of docs/superpowers/specs/2026-09-05-ireland-rail-support-design.md.
# Gets its own bespoke Deployment template, not a new entry in the generic
# `.Values.pollers` map -- that map's own template unconditionally renders
# an RDM-style API-key Secret reference, which this crate has no use for
# (the GTFS feed is a plain anonymous HTTPS GET, no key, no sign-up). See
# docs/superpowers/plans/2026-09-05-ireland-rail-support-plan.md's Judgment
# Call #2.
# ---------------------------------------------------------------------------
pollerIrishRailGtfs:
  # -- /livez stall window (see workerHealth): one GTFS download plus up to 15 minutes of ingest-POST retries.
  progressStallSecs: 1800
  enabled: false
  image:
    repository: ghcr.io/fasterspeeding/distant-signal/poller-irish-rail-gtfs
    tag: ""
    # -- Content digest override. See api.image.digest's own comment above
    # for the full rationale; same shape here.
    digest: ""
    pullPolicy: IfNotPresent
  # -- Transport for Ireland's public GTFS zip for Iarnrod Eireann -- real,
  # key-free, confirmed reachable directly
  # (docs/superpowers/specs/2026-09-05-ireland-vs-northern-ireland-friction-research.md
  # section 1), unlike every RDM poller's own baseUrl. Overridable in case
  # the feed ever moves.
  gtfsUrl: "https://www.transportforireland.ie/transitData/Data/GTFS_Irish_Rail.zip"
  apiStationsIngestPath: /private/island-of-ireland-stations
  apiLinesIngestPath: /private/island-of-ireland-lines
  # -- No confirmed real refresh cadence for this feed; defaults to the
  # same 24h convention pollers.stations/pollers.tocs already use for
  # reference data with an unconfirmed cadence.
  pollIntervalSecs: 86400
  # -- No API key needed at all (unlike every RDM poller) -- see this
  # chart's own Judgment Call #2 in
  # docs/superpowers/plans/2026-09-05-ireland-rail-support-plan.md.
  internalOauthUsername: ""
  internalOauthPassword: ""
  existingSecret: ""
  existingSecretInternalOauthUsernameKey: internal-oauth-username-poller-irish-rail-gtfs
  existingSecretInternalOauthPasswordKey: internal-oauth-password-poller-irish-rail-gtfs
  logLevel: info
  metricsPort: 9091
  extraEnv: []
  # Downloads the Irish Rail GTFS zip and expands it to build the
  # station/line ingest bodies -- a whole archive in memory, so an
  # order of magnitude above the JSON/XML pollers above.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podSecurityContext: {}


# A filled-in "real deployment" example. Render it with:
#
#   helm template distant-signal ./charts/distant-signal -f charts/distant-signal/values-example.yaml
#
# Every RDM base URL below is still a placeholder host -- as of this chart's
# writing no confirmed Rail Data Marketplace endpoint exists for any of the
# four feeds (see .env.example in the repository root). Replace them, and the
# API keys, with real values before installing this for real.

imagePullSecrets:
  - name: registry-creds

api:
  image:
    repository: registry.example.com/distant-signal/api
    tag: "0.1.0"
  replicaCount: 2
  logLevel: info
  # Required -- the api will not render, let alone start, without these.
  # Note redirectUrl points at the FRONTEND host (status.example.com, the
  # same host the ingress section below publishes), not at the api: the
  # session cookie the callback sets must be scoped to the origin the
  # browser uses for everything else.
  sso:
    issuerUrl: https://sso.example.com/realms/rail
    clientId: distant-signal
    # Prefer an existingSecret in a real deployment (External Secrets
    # Operator, Vault, SOPS) over an inline value in a values file:
    #   existingSecret: distant-signal-sso
    clientSecret: replace-with-your-oidc-client-secret
    redirectUrl: https://status.example.com/api/auth/callback
    postLoginRedirectUrl: https://status.example.com/
  sessionTtlDays: 14
  # Internal-service OAuth2 (machine-to-machine, distinct from sso above):
  # every real internal caller authenticates to /private/* with its own
  # Authentik service-account credential -- see internalOauth below and
  # each poller's own internalOauthUsername/Password.
  internalOauth:
    issuerUrl: https://sso.example.com/application/o/distant-signal-internal/
    clientId: distant-signal-internal
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

aggregator:
  image:
    repository: registry.example.com/distant-signal/aggregator
    tag: "0.1.0"
  pollIntervalSecs: 60
  historyRetentionDays: 30
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# The bundled Redis is deliberately left at its defaults (`enabled: true`,
# `persistence.enabled: true`). It backs two Redis Streams: enricher's
# incident-text-changed (losing it costs nothing but promptness, since
# enricher's hourly sweep re-finds anything a dropped event would have
# triggered) and movement-relay's movement-events (the sole transport to
# its consumer groups, no replay source behind it -- see README.md's "Using
# an external Redis" for the incident that made persistence the default
# here). Set `redis.enabled: false` together with `redis.externalUrl` to
# point at a managed instance instead.

enricher:
  image:
    repository: registry.example.com/distant-signal/enricher
    tag: "0.1.0"
  llm:
    # Both of these are REQUIRED -- leaving either empty aborts the render
    # (see templates/enricher-deployment.yaml). Any OpenAI-compatible
    # chat-completions endpoint works, including a self-hosted one.
    baseUrl: https://llm.example.com/v1
    model: replace-me-model-name
    # Empty is valid for a local endpoint that requires no auth.
    apiKey: replace-me-llm-api-key
  sweepIntervalSecs: 3600
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

frontend:
  image:
    repository: registry.example.com/distant-signal/frontend
    tag: "0.1.0"
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

postgresql:
  enabled: true
  auth:
    username: distant_signal
    database: distant_signal
    # Left empty on purpose: generated on first install and preserved across
    # upgrades. Set `existingSecret` instead if an external secret manager
    # owns this credential.
    password: ""
  persistence:
    enabled: true
    size: 20Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

# Shared, non-secret OAuth2 client-credentials config every real caller
# below (the 5 pollers here, plus trust-consumer/schedule-ingest/
# schedule-reference if enabled) uses to obtain its own access token. Must
# match api.internalOauth.clientId above.
internalOauth:
  tokenUrl: https://sso.example.com/application/o/token/
  clientId: distant-signal-internal
  scope: groups

pollers:
  incidents:
    enabled: true
    image:
      repository: registry.example.com/distant-signal/poller-incidents
      tag: "0.1.0"
    baseUrl: https://rdm.example.com/incidents
    apiKey: replace-me-rdm-incidents-key
    pollIntervalSecs: 300
    internalOauthUsername: svc-poller-incidents
    internalOauthPassword: replace-me-poller-incidents-app-password
  stations:
    enabled: true
    image:
      repository: registry.example.com/distant-signal/poller-stations
      tag: "0.1.0"
    baseUrl: https://rdm.example.com/json/1.0
    apiKey: replace-me-rdm-stations-key
    pollIntervalSecs: 86400
    internalOauthUsername: svc-poller-stations
    internalOauthPassword: replace-me-poller-stations-app-password
  tocs:
    enabled: true
    image:
      repository: registry.example.com/distant-signal/poller-tocs
      tag: "0.1.0"
    baseUrl: https://rdm.example.com/tocs
    apiKey: replace-me-rdm-tocs-key
    pollIntervalSecs: 86400
    internalOauthUsername: svc-poller-tocs
    internalOauthPassword: replace-me-poller-tocs-app-password
  ldbws:
    enabled: true
    image:
      repository: registry.example.com/distant-signal/poller-ldbws
      tag: "0.1.0"
    baseUrl: https://rdm.example.com/LDBWS/api/20220120
    apiKey: replace-me-rdm-ldbws-key
    numRows: 10
    pollIntervalSecs: 60
    internalOauthUsername: svc-poller-ldbws
    internalOauthPassword: replace-me-poller-ldbws-app-password
  tfl:
    enabled: true
    image:
      repository: registry.example.com/distant-signal/poller-tfl
      tag: "0.1.0"
    # No `baseUrl` override here, unlike the RDM pollers above: TfL's
    # Unified API is a real, public, documented endpoint, so
    # `values.yaml`'s default (`https://api.tfl.gov.uk`) is already correct.
    apiKey: replace-me-tfl-app-key
    pollIntervalSecs: 300
    internalOauthUsername: svc-poller-tfl
    internalOauthPassword: replace-me-poller-tfl-app-password

# Exercises the poller-irish-rail-gtfs Deployment/PodMonitor/Secret
# templates' enabled=true render path in CI (helm-lint job's
# "values-example.yaml" step) -- see
# docs/superpowers/plans/2026-09-05-ireland-rail-support-plan.md Task A5.
# No apiKey field, unlike the RDM pollers above: this feed needs none.
pollerIrishRailGtfs:
  enabled: true
  internalOauthUsername: svc-poller-irish-rail-gtfs
  internalOauthPassword: replace-me-poller-irish-rail-gtfs-app-password

metrics:
  podMonitor:
    # Exercises the PodMonitor template's enabled=true render path in CI
    # (helm-lint job's "values-example.yaml" step) -- see
    # docs/superpowers/plans/2026-09-05-status-observability-grafana-plan.md
    # Task 2. helm template doesn't validate against a live API server, so
    # this renders and type-checks the object without needing the
    # monitoring.coreos.com CRDs installed anywhere in CI.
    enabled: true

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  frontend:
    enabled: true
    host: status.example.com
  api:
    # Left off deliberately: enabling it publishes /private/*, which is
    # guarded only by internal-service OAuth2 (require_internal_oauth).
    enabled: false
    host: ""
  tls:
    - secretName: distant-signal-tls
      hosts:
        - status.example.com

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx

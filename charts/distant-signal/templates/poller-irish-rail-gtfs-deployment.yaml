{{- if .Values.pollerIrishRailGtfs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-poller-irish-rail-gtfs" (include "distant-signal.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "poller-irish-rail-gtfs") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "poller-irish-rail-gtfs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.podLabels" (dict "root" . "component" "poller-irish-rail-gtfs") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.pollerIrishRailGtfs.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.pollerIrishRailGtfs.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.pollerIrishRailGtfs.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.pollerIrishRailGtfs.podSecurityContext) | nindent 8 }}
      containers:
        - name: poller-irish-rail-gtfs
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.pollerIrishRailGtfs.image) | quote }}
          imagePullPolicy: {{ .Values.pollerIrishRailGtfs.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          # SVC-08/INF-9: /livez restarts a wedged poll loop. Liveness only:
          # nothing routes traffic to a poller.
          {{- include "distant-signal.workerHealthProbes" (dict "root" . "port" .Values.workerHealth.port) | nindent 10 }}
          ports:
            - name: health
              containerPort: {{ .Values.workerHealth.port }}
              protocol: TCP
          {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.pollerIrishRailGtfs.metricsPort }}
              protocol: TCP
          {{- end }}
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.pollerIrishRailGtfsEnv" .) "extra" .Values.pollerIrishRailGtfs.extraEnv) | trim | nindent 12 }}
          {{- with .Values.pollerIrishRailGtfs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.pollerIrishRailGtfs.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pollerIrishRailGtfs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pollerIrishRailGtfs.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- /*
This container's own env entries. distant-signal.mergeEnv renders them
with pollerIrishRailGtfs.extraEnv, which replaces an entry of the same name.
*/ -}}
{{- define "distant-signal.pollerIrishRailGtfsEnv" }}
            - name: GTFS_URL
              value: {{ .Values.pollerIrishRailGtfs.gtfsUrl | quote }}
            # Ingest plan 3c.2 (decision D8): the only sink is the
            # ds:ingest:island-of-ireland stream (the ingest-writer applies
            # it with ingestWriter.streams.island-of-ireland), as the
            # poller-irish-rail-gtfs ACL user with redis.acl.clients.pollerIrishRailGtfs.
            - name: INGEST_SINK
              value: "stream"
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" . | quote }}
            {{- include "distant-signal.redisClientAuthEnv" (dict "root" . "client" "pollerIrishRailGtfs" "user" "poller-irish-rail-gtfs") }}
            - name: POLL_INTERVAL_SECS
              value: {{ .Values.pollerIrishRailGtfs.pollIntervalSecs | quote }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.pollerIrishRailGtfs.metricsPort | quote }}
            {{- end }}
            # /livez + /healthz listener (SVC-08/INF-9) -- see workerHealth.
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.workerHealth.port) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ .Values.pollerIrishRailGtfs.progressStallSecs | quote }}
            - name: RUST_LOG
              value: {{ .Values.pollerIrishRailGtfs.logLevel | quote }}
            - name: FEED_MAX_DROP_FRACTION
              value: {{ .Values.pollerIrishRailGtfs.feedMaxDropFraction | quote }}
{{- end }}

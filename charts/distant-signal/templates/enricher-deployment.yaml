{{/*
Fail-fast on an unusable LLM config, same pattern as poller-deployments.yaml's
empty-baseUrl guard. Unlike the pollers, the enricher has no `enabled` toggle
and renders unconditionally, so the guard is unconditional too.

Both values are plain `String` fields on crates/enricher/src/config.rs's clap
Config, not Options -- an empty string parses fine, so the pod would boot and
then fail every single extraction request forever with nothing but log noise
to show for it.
*/}}
{{- $anthropic := include "distant-signal.enricherAnthropic" . }}
{{- $batch := .Values.enricher.llm.batch | default dict }}
{{- $sweepMode := $batch.sweepMode | default "sync" }}
{{- if not (has $sweepMode (list "sync" "batch")) }}
{{- fail (printf "enricher.llm.batch.sweepMode=%q is not one of sync, batch." $sweepMode) }}
{{- end }}
{{- $authMode := .Values.enricher.llm.auth | default "apiKey" }}
{{- if $anthropic }}
{{- /* The Claude API (enricher.llm.provider=anthropic): its own base URL,
model and key Secret, or keyless with anthropicWifAuthentik. */}}
{{- $claude := .Values.enricher.llm.anthropic }}
{{- if not (has $authMode (list "apiKey" "anthropicWifAuthentik")) }}
{{- fail "enricher.llm.provider=anthropic supports enricher.llm.auth=apiKey or anthropicWifAuthentik: the openai* modes mint OpenAI tokens." }}
{{- end }}
{{- if not $claude.baseUrl }}
{{- fail "enricher.llm.anthropic.baseUrl is empty (the default is https://api.anthropic.com/v1)." }}
{{- end }}
{{- if not $claude.model }}
{{- fail "enricher.llm.anthropic.model is empty (e.g. claude-haiku-5-5)." }}
{{- end }}
{{- if and (eq $authMode "apiKey") (not $claude.existingSecret) }}
{{- fail "enricher.llm.provider=anthropic needs enricher.llm.anthropic.existingSecret: a Secret holding the Claude API key under enricher.llm.anthropic.existingSecretApiKeyKey (kubectl create secret generic enricher-anthropic --from-literal=anthropic-api-key=...), or enricher.llm.auth=anthropicWifAuthentik." }}
{{- end }}
{{- if and (eq $authMode "anthropicWifAuthentik") $claude.existingSecret }}
{{- fail "enricher.llm.auth=anthropicWifAuthentik is keyless: unset enricher.llm.anthropic.existingSecret." }}
{{- end }}
{{- if not (has ($claude.promptCache | default "1h") (list "1h" "5m" "off")) }}
{{- fail (printf "enricher.llm.anthropic.promptCache=%q is not one of 1h, 5m, off." $claude.promptCache) }}
{{- end }}
{{- else }}
{{- if eq $authMode "anthropicWifAuthentik" }}
{{- fail "enricher.llm.auth=anthropicWifAuthentik mints Claude API tokens: it needs enricher.llm.provider=anthropic." }}
{{- end }}
{{- if eq $sweepMode "batch" }}
{{- fail "enricher.llm.batch.sweepMode=batch needs enricher.llm.provider=anthropic: the enricher has no OpenAI Batch API support." }}
{{- end }}
{{- if not .Values.enricher.llm.baseUrl }}
{{- fail "enricher.llm.baseUrl is empty. Set it to the base URL of an OpenAI-compatible chat-completions endpoint (e.g. --set enricher.llm.baseUrl=http://vllm.internal:8000/v1). An empty value would deploy an enricher that fails every extraction request." }}
{{- end }}
{{- if not .Values.enricher.llm.model }}
{{- fail "enricher.llm.model is empty. Set it to a model name the endpoint at enricher.llm.baseUrl serves (e.g. --set enricher.llm.model=gpt-4o-mini). An empty value would deploy an enricher that fails every extraction request." }}
{{- end }}
{{- end }}
{{- /*
Workload identity federation (enricher.llm.auth, docs/enricher-openai.md
"Keyless auth"): refuse to render a mode the enricher would reject at
startup, or one whose trust rule could match more than this pod.
*/}}
{{- $wif := include "distant-signal.enricherWif" . }}
{{- if $wif }}
{{- $llm := .Values.enricher.llm }}
{{- $wi := $llm.workloadIdentity }}
{{- $sa := .Values.enricher.serviceAccount | default dict }}
{{- if or (not (or $sa.create $sa.name)) (eq (include "distant-signal.enricherServiceAccountName" .) (include "distant-signal.serviceAccountName" .)) }}
{{- fail (printf "enricher.llm.auth=%s needs a dedicated ServiceAccount: set enricher.serviceAccount.create=true (or enricher.serviceAccount.name to an existing account other than the shared %q). A trust rule on the shared account would let every pod in the release mint OpenAI tokens." $llm.auth (include "distant-signal.serviceAccountName" .)) }}
{{- end }}
{{- if or $llm.apiKey $llm.existingSecret }}
{{- fail (printf "enricher.llm.auth=%s is keyless: unset enricher.llm.apiKey and enricher.llm.existingSecret." $llm.auth) }}
{{- end }}
{{- if eq $llm.auth "anthropicWifAuthentik" }}
{{- $wa := $wi.anthropic | default dict }}
{{- range $key, $what := dict "organizationId" "the Claude organization UUID" "serviceAccountId" "the Claude service account ID, svac_..." "federationRuleId" "the Claude federation rule ID, fdrl_..." "tokenExchangeUrl" "the Claude token endpoint" }}
{{- if not (get $wa $key) }}
{{- fail (printf "enricher.llm.auth=anthropicWifAuthentik needs enricher.llm.workloadIdentity.anthropic.%s (%s)." $key $what) }}
{{- end }}
{{- end }}
{{- else }}
{{- if not $wi.identityProviderId }}
{{- fail (printf "enricher.llm.auth=%s needs enricher.llm.workloadIdentity.identityProviderId (the OpenAI Workload Identity Provider ID)." $llm.auth) }}
{{- end }}
{{- if not $wi.serviceAccountId }}
{{- fail (printf "enricher.llm.auth=%s needs enricher.llm.workloadIdentity.serviceAccountId (the OpenAI service account ID)." $llm.auth) }}
{{- end }}
{{- if not $wi.tokenExchangeUrl }}
{{- fail (printf "enricher.llm.auth=%s needs enricher.llm.workloadIdentity.tokenExchangeUrl." $llm.auth) }}
{{- end }}
{{- end }}
{{- if include "distant-signal.enricherWifAuthentik" . }}
{{- if not $wi.authentik.tokenUrl }}
{{- fail (printf "enricher.llm.auth=%s needs enricher.llm.workloadIdentity.authentik.tokenUrl (e.g. https://sso.example.com/application/o/token/)." $llm.auth) }}
{{- end }}
{{- if not $wi.authentik.clientId }}
{{- fail (printf "enricher.llm.auth=%s needs enricher.llm.workloadIdentity.authentik.clientId." $llm.auth) }}
{{- end }}
{{- else if not $wi.tokenAudience }}
{{- fail "enricher.llm.auth=openaiWifKubernetes needs enricher.llm.workloadIdentity.tokenAudience: the audience configured on the OpenAI Workload Identity Provider." }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-enricher" (include "distant-signal.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "enricher") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "enricher") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.podLabels" (dict "root" . "component" "enricher") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.enricher.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.enricher.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.enricherServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.enricher.podSecurityContext) | nindent 8 }}
      containers:
        - name: enricher
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.enricher.image) | quote }}
          imagePullPolicy: {{ .Values.enricher.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          # SVC-08/INF-9/INF-5: /livez restarts a wedged stream loop; /healthz
          # keeps the pod NotReady until Postgres and Redis are both up.
          {{- include "distant-signal.workerHealthProbes" (dict "root" . "port" .Values.workerHealth.port "readiness" true) | nindent 10 }}
          ports:
            - name: health
              containerPort: {{ .Values.workerHealth.port }}
              protocol: TCP
          {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.enricherEnv" .) "extra" .Values.enricher.extraEnv) | trim | nindent 12 }}
          {{- with .Values.enricher.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $wif }}
          volumeMounts:
            - name: {{ ternary "llm-identity-token" "openai-identity-token" (eq .Values.enricher.llm.auth "anthropicWifAuthentik") }}
              mountPath: {{ include "distant-signal.enricherIdentityTokenDir" . }}
              readOnly: true
          {{- end }}
      {{- if $wif }}
      # The workload identity token (enricher.llm.auth): ONLY an
      # audience-bound service-account token, rotated by the kubelet. No
      # ca.crt or namespace, so it is no use against the Kubernetes API (and
      # no RBAC binds the account anyway).
      volumes:
        - name: {{ ternary "llm-identity-token" "openai-identity-token" (eq .Values.enricher.llm.auth "anthropicWifAuthentik") }}
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ include "distant-signal.enricherTokenAudience" . | quote }}
                  expirationSeconds: 3600
      {{- end }}
      {{- with .Values.enricher.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.enricher.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.enricher.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- /*
This container's own env entries. distant-signal.mergeEnv renders them
with enricher.extraEnv, which replaces an entry of the same name.
*/ -}}
{{- define "distant-signal.enricherEnv" }}
            {{- include "distant-signal.databaseEnvFor" (dict "root" . "service" "enricher") | nindent 12 }}
            # Always rendered, unlike the port env var below: this is
            # the Rust-side toggle that actually stops the binary from
            # starting its /metrics listener (`metrics_enabled` in
            # crates/enricher/src/config.rs). Omitting the port/env/annotations
            # alone would not -- Kubernetes container ports are purely
            # declarative -- so this must render "false" too, not vanish.
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" . | quote }}
            {{- include "distant-signal.redisClientAuthEnv" (dict "root" . "client" "enricher" "user" "enricher") }}
            {{- if include "distant-signal.enricherAnthropic" . }}
            {{- $claude := .Values.enricher.llm.anthropic }}
            {{- $batch := .Values.enricher.llm.batch | default dict }}
            # The Claude API (enricher.llm.provider, docs/enricher-anthropic.md).
            - name: LLM_PROVIDER
              value: "anthropic"
            - name: LLM_BASE_URL
              value: {{ $claude.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ $claude.model | quote }}
            {{- if not (include "distant-signal.enricherWif" .) }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $claude.existingSecret }}
                  key: {{ $claude.existingSecretApiKeyKey | default "anthropic-api-key" }}
            {{- end }}
            - name: LLM_PROMPT_CACHE
              value: {{ $claude.promptCache | default "1h" | quote }}
            {{- with $claude.thinking }}
            - name: LLM_THINKING
              value: {{ . | quote }}
            {{- end }}
            {{- if eq ($batch.sweepMode | default "sync") "batch" }}
            - name: LLM_SWEEP_MODE
              value: "batch"
            - name: LLM_BATCH_MIN_ITEMS
              value: {{ $batch.minItems | default 20 | quote }}
            - name: LLM_BATCH_MAX_ITEMS
              value: {{ $batch.maxItems | default 2000 | quote }}
            - name: LLM_BATCH_POLL_SECS
              value: {{ $batch.pollIntervalSecs | default 60 | quote }}
            {{- end }}
            {{- else }}
            - name: LLM_BASE_URL
              value: {{ .Values.enricher.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.enricher.llm.model | quote }}
            {{- end }}
            {{- if eq (.Values.enricher.llm.auth | default "apiKey") "anthropicWifAuthentik" }}
            {{- $wi := .Values.enricher.llm.workloadIdentity }}
            # Keyless Claude auth (docs/enricher-anthropic.md, "Keyless auth"):
            # no API key env or Secret at all.
            - name: LLM_AUTH
              value: "anthropic-wif-authentik"
            - name: ANTHROPIC_FEDERATION_RULE_ID
              value: {{ $wi.anthropic.federationRuleId | quote }}
            - name: ANTHROPIC_ORGANIZATION_ID
              value: {{ $wi.anthropic.organizationId | quote }}
            - name: ANTHROPIC_SERVICE_ACCOUNT_ID
              value: {{ $wi.anthropic.serviceAccountId | quote }}
            {{- with $wi.anthropic.workspaceId }}
            - name: ANTHROPIC_WORKSPACE_ID
              value: {{ . | quote }}
            {{- end }}
            - name: LLM_IDENTITY_TOKEN_FILE
              value: {{ printf "%s/token" (include "distant-signal.enricherIdentityTokenDir" .) | quote }}
            - name: LLM_TOKEN_EXCHANGE_URL
              value: {{ $wi.anthropic.tokenExchangeUrl | quote }}
            - name: LLM_AUTHENTIK_TOKEN_URL
              value: {{ $wi.authentik.tokenUrl | quote }}
            - name: LLM_AUTHENTIK_CLIENT_ID
              value: {{ $wi.authentik.clientId | quote }}
            {{- with $wi.authentik.scope }}
            - name: LLM_AUTHENTIK_SCOPE
              value: {{ . | quote }}
            {{- end }}
            {{- else if include "distant-signal.enricherAnthropic" . }}
            {{- /* The Claude key is above; no LLM_AUTH (api-key). */}}
            {{- else if include "distant-signal.enricherWif" . }}
            {{- $wi := .Values.enricher.llm.workloadIdentity }}
            # Keyless (enricher.llm.auth): no API key env or Secret at all.
            - name: LLM_AUTH
              value: {{ ternary "openai-wif-authentik" "openai-wif-kubernetes" (eq .Values.enricher.llm.auth "openaiWifAuthentik") | quote }}
            - name: OPENAI_IDENTITY_PROVIDER_ID
              value: {{ $wi.identityProviderId | quote }}
            - name: OPENAI_SERVICE_ACCOUNT_ID
              value: {{ $wi.serviceAccountId | quote }}
            - name: LLM_IDENTITY_TOKEN_FILE
              value: "/var/run/secrets/openai/token"
            - name: LLM_TOKEN_EXCHANGE_URL
              value: {{ $wi.tokenExchangeUrl | quote }}
            {{- if eq .Values.enricher.llm.auth "openaiWifAuthentik" }}
            - name: LLM_AUTHENTIK_TOKEN_URL
              value: {{ $wi.authentik.tokenUrl | quote }}
            - name: LLM_AUTHENTIK_CLIENT_ID
              value: {{ $wi.authentik.clientId | quote }}
            {{- with $wi.authentik.scope }}
            - name: LLM_AUTHENTIK_SCOPE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- else }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "distant-signal.secretName" .) .Values.enricher.llm.existingSecret }}
                  key: {{ .Values.enricher.llm.existingSecretApiKeyKey }}
            {{- end }}
            {{- with .Values.enricher.llm.reasoningEffort }}
            - name: LLM_REASONING_EFFORT
              value: {{ . | quote }}
            {{- end }}
            - name: LLM_REQUEST_TIMEOUT_SECS
              value: {{ .Values.enricher.llmRequestTimeoutSecs | quote }}
            - name: SWEEP_INTERVAL_SECS
              value: {{ .Values.enricher.sweepIntervalSecs | quote }}
            - name: RECLAIM_INTERVAL_SECS
              value: {{ .Values.enricher.reclaimIntervalSecs | quote }}
            - name: RECLAIM_MIN_IDLE_SECS
              value: {{ .Values.enricher.reclaimMinIdleSecs | quote }}
            # /livez + /healthz listener (SVC-08/INF-9) -- see workerHealth.
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.workerHealth.port) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ .Values.enricher.progressStallSecs | quote }}
            - name: RUST_LOG
              value: {{ .Values.enricher.logLevel | quote }}
{{- end }}

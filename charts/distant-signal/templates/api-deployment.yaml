{{/*
Fail-fast on an unusable SSO config -- same pattern as before, EXCEPT an
empty api.sso.* value is no longer automatically fatal when
devAuthentik.enabled: true. In that case the value is computed instead,
from devAuthentik.* and the fixed blueprint-provisioned client id/secret
(charts/distant-signal/templates/_helpers.tpl's distant-signal.devAuthentik* helpers)
-- see docs/superpowers/specs/2026-08-29-dev-oidc-server-design.md's Helm
chart support section. An operator's explicit api.sso.* value ALWAYS wins
over the computed default; devAuthentik never overrides one.

When no value is available from either source, refusing to render is still
strictly better than rendering an empty one. crates/api/src/data/config.rs
declares all five SSO_* fields with `#[arg(long, env)]` and NO default, so
an api container missing any of them never gets as far as `main` -- clap
exits with "the following required arguments were not provided" and the pod
CrashLoopBackOffs. An empty-string value is worse still: it satisfies clap,
then fails either the `ensure!(!config.sso_client_secret.is_empty())` in
AppState::init or `IssuerUrl::new("")` immediately after, with the same
outcome and a less obvious cause.
*/}}
{{- $issuerUrl := .Values.api.sso.issuerUrl | default (and .Values.devAuthentik.enabled (include "distant-signal.devAuthentikIssuerUrl" .)) -}}
{{- $clientId := .Values.api.sso.clientId | default (and .Values.devAuthentik.enabled (include "distant-signal.devAuthentikClientId" .)) -}}
{{- $redirectUrl := .Values.api.sso.redirectUrl | default (and .Values.devAuthentik.enabled (include "distant-signal.devAuthentikRedirectUrl" .)) -}}
{{- $postLoginRedirectUrl := .Values.api.sso.postLoginRedirectUrl | default (and .Values.devAuthentik.enabled (include "distant-signal.devAuthentikPostLoginRedirectUrl" .)) -}}
{{- $clientSecretAvailable := or .Values.api.sso.clientSecret .Values.api.sso.existingSecret .Values.devAuthentik.enabled -}}
{{- if not $issuerUrl }}
{{- fail "api.sso.issuerUrl is empty and devAuthentik.enabled is false. Set api.sso.issuerUrl to your OIDC provider's issuer base URL (e.g. --set api.sso.issuerUrl=https://sso.example.com/realms/rail), or set devAuthentik.enabled=true to use the bundled local dev IdP instead." }}
{{- end }}
{{- if not $clientId }}
{{- fail "api.sso.clientId is empty and devAuthentik.enabled is false. Set api.sso.clientId, or set devAuthentik.enabled=true." }}
{{- end }}
{{- if not $clientSecretAvailable }}
{{- fail "api.sso.clientSecret is empty, no api.sso.existingSecret was given, and devAuthentik.enabled is false. Set one of them, or set devAuthentik.enabled=true." }}
{{- end }}
{{- if not $redirectUrl }}
{{- fail "api.sso.redirectUrl is empty and devAuthentik.enabled is false. Set api.sso.redirectUrl (not the api's own origin -- see this chart's README), or set devAuthentik.enabled=true." }}
{{- end }}
{{- if not $postLoginRedirectUrl }}
{{- fail "api.sso.postLoginRedirectUrl is empty and devAuthentik.enabled is false. Set api.sso.postLoginRedirectUrl, or set devAuthentik.enabled=true." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distant-signal.apiFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "api") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.api.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.api.service.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- $hostAliasIP := include "distant-signal.devAuthentikHostAliasIP" . }}
      {{- if and .Values.devAuthentik.enabled $hostAliasIP }}
      # Makes this Pod's own outbound OIDC discovery request present the
      # SAME Host header the developer's browser sends via the NodePort --
      # see "Discovery reachability under Kubernetes" in the design doc. On
      # a from-scratch helm install this may be ABSENT (see
      # distant-signal.devAuthentikHostAliasIP's own comment) -- that is a known,
      # documented gap requiring one `helm upgrade`, not a bug.
      hostAliases:
        - ip: {{ $hostAliasIP }}
          hostnames:
            - {{ .Values.devAuthentik.hostname }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.api.podSecurityContext) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            - name: BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.api.service.port) | quote }}
            # PGPASSWORD must stay immediately before DATABASE_URL -- the
            # kubelet only expands $(VAR) from EARLIER entries in this list.
            {{- include "distant-signal.databaseEnv" . | nindent 12 }}
            - name: INTERNAL_OAUTH_ISSUER_URL
              value: {{ .Values.api.internalOauth.issuerUrl | quote }}
            - name: INTERNAL_OAUTH_CLIENT_ID
              value: {{ .Values.api.internalOauth.clientId | quote }}
            - name: INTERNAL_OAUTH_GROUP_INCIDENTS
              value: {{ .Values.api.internalOauth.groups.incidents | quote }}
            - name: INTERNAL_OAUTH_GROUP_STATIONS
              value: {{ .Values.api.internalOauth.groups.stations | quote }}
            - name: INTERNAL_OAUTH_GROUP_TOCS
              value: {{ .Values.api.internalOauth.groups.tocs | quote }}
            - name: INTERNAL_OAUTH_GROUP_LDBWS
              value: {{ .Values.api.internalOauth.groups.ldbws | quote }}
            - name: INTERNAL_OAUTH_GROUP_TFL
              value: {{ .Values.api.internalOauth.groups.tfl | quote }}
            - name: INTERNAL_OAUTH_GROUP_TRUST_CONSUMER
              value: {{ .Values.api.internalOauth.groups.trustConsumer | quote }}
            - name: INTERNAL_OAUTH_GROUP_SCHEDULE_INGEST
              value: {{ .Values.api.internalOauth.groups.scheduleIngest | quote }}
            - name: INTERNAL_OAUTH_GROUP_SCHEDULE_REFERENCE
              value: {{ .Values.api.internalOauth.groups.scheduleReference | quote }}
            - name: INTERNAL_OAUTH_GROUP_FULL_COVERAGE
              value: {{ .Values.api.internalOauth.groups.fullCoverage | quote }}
            # Global override for LineDefinition.full_coverage_enabled --
            # see api.fullCoverageEnabledDefault's own comment in values.yaml.
            # Default false; must be set the same on the aggregator
            # Deployment (aggregator.fullCoverageEnabledDefault) to actually
            # flip full coverage on everywhere, since both services
            # independently gate on this.
            - name: FULL_COVERAGE_ENABLED_DEFAULT
              value: {{ .Values.api.fullCoverageEnabledDefault | quote }}
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" . | quote }}
            # Always rendered, so it reflects the real value either way.
            # api has no metrics port of its own -- /metrics shares the http
            # port above -- so this alone decides whether that route and its
            # request-metrics middleware are registered
            # (`metrics_enabled` in crates/api/src/data/config.rs).
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            - name: RUST_LOG
              value: {{ .Values.api.logLevel | quote }}
            # OIDC SSO (crates/api/src/data/config.rs: ServiceArguments).
            # All five are required with no defaults -- see the guards at
            # the top of this file. The client secret is the only one that
            # is a credential, so it alone goes through a secretKeyRef; the
            # other four are plain URLs/identifiers that are public by
            # construction (the browser sees the issuer and redirect URLs
            # on every sign-in anyway) -- same posture as every
            # INTERNAL_OAUTH_* value above, none of which is a
            # secretKeyRef either (Decision 6: api never holds any of the
            # 8 real callers' own credentials).
            - name: SSO_ISSUER_URL
              value: {{ $issuerUrl | quote }}
            - name: SSO_CLIENT_ID
              value: {{ $clientId | quote }}
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.ssoClientSecretName" . }}
                  key: {{ include "distant-signal.ssoClientSecretKey" . }}
            - name: SSO_REDIRECT_URL
              value: {{ $redirectUrl | quote }}
            - name: SSO_POST_LOGIN_REDIRECT_URL
              value: {{ $postLoginRedirectUrl | quote }}
            - name: SESSION_TTL_DAYS
              value: {{ .Values.api.sessionTtlDays | quote }}
            # Must equal the aggregator Deployment's own HISTORY_RETENTION_DAYS
            # -- sourced from the SAME value (not a separate api.* setting)
            # so the two can't drift apart. See
            # crates/api/src/data/config.rs's history_retention_days doc.
            - name: HISTORY_RETENTION_DAYS
              value: {{ .Values.aggregator.historyRetentionDays | quote }}
            # LINES_DIR is deliberately NOT set: crates/api/src/data/config.rs
            # already defaults it to /app/lines, which is exactly where
            # docker/api.Dockerfile bakes the line catalogue.
            # VAPID public key (crates/api/src/data/config.rs: ServiceArguments)
            # -- served unauthenticated via GET /public/notifications/vapid-public-key
            # (crates/api/src/routes/notifications.rs) for the browser's
            # PushManager.subscribe() call. Sourced from the SAME secret
            # key notifier-deployment.yaml reads for its own VAPID_PUBLIC_KEY
            # -- api never gets VAPID_PRIVATE_KEY, since it only stores
            # subscriptions, it never sends to them (crates/notifier does).
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.vapidPublicKeySecretName" . }}
                  key: {{ include "distant-signal.vapidPublicKeySecretKey" . }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.startup.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

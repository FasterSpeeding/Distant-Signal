{{/*
Fail-fast on an unusable SSO config -- same pattern as before, EXCEPT an
empty api.sso.* value is no longer automatically fatal when
devAuthentik.enabled: true. In that case the value is computed instead,
from devAuthentik.* and the fixed blueprint-provisioned client id/secret
(charts/distant-signal/templates/_helpers.tpl's distant-signal.devAuthentik* helpers)
-- see docs/superpowers/specs/2026-08-29-dev-oidc-server-design.md's Helm
chart support section. An operator's explicit api.sso.* value ALWAYS wins
over the computed default; devAuthentik never overrides one.

When no value is available from either source, refusing to render is still
strictly better than rendering an empty one. crates/api/src/data/config.rs
declares all five SSO_* fields with `#[arg(long, env)]` and NO default, so
an api container missing any of them never gets as far as `main` -- clap
exits with "the following required arguments were not provided" and the pod
CrashLoopBackOffs. An empty-string value is worse still: it satisfies clap,
then fails either the `ensure!(!config.sso_client_secret.is_empty())` in
AppState::init or `IssuerUrl::new("")` immediately after, with the same
outcome and a less obvious cause.
*/}}
{{- $issuerUrl := .Values.api.sso.issuerUrl | default (and .Values.devAuthentik.enabled (include "distant-signal.devAuthentikIssuerUrl" .)) -}}
{{- $clientId := .Values.api.sso.clientId | default (and .Values.devAuthentik.enabled (include "distant-signal.devAuthentikClientId" .)) -}}
{{- $redirectUrl := .Values.api.sso.redirectUrl | default (and .Values.devAuthentik.enabled (include "distant-signal.devAuthentikRedirectUrl" .)) -}}
{{- $postLoginRedirectUrl := .Values.api.sso.postLoginRedirectUrl | default (and .Values.devAuthentik.enabled (include "distant-signal.devAuthentikPostLoginRedirectUrl" .)) -}}
{{- $clientSecretAvailable := or .Values.api.sso.clientSecret .Values.api.sso.existingSecret .Values.devAuthentik.enabled -}}
{{- if not $issuerUrl }}
{{- fail "api.sso.issuerUrl is empty and devAuthentik.enabled is false. Set api.sso.issuerUrl to your OIDC provider's issuer base URL (e.g. --set api.sso.issuerUrl=https://sso.example.com/realms/rail), or set devAuthentik.enabled=true to use the bundled local dev IdP instead." }}
{{- end }}
{{- if not $clientId }}
{{- fail "api.sso.clientId is empty and devAuthentik.enabled is false. Set api.sso.clientId, or set devAuthentik.enabled=true." }}
{{- end }}
{{- if not $clientSecretAvailable }}
{{- fail "api.sso.clientSecret is empty, no api.sso.existingSecret was given, and devAuthentik.enabled is false. Set one of them, or set devAuthentik.enabled=true." }}
{{- end }}
{{- if not $redirectUrl }}
{{- fail "api.sso.redirectUrl is empty and devAuthentik.enabled is false. Set api.sso.redirectUrl (not the api's own origin -- see this chart's README), or set devAuthentik.enabled=true." }}
{{- end }}
{{- if not $postLoginRedirectUrl }}
{{- fail "api.sso.postLoginRedirectUrl is empty and devAuthentik.enabled is false. Set api.sso.postLoginRedirectUrl, or set devAuthentik.enabled=true." }}
{{- end }}
{{/*
INF-7 / R-048: with the bundled Postgres, refuse to render a pool layout
that can exhaust max_connections. Counted: api maxConnections x
replicaCount (plus a RollingUpdate surge pod), plus aggregator 10,
notifier 5, enricher 5, the api's migration connection 1, the archive pool
2 when archive.enabled, the api-maintenance CronJob's pool when
apiMaintenance.enabled, the ingest-writer's when ingestWriter.enabled and
schedule-ingest's when scheduleFeed.ingest.sink=db; plus
postgresql.connectionBudget (clients outside this chart, such as the
postgres-exporter and pg_dump, and admin psql sessions) and 2 for pgBackRest
when postgresql.pgbackrest.enabled. The total must fit in max_connections
minus Postgres's 3 superuser_reserved_connections. The app role is itself a
superuser, so those 3 are only extra headroom, not a protected admin
reserve: the admin sessions are counted explicitly instead.
max_connections is postgresql.config.max_connections when set, else
Postgres's own default of 100. An external database is not checked: its
limit is unknown here.
*/}}
{{- if .Values.postgresql.enabled }}
{{- $maxConn := 100 }}
{{- with .Values.postgresql.config }}
{{- if hasKey . "max_connections" }}
{{- $maxConn = int (get . "max_connections") }}
{{- end }}
{{- end }}
{{- /* A RollingUpdate surge pod has its own pool (distant-signal.apiPods). */}}
{{- $apiPods := int (include "distant-signal.apiPods" .) }}
{{- $apiPool := mul $apiPods (int (include "distant-signal.apiMaxConnections" .)) }}
{{- include "distant-signal.postgresRoleBudgetCheck" . }}
{{- $pools := add 10 5 5 1 (ternary 2 0 (.Values.archive.enabled | default false)) (include "distant-signal.apiMaintenancePool" .) (include "distant-signal.ingestWriterPool" .) (include "distant-signal.scheduleIngestPool" .) }}
{{- $budget := .Values.postgresql.connectionBudget | default dict }}
{{- $pgbackrest := ternary 2 0 (dig "pgbackrest" "enabled" false .Values.postgresql) }}
{{- $reserved := add (int (dig "externalClients" 2 $budget)) (int (dig "adminSessions" 3 $budget)) $pgbackrest }}
{{- $available := sub $maxConn 3 }}
{{- if gt (add $apiPool $pools $reserved) $available }}
{{- fail (printf "Postgres connection budget exceeded: %d api pods (api.replicaCount, plus 1 surge pod with api.strategy.type RollingUpdate) x api.database.maxConnections (%d) = %d, plus %d for the other pools and %d reserved (postgresql.connectionBudget, plus 2 for pgBackRest when enabled), is more than max_connections (%d) minus 3 superuser-reserved = %d. Lower api.database.maxConnections, or raise postgresql.config.max_connections (check the memory budget first; see values.yaml). INF-7." $apiPods (int .Values.api.database.maxConnections) $apiPool $pools $reserved $maxConn $available) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distant-signal.apiFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    # Recreate, not the default RollingUpdate -- the SAME reasoning
    # aggregator/notifier/schedulefeed/every poller Deployment in this chart
    # already applies, for a different hazard.
    #
    # crates/api/src/main.rs runs `sqlx::migrate!().run(...)` BEFORE it binds
    # its listener, so a new api pod applies schema migrations as part of
    # starting up. This crate's migration history already contains steps that
    # are NOT backward-compatible with the previous binary
    # (20260907100000_rename_tracked_trains.sql renames a table;
    # 20260906140000_drop_legacy_columns.sql drops columns), and
    # `aggregator`, `enricher`, `notifier`, `trust-consumer` and
    # `trust-backlog-consumer` all query those same tables on their own
    # independent rollout schedules.
    #
    # Under RollingUpdate the new pod migrates the schema while the OLD pod
    # is still Ready and still serving traffic against the pre-migration
    # shape it was compiled for -- every request that old pod handles through
    # a renamed/dropped column fails for as long as the rollout window lasts.
    # Recreate removes that window entirely: the old pod is fully terminated
    # before the new one starts, so exactly one schema expectation is ever
    # live.
    #
    # TRADEOFF (deliberate): this means an api rollout has a brief outage --
    # roughly terminationGracePeriod plus the new pod's own startup, which
    # now includes the migration run itself (see api.probes.startup's budget
    # in values.yaml). That is accepted as strictly better than serving
    # requests against a schema the running binary does not match.
    #
    # api.strategy.type: RollingUpdate (ingest plan 1B.10) ends that outage
    # once the migrate hook Job owns the migrations (migrate.job.enabled and
    # api.migrateOnStartup false, enforced by distant-signal.apiStrategy) and
    # destructive migrations need a contract header
    # (scripts/check-migration-order.py): the new pod no longer migrates,
    # and an expand-only schema serves both binaries.
    {{- $strategy := include "distant-signal.apiStrategy" . }}
    type: {{ $strategy }}
    {{- if eq $strategy "RollingUpdate" }}
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "api") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.api.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        # `metrics.port`, NOT `api.service.port` -- api now serves /metrics
        # on its own internal-only listener, same as every other workload
        # (2026-09-25 Signal Box Audit Low finding: /metrics used to share
        # the public port, making it reachable through the Ingress's
        # catch-all rule with no auth whenever ingress.api.enabled was also
        # set). See crates/api/src/data/config.rs's metrics_port doc.
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- $hostAliasIP := include "distant-signal.devAuthentikHostAliasIP" . }}
      {{- if and .Values.devAuthentik.enabled $hostAliasIP }}
      # Makes this Pod's own outbound OIDC discovery request present the
      # SAME Host header the developer's browser sends via the NodePort --
      # see "Discovery reachability under Kubernetes" in the design doc. On
      # a from-scratch helm install this may be ABSENT (see
      # distant-signal.devAuthentikHostAliasIP's own comment) -- that is a known,
      # documented gap requiring one `helm upgrade`, not a bug.
      hostAliases:
        - ip: {{ $hostAliasIP }}
          hostnames:
            - {{ .Values.devAuthentik.hostname }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.api.podSecurityContext) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            # api's own internal-only /metrics listener
            # (crates/api/src/main.rs's spawn_metrics_listener) -- a
            # SEPARATE port from the public one above, named "metrics" like
            # every other workload's own listener so podmonitor.yaml's one
            # shared podMetricsEndpoint entry covers it too. Not routed to
            # by ingress.yaml and not opened to the ingress-controller
            # namespace by networkpolicy.yaml's api rule -- only the
            # monitoring namespace can reach it (that rule's own comment).
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.apiEnv" (dict "root" . "issuerUrl" $issuerUrl "clientId" $clientId "redirectUrl" $redirectUrl "postLoginRedirectUrl" $postLoginRedirectUrl)) "extra" .Values.api.extraEnv) | trim | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.startup.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- /*
This container's own env entries. distant-signal.mergeEnv renders them
with api.extraEnv, which replaces an entry of the same name.
*/ -}}
{{- define "distant-signal.apiEnv" }}
{{- /* Takes dict "root" plus the issuerUrl, clientId, redirectUrl, postLoginRedirectUrl worked out at the top of this file. */}}
{{- $issuerUrl := .issuerUrl }}
{{- $clientId := .clientId }}
{{- $redirectUrl := .redirectUrl }}
{{- $postLoginRedirectUrl := .postLoginRedirectUrl }}
{{- with .root }}
            - name: BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.api.service.port) | quote }}
            # PGPASSWORD must stay immediately before DATABASE_URL -- the
            # kubelet only expands $(VAR) from EARLIER entries in this list.
            {{- include "distant-signal.databaseEnvFor" (dict "root" . "service" "api") | nindent 12 }}
            {{- if include "distant-signal.apiMigratesOnStartup" . }}
            {{- with include "distant-signal.migrationDatabaseEnv" . }}
            # postgresql.roles.enabled: the migrations connect as the schema
            # owner, the pools above as the DML-only app role.
            {{- . | nindent 12 }}
            {{- end }}
            {{- else }}
            # api.migrateOnStartup false: the migrate hook Job
            # (migrate-job.yaml) migrates and holds the owner credentials;
            # the api waits at the schema gate instead (plan task 1B.3).
            - name: API_MIGRATE_ON_STARTUP
              value: "false"
            {{- end }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ include "distant-signal.apiMaxConnections" . | quote }}
            # The dedicated startup migration connection; see
            # api.migrations in values.yaml and crates/ds-store/src/migrate.rs.
            - name: MIGRATION_LOCK_TIMEOUT_SECS
              value: {{ .Values.api.migrations.lockTimeoutSecs | int | quote }}
            - name: MIGRATION_STATEMENT_TIMEOUT_SECS
              value: {{ .Values.api.migrations.statementTimeoutSecs | int | quote }}
            - name: INTERNAL_OAUTH_ISSUER_URL
              value: {{ .Values.api.internalOauth.issuerUrl | quote }}
            - name: INTERNAL_OAUTH_CLIENT_ID
              value: {{ .Values.api.internalOauth.clientId | quote }}
            - name: INTERNAL_OAUTH_GROUP_INCIDENTS
              value: {{ .Values.api.internalOauth.groups.incidents | quote }}
            - name: INTERNAL_OAUTH_GROUP_STATIONS
              value: {{ .Values.api.internalOauth.groups.stations | quote }}
            - name: INTERNAL_OAUTH_GROUP_TOCS
              value: {{ .Values.api.internalOauth.groups.tocs | quote }}
            - name: INTERNAL_OAUTH_GROUP_LDBWS
              value: {{ .Values.api.internalOauth.groups.ldbws | quote }}
            - name: INTERNAL_OAUTH_GROUP_TFL
              value: {{ .Values.api.internalOauth.groups.tfl | quote }}
            - name: INTERNAL_OAUTH_GROUP_TRUST_CONSUMER
              value: {{ .Values.api.internalOauth.groups.trustConsumer | quote }}
            - name: INTERNAL_OAUTH_GROUP_SCHEDULE_INGEST
              value: {{ .Values.api.internalOauth.groups.scheduleIngest | quote }}
            - name: INTERNAL_OAUTH_GROUP_SCHEDULE_REFERENCE
              value: {{ .Values.api.internalOauth.groups.scheduleReference | quote }}
            - name: INTERNAL_OAUTH_GROUP_FULL_COVERAGE
              value: {{ .Values.api.internalOauth.groups.fullCoverage | quote }}
            - name: INTERNAL_OAUTH_GROUP_TRUST_BACKLOG
              value: {{ .Values.api.internalOauth.groups.trustBacklog | quote }}
            - name: INTERNAL_OAUTH_GROUP_IRISH_RAIL_GTFS
              value: {{ .Values.api.internalOauth.groups.irishRailGtfs | quote }}
            - name: INTERNAL_OAUTH_GROUP_IRISH_RAIL_LIVE
              value: {{ .Values.api.internalOauth.groups.irishRailLive | quote }}
            - name: INTERNAL_OAUTH_GROUP_NIR_STATIONS
              value: {{ .Values.api.internalOauth.groups.nirStations | quote }}
            - name: INTERNAL_OAUTH_GROUP_CORPUS
              value: {{ .Values.api.internalOauth.groups.corpus | quote }}
            # Not a /private/* gate: the Distant-Signal-MCP's group, which
            # only moves its public requests onto api.rateLimit.mcp. Empty
            # turns that off. See crates/api/src/rate_limit.rs.
            - name: INTERNAL_OAUTH_GROUP_MCP
              value: {{ .Values.api.internalOauth.groups.mcp | default "" | quote }}
            # Off by default -- see api.corpusFallback in values.yaml.
            - name: CORPUS_FALLBACK_ENABLED
              value: {{ .Values.api.corpusFallback.enabled | toString | quote }}
            # Authentik/SSO end-user group that grants embedded-chatbot
            # access -- see api.chatbotAccessGroup's own comment in
            # values.yaml. NOT one of the INTERNAL_OAUTH_GROUP_* machine
            # credentials above.
            - name: CHATBOT_ACCESS_GROUP
              value: {{ .Values.api.chatbotAccessGroup | quote }}
            # `group` or `authenticated` -- see api.chatbotAccess in
            # values.yaml.
            - name: CHATBOT_ACCESS
              value: {{ include "distant-signal.chatbotAccess" . | quote }}
            # Authentik/SSO end-user group allowed to revoke other users'
            # sessions -- see api.adminGroup in values.yaml. Empty = off.
            - name: ADMIN_GROUP
              value: {{ .Values.api.adminGroup | default "" | quote }}
            # LEG-6: extra IdP groups kept on users.groups -- see
            # api.oidcStoredGroupsExtra in values.yaml.
            - name: OIDC_STORED_GROUPS_EXTRA
              value: {{ .Values.api.oidcStoredGroupsExtra | default "" | quote }}
            # API-2 time limits, the per-IP rate limits and the /Trips/plan
            # graph cache -- see api.timeouts, api.rateLimit and
            # api.tripPlanGraphCache in values.yaml.
            - name: API_REQUEST_TIMEOUT_SECS
              value: {{ .Values.api.timeouts.requestTimeoutSecs | quote }}
            - name: API_PRIVATE_REQUEST_TIMEOUT_SECS
              value: {{ .Values.api.timeouts.privateRequestTimeoutSecs | quote }}
            - name: API_HEADER_READ_TIMEOUT_SECS
              value: {{ .Values.api.timeouts.headerReadTimeoutSecs | quote }}
            - name: API_UNAVAILABLE_RETRY_AFTER_SECS
              value: {{ .Values.api.timeouts.unavailableRetryAfterSecs | quote }}
            - name: API_RATE_LIMIT_ENABLED
              value: {{ .Values.api.rateLimit.enabled | quote }}
            - name: API_RATE_LIMIT_TRUST_X_REAL_IP
              value: {{ .Values.api.rateLimit.trustXRealIp | quote }}
            - name: API_RATE_LIMIT_LOGIN_PER_MINUTE
              value: {{ .Values.api.rateLimit.login.perMinute | quote }}
            - name: API_RATE_LIMIT_LOGIN_BURST
              value: {{ .Values.api.rateLimit.login.burst | quote }}
            - name: API_RATE_LIMIT_TRIP_PLAN_PER_MINUTE
              value: {{ .Values.api.rateLimit.tripPlan.perMinute | quote }}
            - name: API_RATE_LIMIT_TRIP_PLAN_BURST
              value: {{ .Values.api.rateLimit.tripPlan.burst | quote }}
            - name: API_RATE_LIMIT_TRAIN_BY_UID_PER_MINUTE
              value: {{ .Values.api.rateLimit.trainByUid.perMinute | quote }}
            - name: API_RATE_LIMIT_TRAIN_BY_UID_BURST
              value: {{ .Values.api.rateLimit.trainByUid.burst | quote }}
            - name: API_RATE_LIMIT_PUBLIC_WRITE_PER_MINUTE
              value: {{ .Values.api.rateLimit.publicWrite.perMinute | quote }}
            - name: API_RATE_LIMIT_PUBLIC_WRITE_BURST
              value: {{ .Values.api.rateLimit.publicWrite.burst | quote }}
            - name: API_RATE_LIMIT_MCP_TRIP_PLAN_PER_MINUTE
              value: {{ .Values.api.rateLimit.mcp.tripPlan.perMinute | quote }}
            - name: API_RATE_LIMIT_MCP_TRIP_PLAN_BURST
              value: {{ .Values.api.rateLimit.mcp.tripPlan.burst | quote }}
            - name: API_RATE_LIMIT_MCP_TRAIN_BY_UID_PER_MINUTE
              value: {{ .Values.api.rateLimit.mcp.trainByUid.perMinute | quote }}
            - name: API_RATE_LIMIT_MCP_TRAIN_BY_UID_BURST
              value: {{ .Values.api.rateLimit.mcp.trainByUid.burst | quote }}
            - name: API_RATE_LIMIT_MCP_PUBLIC_WRITE_PER_MINUTE
              value: {{ .Values.api.rateLimit.mcp.publicWrite.perMinute | quote }}
            - name: API_RATE_LIMIT_MCP_PUBLIC_WRITE_BURST
              value: {{ .Values.api.rateLimit.mcp.publicWrite.burst | quote }}
            - name: TRIP_PLAN_GRAPH_CACHE_DATES
              value: {{ .Values.api.tripPlanGraphCache.dates | quote }}
            - name: TRIP_PLAN_GRAPH_CACHE_MAX_AGE_SECS
              value: {{ .Values.api.tripPlanGraphCache.maxAgeSecs | quote }}
            - name: TRIP_PLAN_MAX_WAYPOINTS
              value: {{ .Values.api.tripPlanMaxWaypoints | quote }}
            - name: TRIP_PLAN_ROAD_WATER_CHANGE_MINUTES
              value: {{ .Values.api.tripPlanRoadWaterChangeMinutes | quote }}
            - name: TRIP_PLAN_MAX_OPTIONS_SEARCH_SIZE
              value: {{ .Values.api.tripPlanMaxOptionsSearchSize | quote }}
            # The /Trips/plan live overlay -- see api.tripPlanLive in
            # values.yaml.
            - name: TRIP_PLAN_LIVE_ENABLED
              value: {{ .Values.api.tripPlanLive.enabled | quote }}
            - name: TRIP_PLAN_LIVE_MAX_REPLANS
              value: {{ .Values.api.tripPlanLive.maxReplans | quote }}
            - name: TRIP_PLAN_LIVE_MAX_REPLANS_OPTIONS
              value: {{ .Values.api.tripPlanLive.maxReplansOptions | quote }}
            - name: TRIP_PLAN_LIVE_TRUST_MAX_AGE_MINUTES
              value: {{ .Values.api.tripPlanLive.trustMaxAgeMinutes | quote }}
            - name: TRIP_PLAN_LIVE_HORIZON_MINUTES
              value: {{ .Values.api.tripPlanLive.horizonMinutes | quote }}
            - name: TRIP_PLAN_LIVE_LOOKBACK_MINUTES
              value: {{ .Values.api.tripPlanLive.lookbackMinutes | quote }}
            - name: TRIP_PLAN_LIVE_MAX_TRAINS
              value: {{ .Values.api.tripPlanLive.maxTrains | quote }}
            # Global override for LineDefinition.full_coverage_enabled --
            # see api.fullCoverageEnabledDefault's own comment in values.yaml.
            # The binary defaults to false, the chart value to true; it must be
            # set the same on the aggregator
            # Deployment (aggregator.fullCoverageEnabledDefault) to actually
            # flip full coverage on everywhere, since both services
            # independently gate on this.
            - name: FULL_COVERAGE_ENABLED_DEFAULT
              value: {{ .Values.api.fullCoverageEnabledDefault | quote }}
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" . | quote }}
            {{- include "distant-signal.redisClientAuthEnv" (dict "root" . "client" "api" "user" "api") }}
            # Always rendered, so it reflects the real value either way.
            # Decides whether requests are counted at all AND whether the
            # internal-only /metrics listener below is started
            # (`metrics_enabled` in crates/api/src/data/config.rs).
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            # Port for api's own internal-only /metrics listener -- see the
            # `metrics` containerPort above and metrics_port's own doc
            # comment in crates/api/src/data/config.rs. Always rendered
            # (clap needs a value regardless; metrics_enabled=false just
            # means main.rs never binds it).
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: RUST_LOG
              value: {{ .Values.api.logLevel | quote }}
            # OIDC SSO (crates/api/src/data/config.rs: ServiceArguments).
            # All five are required with no defaults -- see the guards at
            # the top of this file. The client secret is the only one that
            # is a credential, so it alone goes through a secretKeyRef; the
            # other four are plain URLs/identifiers that are public by
            # construction (the browser sees the issuer and redirect URLs
            # on every sign-in anyway) -- same posture as every
            # INTERNAL_OAUTH_* value above, none of which is a
            # secretKeyRef either (Decision 6: api never holds any of the
            # 8 real callers' own credentials).
            - name: SSO_ISSUER_URL
              value: {{ $issuerUrl | quote }}
            - name: SSO_CLIENT_ID
              value: {{ $clientId | quote }}
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.ssoClientSecretName" . }}
                  key: {{ include "distant-signal.ssoClientSecretKey" . }}
            - name: SSO_REDIRECT_URL
              value: {{ $redirectUrl | quote }}
            - name: SSO_POST_LOGIN_REDIRECT_URL
              value: {{ $postLoginRedirectUrl | quote }}
            - name: SESSION_TTL_DAYS
              value: {{ .Values.api.sessionTtlDays | quote }}
            # Four sweep-cadence tunables, all declared in
            # crates/api/src/data/config.rs with a working default but
            # never wired into this template until the 2026-09-25 Signal
            # Box Audit Low pass -- the same "declared but unwired" gap
            # already closed above for the INTERNAL_OAUTH_GROUP_* fields
            # (see chart_env_wiring_tests's own doc comment). Unlike those,
            # an unwired sweep interval doesn't 403 anything -- it just
            # means an operator can't tune the cadence without a redeploy,
            # since the code-level default (matching the value below) still
            # applies. schedule_match_interval_secs is the one sibling
            # field deliberately NOT wired here -- see its own doc comment
            # in config.rs for why.
            - name: RECONCILIATION_SWEEP_INTERVAL_SECS
              value: {{ .Values.api.reconciliationSweepIntervalSecs | quote }}
            - name: SCHEDULE_ENRICHMENT_GRACE_MINUTES
              value: {{ .Values.api.scheduleEnrichmentGraceMinutes | quote }}
            - name: BACKLOG_MATCH_SWEEP_INTERVAL_SECS
              value: {{ .Values.api.backlogMatchSweepIntervalSecs | quote }}
            - name: SESSION_CLEANUP_INTERVAL_SECS
              value: {{ .Values.api.sessionCleanupIntervalSecs | quote }}
            {{- if not .Values.api.backgroundLoops }}
            # api.backgroundLoops false (ingest plan 1B.7): the
            # ingest-writer's loops and the api-maintenance CronJob run the
            # sweeps; the api runs none. Rendered only when false, so the
            # default render is unchanged.
            - name: API_BACKGROUND_LOOPS
              value: "false"
            {{- end }}
            - name: PAST_TRAVEL_RETENTION_DAYS
              value: {{ .Values.api.pastTravelRetentionDays | quote }}
            - name: STALE_PUSH_SUBSCRIPTION_DAYS
              value: {{ .Values.api.stalePushSubscriptionDays | quote }}
            - name: INACTIVE_ACCOUNT_RETENTION_DAYS
              value: {{ .Values.api.inactiveAccountRetentionDays | quote }}
            # Must equal the aggregator Deployment's own HISTORY_RETENTION_DAYS
            # -- sourced from the SAME value (not a separate api.* setting)
            # so the two can't drift apart. See
            # crates/api/src/data/config.rs's history_retention_days doc.
            - name: HISTORY_RETENTION_DAYS
              value: {{ .Values.aggregator.historyRetentionDays | quote }}
            # Must equal the aggregator Deployment's own DAILY_STATS_RETENTION_DAYS
            # -- sourced from the SAME value (not a separate api.* setting)
            # so the two can't drift apart. See
            # crates/api/src/data/config.rs's daily_stats_retention_days doc.
            - name: DAILY_STATS_RETENTION_DAYS
              value: {{ .Values.aggregator.dailyStatsRetentionDays | quote }}
            # Must equal the aggregator Deployment's own HALF_HOURLY_STATS_RETENTION_HOURS
            # -- same reasoning. See
            # crates/api/src/data/config.rs's half_hourly_stats_retention_hours doc.
            - name: HALF_HOURLY_STATS_RETENTION_HOURS
              value: {{ .Values.aggregator.halfHourlyStatsRetentionHours | quote }}
            # LINES_DIR is deliberately NOT set: crates/api/src/data/config.rs
            # already defaults it to /app/lines, which is exactly where
            # docker/api.Dockerfile bakes the line catalogue.
            # VAPID public key (crates/api/src/data/config.rs: ServiceArguments)
            # -- served unauthenticated via GET /public/notifications/vapid-public-key
            # (crates/api/src/routes/notifications.rs) for the browser's
            # PushManager.subscribe() call. Sourced from the SAME secret
            # key notifier-deployment.yaml reads for its own VAPID_PUBLIC_KEY
            # -- api never gets VAPID_PRIVATE_KEY, since it only stores
            # subscriptions, it never sends to them (crates/notifier does).
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.vapidPublicKeySecretName" . }}
                  key: {{ include "distant-signal.vapidPublicKeySecretKey" . }}
            # glibc malloc tuning -- see api.malloc's own comment in
            # values.yaml. Each is omitted when its value is empty, which
            # leaves glibc's own default in place.
            {{- with .Values.api.malloc.arenaMax }}
            - name: MALLOC_ARENA_MAX
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.malloc.mmapThreshold }}
            - name: MALLOC_MMAP_THRESHOLD_
              value: {{ . | quote }}
            {{- end }}
{{- end }}
{{- end }}

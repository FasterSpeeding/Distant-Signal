{{/*
One template, five Deployments. Everything that differs between the pollers
lives in the `.Values.pollers` map (baseUrlEnvVar, ingestPath, cadence, and
ldbws's two extra vars), so this file never branches on a poller's name.

Go templates iterate maps in sorted key order, so the rendered document
order is stable: incidents, ldbws, stations, tfl, tocs.
*/}}
{{- $root := . -}}
{{- range $name, $poller := .Values.pollers }}
{{- if $poller.enabled }}
{{- if not $poller.baseUrl }}
{{- fail (printf "pollers.%s.enabled is true but pollers.%s.baseUrl is empty. Set it to the confirmed Rail Data Marketplace base URL for this feed (see .env.example -- no confirmed endpoint exists for any of the four feeds yet), or set pollers.%s.enabled=false." $name $name $name) }}
{{- end }}
{{- $component := printf "poller-%s" $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "distant-signal.fullname" $root) $component | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  # Every poller is a singleton loop; a second copy would just duplicate
  # every upstream request and every ingest POST.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" $root "component" $component) | nindent 8 }}
      {{- if or $root.Values.metrics.enabled $poller.podAnnotations }}
      annotations:
        {{- if $root.Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $root.Values.metrics.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with $poller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" $root }}
      automountServiceAccountToken: false
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" $poller.podSecurityContext) | nindent 8 }}
      containers:
        - name: {{ $component }}
          image: {{ include "distant-signal.image" (dict "root" $root "image" $poller.image) | quote }}
          imagePullPolicy: {{ $poller.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          # No probes: none of the pollers expose an HTTP surface for
          # health checks. Each DOES now optionally expose a /metrics
          # listener when metrics.enabled -- a scrape target, not a
          # liveness/readiness signal.
          {{- if $root.Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ $root.Values.metrics.port }}
              protocol: TCP
          {{- end }}
          env:
            - name: {{ $poller.baseUrlEnvVar }}
              value: {{ $poller.baseUrl | quote }}
            # Always rendered, unlike the port env var below: this is
            # the Rust-side toggle that actually stops the binary from
            # starting its /metrics listener (`metrics_enabled` in
            # crates/poller-*/src/config.rs). Omitting the port/env/annotations
            # alone would not -- Kubernetes container ports are purely
            # declarative -- so this must render "false" too, not vanish.
            - name: METRICS_ENABLED
              value: {{ $root.Values.metrics.enabled | quote }}
            {{- if $root.Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ $root.Values.metrics.port | quote }}
            {{- end }}
            # RDM_API_KEY for the four Rail Data Marketplace pollers; tfl
            # reads TFL_APP_KEY instead, because TfL's key goes in its own
            # `Ocp-Apim-Subscription-Key` header rather than RDM's
            # `x-apikey`. Defaulted so the four existing entries in
            # .Values.pollers need no change.
            - name: {{ $poller.apiKeyEnvVar | default "RDM_API_KEY" }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.pollerSecretName" (dict "root" $root "poller" $poller) }}
                  key: {{ include "distant-signal.pollerSecretKey" (dict "root" $root "name" $name "poller" $poller) }}
            - name: INTERNAL_OAUTH_TOKEN_URL
              value: {{ $root.Values.internalOauth.tokenUrl | quote }}
            - name: INTERNAL_OAUTH_CLIENT_ID
              value: {{ $root.Values.internalOauth.clientId | quote }}
            - name: INTERNAL_OAUTH_SCOPE
              value: {{ $root.Values.internalOauth.scope | quote }}
            - name: INTERNAL_OAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.pollerSecretName" (dict "root" $root "poller" $poller) }}
                  key: {{ include "distant-signal.pollerOauthUsernameSecretKey" (dict "root" $root "name" $name "poller" $poller) }}
            - name: INTERNAL_OAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.pollerSecretName" (dict "root" $root "poller" $poller) }}
                  key: {{ include "distant-signal.pollerOauthPasswordSecretKey" (dict "root" $root "name" $name "poller" $poller) }}
            - name: API_INGEST_URL
              value: {{ printf "%s%s" (include "distant-signal.apiBaseUrl" $root) $poller.ingestPath | quote }}
            {{- if $poller.sampleStationsPath }}
            # ldbws only: a SECOND api endpoint, listing which stations to
            # sample (crates/poller-ldbws/src/config.rs).
            - name: API_SAMPLE_STATIONS_URL
              value: {{ printf "%s%s" (include "distant-signal.apiBaseUrl" $root) $poller.sampleStationsPath | quote }}
            {{- end }}
            {{- if $poller.numRows }}
            # ldbws only: LDBWS's own `numRows` query parameter.
            - name: NUM_ROWS
              value: {{ $poller.numRows | quote }}
            {{- end }}
            - name: POLL_INTERVAL_SECS
              value: {{ $poller.pollIntervalSecs | quote }}
            - name: RUST_LOG
              value: {{ $poller.logLevel | quote }}
            {{- with $poller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $poller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $poller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $poller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $poller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}

{{/*
One template, five Deployments. Everything that differs between the pollers
lives in the `.Values.pollers` map (baseUrlEnvVar, cadence, and ldbws's
extra vars), so this file branches on a poller's name only for its sink:
stations and incidents write Postgres directly (DATABASE_URL, phase 2),
ldbws, tfl and tocs XADD to their ds:ingest:* stream (REDIS_URL; plans 3a.7
and 3c.2), poller-incidents also publishes incident-text-changed and has
its row-heartbeat setting (ingest plan 2c,
distant-signal.pollerIncidentsIngestEnv), and poller-ldbws reads its sample
stations from Postgres (pollers.ldbws.internalReads, plan 4.7). Release B
(ingest phase 5) removed their /private HTTP paths.

Go templates iterate maps in sorted key order, so the rendered document
order is stable: incidents, ldbws, stations, tfl, tocs.
*/}}
{{- $root := . -}}
{{- range $name, $poller := .Values.pollers }}
{{- if $poller.enabled }}
{{- if not $poller.baseUrl }}
{{- fail (printf "pollers.%s.enabled is true but pollers.%s.baseUrl is empty. Set it to this feed's base URL (for the four Rail Data Marketplace pollers -- incidents, stations, tocs, ldbws -- the URL from your RDM subscription; tfl defaults to https://api.tfl.gov.uk). See the chart README's \"Enabling the pollers\" and local.env.example / dev.env.example in the repository root, or set pollers.%s.enabled=false." $name $name $name) }}
{{- end }}
{{- $component := printf "poller-%s" $name }}
{{- /* Pollers whose binary waits for its writes before a once-mode exit
(common::poller_loop::finish_once); docs/scheduled-jobs.md. */}}
{{- $mode := include "distant-signal.workloadMode" (dict "what" (printf "pollers.%s.mode" $name) "mode" $poller.mode "cronCapable" (has $name (list "tocs" "stations"))) }}
{{- /* poller-tfl's daily stops and routes jobs (pollers.tfl.stops.mode):
`cronjob` runs them as a CronJob of their own (TFL_JOBS=daily, RUN_ONCE)
and the Deployment runs the five-minute status poll alone
(TFL_JOBS=status). Both keep the poller-tfl component's labels. */}}
{{- $tflSplit := false }}
{{- if eq $name "tfl" }}
{{- $stops := $poller.stops | default dict }}
{{- $stopsMode := include "distant-signal.workloadMode" (dict "what" "pollers.tfl.stops.mode" "mode" $stops.mode "cronCapable" true) }}
{{- if eq $stopsMode "cronjob" }}
{{- if not $stops.enabled }}
{{- fail "pollers.tfl.stops.mode: cronjob needs pollers.tfl.stops.enabled: it runs the daily stops (and routes) jobs, which are off." }}
{{- end }}
{{- $tflSplit = true }}
{{- end }}
{{- end }}
{{- if eq $mode "cronjob" }}
{{- /* Once mode: one cycle unless the data is fresher than
skipIfFresherThanSecs, then exit. No /metrics listener: a run is gone
before Prometheus would scrape it (its alerts are the scheduled-job ones
and its ingest_freshness source's). These replace the same names in the
chart's env and extraEnv. */}}
{{- $once := list (dict "name" "RUN_ONCE" "value" "true") (dict "name" "RUN_ONCE_SKIP_IF_FRESHER_THAN_SECS" "value" ($poller.cron.skipIfFresherThanSecs | int | toString)) (dict "name" "METRICS_ENABLED" "value" "false") }}
{{- $env := include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.pollerEnv" (dict "root" $root "name" $name "poller" $poller)) "extra" (concat ($poller.extraEnv | default list) $once)) | fromYamlArray }}
---
{{ include "distant-signal.cronWorkerSpec" (dict "root" $root "component" $component "cron" $poller.cron "image" $poller.image "env" $env "workload" $poller) }}
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" (include "distant-signal.fullname" $root) $component | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" $root "component" $component) | nindent 4 }}
spec:
  revisionHistoryLimit: {{ include "distant-signal.revisionHistoryLimit" $ }}
  # Every poller is a singleton loop; a second copy would just duplicate
  # every upstream request and every ingest POST.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.podLabels" (dict "root" $root "component" $component) | nindent 8 }}
      {{- if or $root.Values.metrics.enabled $poller.podAnnotations }}
      annotations:
        {{- if $root.Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $root.Values.metrics.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with $poller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" $root }}
      automountServiceAccountToken: false
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" $poller.podSecurityContext) | nindent 8 }}
      containers:
        - name: {{ $component }}
          image: {{ include "distant-signal.image" (dict "root" $root "image" $poller.image) | quote }}
          imagePullPolicy: {{ $poller.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          # SVC-08/INF-9: /livez restarts a wedged poll loop. Liveness only:
          # nothing routes traffic to a poller. Between polls the loop counts
          # as alive (a 24h poller is not "stalled" for 24h); only a single
          # poll running past PROGRESS_STALL_SECS is.
          {{- include "distant-signal.workerHealthProbes" (dict "root" $root "port" $root.Values.workerHealth.port) | nindent 10 }}
          ports:
            - name: health
              containerPort: {{ $root.Values.workerHealth.port }}
              protocol: TCP
          {{- if $root.Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ $root.Values.metrics.port }}
              protocol: TCP
          {{- end }}
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.pollerEnv" (dict "root" $root "name" $name "poller" $poller "tflJobs" (ternary "status" "all" $tflSplit))) "extra" $poller.extraEnv) | trim | nindent 12 }}
          {{- with $poller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $poller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $poller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $poller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if $tflSplit }}
{{- /* The daily jobs once each (each skips while its snapshot is fresher
than skipIfFresherThanSecs), then exit; no /metrics. These replace the
same names in the chart's env and extraEnv. */}}
{{- $cron := $poller.stops.cron }}
{{- $once := list (dict "name" "TFL_JOBS" "value" "daily") (dict "name" "RUN_ONCE" "value" "true") (dict "name" "RUN_ONCE_SKIP_IF_FRESHER_THAN_SECS" "value" ($cron.skipIfFresherThanSecs | int | toString)) (dict "name" "METRICS_ENABLED" "value" "false") }}
{{- $env := include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.pollerEnv" (dict "root" $root "name" $name "poller" $poller "tflJobs" "daily")) "extra" (concat ($poller.extraEnv | default list) $once)) | fromYamlArray }}
---
{{ include "distant-signal.cronWorkerSpec" (dict "root" $root "component" $component "name" "poller-tfl-daily" "cron" $cron "image" $poller.image "env" $env "workload" $poller) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
This container's own env entries. distant-signal.mergeEnv renders them
with $poller.extraEnv, which replaces an entry of the same name.
*/ -}}
{{- define "distant-signal.pollerEnv" }}
{{- /* Takes dict "root", "name" and "poller" from the range above. */}}
{{- $root := .root }}
{{- $name := .name }}
{{- $poller := .poller }}
            - name: {{ $poller.baseUrlEnvVar }}
              value: {{ $poller.baseUrl | quote }}
            # Always rendered, unlike the port env var below: this is
            # the Rust-side toggle that actually stops the binary from
            # starting its /metrics listener (`metrics_enabled` in
            # crates/poller-*/src/config.rs). Omitting the port/env/annotations
            # alone would not -- Kubernetes container ports are purely
            # declarative -- so this must render "false" too, not vanish.
            - name: METRICS_ENABLED
              value: {{ $root.Values.metrics.enabled | quote }}
            {{- if $root.Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ $root.Values.metrics.port | quote }}
            {{- end }}
            # RDM_API_KEY for the four Rail Data Marketplace pollers; tfl
            # reads TFL_APP_KEY instead, because TfL's key goes in its own
            # `Ocp-Apim-Subscription-Key` header rather than RDM's
            # `x-apikey`. Defaulted so the four existing entries in
            # .Values.pollers need no change.
            - name: {{ $poller.apiKeyEnvVar | default "RDM_API_KEY" }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.pollerSecretName" (dict "root" $root "poller" $poller) }}
                  key: {{ include "distant-signal.pollerSecretKey" (dict "root" $root "name" $name "poller" $poller) }}
            {{- if include "distant-signal.pollerSinkDb" (dict "root" $root "name" $name "poller" $poller) }}
            # Ingest architecture phase 2 (stations, incidents): the poller
            # writes Postgres directly, as its own role
            # (postgresql.roles.perService.<name>.connect).
            {{- include "distant-signal.databaseEnvFor" (dict "root" $root "service" $name) | nindent 12 }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ $poller.ingest.database.maxConnections | int | quote }}
            {{- end }}
            {{- if include "distant-signal.pollerSinkStream" (dict "root" $root "name" $name "poller" $poller) }}
            # Ingest architecture phase 3 (ldbws, tfl, tocs): XADD each
            # snapshot to the poller's ds:ingest:* stream, as its own ACL
            # user (redis.acl.clients.poller<Name>); the ingest-writer
            # applies it.
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" $root | quote }}
            {{- include "distant-signal.redisClientAuthEnv" (dict "root" $root "client" (include "distant-signal.pollerRedisClient" $name) "user" (printf "poller-%s" $name)) }}
            {{- end }}
            {{- if eq $name "ldbws" }}
            # The sample-station list comes from Postgres (plan 4.5), as
            # the ldbws_ro role.
            {{- with include "distant-signal.internalReadsEnv" (dict "root" $root "role" "ldbws_ro") | trim }}{{ . | nindent 12 }}{{- end }}
            {{- end }}
            {{- if $poller.numRows }}
            # ldbws only: LDBWS's own `numRows` query parameter.
            - name: NUM_ROWS
              value: {{ $poller.numRows | quote }}
            {{- end }}
            - name: POLL_INTERVAL_SECS
              value: {{ $poller.pollIntervalSecs | quote }}
            {{- if and (eq $name "tfl") $poller.stops }}
            # tfl only: the daily stops job (pollers.tfl.stops), off by
            # default.
            - name: TFL_STOPS_ENABLED
              value: {{ $poller.stops.enabled | default false | quote }}
            {{- if $poller.stops.enabled }}
            - name: TFL_STOPS_INTERVAL_SECS
              value: {{ $poller.stops.intervalSecs | default 86400 | int | quote }}
            - name: TFL_STOPS_MAX_DROP_FRACTION
              value: {{ $poller.stops.maxDropFraction | default 0.2 | quote }}
            # The route-sequences job (pollers.tfl.stops.routes, DS-151):
            # only with the stops job, at its interval and drop fraction.
            - name: TFL_ROUTES_ENABLED
              value: {{ $poller.stops.routes | default false | quote }}
            {{- end }}
            # Which jobs this workload runs: all, or (pollers.tfl.stops.mode:
            # cronjob) the status poll here and the daily jobs in their
            # CronJob.
            - name: TFL_JOBS
              value: {{ .tflJobs | default "all" | quote }}
            {{- end }}
            {{- if $poller.hourlyRequestBudget }}
            # ldbws only (LEG-18): optional hourly LDBWS request budget.
            - name: HOURLY_REQUEST_BUDGET
              value: {{ $poller.hourlyRequestBudget | quote }}
            {{- end }}
            {{- if $poller.samplePinnedLinesOnly }}
            # ldbws only (LEG-18): sample only pinned lines' stations.
            - name: SAMPLE_PINNED_LINES_ONLY
              value: "true"
            {{- end }}
            {{- if $poller.sampleMaxStations }}
            # ldbws only (LEG-18): cap on the sample-station list.
            - name: SAMPLE_MAX_STATIONS
              value: {{ $poller.sampleMaxStations | quote }}
            {{- end }}
            {{- with $poller.trackedStops }}
            {{- if .enabled }}
            # ldbws only (DS-127): the tracked-stop board lane, with its own
            # per-cycle request cap.
            - name: TRACKED_STOP_POLL_ENABLED
              value: "true"
            - name: TRACKED_STOP_MAX_REQUESTS_PER_CYCLE
              value: {{ .maxRequestsPerCycle | default 20 | int | quote }}
            {{- end }}
            {{- end }}
            {{- with $poller.trackedStopArrivals }}
            {{- if .enabled }}
            {{- if not .secretName }}
            {{- fail "pollers.ldbws.trackedStopArrivals.enabled is true but trackedStopArrivals.secretName is empty. Set it to the existing Secret with the LDBWS arrivals product's url and consumer key (distant-signal-ldbws-arrivals), or set trackedStopArrivals.enabled=false." }}
            {{- end }}
            # ldbws only (DS-152): the tracked-stop lane's arrivals sub-lane,
            # with its own per-cycle request cap and its own RDM product,
            # whose URL and consumer key come from an existing Secret.
            - name: TRACKED_STOP_ARRIVALS_ENABLED
              value: "true"
            - name: TRACKED_STOP_ARRIVALS_MAX_REQUESTS_PER_CYCLE
              value: {{ .maxRequestsPerCycle | default 6 | int | quote }}
            - name: LDBWS_ARRIVALS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName | quote }}
                  key: {{ .urlKey | default "url" | quote }}
            - name: LDBWS_ARRIVALS_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName | quote }}
                  key: {{ .consumerKeyKey | default "consumer-key" | quote }}
            - name: LDBWS_ARRIVALS_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName | quote }}
                  key: {{ .consumerSecretKey | default "consumer-secret" | quote }}
                  optional: true
            {{- end }}
            {{- end }}
            # /livez + /healthz listener (SVC-08/INF-9) -- see workerHealth.
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int $root.Values.workerHealth.port) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ $poller.progressStallSecs | default $root.Values.workerHealth.pollerProgressStallSecs | quote }}
            - name: RUST_LOG
              value: {{ $poller.logLevel | quote }}
            {{- if eq $name "incidents" }}
            {{- include "distant-signal.pollerIncidentsIngestEnv" $root }}
            {{- end }}
{{- end }}

{{- /*
poller-incidents' ingest settings (pollers.incidents.ingest, ingest plan
2c.2/2c.6). Takes root.
*/ -}}
{{- define "distant-signal.pollerIncidentsIngestEnv" }}
{{- if include "distant-signal.pollerIncidentsDbSink" . }}
            # DATABASE_URL and
            # DATABASE_MAX_CONNECTIONS come from the shared phase 2 block
            # above. The incident-text-changed XADD, best effort.
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" . | quote }}
            {{- include "distant-signal.redisClientAuthEnv" (dict "root" . "client" "pollerIncidents" "user" "poller-incidents") }}
{{- end }}
{{- if include "distant-signal.incidentsRowHeartbeatOff" . }}
            # pollers.incidents.ingest.rowHeartbeat false (plan 2c.6); the
            # api gets the same value.
            - name: INCIDENTS_ROW_HEARTBEAT
              value: "false"
{{- end }}
{{- end }}

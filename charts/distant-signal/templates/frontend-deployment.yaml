apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distant-signal.frontendFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "frontend") | nindent 8 }}
      {{- with .Values.frontend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.frontend.podSecurityContext) | nindent 8 }}
      containers:
        - name: frontend
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            # readOnlyRootFilesystem is FALSE here, and only here. `next start`
            # writes its incremental cache under .next/cache at runtime, so a
            # read-only root filesystem makes this container fail on first
            # render. Every other workload in this chart is read-only.
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          env:
            - name: API_BASE_URL
              value: {{ default (include "distant-signal.apiBaseUrl" .) .Values.frontend.apiBaseUrl | quote }}
            # frontend/lib/siteOrigin.ts's own preferred source for
            # share/invite links and same-origin checks -- falls back to
            # the request's own Host header (with a one-time warning) when
            # empty, so leaving this unset does not break anything, just
            # loses the guarantee that those links use the deployment's
            # real public hostname rather than whatever Host header a
            # request happened to arrive with. 2026-09-25 Signal Box Audit
            # Low finding: declared and read by the frontend since the
            # site-origin work landed, but never wired into this chart --
            # masked in every environment so far by the graceful fallback,
            # not a working equivalent default.
            - name: NEXT_PUBLIC_SITE_URL
              value: {{ include "distant-signal.frontendSiteUrl" . | quote }}
            # frontend/lib/legal.ts: publishes the draft legal pages. Read
            # per request, so no image rebuild is needed to flip it.
            - name: LEGAL_PAGES_PUBLISHED
              value: {{ .Values.frontend.legalPagesPublished | toString | quote }}
            # frontend/lib/legal.ts retentionPolicy(): the privacy notice
            # states the api's own retention settings, so they are copied
            # from the api values rather than set twice (LEG-28, DQ7).
            - name: RETENTION_PAST_TRAVEL_DAYS
              value: {{ .Values.api.pastTravelRetentionDays | int | toString | quote }}
            - name: RETENTION_STALE_PUSH_SUBSCRIPTION_DAYS
              value: {{ .Values.api.stalePushSubscriptionDays | int | toString | quote }}
            - name: RETENTION_INACTIVE_ACCOUNT_DAYS
              value: {{ .Values.api.inactiveAccountRetentionDays | int | toString | quote }}
            {{- if .Values.railMcp.enabled }}
            {{- if not .Values.railMcp.baseUrl }}
            {{- fail "railMcp.enabled is true but railMcp.baseUrl is empty. Set it to the external HTTP base URL of the separately-deployed derived MCP service, or set railMcp.enabled=false." }}
            {{- end }}
            # The OAuth consent bridge (frontend/app/connect-claude/authorize/,
            # embedded-chatbot-shared-foundation-and-option-c plan Task 6) and
            # Option C's instructional page (Task 9) -- both no-ops, and
            # correctly absent, when railMcp is disabled. This is the first
            # component whose config needs to reach the frontend Deployment
            # at all, so there was no prior existing example of this guard
            # shape to model on (that plan's own Open questions/risks #5).
            # railMcp.baseUrl points at a SEPARATE, externally-deployed Helm
            # release of the derived MCP service -- this chart no longer
            # deploys that workload itself, so there is no in-cluster URL to
            # compute here any more.
            - name: RAILMCP_BASE_URL
              value: {{ .Values.railMcp.baseUrl | quote }}
            - name: RAILMCP_INTERNAL_COMPLETE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.railMcpSecretName" . }}
                  key: {{ include "distant-signal.railMcpInternalCompleteTokenSecretKey" . }}
            # Read at request time, not build time. Next inlines a literal
            # `process.env.NEXT_PUBLIC_*` reference at `next build` (in client
            # AND server code), and the image is built without this value, so
            # every reader goes through lib/csp.ts's runtimeRailMcpPublicUrl(),
            # which looks the name up indirectly: proxy.ts (CSP connect-src),
            # the /connect-claude page, and the /chat and /chat/callback
            # Server Components, which pass it to their Client Components as
            # a prop. No build-time bake is needed.
            - name: NEXT_PUBLIC_RAILMCP_PUBLIC_URL
              value: {{ .Values.railMcp.publicUrl | quote }}
            {{- end }}
            {{- with .Values.frontend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.path }}
              port: http
            periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.frontend.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.frontend.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.path }}
              port: http
            periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.frontend.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.frontend.probes.liveness.timeoutSeconds }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

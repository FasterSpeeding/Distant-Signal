{{- /*
poller-transit-schedule: one Deployment per enabled network
(pollerTransitSchedule.networks.<network>.enabled; transit networks spec
§13.1). Its only sink is its network's stream, ds:ingest:transit-<network>,
as its own Redis user (redis.acl.clients.pollerTransit<Network>), which the
ingest-writer must apply (ingestWriter.streams.transit-<network>: apply).
Recreate from creation: two pods must never XADD at once. A txc network
(Nottingham NET) with an ftp:// txcUrl reads its TNDS login from
txcCredentials.existingSecret (NET design §5).

timetableMode (tfl only for now; docs/scheduled-jobs.md): `deployment`
renders that Deployment, running both loops (TRANSIT_LOOPS=both);
`cronjob` renders instead a CronJob whose run is one timetable cycle
(TRANSIT_LOOPS=timetable, RUN_ONCE). A network with its situations loop on
would need that loop split into a Deployment of its own, which isn't built
yet (Metrolink, a later phase), so the chart refuses it.
*/}}
{{- $root := . }}
{{- $p := .Values.pollerTransitSchedule }}
{{- range $network, $n := $p.networks }}
{{- if $n.enabled }}
{{- $client := printf "pollerTransit%s" ($network | title) }}
{{- $component := "poller-transit-schedule" }}
{{- include "distant-signal.requireStreamApplied" (dict "root" $root "client" $client "stream" (printf "transit-%s" $network) "what" (printf "pollerTransitSchedule.networks.%s.enabled" $network)) }}
{{- if not (has (toString $n.adapter) (list "gtfs" "txc")) }}
{{- fail (printf "pollerTransitSchedule.networks.%s.adapter must be gtfs or txc (got %q)" $network (toString $n.adapter)) }}
{{- end }}
{{- if and (eq (toString $n.adapter) "txc") (hasPrefix "ftp://" (toString $n.txcUrl)) (not ($n.txcCredentials | default dict).existingSecret) }}
{{- fail (printf "pollerTransitSchedule.networks.%s: an ftp:// txcUrl (TNDS) needs txcCredentials.existingSecret, a Secret with the Traveline login (keys username and password; docs/transit-networks.md)" $network) }}
{{- end }}
{{- $refresh := toString (default "" $n.timetableRefresh) }}
{{- if and $refresh (not (regexMatch "^[A-Za-z0-9._:-]{1,64}$" $refresh)) }}
{{- fail (printf "pollerTransitSchedule.networks.%s.timetableRefresh must be 1-64 of A-Z a-z 0-9 . _ : - (got %q)" $network $refresh) }}
{{- end }}
{{- $what := printf "pollerTransitSchedule.networks.%s" $network }}
{{- $mode := include "distant-signal.workloadMode" (dict "what" (printf "%s.timetableMode" $what) "mode" $n.timetableMode "cronCapable" (has $network (list "tfl"))) }}
{{- if eq $mode "cronjob" }}
{{- if $n.situationsEnabled }}
{{- fail (printf "%s.timetableMode: cronjob needs situationsEnabled: false: a network's situations loop would need its own Deployment, which the chart doesn't render yet (docs/scheduled-jobs.md)." $what) }}
{{- end }}
{{- /* One timetable cycle, unless the stream's newest commit is fresher
than skipIfFresherThanSecs, then exit; no /metrics (a run is gone before a
scrape). These replace the same names in the chart's env and extraEnv. */}}
{{- $once := list (dict "name" "RUN_ONCE" "value" "true") (dict "name" "RUN_ONCE_SKIP_IF_FRESHER_THAN_SECS" "value" ($n.timetableCron.skipIfFresherThanSecs | int | toString)) (dict "name" "METRICS_ENABLED" "value" "false") }}
{{- $env := include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.pollerTransitScheduleEnv" (dict "root" $root "network" $network "n" $n "client" $client "loops" "timetable")) "extra" (concat ($n.extraEnv | default list) $once)) | fromYamlArray }}
---
{{ include "distant-signal.cronWorkerSpec" (dict "root" $root "component" $component "name" (printf "%s-%s" $component $network) "labels" (dict "distant-signal/transit-network" $network) "cron" $n.timetableCron "image" $p.image "env" $env "workload" $n "volumeMounts" (list (dict "name" "work" "mountPath" "/work")) "volumes" (list (dict "name" "work" "emptyDir" (dict "sizeLimit" $n.workDirSizeLimit)))) }}
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-poller-transit-schedule-%s" (include "distant-signal.fullname" $root) $network | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" $root "component" $component) | nindent 4 }}
    distant-signal/transit-network: {{ $network | quote }}
spec:
  revisionHistoryLimit: {{ include "distant-signal.revisionHistoryLimit" $ }}
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" $root "component" $component) | nindent 6 }}
      distant-signal/transit-network: {{ $network | quote }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.podLabels" (dict "root" $root "component" $component) | nindent 8 }}
        distant-signal/transit-network: {{ $network | quote }}
      {{- if or $root.Values.metrics.enabled $n.podAnnotations }}
      annotations:
        {{- if $root.Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $p.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with $n.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" $root }}
      automountServiceAccountToken: false
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" $n.podSecurityContext) | nindent 8 }}
      containers:
        - name: poller-transit-schedule
          image: {{ include "distant-signal.image" (dict "root" $root "image" $p.image) | quote }}
          imagePullPolicy: {{ $p.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          # /livez restarts a wedged loop; /healthz is 503
          # "stream_unavailable" while its last XADD failed.
          {{- include "distant-signal.workerHealthProbes" (dict "root" $root "port" $root.Values.workerHealth.port "readiness" true) | nindent 10 }}
          ports:
            - name: health
              containerPort: {{ $root.Values.workerHealth.port }}
              protocol: TCP
          {{- if $root.Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ $p.metricsPort }}
              protocol: TCP
          {{- end }}
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.pollerTransitScheduleEnv" (dict "root" $root "network" $network "n" $n "client" $client "loops" "both")) "extra" $n.extraEnv) | trim | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /work
          {{- with $n.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        # The GTFS or TXC zip (a zip needs a seekable file), deleted
        # after each parse.
        - name: work
          emptyDir:
            sizeLimit: {{ $n.workDirSizeLimit }}
      {{- with $n.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $n.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $n.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
One network's env entries. distant-signal.mergeEnv renders them with the
network's extraEnv, which replaces an entry of the same name. Takes (dict
"root" $ "network" <name> "n" <its values> "client" <redis.acl.clients key>
"loops" <TRANSIT_LOOPS: both or timetable>).
*/ -}}
{{- define "distant-signal.pollerTransitScheduleEnv" }}
{{- $root := .root }}
{{- $p := $root.Values.pollerTransitSchedule }}
{{- $n := .n }}
            - name: TRANSIT_NETWORK
              value: {{ .network | quote }}
            - name: TRANSIT_ADAPTER
              value: {{ $n.adapter | quote }}
            {{- with $n.gtfsUrl }}
            - name: TRANSIT_GTFS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $n.gtfsMaxBytes }}
            - name: TRANSIT_GTFS_MAX_BYTES
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with $n.txcUrl }}
            - name: TRANSIT_TXC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $n.txcMaxBytes }}
            - name: TRANSIT_TXC_MAX_BYTES
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- $creds := $n.txcCredentials | default dict }}
            {{- with $creds.existingSecret }}
            # The TNDS login (NET design §5).
            - name: TRANSIT_TXC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $creds.usernameKey | default "username" | quote }}
            - name: TRANSIT_TXC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $creds.passwordKey | default "password" | quote }}
            {{- end }}
            - name: TRANSIT_SITUATIONS_URL
              value: {{ $n.situationsUrl | quote }}
            - name: TRANSIT_NAPTAN_URL
              value: {{ $n.naptanUrl | quote }}
            - name: TRANSIT_TIMETABLE_INTERVAL_SECS
              value: {{ $n.timetableIntervalSecs | int64 | quote }}
            - name: TRANSIT_SITUATIONS_INTERVAL_SECS
              value: {{ $n.situationsIntervalSecs | int64 | quote }}
            - name: TRANSIT_SITUATIONS_ENABLED
              value: {{ $n.situationsEnabled | quote }}
            - name: TRANSIT_LOOPS
              value: {{ .loops | quote }}
            - name: TRANSIT_HORIZON_DAYS
              value: {{ $n.horizonDays | int64 | quote }}
            - name: FEED_MAX_DROP_FRACTION
              value: {{ $n.feedMaxDropFraction | quote }}
            - name: TRANSIT_TIMETABLE_REFRESH
              value: {{ toString (default "" $n.timetableRefresh) | quote }}
            - name: TRANSIT_WORK_DIR
              value: "/work"
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" $root | quote }}
            {{- include "distant-signal.redisClientAuthEnv" (dict "root" $root "client" .client "user" (printf "poller-transit-%s" .network)) }}
            - name: METRICS_ENABLED
              value: {{ $root.Values.metrics.enabled | quote }}
            {{- if $root.Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ $p.metricsPort | quote }}
            {{- end }}
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int $root.Values.workerHealth.port) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ $p.progressStallSecs | quote }}
            - name: RUST_LOG
              value: {{ $p.logLevel | quote }}
{{- end }}

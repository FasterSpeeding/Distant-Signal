apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-trust-backlog-consumer" (include "distant-signal.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "trust-backlog-consumer") | nindent 4 }}
spec:
  revisionHistoryLimit: {{ include "distant-signal.revisionHistoryLimit" $ }}
  # Single-consumer-group-per-deployment, same reasoning as every other
  # consumer in this chart (trust-consumer/full-coverage-consumer's own
  # replicaCount comments) -- this crate connects as one fixed Redis
  # Streams consumer name ("trust-event-backlog-1", see main.rs), so more
  # than one replica would fight over the same consumer identity.
  replicas: 1
  # trustBacklogConsumer.updateStrategy, default Recreate (rollout deadlock,
  # 2026-10-10): under the old default surge the new pod could not connect
  # as distant_signal_trust_backlog while the old one held its pool, so it
  # never became Ready and the old pod was never stopped. See
  # distant-signal.workerStrategy. The gap is safe: the consumer group keeps
  # every entry, and the new pod replays its own PEL (same consumer name).
  strategy:
    {{- include "distant-signal.workerStrategyBlock" (dict "root" . "key" "trustBacklogConsumer") | nindent 4 }}
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "trust-backlog-consumer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.podLabels" (dict "root" . "component" "trust-backlog-consumer") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.trustBacklogConsumer.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.trustBacklogConsumer.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.trustBacklogConsumer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.trustBacklogConsumer.podSecurityContext) | nindent 8 }}
      containers:
        - name: trust-backlog-consumer
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.trustBacklogConsumer.image) | quote }}
          imagePullPolicy: {{ .Values.trustBacklogConsumer.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.trustBacklogConsumer.healthPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.trustBacklogConsumer.metricsPort }}
              protocol: TCP
            {{- end }}
          # Real connected/disconnected semantics -- same reasoning as
          # trust-consumer/full-coverage-consumer's own probes (a
          # persistent Redis Streams consumer).
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
            # tolerate a real reconnect cycle before restarting the pod. /healthz
            # also goes 503 "stalled" once no loop iteration has completed for
            # progressStallSecs, so a wedged loop is restarted too.
            failureThreshold: 6
          # Env var names below are the uppercase-snake-case clap `env`
          # names crates/trust-backlog-consumer/src/config.rs actually
          # declares. No Kafka connection block at all, unlike
          # full-coverage-consumer -- this crate only ever speaks Redis
          # (Task 7's own decision).
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.trustBacklogConsumerEnv" .) "extra" .Values.trustBacklogConsumer.extraEnv) | trim | nindent 12 }}
          {{- with .Values.trustBacklogConsumer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.trustBacklogConsumer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.trustBacklogConsumer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.trustBacklogConsumer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- /*
This container's own env entries. distant-signal.mergeEnv renders them
with trustBacklogConsumer.extraEnv, which replaces an entry of the same name.
*/ -}}
{{- define "distant-signal.trustBacklogConsumerEnv" }}
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" . | quote }}
            {{- include "distant-signal.redisClientAuthEnv" (dict "root" . "client" "trustBacklogConsumer" "user" "trust-backlog-consumer") }}
            - name: REDIS_AUTOCLAIM_MIN_IDLE_SECS
              value: {{ .Values.trustBacklogConsumer.redisAutoclaimMinIdleSecs | quote }}
            - name: REDIS_GAP_CHECK_SECS
              value: {{ .Values.trustBacklogConsumer.redisGapCheckSecs | quote }}
            {{- if include "distant-signal.trustSinkDb" (dict "root" . "service" "trust_backlog") }}
            # Ingest architecture plan 3b.1: the backlog events and reason
            # codes go to Postgres directly, and STANOX/CRS is read from it,
            # as the trust_backlog role.
            {{- include "distant-signal.databaseEnvFor" (dict "root" . "service" "trust_backlog") | nindent 12 }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.trustBacklogConsumer.ingest.database.maxConnections | int | quote }}
            # The CORPUS fallback (api.corpusFallback), so the STANOX/CRS
            # reload returns what the api's own STANOX/CRS view does.
            - name: CORPUS_FALLBACK_ENABLED
              value: {{ .Values.api.corpusFallback.enabled | toString | quote }}
            {{- end }}
            - name: STANOX_CRS_RELOAD_SECS
              value: {{ .Values.trustBacklogConsumer.stanoxCrsReloadSecs | quote }}
            # STANOX_CRS_FILE is left at the binary's own default
            # (/app/reference-data/stanox-crs.csv) -- matches
            # docker/trust-backlog-consumer.Dockerfile's own COPY
            # destination, same as trust-consumer's identical default.
            # Matches the binary's own default (crates/trust-backlog-consumer/src/config.rs)
            # and where docker/trust-backlog-consumer.Dockerfile bakes the
            # catalogue in -- same pattern as aggregator/api/
            # full-coverage-consumer/schedule-reference, no volume mount
            # needed (confirmed against every one of those Deployments:
            # none of them mount a lines/ ConfigMap volume either, it's
            # baked into the image at build time).
            - name: LINES_DIR
              value: /app/lines
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.trustBacklogConsumer.healthPort) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ .Values.trustBacklogConsumer.progressStallSecs | quote }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.trustBacklogConsumer.metricsPort | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.trustBacklogConsumer.logLevel | quote }}
            # -- Finding #2's kill switch, mirroring
            # trustConsumer.trustTimestampCorrectionEnabled exactly (see
            # crates/trust-backlog-consumer/src/config.rs's
            # trust_timestamp_correction_enabled doc comment).
            - name: TRUST_TIMESTAMP_CORRECTION_ENABLED
              value: {{ .Values.trustBacklogConsumer.trustTimestampCorrectionEnabled | quote }}
            # The aggregator's prune window, so a rewound entry older than it
            # is not stored again (crates/trust-backlog-consumer/src/config.rs's
            # trust_event_backlog_retention_days doc comment).
            - name: TRUST_EVENT_BACKLOG_RETENTION_DAYS
              value: {{ .Values.aggregator.trustEventBacklogRetentionDays | quote }}
{{- end }}

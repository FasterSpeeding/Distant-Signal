{{/*
ClusterIP for the chat orchestrator's HTTP transport. Unlike
railmcp-service.yaml, no external Ingress/TLS is sketched here -- and none
ever should be: Decision 2 of the dual-mode design requires this service is
never reachable from outside the cluster (it holds DS's own paid
ANTHROPIC_API_KEY). frontend/app/api/chat/route.ts (Task 4) is this
Service's only intended caller, over ORCHESTRATOR_BASE_URL
(frontend-deployment.yaml). Deliberately no `orchestrator` entry anywhere
in ingress.yaml.
*/}}
{{- if .Values.orchestrator.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distant-signal.orchestratorFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "orchestrator") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "distant-signal.selectorLabels" (dict "root" . "component" "orchestrator") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.orchestrator.service.port }}
      targetPort: http
{{- end }}

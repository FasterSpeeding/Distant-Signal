{{- if .Values.movementRelay.enabled }}
{{- /*
On by default: trust-consumer, full-coverage-consumer and
trust-backlog-consumer all read the movement-events stream that only this
Deployment writes. Each Kafka setting falls back to trustConsumer.kafka.*
(see _helpers.tpl), so these guards fire only when neither place is set.
*/}}
{{- $brokers := include "distant-signal.movementRelayKafkaBrokers" . }}
{{- $topic := include "distant-signal.movementRelayKafkaTopic" . }}
{{- $group := include "distant-signal.movementRelayKafkaConsumerGroup" . }}
{{- $mechanism := include "distant-signal.movementRelayKafkaSaslMechanism" . }}
{{- $optOut := "or set movementRelay.enabled=false if this install does not ingest TRUST train movements (trust-consumer, full-coverage-consumer and trust-backlog-consumer then read an empty stream)" }}
{{- if not $brokers }}
{{- fail (printf "movement-relay is enabled (the default) but has no Kafka broker. Set movementRelay.kafka.brokers or trustConsumer.kafka.brokers to the RDM Train Movements broker address(es), %s." $optOut) }}
{{- end }}
{{- if not $topic }}
{{- fail (printf "movement-relay is enabled (the default) but has no Kafka topic. Set movementRelay.kafka.topic or trustConsumer.kafka.topic to the RDM Train Movements topic, %s." $optOut) }}
{{- end }}
{{- if not $group }}
{{- fail (printf "movement-relay is enabled (the default) but has no Kafka consumer group. Set movementRelay.kafka.consumerGroup or trustConsumer.kafka.consumerGroup to the RDM-issued group id (SC-... in production), %s." $optOut) }}
{{- end }}
{{- if not $mechanism }}
{{- fail (printf "movement-relay is enabled (the default) but has no Kafka SASL mechanism. Set movementRelay.kafka.saslMechanism or trustConsumer.kafka.saslMechanism (e.g. PLAIN), %s." $optOut) }}
{{- end }}
{{- /*
Two members of one consumer group split its partitions, so each would see
only part of the feed. Refuse a consumer still on the legacy direct Kafka
path sharing movement-relay's group.
*/}}
{{- if and (eq .Values.trustConsumer.movementFeed "kafka") (eq $group .Values.trustConsumer.kafka.consumerGroup) }}
{{- fail (printf "trustConsumer.movementFeed=kafka and movement-relay would join the same Kafka consumer group (%s) and split its partitions. Use trustConsumer.movementFeed=redis-stream (the default), or set movementRelay.enabled=false to keep the legacy direct connection." $group) }}
{{- end }}
{{- if and (eq .Values.fullCoverageConsumer.movementFeed "kafka") (eq $group .Values.fullCoverageConsumer.kafka.consumerGroup) }}
{{- fail (printf "fullCoverageConsumer.movementFeed=kafka and movement-relay would join the same Kafka consumer group (%s) and split its partitions. Use fullCoverageConsumer.movementFeed=redis-stream (the default), or set movementRelay.enabled=false." $group) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-movement-relay" (include "distant-signal.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "movement-relay") | nindent 4 }}
spec:
  replicas: 1
  # Explicit, unlike trust-consumer/full-coverage-consumer's own
  # undeclared (default-25%/25%) strategy: a rolling update here MUST NOT
  # have zero members ready before a new one takes over -- see the design
  # doc's Decision 5. This is the OPPOSITE intent from every Recreate-typed
  # Deployment in this chart (aggregator, notifier, poller-deployments,
  # schedulefeed), stated explicitly for the same reason they state theirs.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "movement-relay") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "movement-relay") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.movementRelay.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.movementRelay.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.movementRelay.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.movementRelay.podSecurityContext) | nindent 8 }}
      containers:
        - name: movement-relay
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.movementRelay.image) | quote }}
          imagePullPolicy: {{ .Values.movementRelay.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.movementRelay.healthPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.movementRelay.metricsPort }}
              protocol: TCP
            {{- end }}
          # Readiness means "confirmed Kafka partition assignment" (a
          # rebalance-callback-driven signal, crates/movement-relay/src/health.rs),
          # NOT "at least one message arrived" -- deliberately tighter than
          # trust-consumer's own probe. See that file's own doc comment.
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          # Liveness is /livez (loop progress only), NOT /healthz: readiness
          # is legitimately false while Redis is unavailable (the relay waits
          # for it before joining the Kafka group) and during a slow group
          # rebalance, and restarting the pod fixes neither. Liveness on
          # /healthz SIGKILLed the relay ~2 minutes into every rollout that
          # also recreated the Redis pod.
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
            # /livez goes 503 "stalled" once no loop iteration has completed
            # for progressStallSecs, so a wedged loop is restarted too.
            failureThreshold: 6
          env:
            - name: KAFKA_BROKERS
              value: {{ $brokers | quote }}
            - name: KAFKA_TOPIC
              value: {{ $topic | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ $group | quote }}
            - name: KAFKA_SASL_MECHANISM
              value: {{ $mechanism | quote }}
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.movementRelaySecretName" . }}
                  key: {{ include "distant-signal.movementRelaySaslUsernameKey" . }}
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.movementRelaySecretName" . }}
                  key: {{ include "distant-signal.movementRelaySaslPasswordKey" . }}
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" . | quote }}
            {{- include "distant-signal.redisPasswordEnv" . }}
            - name: STREAM_LAG_POLL_SECS
              value: {{ .Values.movementRelay.streamLagPollSecs | quote }}
            - name: MOVEMENT_STREAM_MAXLEN
              value: {{ int64 .Values.movementRelay.streamMaxLen | quote }}
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.movementRelay.healthPort) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ .Values.movementRelay.progressStallSecs | quote }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.movementRelay.metricsPort | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.movementRelay.logLevel | quote }}
            {{- with .Values.movementRelay.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.movementRelay.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.movementRelay.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.movementRelay.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.movementRelay.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

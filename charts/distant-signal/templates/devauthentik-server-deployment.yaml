{{- if .Values.devAuthentik.enabled }}
{{/*
Same $redirectUrl computation api-deployment.yaml uses (an operator's
explicit api.sso.redirectUrl always wins over the devAuthentik-computed
default) -- passed through below as SSO_REDIRECT_URL so the
oauth2-client.yaml blueprint's `!Env [SSO_REDIRECT_URL, ...]` registers
the SAME redirect_uris value crates/api itself uses, rather than a second,
independently-fixed copy that can silently drift from it (confirmed live:
this is exactly what broke when SSO_REDIRECT_URL was pointed at a real
remote-access hostname instead of the devAuthentik default).
*/}}
{{- $redirectUrl := .Values.api.sso.redirectUrl | default (include "distant-signal.devAuthentikRedirectUrl" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distant-signal.devAuthentikFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "devauthentik-server") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "devauthentik-server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "devauthentik-server") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" dict) | nindent 8 }}
      containers:
        - name: authentik-server
          image: {{ printf "%s:%s" .Values.devAuthentik.image.repository .Values.devAuthentik.image.tag | quote }}
          imagePullPolicy: {{ .Values.devAuthentik.image.pullPolicy }}
          args: ["server"]
          securityContext:
            # readOnlyRootFilesystem is FALSE here. Authentik (Django/
            # gunicorn) is a third-party image whose maintainers never
            # designed it for a read-only root filesystem, and it plausibly
            # writes temp files beyond the /dev/shm mount below -- same
            # posture as frontend-deployment.yaml, redis-deployment.yaml and
            # both postgres StatefulSets. This chart's OWN Rust binaries stay
            # read-only.
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.devAuthentikSecretName" . }}
                  key: {{ include "distant-signal.devAuthentikSecretKeySecretKey" . }}
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: {{ include "distant-signal.devAuthentikPostgresFullname" . }}
            - name: AUTHENTIK_POSTGRESQL__USER
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.devAuthentikSecretName" . }}
                  key: {{ include "distant-signal.devAuthentikPostgresSecretKey" . }}
            # Deliberately NOT set: AUTHENTIK_BOOTSTRAP_PASSWORD/_HASH/
            # _EMAIL/_TOKEN -- see values.yaml's devAuthentik header comment
            # and the design doc's Bootstrap section. No default admin; the
            # blueprints ConfigMap mounted below provisions everything a
            # developer actually needs.
            #
            # Telemetry -- same two vars and same rationale as
            # docker-compose.authentik.yml's &authentik-env anchor, confirmed
            # against https://docs.goauthentik.io/install-config/configuration/
            # for 2026.8.0: AUTHENTIK_ERROR_REPORTING__ENABLED already
            # defaults to "false" (pinned explicitly in case a future
            # authentik version changes that default) but
            # AUTHENTIK_DISABLE_UPDATE_CHECK defaults to "false" too, i.e.
            # the inbuilt update-checker is ON and phones home unless told
            # otherwise.
            - name: AUTHENTIK_ERROR_REPORTING__ENABLED
              value: "false"
            - name: AUTHENTIK_DISABLE_UPDATE_CHECK
              value: "true"
            - name: SSO_REDIRECT_URL
              value: {{ $redirectUrl | quote }}
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/local
              readOnly: true
            # The reference compose sets shm_size: 512mb (Django/Postgres
            # shared-memory headroom); Kubernetes has no direct equivalent
            # field, so the translation is an explicitly-sized emptyDir
            # mounted at /dev/shm. The design doc's own Research mentions
            # shm_size only in its docker-compose research pass, not
            # separately for Helm -- this is a straightforward compose ->
            # Kubernetes translation of the same documented requirement,
            # not an independently researched decision, and it has not been
            # verified against real container behaviour; confirm 512Mi is
            # sufficient before relying on this in a real deployment.
            - name: dshm
              mountPath: /dev/shm
          # Authentik's /-/health/live/ and /-/health/ready/ paths are NOT
          # independently confirmed by the design doc's research pass (its
          # Non-goals explicitly exclude hardening Authentik itself).
          # Verify against real container behaviour before trusting these;
          # a plain TCP probe on the container port is the safe fallback if
          # either path turns out wrong.
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          {{- with .Values.devAuthentik.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: blueprints
          configMap:
            name: {{ include "distant-signal.devAuthentikFullname" . }}-blueprints
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
      {{- with .Values.devAuthentik.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.devAuthentik.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.devAuthentik.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

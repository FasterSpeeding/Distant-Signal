{{- if .Values.scheduleFeed.enabled }}
{{/*
Chart-rendered Secret for scheduleFeed -- an independent, fully opt-in
subsystem (like devAuthentik) with no chart-wide existingSecret escape
hatch of its own, so it gets its own Secret object rather than sharing
secret.yaml's. Two independent concerns live in it:

1. THIS APP's own SSH host key (ssh_host_ed25519_key), generated once and
   preserved across upgrades. This is the INVERTED situation from a design
   that would need to verify a third party's (DTD's) host key -- no such
   verification exists anywhere in this design (see
   docs/superpowers/specs/2026-09-01-schedule-feed-push-design.md): DTD
   pushes files to THIS app's SFTP server, so it is this app's server
   identity that DTD's push client trusts, and this app that must keep the
   same key across `helm upgrade`s. Uses the SAME lookup-preserve pattern
   secret.yaml/devauthentik-secret.yaml already use -- see secret.yaml's
   header comment for why it is load-bearing, not stylistic: without it,
   every `helm upgrade` would call genPrivateKey again and rotate the host
   key out from under whatever fingerprint DTD has already been told to
   trust, breaking delivery until DTD's operators re-confirm the new one.

   genPrivateKey "ed25519" is confirmed (via `helm template` against a
   throwaway chart, ahead of this file) to render a real PEM-encoded
   PKCS8 private key ("-----BEGIN PRIVATE KEY-----..."), not an error
   string or placeholder -- see this task's implementation report for the
   verification output.

2. The DTD account credential (password and/or public key), deliberately
   NEVER auto-generated -- identical reasoning to pollers.*.apiKey in
   secret.yaml: a random value here would be meaningless, since nothing on
   DTD's side would recognize it. Rendered (possibly empty) only when no
   existingSecret is configured, so schedulefeed-deployment.yaml's
   secretKeyRefs always resolve instead of wedging in
   CreateContainerConfigError; when scheduleFeed.sftp.existingSecret IS
   set, this chart's own Secret does not also try to hold a competing copy,
   matching the poller pattern.
*/}}
{{- $secretName := include "distant-signal.scheduleFeedSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := default (dict) $existing.data -}}
{{- $data := dict -}}

{{- $hostKeyKey := include "distant-signal.scheduleFeedHostKeySecretKey" . -}}
{{- $hostKey := get $existingData $hostKeyKey | b64dec | default (genPrivateKey "ed25519") -}}
{{- $_ := set $data $hostKeyKey ($hostKey | b64enc) -}}

{{- if not .Values.scheduleFeed.sftp.existingSecret -}}
{{- $_ := set $data (include "distant-signal.scheduleFeedDtdPasswordSecretKey" .) (.Values.scheduleFeed.sftp.password | default "" | b64enc) -}}
{{- $_ := set $data (include "distant-signal.scheduleFeedDtdPublicKeySecretKey" .) (.Values.scheduleFeed.sftp.publicKey | default "" | b64enc) -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "schedulefeed") | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

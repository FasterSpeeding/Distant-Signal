{{- if .Values.pollerIrishRailLive.enabled }}
{{- if not (trim (.Values.api.internalOauth.groups.irishRailLive | default "")) }}
{{- fail "pollerIrishRailLive.enabled needs api.internalOauth.groups.irishRailLive: the Authentik group this poller's service account is in (empty closes its api routes)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-poller-irish-rail-live" (include "distant-signal.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "poller-irish-rail-live") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "poller-irish-rail-live") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "poller-irish-rail-live") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.pollerIrishRailLive.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.pollerIrishRailLive.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.pollerIrishRailLive.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.pollerIrishRailLive.podSecurityContext) | nindent 8 }}
      containers:
        - name: poller-irish-rail-live
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.pollerIrishRailLive.image) | quote }}
          imagePullPolicy: {{ .Values.pollerIrishRailLive.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          # SVC-08/INF-9: /livez restarts a wedged poll loop. Liveness only:
          # nothing routes traffic to a poller.
          {{- include "distant-signal.workerHealthProbes" (dict "root" . "port" .Values.workerHealth.port) | nindent 10 }}
          ports:
            - name: health
              containerPort: {{ .Values.workerHealth.port }}
              protocol: TCP
          {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.pollerIrishRailLive.metricsPort }}
              protocol: TCP
          {{- end }}
          env:
            - name: IRISH_RAIL_BASE_URL
              value: {{ .Values.pollerIrishRailLive.irishRailBaseUrl | quote }}
            - name: API_INGEST_URL
              value: {{ printf "%s%s" (include "distant-signal.apiBaseUrl" .) .Values.pollerIrishRailLive.apiIngestPath | quote }}
            - name: INTERNAL_OAUTH_TOKEN_URL
              value: {{ .Values.internalOauth.tokenUrl | quote }}
            - name: INTERNAL_OAUTH_CLIENT_ID
              value: {{ .Values.internalOauth.clientId | quote }}
            - name: INTERNAL_OAUTH_SCOPE
              value: {{ .Values.internalOauth.scope | quote }}
            - name: INTERNAL_OAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.pollerIrishRailLiveSecretName" . }}
                  key: {{ include "distant-signal.pollerIrishRailLiveOauthUsernameSecretKey" . }}
            - name: INTERNAL_OAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.pollerIrishRailLiveSecretName" . }}
                  key: {{ include "distant-signal.pollerIrishRailLiveOauthPasswordSecretKey" . }}
            - name: POLL_INTERVAL_SECS
              value: {{ .Values.pollerIrishRailLive.pollIntervalSecs | quote }}
            {{- if .Values.pollerIrishRailLive.stationCodesOverride }}
            - name: STATION_CODES_OVERRIDE
              value: {{ .Values.pollerIrishRailLive.stationCodesOverride | quote }}
            {{- end }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.pollerIrishRailLive.metricsPort | quote }}
            {{- end }}
            # /livez + /healthz listener (SVC-08/INF-9) -- see workerHealth.
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.workerHealth.port) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ .Values.pollerIrishRailLive.progressStallSecs | quote }}
            - name: RUST_LOG
              value: {{ .Values.pollerIrishRailLive.logLevel | quote }}
            {{- with .Values.pollerIrishRailLive.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.pollerIrishRailLive.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.pollerIrishRailLive.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pollerIrishRailLive.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pollerIrishRailLive.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{/*
Sibling to ingress.yaml, not an extension of it -- Ingress is HTTP(S)-only
and cannot carry SFTP traffic. This Service is what an operator points a
cloud LoadBalancer (or a NodePort + external LB/DNS) at to actually expose
scheduleFeed's SFTP receiver to DTD; see values.yaml's scheduleFeed.service
comment for why LoadBalancer is the default here, unlike every HTTP
workload in this chart.
*/}}
{{- if and .Values.scheduleFeed.enabled .Values.scheduleFeed.sftp.enabled }}
{{- with .Values.scheduleFeed.service.externalTrafficPolicy }}
{{- if not (has . (list "Local" "Cluster")) }}
{{- fail (printf "scheduleFeed.service.externalTrafficPolicy must be \"Local\" or \"Cluster\" (or empty), got %q" .) }}
{{- end }}
{{- if not (has $.Values.scheduleFeed.service.type (list "NodePort" "LoadBalancer")) }}
{{- fail (printf "scheduleFeed.service.externalTrafficPolicy only applies when scheduleFeed.service.type is NodePort or LoadBalancer (got %q); Kubernetes rejects it on other Service types. Unset it, or change the type." $.Values.scheduleFeed.service.type) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distant-signal.scheduleFeedFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "schedulefeed") | nindent 4 }}
  {{- with .Values.scheduleFeed.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.scheduleFeed.service.type }}
  {{- with .Values.scheduleFeed.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    {{- include "distant-signal.selectorLabels" (dict "root" . "component" "schedulefeed") | nindent 4 }}
  ports:
    - name: sftp
      port: {{ .Values.scheduleFeed.sftp.port }}
      targetPort: sftp
      {{- if .Values.scheduleFeed.service.nodePort }}
      nodePort: {{ .Values.scheduleFeed.service.nodePort }}
      {{- end }}
{{- end }}

{{- /*
postgresql.roles (docs/postgres-app-role.md): the role setup script, and the
hook Job that runs it on an existing cluster. Both render nothing unless
postgresql.roles.initScript (with roles.enabled) or roles.setupJob.enabled.

files/postgres-roles.sql is idempotent: it creates or updates the owner,
app, exporter, dump and backup roles, moves schema public and everything
in it from auth.username (the bootstrap superuser) to the owner, and
grants the app role DML only.

Hook order (docs/postgres-app-role.md "Hook order"). On an upgrade the
setup Job is a pre-upgrade hook, weight 0: after the migrate hook Job
(weight -5), so the new tables exist, and before any Deployment rolls, so
a new pod's schema gate finds its grants (the 2026-10-14 ingest-writer
deadlock: as a post-upgrade hook it waited on the upgrade's wait, which
waited on that pod). distant-signal.postgresRolesSetupJobHook says when it
stays post-upgrade. On an install it is post-install, weight 0, after the
migrate Job's -5.

A pre-upgrade hook runs before the release's own resources change, so the
Job reads nothing from them: its SQL is in its own hook ConfigMap and its
NetworkPolicies are hooks, all pre-install,pre-upgrade, weight -10,
replaced on the next release (before-hook-creation) and left in the
cluster in between, like the migrate Job's. Turning setupJob off leaves
them until deleted by hand (`kubectl delete configmap,networkpolicy -l
app.kubernetes.io/component=postgres-roles`). The release ConfigMap below
is only the initdb script's (the Postgres pod mounts it).
*/}}
{{- $initScript := include "distant-signal.postgresRolesInitScript" . }}
{{- $setupJob := include "distant-signal.postgresRolesSetupJob" . }}
{{- /* Stage 0b (postgresql.roles.perService): files/postgres-grants.sql,
     generated from files/db-grants.yaml, runs after postgres-roles.sql. */}}
{{- $perService := include "distant-signal.perServiceEnabled" . }}
{{- $setupName := printf "%s-setup" (include "distant-signal.postgresRolesConfigMapName" .) | trunc 63 | trimSuffix "-" }}
{{- $sqlData := include "distant-signal.postgresRolesSqlData" . }}
{{- if $initScript }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "distant-signal.postgresRolesConfigMapName" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "postgres-roles") | nindent 4 }}
data:
  {{- $sqlData | nindent 2 }}
  {{- /*
  Run by the official image's entrypoint from /docker-entrypoint-initdb.d,
  on an EMPTY data directory only, against the temporary socket-only server
  it starts after initdb, as POSTGRES_USER. Executable (the volume's
  defaultMode), so the entrypoint runs it rather than sourcing it. The .sql
  file is mounted elsewhere: the entrypoint would run any *.sql it finds
  there itself, without the variables.
  */}}
  10-distant-signal-roles.sh: |
    #!/bin/sh
    # postgresql.roles.initScript: create the separate roles on a new cluster
    # (charts/distant-signal/files/postgres-roles.sql). Passwords come from
    # the DS_PG_*_PASSWORD env.
    set -eu
    {{- if $perService }}
    psql -X --quiet --no-password --username "${POSTGRES_USER:?}" --dbname "${POSTGRES_DB:?}" \
    {{- else }}
    exec psql -X --quiet --no-password --username "${POSTGRES_USER:?}" --dbname "${POSTGRES_DB:?}" \
    {{- end }}
      {{- range splitList "\n" (include "distant-signal.postgresRolesPsqlVariables" .) }}
      {{ . | squote }} \
      {{- end }}
      --file=/etc/distant-signal/postgres-roles/postgres-roles.sql
    {{- if $perService }}
    # postgresql.roles.perService: the per-service roles (Stage 0b).
    exec psql -X --quiet --no-password --username "${POSTGRES_USER:?}" --dbname "${POSTGRES_DB:?}" \
      {{- range splitList "\n" (include "distant-signal.postgresGrantsPsqlVariables" .) }}
      {{ . | squote }} \
      {{- end }}
      --file=/etc/distant-signal/postgres-roles/postgres-grants.sql
    {{- end }}
{{- end }}
{{- if $setupJob }}
---
# The Job's SQL, this release's: a hook created before the Job (see above).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $setupName }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "postgres-roles") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- $sqlData | nindent 2 }}
{{- if .Values.networkPolicy.enabled }}
---
# Admits the setup Job's pods to Postgres, in addition to the postgres
# policy in networkpolicy.yaml (NetworkPolicies are additive): a hook, so
# it is in place before a pre-upgrade Job even in the release that turns
# the Job on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-from-postgres-roles" (include "distant-signal.postgresFullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "postgres-roles") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "distant-signal.selectorLabels" (dict "root" . "component" "postgres-roles") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.service.port }}
{{- /* Its egress (with egress policies on), named after the Job, not
     <fullname>-postgres-roles: that name was a release resource until
     2026-10-14, and Helm deletes a resource the new release no longer has
     after the pre-upgrade hooks, which would take a same-named hook with
     it on the first upgrade with this change. */}}
{{- with include "distant-signal.jobEgressNetworkPolicy" (dict "root" . "component" "postgres-roles" "name" $setupName "deps" (dict "postgres" true) "hook" "pre-install,pre-upgrade") }}
---
{{ . }}
{{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $setupName }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "postgres-roles") | nindent 4 }}
  annotations:
    # A hook, so it runs again on every install and upgrade and a failure
    # fails the release: pre-upgrade after the migrate Job (weight -5), or
    # post-install / post-upgrade (see above).
    # before-hook-creation keeps the last run's pod and logs until the next.
    helm.sh/hook: {{ include "distant-signal.postgresRolesSetupJobHook" . }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ int64 .Values.postgresql.roles.setupJob.backoffLimit }}
  activeDeadlineSeconds: {{ int64 .Values.postgresql.roles.setupJob.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.podLabels" (dict "root" . "component" "postgres-roles") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- $defaults := dict "runAsNonRoot" true "runAsUser" 999 "runAsGroup" 999 "seccompProfile" (dict "type" "RuntimeDefault") }}
        {{- toYaml (mergeOverwrite $defaults (default (dict) .Values.postgresql.roles.setupJob.podSecurityContext | deepCopy)) | nindent 8 }}
      containers:
        - name: postgres-roles
          # The Postgres image itself: its psql matches the server, and the
          # node already has it.
          image: {{ include "distant-signal.postgresImage" . | quote }}
          imagePullPolicy: {{ include "distant-signal.postgresImagePullPolicy" . }}
          # The image's entrypoint only starts a server for `postgres`
          # commands; anything else it execs as given.
          command:
            - sh
            - -c
            - |
              set -eu
              # On a fresh install this runs while Postgres is still starting.
              until pg_isready --quiet; do sleep 2; done
              {{- if $perService }}
              psql -X --quiet --no-password \
              {{- else }}
              exec psql -X --quiet --no-password \
              {{- end }}
              {{- range splitList "\n" (include "distant-signal.postgresRolesPsqlVariables" .) }}
                {{ . | squote }} \
              {{- end }}
                --file=/etc/distant-signal/postgres-roles/postgres-roles.sql
              {{- if $perService }}
              # postgresql.roles.perService: the per-service roles (Stage 0b).
              exec psql -X --quiet --no-password \
              {{- range splitList "\n" (include "distant-signal.postgresGrantsPsqlVariables" .) }}
                {{ . | squote }} \
              {{- end }}
                --file=/etc/distant-signal/postgres-roles/postgres-grants.sql
              {{- end }}
          env:
            # libpq's own variables: the superuser, over the Service.
            - name: PGHOST
              value: {{ include "distant-signal.postgresFullname" . | quote }}
            - name: PGPORT
              value: {{ .Values.postgresql.service.port | quote }}
            - name: PGUSER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.postgresSecretName" . }}
                  key: {{ include "distant-signal.postgresSecretPasswordKey" . }}
            - name: PGAPPNAME
              value: distant-signal-postgres-roles
            - name: PGCONNECT_TIMEOUT
              value: "10"
            {{- include "distant-signal.postgresRolesPasswordEnv" . | trim | nindent 12 }}
            # psql's history and the like; the root filesystem is read-only.
            - name: HOME
              value: /tmp
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          {{- with .Values.postgresql.roles.setupJob.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: roles
              mountPath: /etc/distant-signal/postgres-roles
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: roles
          configMap:
            name: {{ $setupName }}
            items:
              - key: postgres-roles.sql
                path: postgres-roles.sql
              {{- if $perService }}
              - key: postgres-grants.sql
                path: postgres-grants.sql
              {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
{{- end }}

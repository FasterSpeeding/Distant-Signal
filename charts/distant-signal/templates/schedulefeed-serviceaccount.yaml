{{- /*
schedulefeed's own ServiceAccount (scheduleFeed.serviceAccount.create, off
by default), required by scheduleFeed.bucket.auth=workloadIdentity: Google's
workload identity provider is pinned to this account's subject
(system:serviceaccount:<namespace>:<name>), so no other pod in the release
can impersonate the bucket reader. No RBAC binds it to anything, and its API
token is never automounted: the ingest container only mounts an
audience-bound projected token (templates/schedulefeed-deployment.yaml).
*/}}
{{- if and .Values.scheduleFeed.enabled (.Values.scheduleFeed.serviceAccount).create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "distant-signal.scheduleFeedServiceAccountName" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "schedulefeed") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

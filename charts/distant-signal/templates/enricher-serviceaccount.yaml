{{- /*
The enricher's own ServiceAccount (enricher.serviceAccount.create, off by
default), required by the workload identity modes (enricher.llm.auth): the
OpenAI or Authentik trust rule matches this account's subject
(system:serviceaccount:<namespace>:<name>), so no other pod in the release
can mint OpenAI tokens. No RBAC binds it to anything, and its API token is
never automounted: the enricher only mounts an audience-bound projected
token (templates/enricher-deployment.yaml).
*/}}
{{- if (.Values.enricher.serviceAccount).create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "distant-signal.enricherServiceAccountName" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "enricher") | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

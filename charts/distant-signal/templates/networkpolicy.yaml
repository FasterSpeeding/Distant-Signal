{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
{{/*
Reusable pieces. Each policy below is default-deny for ingress (an empty or
absent `ingress:` list denies everything) plus the specific allows the
service actually needs.
*/}}
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distant-signal.postgresFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # EXACTLY the workloads whose container env includes DATABASE_URL, i.e.
    # every consumer of `distant-signal.databaseEnv` in this templates/
    # directory. Keep this list derived from that helper, not from memory:
    #   grep -l 'distant-signal.databaseEnv' templates/*.yaml
    # `notifier` was missing here until 2026-09-25 (it reads DATABASE_URL via
    # the same helper -- notifier-deployment.yaml -- and does nothing else but
    # poll those tables), so turning networkPolicy.enabled on would have
    # silently stopped every push notification this app sends.
    #
    # The pollers/consumers really do NOT belong here: they reach the database
    # only indirectly, by POSTing to api's /private/* ingest endpoints (see the
    # api policy below, which is where they are allow-listed).
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - {{ .Release.Name }}
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - api
                  - aggregator
                  - enricher
                  - notifier
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.service.port }}
---
{{- end }}
{{- if .Values.redis.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distant-signal.redisFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # EXACTLY the workloads whose container env includes REDIS_URL, i.e. every
    # consumer of `distant-signal.redisUrl` in this templates/ directory. Keep
    # this list derived from that helper, not from memory:
    #   grep -l 'distant-signal.redisUrl' templates/*.yaml
    #
    # The original comment here ("api publishes incident-text-changed events,
    # enricher consumes them. Nothing else touches the queue.") was true when
    # it was written and has been wrong since; four more workloads have grown
    # a REDIS_URL of their own, and all four were missing until 2026-09-25:
    #   - trust-consumer         -- its own durable movement queue
    #   - trust-backlog-consumer -- drains the TRUST event backlog
    #   - full-coverage-consumer -- its own movement stream
    #   - movement-relay         -- publishes the redis-stream MovementFeed
    # Every one of those is a queue producer or consumer whose ONLY job is
    # Redis, so `networkPolicy.enabled=true` did not degrade them, it stopped
    # them dead.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - {{ .Release.Name }}
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - api
                  - enricher
                  - trust-consumer
                  - trust-backlog-consumer
                  - full-coverage-consumer
                  - movement-relay
      ports:
        - protocol: TCP
          port: {{ .Values.redis.service.port }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distant-signal.apiFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # EXACTLY the workloads that make an in-cluster HTTP call to the api
    # Service, i.e. every consumer of `distant-signal.apiBaseUrl` in this
    # templates/ directory. Keep this list derived from that helper, not from
    # memory:
    #   grep -rl 'distant-signal.apiBaseUrl' templates/
    #
    # Until 2026-09-25 this allowed only `frontend` plus the five
    # `.Values.pollers` entries, which covered the read path and the original
    # RDM pollers and nothing else. Everything below the poller range was
    # missing, and every one of them POSTs to a /private/* ingest route as its
    # entire reason to exist -- so with networkPolicy.enabled=true each would
    # have failed every publish, which (see
    # crates/schedule-reference/src/config.rs's chart_env_wiring_tests) is the
    # deliberately best-effort log-and-continue path in most of these crates:
    # the product simply stays empty, forever, with only a recurring error!
    # line to show for it. Exactly the failure mode that cost this app a whole
    # product earlier the same day.
    #
    # Components are listed UNCONDITIONALLY rather than gated on each
    # workload's own `enabled` value: a matchExpressions value naming a
    # component that isn't deployed selects nothing and is a harmless no-op,
    # whereas an `if`-gate is one more place this list can silently drift out
    # of step with the Deployment templates -- which is the bug being fixed.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - {{ .Release.Name }}
              - key: app.kubernetes.io/component
                operator: In
                values:
                  # Reads the public API for every page render.
                  - frontend
                  {{- range $name, $poller := .Values.pollers }}
                  {{- if $poller.enabled }}
                  - poller-{{ $name }}
                  {{- end }}
                  {{- end }}
                  # /private/train-events, /private/train-forward-signals,
                  # /private/tracked-trains, /private/stanox-crs.
                  - trust-consumer
                  # /private/trust-event-backlog, /private/train-reasons,
                  # /private/stanox-crs.
                  - trust-backlog-consumer
                  # /private/schedule-line-population,
                  # /private/full-coverage-stats,
                  # /private/station-full-coverage-samples,
                  # /private/stanox-crs.
                  - full-coverage-consumer
                  # BOTH containers in this one Pod: `ingest`
                  # (POST /private/schedule-feed-ingests) and `reference`
                  # (the eight *_URL publishes enumerated in
                  # crates/schedule-reference/src/config.rs). They share the
                  # Pod's network namespace, so one component label covers
                  # both.
                  - schedulefeed
                  # The three island-of-Ireland pollers, which live in their
                  # own templates rather than under .Values.pollers, and so
                  # were never covered by the range above.
                  - poller-irish-rail-gtfs
                  - poller-irish-rail-live
                  - poller-nir-stations
                  {{- if .Values.tests.enabled }}
                  # `helm test`'s probe Pod curls api.probes.path
                  # (templates/tests/test-api-health.yaml). Without this,
                  # `helm test` fails on any release that has NetworkPolicy
                  # turned on.
                  - test
                  {{- end }}
      {{- if and .Values.ingress.enabled .Values.ingress.api.enabled }}
        # The api is published externally, so the ingress controller must
        # reach it too. SECURITY: this also exposes /private/*, guarded by
        # internal-service OAuth2 (require_internal_oauth). It does NOT
        # expose /metrics -- see the separate metrics-only rule below, and
        # metrics_port's own doc comment in crates/api/src/data/config.rs
        # for why /metrics moved off this port entirely (2026-09-25 Signal
        # Box Audit Low finding).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | quote }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
  {{- if .Values.metrics.enabled }}
    # api's own internal-only /metrics listener
    # (crates/api/src/main.rs's spawn_metrics_listener) -- bound on a
    # SEPARATE port from the public one above, precisely so this rule (not
    # the broad one above, and not ingress.yaml, which never routes here at
    # all) is the only thing that can reach it: scoped to the monitoring
    # namespace alone, same as every other workload's own /metrics rule in
    # this file.
    #
    # Until 2026-09-25 api's /metrics shared the public listener/port
    # above, so with both metrics.enabled and ingress.api.enabled set it
    # was reachable through ingress.yaml's catch-all `path: /` rule --
    # unauthenticated, from the public internet. NetworkPolicy alone could
    # never have closed that gap (it only governs pod-to-pod traffic, never
    # traffic arriving through an Ingress controller) -- moving /metrics to
    # its own listener is what actually fixes it; this rule just keeps that
    # listener's blast radius to the monitoring namespace, matching every
    # sibling workload.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distant-signal.frontendFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if and .Values.ingress.enabled .Values.ingress.frontend.enabled }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
  {{- else }}
  # No Ingress in front of the frontend, so nothing outside the pod needs to
  # reach it. Omitting `ingress` entirely is a default-deny.
  {{- end }}
---
{{- /*
INF-10: every background worker gets a policy from
distant-signal.workerNetworkPolicy (_helpers.tpl): its /metrics port from the
monitoring namespace, its health port(s) from anywhere (kubelet probes come
from the node), nothing else. Until 2026-09-27 trust-consumer,
trust-backlog-consumer, full-coverage-consumer, movement-relay and the three
island-of-Ireland pollers had no policy at all, so they accepted traffic from
every pod in the cluster.

`egress` lists the in-cluster services each worker calls; it only takes
effect with networkPolicy.egress.enabled (see values.yaml). aggregator and
enricher get none: their S3 archive and LLM endpoints may be private
addresses this chart cannot know.
*/}}
{{- $enabledPollerNames := list }}
{{- range $name, $poller := .Values.pollers }}
{{- if $poller.enabled }}
{{- $enabledPollerNames = append $enabledPollerNames $name }}
{{- end }}
{{- end }}
{{- $callsApi := dict "api" true }}
{{- $queueWorker := dict "api" true "redis" true }}
{{- $workers := list
  (dict "component" "aggregator" "metricsPort" .Values.metrics.port "healthPorts" (list .Values.workerHealth.port))
  (dict "component" "enricher" "metricsPort" .Values.metrics.port "healthPorts" (list .Values.workerHealth.port))
  (dict "component" "notifier" "metricsPort" .Values.metrics.port "healthPorts" (list .Values.workerHealth.port) "egress" (dict "postgres" true))
  (dict "component" "trust-consumer" "metricsPort" .Values.trustConsumer.metricsPort "healthPorts" (list .Values.trustConsumer.healthPort) "egress" $queueWorker)
  (dict "component" "trust-backlog-consumer" "metricsPort" .Values.trustBacklogConsumer.metricsPort "healthPorts" (list .Values.trustBacklogConsumer.healthPort) "egress" $queueWorker)
  (dict "component" "full-coverage-consumer" "metricsPort" .Values.fullCoverageConsumer.metricsPort "healthPorts" (list .Values.fullCoverageConsumer.healthPort) "egress" $queueWorker)
}}
{{- if .Values.movementRelay.enabled }}
{{- $workers = append $workers (dict "component" "movement-relay" "metricsPort" .Values.movementRelay.metricsPort "healthPorts" (list .Values.movementRelay.healthPort) "egress" (dict "redis" true)) }}
{{- end }}
{{- range $enabledPollerNames }}
{{- $workers = append $workers (dict "component" (printf "poller-%s" .) "metricsPort" $root.Values.metrics.port "healthPorts" (list $root.Values.workerHealth.port) "egress" $callsApi) }}
{{- end }}
{{- if .Values.pollerIrishRailGtfs.enabled }}
{{- $workers = append $workers (dict "component" "poller-irish-rail-gtfs" "metricsPort" .Values.pollerIrishRailGtfs.metricsPort "healthPorts" (list .Values.workerHealth.port) "egress" $callsApi) }}
{{- end }}
{{- if .Values.pollerIrishRailLive.enabled }}
{{- $workers = append $workers (dict "component" "poller-irish-rail-live" "metricsPort" .Values.pollerIrishRailLive.metricsPort "healthPorts" (list .Values.workerHealth.port) "egress" $callsApi) }}
{{- end }}
{{- if .Values.pollerNirStations.enabled }}
{{- $workers = append $workers (dict "component" "poller-nir-stations" "metricsPort" .Values.pollerNirStations.metricsPort "healthPorts" (list .Values.workerHealth.port) "egress" $callsApi) }}
{{- end }}
{{- range $workers }}
---
{{ include "distant-signal.workerNetworkPolicy" (merge (dict "root" $root) .) }}
{{- end }}
{{- if .Values.scheduleFeed.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distant-signal.scheduleFeedFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "schedulefeed") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "schedulefeed") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # INF-2: DTD pushes the timetable over SFTP to the `sftp` container.
    # Until 2026-09-27 this policy allowed only the metrics scrape, so
    # enabling networkPolicy silently dropped every delivery. Traffic from
    # the schedulefeed Service's LoadBalancer/NodePort reaches the pod as an
    # ordinary ingress connection, which NetworkPolicy does govern.
    #
    # scheduleFeed.sftp.allowedCidrs narrows the sources. It only works when
    # the pod sees the real client address: set
    # `externalTrafficPolicy: Local` on the Service (or use a load balancer
    # that preserves the source IP). Behind a source-NATing hop the source
    # is a node or LB address and an allow-list would drop every push.
    # Empty (the default) allows any source; SFTP authentication is the
    # control then.
    - ports:
        - protocol: TCP
          port: {{ .Values.scheduleFeed.sftp.port }}
      {{- with .Values.scheduleFeed.sftp.allowedCidrs }}
      from:
        {{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      {{- end }}
    # Kubelet probes (the ingest and reference /livez and /healthz ports)
    # come from the node, which no selector can name.
    - ports:
        - protocol: TCP
          port: {{ .Values.workerHealth.port }}
        - protocol: TCP
          port: {{ .Values.scheduleFeed.reference.healthPort }}
  {{- if .Values.metrics.enabled }}
    # The ingest container's /metrics (metrics.port) and the reference
    # container's (scheduleFeed.reference.metricsPort), scoped to the
    # monitoring namespace like every other workload.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
        - protocol: TCP
          port: {{ .Values.scheduleFeed.reference.metricsPort }}
  {{- end }}
{{- end }}
{{- end }}

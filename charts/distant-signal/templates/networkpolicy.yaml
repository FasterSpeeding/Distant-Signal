{{- if .Values.networkPolicy.enabled }}
{{- $root := . -}}
{{/*
Reusable pieces. Each policy below is default-deny for ingress (an empty or
absent `ingress:` list denies everything) plus the specific allows the
service actually needs.
*/}}
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distant-signal.postgresFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if include "distant-signal.egressOn" (dict "root" . "component" "postgres") }}
    - Egress
    {{- end }}
  ingress:
    # EXACTLY the workloads whose container env includes DATABASE_URL, i.e.
    # every consumer of `distant-signal.databaseEnv` in this templates/
    # directory. Keep this list derived from that helper, not from memory:
    #   grep -l 'distant-signal.databaseEnv' templates/*.yaml
    # `notifier` was missing here until 2026-09-25 (it reads DATABASE_URL via
    # the same helper -- notifier-deployment.yaml -- and does nothing else but
    # poll those tables), so turning networkPolicy.enabled on would have
    # silently stopped every push notification this app sends.
    #
    # Since release B (ingest phase 5) no producer goes through the api: the
    # direct writers (phases 2 and 3b) and the internal readers (phase 4)
    # are listed below whenever they are deployed.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - {{ .Release.Name }}
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - api
                  - aggregator
                  - enricher
                  - notifier
                  {{- if .Values.apiMaintenance.enabled }}
                  # The api-maintenance CronJob (api-maintenance-cronjob.yaml).
                  - api-maintenance
                  {{- end }}
                  {{- if .Values.ingestWriter.enabled }}
                  # The ingest-writer (ingest-writer-deployment.yaml).
                  - ingest-writer
                  {{- end }}
                  {{- if .Values.scheduleFeed.enabled }}
                  # schedule-reference (plan 2a) and schedule-ingest (plan 2d)
                  # write Postgres directly.
                  - schedulefeed
                  {{- end }}
                  {{- range $name := list "stations" "incidents" "ldbws" }}
                  {{- if (get $root.Values.pollers $name | default dict).enabled }}
                  # stations and incidents write Postgres directly (plans 2b,
                  # 2c); ldbws reads its sample stations from it (plan 4.5).
                  - {{ printf "poller-%s" $name }}
                  {{- end }}
                  {{- end }}
                  # The TRUST backlog (plan 3b.1), the train events and forward
                  # signals (plan 3b.3, D1) written directly, and the internal
                  # reads (plans 4.3, 4.4).
                  - trust-backlog-consumer
                  - trust-consumer
                  - full-coverage-consumer
        {{- with .Values.networkPolicy.postgresClients }}
        # networkPolicy.postgresClients: workloads outside this chart, e.g.
        # a postgres-exporter or a pg_dump backup CronJob.
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.service.port }}
{{- with include "distant-signal.extraIngress" (dict "root" . "component" "postgres") }}
    {{- . | nindent 4 }}
{{- end }}
{{- with include "distant-signal.egressSection" (dict "root" . "component" "postgres" "deps" dict "internet" .Values.postgresql.pgbackrest.enabled "ports" (list .Values.postgresql.pgbackrest.repo.s3.port)) }}
  {{- . | nindent 2 }}
{{- end }}
---
{{- end }}
{{- if .Values.redis.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distant-signal.redisFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if include "distant-signal.egressOn" (dict "root" . "component" "redis") }}
    - Egress
    {{- end }}
  ingress:
    # EXACTLY the workloads whose container env includes REDIS_URL, i.e. every
    # consumer of `distant-signal.redisUrl` in this templates/ directory. Keep
    # this list derived from that helper, not from memory:
    #   grep -l 'distant-signal.redisUrl' templates/*.yaml
    #
    # The original comment here ("api publishes incident-text-changed events,
    # enricher consumes them. Nothing else touches the queue.") was true when
    # it was written and has been wrong since; four more workloads have grown
    # a REDIS_URL of their own, and all four were missing until 2026-09-25:
    #   - trust-consumer         -- its own durable movement queue
    #   - trust-backlog-consumer -- drains the TRUST event backlog
    #   - full-coverage-consumer -- its own movement stream
    #   - movement-relay         -- publishes the redis-stream MovementFeed
    # Every one of those is a queue producer or consumer whose ONLY job is
    # Redis, so `networkPolicy.enabled=true` did not degrade them, it stopped
    # them dead.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - {{ .Release.Name }}
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - api
                  - enricher
                  - trust-consumer
                  - trust-backlog-consumer
                  - full-coverage-consumer
                  - movement-relay
                  {{- if .Values.ingestWriter.enabled }}
                  # The ingest-writer reads the ds:ingest:* streams (plan 3a.3).
                  - ingest-writer
                  {{- end }}
                  {{- range $name := list "incidents" "ldbws" "tfl" "tocs" }}
                  {{- if (get $.Values.pollers $name | default dict).enabled }}
                  # incidents XADDs incident-text-changed (plan 2c.2); ldbws,
                  # tfl and tocs XADD their ds:ingest:* stream (plans 3a.7,
                  # 3c.2).
                  - {{ printf "poller-%s" $name }}
                  {{- end }}
                  {{- end }}
                  {{- if .Values.pollerIrishRailGtfs.enabled }}
                  # The island-of-Ireland pollers write only to their stream (D8).
                  - poller-irish-rail-gtfs
                  {{- end }}
                  {{- if .Values.pollerIrishRailLive.enabled }}
                  - poller-irish-rail-live
                  {{- end }}
                  {{- if .Values.pollerNirStations.enabled }}
                  - poller-nir-stations
                  {{- end }}
                  {{- if include "distant-signal.transitNetworksOn" . }}
                  # Each transit network's producer XADDs its own
                  # ds:ingest:transit-<network> stream (transit spec §13.3).
                  - poller-transit-schedule
                  {{- end }}
        {{- with .Values.networkPolicy.redisClients }}
        # networkPolicy.redisClients: workloads outside this chart, e.g. a
        # redis-exporter.
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.redis.service.port }}
{{- with include "distant-signal.extraIngress" (dict "root" . "component" "redis") }}
    {{- . | nindent 4 }}
{{- end }}
{{- with include "distant-signal.egressSection" (dict "root" . "component" "redis" "deps" dict "internet" false) }}
  {{- . | nindent 2 }}
{{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distant-signal.apiFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if include "distant-signal.egressOn" (dict "root" . "component" "api") }}
    - Egress
    {{- end }}
  ingress:
    # EXACTLY the workloads that make an in-cluster HTTP call to the api
    # Service, i.e. every consumer of `distant-signal.apiBaseUrl` in this
    # templates/ directory. Keep this list derived from that helper, not from
    # memory:
    #   grep -rl 'distant-signal.apiBaseUrl' templates/
    #
    # Release B (ingest phase 5) removed the api's /private routes and every
    # producer's HTTP path: the pollers, the TRUST and full-coverage
    # consumers and the schedulefeed pod write Postgres or a Redis stream
    # themselves, so none of them is listed any more (runbook §4.2).
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - {{ .Release.Name }}
              - key: app.kubernetes.io/component
                operator: In
                values:
                  # Reads the public API for every page render.
                  - frontend
                  {{- if .Values.tests.enabled }}
                  # `helm test`'s probe Pod curls api.probes.path
                  # (templates/tests/test-api-health.yaml). Without this,
                  # `helm test` fails on any release that has NetworkPolicy
                  # turned on.
                  - test
                  {{- end }}
      {{- $extraPodLabels := .Values.networkPolicy.apiExtraIngressPodLabels | default dict }}
      {{- range .Values.networkPolicy.apiExtraIngressNamespaces }}
        # networkPolicy.apiExtraIngressNamespaces: a separately-released
        # in-cluster caller (e.g. the Distant-Signal-MCP in ds-mcp), narrowed
        # to its own pods by networkPolicy.apiExtraIngressPodLabels when that
        # has an entry for the namespace. The api trusts X-Real-IP, so any
        # pod admitted here can pick its own rate-limit key; until
        # 2026-09-30 the whole namespace was admitted (ds-mcp-redis included).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
          {{- with (get $extraPodLabels .) }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      {{- end }}
      {{- if .Values.networkPolicy.tunnel.enabled }}
      {{- if .Values.networkPolicy.tunnel.api }}
      {{- if .Values.api.rateLimit.trustXRealIp }}
      {{- fail "networkPolicy.tunnel.api is true while api.rateLimit.trustXRealIp is true. A request arriving straight from the tunnel carries whatever X-Real-IP its client sent, so it could choose its own rate-limit key. Set api.rateLimit.trustXRealIp=false (every request the frontend proxies then shares the frontend pod's bucket), or leave networkPolicy.tunnel.api false and route the public hostname to the frontend." }}
      {{- end }}
        # networkPolicy.tunnel.api: a public hostname routed by the tunnel
        # straight to the api (api.rateLimit.trustXRealIp is off, checked
        # above).
        {{- include "distant-signal.tunnelPeer" . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if and .Values.ingress.enabled .Values.ingress.api.enabled }}
        # The api is published externally, so the ingress controller must
        # reach it too. It does NOT expose /metrics -- see the separate metrics-only rule below, and
        # metrics_port's own doc comment in crates/api/src/data/config.rs
        # for why /metrics moved off this port entirely (2026-09-25 Signal
        # Box Audit Low finding).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | quote }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
  {{- if and (include "distant-signal.delegatedEnabled" .) .Values.networkPolicy.apiExtraIngressNamespaces }}
    # The delegated listener (api.delegated, decision D-14): only the
    # separately-released callers of networkPolicy.apiExtraIngressNamespaces
    # (ds-mcp), narrowed by apiExtraIngressPodLabels. Not the frontend, the
    # tunnel or the ingress controller: the only port that accepts delegated
    # bearers is unreachable from every public path. With no namespace
    # listed there is no rule, so nothing may reach it.
    - from:
      {{- $delegatedPodLabels := .Values.networkPolicy.apiExtraIngressPodLabels | default dict }}
      {{- range .Values.networkPolicy.apiExtraIngressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
          {{- with (get $delegatedPodLabels .) }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ include "distant-signal.delegatedPort" . }}
  {{- end }}
  {{- if .Values.metrics.enabled }}
    # api's own internal-only /metrics listener
    # (crates/api/src/main.rs's spawn_metrics_listener) -- bound on a
    # SEPARATE port from the public one above, precisely so this rule (not
    # the broad one above, and not ingress.yaml, which never routes here at
    # all) is the only thing that can reach it: scoped to the monitoring
    # namespace alone, same as every other workload's own /metrics rule in
    # this file.
    #
    # Until 2026-09-25 api's /metrics shared the public listener/port
    # above, so with both metrics.enabled and ingress.api.enabled set it
    # was reachable through ingress.yaml's catch-all `path: /` rule --
    # unauthenticated, from the public internet. NetworkPolicy alone could
    # never have closed that gap (it only governs pod-to-pod traffic, never
    # traffic arriving through an Ingress controller) -- moving /metrics to
    # its own listener is what actually fixes it; this rule just keeps that
    # listener's blast radius to the monitoring namespace, matching every
    # sibling workload.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
  {{- end }}
{{- with include "distant-signal.extraIngress" (dict "root" . "component" "api") }}
    {{- . | nindent 4 }}
{{- end }}
{{- $apiIdpUrls := list .Values.api.sso.issuerUrl .Values.api.internalOauth.issuerUrl }}
{{- range (dig "delegated" "clients" list .Values.api | default list) }}
{{- $apiIdpUrls = append $apiIdpUrls (dig "issuerUrl" "" .) }}
{{- end }}
{{- with include "distant-signal.egressSection" (dict "root" . "component" "api" "deps" (dict "postgres" true "redis" true "idp" true) "internet" true "urls" $apiIdpUrls) }}
  {{- . | nindent 2 }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distant-signal.frontendFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if include "distant-signal.egressOn" (dict "root" . "component" "frontend") }}
    - Egress
    {{- end }}
  {{- $viaIngress := and .Values.ingress.enabled .Values.ingress.frontend.enabled }}
  {{- $extraIngress := include "distant-signal.extraIngress" (dict "root" . "component" "frontend") }}
  {{- if or $viaIngress .Values.networkPolicy.tunnel.enabled $extraIngress }}
  ingress:
    {{- if or $viaIngress .Values.networkPolicy.tunnel.enabled }}
    - from:
        {{- if $viaIngress }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace | quote }}
        {{- end }}
        {{- if .Values.networkPolicy.tunnel.enabled }}
        # networkPolicy.tunnel: the connector pods that publish the site
        # (e.g. cloudflared). They reach the api only through the frontend,
        # whose proxy overwrites X-Real-IP from CF-Connecting-IP.
        {{- include "distant-signal.tunnelPeer" . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.port }}
    {{- end }}
    {{- with $extraIngress }}
    {{- . | nindent 4 }}
    {{- end }}
  {{- else }}
  # No Ingress or tunnel in front of the frontend, so nothing outside the pod
  # needs to reach it. Omitting `ingress` entirely is a default-deny.
  {{- end }}
{{- with include "distant-signal.egressSection" (dict "root" . "component" "frontend" "deps" (dict "api" true) "internet" false) }}
  {{- . | nindent 2 }}
{{- end }}
{{- /*
INF-10: every background worker gets a policy from
distant-signal.workerNetworkPolicy (_helpers.tpl): its /metrics port from the
monitoring namespace, its health port(s) from anywhere (kubelet probes come
from the node), nothing else. Until 2026-09-27 trust-consumer,
trust-backlog-consumer, full-coverage-consumer, movement-relay and the three
island-of-Ireland pollers had no policy at all, so they accepted traffic from
every pod in the cluster.

`egress` lists the in-cluster services each worker calls; it only takes
effect with networkPolicy.egress.enabled (see values.yaml). `internet`
(default true) adds the public-internet rule. aggregator gets it only with
archive.enabled (a public S3 endpoint); enricher always (a public LLM API).
A private archive or LLM endpoint, which this chart cannot know, needs
networkPolicy.components.<component>.extraEgress.
*/}}
{{- $enabledPollerNames := list }}
{{- range $name, $poller := .Values.pollers }}
{{- if $poller.enabled }}
{{- $enabledPollerNames = append $enabledPollerNames $name }}
{{- end }}
{{- end }}
{{- /* enricher: the LLM endpoint (enricher.llm.anthropic.baseUrl, i.e.
api.anthropic.com, with provider anthropic; batches go to the same host),
plus OpenAI's token exchange and (primary mode) Authentik's token endpoint
in a workload identity mode. The internet rule is IP-based, so this only
opens their ports, not their hosts. */}}
{{- $enricherUrls := list (include "distant-signal.enricherLlmBaseUrl" .) }}
{{- if include "distant-signal.enricherWif" . }}
{{- $enricherUrls = append $enricherUrls (include "distant-signal.enricherTokenExchangeUrl" .) }}
{{- if include "distant-signal.enricherWifAuthentik" . }}
{{- $enricherUrls = append $enricherUrls .Values.enricher.llm.workloadIdentity.authentik.tokenUrl }}
{{- end }}
{{- end }}
{{- /* Release B (ingest phase 5): no worker calls the api any more. The
TRUST consumers write Postgres directly (plan 3b) and read their reference
data from it (plan 4.4), the full-coverage-consumer XADDs its stats (plan
3a.8) and reads its populations from Postgres (plan 4.3); all three read
the movement stream from Redis. */}}
{{- $queueDbWorker := dict "redis" true "postgres" true }}
{{- $workers := list
  (dict "component" "aggregator" "metricsPort" .Values.metrics.port "healthPorts" (list .Values.workerHealth.port) "egress" (dict "postgres" true) "internet" .Values.archive.enabled "urls" (list (.Values.archive.s3.endpoint | default "https://s3.amazonaws.com")))
  (dict "component" "enricher" "metricsPort" .Values.metrics.port "healthPorts" (list .Values.workerHealth.port) "egress" (dict "postgres" true "redis" true) "urls" $enricherUrls)
  (dict "component" "notifier" "metricsPort" .Values.metrics.port "healthPorts" (list .Values.workerHealth.port) "egress" (dict "postgres" true))
  (dict "component" "trust-consumer" "metricsPort" .Values.trustConsumer.metricsPort "healthPorts" (list .Values.trustConsumer.healthPort) "egress" $queueDbWorker "brokers" .Values.trustConsumer.kafka.brokers)
  (dict "component" "trust-backlog-consumer" "metricsPort" .Values.trustBacklogConsumer.metricsPort "healthPorts" (list .Values.trustBacklogConsumer.healthPort) "egress" $queueDbWorker)
  (dict "component" "full-coverage-consumer" "metricsPort" .Values.fullCoverageConsumer.metricsPort "healthPorts" (list .Values.fullCoverageConsumer.healthPort) "egress" $queueDbWorker "brokers" .Values.trustConsumer.kafka.brokers)
}}
{{- if .Values.ingestWriter.enabled }}
{{- /* Postgres; Redis too once an ingestWriter.streams entry is not off (plan 3a.3). */}}
{{- $writerEgress := dict "postgres" true }}
{{- if include "distant-signal.ingestWriterStreamsOn" . }}
{{- $_ := set $writerEgress "redis" true }}
{{- end }}
{{- $workers = append $workers (dict "component" "ingest-writer" "metricsPort" .Values.metrics.port "healthPorts" (list .Values.workerHealth.port) "egress" $writerEgress "internet" false) }}
{{- end }}
{{- if .Values.movementRelay.enabled }}
{{- $workers = append $workers (dict "component" "movement-relay" "metricsPort" .Values.movementRelay.metricsPort "healthPorts" (list .Values.movementRelay.healthPort) "egress" (dict "redis" true) "brokers" (include "distant-signal.movementRelayKafkaBrokers" .)) }}
{{- end }}
{{- range $enabledPollerNames }}
{{- $poller := get $root.Values.pollers . }}
{{- /* Each poller's own upstream, plus (runbook §4.2): stations Postgres;
incidents Postgres and Redis (incident-text-changed, plan 2c.2); ldbws
Redis (its stream) and Postgres (its sample stations, plan 4.5); tfl and
tocs Redis (their streams, plan 3c.2). */}}
{{- $pollerEgress := get (dict
  "stations" (dict "postgres" true)
  "incidents" (dict "postgres" true "redis" true)
  "ldbws" (dict "postgres" true "redis" true)
  "tfl" (dict "redis" true)
  "tocs" (dict "redis" true)) . | default dict }}
{{- $workers = append $workers (dict "component" (printf "poller-%s" .) "metricsPort" $root.Values.metrics.port "healthPorts" (list $root.Values.workerHealth.port) "egress" $pollerEgress "urls" (list $poller.baseUrl)) }}
{{- end }}
{{- /* The island-of-Ireland pollers: their upstream and Redis (each its
own ds:ingest:ioi-* stream, plan 3c.2, D8); no api, no token URL. */}}
{{- $ioiEgress := dict "redis" true }}
{{- if .Values.pollerIrishRailGtfs.enabled }}
{{- $workers = append $workers (dict "component" "poller-irish-rail-gtfs" "metricsPort" .Values.pollerIrishRailGtfs.metricsPort "healthPorts" (list .Values.workerHealth.port) "egress" $ioiEgress "urls" (list .Values.pollerIrishRailGtfs.gtfsUrl)) }}
{{- end }}
{{- if .Values.pollerIrishRailLive.enabled }}
{{- $workers = append $workers (dict "component" "poller-irish-rail-live" "metricsPort" .Values.pollerIrishRailLive.metricsPort "healthPorts" (list .Values.workerHealth.port) "egress" $ioiEgress "urls" (list .Values.pollerIrishRailLive.irishRailBaseUrl)) }}
{{- end }}
{{- if .Values.pollerNirStations.enabled }}
{{- $workers = append $workers (dict "component" "poller-nir-stations" "metricsPort" .Values.pollerNirStations.metricsPort "healthPorts" (list .Values.workerHealth.port) "egress" $ioiEgress "urls" (list .Values.pollerNirStations.stationsCsvUrl .Values.pollerNirStations.haltsCsvUrl)) }}
{{- end }}
{{- /* poller-transit-schedule (transit spec §13.3): Redis (its network's
stream) and the public downloads: the BODS GTFS and SIRI-SX URLs, the
SIRI-SX archive's signed-URL host (download.bus-data.dft.gov.uk) and
NaPTAN, for every enabled network; no Postgres, no api. One policy for the
component, whichever networks are on. */}}
{{- if include "distant-signal.transitNetworksOn" . }}
{{- $transitUrls := list "https://download.bus-data.dft.gov.uk/" }}
{{- range $network, $n := .Values.pollerTransitSchedule.networks }}
{{- if $n.enabled }}
{{- $transitUrls = concat $transitUrls (list $n.gtfsUrl $n.situationsUrl ($n.naptanUrl | replace "{area}" "area")) }}
{{- end }}
{{- end }}
{{- $workers = append $workers (dict "component" "poller-transit-schedule" "metricsPort" .Values.pollerTransitSchedule.metricsPort "healthPorts" (list .Values.workerHealth.port) "egress" (dict "redis" true) "urls" $transitUrls) }}
{{- end }}
{{- range $workers }}
---
{{ include "distant-signal.workerNetworkPolicy" (merge (dict "root" $root) .) }}
{{- end }}
{{- /*
The api-maintenance CronJob: with egress policies on, it may reach
Postgres and DNS. Its admission into Postgres is in the postgres policy
above. The migrate and role setup hook Jobs' policies are hooks themselves
(migrate-job.yaml, postgres-roles.yaml): a pre-upgrade hook runs before
this file's changes are applied.
*/}}
{{- if .Values.apiMaintenance.enabled }}
{{- with include "distant-signal.jobEgressNetworkPolicy" (dict "root" $root "component" "api-maintenance" "deps" (dict "postgres" true)) }}
---
{{ . }}
{{- end }}
{{- end }}
{{- if .Values.scheduleFeed.enabled }}
{{- /* SFTPGo is the `sftp` container of THIS pod (not split out into
schedulefeed-sftp, whose own policy follows this one). */}}
{{- $sftpHere := and .Values.scheduleFeed.sftp.enabled (not (include "distant-signal.scheduleFeedSftpSeparate" .)) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distant-signal.scheduleFeedFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "schedulefeed") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "schedulefeed") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if include "distant-signal.egressOn" (dict "root" . "component" "schedulefeed") }}
    - Egress
    {{- end }}
  ingress:
    {{- if $sftpHere }}
    {{- include "distant-signal.scheduleFeedSftpIngressRule" . | nindent 4 }}
    {{- end }}
    # Kubelet probes (the ingest and reference /livez and /healthz ports)
    # come from the node, which no selector can name
    # (networkPolicy.healthIngress).
    {{- include "distant-signal.healthIngressRule" (dict "root" . "ports" (list .Values.workerHealth.port .Values.scheduleFeed.reference.healthPort)) | nindent 4 }}
  {{- if .Values.metrics.enabled }}
    # The ingest container's /metrics (metrics.port) and the reference
    # container's (scheduleFeed.reference.metricsPort), scoped to the
    # monitoring namespace like every other workload.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
        - protocol: TCP
          port: {{ .Values.scheduleFeed.reference.metricsPort }}
        {{- if and $sftpHere .Values.scheduleFeed.sftp.telemetry.enabled }}
        # The sftp container's SFTPGo telemetry (/metrics, /healthz).
        - protocol: TCP
          port: {{ .Values.scheduleFeed.sftp.telemetry.port }}
        {{- end }}
  {{- end }}
{{- with include "distant-signal.extraIngress" (dict "root" . "component" "schedulefeed") }}
    {{- . | nindent 4 }}
{{- end }}
{{- $sfUrls := list }}
{{- if .Values.scheduleFeed.bucket.enabled }}
{{- /* Ports only: the internet rule is by CIDR, so these add 443 (or a
custom baseUrl's port) when networkPolicy.egress.internetPorts is set. */}}
{{- if include "distant-signal.scheduleFeedBucketWif" . }}
{{- /* Keyless: Google STS and service-account impersonation instead of
the key's OAuth endpoint. */}}
{{- $sfUrls = concat $sfUrls (list "https://storage.googleapis.com" "https://sts.googleapis.com" "https://iamcredentials.googleapis.com") }}
{{- else }}
{{- $sfUrls = concat $sfUrls (list "https://storage.googleapis.com" "https://oauth2.googleapis.com") }}
{{- end }}
{{- with .Values.scheduleFeed.bucket.baseUrl }}{{ $sfUrls = append $sfUrls . }}{{ end }}
{{- end }}
{{- /* Postgres for both containers' direct writes: schedule-reference's
(plan 2a) and schedule-ingest's (plan 2d); no api since release B. The
pod's containers share one network namespace, so the egress is the pod's. */}}
{{- $sfDeps := dict "postgres" true }}
{{- with include "distant-signal.egressSection" (dict "root" . "component" "schedulefeed" "deps" $sfDeps "internet" true "urls" $sfUrls) }}
  {{- . | nindent 2 }}
{{- end }}
{{- end }}
{{- if include "distant-signal.scheduleFeedSftpSeparate" . }}
---
{{- /*
The separate SFTPGo pod (scheduleFeed.sftp.separateDeployment,
schedulefeed-sftp-deployment.yaml): DTD's push on the SFTP port, its
telemetry from the monitoring namespace, and nothing else in. SFTPGo opens
no connections of its own, so egress (when on) is DNS only:
no api, Postgres or internet. networkPolicy.components.schedulefeed-sftp
adds rules. Its liveness probe is a TCP check on the SFTP port, which the
SFTP rule admits (as it did in the shared pod).
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "distant-signal.scheduleFeedSftpFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "schedulefeed-sftp") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "schedulefeed-sftp") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if include "distant-signal.egressOn" (dict "root" . "component" "schedulefeed-sftp") }}
    - Egress
    {{- end }}
  ingress:
    {{- include "distant-signal.scheduleFeedSftpIngressRule" . | nindent 4 }}
  {{- if and .Values.metrics.enabled .Values.scheduleFeed.sftp.telemetry.enabled }}
    # SFTPGo's telemetry (/metrics, /healthz), scoped to the monitoring
    # namespace like every other workload.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.scheduleFeed.sftp.telemetry.port }}
  {{- end }}
{{- with include "distant-signal.extraIngress" (dict "root" . "component" "schedulefeed-sftp") }}
    {{- . | nindent 4 }}
{{- end }}
{{- with include "distant-signal.egressSection" (dict "root" . "component" "schedulefeed-sftp" "internet" false) }}
  {{- . | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}

{{- /*
The SFTP ingress rule (one NetworkPolicyIngressRule list item) for
whichever pod runs SFTPGo: the separate schedulefeed-sftp pod, or the
schedulefeed pod with scheduleFeed.sftp.separateDeployment false. Takes
root.
*/ -}}
{{- define "distant-signal.scheduleFeedSftpIngressRule" -}}
# INF-2: DTD pushes the timetable over SFTP to the `sftp` container.
# Until 2026-09-27 this policy allowed only the metrics scrape, so
# enabling networkPolicy silently dropped every delivery. Traffic from
# the schedulefeed Service's LoadBalancer/NodePort reaches the pod as an
# ordinary ingress connection, which NetworkPolicy does govern.
#
# scheduleFeed.sftp.allowedCidrs narrows the sources. It only works when
# the pod sees the real client address: set
# scheduleFeed.service.externalTrafficPolicy to Local (or use a load
# balancer that preserves the source IP). Behind a source-NATing hop
# the source is a node or LB address and an allow-list would drop every
# push.
# Empty (the default) allows any source; SFTP authentication is the
# control then.
- ports:
    - protocol: TCP
      port: {{ .Values.scheduleFeed.sftp.port }}
  {{- with .Values.scheduleFeed.sftp.allowedCidrs }}
  from:
    {{- range . }}
    - ipBlock:
        cidr: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "distant-signal.serviceAccountName" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "shared") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing in this stack talks to the Kubernetes API server, so no pod
# mounts this token either (every pod spec sets
# automountServiceAccountToken: false as well).
automountServiceAccountToken: false
{{- end }}

{{/*
Prometheus Operator's PodMonitor CRD -- gated separately from
metrics.enabled because rendering a CRD-backed resource against a cluster
that doesn't have the CRD installed fails `helm install` outright, whereas
metrics.enabled=true with podMonitor.enabled=false still leaves every
prometheus.io/* annotation in place as a CRD-free fallback (see
docs/superpowers/specs/2026-08-29-metrics-design.md).

frontend is deliberately absent from the selector below -- out of scope for
this design (it's a Next.js service with its own, un-designed metrics
story, see the spec's Architecture table).

Two podMetricsEndpoints, not one, because api serves /metrics on a port
literally named "http" (it reuses its existing listener -- see
crates/api/src/main.rs, Task 2 of the metrics plan), while every other
selected workload serves it on a new port named "metrics" (Steps 2-4
above). A pod without a port of a given name is simply not matched by that
podMetricsEndpoint entry -- this is not two separate PodMonitors because
Prometheus Operator supports multiple endpoints per PodMonitor sharing one
selector.

trust-consumer/full-coverage-consumer are listed unconditionally (like
aggregator/enricher above them -- neither has a chart-level enabled toggle)
and movement-relay is gated on .Values.movementRelay.enabled, closing the
real scrape gap identified in
docs/superpowers/specs/2026-09-05-status-observability-grafana-design.md
Finding 1 and
docs/superpowers/plans/2026-09-05-status-observability-grafana-plan.md Task
1. podTargetLabels promotes app.kubernetes.io/component (already set on
every pod this chart deploys) into a real Prometheus target label
(app_kubernetes_io_component); without it, every pod this one PodMonitor
matches shares one static `job` label
(`<namespace>/<podmonitor-name>`), making per-component dashboard queries
impossible -- see the plan's Judgment Call 2.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "distant-signal.fullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "metrics") | nindent 4 }}
spec:
  podTargetLabels:
    - app.kubernetes.io/component
  selector:
    matchExpressions:
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - {{ .Release.Name }}
      - key: app.kubernetes.io/component
        operator: In
        values:
          - api
          - aggregator
          - enricher
          - trust-consumer
          - full-coverage-consumer
          {{- if .Values.movementRelay.enabled }}
          - movement-relay
          {{- end }}
          {{- if .Values.pollerIrishRailGtfs.enabled }}
          - poller-irish-rail-gtfs
          {{- end }}
          {{- range $name, $poller := .Values.pollers }}
          {{- if $poller.enabled }}
          - poller-{{ $name }}
          {{- end }}
          {{- end }}
          {{- if .Values.scheduleFeed.enabled }}
          - schedulefeed
          {{- end }}
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.podMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.podMonitor.scrapeTimeout }}
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.podMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.podMonitor.scrapeTimeout }}
{{- end }}

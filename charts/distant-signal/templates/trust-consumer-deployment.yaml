{{- include "distant-signal.removedMovementFeedGuard" (dict "name" "trustConsumer" "value" .Values.trustConsumer.movementFeed) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-trust-consumer" (include "distant-signal.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "trust-consumer") | nindent 4 }}
spec:
  # Values-driven (Task 10 of docs/superpowers/plans/2026-09-04-movement-relay-plan.md,
  # "Judgment calls" item 2) -- was a fixed `1` YAML literal, so scaling to
  # 0 is an explicit, `helm get values`-inspectable step rather than an
  # out-of-band `kubectl scale`.
  replicas: {{ .Values.trustConsumer.replicaCount }}
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "trust-consumer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "trust-consumer") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.trustConsumer.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.trustConsumer.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.trustConsumer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.trustConsumer.podSecurityContext) | nindent 8 }}
      containers:
        - name: trust-consumer
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.trustConsumer.image) | quote }}
          imagePullPolicy: {{ .Values.trustConsumer.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.trustConsumer.healthPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.trustConsumer.metricsPort }}
              protocol: TCP
            {{- end }}
          # Real connected/disconnected semantics, unlike every poller and
          # unlike enricher's "no probes" -- see this plan's Task 16 intro.
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
            # tolerate a real reconnect cycle before restarting the pod. /healthz
            # also goes 503 "stalled" once no loop iteration has completed for
            # progressStallSecs, so a wedged loop is restarted too.
            failureThreshold: 6
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.trustConsumerEnv" .) "extra" .Values.trustConsumer.extraEnv) | trim | nindent 12 }}
          {{- with .Values.trustConsumer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.trustConsumer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.trustConsumer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.trustConsumer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- /*
This container's own env entries. distant-signal.mergeEnv renders them
with trustConsumer.extraEnv, which replaces an entry of the same name.
*/ -}}
{{- define "distant-signal.trustConsumerEnv" }}
            - name: API_INGEST_URL
              value: {{ printf "%s%s" (include "distant-signal.apiBaseUrl" .) "/private/train-events" | quote }}
            - name: FORWARD_SIGNALS_URL
              value: {{ printf "%s%s" (include "distant-signal.apiBaseUrl" .) "/private/train-forward-signals" | quote }}
            - name: API_TRACKED_TRAINS_URL
              value: {{ printf "%s%s" (include "distant-signal.apiBaseUrl" .) "/private/tracked-trains" | quote }}
            - name: INTERNAL_OAUTH_TOKEN_URL
              value: {{ .Values.internalOauth.tokenUrl | quote }}
            - name: INTERNAL_OAUTH_CLIENT_ID
              value: {{ .Values.internalOauth.clientId | quote }}
            - name: INTERNAL_OAUTH_SCOPE
              value: {{ .Values.internalOauth.scope | quote }}
            - name: INTERNAL_OAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.trustConsumerSecretName" . }}
                  key: {{ include "distant-signal.trustConsumerOauthUsernameSecretKey" . }}
            - name: INTERNAL_OAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.trustConsumerSecretName" . }}
                  key: {{ include "distant-signal.trustConsumerOauthPasswordSecretKey" . }}
            - name: REFERENCE_RELOAD_SECS
              value: {{ .Values.trustConsumer.referenceReloadSecs | quote }}
            - name: STANOX_CRS_RELOAD_SECS
              value: {{ .Values.trustConsumer.stanoxCrsReloadSecs | quote }}
            - name: STANOX_CRS_URL
              value: {{ printf "%s/private/stanox-crs" (include "distant-signal.apiBaseUrl" .) | quote }}
            - name: RETENTION_DAYS
              value: {{ .Values.trustConsumer.retentionDays | quote }}
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.trustConsumer.healthPort) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ .Values.trustConsumer.progressStallSecs | quote }}
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" . | quote }}
            {{- include "distant-signal.redisClientAuthEnv" (dict "root" . "client" "trustConsumer" "user" "trust-consumer") }}
            - name: REDIS_AUTOCLAIM_MIN_IDLE_SECS
              value: {{ .Values.trustConsumer.redisAutoclaimMinIdleSecs | quote }}
            - name: REDIS_GAP_CHECK_SECS
              value: {{ .Values.trustConsumer.redisGapCheckSecs | quote }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.trustConsumer.metricsPort | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.trustConsumer.logLevel | quote }}
            # -- Finding #2's kill switch for the TRUST timestamp
            # Europe/London-mislabelling correction (see
            # crates/trust-consumer/src/config.rs's
            # trust_timestamp_correction_enabled doc comment). Same
            # env-var-backed-flag/default-true pattern as
            # aggregator.fullCoverageEnabledDefault/FULL_COVERAGE_ENABLED_DEFAULT
            # above.
            - name: TRUST_TIMESTAMP_CORRECTION_ENABLED
              value: {{ .Values.trustConsumer.trustTimestampCorrectionEnabled | quote }}
{{- end }}

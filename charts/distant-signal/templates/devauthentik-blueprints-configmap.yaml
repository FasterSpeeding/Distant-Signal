{{- if .Values.devAuthentik.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "distant-signal.devAuthentikFullname" . }}-blueprints
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "devauthentik") | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/devauthentik-blueprints/*.yaml" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}

{{/*
The first MULTI-CONTAINER Deployment in this chart -- every other
Deployment here (api, frontend, aggregator, enricher, trust-consumer, every
poller) runs exactly one container. scheduleFeed pairs an SFTP receiver
(the `sftp` container, a third-party image DTD pushes files into) with this
app's own verifier/uploader (the `ingest` container, crates/schedule-ingest)
sharing one PVC -- see docs/superpowers/specs/2026-09-01-schedule-feed-push-design.md.
*/}}
{{- if .Values.scheduleFeed.enabled }}
{{- if not .Values.scheduleFeed.sftp.authMethod }}
{{- fail "scheduleFeed.sftp.authMethod must be set (\"password\" or \"public-key\") when scheduleFeed.enabled -- see docs/superpowers/specs/2026-09-01-schedule-feed-push-design.md, Credentials" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distant-signal.scheduleFeedFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "schedulefeed") | nindent 4 }}
spec:
  # Fixed at 1, like aggregator: a rolling update would briefly run two SFTP
  # receivers (or two ingest verifiers) against the same PVC, so this uses
  # Recreate for the same reason aggregator-deployment.yaml does.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "schedulefeed") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "schedulefeed") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.scheduleFeed.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.scheduleFeed.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.scheduleFeed.podSecurityContext) | nindent 8 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "distant-signal.scheduleFeedFullname" .) .Values.scheduleFeed.persistence.existingClaim }}
        - name: host-key
          secret:
            secretName: {{ default (include "distant-signal.scheduleFeedSecretName" .) .Values.scheduleFeed.sftp.existingSecretHostKey }}
            items:
              - key: {{ include "distant-signal.scheduleFeedHostKeySecretKey" . }}
                path: {{ include "distant-signal.scheduleFeedHostKeySecretKey" . }}
                mode: 0600
        - name: sftp-entrypoint
          configMap:
            name: {{ include "distant-signal.scheduleFeedFullname" . }}-sftp-entrypoint
            defaultMode: 0555
      containers:
        - name: sftp
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.scheduleFeed.sftp.image) | quote }}
          imagePullPolicy: {{ .Values.scheduleFeed.sftp.image.pullPolicy }}
          # readOnlyRootFilesystem is left false here, unlike every
          # single-purpose Rust binary elsewhere in this chart: SFTPGo's own
          # runtime writes (its own SQLite metadata store at
          # /var/lib/sftpgo/sftpgo.db by default -- confirmed against
          # SFTPGo's own shipped sftpgo.json, data_provider.driver: "sqlite"
          # -- plus the loaddata JSON the sftp-entrypoint ConfigMap's script
          # writes to /tmp) genuinely need a writable root filesystem with
          # the mechanism this chart now uses. Note this also means the
          # SQLite user database is NOT on the persistent PVC (only
          # /data/schedule-feed is) -- it is rebuilt from scratch by the
          # loaddata script on every pod restart, which is fine (arguably
          # correct for this chart's "config as code" convention): the
          # account's credentials come from values/Secrets, not from any
          # state a human might have changed via SFTPGo's own admin UI
          # (which this chart never provisions an admin for at all).
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          ports:
            - name: sftp
              containerPort: {{ .Values.scheduleFeed.sftp.port }}
          # Overrides the image's own `CMD ["sftpgo", "serve"]` (no
          # ENTRYPOINT is set upstream, so this replaces it outright) to run
          # the sftp-entrypoint ConfigMap's script first -- see that
          # ConfigMap (schedulefeed-configmap.yaml) for the full mechanism
          # and source citations for why this replaced
          # SFTPGO_DEFAULT_ADMIN_USERNAME/PASSWORD (that pair only ever
          # bootstraps SFTPGo's web-UI/REST-API *admin* account, confirmed
          # against SFTPGo's real Go source -- never the SFTP-login *user*
          # DTD's push client needs).
          command: ["/bin/sh", "/scripts/entrypoint.sh"]
          # This env block, the host-key mount path below, and SFTPGo's
          # sftpd port-binding env var name are otherwise unchanged from
          # this chart's earlier version -- still UNVERIFIED against a real
          # deployed drakkan/sftpgo container/entrypoint in this pass
          # (docker/podman are not available in this sandbox -- see this
          # task's own implementation report) beyond what the
          # source-code-level confirmation below establishes; the
          # SFTPGO_SFTPD__BINDINGS__0__PORT env var name itself (viper's
          # `__`-delimited nested-config convention, confirmed against
          # config.go's SetEnvKeyReplacer/AutomaticEnv wiring) was not
          # independently re-verified in this pass either.
          #
          # ALSO UNVERIFIED / LIKELY A MISMATCH: the mounted host key
          # (distant-signal.scheduleFeedHostKeySecretKey, rendered by
          # schedulefeed-secret.yaml via Helm's `genPrivateKey "ed25519"`)
          # is stored as a PKCS8 PEM blob ("-----BEGIN PRIVATE KEY-----"),
          # NOT the OpenSSH-native "-----BEGIN OPENSSH PRIVATE KEY-----"
          # container format that SFTPGo (like most sshd-alikes, e.g.
          # atmoz/sftp) may expect at a raw host-key file path. Whether
          # SFTPGo's loader accepts PKCS8 PEM directly, or needs a
          # conversion step (e.g. an initContainer running
          # `ssh-keygen -p -m PEM`/similar) has NOT been confirmed in this
          # pass -- treat this as an open verification item, not a
          # working default. Out of scope for this task (SFTP account
          # provisioning), not touched here.
          env:
            - name: SFTPGO_SFTPD__BINDINGS__0__PORT
              value: {{ .Values.scheduleFeed.sftp.port | quote }}
            # DTD's push account username/password/home-dir, consumed by
            # the sftp-entrypoint ConfigMap's script (mounted below) via
            # SFTPGo's real --loaddata-from mechanism -- CORRECTED
            # 2026-09-01 (this task) from the previous
            # SFTPGO_DEFAULT_ADMIN_USERNAME/PASSWORD pair, proven wrong by a
            # real running container's log ("error authenticating user...
            # not found: sql: no rows in result set": those vars only ever
            # create SFTPGo's admin account, never an SFTP-login user).
            - name: SCHEDULE_SFTP_USERNAME
              value: {{ .Values.scheduleFeed.sftp.username | quote }}
            # This account's home_dir IS its SFTP chroot root (SFTPGo's own
            # local-filesystem-provider behaviour), set to the SAME
            # absolute path the `ingest` container's WATCH_DIR below
            # resolves to, so DTD's push client -- which will see itself
            # uploading to "/" once connected, since home_dir already
            # points at the destination -- lands files exactly where
            # schedule-ingest looks for them. SFTPGo creates home_dir
            # itself if missing (vfs/osfs.go's CheckRootPath), so this
            # doesn't need to pre-exist on the PVC.
            - name: SCHEDULE_SFTP_HOME_DIR
              value: {{ printf "/data/schedule-feed/%s" (include "distant-signal.scheduleFeedDestinationPath" .) | quote }}
            {{- if eq .Values.scheduleFeed.sftp.authMethod "password" }}
            - name: SCHEDULE_SFTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.scheduleFeedDtdPasswordSecretName" . }}
                  key: {{ include "distant-signal.scheduleFeedDtdPasswordSecretKey" . }}
            {{- else }}
            - name: SCHEDULE_SFTP_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.scheduleFeedDtdPublicKeySecretName" . }}
                  key: {{ include "distant-signal.scheduleFeedDtdPublicKeySecretKey" . }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data/schedule-feed
            - name: host-key
              mountPath: /srv/sftpgo/host_keys
              readOnly: true
            - name: sftp-entrypoint
              mountPath: /scripts
              readOnly: true
          {{- with .Values.scheduleFeed.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: ingest
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.scheduleFeed.ingest.image) | quote }}
          imagePullPolicy: {{ .Values.scheduleFeed.ingest.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          # Env var names below are the uppercase-snake-case clap `env`
          # names crates/schedule-ingest/src/config.rs actually declares
          # (#[arg(long, env)] with no explicit override) -- checked
          # directly against that file, not guessed: watch_dir, storage_dir,
          # check_times, retention_keep_sequences, stability_cycles,
          # api_ingest_url, internal_token, metrics_port, metrics_enabled.
          env:
            - name: WATCH_DIR
              value: {{ printf "/data/schedule-feed/%s" (include "distant-signal.scheduleFeedDestinationPath" .) | quote }}
            - name: STORAGE_DIR
              value: /data/schedule-feed
            - name: CHECK_TIMES
              value: {{ .Values.scheduleFeed.ingest.checkTimes | quote }}
            - name: RETENTION_KEEP_SEQUENCES
              value: {{ .Values.scheduleFeed.ingest.retentionKeepSequences | quote }}
            - name: STABILITY_CYCLES
              value: {{ .Values.scheduleFeed.ingest.stabilityCycles | quote }}
            - name: API_INGEST_URL
              value: {{ printf "%s/private/schedule-feed-ingests" (include "distant-signal.apiBaseUrl" .) | quote }}
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.internalTokenSecretName" . }}
                  key: {{ include "distant-signal.internalTokenSecretKey" . }}
            # schedule-ingest's own per-service credential -- see
            # poller-deployments.yaml's matching entry for why this is
            # rendered but inert on this side today.
            - name: INTERNAL_TOKEN_SCHEDULE_INGEST
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.scheduleIngestInternalTokenSecretName" . }}
                  key: {{ include "distant-signal.scheduleIngestInternalTokenSecretKey" . }}
            # METRICS_ENABLED is always rendered (matching aggregator's/
            # every poller's convention) -- this is the actual Rust-side
            # toggle that stops the /metrics listener from starting.
            # Omitting the containerPort/annotations above alone would not,
            # since Kubernetes container ports are purely declarative.
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.scheduleFeed.logLevel | quote }}
          volumeMounts:
            - name: data
              mountPath: /data/schedule-feed
          {{- with .Values.scheduleFeed.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.scheduleFeed.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduleFeed.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduleFeed.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

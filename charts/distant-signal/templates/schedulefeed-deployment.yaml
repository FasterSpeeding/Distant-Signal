{{/*
The first MULTI-CONTAINER Deployment in this chart -- every other
Deployment here (api, frontend, aggregator, enricher, trust-consumer, every
poller) runs exactly one container. scheduleFeed pairs an SFTP receiver
(the `sftp` container, a third-party image DTD pushes files into) with this
app's own verifier/uploader (the `ingest` container, crates/schedule-ingest)
sharing one PVC -- see docs/superpowers/specs/2026-09-01-schedule-feed-push-design.md.

With scheduleFeed.sftp.separateDeployment (the default since 2026-10-08)
the `sftp` container runs in its own Deployment instead
(schedulefeed-sftp-deployment.yaml, which also defines the container and
its volumes), mounting the same PVC, so app deploys that recreate this pod
no longer drop DTD's SFTP push. This pod then runs `ingest` and
`reference` only. With it false, the `sftp` container is rendered here, as
before.
*/}}
{{- if .Values.scheduleFeed.enabled }}
{{- /* The `sftp` container is in THIS pod: SFTP on, not split out. */}}
{{- $sftp := and .Values.scheduleFeed.sftp.enabled (not (include "distant-signal.scheduleFeedSftpSeparate" .)) }}
{{- if not (or .Values.scheduleFeed.sftp.enabled (.Values.scheduleFeed.bucket).enabled) }}
{{- fail "scheduleFeed.enabled needs at least one source: scheduleFeed.sftp.enabled and/or scheduleFeed.bucket.enabled" }}
{{- end }}
{{- if .Values.scheduleFeed.bucket.enabled }}
{{- include "distant-signal.scheduleFeedValidateBucket" . }}
{{- end }}
{{- if .Values.scheduleFeed.sftp.enabled }}
{{- if not .Values.scheduleFeed.sftp.authMethod }}
{{- fail "scheduleFeed.sftp.authMethod must be set (\"password\" or \"public-key\") when scheduleFeed.enabled -- see docs/superpowers/specs/2026-09-01-schedule-feed-push-design.md, Credentials" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distant-signal.scheduleFeedFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "schedulefeed") | nindent 4 }}
spec:
  # Fixed at 1, like aggregator: a rolling update would briefly run two
  # ingest verifiers (or, with sftp.separateDeployment false, two SFTP
  # receivers) against the same PVC, so this uses Recreate for the same
  # reason aggregator-deployment.yaml does.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "schedulefeed") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "schedulefeed") | nindent 8 }}
      {{- if or $sftp .Values.metrics.enabled .Values.scheduleFeed.podAnnotations }}
      annotations:
        {{- if $sftp }}
        # The sftp container reads its account policy (permissions, login
        # methods, limits) from the entrypoint script at start, so a change
        # to the script must replace the Pod; env changes already do.
        checksum/sftp-entrypoint: {{ include (print $.Template.BasePath "/schedulefeed-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.metrics.enabled }}
        # NOTE: this plain-annotation scrape fallback can only advertise
        # one port per Pod, so it still only ever advertises `ingest`'s
        # metrics.port -- the `reference` container's own distinct
        # ref-metrics port (scheduleFeed.reference.metricsPort) is NOT
        # scraped via this mechanism. It is scrapeable via a
        # per-container-aware mechanism (e.g. a PodMonitor), if this
        # chart adds one -- a known, accepted limitation, not an
        # oversight (see docs/superpowers/plans/2026-09-01-schedule-ingest-stanox-crs-table.md
        # Task 7).
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.scheduleFeed.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.scheduleFeedServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.scheduleFeed.podSecurityContext) | nindent 8 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (include "distant-signal.scheduleFeedFullname" .) .Values.scheduleFeed.persistence.existingClaim }}
        {{- if $sftp }}
        {{- include "distant-signal.scheduleFeedSftpVolumes" . | nindent 8 }}
        {{- end }}
        {{- if include "distant-signal.scheduleFeedBucketWif" . }}
        {{- $wi := .Values.scheduleFeed.bucket.workloadIdentity }}
        # Keyless bucket access (scheduleFeed.bucket.auth=workloadIdentity):
        # the external_account credential configuration from deploy
        # config's ConfigMap (no secret in it). Optional, like the key
        # Secret: a missing ConfigMap must not stop the pod, and so SFTP.
        - name: bucket-credentials
          configMap:
            name: {{ $wi.credentialConfigMap }}
            optional: true
            defaultMode: 0440
            items:
              - key: {{ $wi.credentialConfigKey }}
                path: credential-config.json
        # ONLY an audience-bound service-account token, rotated by the
        # kubelet: the subject token the reader exchanges at Google STS. No
        # ca.crt or namespace, so it is no use against the Kubernetes API.
        - name: bucket-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ $wi.audience | quote }}
                  expirationSeconds: 3600
        {{- else if .Values.scheduleFeed.bucket.enabled }}
        # The bucket reader's service-account key (a sealed Secret from
        # deploy config; the chart never renders it). Optional: a missing
        # Secret or key must not stop the pod, and so SFTP; schedule-ingest
        # reports it as revoked access instead. No subPath, so a rotated
        # key reaches the running pod.
        - name: bucket-credentials
          secret:
            secretName: {{ .Values.scheduleFeed.bucket.existingSecret }}
            optional: true
            defaultMode: 0440
            items:
              - key: {{ .Values.scheduleFeed.bucket.serviceAccountKey }}
                path: service-account.json
        {{- end }}
      containers:
        {{- if $sftp }}
        {{- include "distant-signal.scheduleFeedSftpContainer" . | nindent 8 }}
        {{- end }}
        - name: ingest
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.scheduleFeed.ingest.image) | quote }}
          imagePullPolicy: {{ .Values.scheduleFeed.ingest.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          # SVC-08/INF-9: /livez restarts a wedged scan loop.
          {{- include "distant-signal.workerHealthProbes" (dict "root" . "port" .Values.workerHealth.port) | nindent 10 }}
          ports:
            - name: health
              containerPort: {{ .Values.workerHealth.port }}
              protocol: TCP
          {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          # Env var names below are the uppercase-snake-case clap `env`
          # names crates/schedule-ingest/src/config.rs actually declares
          # (#[arg(long, env)] with no explicit override) -- checked
          # directly against that file, not guessed: watch_dir, storage_dir,
          # check_times, poll_interval_secs, retention_keep_deliveries,
          # stability_cycles, api_ingest_url, internal_oauth_token_url/
          # client_id/scope/username/password, metrics_port, metrics_enabled.
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.scheduleFeedIngestEnv" .) "extra" .Values.scheduleFeed.ingest.extraEnv) | trim | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data/schedule-feed
            {{- if .Values.scheduleFeed.bucket.enabled }}
            # Read-only, and on this container only: sftp and reference
            # never see the reader key.
            - name: bucket-credentials
              mountPath: /var/run/secrets/distant-signal/gcs
              readOnly: true
            {{- if include "distant-signal.scheduleFeedBucketWif" . }}
            # The external_account config's credential_source.file is
            # /var/run/secrets/distant-signal/gcs-token/token.
            - name: bucket-identity-token
              mountPath: /var/run/secrets/distant-signal/gcs-token
              readOnly: true
            {{- end }}
            {{- end }}
          {{- with (.Values.scheduleFeed.ingest.resources | default .Values.scheduleFeed.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: reference
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.scheduleFeed.reference.image) | quote }}
          imagePullPolicy: {{ .Values.scheduleFeed.reference.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          # SVC-08/INF-9: /livez restarts a wedged publish loop.
          {{- include "distant-signal.workerHealthProbes" (dict "root" . "port" .Values.scheduleFeed.reference.healthPort) | nindent 10 }}
          ports:
            - name: ref-health
              containerPort: {{ .Values.scheduleFeed.reference.healthPort }}
              protocol: TCP
          {{- if .Values.metrics.enabled }}
            - name: ref-metrics
              containerPort: {{ .Values.scheduleFeed.reference.metricsPort }}
              protocol: TCP
          {{- end }}
          # Env var names below are the uppercase-snake-case clap `env`
          # names crates/schedule-reference/src/config.rs actually declares:
          # storage_dir, poll_interval_secs, api_ingest_url,
          # schedule_reference_publishes_url, schedule_line_population_url,
          # schedule_network_departures_url, schedule_destination_departures_url,
          # fixed_links_url, schedule_calling_points_full_url, tiploc_crs_url,
          # lines (LINES_DIR),
          # internal_oauth_token_url/client_id/scope/username/password,
          # metrics_port, metrics_enabled.
          #
          # EVERY one of that Config's `*_URL` fields must appear below.
          # Their clap defaults all point at bare `http://api:8080/...`,
          # which only resolves under docker-compose.yml -- this chart's api
          # Service is `distant-signal.apiFullname` (`<release>-api`), so an
          # omitted URL does not degrade gracefully: it points at a
          # nonexistent host, and since each `publish_*` in that crate's
          # main.rs is best-effort log-and-continue, its product silently
          # never lands in Postgres at all. `SCHEDULE_CALLING_POINTS_FULL_URL`
          # was missed exactly this way and left `GET /Trips/plan` answering
          # "no CIF-derived schedule data has been published" for every date.
          # `config.rs`'s own `chart_env_wiring_tests` now fails the build if
          # a future `*_URL` field is added without being wired in here.
          env:
            - name: STORAGE_DIR
              value: /data/schedule-feed
            - name: POLL_INTERVAL_SECS
              value: {{ .Values.scheduleFeed.reference.pollIntervalSecs | quote }}
            - name: API_INGEST_URL
              value: {{ printf "%s/private/stanox-crs" (include "distant-signal.apiBaseUrl" .) | quote }}
            # This container's OWN per-delivery publish-completion marker.
            # READ once at startup by `main::seed_last_processed_delivery` to
            # seed the restart-durable `last_processed_delivery` dedup, and
            # WRITTEN once per delivery by `main::poll_once`, only after every
            # product for that delivery has published successfully. Both
            # methods, one route, one credential (see crates/api/src/app.rs).
            #
            # Replaced SCHEDULE_FEED_INGESTS_URL here (2026-09-25). That route
            # is schedule-INGEST's record of having EXTRACTED a delivery zip,
            # written before this container has read a byte of it -- seeding
            # from it meant a restart of this container mid-processing made it
            # skip a delivery it had never published, silently losing a whole
            # day of every product. See
            # crates/ds-store/migrations/20260925130000_schedule_reference_publishes.sql.
            - name: SCHEDULE_REFERENCE_PUBLISHES_URL
              value: {{ printf "%s/private/schedule-reference-publishes" (include "distant-signal.apiBaseUrl" .) | quote }}
            # Task 7 (option-b-live-consumer plan): the per-line CIF
            # SCHEDULE population publish this crate gained alongside its
            # original stanox/crs responsibility.
            - name: SCHEDULE_LINE_POPULATION_URL
              value: {{ printf "%s/private/schedule-line-population" (include "distant-signal.apiBaseUrl" .) | quote }}
            # Whole-network-trip-search plan: this crate's third
            # responsibility, alongside stanox/crs and per-line CIF
            # SCHEDULE population.
            - name: SCHEDULE_NETWORK_DEPARTURES_URL
              value: {{ printf "%s/private/schedule-network-departures" (include "distant-signal.apiBaseUrl" .) | quote }}
            # Train-listing-page plan: this crate's fourth responsibility,
            # the destination-keyed sibling of the publish directly above.
            - name: SCHEDULE_DESTINATION_DEPARTURES_URL
              value: {{ printf "%s/private/schedule-destination-departures" (include "distant-signal.apiBaseUrl" .) | quote }}
            # Dynamic-trip-planning Phase 1 plan: this crate's fifth
            # responsibility, the CIF ALF-derived fixed-link publish.
            - name: FIXED_LINKS_URL
              value: {{ printf "%s/private/fixed-links" (include "distant-signal.apiBaseUrl" .) | quote }}
            # Dynamic-trip-planning Phase 2 plan: this crate's sixth
            # responsibility, the whole-network, STP-resolved, un-bucketed
            # calling-point publish that backs GET /Trips/plan. Without this
            # line the table stays empty and that route 404s for every date.
            - name: SCHEDULE_CALLING_POINTS_FULL_URL
              value: {{ printf "%s/private/schedule-calling-points-full" (include "distant-signal.apiBaseUrl" .) | quote }}
            # Per-date service mode (train/bus/ferry) of every schedule, read by
            # every public surface to label buses and ferries.
            - name: SCHEDULE_SERVICES_URL
              value: {{ printf "%s/private/schedule-services" (include "distant-signal.apiBaseUrl" .) | quote }}
            # docs/superpowers/plans/2026-09-24-tiploc-crs-crosswalk-plan.md: this
            # crate's TIPLOC-primary CRS crosswalk publish, alongside stanox/crs.
            - name: TIPLOC_CRS_URL
              value: {{ printf "%s/private/tiploc-crs" (include "distant-signal.apiBaseUrl" .) | quote }}
            # docs/superpowers/specs/2026-10-06-tiploc-locations-design.md:
            # names, location types and parent stations for every TIPLOC.
            - name: TIPLOC_LOCATIONS_URL
              value: {{ printf "%s/private/tiploc-locations" (include "distant-signal.apiBaseUrl" .) | quote }}
            - name: LINES_DIR
              value: /app/lines
            {{- if include "distant-signal.scheduleReferenceDbSink" . }}
            # Where the products go (scheduleFeed.reference.ingest.sink;
            # ingest architecture plan 2a): `db` writes Postgres directly
            # with the env below. Unset, the binary's default is `http`
            # (the api's routes above), so the default render is unchanged.
            - name: INGEST_SINK
              value: {{ .Values.scheduleFeed.reference.ingest.sink | quote }}
            # The db sink's connection: distant_signal_schedule_reference
            # with postgresql.roles.perService.schedule_reference.connect,
            # else the shared app role (or the bundled database's user).
            # Only this container gets it (spec §9.2); the CORPUS fallback
            # flag is the api's, so the line population's train summaries
            # derive exactly as the api's route derives them.
            {{- include "distant-signal.databaseEnvFor" (dict "root" . "service" "schedule_reference") | nindent 12 }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.scheduleFeed.reference.ingest.database.maxConnections | int | quote }}
            - name: CORPUS_FALLBACK_ENABLED
              value: {{ .Values.api.corpusFallback.enabled | toString | quote }}
            {{- end }}
            - name: INTERNAL_OAUTH_TOKEN_URL
              value: {{ .Values.internalOauth.tokenUrl | quote }}
            - name: INTERNAL_OAUTH_CLIENT_ID
              value: {{ .Values.internalOauth.clientId | quote }}
            - name: INTERNAL_OAUTH_SCOPE
              value: {{ .Values.internalOauth.scope | quote }}
            - name: INTERNAL_OAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.scheduleReferenceSecretName" . }}
                  key: {{ include "distant-signal.scheduleReferenceOauthUsernameSecretKey" . }}
            - name: INTERNAL_OAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.scheduleReferenceSecretName" . }}
                  key: {{ include "distant-signal.scheduleReferenceOauthPasswordSecretKey" . }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.scheduleFeed.reference.metricsPort | quote }}
            {{- end }}
            # /livez + /healthz listener (SVC-08/INF-9) -- see workerHealth.
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.scheduleFeed.reference.healthPort) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ .Values.scheduleFeed.reference.progressStallSecs | quote }}
            - name: RUST_LOG
              value: {{ .Values.scheduleFeed.logLevel | quote }}
          # READ-ONLY: this container never writes to the shared PVC --
          # see this design's Decision 1(c) and this plan's Global
          # Constraints ("never writes to storage_dir, never renames/
          # deletes anything schedule-ingest placed there").
          volumeMounts:
            - name: data
              mountPath: /data/schedule-feed
              readOnly: true
          {{- with (.Values.scheduleFeed.reference.resources | default .Values.scheduleFeed.resources) }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.scheduleFeed.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduleFeed.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduleFeed.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- /*
The chart's own env entries for this container, merged with
scheduleFeed.sftp.extraEnv by distant-signal.mergeEnv (an extraEnv entry replaces one of the same name).
*/ -}}
{{- define "distant-signal.scheduleFeedSftpEnv" }}
            - name: SFTPGO_SFTPD__BINDINGS__0__PORT
              value: {{ .Values.scheduleFeed.sftp.port | quote }}
            {{- with .Values.scheduleFeed.sftp.hostKeys }}
            # Serve the mounted, preserved host keys. Without this SFTPGo
            # generates fresh keys under /var/lib/sftpgo on every start, so
            # the fingerprint changed on every restart and could never be
            # pinned by the client.
            - name: SFTPGO_SFTPD__HOST_KEYS
              value: {{ include "distant-signal.scheduleFeedHostKeyPaths" $ | quote }}
            {{- end }}
            {{- if not .Values.scheduleFeed.sftp.webAdmin.enabled }}
            # No httpd (web admin/REST) listener: see
            # scheduleFeed.sftp.webAdmin in values.yaml.
            - name: SFTPGO_HTTPD__BINDINGS__0__PORT
              value: "0"
            {{- end }}
            # Audit log: SFTPGo's JSON lines on stdout. `login`, `Upload` and
            # the command lines are info, but failed logins
            # (`connection_failed`) and defender score changes are debug
            # only, and the Loki rules on them need them, so the level is
            # explicit (scheduleFeed.sftp.logLevel). UTC so the zone-less
            # `time` field is UTC by definition. docs/schedule-feed-sftp.md
            # lists the fields.
            - name: SFTPGO_LOG_FILE_PATH
              value: ""
            - name: SFTPGO_LOG_LEVEL
              value: {{ .Values.scheduleFeed.sftp.logLevel | quote }}
            - name: SFTPGO_LOG_UTC_TIME
              value: "true"
            {{- if and .Values.metrics.enabled .Values.scheduleFeed.sftp.telemetry.enabled }}
            # SFTPGo's telemetry listener: /metrics (unlabelled global
            # counters: logins, uploads, errors) and /healthz, scraped
            # through the PodMonitor's sftp-metrics endpoint. Never on the
            # NodePort Service. No auth file: read-only counters, reachable
            # only from the monitoring namespace (networkpolicy.yaml).
            - name: SFTPGO_TELEMETRY__BIND_PORT
              value: {{ .Values.scheduleFeed.sftp.telemetry.port | quote }}
            - name: SFTPGO_TELEMETRY__BIND_ADDRESS
              value: "0.0.0.0"
            - name: SFTPGO_TELEMETRY__ENABLE_PROFILER
              value: "false"
            - name: SFTPGO_TELEMETRY__AUTH_USER_FILE
              value: ""
            {{- end }}
            # SSH commands (md5sum, sha256sum, cd, pwd, scp... in the image's
            # sftpgo.json) other than the SFTP subsystem itself. None by
            # default: DTD only uses SFTP, and scp/hash commands are extra
            # surface (scheduleFeed.sftp.sshCommands).
            - name: SFTPGO_SFTPD__ENABLED_SSH_COMMANDS
              value: {{ join "," .Values.scheduleFeed.sftp.sshCommands | quote }}
            # Brute-force protection: SFTPGo's defender, per-host connection
            # cap and per-source connection rate limiter (values.yaml
            # scheduleFeed.sftp.defender/maxPerHostConnections/rateLimit).
            {{- with .Values.scheduleFeed.sftp.defender }}
            - name: SFTPGO_COMMON__DEFENDER__ENABLED
              value: {{ .enabled | quote }}
            {{- if .enabled }}
            - name: SFTPGO_COMMON__DEFENDER__DRIVER
              value: "memory"
            - name: SFTPGO_COMMON__DEFENDER__BAN_TIME
              value: {{ .banTime | quote }}
            - name: SFTPGO_COMMON__DEFENDER__BAN_TIME_INCREMENT
              value: {{ .banTimeIncrement | quote }}
            - name: SFTPGO_COMMON__DEFENDER__THRESHOLD
              value: {{ .threshold | quote }}
            - name: SFTPGO_COMMON__DEFENDER__SCORE_INVALID
              value: {{ .scoreInvalid | quote }}
            - name: SFTPGO_COMMON__DEFENDER__SCORE_VALID
              value: {{ .scoreValid | quote }}
            - name: SFTPGO_COMMON__DEFENDER__SCORE_LIMIT_EXCEEDED
              value: {{ .scoreLimitExceeded | quote }}
            - name: SFTPGO_COMMON__DEFENDER__SCORE_NO_AUTH
              value: {{ .scoreNoAuth | quote }}
            - name: SFTPGO_COMMON__DEFENDER__OBSERVATION_TIME
              value: {{ .observationTime | quote }}
            - name: SFTPGO_COMMON__DEFENDER__ENTRIES_SOFT_LIMIT
              value: {{ .entriesSoftLimit | quote }}
            - name: SFTPGO_COMMON__DEFENDER__ENTRIES_HARD_LIMIT
              value: {{ .entriesHardLimit | quote }}
            {{- end }}
            {{- with .safelist }}
            # Read by the sftp-entrypoint script, which loads each entry
            # into SFTPGo's defender and rate-limiter safe lists.
            - name: SCHEDULE_SFTP_SAFELIST
              value: {{ join " " . | quote }}
            {{- end }}
            {{- end }}
            - name: SFTPGO_COMMON__MAX_PER_HOST_CONNECTIONS
              value: {{ .Values.scheduleFeed.sftp.maxPerHostConnections | quote }}
            {{- with .Values.scheduleFeed.sftp.rateLimit }}
            {{- if .average }}
            - name: SFTPGO_COMMON__RATE_LIMITERS__0__AVERAGE
              value: {{ .average | quote }}
            - name: SFTPGO_COMMON__RATE_LIMITERS__0__PERIOD
              value: {{ .periodMs | quote }}
            - name: SFTPGO_COMMON__RATE_LIMITERS__0__BURST
              value: {{ .burst | quote }}
            - name: SFTPGO_COMMON__RATE_LIMITERS__0__TYPE
              value: "2"
            - name: SFTPGO_COMMON__RATE_LIMITERS__0__PROTOCOLS
              value: "SSH"
            - name: SFTPGO_COMMON__RATE_LIMITERS__0__GENERATE_DEFENDER_EVENTS
              value: "true"
            {{- if not (and (ge (int .entriesSoftLimit) 1) (gt (int .entriesHardLimit) (int .entriesSoftLimit))) }}
            {{- fail (printf "scheduleFeed.sftp.rateLimit needs 1 <= entriesSoftLimit < entriesHardLimit, got %v and %v" .entriesSoftLimit .entriesHardLimit) }}
            {{- end }}
            - name: SFTPGO_COMMON__RATE_LIMITERS__0__ENTRIES_SOFT_LIMIT
              value: {{ .entriesSoftLimit | int | quote }}
            - name: SFTPGO_COMMON__RATE_LIMITERS__0__ENTRIES_HARD_LIMIT
              value: {{ .entriesHardLimit | int | quote }}
            {{- end }}
            {{- end }}
            # DTD's push account username/password/home-dir, consumed by
            # the sftp-entrypoint ConfigMap's script (mounted below) via
            # SFTPGo's real --loaddata-from mechanism -- CORRECTED
            # 2026-09-01 (this task) from the previous
            # SFTPGO_DEFAULT_ADMIN_USERNAME/PASSWORD pair, proven wrong by a
            # real running container's log ("error authenticating user...
            # not found: sql: no rows in result set": those vars only ever
            # create SFTPGo's admin account, never an SFTP-login user).
            - name: SCHEDULE_SFTP_USERNAME
              value: {{ .Values.scheduleFeed.sftp.username | quote }}
            # This account's home_dir IS its SFTP chroot root (SFTPGo's own
            # local-filesystem-provider behaviour), set to the SAME
            # absolute path the `ingest` container's WATCH_DIR below
            # resolves to, so DTD's push client -- which will see itself
            # uploading to "/" once connected, since home_dir already
            # points at the destination -- lands files exactly where
            # schedule-ingest looks for them. SFTPGo creates home_dir
            # itself if missing (vfs/osfs.go's CheckRootPath), so this
            # doesn't need to pre-exist on the PVC.
            - name: SCHEDULE_SFTP_HOME_DIR
              value: {{ printf "/data/schedule-feed/%s" (include "distant-signal.scheduleFeedDestinationPath" .) | quote }}
            # Least privilege for the push account (scheduleFeed.sftp.
            # permissions/maxSessions/maxUploadFileSize); the entrypoint
            # writes them into the account and refuses unknown permissions.
            - name: SCHEDULE_SFTP_PERMISSIONS
              value: {{ join "," .Values.scheduleFeed.sftp.permissions | quote }}
            - name: SCHEDULE_SFTP_MAX_SESSIONS
              value: {{ .Values.scheduleFeed.sftp.maxSessions | int | quote }}
            - name: SCHEDULE_SFTP_MAX_UPLOAD_FILE_SIZE
              value: {{ .Values.scheduleFeed.sftp.maxUploadFileSize | int64 | quote }}
            {{- if eq .Values.scheduleFeed.sftp.authMethod "password" }}
            - name: SCHEDULE_SFTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.scheduleFeedDtdPasswordSecretName" . }}
                  key: {{ include "distant-signal.scheduleFeedDtdPasswordSecretKey" . }}
            # The entrypoint checks the password's length at start
            # (scheduleFeed.sftp.passwordPolicy): a password from
            # existingSecret can't be checked at render time.
            - name: SCHEDULE_SFTP_PASSWORD_MIN_LENGTH
              value: {{ .Values.scheduleFeed.sftp.passwordPolicy.minLength | int | quote }}
            - name: SCHEDULE_SFTP_PASSWORD_POLICY
              value: {{ ternary "enforce" "warn" .Values.scheduleFeed.sftp.passwordPolicy.enforce | quote }}
            {{- else }}
            - name: SCHEDULE_SFTP_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.scheduleFeedDtdPublicKeySecretName" . }}
                  key: {{ include "distant-signal.scheduleFeedDtdPublicKeySecretKey" . }}
            {{- end }}
{{- end }}

{{- /*
The chart's own env entries for this container, merged with
scheduleFeed.ingest.extraEnv by distant-signal.mergeEnv (an extraEnv entry replaces one of the same name).
*/ -}}
{{- define "distant-signal.scheduleFeedIngestEnv" }}
            - name: WATCH_DIR
              value: {{ printf "/data/schedule-feed/%s" (include "distant-signal.scheduleFeedDestinationPath" .) | quote }}
            - name: STORAGE_DIR
              value: /data/schedule-feed
            - name: CHECK_TIMES
              value: {{ .Values.scheduleFeed.ingest.checkTimes | quote }}
            - name: POLL_INTERVAL_SECS
              value: {{ .Values.scheduleFeed.ingest.pollIntervalSecs | quote }}
            - name: RETENTION_KEEP_DELIVERIES
              value: {{ .Values.scheduleFeed.ingest.retentionKeepDeliveries | quote }}
            - name: STABILITY_CYCLES
              value: {{ .Values.scheduleFeed.ingest.stabilityCycles | quote }}
            - name: API_INGEST_URL
              value: {{ printf "%s/private/schedule-feed-ingests" (include "distant-signal.apiBaseUrl" .) | quote }}
            # CIF-vs-other routing and Network Rail CORPUS loading --
            # scheduleFeed.ingest.cif*Pattern / scheduleFeed.corpus in
            # values.yaml, crates/schedule-ingest/src/{pattern,corpus}.rs.
            - name: CIF_FILE_PATTERN
              value: {{ .Values.scheduleFeed.ingest.cifFilePattern | quote }}
            - name: CIF_EXCLUDE_PATTERN
              value: {{ .Values.scheduleFeed.ingest.cifExcludePattern | quote }}
            # Content checks on each CIF delivery before it is accepted
            # (scheduleFeed.ingest.cifChecks, crates/schedule-ingest/src/cif_check.rs).
            - name: CIF_MAX_GENERATED_AGE_DAYS
              value: {{ .Values.scheduleFeed.ingest.cifChecks.maxGeneratedAgeDays | int | quote }}
            - name: CIF_MIN_SCHEDULES
              value: {{ .Values.scheduleFeed.ingest.cifChecks.minSchedules | int64 | quote }}
            - name: CIF_MAX_RECORD_DROP_PERCENT
              value: {{ .Values.scheduleFeed.ingest.cifChecks.maxRecordDropPercent | int | quote }}
            - name: CORPUS_INGEST_ENABLED
              value: {{ .Values.scheduleFeed.corpus.enabled | quote }}
            - name: CORPUS_FILE_PATTERN
              value: {{ .Values.scheduleFeed.corpus.filePattern | quote }}
            - name: CORPUS_API_URL
              value: {{ printf "%s/private/corpus-locations" (include "distant-signal.apiBaseUrl" .) | quote }}
            - name: CORPUS_MAX_DECOMPRESSED_BYTES
              value: {{ .Values.scheduleFeed.corpus.maxDecompressedBytes | int64 | quote }}
            - name: CORPUS_MIN_ROWS
              value: {{ .Values.scheduleFeed.corpus.minRows | quote }}
            - name: CORPUS_RETENTION_KEEP
              value: {{ .Values.scheduleFeed.corpus.retentionKeep | quote }}
            {{- if include "distant-signal.scheduleIngestSinkDb" . }}
            # scheduleFeed.ingest.sink=db (ingest architecture plan 2d): the
            # feed markers and CORPUS loads go to Postgres directly, as the
            # schedule_ingest role with
            # postgresql.roles.perService.schedule_ingest.connect (else as
            # the app role). Not rendered at all under the default `http`.
            - name: INGEST_SINK
              value: db
            {{- include "distant-signal.databaseEnvFor" (dict "root" . "service" "schedule_ingest") | nindent 12 }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.scheduleFeed.ingest.database.maxConnections | int | quote }}
            {{- end }}
            - name: INTERNAL_OAUTH_TOKEN_URL
              value: {{ .Values.internalOauth.tokenUrl | quote }}
            - name: INTERNAL_OAUTH_CLIENT_ID
              value: {{ .Values.internalOauth.clientId | quote }}
            - name: INTERNAL_OAUTH_SCOPE
              value: {{ .Values.internalOauth.scope | quote }}
            - name: INTERNAL_OAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.scheduleIngestSecretName" . }}
                  key: {{ include "distant-signal.scheduleIngestOauthUsernameSecretKey" . }}
            - name: INTERNAL_OAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.scheduleIngestSecretName" . }}
                  key: {{ include "distant-signal.scheduleIngestOauthPasswordSecretKey" . }}
            # METRICS_ENABLED is always rendered (matching aggregator's/
            # every poller's convention) -- this is the actual Rust-side
            # toggle that stops the /metrics listener from starting.
            # Omitting the containerPort/annotations above alone would not,
            # since Kubernetes container ports are purely declarative.
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}
            # /livez + /healthz listener (SVC-08/INF-9) -- see workerHealth.
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.workerHealth.port) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ .Values.scheduleFeed.ingest.progressStallSecs | quote }}
            - name: RUST_LOG
              value: {{ .Values.scheduleFeed.logLevel | quote }}
            {{- $sf := .Values.scheduleFeed }}
            {{- if or $sf.bucket.enabled (not $sf.sftp.enabled) }}
            # Source switches (docs/schedule-feed-bucket.md). Rendered only
            # when they differ from schedule-ingest's defaults (SFTP on,
            # bucket off), so an SFTP-only release renders as before.
            - name: SFTP_SOURCE_ENABLED
              value: {{ $sf.sftp.enabled | quote }}
            - name: BUCKET_SOURCE_ENABLED
              value: {{ $sf.bucket.enabled | quote }}
            {{- end }}
            {{- if $sf.bucket.enabled }}
            {{- $b := $sf.bucket }}
            # Which source wins a disagreement (decision D5), and the window.
            - name: SOURCE_PRECEDENCE
              value: {{ join "," $sf.sourcePrecedence | quote }}
            - name: DISAGREEMENT_WINDOW_MINUTES
              value: {{ $sf.disagreementWindowMinutes | int | quote }}
            # The GCS source (scheduleFeed.bucket; the bucket and its IAM
            # are charts/ds-ingest-bucket's).
            - name: BUCKET_NAME
              value: {{ $b.name | quote }}
            {{- with $b.baseUrl }}
            - name: BUCKET_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if include "distant-signal.scheduleFeedBucketWif" . }}
            # Keyless: the external_account credential configuration,
            # mounted from scheduleFeed.bucket.workloadIdentity.credentialConfigMap.
            # Its credential_source.file is the projected token at
            # /var/run/secrets/distant-signal/gcs-token/token.
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/distant-signal/gcs/credential-config.json
            {{- else }}
            # The reader key, mounted from scheduleFeed.bucket.existingSecret.
            - name: GOOGLE_SERVICE_ACCOUNT_PATH
              value: /var/run/secrets/distant-signal/gcs/service-account.json
            {{- end }}
            - name: BUCKET_EXPECTED_KEYS
              value: {{ join "," $b.expectedKeys | quote }}
            - name: BUCKET_POLL_INTERVAL_SECS
              value: {{ $b.pollIntervalSecs | int64 | quote }}
            - name: BUCKET_DELETE_MIN_AGE_SECS
              value: {{ $b.deleteMinAgeSecs | int64 | quote }}
            - name: BUCKET_ARCHIVE_KEEP
              value: {{ $b.archiveKeep | int64 | quote }}
            - name: BUCKET_MAX_OBJECT_BYTES
              value: {{ $b.maxObjectBytes | int64 | quote }}
            - name: BUCKET_MAX_DOWNLOADS_PER_POLL
              value: {{ $b.maxDownloadsPerPoll | int64 | quote }}
            - name: BUCKET_MAX_DOWNLOAD_BYTES_PER_HOUR
              value: {{ $b.maxDownloadBytesPerHour | int64 | quote }}
            - name: BUCKET_MAX_DOWNLOAD_BYTES_PER_DAY
              value: {{ $b.maxDownloadBytesPerDay | int64 | quote }}
            - name: BUCKET_MAX_BACKOFF_SECS
              value: {{ $b.maxBackoffSecs | int64 | quote }}
            {{- if $b.auditLogs.ship }}
            # Cloud Audit Logs to stdout (schedule_ingest::bucket_access).
            - name: BUCKET_AUDIT_LOGS_SHIP
              value: "true"
            - name: BUCKET_AUDIT_LOGS_BUCKET
              value: {{ $b.auditLogs.bucket | quote }}
            - name: BUCKET_AUDIT_LOGS_POLL_INTERVAL_SECS
              value: {{ $b.auditLogs.pollIntervalSecs | int64 | quote }}
            {{- end }}
            {{- end }}
{{- end }}

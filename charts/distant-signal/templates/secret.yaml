{{/*
The chart-rendered Secret.

THE LOOKUP-PRESERVE PATTERN BELOW IS THE SINGLE MOST IMPORTANT CORRECTNESS
DETAIL IN THIS CHART. Without it, every `helm upgrade` would call
randAlphaNum again and rotate the postgres password out from under the
running database's PVC, breaking every connection. `lookup` reads the live
Secret from the cluster and reuses whatever is already there.

Note the shape: `lookup` returns an EMPTY MAP when the Secret does not
exist, so `$existing.data` is a nil interface{} and cannot be handed
straight to sprig's `get` (which demands map[string]interface{}). The
`default (dict)` on the line below is what makes this work on Helm 4 --
without it rendering fails with
  "wrong type for value; expected map[string]interface {}; got interface {}".

Known limitation, also stated in README.md: `lookup` always returns empty
during `helm template` and `--dry-run`, so an offline render shows a
DIFFERENT generated value every time. That is cosmetic for dry runs, but it
does mean `helm template | kubectl apply` is not a supported install path
when relying on generated secrets -- set explicit values or use
`existingSecret` for that workflow.
*/}}
{{- $secretName := include "distant-signal.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := default (dict) $existing.data -}}
{{- $data := dict -}}

{{/* postgres-password: omitted entirely when an existingSecret is in use,
     and never rendered at all when the bundled postgres is disabled. */}}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) -}}
{{- $pw := .Values.postgresql.auth.password | default (get $existingData "postgres-password" | b64dec) | default (randAlphaNum 32) -}}
{{- $_ := set $data "postgres-password" ($pw | b64enc) -}}
{{- end -}}

{{/* internal-oauth-username-poller-<name> / internal-oauth-password-poller-<name>:
     like rdm-<name>-api-key, deliberately NOT auto-generated -- Authentik,
     an external system, assigns these (the apiKey precedent, not the old
     internalToken precedent -- see the design doc's Current relevant
     state). Rendered per ENABLED poller without an existingSecret. */}}
{{- range $name, $poller := .Values.pollers -}}
{{- if and $poller.enabled (not $poller.existingSecret) -}}
{{- $_ := set $data (printf "internal-oauth-username-poller-%s" $name) ($poller.internalOauthUsername | default "" | b64enc) -}}
{{- $_ := set $data (printf "internal-oauth-password-poller-%s" $name) ($poller.internalOauthPassword | default "" | b64enc) -}}
{{- end -}}
{{- end -}}

{{/* trust-consumer's own OAuth2 credential -- same never-auto-generated
     posture. */}}
{{- if not .Values.trustConsumer.existingSecret -}}
{{- $_ := set $data "internal-oauth-username-trust-consumer" (.Values.trustConsumer.internalOauthUsername | default "" | b64enc) -}}
{{- $_ := set $data "internal-oauth-password-trust-consumer" (.Values.trustConsumer.internalOauthPassword | default "" | b64enc) -}}
{{- end -}}

{{/* schedule-ingest's and schedule-reference's own OAuth2 credentials --
     two independent service accounts, each its own existingSecret toggle,
     both rendered (possibly empty) only when scheduleFeed.enabled -- the
     whole schedulefeed Deployment doesn't render at all otherwise, so
     nothing would consume these keys. */}}
{{- if .Values.scheduleFeed.enabled -}}
{{- if not .Values.scheduleFeed.ingest.existingSecret -}}
{{- $_ := set $data "internal-oauth-username-schedule-ingest" (.Values.scheduleFeed.ingest.internalOauthUsername | default "" | b64enc) -}}
{{- $_ := set $data "internal-oauth-password-schedule-ingest" (.Values.scheduleFeed.ingest.internalOauthPassword | default "" | b64enc) -}}
{{- end -}}
{{- if not .Values.scheduleFeed.reference.existingSecret -}}
{{- $_ := set $data "internal-oauth-username-schedule-reference" (.Values.scheduleFeed.reference.internalOauthUsername | default "" | b64enc) -}}
{{- $_ := set $data "internal-oauth-password-schedule-reference" (.Values.scheduleFeed.reference.internalOauthPassword | default "" | b64enc) -}}
{{- end -}}
{{- end -}}

{{/* railmcp internal-complete-token: the shared secret between the railmcp
     Service and frontend/'s own consent bridge (embedded-chatbot-shared-
     foundation-and-option-c plan, Task 6/8) -- like internal-token above,
     a random value IS meaningful here (it's chart-internal plumbing, not
     an external credential), so it's auto-generated using the same
     lookup-preserve pattern whenever railMcp is enabled and no
     railMcp.existingSecret is configured. Gated on railMcp.enabled (unlike
     internal-token, which is unconditional) since there is no point
     minting and persisting this secret for a component the operator has
     not turned on. */}}
{{- if and .Values.railMcp.enabled (not .Values.railMcp.existingSecret) -}}
{{- $railMcpToken := .Values.railMcp.internalCompleteToken | default (get $existingData "internal-complete-token" | b64dec) | default (randAlphaNum 32) -}}
{{- $_ := set $data "internal-complete-token" ($railMcpToken | b64enc) -}}
{{- end -}}

{{/* sso-client-secret: like before, never auto-generated with a random
     value -- but when devAuthentik.enabled and no explicit clientSecret is
     set, falls back to the FIXED blueprint-provisioned dev secret
     (distant-signal.devAuthentikClientSecret) instead of an empty string, so
     the computed defaults in api-deployment.yaml actually work end to
     end. */}}
{{- if not .Values.api.sso.existingSecret -}}
{{- $ssoSecret := .Values.api.sso.clientSecret | default (and .Values.devAuthentik.enabled (include "distant-signal.devAuthentikClientSecret" .)) | default "" -}}
{{- $_ := set $data "sso-client-secret" ($ssoSecret | b64enc) -}}
{{- end -}}

{{/* One rdm-<name>-api-key per ENABLED poller without an existingSecret.
     Deliberately NOT auto-generated: a random RDM key is meaningless. The
     key is still rendered (possibly empty) so the pod's secretKeyRef always
     resolves instead of wedging in CreateContainerConfigError. */}}
{{- range $name, $poller := .Values.pollers -}}
{{- if and $poller.enabled (not $poller.existingSecret) -}}
{{- $_ := set $data (printf "rdm-%s-api-key" $name) ($poller.apiKey | default "" | b64enc) -}}
{{- end -}}
{{- end -}}

{{/* llm-api-key: like the per-poller rdm-*-api-key entries, deliberately
     NOT auto-generated -- a random LLM API key is meaningless. Rendered
     (possibly empty) whenever no existingSecret is configured, so the
     enricher pod's secretKeyRef always resolves. */}}
{{- if not .Values.enricher.llm.existingSecret -}}
{{- $_ := set $data "llm-api-key" (.Values.enricher.llm.apiKey | default "" | b64enc) -}}
{{- end -}}

{{/* kafka-sasl-username / kafka-sasl-password: like the per-poller
     rdm-*-api-key entries and llm-api-key above, deliberately NOT
     auto-generated -- a random Kafka SASL credential is meaningless.
     Rendered (possibly empty) whenever no existingSecret is configured, so
     the trust-consumer pod's secretKeyRef always resolves instead of
     wedging in CreateContainerConfigError. */}}
{{- if not .Values.trustConsumer.kafka.existingSecret -}}
{{- $_ := set $data "kafka-sasl-username" (.Values.trustConsumer.kafka.saslUsername | default "" | b64enc) -}}
{{- $_ := set $data "kafka-sasl-password" (.Values.trustConsumer.kafka.saslPassword | default "" | b64enc) -}}
{{- end -}}

{{/* vapid-public-key / vapid-private-key: like kafka-sasl-*, deliberately
     NOT auto-generated -- these must be a real matched VAPID EC keypair
     (openssl ecparam -genkey -name prime256v1), not independent random
     strings. Rendered (possibly empty) whenever no existingSecret is
     configured, so the notifier pod's secretKeyRefs always resolve
     instead of wedging in CreateContainerConfigError -- notifier's own
     startup fail-fast (crates/notifier/src/main.rs) is what actually
     catches an empty value, the same division of labour trustConsumer's
     kafka-sasl-* pair uses. */}}
{{- if not .Values.notifier.vapid.existingSecret -}}
{{- $_ := set $data "vapid-public-key" (.Values.notifier.vapid.publicKey | default "" | b64enc) -}}
{{- $_ := set $data "vapid-private-key" (.Values.notifier.vapid.privateKey | default "" | b64enc) -}}
{{- end -}}

{{/* railMcp's own six LDBWS/Rail Data Marketplace credentials (Decision 5,
     unchanged by this integration): like llm-api-key/kafka-sasl-*,
     deliberately NOT auto-generated, since a random LDBWS key is
     meaningless. Rendered (possibly empty) whenever no
     railMcp.existingSecret is configured, so railmcp-deployment.yaml's
     secretKeyRefs always resolve. Used to also render discord-client-id/
     discord-allowed-user-ids here -- retired along with railMcp.discord.*
     (embedded-chatbot-shared-foundation-and-option-c plan, Task 8); see
     this file's own internal-complete-token block above for its
     replacement. */}}
{{- if not .Values.railMcp.existingSecret -}}
{{- $_ := set $data "ldbws-departures-url" (.Values.railMcp.ldbws.departuresUrl | default "" | b64enc) -}}
{{- $_ := set $data "ldbws-departures-key" (.Values.railMcp.ldbws.departuresKey | default "" | b64enc) -}}
{{- $_ := set $data "ldbws-arrivals-url" (.Values.railMcp.ldbws.arrivalsUrl | default "" | b64enc) -}}
{{- $_ := set $data "ldbws-arrivals-key" (.Values.railMcp.ldbws.arrivalsKey | default "" | b64enc) -}}
{{- $_ := set $data "ldbws-service-url" (.Values.railMcp.ldbws.serviceUrl | default "" | b64enc) -}}
{{- $_ := set $data "ldbws-service-key" (.Values.railMcp.ldbws.serviceKey | default "" | b64enc) -}}
{{- end -}}

{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "shared") | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "distant-signal.apiFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "distant-signal.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}

{{- if .Values.devAuthentik.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distant-signal.devAuthentikPostgresFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "devauthentik-postgres") | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "distant-signal.selectorLabels" (dict "root" . "component" "devauthentik-postgres") | nindent 4 }}
{{- end }}

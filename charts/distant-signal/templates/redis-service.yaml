{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "distant-signal.redisFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  selector:
    {{- include "distant-signal.selectorLabels" (dict "root" . "component" "redis") | nindent 4 }}
  ports:
    - port: {{ .Values.redis.service.port }}
      targetPort: redis
      protocol: TCP
      name: redis
{{- end }}

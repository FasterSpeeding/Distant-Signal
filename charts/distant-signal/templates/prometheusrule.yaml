{{/*
Prometheus Operator's PrometheusRule CRD -- Distant-Signal-specific alerts
only. Gated on metrics.prometheusRule.enabled (default false) for the same
reason as the PodMonitor: rendering a CRD-backed resource against a cluster
without the CRD fails `helm install` outright.

Scope: generic cluster-level signals (OOMKilled, restart spikes, pods not
ready, the movement-events lag-vs-MAXLEN/lag-growth rules keyed on the
cluster's own view) live in the cluster's own PrometheusRule (Ranma-Config's
monitoring-rules.yaml). These rules cover only what this chart's own
metrics can say, plus per-component memory headroom. Every alert name
starts with `DistantSignal` so nothing collides with the cluster's rules;
CI (`.github/workflows/ci.yml`, helm-lint job) asserts that prefix.

Every selector is scoped to namespace="<release namespace>", the label the
PodMonitor above attaches to every scraped series. The memory alert also
matches pod=~"<fullname>-.*", since cadvisor/kube-state-metrics series carry
no chart labels.

The counters these alerts key on (the three consumers' stream-gap
counters, movement-feed's dead-letter counters for each group and reason)
are registered at 0 when the process starts, so a plain `increase()` sees
their first increment. There is deliberately no "new series" clause
(`x unless x offset <window>`): every rollout creates new per-pod series,
so that clause fired on every rollout.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
{{- $rule := .Values.metrics.prometheusRule }}
{{- $ns := .Release.Namespace }}
{{- $fullname := include "distant-signal.fullname" . }}
{{- $runbookBase := trimSuffix "/" $rule.runbookBaseUrl }}
{{- $extraLabels := $rule.ruleLabels | default dict }}
{{- $movementOn := and .Values.movementRelay.enabled (or $rule.movementLag.enabled $rule.movementLagGrowing.enabled $rule.streamGap.enabled $rule.deadLetter.enabled $rule.deadLetterFull.enabled ($rule.relayPublishFailing).enabled ($rule.redisPersistence).enabled ($rule.groupRecreated).enabled) }}
{{- $fcwOn := and ($rule.fullCoverageWindow).enabled .Values.fullCoverageConsumer.windowedStats.enabled }}
{{- $pipelineOn := and ($rule.schedulePipeline).enabled .Values.scheduleFeed.enabled }}
{{- $anyOn := or $movementOn $rule.enricherErrors.enabled $rule.componentMemory.enabled $fcwOn $pipelineOn }}
{{- $notifierDroppedOn := ($rule.notifierPushDropped).enabled }}
{{- $archiveAlertOn := and ($rule.archiveUploadFailures).enabled .Values.archive.enabled }}
{{- $signupSpikeOn := ($rule.userSignupSpike).enabled }}
{{- $archiveExpiryOn := and ($rule.archiveExpiry).enabled .Values.archive.enabled (.Values.archive.expiry).enabled }}
{{- $anyOn = or $anyOn $notifierDroppedOn $archiveAlertOn $signupSpikeOn $archiveExpiryOn }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "metrics") | nindent 4 }}
    {{- with $rule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $rule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:{{ if not $anyOn }} []{{ end }}
    {{- if $movementOn }}
    - name: distant-signal.movement-events
      rules:
        {{- with $rule.movementLag }}
        {{- if .enabled }}
        {{- /*
        Lag per consumer group as a fraction of the movement-events MAXLEN
        cap. The cap comes from movement-relay's own
        distant_signal_movement_relay_stream_maxlen gauge; before an image
        exporting that gauge is running, the chart's configured
        movementRelay.streamMaxLen stands in for it. Once lag reaches the
        cap, unread entries start being trimmed before that group reads
        them (a stream gap).

        "Behind" is lag + pending: a consumer whose downstream is failing
        keeps reading new entries and leaves each failed batch pending, so
        its lag stays near 0 while the entries it must retry pile up in its
        pending list, where MAXLEN trims them just the same. Until a relay
        exporting stream_pending is running, pending counts as 0.
        */}}
        {{- $ratio := printf `(
  (
    max by (namespace, group) (distant_signal_movement_relay_stream_lag{namespace="%s"})
    + on (namespace, group)
    (
      max by (namespace, group) (distant_signal_movement_relay_stream_pending{namespace="%s"})
      or 0 * max by (namespace, group) (distant_signal_movement_relay_stream_lag{namespace="%s"})
    )
  )
  / on (namespace) group_left ()
  (
    max by (namespace) (distant_signal_movement_relay_stream_maxlen{namespace="%s"})
    or on (namespace)
    label_replace(vector(%d), "namespace", "%s", "", "")
  )
)` $ns $ns $ns $ns (int64 $.Values.movementRelay.streamMaxLen) $ns }}
        - alert: DistantSignalMovementLagHigh
          expr: |
            {{- printf "%s > %v" $ratio .warningRatio | nindent 12 }}
          for: {{ .for }}
          labels:
            severity: warning
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "movement-events group {{ "{{ $labels.group }}" }} is {{ "{{ $value | humanizePercentage }}" }} of the stream cap behind"
            description: >-
              Consumer group {{ "{{ $labels.group }}" }} in {{ "{{ $labels.namespace }}" }}
              has unread or un-ACKed movement-events entries amounting to
              {{ "{{ $value | humanizePercentage }}" }} of the stream's MAXLEN cap
              (warning above {{ .warningRatio }}). If lag reaches the cap, entries
              are trimmed before this group reads them. Check the consumer's
              logs and its downstream (api) health.
            runbook_url: {{ printf "%s/docs/superpowers/specs/2026-09-04-movement-relay-design.md" $runbookBase | quote }}
        - alert: DistantSignalMovementLagCritical
          expr: |
            {{- printf "%s > %v" $ratio .criticalRatio | nindent 12 }}
          for: {{ .for }}
          labels:
            severity: critical
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "movement-events group {{ "{{ $labels.group }}" }} is {{ "{{ $value | humanizePercentage }}" }} of the stream cap behind"
            description: >-
              Consumer group {{ "{{ $labels.group }}" }} in {{ "{{ $labels.namespace }}" }}
              has unread or un-ACKed movement-events entries amounting to
              {{ "{{ $value | humanizePercentage }}" }} of the stream's MAXLEN cap
              (critical above {{ .criticalRatio }}). Data loss (a stream gap) is
              close: fix the consumer, or raise movementRelay.streamMaxLen together
              with Redis maxmemory.
            runbook_url: {{ printf "%s/docs/superpowers/specs/2026-09-04-movement-relay-design.md" $runbookBase | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.movementLagGrowing }}
        {{- if .enabled }}
        {{- /*
        Lag never reads 0 (steady-state baseline is a few hundred entries),
        so this requires both a rising trend (deriv > 0) and a real net
        increase over the window, not merely a non-zero value.
        */}}
        - alert: DistantSignalMovementLagGrowing
          expr: |
            (
              max by (namespace, group) (deriv(distant_signal_movement_relay_stream_lag{namespace="{{ $ns }}"}[{{ .window }}])) > 0
            )
            and on (namespace, group)
            (
              max by (namespace, group) (delta(distant_signal_movement_relay_stream_lag{namespace="{{ $ns }}"}[{{ .window }}])) > {{ .minIncrease }}
            )
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "movement-events lag for group {{ "{{ $labels.group }}" }} keeps growing"
            description: >-
              Consumer group {{ "{{ $labels.group }}" }} in {{ "{{ $labels.namespace }}" }}
              has fallen further behind for the last {{ .window }} (more than
              {{ .minIncrease }} entries net): it is consuming slower than
              movement-relay publishes. Left alone, lag reaches the stream cap
              and entries are trimmed unread.
            runbook_url: {{ printf "%s/docs/superpowers/specs/2026-09-04-movement-relay-design.md" $runbookBase | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.streamGap }}
        {{- if .enabled }}
        {{- $w := .window }}
        - alert: DistantSignalStreamGap
          expr: |
            {{- range $i, $c := list "trust_consumer" "full_coverage_consumer" "trust_backlog_consumer" }}
            {{- $m := printf `distant_signal_%s_stream_gap_detected_total{namespace="%s"}` $c $ns }}
            {{ if $i }}or {{ end }}label_replace(sum by (namespace) (increase({{ $m }}[{{ $w }}])) > 0, "consumer", "{{ $c }}", "", "")
            {{- end }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.consumer }}" }} detected a movement-events stream gap"
            description: >-
              {{ "{{ $labels.consumer }}" }} in {{ "{{ $labels.namespace }}" }} found that
              movement-events entries were trimmed before it read them (within
              the last {{ .window }}). Those TRUST events are lost to it; treat
              that rail day's derived data as not clean. Usually preceded by
              DistantSignalMovementLagCritical.
            runbook_url: {{ printf "%s/docs/superpowers/specs/2026-09-04-movement-relay-design.md" $runbookBase | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.deadLetter }}
        {{- if .enabled }}
        {{- $m := printf `distant_signal_movement_feed_deadlettered_total{namespace="%s"}` $ns }}
        - alert: DistantSignalDeadLetterGrowing
          expr: |
            sum by (namespace, group, reason) (increase({{ $m }}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.group }}" }} dead-lettered movement-events records ({{ "{{ $labels.reason }}" }})"
            description: >-
              Consumer group {{ "{{ $labels.group }}" }} in {{ "{{ $labels.namespace }}" }}
              moved records to movement-events-deadletter in the last {{ .window }}
              (reason {{ "{{ $labels.reason }}" }}). This should normally stay at 0:
              inspect the records and re-inject or delete them.
            runbook_url: {{ printf "%s/docs/movement-events-deadletter.md" $runbookBase | quote }}
        {{- /*
        The length comes from movement-relay's own XLEN, read every lag
        tick. The consumers' movement_feed_deadletter_length is only set
        when one dead-letters something (absent after a restart, stale after
        a drain), so it only stands in until a relay exporting the fresh
        gauge is running.
        */}}
        - alert: DistantSignalDeadLetterNearFull
          expr: |
            (
              max by (namespace, stream) (distant_signal_movement_relay_deadletter_length{namespace="{{ $ns }}"})
              or max by (namespace, stream) (distant_signal_movement_feed_deadletter_length{namespace="{{ $ns }}"})
            ) / 10000 > {{ .nearFullRatio }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.stream }}" }} is {{ "{{ $value | humanizePercentage }}" }} full"
            description: >-
              The dead-letter stream {{ "{{ $labels.stream }}" }} in
              {{ "{{ $labels.namespace }}" }} holds {{ "{{ $value | humanizePercentage }}" }}
              of its 10,000-record cap (warning above {{ .nearFullRatio }}). It is
              never trimmed; once full, new poison records stay pending in their
              group instead. Drain it.
            runbook_url: {{ printf "%s/docs/movement-events-deadletter.md" $runbookBase | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.deadLetterFull }}
        {{- if .enabled }}
        {{- $m := printf `distant_signal_movement_feed_deadletter_full_total{namespace="%s"}` $ns }}
        - alert: DistantSignalDeadLetterFull
          expr: |
            sum by (namespace, group) (increase({{ $m }}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "movement-events-deadletter is full; {{ "{{ $labels.group }}" }} records are stuck pending"
            description: >-
              Consumer group {{ "{{ $labels.group }}" }} in {{ "{{ $labels.namespace }}" }}
              tried to dead-letter records in the last {{ .window }} but the
              dead-letter stream is at its 10,000-record cap. Those records stay
              pending and are retried forever until the stream is drained.
            runbook_url: {{ printf "%s/docs/movement-events-deadletter.md" $runbookBase | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.relayPublishFailing }}
        {{- if .enabled }}
        {{- /*
        Redis refusing movement-relay's XADDs (OOM at maxmemory, a failed
        AOF write, NOAUTH, Redis down) stops all TRUST ingestion without
        tripping any lag alert: the consumers stay caught up with a stream
        that no longer grows. The relay's /livez stays 200 (a failed cycle
        is progress), so nothing restarts it either; Kafka holds the
        backlog only for as long as the topic retains it.

        "Nothing published" is `(published or 0 * failures) == 0`: a relay
        that restarted while Redis was refusing writes has no published
        series at all, and a bare `published == 0` would then be empty.
        */}}
        {{- $failed := printf `sum by (namespace) (increase(distant_signal_movement_relay_errors_total{namespace="%s", operation=~"publish_event|redis_oom"}[%s]))` $ns .window }}
        - alert: DistantSignalMovementRelayPublishFailing
          expr: |
            {{ $failed }} > 0
            and on (namespace)
            (
              sum by (namespace) (increase(distant_signal_movement_relay_events_published_total{namespace="{{ $ns }}"}[{{ .window }}]))
              or on (namespace) 0 * {{ $failed }}
            ) == 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "movement-relay cannot publish to movement-events"
            description: >-
              movement-relay in {{ "{{ $labels.namespace }}" }} has failed every
              XADD for the last {{ .window }} and published nothing. TRUST
              ingestion is stopped; Kafka holds the backlog only as long as the
              topic retains it. Check the relay's logs (OOM: Redis is at
              maxmemory; MISCONF or an AOF error: see
              DistantSignalRedisPersistenceFailing) and Redis itself.
            runbook_url: {{ printf "%s/docs/superpowers/specs/2026-09-30-redis-message-queue-evaluation-design.md" $runbookBase | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.redisPersistence }}
        {{- if .enabled }}
        {{- /*
        From movement-relay's INFO persistence gauges (the chart ships no
        redis_exporter). A failed AOF write makes Redis refuse every write
        until one succeeds; a failed rewrite leaves the AOF growing until
        the disk fills. aof_enabled == 0 is only an error for the bundled
        Redis with persistence on (an external one may run without AOF).
        */}}
        - alert: DistantSignalRedisPersistenceFailing
          expr: |
            min by (namespace) (distant_signal_redis_aof_last_write_ok{namespace="{{ $ns }}"}) == 0
            or min by (namespace) (distant_signal_redis_aof_last_bgrewrite_ok{namespace="{{ $ns }}"}) == 0
            {{- if and $.Values.redis.enabled $.Values.redis.persistence.enabled }}
            or max by (namespace) (distant_signal_redis_aof_enabled{namespace="{{ $ns }}"}) == 0
            {{- end }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Redis AOF persistence is failing"
            description: >-
              Redis in {{ "{{ $labels.namespace }}" }} reports a failed AOF write
              or rewrite, or AOF switched off. A failed write makes it refuse
              every write (movement-relay stops publishing); a failed rewrite
              lets the AOF grow until the disk fills; with AOF off a restart
              loses movement-events and every consumer group. Check `INFO
              persistence`, the Redis logs and the disk behind /data.
            runbook_url: {{ printf "%s/docs/superpowers/specs/2026-09-30-redis-message-queue-evaluation-design.md" $runbookBase | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.groupRecreated }}
        {{- if .enabled }}
        {{- $m := printf `distant_signal_movement_feed_group_recreated_total{namespace="%s"}` $ns }}
        - alert: DistantSignalMovementGroupRecreated
          expr: |
            sum by (namespace, group) (increase({{ $m }}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "movement-events consumer group {{ "{{ $labels.group }}" }} was recreated"
            description: >-
              {{ "{{ $labels.group }}" }} in {{ "{{ $labels.namespace }}" }} found its
              consumer group missing (NOGROUP) within the last {{ .window }} and
              recreated it. Redis lost its data (AOF lost or unreadable, volume
              replaced) or the group was deleted. Its pending entries, and after
              an empty restart every entry it had not read, are gone; the stream
              gap check cannot see this. Treat that rail day as partial.
            runbook_url: {{ printf "%s/docs/superpowers/specs/2026-09-30-redis-message-queue-evaluation-design.md" $runbookBase | quote }}
        {{- end }}
        {{- end }}
    {{- end }}
    {{- with $rule.enricherErrors }}
    {{- if .enabled }}
    - name: distant-signal.enricher
      rules:
        - alert: DistantSignalEnricherErrors
          expr: |
            (
              sum by (namespace, call) (rate(distant_signal_enricher_llm_call_total{namespace="{{ $ns }}", outcome!="success"}[{{ .window }}]))
              / sum by (namespace, call) (rate(distant_signal_enricher_llm_call_total{namespace="{{ $ns }}"}[{{ .window }}]))
            ) > {{ .errorRatio }}
            and on (namespace, call)
            sum by (namespace, call) (increase(distant_signal_enricher_llm_call_total{namespace="{{ $ns }}", outcome!="success"}[{{ .window }}])) >= {{ .minErrors }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "enricher LLM {{ "{{ $labels.call }}" }} calls failing ({{ "{{ $value | humanizePercentage }}" }})"
            description: >-
              {{ "{{ $value | humanizePercentage }}" }} of enricher's
              {{ "{{ $labels.call }}" }} LLM calls in {{ "{{ $labels.namespace }}" }}
              failed over the last {{ .window }} (threshold {{ .errorRatio }}, at
              least {{ .minErrors }} errors). Incidents are not being enriched;
              check the LLM endpoint (enricher.llm.baseUrl) and enricher's logs.
    {{- end }}
    {{- end }}
    {{- if $fcwOn }}
    {{- with $rule.fullCoverageWindow }}
    {{- /*
    Windowed full-coverage stats
    (docs/superpowers/specs/2026-09-27-full-coverage-windowed-stats-design.md).
    Gated on fullCoverageConsumer.windowedStats.enabled via $fcwOn: with the
    feature off the consumer never posts windows, so these would be noise.
    The counters are registered at 0 on startup (a plain increase()/rate()
    sees the first increment).
    */}}
    - name: distant-signal.full-coverage-window
      rules:
        - alert: DistantSignalFullCoverageWindowFeedStale
          expr: |
            max by (namespace) (distant_signal_full_coverage_consumer_window_feed_stale{namespace="{{ $ns }}"}) == 1
          for: {{ .feedStaleFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "full-coverage windows marked feed_stale for {{ .feedStaleFor }}"
            description: >-
              full-coverage-consumer in {{ "{{ $labels.namespace }}" }} has marked
              its windows feed_stale for {{ .feedStaleFor }}: too few TRUST
              Activations in the last hour, or no movement event recently. No
              window influences severity and no train is presumed cancelled
              meanwhile. Expected during a known TRUST outage; otherwise check
              movement-relay and the consumer's lag.
            runbook_url: {{ printf "%s/docs/superpowers/specs/2026-09-27-full-coverage-windowed-stats-design.md" $runbookBase | quote }}
        - alert: DistantSignalFullCoverageWindowPostErrors
          expr: |
            sum by (namespace) (increase(distant_signal_full_coverage_consumer_errors_total{namespace="{{ $ns }}", operation="post_window_stats"}[{{ .postErrorsWindow }}])) > 0
          for: {{ .postErrorsFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "full-coverage window stats POSTs failing"
            description: >-
              full-coverage-consumer in {{ "{{ $labels.namespace }}" }} failed to
              POST its windows to /private/full-coverage-window-stats within the
              last {{ .postErrorsWindow }}. An api without that route (not yet
              deployed, or its migrations not run) answers 404; check api's logs
              and the consumer's warn log.
            runbook_url: {{ printf "%s/docs/superpowers/specs/2026-09-27-full-coverage-windowed-stats-design.md" $runbookBase | quote }}
        - alert: DistantSignalFullCoverageWindowStatsStalled
          expr: |
            sum by (namespace) (rate(distant_signal_full_coverage_consumer_window_rows_posted_total{namespace="{{ $ns }}"}[{{ .stalledWindow }}])) == 0
          for: {{ .stalledFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "no full-coverage window rows posted"
            description: >-
              full-coverage-consumer in {{ "{{ $labels.namespace }}" }} is running
              with windowed stats on but has posted no window rows over
              {{ .stalledWindow }} for {{ .stalledFor }}. It posts every stats
              write (about every minute) once the startup replay is done;
              check for a stuck replay, a population that never loaded, or
              failing POSTs (DistantSignalFullCoverageWindowPostErrors).
            runbook_url: {{ printf "%s/docs/superpowers/specs/2026-09-27-full-coverage-windowed-stats-design.md" $runbookBase | quote }}
    {{- end }}
    {{- end }}
    {{- with $rule.componentMemory }}
    {{- if .enabled }}
    - name: distant-signal.resources
      rules:
        {{- /*
        cadvisor (kubelet) working set over kube-state-metrics' memory limit,
        per container, for every pod this release deploys. Containers
        without a memory limit have no limit series and never match.
        */}}
        - alert: DistantSignalComponentMemoryHigh
          expr: |
            (
              max by (namespace, pod, container) (container_memory_working_set_bytes{namespace="{{ $ns }}", pod=~"{{ $fullname }}-.*", container!="", container!="POD"})
              / on (namespace, pod, container)
              max by (namespace, pod, container) (kube_pod_container_resource_limits{namespace="{{ $ns }}", pod=~"{{ $fullname }}-.*", resource="memory"})
            ) > {{ .ratio }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.pod }}" }}/{{ "{{ $labels.container }}" }} at {{ "{{ $value | humanizePercentage }}" }} of its memory limit"
            description: >-
              Container {{ "{{ $labels.container }}" }} in pod {{ "{{ $labels.pod }}" }}
              ({{ "{{ $labels.namespace }}" }}) has used more than {{ .ratio }} of
              its memory limit for {{ .for }}. It is at risk of being OOMKilled;
              raise its resources.limits.memory or find the growth.
    {{- end }}
    {{- end }}
    {{- with $rule.notifierPushDropped }}
    {{- if .enabled }}
    - name: distant-signal.notifier
      rules:
        {{- /*
        Notifier delivery is at-most-once by decision (triage DQ9): a push
        that ends undelivered is counted, not retried beyond the cursor
        grace window. See crates/notifier/src/push_queue.rs's module doc
        for every reason label.
        */}}
        - alert: DistantSignalNotifierPushDropped
          expr: |
            sum by (namespace, reason) (increase(distant_signal_notifier_push_dropped_total{namespace="{{ $ns }}"}[{{ .window }}])) >= {{ .minDrops }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "notifier dropped {{ "{{ $value }}" }} pushes ({{ "{{ $labels.reason }}" }})"
            description: >-
              The notifier in {{ "{{ $labels.namespace }}" }} dropped
              {{ "{{ $value }}" }} decided notifications with reason
              {{ "{{ $labels.reason }}" }} over the last {{ .window }}. Delivery
              is at-most-once, so these users may never get them.
              queue_full/user_queue_full: raise notifier push queue capacity or
              workers. send_failed: push endpoints are failing (check
              distant_signal_notifier_push_send_total by outcome). error: the
              notifier could not load subscriptions (check the database).
            runbook_url: {{ printf "%s/docs/superpowers/specs/2026-09-02-line-status-notifications-design.md#delivery-guarantee-at-most-once" $runbookBase | quote }}
    {{- end }}
    {{- end }}
    {{- if $signupSpikeOn }}
    {{- with $rule.userSignupSpike }}
    - name: distant-signal.users
      rules:
        {{- /*
        Sign-up is open: any account the IdP lets in (in production, any
        Discord account through Authentik's Discord source) gets a users
        row on its first login. A burst of new accounts is either real
        growth or scripted sign-ups (spam, abuse of /chat or the MCP). The
        counter is api's, incremented once per users row created.
        */}}
        - alert: DistantSignalUserSignupSpike
          expr: |
            sum by (namespace) (increase({{ .metric }}{namespace="{{ $ns }}"}[{{ .window }}])) > {{ .threshold }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $value | humanize }}" }} new user accounts in {{ .window }}"
            description: >-
              api in {{ "{{ $labels.namespace }}" }} created about
              {{ "{{ $value | humanize }}" }} user accounts over the last
              {{ .window }} (threshold {{ .threshold }}). Sign-up is open to
              any account the IdP admits, so check whether this is real
              growth or scripted sign-ups: look at the newest rows in
              `users` and the IdP's enrolment log. To stop it, restrict
              the IdP's enrolment (e.g. bind the application to a group),
              then revoke the unwanted sessions.
            runbook_url: {{ printf "%s/docs/session-revocation.md" $runbookBase | quote }}
    {{- end }}
    {{- end }}
    {{- if $archiveAlertOn }}
    {{- with $rule.archiveUploadFailures }}
    - name: distant-signal.archive
      rules:
        {{- /*
        Renders only with archive.enabled. Under the default `retain`
        failure policy a failed upload keeps the rows, so the trains table
        grows past its retention window while this fires; under `delete`
        the rows are gone unarchived.
        */}}
        - alert: DistantSignalArchiveUploadFailures
          expr: |
            sum by (namespace) (increase(distant_signal_aggregator_archive_upload_failures_total{namespace="{{ $ns }}"}[{{ .window }}])) >= {{ .minFailures }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "cold archive uploads failing ({{ "{{ $value }}" }} in {{ .window }})"
            description: >-
              The aggregator in {{ "{{ $labels.namespace }}" }} failed
              {{ "{{ $value }}" }} cold-archive batch uploads or verifications over
              the last {{ .window }}. With failurePolicy retain the trains
              table is growing past its retention window; with delete, rows
              are being pruned without an archive. Check the object store
              and the aggregator's "archiving a trains batch failed" logs.
            runbook_url: {{ printf "%s/docs/cold-archive.md" $runbookBase | quote }}
    {{- end }}
    {{- end }}
    {{- if $archiveExpiryOn }}
    {{- $retentionDays := int .Values.archive.expiry.retentionDays }}
    {{- with $rule.archiveExpiry }}
    - name: distant-signal.archive-expiry
      rules:
        {{- /*
        Renders only with archive.enabled and archive.expiry.enabled. The
        counters are registered at 0 when the aggregator starts, and a run
        happens once a day, so `window` should stay at least a day.
        */}}
        - alert: DistantSignalArchiveExpiryErrors
          expr: |
            sum by (namespace) (increase(distant_signal_aggregator_archive_expiry_errors_total{namespace="{{ $ns }}"}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "cold archive expiry failing ({{ "{{ $value }}" }} errors in {{ .window }})"
            description: >-
              The aggregator in {{ "{{ $labels.namespace }}" }} hit
              {{ "{{ $value }}" }} cold-archive expiry errors over the last
              {{ .window }} (a failed LIST or DELETE, or a key refused by the
              pre-delete check; see the `stage` label on
              distant_signal_aggregator_archive_expiry_errors_total). Expired
              objects stay until a run succeeds. Check the object store and
              the aggregator's "archive expiry" logs.
            runbook_url: {{ printf "%s/docs/cold-archive.md#object-expiry" $runbookBase | quote }}
        - alert: DistantSignalArchiveExpiryUnmatchedKeys
          expr: |
            sum by (namespace, table) (increase(distant_signal_aggregator_archive_expiry_skipped_unmatched_total{namespace="{{ $ns }}"}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "unexpected keys under the cold archive's {{ "{{ $labels.table }}" }} prefix"
            description: >-
              Archive expiry in {{ "{{ $labels.namespace }}" }} listed keys
              under the {{ "{{ $labels.table }}" }} prefix that do not match
              the archive layout. They are never deleted. Something other
              than the aggregator writes there, or the prefix is shared: the
              aggregator logs the first keys each run.
            runbook_url: {{ printf "%s/docs/cold-archive.md#object-expiry" $runbookBase | quote }}
        - alert: DistantSignalArchiveExpiryCapReached
          expr: |
            sum by (namespace) (increase(distant_signal_aggregator_archive_expiry_cap_reached_total{namespace="{{ $ns }}"}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "cold archive expiry hit its per-run delete cap"
            description: >-
              An archive expiry run in {{ "{{ $labels.namespace }}" }} found
              more expired objects than archive.expiry.maxDeletesPerRun and
              stopped at the cap (in dry-run: would have). Expected once
              after a long outage or a retention cut; otherwise check
              distant_signal_aggregator_archive_expiry_candidates before
              raising the cap.
            runbook_url: {{ printf "%s/docs/cold-archive.md#object-expiry" $runbookBase | quote }}
        {{- /*
        The oldest archived service_date is older than the retention plus a
        grace period: expiry is not running, is failing, or is still in
        dry-run past the point the first objects came due. `> 0` skips a
        gauge that has not been set yet.
        */}}
        - alert: DistantSignalArchiveExpiryOverdue
          expr: |
            (time() - min by (namespace, table) (distant_signal_aggregator_archive_oldest_service_date_seconds{namespace="{{ $ns }}"} > 0)) > {{ mul (add $retentionDays (int .overdueGraceDays)) 86400 }}
          for: {{ .overdueFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "cold archive holds {{ "{{ $labels.table }}" }} objects past retention"
            description: >-
              The oldest archived {{ "{{ $labels.table }}" }} service_date in
              {{ "{{ $labels.namespace }}" }} is more than
              {{ $retentionDays }} + {{ .overdueGraceDays }} days old. Expiry
              is not running, is failing, or is still in dry-run
              (distant_signal_aggregator_archive_expiry_dry_run is 1): switch
              archive.expiry.dryRun off.
            runbook_url: {{ printf "%s/docs/cold-archive.md#object-expiry" $runbookBase | quote }}
    {{- end }}
    {{- end }}
    {{- if $pipelineOn }}
    {{- with $rule.schedulePipeline }}
    - name: distant-signal.schedule-pipeline
      rules:
        {{- /*
        PL-15e: schedule-reference waits (with backoff, while /healthz stays
        healthy) for api to answer its startup seed GET. 0 until it does.
        */}}
        - alert: DistantSignalScheduleReferenceNotSeeded
          expr: |
            max by (namespace) (distant_signal_schedule_reference_seeded{namespace="{{ $ns }}"}) == 0
          for: {{ .notSeededFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "schedule-reference has not seeded for {{ .notSeededFor }}"
            description: >-
              schedule-reference in {{ "{{ $labels.namespace }}" }} has been
              waiting for {{ .notSeededFor }} to read its last completed publish
              from api (GET /private/schedule-reference-publishes), so it
              publishes nothing. Check api and the internal OAuth token
              endpoint; the container's warn log names the error.
        {{- /*
        PL-5: schedule-ingest quarantined an uploaded delivery zip that
        declares more than scheduleFeed's extraction caps, or whose entries
        inflate to a size other than they declare. The CIF pipeline stays on
        the previous delivery until a new upload replaces it.
        */}}
        - alert: DistantSignalScheduleFeedZipRejected
          expr: |
            sum by (namespace) (increase(distant_signal_schedule_feed_zip_rejected_total{namespace="{{ $ns }}"}[{{ .zipRejectedWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "schedule-ingest rejected a delivery zip"
            description: >-
              schedule-ingest in {{ "{{ $labels.namespace }}" }} refused to
              extract the uploaded CIF delivery zip (over MAX_EXTRACTED_BYTES
              or MAX_ZIP_ENTRIES, or an entry larger than it declares). The
              timetable is not refreshed until a new upload replaces it. The
              ingest container's error log names the reason.
        {{- /*
        CORPUS (scheduleFeed.corpus): schedule-ingest refused a CORPUS
        extract (not gzip, not the TIPLOCDATA JSON, too few rows, a row
        without an NLC, or over the decompression cap). The series only
        exists while CORPUS ingest is enabled. corpus_locations keeps the
        previous delivery.
        */}}
        - alert: DistantSignalCorpusRejected
          expr: |
            sum by (namespace) (increase(distant_signal_schedule_feed_corpus_rejected_total{namespace="{{ $ns }}"}[{{ .zipRejectedWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "schedule-ingest rejected a CORPUS extract"
            description: >-
              schedule-ingest in {{ "{{ $labels.namespace }}" }} refused to
              load an uploaded CORPUS extract and moved it to
              /data/schedule-feed/corpus/rejected/. corpus_locations keeps
              the previous delivery. The ingest container's error log names
              the reason.
        {{- /*
        CORPUS (scheduleFeed.corpus): the newest loaded CORPUS delivery is
        older than corpusStaleAfterDays. api sets the gauge from
        corpus_deliveries at startup and after each load, so it survives
        restarts between monthly deliveries; it does not exist before the
        first load, so a freshly enabled install waiting for its first
        delivery does not fire. Renders only while CORPUS ingest is on, so
        a disabled feature (whose old deliveries still set the gauge) never
        alerts.
        */}}
        {{- if ($.Values.scheduleFeed.corpus).enabled }}
        - alert: DistantSignalCorpusStale
          expr: |
            time() - max by (namespace) (distant_signal_api_corpus_last_delivered_at_seconds{namespace="{{ $ns }}"}) > {{ mul (int .corpusStaleAfterDays) 86400 }}
          for: 1h
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "no CORPUS delivery loaded for {{ .corpusStaleAfterDays }} days"
            description: >-
              The newest Network Rail CORPUS extract loaded in
              {{ "{{ $labels.namespace }}" }} was delivered over
              {{ .corpusStaleAfterDays }} days ago (CORPUS is published
              monthly). Either RDM stopped pushing it (check the SFTP
              corpus folder) or schedule-ingest cannot load it (check
              DistantSignalCorpusRejected and the ingest container's
              error log). The previous extract stays in use.
        {{- end }}
        {{- /*
        SCHED-2: the delivery timestamp of the last delivery every product
        of which published (seeded at startup from api's durable marker).
        Deliveries land nightly, so this covers a missing delivery, a
        delivery that keeps failing to publish, and a wedged publisher.
        */}}
        - alert: DistantSignalScheduleReferencePublishStale
          expr: |
            time() - max by (namespace) (distant_signal_schedule_reference_last_published_delivery_timestamp_seconds{namespace="{{ $ns }}"}) > {{ mul (int .staleAfterHours) 3600 }}
          for: 15m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "no CIF delivery fully published for {{ .staleAfterHours }}h"
            description: >-
              schedule-reference in {{ "{{ $labels.namespace }}" }} last fully
              published a delivery timestamped over {{ .staleAfterHours }} hours
              ago. Either no new delivery arrived (check schedule-ingest and the
              SFTP upload) or one keeps failing to publish (check
              distant_signal_schedule_reference_publishes_total by outcome, and
              the reference container's error log).
        {{- /*
        SCHED-2: api skipped a final chunk's delete because the staged key
        count did not match the publisher's total, so rows missing from that
        publish stay until the next complete one.
        */}}
        - alert: DistantSignalSchedulePublishStagedMismatch
          expr: |
            sum by (namespace, product) (increase(distant_signal_api_schedule_publish_staged_mismatch_total{namespace="{{ $ns }}"}[{{ .mismatchWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.product }}" }} publish kept stale rows"
            description: >-
              api in {{ "{{ $labels.namespace }}" }} finished a
              {{ "{{ $labels.product }}" }} publish whose staged key count did not
              match the publisher's total, so it did not delete the rows that
              publish left out. They stay until the next complete publish;
              api's warn log has the publish_id and both counts.
        {{- /*
        DQ6/SCHED-1: api answered 400/413/422 to one of schedule-reference's
        products. That is permanent for the delivery: it is not retried, and
        the durable completion marker is not written (so a restart tries the
        delivery again). The product's previous rows stay in place.
        */}}
        - alert: DistantSignalScheduleReferencePublishRejected
          expr: |
            sum by (namespace, product) (increase(distant_signal_schedule_reference_publishes_total{namespace="{{ $ns }}", outcome="rejected"}[{{ .rejectedWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "api rejected schedule-reference's {{ "{{ $labels.product }}" }} publish"
            description: >-
              api in {{ "{{ $labels.namespace }}" }} refused schedule-reference's
              {{ "{{ $labels.product }}" }} data with 400, 413 or 422. It is not
              retried for this delivery and the delivery is not recorded as
              published, so that product keeps its previous rows. Usually a
              schema skew between the two services or an oversized chunk; the
              reference container's error log has api's response body.
        {{- /*
        DQ11/PL-9: schedule-reference publishes each line's population for
        today and tomorrow, so the rail day's population normally exists a
        day early. full-coverage-consumer exports how many lines still have
        none for the current rail day, but only once it is past 06:00 London
        (0 before), so this alert needs no time-of-day logic.
        */}}
        - alert: DistantSignalLinePopulationMissing
          expr: |
            max by (namespace) (distant_signal_full_coverage_consumer_population_missing_past_deadline_lines{namespace="{{ $ns }}"}) > 0
          for: {{ .populationMissingFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $value }}" }} lines have no schedule population for today"
            description: >-
              After 06:00 London, full-coverage-consumer in
              {{ "{{ $labels.namespace }}" }} still has no schedule line population
              for today's rail day on {{ "{{ $value }}" }} line(s), so their
              full-coverage stats stay Pending. Check that last night's and the
              previous CIF delivery published (DistantSignalScheduleReferencePublishStale),
              and the consumer's population reload errors.
    {{- end }}
    {{- end }}
{{- end }}
{{- /*
Poller alerts (SVC-04, SVC-08), in their own PrometheusRule so this file's
main resource above stays untouched. Same gating, prefix and namespace
scoping as above.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
{{- $rule := .Values.metrics.prometheusRule }}
{{- $ns := .Release.Namespace }}
{{- $fullname := include "distant-signal.fullname" . }}
{{- $extraLabels := $rule.ruleLabels | default dict }}
{{- $anyPoller := or .Values.pollerIrishRailGtfs.enabled .Values.pollerIrishRailLive.enabled .Values.pollerNirStations.enabled }}
{{- range $name, $poller := .Values.pollers }}
{{- if $poller.enabled }}
{{- $anyPoller = true }}
{{- end }}
{{- end }}
{{- $pollerFailuresOn := and ($rule.pollerFailures).enabled $anyPoller }}
{{- $ldbwsOn := and ($rule.ldbwsStalestStation).enabled (.Values.pollers.ldbws).enabled }}
{{- $ldbwsInvalidCrsOn := and ($rule.ldbwsInvalidCrs).enabled (.Values.pollers.ldbws).enabled }}
{{- if or $pollerFailuresOn $ldbwsOn $ldbwsInvalidCrsOn }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-pollers" $fullname | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "metrics") | nindent 4 }}
    {{- with $rule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $rule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: distant-signal.pollers
      rules:
        {{- with $rule.pollerFailures }}
        {{- if $pollerFailuresOn }}
        {{- /*
        No successful cycle, and at least one failed one, in the window. A
        poller whose process has only ever failed has no success series,
        hence the `or ... 0 *` fallback. Daily pollers (stations, tocs) run
        one cycle a day, so one failed daily cycle is enough to fire.
        */}}
        {{- /*
        Second clause (failureRatio, when set): more than failureRatio of the
        cycles over ratioWindow failed, so a poller that still succeeds now
        and then but mostly fails also fires. This is the condition the
        cluster's own copy of this alert used (failure rate > 0.5 over 30m,
        for 30m); a 1h window with no `for` needs a similar hour of mostly
        failed cycles.
        */}}
        {{- $failures := printf `sum by (namespace, poller) (increase(distant_signal_poller_cycle_total{namespace="%s", result="failure"}[%s]))` $ns .window }}
        {{- $successes := printf `sum by (namespace, poller) (increase(distant_signal_poller_cycle_total{namespace="%s", result="success"}[%s]))` $ns .window }}
        - alert: DistantSignalPollerFailing
          expr: |
            (
              {{ $failures }} > 0
              and on (namespace, poller)
              (
                {{ $successes }}
                or on (namespace, poller)
                0 * {{ $failures }}
              ) == 0
            )
            {{- if .failureRatio }}
            or on (namespace, poller)
            (
              sum by (namespace, poller) (increase(distant_signal_poller_cycle_total{namespace="{{ $ns }}", result="failure"}[{{ .ratioWindow }}]))
              /
              sum by (namespace, poller) (increase(distant_signal_poller_cycle_total{namespace="{{ $ns }}"}[{{ .ratioWindow }}]))
              > {{ .failureRatio }}
            )
            {{- end }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "poller {{ "{{ $labels.poller }}" }} is failing its poll cycles"
            description: >-
              Poller {{ "{{ $labels.poller }}" }} in {{ "{{ $labels.namespace }}" }}
              completed no successful poll cycle and at least one failed one over
              the last {{ .window }}{{ if .failureRatio }}, or failed more than
              {{ .failureRatio }} of its cycles over the last {{ .ratioWindow }}{{ end }},
              so its product is going stale. Check the poller's logs: its
              upstream feed (National Rail, TfL, Irish Rail), its credentials
              or an expired key, and api's /private ingest route.
        {{- end }}
        {{- end }}
        {{- with $rule.ldbwsStalestStation }}
        {{- if $ldbwsOn }}
        - alert: DistantSignalLdbwsStationStale
          expr: |
            max by (namespace) (distant_signal_ldbws_stalest_station_age_seconds{namespace="{{ $ns }}"}) > {{ .maxAgeSeconds }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "an LDBWS station has not been sampled for {{ "{{ $value | humanizeDuration }}" }}"
            description: >-
              The least recently sampled LDBWS station in {{ "{{ $labels.namespace }}" }}
              was last sampled {{ "{{ $value | humanizeDuration }}" }} ago (threshold
              {{ .maxAgeSeconds }}s). The rotation (SVC-04) has stopped reaching part
              of the station list, e.g. every cycle runs out of budget first; see
              distant_signal_ldbws_stations_attempted_per_cycle against
              distant_signal_ldbws_stations_total. Stations LDBWS rejects as an
              invalid CRS are excluded here; see DistantSignalLdbwsInvalidCrs.
        {{- end }}
        {{- end }}
        {{- with $rule.ldbwsInvalidCrs }}
        {{- if $ldbwsInvalidCrsOn }}
        - alert: DistantSignalLdbwsInvalidCrs
          expr: |
            max by (namespace, crs) (distant_signal_ldbws_invalid_crs_station{namespace="{{ $ns }}"}) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "LDBWS rejects sample station {{ "{{ $labels.crs }}" }} as an invalid CRS code"
            description: >-
              LDBWS answers "Invalid crs code supplied" for sample station
              {{ "{{ $labels.crs }}" }} in {{ "{{ $labels.namespace }}" }}, so no line
              gets LDBWS data from it. It is almost certainly a typo in a
              lines/*.toml sample_stations entry (e.g. "ANV" for Andover's
              "ADV"): find the file listing it, fix it, run
              `cargo run -p line-catalogue-validator` and redeploy api.
              poller-ldbws excludes the station from
              distant_signal_ldbws_stalest_station_age_seconds and re-probes it
              hourly; the alert clears once api stops listing it or LDBWS
              accepts it.
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}

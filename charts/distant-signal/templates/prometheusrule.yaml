{{/*
Prometheus Operator's PrometheusRule CRD -- Distant-Signal-specific alerts
only. Gated on metrics.prometheusRule.enabled (default false) for the same
reason as the PodMonitor: rendering a CRD-backed resource against a cluster
without the CRD fails `helm install` outright.

Scope: generic cluster-level signals (OOMKilled, restart spikes, pods not
ready, the movement-events lag-vs-MAXLEN/lag-growth rules keyed on the
cluster's own view) live in the cluster's own PrometheusRule (Ranma-Config's
monitoring-rules.yaml). These rules cover only what this chart's own
metrics can say, plus per-component memory headroom. Every alert name
starts with `DistantSignal` so nothing collides with the cluster's rules;
CI (`.github/workflows/ci.yml`, helm-lint job) asserts that prefix.

Every selector is scoped to namespace="<release namespace>", the label the
PodMonitor above attaches to every scraped series.

Payload size (2026-10-01 outage): ntfy refuses a notification over 4,096
bytes, and Alertmanager's webhook carries each alert's annotations, labels
and generatorURL (the URL-encoded expr). So every alert keeps a one-line
`summary` (<= 80 chars), a `description` (<= 150 chars) and a runbook_url
into docs/alerts.md, where the longer prose lives; and any expr longer than
about 300 chars is a recording rule (`distant_signal:<what>:<how>`) earlier
in the same group, which the alert compares against. Prometheus evaluates a
group's rules in order, so the alert sees this evaluation's recorded value
and fires exactly as the inline expr did. scripts/check-alert-payloads.py
(CI's scripts-lint job) enforces the limits. The memory alert also
matches pod=~"<fullname>-.*", since cadvisor/kube-state-metrics series carry
no chart labels.

The counters these alerts key on (the three consumers' stream-gap
counters, movement-feed's dead-letter counters for each group and reason)
are registered at 0 when the process starts, so a plain `increase()` sees
their first increment. There is deliberately no "new series" clause
(`x unless x offset <window>`): every rollout creates new per-pod series,
so that clause fired on every rollout.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
{{- $rule := .Values.metrics.prometheusRule }}
{{- $ns := .Release.Namespace }}
{{- $fullname := include "distant-signal.fullname" . }}
{{- $runbookBase := trimSuffix "/" $rule.runbookBaseUrl }}
{{- $runbook := printf "%s/docs/alerts.md" $runbookBase }}
{{- $extraLabels := $rule.ruleLabels | default dict }}
{{- $movementOn := and .Values.movementRelay.enabled (or $rule.movementLag.enabled $rule.movementLagGrowing.enabled $rule.streamGap.enabled $rule.deadLetter.enabled $rule.deadLetterFull.enabled ($rule.relayPublishFailing).enabled ($rule.redisPersistence).enabled ($rule.groupRecreated).enabled ($rule.deadLetterExpiring).enabled ($rule.longPending).enabled ($rule.parseEnvelope).enabled) }}
{{- $fcwOn := and ($rule.fullCoverageWindow).enabled .Values.fullCoverageConsumer.windowedStats.enabled }}
{{- $pipelineOn := and ($rule.schedulePipeline).enabled .Values.scheduleFeed.enabled }}
{{- $sftpOn := and ($rule.scheduleSftp).enabled .Values.scheduleFeed.enabled .Values.scheduleFeed.sftp.enabled .Values.scheduleFeed.sftp.telemetry.enabled }}
{{- $bucketOn := and ($rule.scheduleBucket).enabled .Values.scheduleFeed.enabled (.Values.scheduleFeed.bucket).enabled }}
{{- $anyOn := or $movementOn $rule.enricherErrors.enabled $rule.componentMemory.enabled $fcwOn $pipelineOn $sftpOn $bucketOn }}
{{- $notifierDroppedOn := ($rule.notifierPushDropped).enabled }}
{{- $archiveAlertOn := and ($rule.archiveUploadFailures).enabled .Values.archive.enabled }}
{{- $signupSpikeOn := ($rule.userSignupSpike).enabled }}
{{- $archiveExpiryOn := and ($rule.archiveExpiry).enabled .Values.archive.enabled (.Values.archive.expiry).enabled }}
{{- $postgresDownOn := ($rule.postgresDown).enabled }}
{{- $apiDbDownOn := ($rule.apiDatabaseDown).enabled }}
{{- $consumerApiOn := ($rule.consumerApiErrors).enabled }}
{{- $cyclesOn := ($rule.cycleStalled).enabled }}
{{- $api5xxOn := ($rule.api5xx).enabled }}
{{- $schemaGateOn := ($rule.schemaGateWaiting).enabled }}
{{- $imagePullOn := and ($rule.statefulImagePull).enabled (or .Values.postgresql.enabled .Values.redis.enabled) }}
{{- $healthOn := or $postgresDownOn $apiDbDownOn $schemaGateOn $consumerApiOn $cyclesOn $api5xxOn $imagePullOn }}
{{- $tokenExchangeOn := and ($rule.enricherTokenExchange).enabled (include "distant-signal.enricherWif" .) }}
{{- $writerDownOn := and ($rule.ingestWriterDown).enabled .Values.ingestWriter.enabled }}
{{- $ingestStreamsOn := and .Values.ingestWriter.enabled (or ($rule.ingestStreamBacklog).enabled ($rule.ingestStreamStalled).enabled ($rule.ingestDeadLetters).enabled ($rule.ingestDeadLetterExpiring).enabled ($rule.ingestUnsupportedSchema).enabled ($rule.ingestProducerXaddFailing).enabled ($rule.ingestStreamMemoryHigh).enabled ($rule.ingestClockSkew).enabled) }}
{{- $anyOn = or $anyOn $notifierDroppedOn $archiveAlertOn $signupSpikeOn $archiveExpiryOn $healthOn $tokenExchangeOn $writerDownOn $ingestStreamsOn }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "metrics") | nindent 4 }}
    {{- with $rule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $rule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:{{ if not $anyOn }} []{{ end }}
    {{- if $healthOn }}
    - name: distant-signal.health
      rules:
        {{- with $rule.postgresDown }}
        {{- if .enabled }}
        {{- /*
        2026-10-01: Postgres was down for six hours and the only alert was
        the cluster's PostgresExporterDown (a warning, blaming the
        exporter). Two sources, either enough: postgres_exporter's pg_up
        (the exporter is not part of this chart; pgUpSelector narrows its
        series), and, for the bundled Postgres, the StatefulSet's ready
        replicas from kube-state-metrics, which still answers while the
        exporter is down too.
        */}}
        {{- $pgUp := printf "namespace=%q" $ns }}
        {{- with .pgUpSelector }}
        {{- $pgUp = printf "%s, %s" $pgUp . }}
        {{- end }}
        - alert: DistantSignalPostgresDown
          expr: |
            max by (namespace) (pg_up{ {{- $pgUp -}} }) == 0
            {{- if $.Values.postgresql.enabled }}
            or max by (namespace) (kube_statefulset_status_replicas_ready{namespace="{{ $ns }}", statefulset="{{ include "distant-signal.postgresFullname" $ }}"}) < 1
            {{- end }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "the Distant Signal database is down"
            description: "pg_up is 0, or the bundled Postgres has no ready replica. api, the consumers and the aggregator cannot read or write."
            runbook_url: {{ printf "%s#distantsignalpostgresdown" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.statefulImagePull }}
        {{- if .enabled }}
        {{- /*
        2026-10-01: postgres-0 was recreated on an image from a new private
        registry and sat in ImagePullBackOff/ErrImagePull for ~6h with DS
        down; the cluster's KubeContainerWaiting only reached pending. Both
        singletons delete their one pod before starting its replacement
        (StatefulSet; Recreate Deployment), so a pull that never succeeds is
        an outage, not a stalled rollout. Reads kube-state-metrics' waiting
        reason for containers and init containers (one selector via a
        __name__ regex, which keeps the expr short; Redis's ACL
        initContainer pulls an image too). `reason` is aggregated away: it
        flips between ErrImagePull and ImagePullBackOff on every retry,
        which would restart `for`. Pod names: the StatefulSet's
        <fullname>-postgres-<ordinal>, the Deployment's
        <fullname>-redis-<pod-template-hash>-<suffix>.
        */}}
        {{- $cfg := . }}
        {{- $pods := list }}
        {{- if $.Values.postgresql.enabled }}
        {{- $pods = append $pods (list "postgres" (printf "%s-[0-9]+" (include "distant-signal.postgresFullname" $)) $cfg.postgresSeverity "DS is down") }}
        {{- end }}
        {{- if $.Values.redis.enabled }}
        {{- $pods = append $pods (list "redis" (printf "%s-[a-z0-9]+-[a-z0-9]+" (include "distant-signal.redisFullname" $)) $cfg.redisSeverity "live movements stop") }}
        {{- end }}
        {{- range $p := $pods }}
        - alert: DistantSignalStatefulImagePullFailing
          expr: |
            max by (namespace, pod, container) ({__name__=~"kube_pod_(init_)?container_status_waiting_reason", namespace="{{ $ns }}", pod=~"{{ index $p 1 }}", reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"}) > 0
          for: {{ $cfg.for }}
          labels:
            severity: {{ index $p 2 }}
            component: {{ index $p 0 }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ index $p 0 }} pod {{ "{{ $labels.pod }}" }} cannot pull its image"
            description: "{{ "{{ $labels.container }}" }}: no image for {{ $cfg.for }}, {{ index $p 3 }}. Check the pull secret and image."
            runbook_url: {{ printf "%s#distantsignalstatefulimagepullfailing" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with $rule.apiDatabaseDown }}
        {{- if .enabled }}
        {{- /*
        api's own probe (crates/api/src/data/db_health.rs): a `SELECT 1`
        through its request pool every 15s. Catches what pg_up cannot: a
        password rotated under api, an exhausted pool or max_connections,
        a NetworkPolicy, an external database. `min`: any api replica that
        cannot query counts.
        */}}
        - alert: DistantSignalApiDatabaseDown
          expr: |
            min by (namespace) (distant_signal_api_db_up{namespace="{{ $ns }}"}) == 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "api cannot query its database"
            description: "api's SELECT 1 probe has failed for {{ .for }}: ingest and most pages fail. See DistantSignalPostgresDown and api's log."
            runbook_url: {{ printf "%s#distantsignalapidatabasedown" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.schemaGateWaiting }}
        {{- if .enabled }}
        {{- /*
        Ingest spec §14.2 (plan 1B.2): the schema gate
        (crates/ds-store/src/schema.rs). The aggregator, enricher, notifier,
        ingest-writer and (with api.migrateOnStartup false) the api wait at
        startup until the database has the newest migration built into
        their image and their role has its db-grants.yaml grants; the gauge
        is 0 while one waits, 1 once it passes (absent where no gate runs).
        A gate gives up after 15 minutes and the pod restarts into it
        again. `min`: any pod of the component still waiting counts.
        */}}
        - alert: DistantSignalSchemaGateWaiting
          expr: |
            min by (namespace, app_kubernetes_io_component) (distant_signal_db_schema_ready{namespace="{{ $ns }}"}) == 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.app_kubernetes_io_component }}" }} is waiting for its database schema"
            description: "Its schema gate has not passed for {{ .for }}: the migrations have not run, or its role lacks grants. It serves nothing until then."
            runbook_url: {{ printf "%s#distantsignalschemagatewaiting" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.consumerApiErrors }}
        {{- if .enabled }}
        {{- /*
        2026-10-01: trust-consumer failed GET /private/tracked-trains about
        23.6k times and trust-backlog-consumer about 2,200 POSTs, with no
        alert (their *_ready gauges only follow Redis). Each consumer's
        <consumer>_errors_total operations that are failed calls to api
        (not data rejections), registered at 0 at startup; each crate's
        API_CALL_OPERATIONS lists the same operations, and its tests check
        this list. Summed per consumer (not per operation), so an api outage
        is at most three alerts in one notification.
        */}}
        {{- $consumers := list
          (list "trust_consumer" "trust-consumer" "reload_tracked_trains|post_train_events|reload_stanox_crs|startup_reference_load")
          (list "trust_backlog_consumer" "trust-backlog-consumer" "post_batch|post_train_reasons|reload_stanox_crs")
          (list "full_coverage_consumer" "full-coverage-consumer" "reload_line_population_fetch|post_line_stats|post_station_samples|reload_stanox_crs") }}
        - record: distant_signal:consumer_api_errors:increase
          expr: |
            {{- range $i, $c := $consumers }}
            {{ if $i }}or {{ end }}label_replace(sum by (namespace) (increase(distant_signal_{{ index $c 0 }}_errors_total{namespace="{{ $ns }}", operation=~"{{ index $c 2 }}"}[{{ $rule.consumerApiErrors.window }}])), "consumer", "{{ index $c 1 }}", "", "")
            {{- end }}
        - alert: DistantSignalConsumerApiCallsFailing
          expr: |
            distant_signal:consumer_api_errors:increase{namespace="{{ $ns }}"} >= {{ .minErrors }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.consumer }}" }} keeps failing its calls to api"
            description: "{{ "{{ $value | humanize }}" }} failed api calls in {{ .window }}, for {{ .for }}: its data is not landing. Check api and the consumer's log."
            runbook_url: {{ printf "%s#distantsignalconsumerapicallsfailing" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.api5xx }}
        {{- if .enabled }}
        {{- /*
        2026-10-01: the cluster's DistantSignalApi5xx (Ranma-Config) is one
        ratio over every route, so the ingest retry storms (~27 5xx/s on
        /private/*) drowned out what the public saw (~20% of a few requests
        a minute). Split by route: `public` excludes /private/*, health and
        unmatched paths; `ingest` is /private/*. The counter is
        axum-prometheus' distant_signal_http_requests_total; its route label
        is .routeLabel (`exported_endpoint` behind the PodMonitor). api
        registers the key routes' 200/500/503 series at 0 at startup
        (api::route_metrics), so a first 5xx after a restart counts.
        */}}
        {{- $label := .routeLabel }}
        {{- $scopes := list
          (list "public" (printf "%s!~\"/private/.*|/metrics|/public/health|/public/ready|/[{]unmatched[}]\"" $label))
          (list "ingest" (printf "%s=~\"/private/.*\"" $label)) }}
        {{- range $m := list (list "requests:rate" "rate" "") (list "5xx:rate" "rate" ", status=~\"5..\"") (list "5xx:increase" "increase" ", status=~\"5..\"") }}
        - record: distant_signal:api_{{ index $m 0 }}
          expr: |
            {{- range $i, $s := $scopes }}
            {{ if $i }}or {{ end }}label_replace(sum by (namespace) ({{ index $m 1 }}(distant_signal_http_requests_total{namespace="{{ $ns }}", {{ index $s 1 }}{{ index $m 2 }}}[{{ $rule.api5xx.window }}])), "scope", "{{ index $s 0 }}", "", "")
            {{- end }}
        {{- end }}
        {{- range $scope := list "public" "ingest" }}
        {{- $s := index $rule.api5xx $scope }}
        - alert: DistantSignalApi{{ title $scope }}5xx
          expr: |
            distant_signal:api_5xx:rate{namespace="{{ $ns }}", scope="{{ $scope }}"} / distant_signal:api_requests:rate{namespace="{{ $ns }}", scope="{{ $scope }}"} > {{ $s.ratio }}
            and distant_signal:api_5xx:increase{namespace="{{ $ns }}", scope="{{ $scope }}"} >= {{ $s.minErrors }}
          for: {{ $s.for }}
          labels:
            severity: {{ $s.severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "api answers {{ "{{ $value | humanizePercentage }}" }} of {{ $scope }} requests with 5xx"
            {{- if eq $scope "public" }}
            description: "Users, the frontend and the MCP get errors (503: a dependency is down). Check DistantSignalApiDatabaseDown and api's log."
            {{- else }}
            description: "Producers' ingest POSTs fail and are retried. Check DistantSignalApiDatabaseDown and api's log."
            {{- end }}
            runbook_url: {{ printf "%s#distantsignalapi%s5xx" $runbook $scope | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with $rule.cycleStalled }}
        {{- if .enabled }}
        {{- /*
        2026-10-01: every aggregator and notifier cycle failed for six
        hours and nothing alerted (aggregator_cycle_duration_seconds_count
        rises either way). <service>_last_success_timestamp_seconds{cycle}
        is the last successful cycle, or the process start until one
        succeeds (common::metrics::register_cycle), so a process that never
        succeeds still ages. The notifier's hourly template_sweep is left
        out.
        */}}
        - alert: DistantSignalAggregatorCycleFailing
          expr: |
            time() - max by (namespace, cycle) (distant_signal_aggregator_last_success_timestamp_seconds{namespace="{{ $ns }}"}) > {{ .maxAgeSeconds }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "no successful aggregator cycle for {{ "{{ $value | humanizeDuration }}" }}"
            description: "Line statuses and stats are going stale. Check the aggregator's log, Postgres and DistantSignalApiDatabaseDown."
            runbook_url: {{ printf "%s#distantsignalaggregatorcyclefailing" $runbook | quote }}
        - alert: DistantSignalNotifierCycleFailing
          expr: |
            time() - max by (namespace, cycle) (distant_signal_notifier_last_success_timestamp_seconds{namespace="{{ $ns }}", cycle!="template_sweep"}) > {{ .maxAgeSeconds }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "no successful notifier {{ "{{ $labels.cycle }}" }} cycle for {{ "{{ $value | humanizeDuration }}" }}"
            description: "Push notifications for this loop are not being decided or sent. Check the notifier's log and Postgres."
            runbook_url: {{ printf "%s#distantsignalnotifiercyclefailing" $runbook | quote }}
        {{- end }}
        {{- end }}
    {{- end }}
    {{- if $movementOn }}
    - name: distant-signal.movement-events
      rules:
        {{- with $rule.movementLag }}
        {{- if .enabled }}
        {{- /*
        Lag per consumer group as a fraction of the movement-events MAXLEN
        cap. The cap comes from movement-relay's own
        distant_signal_movement_relay_stream_maxlen gauge; before an image
        exporting that gauge is running, the chart's configured
        movementRelay.streamMaxLen stands in for it. Once lag reaches the
        cap, unread entries start being trimmed before that group reads
        them (a stream gap).

        "Behind" is lag + pending: a consumer whose downstream is failing
        keeps reading new entries and leaves each failed batch pending, so
        its lag stays near 0 while the entries it must retry pile up in its
        pending list, where MAXLEN trims them just the same. Until a relay
        exporting stream_pending is running, pending counts as 0.
        */}}
        {{- $ratio := printf `
  (
    max by (namespace, group) (distant_signal_movement_relay_stream_lag{namespace="%s"})
    + on (namespace, group)
    (
      max by (namespace, group) (distant_signal_movement_relay_stream_pending{namespace="%s"})
      or 0 * max by (namespace, group) (distant_signal_movement_relay_stream_lag{namespace="%s"})
    )
  )
  / on (namespace) group_left ()
  (
    max by (namespace) (distant_signal_movement_relay_stream_maxlen{namespace="%s"})
    or on (namespace)
    label_replace(vector(%d), "namespace", "%s", "", "")
  )` $ns $ns $ns $ns (int64 $.Values.movementRelay.streamMaxLen) $ns }}
        - record: distant_signal:movement_events_behind:ratio
          expr: |
            {{- $ratio | nindent 12 }}
        - alert: DistantSignalMovementLagHigh
          expr: |
            distant_signal:movement_events_behind:ratio{namespace="{{ $ns }}"} > {{ .warningRatio }}
          for: {{ .for }}
          labels:
            severity: warning
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.group }}" }} is {{ "{{ $value | humanizePercentage }}" }} of the movement-events cap behind"
            description: "Unread plus un-ACKed entries are over {{ .warningRatio }} of MAXLEN; at the cap they are trimmed unread. Check the consumer and api."
            runbook_url: {{ printf "%s#distantsignalmovementlaghigh" $runbook | quote }}
        - alert: DistantSignalMovementLagCritical
          expr: |
            distant_signal:movement_events_behind:ratio{namespace="{{ $ns }}"} > {{ .criticalRatio }}
          for: {{ .for }}
          labels:
            severity: critical
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.group }}" }} is {{ "{{ $value | humanizePercentage }}" }} of the movement-events cap behind"
            description: "Over {{ .criticalRatio }} of MAXLEN: a stream gap (data loss) is close. Fix the consumer, or raise streamMaxLen and Redis maxmemory."
            runbook_url: {{ printf "%s#distantsignalmovementlagcritical" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.movementLagGrowing }}
        {{- if .enabled }}
        {{- /*
        Lag never reads 0 (steady-state baseline is a few hundred entries),
        so this requires both a rising trend (deriv > 0) and a real net
        increase over the window, not merely a non-zero value.
        */}}
        - record: distant_signal:movement_events_lag:deriv
          expr: |
            max by (namespace, group) (deriv(distant_signal_movement_relay_stream_lag{namespace="{{ $ns }}"}[{{ .window }}]))
        - record: distant_signal:movement_events_lag:delta
          expr: |
            max by (namespace, group) (delta(distant_signal_movement_relay_stream_lag{namespace="{{ $ns }}"}[{{ .window }}]))
        - alert: DistantSignalMovementLagGrowing
          expr: |
            distant_signal:movement_events_lag:deriv{namespace="{{ $ns }}"} > 0
            and on (namespace, group)
            distant_signal:movement_events_lag:delta{namespace="{{ $ns }}"} > {{ .minIncrease }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.group }}" }} movement-events lag keeps growing"
            description: "Lag rose over {{ .minIncrease }} entries net in {{ .window }}: the group consumes slower than movement-relay publishes."
            runbook_url: {{ printf "%s#distantsignalmovementlaggrowing" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.streamGap }}
        {{- if .enabled }}
        {{- $w := .window }}
        - record: distant_signal:movement_stream_gaps:increase
          expr: |
            {{- range $i, $c := list "trust_consumer" "full_coverage_consumer" "trust_backlog_consumer" }}
            {{- $m := printf `distant_signal_%s_stream_gap_detected_total{namespace="%s"}` $c $ns }}
            {{ if $i }}or {{ end }}label_replace(sum by (namespace) (increase({{ $m }}[{{ $w }}])), "consumer", "{{ $c }}", "", "")
            {{- end }}
        - alert: DistantSignalStreamGap
          expr: |
            distant_signal:movement_stream_gaps:increase{namespace="{{ $ns }}"} > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.consumer }}" }} lost movement-events entries (stream gap)"
            description: "Entries were trimmed before it read them in the last {{ .window }}. Treat that rail day's derived data as partial."
            runbook_url: {{ printf "%s#distantsignalstreamgap" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.deadLetter }}
        {{- if .enabled }}
        {{- $m := printf `distant_signal_movement_feed_deadlettered_total{namespace="%s"}` $ns }}
        - alert: DistantSignalDeadLetterGrowing
          expr: |
            sum by (namespace, group, reason) (increase({{ $m }}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.group }}" }} dead-lettered records ({{ "{{ $labels.reason }}" }})"
            description: "Records went to movement-events-deadletter in the last {{ .window }}. Inspect them, then re-inject or delete them."
            runbook_url: {{ printf "%s#distantsignaldeadlettergrowing" $runbook | quote }}
        {{- /*
        The length comes from movement-relay's own XLEN, read every lag
        tick. The consumers' movement_feed_deadletter_length is only set
        when one dead-letters something (absent after a restart, stale after
        a drain), so it only stands in until a relay exporting the fresh
        gauge is running.
        */}}
        - alert: DistantSignalDeadLetterNearFull
          expr: |
            (
              max by (namespace, stream) (distant_signal_movement_relay_deadletter_length{namespace="{{ $ns }}"})
              or max by (namespace, stream) (distant_signal_movement_feed_deadletter_length{namespace="{{ $ns }}"})
            ) / 10000 > {{ .nearFullRatio }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.stream }}" }} is {{ "{{ $value | humanizePercentage }}" }} full"
            description: "Over {{ .nearFullRatio }} of its 10,000-record cap. Once full, new poison records stay pending in their group. Drain it."
            runbook_url: {{ printf "%s#distantsignaldeadletternearfull" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.deadLetterFull }}
        {{- if .enabled }}
        {{- $m := printf `distant_signal_movement_feed_deadletter_full_total{namespace="%s"}` $ns }}
        - alert: DistantSignalDeadLetterFull
          expr: |
            sum by (namespace, group) (increase({{ $m }}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "dead-letter stream full; {{ "{{ $labels.group }}" }} records stuck pending"
            description: "A dead-letter write hit the 10,000-record cap in the last {{ .window }}. Those records retry forever until it is drained."
            runbook_url: {{ printf "%s#distantsignaldeadletterfull" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.relayPublishFailing }}
        {{- if .enabled }}
        {{- /*
        Redis refusing movement-relay's XADDs (OOM at maxmemory, a failed
        AOF write, NOAUTH, Redis down) stops all TRUST ingestion without
        tripping any lag alert: the consumers stay caught up with a stream
        that no longer grows. The relay's /livez stays 200 (a failed cycle
        is progress), so nothing restarts it either; Kafka holds the
        backlog only for as long as the topic retains it.

        "Nothing published" is `(published or 0 * failures) == 0`: a relay
        that restarted while Redis was refusing writes has no published
        series at all, and a bare `published == 0` would then be empty.
        */}}
        {{- $failed := printf `sum by (namespace) (increase(distant_signal_movement_relay_errors_total{namespace="%s", operation=~"publish_event|redis_oom"}[%s]))` $ns .window }}
        - record: distant_signal:movement_relay_publish_failing:bool
          expr: |
            ({{ $failed }} > bool 0)
            * on (namespace)
            (
              (
                sum by (namespace) (increase(distant_signal_movement_relay_events_published_total{namespace="{{ $ns }}"}[{{ .window }}]))
                or on (namespace) 0 * {{ $failed }}
              ) == bool 0
            )
        - alert: DistantSignalMovementRelayPublishFailing
          expr: |
            distant_signal:movement_relay_publish_failing:bool{namespace="{{ $ns }}"} == 1
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "movement-relay cannot publish to movement-events"
            description: "Every XADD failed for {{ .window }}: TRUST ingestion is stopped. Check Redis (OOM, AOF, auth) and the relay's logs."
            runbook_url: {{ printf "%s#distantsignalmovementrelaypublishfailing" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.redisPersistence }}
        {{- if .enabled }}
        {{- /*
        From movement-relay's INFO persistence gauges (the chart ships no
        redis_exporter). A failed AOF write makes Redis refuse every write
        until one succeeds; a failed rewrite leaves the AOF growing until
        the disk fills. aof_enabled == 0 is only an error for the bundled
        Redis with persistence on (an external one may run without AOF).
        */}}
        {{- /*
        1 while every check passes, 0 once any fails: each check is
        aggregated on its own (min for the *_ok gauges, max for
        aof_enabled), labelled, and the lowest wins.
        */}}
        - record: distant_signal:redis_aof_health:min
          expr: |
            min by (namespace) (
              label_replace(min by (namespace) (distant_signal_redis_aof_last_write_ok{namespace="{{ $ns }}"}), "check", "write", "", "")
              or label_replace(min by (namespace) (distant_signal_redis_aof_last_bgrewrite_ok{namespace="{{ $ns }}"}), "check", "rewrite", "", "")
              {{- if and $.Values.redis.enabled $.Values.redis.persistence.enabled }}
              or label_replace(max by (namespace) (distant_signal_redis_aof_enabled{namespace="{{ $ns }}"}), "check", "enabled", "", "")
              {{- end }}
            )
        - alert: DistantSignalRedisPersistenceFailing
          expr: |
            distant_signal:redis_aof_health:min{namespace="{{ $ns }}"} == 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Redis AOF persistence is failing"
            description: "A failed AOF write makes Redis refuse writes, a failed rewrite fills the disk, and AOF off loses the streams on restart."
            runbook_url: {{ printf "%s#distantsignalredispersistencefailing" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.groupRecreated }}
        {{- if .enabled }}
        {{- $m := printf `distant_signal_movement_feed_group_recreated_total{namespace="%s"}` $ns }}
        {{- $s := printf `distant_signal_movement_relay_stream_created_total{namespace="%s"}` $ns }}
        {{- /*
        Two sources: a running consumer recovering from NOGROUP, and
        movement-relay finding the stream missing on publish and recreating
        it with every group (D2) -- after which a consumer never sees
        NOGROUP. The second is labelled group="(all)".
        */}}
        - record: distant_signal:movement_group_recreations:increase
          expr: |
            sum by (namespace, group) (increase({{ $m }}[{{ .window }}]))
            or label_replace(sum by (namespace) (increase({{ $s }}[{{ .window }}])), "group", "(all)", "", "")
        - alert: DistantSignalMovementGroupRecreated
          expr: |
            distant_signal:movement_group_recreations:increase{namespace="{{ $ns }}"} > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "movement-events group {{ "{{ $labels.group }}" }} was recreated"
            description: "Its group went missing (NOGROUP) in the last {{ .window }}: Redis lost data or it was deleted. Treat that rail day as partial."
            runbook_url: {{ printf "%s#distantsignalmovementgrouprecreated" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.deadLetterExpiring }}
        {{- if .enabled }}
        {{- $maxAge := int64 (include "distant-signal.deadLetterMaxAgeSecs" $) }}
        {{- $threshold := sub $maxAge (int64 .warnBeforeTrimSecs) }}
        {{- if le $threshold 0 }}
        {{- fail "metrics.prometheusRule.deadLetterExpiring.warnBeforeTrimSecs must be below movementRelay.deadLetterMaxAgeSecs" }}
        {{- end }}
        - alert: DistantSignalDeadLetterExpiring
          expr: |
            max by (namespace) (distant_signal_movement_relay_deadletter_oldest_age_seconds{namespace="{{ $ns }}"}) > {{ $threshold }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "oldest movement-events dead letter is {{ "{{ $value | humanizeDuration }}" }} old"
            description: "movement-relay deletes dead letters at {{ $maxAge }}s. Re-inject or discard it within {{ .warnBeforeTrimSecs }}s."
            runbook_url: {{ printf "%s#distantsignaldeadletterexpiring" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.longPending }}
        {{- if .enabled }}
        {{- /*
        R-040: an entry redelivered more than LONG_PENDING_DELIVERIES (240)
        times is never dead-lettered (only a data rejection is), so a
        failure the consumer cannot classify retries forever. The counter
        is registered at 0 per group and grows on every PEL replay pass
        that still holds such an entry.
        */}}
        {{- $m := printf `distant_signal_movement_feed_long_pending_total{namespace="%s"}` $ns }}
        - alert: DistantSignalMovementFeedLongPending
          expr: |
            sum by (namespace, group) (increase({{ $m }}[{{ .window }}])) > {{ .threshold }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.group }}" }} keeps retrying movement-events entries"
            description: "Entries delivered over 240 times were re-read {{ "{{ $value | humanize }}" }} times in {{ .window }}; never dead-lettered. See its warn log."
            runbook_url: {{ printf "%s#distantsignalmovementfeedlongpending" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.parseEnvelope }}
        {{- if .enabled }}
        {{- /*
        R-097: a TRUST envelope whose body fails its typed shape is dropped
        and counted as <consumer>_errors_total{operation="parse_envelope",
        msg_type}; the log is warn-once per msg_type, so the counter is the
        only rate signal. Every known msg_type is registered at 0 on start.
        */}}
        - record: distant_signal:trust_envelope_parse_drops:increase
          expr: |
            {{- $consumers := list (list "trust_consumer" "trust-consumer") (list "full_coverage_consumer" "full-coverage-consumer") (list "trust_backlog_consumer" "trust-backlog-consumer") }}
            {{- range $i, $c := $consumers }}
            {{ if $i }}or {{ end }}label_replace(sum by (namespace, msg_type) (increase(distant_signal_{{ index $c 0 }}_errors_total{namespace="{{ $ns }}", operation="parse_envelope"}[{{ $.Values.metrics.prometheusRule.parseEnvelope.window }}])), "consumer", "{{ index $c 1 }}", "", "")
            {{- end }}
        - alert: DistantSignalTrustEnvelopeParseDrops
          expr: |
            distant_signal:trust_envelope_parse_drops:increase{namespace="{{ $ns }}"} > {{ .threshold }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.consumer }}" }} dropped bad TRUST {{ "{{ $labels.msg_type }}" }} envelopes"
            description: "{{ "{{ $value | humanize }}" }} in {{ .window }} did not match the known shape. A steady rate means the feed's schema changed."
            runbook_url: {{ printf "%s#distantsignaltrustenvelopeparsedrops" $runbook | quote }}
        {{- end }}
        {{- end }}
    {{- end }}
    {{- with $rule.enricherErrors }}
    {{- if .enabled }}
    - name: distant-signal.enricher
      rules:
        - record: distant_signal:enricher_llm_call_failures:ratio
          expr: |
            sum by (namespace, call) (rate(distant_signal_enricher_llm_call_total{namespace="{{ $ns }}", outcome!="success"}[{{ .window }}]))
            / sum by (namespace, call) (rate(distant_signal_enricher_llm_call_total{namespace="{{ $ns }}"}[{{ .window }}]))
        - record: distant_signal:enricher_llm_call_failures:increase
          expr: |
            sum by (namespace, call) (increase(distant_signal_enricher_llm_call_total{namespace="{{ $ns }}", outcome!="success"}[{{ .window }}]))
        - alert: DistantSignalEnricherErrors
          expr: |
            distant_signal:enricher_llm_call_failures:ratio{namespace="{{ $ns }}"} > {{ .errorRatio }}
            and on (namespace, call)
            distant_signal:enricher_llm_call_failures:increase{namespace="{{ $ns }}"} >= {{ .minErrors }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "enricher LLM {{ "{{ $labels.call }}" }} calls failing ({{ "{{ $value | humanizePercentage }}" }})"
            description: "Over {{ .errorRatio }} of calls failed in {{ .window }} (at least {{ .minErrors }}). Check enricher.llm.baseUrl and enricher's logs."
            runbook_url: {{ printf "%s#distantsignalenrichererrors" $runbook | quote }}
    {{- end }}
    {{- end }}
    {{- if $tokenExchangeOn }}
    {{- with $rule.enricherTokenExchange }}
    {{- /*
    Workload identity federation (enricher.llm.auth): token requests to one
    stage (authentik, openai) keep failing and none succeeds. The counter is
    registered at 0 for every stage and outcome, so increase() sees the
    first failure and the success series exists (== 0) before any success.
    */}}
    - name: distant-signal.enricher-token-exchange
      rules:
        - record: distant_signal:enricher_llm_token_exchange_failures:increase
          expr: |
            sum by (namespace, stage) (increase(distant_signal_enricher_llm_token_exchange_total{namespace="{{ $ns }}", outcome!="success"}[{{ .window }}]))
        - record: distant_signal:enricher_llm_token_exchange_successes:increase
          expr: |
            sum by (namespace, stage) (increase(distant_signal_enricher_llm_token_exchange_total{namespace="{{ $ns }}", outcome="success"}[{{ .window }}]))
        - alert: DistantSignalEnricherTokenExchangeFailing
          expr: |
            distant_signal:enricher_llm_token_exchange_failures:increase{namespace="{{ $ns }}"} >= {{ .minFailures }}
            and on (namespace, stage)
            distant_signal:enricher_llm_token_exchange_successes:increase{namespace="{{ $ns }}"} == 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "enricher {{ "{{ $labels.stage }}" }} LLM token exchange failing"
            description: "{{ "{{ $value | humanize }}" }} failed token requests and no success in {{ .window }}. Extractions stop once the cached token expires."
            runbook_url: {{ printf "%s#distantsignalenrichertokenexchangefailing" $runbook | quote }}
    {{- end }}
    {{- end }}
    {{- if $fcwOn }}
    {{- with $rule.fullCoverageWindow }}
    {{- /*
    Windowed full-coverage stats
    (docs/superpowers/specs/2026-09-27-full-coverage-windowed-stats-design.md).
    Gated on fullCoverageConsumer.windowedStats.enabled via $fcwOn: with the
    feature off the consumer never posts windows, so these would be noise.
    The counters are registered at 0 on startup (a plain increase()/rate()
    sees the first increment).
    */}}
    - name: distant-signal.full-coverage-window
      rules:
        - alert: DistantSignalFullCoverageWindowFeedStale
          expr: |
            max by (namespace) (distant_signal_full_coverage_consumer_window_feed_stale{namespace="{{ $ns }}"}) == 1
          for: {{ .feedStaleFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "full-coverage windows feed_stale for {{ .feedStaleFor }}"
            description: "Too few TRUST Activations or no recent movement event; no window affects severity. Expected during a TRUST outage."
            runbook_url: {{ printf "%s#distantsignalfullcoveragewindowfeedstale" $runbook | quote }}
        {{- /*
        2026-10-02: was `> 0` over 30m with no `for`, so the one POST that
        fails while an api Recreate rollout is down (~20-25 s) fired it for
        30 minutes (3 of 5 rollouts). Now the same shape as
        DistantSignalConsumerApiCallsFailing: at least postErrorsThreshold
        failures per postErrorsWindow, sustained for postErrorsFor. A
        persistent 404 (one failure a minute) still fires.
        */}}
        - alert: DistantSignalFullCoverageWindowPostErrors
          expr: |
            sum by (namespace) (increase(distant_signal_full_coverage_consumer_errors_total{namespace="{{ $ns }}", operation="post_window_stats"}[{{ .postErrorsWindow }}])) >= {{ .postErrorsThreshold }}
          for: {{ .postErrorsFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "full-coverage window stats POSTs failing"
            description: "{{ "{{ $value | humanize }}" }} window-stats POSTs failed in {{ .postErrorsWindow }}, for {{ .postErrorsFor }}. A 404 means api lacks the route."
            runbook_url: {{ printf "%s#distantsignalfullcoveragewindowposterrors" $runbook | quote }}
        - alert: DistantSignalFullCoverageWindowStatsStalled
          expr: |
            sum by (namespace) (rate(distant_signal_full_coverage_consumer_window_rows_posted_total{namespace="{{ $ns }}"}[{{ .stalledWindow }}])) == 0
          for: {{ .stalledFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "no full-coverage window rows posted"
            description: "None over {{ .stalledWindow }} for {{ .stalledFor }}: a stuck replay, a population that never loaded, or failing POSTs."
            runbook_url: {{ printf "%s#distantsignalfullcoveragewindowstatsstalled" $runbook | quote }}
    {{- end }}
    {{- end }}
    {{- with $rule.componentMemory }}
    {{- if .enabled }}
    - name: distant-signal.resources
      rules:
        {{- /*
        cadvisor (kubelet) working set over kube-state-metrics' memory limit,
        per container, for every pod this release deploys. Containers
        without a memory limit have no limit series and never match.
        */}}
        - record: distant_signal:container_memory_working_set:limit_ratio
          expr: |
            max by (namespace, pod, container) (container_memory_working_set_bytes{namespace="{{ $ns }}", pod=~"{{ $fullname }}-.*", container!="", container!="POD"})
            / on (namespace, pod, container)
            max by (namespace, pod, container) (kube_pod_container_resource_limits{namespace="{{ $ns }}", pod=~"{{ $fullname }}-.*", resource="memory"})
        - alert: DistantSignalComponentMemoryHigh
          expr: |
            distant_signal:container_memory_working_set:limit_ratio{namespace="{{ $ns }}"} > {{ .ratio }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.pod }}" }}/{{ "{{ $labels.container }}" }} at {{ "{{ $value | humanizePercentage }}" }} of memory limit"
            description: "Over {{ .ratio }} of its memory limit for {{ .for }}: at risk of an OOMKill. Raise resources.limits.memory or find the growth."
            runbook_url: {{ printf "%s#distantsignalcomponentmemoryhigh" $runbook | quote }}
    {{- end }}
    {{- end }}
    {{- with $rule.notifierPushDropped }}
    {{- if .enabled }}
    - name: distant-signal.notifier
      rules:
        {{- /*
        Notifier delivery is at-most-once by decision (triage DQ9): a push
        that ends undelivered is counted, not retried beyond the cursor
        grace window. See crates/notifier/src/push_queue.rs's module doc
        for every reason label.
        */}}
        - alert: DistantSignalNotifierPushDropped
          expr: |
            sum by (namespace, reason) (increase(distant_signal_notifier_push_dropped_total{namespace="{{ $ns }}"}[{{ .window }}])) >= {{ .minDrops }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "notifier dropped {{ "{{ $value | humanize }}" }} pushes ({{ "{{ $labels.reason }}" }})"
            description: "Over the last {{ .window }}. Delivery is at-most-once, so these users may never get them. The runbook covers each reason."
            runbook_url: {{ printf "%s#distantsignalnotifierpushdropped" $runbook | quote }}
    {{- end }}
    {{- end }}
    {{- if $writerDownOn }}
    {{- with $rule.ingestWriterDown }}
    - name: distant-signal.ingest-writer
      rules:
        {{- /*
        Ingest spec §14.2 (plan 1B.9): the ingest-writer runs the
        train-domain sweeps (and, from phase 3, applies the ingest streams).
        Two sources, either enough: its scrape target is down (the
        PodMonitor's app_kubernetes_io_component label), or its Deployment
        has no available replica (kube-state-metrics; a failing /livez
        restarts the pod, a failing /healthz makes it unavailable), which
        still answers when the pod is gone and has no target at all.
        */}}
        - alert: DistantSignalIngestWriterDown
          expr: |
            max by (namespace) (up{namespace="{{ $ns }}", app_kubernetes_io_component="ingest-writer"}) == 0
            or max by (namespace) (kube_deployment_status_replicas_available{namespace="{{ $ns }}", deployment="{{ printf "%s-ingest-writer" $fullname | trunc 63 | trimSuffix "-" }}"}) < 1
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "the ingest-writer is down"
            description: "Not scraped, or no available replica, for {{ .for }}: the train-domain sweeps it owns are not running."
            runbook_url: {{ printf "%s#distantsignalingestwriterdown" $runbook | quote }}
    {{- end }}
    {{- end }}
    {{- if $ingestStreamsOn }}
    - name: distant-signal.ingest-streams
      rules:
        {{- /*
        Ingest spec §14.2 (plan 3a.4), on crates/ingest-stream's metrics
        (src/metrics.rs; spec §14.1): the writer's consumers export the
        per-stream gauges every 30s and the consumed/dead-lettered
        counters, the producers the produce counters. None of these series
        exists until a stream is on, and every expression below is a plain
        comparison or `increase() > 0` on them (no absent(), no `or 0`
        fallback), so nothing fires while the streams are off.
        */}}
        {{- with $rule.ingestStreamBacklog }}
        {{- if .enabled }}
        {{- /*
        "Behind" is lag + pending over the stream's MAXLEN ~ cap, as for
        movement-events: at the cap, entries are trimmed before they are
        applied. The writer has no MAXLEN gauge, so each stream's cap is a
        constant from values (budget.rs), one recording rule per stream
        (the same record name; each sets its `stream` label, so promtool
        sees no duplicate rule). register_consumer
        sets lag and pending together, so both sides exist.
        */}}
        {{- range $stream, $maxlen := .maxlen }}
        - record: distant_signal:ingest_stream_behind:ratio
          expr: |
            (
              max by (namespace, stream) (distant_signal_ingest_stream_lag{namespace="{{ $ns }}", stream="{{ $stream }}"})
              + on (namespace, stream)
              max by (namespace, stream) (distant_signal_ingest_stream_pending{namespace="{{ $ns }}", stream="{{ $stream }}"})
            ) / {{ $maxlen }}
          labels:
            stream: {{ $stream | quote }}
        {{- end }}
        - alert: DistantSignalIngestStreamBacklog
          expr: |
            distant_signal:ingest_stream_behind:ratio{namespace="{{ $ns }}"} > {{ .warningRatio }}
            or max by (namespace, stream) (distant_signal_ingest_stream_oldest_pending_age_seconds{namespace="{{ $ns }}"}) > {{ .oldestPendingAgeSecs }}
          for: {{ .for }}
          labels:
            severity: warning
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.stream }}" }} is backing up in front of the ingest-writer"
            description: "An entry pending over {{ .oldestPendingAgeSecs }}s, or unread plus un-ACKed entries over {{ .warningRatio }} of MAXLEN. At the cap they are trimmed unapplied."
            runbook_url: {{ printf "%s#distantsignalingeststreambacklog" $runbook | quote }}
        - alert: DistantSignalIngestStreamBacklog
          expr: |
            distant_signal:ingest_stream_behind:ratio{namespace="{{ $ns }}"} > {{ .criticalRatio }}
          for: {{ .for }}
          labels:
            severity: critical
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.stream }}" }} is {{ "{{ $value | humanizePercentage }}" }} of its MAXLEN behind"
            description: "Over {{ .criticalRatio }} of MAXLEN: entries are about to be trimmed unapplied. Fix the ingest-writer."
            runbook_url: {{ printf "%s#distantsignalingeststreambacklog" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.ingestStreamStalled }}
        {{- if .enabled }}
        {{- /*
        Seconds since the writer last applied an entry of a stream whose
        producers XADDed successfully within its stallAfterSecs (about 3x
        its cadence), recorded only while over it: one rule per stream.
        The last-applied gauge appears on the writer's first apply after a
        start, so a writer that has applied nothing since it started does
        not fire here (DistantSignalIngestStreamBacklog covers it).
        */}}
        {{- range $stream, $after := .stallAfterSecs }}
        - record: distant_signal:ingest_stream_unapplied:seconds
          expr: |
            time() - max by (namespace, stream) (distant_signal_ingest_stream_last_applied_timestamp_seconds{namespace="{{ $ns }}", stream="{{ $stream }}"}) > {{ $after }}
            and on (namespace, stream)
            sum by (namespace, stream) (increase(distant_signal_ingest_stream_produce_total{namespace="{{ $ns }}", stream="{{ $stream }}", outcome="ok"}[{{ $after }}s])) > 0
          labels:
            stream: {{ $stream | quote }}
        {{- end }}
        - alert: DistantSignalIngestStreamStalled
          expr: |
            distant_signal:ingest_stream_unapplied:seconds{namespace="{{ $ns }}"}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.stream }}" }}: nothing applied for {{ "{{ $value | humanizeDuration }}" }}"
            description: "Producers are writing to the stream but the ingest-writer applies nothing from it. Check the writer's log for this stream."
            runbook_url: {{ printf "%s#distantsignalingeststreamstalled" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.ingestDeadLetters }}
        {{- if .enabled }}
        {{- /* register_consumer registers every reason at 0, so increase() sees the first. */}}
        - alert: DistantSignalIngestDeadLetters
          expr: |
            sum by (namespace, stream, reason) (increase(distant_signal_ingest_stream_dead_lettered_total{namespace="{{ $ns }}"}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.stream }}" }} entries dead-lettered ({{ "{{ $labels.reason }}" }})"
            description: "Over the last {{ .window }}. They are not applied until fixed and re-injected; the runbook covers each reason."
            runbook_url: {{ printf "%s#distantsignalingestdeadletters" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.ingestDeadLetterExpiring }}
        {{- if .enabled }}
        - alert: DistantSignalIngestDeadLetterExpiring
          expr: |
            max by (namespace, stream) (distant_signal_ingest_stream_dlq_oldest_age_seconds{namespace="{{ $ns }}"}) > {{ sub (int64 .retentionSecs) (int64 .warnBeforeSecs) }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "a {{ "{{ $labels.stream }}" }} dead letter is {{ "{{ $value | humanizeDuration }}" }} old"
            description: "Within {{ div (int64 .warnBeforeSecs) 3600 }}h of the dead-letter retention trim. Re-inject it or decide it can go."
            runbook_url: {{ printf "%s#distantsignalingestdeadletterexpiring" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.ingestUnsupportedSchema }}
        {{- if .enabled }}
        {{- /*
        The per-schema series appears on first use, so increase() misses
        the first count; the entry stays pending and is retried (backoff up
        to 60s), so the next one is seen.
        */}}
        - alert: DistantSignalIngestUnsupportedSchema
          expr: |
            sum by (namespace, stream, schema) (increase(distant_signal_ingest_stream_consumed_total{namespace="{{ $ns }}", outcome="unsupported_schema"}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "the ingest-writer does not know {{ "{{ $labels.schema }}" }}"
            description: "{{ "{{ $labels.stream }}" }} is blocked on an entry of a newer schema version than the writer's. Roll the writer forward."
            runbook_url: {{ printf "%s#distantsignalingestunsupportedschema" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.ingestProducerXaddFailing }}
        {{- if .enabled }}
        {{- /* register_producer registers every outcome at 0. */}}
        - record: distant_signal:ingest_stream_xadd_failures:increase
          expr: |
            sum by (namespace, stream) (increase(distant_signal_ingest_stream_produce_total{namespace="{{ $ns }}", outcome!="ok"}[{{ .window }}])) > 0
            unless on (namespace, stream)
            sum by (namespace, stream) (increase(distant_signal_ingest_stream_produce_total{namespace="{{ $ns }}", outcome="ok"}[{{ .window }}])) > 0
        - alert: DistantSignalIngestProducerXaddFailing
          expr: |
            distant_signal:ingest_stream_xadd_failures:increase{namespace="{{ $ns }}"}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "every XADD to {{ "{{ $labels.stream }}" }} is failing"
            description: "No XADD succeeded for {{ .window }}: the producers hold only their newest snapshot. Check Redis (OOM, auth, ACL)."
            runbook_url: {{ printf "%s#distantsignalingestproducerxaddfailing" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.ingestStreamMemoryHigh }}
        {{- if .enabled }}
        {{- /* max by stream first: a rollout briefly has two writers. */}}
        - alert: DistantSignalIngestStreamMemoryHigh
          expr: |
            sum by (namespace) (max by (namespace, stream) (distant_signal_ingest_stream_bytes{namespace="{{ $ns }}"})) > {{ printf "%.0f" (mulf .budgetBytes .ratio) }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "the ingest streams use {{ "{{ $value | humanize1024 }}" }}B of Redis"
            description: "Over {{ .ratio }} of their {{ div (int64 .budgetBytes) 1048576 }} MiB budget (D5). Check for a backlog or a full dead-letter stream."
            runbook_url: {{ printf "%s#distantsignalingeststreammemoryhigh" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.ingestClockSkew }}
        {{- if .enabled }}
        {{- /*
        ingest_stream_observed_at_clamped_total{stream, schema} (plan 3a.3,
        spec §7.8). The second arm sees a series whose first sample is
        already above 0 (one not registered at 0): unlike a registered-at-0
        series on a new pod, it is a real clamp.
        */}}
        {{- $m := printf `distant_signal_ingest_stream_observed_at_clamped_total{namespace="%s"}` $ns }}
        - record: distant_signal:ingest_stream_observed_at_clamped:increase
          expr: |
            sum by (namespace, stream, schema) (increase({{ $m }}[{{ .window }}])) > 0
            or sum by (namespace, stream, schema) ({{ $m }} unless {{ $m }} offset {{ .window }}) > 0
        - alert: DistantSignalIngestClockSkew
          expr: |
            distant_signal:ingest_stream_observed_at_clamped:increase{namespace="{{ $ns }}"}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.stream }}" }} carries times over 2 min in the future"
            description: "The ingest-writer clamped observed times ({{ "{{ $labels.schema }}" }}) to its own clock: a producer's clock is ahead."
            runbook_url: {{ printf "%s#distantsignalingestclockskew" $runbook | quote }}
        {{- end }}
        {{- end }}
    {{- end }}
    {{- if $signupSpikeOn }}
    {{- with $rule.userSignupSpike }}
    - name: distant-signal.users
      rules:
        {{- /*
        Sign-up is open: any account the IdP lets in (in production, any
        Discord account through Authentik's Discord source) gets a users
        row on its first login. A burst of new accounts is either real
        growth or scripted sign-ups (spam, abuse of /chat or the MCP). The
        counter is api's, incremented once per users row created.
        */}}
        - alert: DistantSignalUserSignupSpike
          expr: |
            sum by (namespace) (increase({{ .metric }}{namespace="{{ $ns }}"}[{{ .window }}])) > {{ .threshold }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $value | humanize }}" }} new user accounts in {{ .window }}"
            description: "Over {{ .threshold }}. Sign-up is open: check `users` and the IdP's enrolment log for scripted sign-ups."
            runbook_url: {{ printf "%s#distantsignalusersignupspike" $runbook | quote }}
    {{- end }}
    {{- end }}
    {{- if $archiveAlertOn }}
    {{- with $rule.archiveUploadFailures }}
    - name: distant-signal.archive
      rules:
        {{- /*
        Renders only with archive.enabled. Under the default `retain`
        failure policy a failed upload keeps the rows, so the trains table
        grows past its retention window while this fires; under `delete`
        the rows are gone unarchived.
        */}}
        - alert: DistantSignalArchiveUploadFailures
          expr: |
            sum by (namespace) (increase(distant_signal_aggregator_archive_upload_failures_total{namespace="{{ $ns }}"}[{{ .window }}])) >= {{ .minFailures }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "cold archive uploads failing ({{ "{{ $value | humanize }}" }} in {{ .window }})"
            description: "retain: trains grows past retention; delete: rows are pruned unarchived. Check the object store and the aggregator's logs."
            runbook_url: {{ printf "%s#distantsignalarchiveuploadfailures" $runbook | quote }}
    {{- end }}
    {{- end }}
    {{- if $archiveExpiryOn }}
    {{- $retentionDays := int .Values.archive.expiry.retentionDays }}
    {{- with $rule.archiveExpiry }}
    - name: distant-signal.archive-expiry
      rules:
        {{- /*
        Renders only with archive.enabled and archive.expiry.enabled. The
        counters are registered at 0 when the aggregator starts, and a run
        happens once a day, so `window` should stay at least a day.
        */}}
        - alert: DistantSignalArchiveExpiryErrors
          expr: |
            sum by (namespace) (increase(distant_signal_aggregator_archive_expiry_errors_total{namespace="{{ $ns }}"}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "cold archive expiry failing ({{ "{{ $value | humanize }}" }} errors in {{ .window }})"
            description: "A failed LIST or DELETE, or a key refused before delete. Expired objects stay until a run succeeds."
            runbook_url: {{ printf "%s#distantsignalarchiveexpiryerrors" $runbook | quote }}
        - alert: DistantSignalArchiveExpiryUnmatchedKeys
          expr: |
            sum by (namespace, table) (increase(distant_signal_aggregator_archive_expiry_skipped_unmatched_total{namespace="{{ $ns }}"}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "unexpected keys under the cold archive's {{ "{{ $labels.table }}" }} prefix"
            description: "Keys outside the archive layout are never deleted. Something else writes there; the aggregator logs the first keys."
            runbook_url: {{ printf "%s#distantsignalarchiveexpiryunmatchedkeys" $runbook | quote }}
        - alert: DistantSignalArchiveExpiryCapReached
          expr: |
            sum by (namespace) (increase(distant_signal_aggregator_archive_expiry_cap_reached_total{namespace="{{ $ns }}"}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "cold archive expiry hit its per-run delete cap"
            description: "More expired objects than archive.expiry.maxDeletesPerRun. Expected once after a long outage or a retention cut."
            runbook_url: {{ printf "%s#distantsignalarchiveexpirycapreached" $runbook | quote }}
        {{- /*
        The oldest archived service_date is older than the retention plus a
        grace period: expiry is not running, is failing, or is still in
        dry-run past the point the first objects came due. `> 0` skips a
        gauge that has not been set yet.
        */}}
        - alert: DistantSignalArchiveExpiryOverdue
          expr: |
            (time() - min by (namespace, table) (distant_signal_aggregator_archive_oldest_service_date_seconds{namespace="{{ $ns }}"} > 0)) > {{ mul (add $retentionDays (int .overdueGraceDays)) 86400 }}
          for: {{ .overdueFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "cold archive holds {{ "{{ $labels.table }}" }} objects past retention"
            description: "The oldest is over {{ $retentionDays }}+{{ .overdueGraceDays }} days old: expiry is off, failing, or still in dry-run."
            runbook_url: {{ printf "%s#distantsignalarchiveexpiryoverdue" $runbook | quote }}
    {{- end }}
    {{- end }}
    {{- if $pipelineOn }}
    {{- with $rule.schedulePipeline }}
    - name: distant-signal.schedule-pipeline
      rules:
        {{- /*
        PL-15e: schedule-reference waits (with backoff, while /healthz stays
        healthy) for api to answer its startup seed GET. 0 until it does.
        */}}
        - alert: DistantSignalScheduleReferenceNotSeeded
          expr: |
            max by (namespace) (distant_signal_schedule_reference_seeded{namespace="{{ $ns }}"}) == 0
          for: {{ .notSeededFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "schedule-reference not seeded for {{ .notSeededFor }}"
            description: "It cannot read its last publish from api, so it publishes nothing. Check api and the internal OAuth token endpoint."
            runbook_url: {{ printf "%s#distantsignalschedulereferencenotseeded" $runbook | quote }}
        {{- /*
        PL-5: schedule-ingest quarantined an uploaded delivery zip that
        declares more than scheduleFeed's extraction caps, or whose entries
        inflate to a size other than they declare. The CIF pipeline stays on
        the previous delivery until a new upload replaces it.
        */}}
        - alert: DistantSignalScheduleFeedZipRejected
          expr: |
            sum by (namespace) (increase(distant_signal_schedule_feed_zip_rejected_total{namespace="{{ $ns }}"}[{{ .zipRejectedWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "schedule-ingest rejected a CIF delivery zip"
            description: "Over the extraction caps, or a failed CIF content check. The timetable is not refreshed until a new upload."
            runbook_url: {{ printf "%s#distantsignalschedulefeedziprejected" $runbook | quote }}
        {{- /*
        N-2: api refused schedule-ingest's delivery record (400/413/422).
        The delivery is quarantined until a new upload, not retried.
        */}}
        - alert: DistantSignalScheduleFeedIngestRejected
          expr: |
            sum by (namespace) (increase(distant_signal_schedule_feed_ingest_rejected_total{namespace="{{ $ns }}"}[{{ .rejectedWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "api rejected a schedule feed delivery record"
            description: "api answered 400/413/422 to schedule-ingest; not retried until a new upload. Both logs name the reason."
            runbook_url: {{ printf "%s#distantsignalschedulefeedingestrejected" $runbook | quote }}
        {{- /*
        CORPUS (scheduleFeed.corpus): schedule-ingest refused a CORPUS
        extract (not gzip, not the TIPLOCDATA JSON, too few rows, a row
        without an NLC, or over the decompression cap). The series only
        exists while CORPUS ingest is enabled. corpus_locations keeps the
        previous delivery.
        */}}
        - alert: DistantSignalCorpusRejected
          expr: |
            sum by (namespace) (increase(distant_signal_schedule_feed_corpus_rejected_total{namespace="{{ $ns }}"}[{{ .zipRejectedWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "schedule-ingest rejected a CORPUS extract"
            description: "Moved to corpus/rejected/; the previous extract stays in use. The ingest container's error log names the reason."
            runbook_url: {{ printf "%s#distantsignalcorpusrejected" $runbook | quote }}
        {{- /*
        CORPUS (scheduleFeed.corpus): the newest loaded CORPUS delivery is
        older than corpusStaleAfterDays. api sets the gauge from
        corpus_deliveries at startup and after each load, so it survives
        restarts between monthly deliveries; it does not exist before the
        first load, so a freshly enabled install waiting for its first
        delivery does not fire. Renders only while CORPUS ingest is on, so
        a disabled feature (whose old deliveries still set the gauge) never
        alerts.
        */}}
        {{- if ($.Values.scheduleFeed.corpus).enabled }}
        - alert: DistantSignalCorpusStale
          expr: |
            time() - max by (namespace) (distant_signal_api_corpus_last_delivered_at_seconds{namespace="{{ $ns }}"}) > {{ mul (int .corpusStaleAfterDays) 86400 }}
          for: 1h
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "no CORPUS delivery loaded for {{ .corpusStaleAfterDays }} days"
            description: "CORPUS is monthly: RDM stopped pushing it, or schedule-ingest cannot load it. The previous extract stays in use."
            runbook_url: {{ printf "%s#distantsignalcorpusstale" $runbook | quote }}
        {{- end }}
        {{- /*
        SCHED-2: the delivery timestamp of the last delivery every product
        of which published (seeded at startup from api's durable marker).
        Deliveries land nightly, so this covers a missing delivery, a
        delivery that keeps failing to publish, and a wedged publisher.
        */}}
        - alert: DistantSignalScheduleReferencePublishStale
          expr: |
            time() - max by (namespace) (distant_signal_schedule_reference_last_published_delivery_timestamp_seconds{namespace="{{ $ns }}"}) > {{ mul (int .staleAfterHours) 3600 }}
          for: 15m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "no CIF delivery fully published for {{ .staleAfterHours }}h"
            description: "No new delivery arrived, or one keeps failing to publish. Check schedule-ingest, the SFTP upload and the reference log."
            runbook_url: {{ printf "%s#distantsignalschedulereferencepublishstale" $runbook | quote }}
        {{- /*
        SCHED-2: a final chunk's delete was skipped because the staged key
        count did not match the publisher's total, so rows missing from that
        publish stay until the next complete one. Counted by the api (api_)
        or, with schedule-reference's db sink, by schedule-reference itself
        (store_, ingest plan 2a.5): the alert is the `or` of the two, written
        as one sum over both names (counters, so the sum is above 0 exactly
        when either increased). A bare `A or B` would be wrong: both
        processes register their series at 0, so it would always pick the
        api's and miss the db sink's. The api_ name goes in phase 5.
        */}}
        - alert: DistantSignalSchedulePublishStagedMismatch
          expr: |
            sum by (namespace, product) (increase({__name__=~"distant_signal_(api|store)_schedule_publish_staged_mismatch_total", namespace="{{ $ns }}"}[{{ .mismatchWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $labels.product }}" }} publish kept stale rows"
            description: "Its staged key count did not match the publisher's total, so rows it left out stay until the next complete publish."
            runbook_url: {{ printf "%s#distantsignalschedulepublishstagedmismatch" $runbook | quote }}
        {{- /*
        DQ6/SCHED-1: api answered 400/413/422 to one of schedule-reference's
        products. That is permanent for the delivery: it is not retried, and
        the durable completion marker is not written (so a restart tries the
        delivery again). The product's previous rows stay in place.
        */}}
        - alert: DistantSignalScheduleReferencePublishRejected
          expr: |
            sum by (namespace, product) (increase(distant_signal_schedule_reference_publishes_total{namespace="{{ $ns }}", outcome="rejected"}[{{ .rejectedWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "api rejected schedule-reference's {{ "{{ $labels.product }}" }} publish"
            description: "400/413/422: not retried for this delivery, and the product keeps its previous rows. Usually schema skew or a big chunk."
            runbook_url: {{ printf "%s#distantsignalschedulereferencepublishrejected" $runbook | quote }}
        {{- /*
        DQ11/PL-9: schedule-reference publishes each line's population for
        today and tomorrow, so the rail day's population normally exists a
        day early. full-coverage-consumer exports how many lines still have
        none for the current rail day, but only once it is past 06:00 London
        (0 before), so this alert needs no time-of-day logic.
        */}}
        - alert: DistantSignalLinePopulationMissing
          expr: |
            max by (namespace) (distant_signal_full_coverage_consumer_population_missing_past_deadline_lines{namespace="{{ $ns }}"}) > 0
          for: {{ .populationMissingFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "{{ "{{ $value }}" }} lines have no schedule population for today"
            description: "Past 06:00 London, so their full-coverage stats stay Pending. Check the CIF publishes and the consumer's reload errors."
            runbook_url: {{ printf "%s#distantsignallinepopulationmissing" $runbook | quote }}
    {{- end }}
    {{- end }}
    {{- if $sftpOn }}
    {{- with $rule.scheduleSftp }}
    - name: distant-signal.schedule-sftp
      rules:
        {{- /*
        SFTPGo's telemetry counters (scheduleFeed.sftp.telemetry) carry no
        labels of their own, so every expression sums across pods: a
        Recreate rollout leaves the old pod's series, which increase()
        copes with. Uploads are not per file type, so a CORPUS upload can
        mask a missing CIF; DistantSignalScheduleReferencePublishStale stays
        authoritative for the timetable. The `offset` clause keeps
        NoUpload quiet until the counter has a full window of history
        (the first noUploadWindow after telemetry is turned on).
        */}}
        - alert: DistantSignalSftpNoUpload
          expr: |
            sum by (namespace) (increase(sftpgo_uploads_total{namespace="{{ $ns }}"}[{{ .noUploadWindow }}])) == 0
            and on (namespace)
            count by (namespace) (sftpgo_uploads_total{namespace="{{ $ns }}"} offset {{ .noUploadWindow }}) > 0
          for: {{ .noUploadFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "No SFTP upload to schedulefeed in {{ .noUploadWindow }}"
            description: >-
              SFTPGo in {{ "{{ $labels.namespace }}" }} received no file in
              {{ .noUploadWindow }}. DTD's daily push did not arrive.
            runbook_url: {{ printf "%s#distantsignalsftpnoupload" $runbook | quote }}
        - alert: DistantSignalSftpUploadErrors
          expr: |
            sum by (namespace) (increase(sftpgo_upload_errors_total{namespace="{{ $ns }}"}[{{ .uploadErrorsWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "SFTP upload failed on schedulefeed"
            description: >-
              An upload to SFTPGo in {{ "{{ $labels.namespace }}" }} failed or was
              interrupted in the last {{ .uploadErrorsWindow }}. Check the next ingest.
            runbook_url: {{ printf "%s#distantsignalsftpuploaderrors" $runbook | quote }}
        - alert: DistantSignalSftpUserStoreDown
          expr: |
            max by (namespace) (sftpgo_dataprovider_availability{namespace="{{ $ns }}"}) == 0
          for: {{ .userStoreDownFor }}
          labels:
            severity: {{ .userStoreDownSeverity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "SFTPGo user store unavailable on schedulefeed"
            description: >-
              SFTPGo in {{ "{{ $labels.namespace }}" }} reports its user store
              down, so every login fails and DTD's push cannot land.
            runbook_url: {{ printf "%s#distantsignalsftpuserstoredown" $runbook | quote }}
    {{- end }}
    {{- end }}
    {{- if $bucketOn }}
    {{- with $rule.scheduleBucket }}
    - name: distant-signal.schedule-bucket
      rules:
        {{- /*
        The bucket source of schedule-ingest (scheduleFeed.bucket). Its
        metrics carry source="bucket" and are registered at 0 when the
        source starts, so a plain increase() sees the first error. See
        docs/schedule-feed-bucket.md for the kill switch and the reader's
        loop guards.
        */}}
        - alert: DistantSignalScheduleBucketAccessRevoked
          expr: |
            max by (namespace) (distant_signal_schedule_feed_source_access_revoked{namespace="{{ $ns }}", source="bucket"}) == 1
          for: {{ .accessRevokedFor }}
          labels:
            severity: {{ .criticalSeverity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Schedule-feed bucket access revoked"
            description: "Every bucket call is refused (kill switch, or a missing or rotated key). SFTP carries on. Recovery is a Ranma reapply."
            runbook_url: {{ printf "%s#distantsignalschedulebucketaccessrevoked" $runbook | quote }}
        {{- /*
        Recorded so NoNewObject's expr (which reads it twice) stays well
        under check-alert-payloads.py's 300 characters, and a 3-alert
        webhook well under ntfy's 4,096 bytes (inline: 292 and ~4,040).
        */}}
        - record: distant_signal:schedule_bucket_last_new_object_seconds:max
          expr: |
            max by (namespace) (distant_signal_schedule_feed_source_last_new_object_seconds{namespace="{{ $ns }}", source="bucket"})
        - alert: DistantSignalScheduleBucketNoNewObject
          expr: |
            time() - distant_signal:schedule_bucket_last_new_object_seconds:max{namespace="{{ $ns }}"} > {{ mul (int .noNewObjectHours) 3600 }}
            and on (namespace)
            distant_signal:schedule_bucket_last_new_object_seconds:max{namespace="{{ $ns }}"} > 0
          for: {{ .noNewObjectFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "No new object in the schedule-feed bucket in {{ .noNewObjectHours }}h"
            description: "The publisher's daily push has not reached the bucket. SFTP may still be delivering: PublishStale is authoritative."
            runbook_url: {{ printf "%s#distantsignalschedulebucketnonewobject" $runbook | quote }}
        - alert: DistantSignalScheduleBucketReadErrors
          expr: |
            sum by (namespace) (increase(distant_signal_schedule_feed_source_errors_total{namespace="{{ $ns }}", source="bucket", kind!="auth"}[{{ .readErrorsWindow }}])) > 0
          for: {{ .readErrorsFor }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Schedule-feed bucket read errors"
            description: "schedule-ingest's bucket source keeps failing to list, get, verify or delete. It backs off; SFTP is unaffected."
            runbook_url: {{ printf "%s#distantsignalschedulebucketreaderrors" $runbook | quote }}
        - alert: DistantSignalScheduleBucketUnexpectedObject
          expr: |
            sum by (namespace) (increase(distant_signal_schedule_feed_source_unexpected_objects_total{namespace="{{ $ns }}", source="bucket"}[{{ .unexpectedWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Unexpected object in the schedule-feed bucket"
            description: "An object with an unexpected name or size was flagged and is deleted unread (recoverable from soft delete for 7 days)."
            runbook_url: {{ printf "%s#distantsignalschedulebucketunexpectedobject" $runbook | quote }}
        - alert: DistantSignalScheduleBucketDownloadBudget
          expr: |
            max by (namespace) (distant_signal_schedule_feed_source_download_capped{namespace="{{ $ns }}", source="bucket"}) == 1
          for: 0m
          labels:
            severity: {{ .criticalSeverity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "Schedule-feed bucket download cap hit"
            description: "The reader's hourly or daily download cap stopped it: a loop or an attack. Find the cause before raising the caps."
            runbook_url: {{ printf "%s#distantsignalschedulebucketdownloadbudget" $runbook | quote }}
        {{- if $.Values.scheduleFeed.sftp.enabled }}
        - alert: DistantSignalScheduleFeedSourcesDisagree
          expr: |
            sum by (namespace, kind) (increase(distant_signal_schedule_feed_source_disagreement_total{namespace="{{ $ns }}"}[{{ .disagreeWindow }}])) > 0
          for: 0m
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "SFTP and bucket delivered different {{ "{{ $labels.kind }}" }}"
            description: "The two sources delivered different content within the disagreement window. The bucket copy won (D5)."
            runbook_url: {{ printf "%s#distantsignalschedulefeedsourcesdisagree" $runbook | quote }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
{{- /*
Poller alerts (SVC-04, SVC-08), in their own PrometheusRule so this file's
main resource above stays untouched. Same gating, prefix and namespace
scoping as above.
*/}}
{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
{{- $rule := .Values.metrics.prometheusRule }}
{{- $ns := .Release.Namespace }}
{{- $fullname := include "distant-signal.fullname" . }}
{{- $extraLabels := $rule.ruleLabels | default dict }}
{{- $runbook := printf "%s/docs/alerts.md" (trimSuffix "/" $rule.runbookBaseUrl) }}
{{- $anyPoller := or .Values.pollerIrishRailGtfs.enabled .Values.pollerIrishRailLive.enabled .Values.pollerNirStations.enabled }}
{{- range $name, $poller := .Values.pollers }}
{{- if $poller.enabled }}
{{- $anyPoller = true }}
{{- end }}
{{- end }}
{{- $pollerFailuresOn := and ($rule.pollerFailures).enabled $anyPoller }}
{{- $ldbwsOn := and ($rule.ldbwsStalestStation).enabled (.Values.pollers.ldbws).enabled }}
{{- $ldbwsInvalidCrsOn := and ($rule.ldbwsInvalidCrs).enabled (.Values.pollers.ldbws).enabled }}
{{- $incidentRemovalOn := and ($rule.incidentRemovalStalled).enabled (.Values.pollers.incidents).enabled }}
{{- if or $pollerFailuresOn $ldbwsOn $ldbwsInvalidCrsOn $incidentRemovalOn }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-pollers" $fullname | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "metrics") | nindent 4 }}
    {{- with $rule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $rule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: distant-signal.pollers
      rules:
        {{- with $rule.pollerFailures }}
        {{- if $pollerFailuresOn }}
        {{- /*
        No successful cycle, and at least one failed one, in the window. A
        poller whose process has only ever failed has no success series,
        hence the `or ... 0 *` fallback. Daily pollers (stations, tocs) run
        one cycle a day, so one failed daily cycle is enough to fire.
        */}}
        {{- /*
        Second clause (failureRatio, when set): more than failureRatio of the
        cycles over ratioWindow failed, so a poller that still succeeds now
        and then but mostly fails also fires. Defaults: over 15m, with a
        10m `for` (2026-10-01: the former 1h window with no `for` fired
        40-55 minutes after the pollers started failing).
        */}}
        {{- $failures := printf `sum by (namespace, poller) (increase(distant_signal_poller_cycle_total{namespace="%s", result="failure"}[%s]))` $ns .window }}
        {{- $successes := printf `sum by (namespace, poller) (increase(distant_signal_poller_cycle_total{namespace="%s", result="success"}[%s]))` $ns .window }}
        {{- /*
        Recorded as 1 (failing) or 0 per poller: each clause is a 0/1
        `bool` series under its own `clause` label, and `max` merges them.
        */}}
        - record: distant_signal:poller_failing:bool
          expr: |
            max by (namespace, poller) (
              label_replace(
                ({{ $failures }} > bool 0)
                * on (namespace, poller)
                (({{ $successes }} or on (namespace, poller) 0 * {{ $failures }}) == bool 0),
                "clause", "no_success", "", ""
              )
              {{- if .failureRatio }}
              or
              label_replace(
                sum by (namespace, poller) (increase(distant_signal_poller_cycle_total{namespace="{{ $ns }}", result="failure"}[{{ .ratioWindow }}]))
                / sum by (namespace, poller) (increase(distant_signal_poller_cycle_total{namespace="{{ $ns }}"}[{{ .ratioWindow }}]))
                > bool {{ .failureRatio }},
                "clause", "failure_ratio", "", ""
              )
              {{- end }}
            )
        - alert: DistantSignalPollerFailing
          expr: |
            distant_signal:poller_failing:bool{namespace="{{ $ns }}"} == 1
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "poller {{ "{{ $labels.poller }}" }} is failing its poll cycles"
            description: "No success in {{ .window }}{{ if .failureRatio }}, or over {{ .failureRatio }} of cycles failed in {{ .ratioWindow }}{{ end }}. Check its upstream, its key, and api."
            runbook_url: {{ printf "%s#distantsignalpollerfailing" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.ldbwsStalestStation }}
        {{- if $ldbwsOn }}
        - alert: DistantSignalLdbwsStationStale
          expr: |
            max by (namespace) (distant_signal_ldbws_stalest_station_age_seconds{namespace="{{ $ns }}"}) > {{ .maxAgeSeconds }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "an LDBWS station not sampled for {{ "{{ $value | humanizeDuration }}" }}"
            description: "Over {{ .maxAgeSeconds }}s: the rotation no longer reaches every station, e.g. each cycle runs out of budget first."
            runbook_url: {{ printf "%s#distantsignalldbwsstationstale" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.ldbwsInvalidCrs }}
        {{- if $ldbwsInvalidCrsOn }}
        - alert: DistantSignalLdbwsInvalidCrs
          expr: |
            max by (namespace, crs) (distant_signal_ldbws_invalid_crs_station{namespace="{{ $ns }}"}) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "LDBWS rejects sample station {{ "{{ $labels.crs }}" }} as an invalid CRS"
            description: "Almost certainly a lines/*.toml sample_stations typo. Fix it, run line-catalogue-validator and redeploy api."
            runbook_url: {{ printf "%s#distantsignalldbwsinvalidcrs" $runbook | quote }}
        {{- end }}
        {{- end }}
        {{- with $rule.incidentRemovalStalled }}
        {{- if $incidentRemovalOn }}
        {{- /*
        api skipped the "Ended (no longer listed)" inference for an
        incomplete, empty or >50%-shrunken incidents snapshot, and applied it
        to none, over `window`: incidents that leave the feed stay "active"
        again. Counters registered at 0 by api (and by poller-incidents with
        pollers.incidents.ingest.sink db, plan 2c.2) at startup. too_soon and
        no_baseline are benign and not counted. The per-outcome increase is
        a recording rule to keep the alert's expr (and so its webhook) short.
        */}}
        - record: distant_signal:incident_removal_inference:increase
          expr: |
            sum by (namespace, outcome) (increase(distant_signal_api_incident_removal_inference_total{namespace="{{ $ns }}"}[{{ .window }}]))
        - alert: DistantSignalIncidentRemovalStalled
          expr: |
            sum by (namespace) (distant_signal:incident_removal_inference:increase{namespace="{{ $ns }}", outcome=~"incomplete|empty|shrink"}) > 0
            unless on (namespace)
            distant_signal:incident_removal_inference:increase{namespace="{{ $ns }}", outcome="applied"} > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $extraLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: "no incident snapshot fit to infer ended incidents in {{ .window }}"
            description: "Incomplete, empty or halved snapshots: incidents leaving the feed stay active. Check poller-incidents and api logs."
            runbook_url: {{ printf "%s#distantsignalincidentremovalstalled" $runbook | quote }}
        {{- end }}
        {{- end }}
{{- end }}
{{- end }}

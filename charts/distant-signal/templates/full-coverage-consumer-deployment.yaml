{{- include "distant-signal.removedMovementFeedGuard" (dict "name" "fullCoverageConsumer" "value" .Values.fullCoverageConsumer.movementFeed) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-full-coverage-consumer" (include "distant-signal.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "full-coverage-consumer") | nindent 4 }}
spec:
  # Values-driven, symmetry with trust-consumer's own knob (Task 10 of
  # docs/superpowers/plans/2026-09-04-movement-relay-plan.md) -- was a
  # fixed `1` YAML literal: one fixed consumer-group id per deployment,
  # same single-consumer-group-per-deployment reasoning as trust-consumer's
  # own replicaCount (see that Deployment's own comment).
  replicas: {{ .Values.fullCoverageConsumer.replicaCount }}
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "full-coverage-consumer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "full-coverage-consumer") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.fullCoverageConsumer.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.fullCoverageConsumer.metricsPort | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.fullCoverageConsumer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.fullCoverageConsumer.podSecurityContext) | nindent 8 }}
      containers:
        - name: full-coverage-consumer
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.fullCoverageConsumer.image) | quote }}
          imagePullPolicy: {{ .Values.fullCoverageConsumer.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.fullCoverageConsumer.healthPort }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.fullCoverageConsumer.metricsPort }}
              protocol: TCP
            {{- end }}
          # Real connected/disconnected semantics -- same reasoning as
          # trust-consumer-deployment.yaml's own probes (a second,
          # independent persistent Kafka consumer, same needs).
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
            # tolerate a real reconnect cycle before restarting the pod. /healthz
            # also goes 503 "stalled" once no loop iteration has completed for
            # progressStallSecs, so a wedged loop is restarted too.
            failureThreshold: 6
          # Env var names below are the uppercase-snake-case clap `env`
          # names crates/full-coverage-consumer/src/config.rs actually
          # declares.
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.fullCoverageConsumerEnv" .) "extra" .Values.fullCoverageConsumer.extraEnv) | trim | nindent 12 }}
          {{- with .Values.fullCoverageConsumer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.fullCoverageConsumer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fullCoverageConsumer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.fullCoverageConsumer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- /*
This container's own env entries. distant-signal.mergeEnv renders them
with fullCoverageConsumer.extraEnv, which replaces an entry of the same name.
*/ -}}
{{- define "distant-signal.fullCoverageConsumerEnv" }}
            - name: SCHEDULE_LINE_POPULATION_URL
              value: {{ printf "%s/private/schedule-line-population" (include "distant-signal.apiBaseUrl" .) | quote }}
            - name: FULL_COVERAGE_STATS_URL
              value: {{ printf "%s/private/full-coverage-stats" (include "distant-signal.apiBaseUrl" .) | quote }}
            # The OTHER chain's own endpoint (per-station-full-coverage-stats
            # plan) -- this crate is only ever an HTTP client of it.
            - name: STATION_FULL_COVERAGE_STATS_URL
              value: {{ printf "%s/private/station-full-coverage-samples" (include "distant-signal.apiBaseUrl" .) | quote }}
            - name: STANOX_CRS_URL
              value: {{ printf "%s/private/stanox-crs" (include "distant-signal.apiBaseUrl" .) | quote }}
            - name: INTERNAL_OAUTH_TOKEN_URL
              value: {{ .Values.internalOauth.tokenUrl | quote }}
            - name: INTERNAL_OAUTH_CLIENT_ID
              value: {{ .Values.internalOauth.clientId | quote }}
            - name: INTERNAL_OAUTH_SCOPE
              value: {{ .Values.internalOauth.scope | quote }}
            - name: INTERNAL_OAUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.fullCoverageConsumerSecretName" . }}
                  key: {{ include "distant-signal.fullCoverageConsumerOauthUsernameSecretKey" . }}
            - name: INTERNAL_OAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.fullCoverageConsumerSecretName" . }}
                  key: {{ include "distant-signal.fullCoverageConsumerOauthPasswordSecretKey" . }}
            - name: POPULATION_RELOAD_SECS
              value: {{ .Values.fullCoverageConsumer.populationReloadSecs | quote }}
            - name: STANOX_CRS_RELOAD_SECS
              value: {{ .Values.fullCoverageConsumer.stanoxCrsReloadSecs | quote }}
            - name: STATS_WRITE_INTERVAL_SECS
              value: {{ .Values.fullCoverageConsumer.statsWriteIntervalSecs | quote }}
            - name: SHADOW_LINES
              value: {{ .Values.fullCoverageConsumer.shadowLines | quote }}
            # Matches the binary's own default (crates/full-coverage-consumer/src/config.rs)
            # and where docker/full-coverage-consumer.Dockerfile bakes the
            # catalogue in -- same pattern as aggregator/api/schedule-reference,
            # no volume mount needed (confirmed against those Deployments:
            # none of them mount a lines/ volume either, it's baked into
            # the image at build time).
            - name: LINES_DIR
              value: /app/lines
            - name: HEALTH_BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.fullCoverageConsumer.healthPort) | quote }}
            - name: PROGRESS_STALL_SECS
              value: {{ .Values.fullCoverageConsumer.progressStallSecs | quote }}
            - name: REDIS_URL
              value: {{ include "distant-signal.redisUrl" . | quote }}
            {{- include "distant-signal.redisClientAuthEnv" (dict "root" . "client" "fullCoverageConsumer" "user" "full-coverage-consumer") }}
            {{- with include "distant-signal.fullCoverageConsumerIngestSink" . }}
            # fullCoverageConsumer.ingest.sink (ingest plan 3a.8): XADD each
            # stats write to ds:ingest:full-coverage. Not rendered for http.
            - name: INGEST_SINK
              value: {{ . | quote }}
            {{- end }}
            - name: REDIS_AUTOCLAIM_MIN_IDLE_SECS
              value: {{ .Values.fullCoverageConsumer.redisAutoclaimMinIdleSecs | quote }}
            - name: REDIS_GAP_CHECK_SECS
              value: {{ .Values.fullCoverageConsumer.redisGapCheckSecs | quote }}
            # Windowed stats: off unless windowedStats.enabled.
            - name: FULL_COVERAGE_WINDOWED_STATS
              value: {{ .Values.fullCoverageConsumer.windowedStats.enabled | quote }}
            - name: FULL_COVERAGE_WINDOW_STATS_URL
              value: {{ printf "%s/private/full-coverage-window-stats" (include "distant-signal.apiBaseUrl" .) | quote }}
            - name: FULL_COVERAGE_RECENT_WINDOW_MINUTES
              value: {{ .Values.fullCoverageConsumer.windowedStats.recentWindowMinutes | quote }}
            - name: FULL_COVERAGE_GRACE_MINUTES
              value: {{ .Values.fullCoverageConsumer.windowedStats.graceMinutes | quote }}
            - name: FULL_COVERAGE_ACTIVATIONS_MIN
              value: {{ .Values.fullCoverageConsumer.windowedStats.activationsMin | quote }}
            - name: FULL_COVERAGE_FEED_STALE_SECS
              value: {{ .Values.fullCoverageConsumer.windowedStats.feedStaleSecs | quote }}
            - name: FULL_COVERAGE_LINE_MEMBERSHIP
              value: {{ .Values.fullCoverageConsumer.windowedStats.lineMembership | quote }}
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.fullCoverageConsumer.metricsPort | quote }}
            {{- end }}
            - name: RUST_LOG
              value: {{ .Values.fullCoverageConsumer.logLevel | quote }}
{{- end }}

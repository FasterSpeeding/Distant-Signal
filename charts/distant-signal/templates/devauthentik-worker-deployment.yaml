{{- if .Values.devAuthentik.enabled }}
{{/*
See devauthentik-server-deployment.yaml's identical comment: this is the
container that actually applies blueprints, so it's the one that genuinely
needs SSO_REDIRECT_URL at runtime for oauth2-client.yaml's
`!Env [SSO_REDIRECT_URL, ...]` to resolve correctly.
*/}}
{{- $redirectUrl := .Values.api.sso.redirectUrl | default (include "distant-signal.devAuthentikRedirectUrl" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distant-signal.devAuthentikWorkerFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "devauthentik-worker") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "devauthentik-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "devauthentik-worker") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" dict) | nindent 8 }}
      containers:
        - name: authentik-worker
          image: {{ printf "%s:%s" .Values.devAuthentik.image.repository .Values.devAuthentik.image.tag | quote }}
          imagePullPolicy: {{ .Values.devAuthentik.image.pullPolicy }}
          args: ["worker"]
          securityContext:
            # readOnlyRootFilesystem is FALSE here, same rationale as
            # devauthentik-server-deployment.yaml's identical block:
            # Authentik (Django/gunicorn) is a third-party image not designed
            # for a read-only root filesystem, and this container additionally
            # applies blueprints on a schedule. Matches the posture used for
            # every other third-party image in this chart.
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.devAuthentikSecretName" . }}
                  key: {{ include "distant-signal.devAuthentikSecretKeySecretKey" . }}
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: {{ include "distant-signal.devAuthentikPostgresFullname" . }}
            - name: AUTHENTIK_POSTGRESQL__USER
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__NAME
              value: authentik
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.devAuthentikSecretName" . }}
                  key: {{ include "distant-signal.devAuthentikPostgresSecretKey" . }}
            # Telemetry -- same two vars and same rationale as
            # devauthentik-server-deployment.yaml's identical block and
            # docker-compose.authentik.yml's &authentik-env anchor, confirmed
            # against https://docs.goauthentik.io/install-config/configuration/
            # for 2026.8.0: AUTHENTIK_ERROR_REPORTING__ENABLED already
            # defaults to "false" (pinned explicitly in case a future
            # authentik version changes that default) but
            # AUTHENTIK_DISABLE_UPDATE_CHECK defaults to "false" too, i.e.
            # the inbuilt update-checker is ON and phones home unless told
            # otherwise.
            - name: AUTHENTIK_ERROR_REPORTING__ENABLED
              value: "false"
            - name: AUTHENTIK_DISABLE_UPDATE_CHECK
              value: "true"
            - name: SSO_REDIRECT_URL
              value: {{ $redirectUrl | quote }}
          volumeMounts:
            - name: blueprints
              mountPath: /blueprints/local
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
          # No probes -- like the aggregator, the worker exposes no HTTP
          # surface. Failure handling is restart-on-exit via the default
          # restartPolicy.
          {{- with .Values.devAuthentik.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: blueprints
          configMap:
            name: {{ include "distant-signal.devAuthentikFullname" . }}-blueprints
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
      {{- with .Values.devAuthentik.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.devAuthentik.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.devAuthentik.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "distant-signal.postgresFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  # Fixed at 1 -- see the comment above `postgresql:` in values.yaml.
  replicas: 1
  serviceName: {{ include "distant-signal.postgresFullname" . }}
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      # Deliberately NOT the full `distant-signal.labels` set: its
      # `helm.sh/chart` and `app.kubernetes.io/version` values change on every
      # CI build, and any pod-template change rolls this StatefulSet -- i.e.
      # restarted Postgres (dropping its cache) on every deploy. Only labels
      # that stay constant across releases belong here. Every other pod
      # template uses `distant-signal.podLabels`, which also has managed-by;
      # this one keeps its older set so switching to it doesn't restart
      # Postgres. scripts/check-pod-labels-chart.py checks both.
      labels:
        {{- include "distant-signal.selectorLabels" (dict "root" . "component" "postgres") | nindent 8 }}
        app.kubernetes.io/part-of: distant-signal
      {{- with .Values.postgresql.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- /*
      Unset (Kubernetes' 30s) unless postgresql.terminationGracePeriodSeconds
      is set or pgBackRest is on. With pgBackRest a stop waits for the
      archiver's last attempts (distant-signal.pgbackrestStopBudgetSecs), and
      a SIGKILL at 30s would leave crash recovery to the next start.
      */}}
      {{- with include "distant-signal.postgresTerminationGracePeriodSeconds" . }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # NOTE: postgres:16 is the one image in this chart whose default USER
      # is root -- its entrypoint drops to `postgres` via gosu. A bare
      # `runAsNonRoot: true` would therefore fail admission, so the uid/gid
      # are pinned explicitly below (the image runs correctly when it is
      # already uid 999 and skips its own gosu step). fsGroup: 999 is what
      # lets the postgres user write a freshly-provisioned PVC.
      #
      # This is the one workload that does not use the chart-wide
      # distant-signal.podSecurityContext helper, because those two extra pins are
      # mandatory here. `postgresql.podSecurityContext` still overrides.
      securityContext:
        {{- $pgSecurityDefaults := dict "runAsNonRoot" true "runAsUser" 999 "runAsGroup" 999 "fsGroup" 999 "seccompProfile" (dict "type" "RuntimeDefault") }}
        {{- toYaml (mergeOverwrite $pgSecurityDefaults (default (dict) .Values.postgresql.podSecurityContext | deepCopy)) | nindent 8 }}
      containers:
        - name: postgres
          {{- /*
          postgresql.image, or with postgresql.pgbackrest.enabled the same
          Postgres plus pgBackRest (postgresql.pgbackrest.image);
          and the `-c` args below then also carry archive_mode,
          archive_command and archive_timeout (templates/_pgbackrest.tpl).
          */}}
          image: {{ include "distant-signal.postgresImage" . | quote }}
          imagePullPolicy: {{ include "distant-signal.postgresImagePullPolicy" . }}
          {{- with (include "distant-signal.postgresConfig" . | fromYaml) }}
          # postgresql.config, one `-c name=value` pair per key (sorted).
          # The image's entrypoint forwards a leading `-c` to `postgres`,
          # including for the temporary initdb-time server. Command-line
          # settings OUTRANK postgresql.conf AND ALTER SYSTEM
          # (postgresql.auto.conf), so values here always win. Being part of
          # the pod template, any change rolls the StatefulSet -- i.e. a
          # Postgres restart, which most of these settings need anyway.
          args:
            {{- range $name, $value := . }}
            - -c
            - {{ printf "%s=%s" $name (include "distant-signal.postgresConfValue" $value) | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            # NOT read-only: postgres writes its socket to /var/run/postgresql.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: {{ .Values.postgresql.service.port }}
              protocol: TCP
          env:
            {{- include "distant-signal.mergeEnv" (dict "env" (include "distant-signal.postgresEnv" .) "extra" .Values.postgresql.extraEnv) | trim | nindent 12 }}
          # Same probe command docker-compose.yml uses for its healthcheck.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p {{ .Values.postgresql.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          # INF-4: crash recovery (WAL redo after an unclean shutdown, e.g. a
          # node reboot) answers "not yet accepting connections", which
          # pg_isready reports as a failure. Without a startupProbe the
          # liveness probe below would SIGTERM Postgres mid-redo and the next
          # start would replay the same WAL again -- a recovery loop that
          # never converges. Liveness (and readiness) only start once this
          # succeeds, so redo gets the whole startup budget:
          # periodSeconds x failureThreshold (default 10s x 90 = 15 min),
          # sized for up to max_wal_size (4GB) of redo on a node that is
          # also starting every other pod at once.
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p {{ .Values.postgresql.service.port }}
            periodSeconds: {{ .Values.postgresql.probes.startup.periodSeconds }}
            timeoutSeconds: 5
            failureThreshold: {{ .Values.postgresql.probes.startup.failureThreshold }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p {{ .Values.postgresql.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if .Values.postgresql.shm.enabled }}
            - name: dshm
              mountPath: /dev/shm
            {{- end }}
            {{- if include "distant-signal.postgresRolesInitScript" . }}
            - name: roles-initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: roles-sql
              mountPath: /etc/distant-signal/postgres-roles
              readOnly: true
            {{- end }}
          {{- with .Values.postgresql.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $podDataVolume := or (not .Values.postgresql.persistence.enabled) .Values.postgresql.persistence.existingClaim }}
      {{- $rolesInit := include "distant-signal.postgresRolesInitScript" . }}
      {{- if or $podDataVolume .Values.postgresql.shm.enabled $rolesInit }}
      volumes:
        {{- if $podDataVolume }}
        - name: data
          {{- if .Values.postgresql.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.postgresql.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if .Values.postgresql.shm.enabled }}
        # The container runtime's default /dev/shm is 64 MiB. Postgres puts
        # its dynamic shared memory there (dynamic_shared_memory_type=posix):
        # a parallel VACUUM's dead-tuple array (up to maintenance_work_mem)
        # and parallel hash joins (up to work_mem * hash_mem_multiplier per
        # participant). A full /dev/shm fails the statement with "could not
        # resize shared memory segment ... No space left on device" -- seen
        # in production. shared_buffers is an anonymous mmap and does NOT
        # live here. tmpfs pages count against the container's memory limit
        # while in use. Sizing rule: see `postgresql.shm` in values.yaml.
        - name: dshm
          emptyDir:
            medium: Memory
            {{- with .Values.postgresql.shm.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
        {{- end }}
        {{- if $rolesInit }}
        # postgresql.roles.initScript (templates/postgres-roles.yaml): only
        # the shell script goes in /docker-entrypoint-initdb.d, executable;
        # the SQL it runs is mounted elsewhere, or the entrypoint would also
        # run it on its own, without the variables.
        - name: roles-initdb
          configMap:
            name: {{ include "distant-signal.postgresRolesConfigMapName" . }}
            defaultMode: 0555
            items:
              - key: 10-distant-signal-roles.sh
                path: 10-distant-signal-roles.sh
        - name: roles-sql
          configMap:
            name: {{ include "distant-signal.postgresRolesConfigMapName" . }}
            items:
              - key: postgres-roles.sql
                path: postgres-roles.sql
              {{- if include "distant-signal.perServiceEnabled" . }}
              - key: postgres-grants.sql
                path: postgres-grants.sql
              {{- end }}
        {{- end }}
      {{- end }}
  {{- if and .Values.postgresql.persistence.enabled (not .Values.postgresql.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          # selectorLabels, NOT the full distant-signal.labels -- these land in
          # volumeClaimTemplates, which is immutable after creation exactly
          # like selector.matchLabels (see that helper's own comment). The
          # full label set embeds helm.sh/chart's version, so it changes on
          # every chart bump; using it here means the SECOND chart upgrade
          # after this StatefulSet's creation always fails with "updates to
          # statefulset spec for fields other than ... are forbidden".
          {{- include "distant-signal.selectorLabels" (dict "root" . "component" "postgres") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.postgresql.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size | quote }}
        {{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
{{- end }}

{{- /*
This container's own env entries. distant-signal.mergeEnv renders them
with postgresql.extraEnv, which replaces an entry of the same name.
*/ -}}
{{- define "distant-signal.postgresEnv" }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.postgresSecretName" . }}
                  key: {{ include "distant-signal.postgresSecretPasswordKey" . }}
            # PGDATA must be a SUBDIRECTORY of the mount, not the mount
            # itself: many CSI drivers put a `lost+found` entry in a fresh
            # volume, and initdb refuses to initialise a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- if include "distant-signal.pgbackrestEnabled" . }}
            {{- include "distant-signal.pgbackrestEnv" . | nindent 12 }}
            {{- end }}
            {{- if include "distant-signal.postgresRolesInitScript" . }}
            # postgresql.roles.initScript: the role passwords for
            # /docker-entrypoint-initdb.d/10-distant-signal-roles.sh, which
            # only runs on an empty data directory.
            {{- include "distant-signal.postgresRolesPasswordEnv" . | trim | nindent 12 }}
            {{- end }}
{{- end }}

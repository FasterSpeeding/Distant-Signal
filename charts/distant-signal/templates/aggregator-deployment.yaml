apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-aggregator" (include "distant-signal.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "aggregator") | nindent 4 }}
spec:
  # Fixed at 1 -- see the comment above `aggregator:` in values.yaml.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a rolling update would briefly run two
    # aggregators, double-writing line_status and racing the history prune.
    type: Recreate
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "aggregator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "aggregator") | nindent 8 }}
      {{- if or .Values.metrics.enabled .Values.aggregator.podAnnotations }}
      annotations:
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.aggregator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.aggregator.podSecurityContext) | nindent 8 }}
      containers:
        - name: aggregator
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.aggregator.image) | quote }}
          imagePullPolicy: {{ .Values.aggregator.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          # No probes: this binary exposes no HTTP surface at all. Failure
          # handling is restart-on-exit via the default restartPolicy. It
          # DOES now optionally expose a /metrics listener (see
          # docs/superpowers/specs/2026-08-29-metrics-design.md) -- that's a
          # scrape target, not a liveness/readiness signal, so no probe is
          # added here even with metrics.enabled=true.
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          env:
            {{- include "distant-signal.databaseEnv" . | nindent 12 }}
            # Always rendered, unlike the port env var below: this is
            # the Rust-side toggle that actually stops the binary from
            # starting its /metrics listener (`metrics_enabled` in
            # crates/aggregator/src/config.rs). Omitting the port/env/annotations
            # alone would not -- Kubernetes container ports are purely
            # declarative -- so this must render "false" too, not vanish.
            - name: METRICS_ENABLED
              value: {{ .Values.metrics.enabled | quote }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            {{- end }}
            # Matches the binary's own default (crates/aggregator/src/config.rs)
            # and where docker/aggregator.Dockerfile bakes the catalogue in.
            - name: LINES_DIR
              value: /app/lines
            - name: POLL_INTERVAL_SECS
              value: {{ .Values.aggregator.pollIntervalSecs | quote }}
            - name: HISTORY_RETENTION_DAYS
              value: {{ .Values.aggregator.historyRetentionDays | quote }}
            - name: DAILY_STATS_RETENTION_DAYS
              value: {{ .Values.aggregator.dailyStatsRetentionDays | quote }}
            - name: RUST_LOG
              value: {{ .Values.aggregator.logLevel | quote }}
            {{- with .Values.aggregator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.aggregator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.aggregator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aggregator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.aggregator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

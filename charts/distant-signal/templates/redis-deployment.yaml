{{- if .Values.redis.enabled }}
{{- /* redis.auth (INF-3): the server only requires a password in step 2
     of the enable sequence (values.yaml redis.auth); in step 1 this pod
     is left untouched so that only the clients roll. */}}
{{- /* redis.acl (docs/redis-acl.md): per-client ACL users from an
     --aclfile instead of --requirepass. */}}
{{- $acl := include "distant-signal.redisAclEnabled" . }}
{{- $requirePass := and .Values.redis.auth.enabled .Values.redis.auth.requirePass (not $acl) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "distant-signal.redisFullname" . }}
  labels:
    {{- include "distant-signal.labels" (dict "root" . "component" "redis") | nindent 4 }}
spec:
  # Fixed at 1 -- this is still a single, non-clustered Redis instance (see
  # values.yaml's own comment on `redis:` for the two consumers of it), not
  # a system of record with any HA story. It stays a Deployment+PVC rather
  # than becoming a StatefulSet like postgres: a StatefulSet's ordinal
  # naming and stable per-replica identity exist to let MULTIPLE replicas
  # each keep their own volume, which buys nothing at replicas: 1. The one
  # thing a StatefulSet would add here -- a `volumeClaimTemplates` entry
  # instead of a standalone PersistentVolumeClaim -- is exactly the shape
  # scheduleFeed's own singleton Deployment already uses successfully (see
  # schedulefeed-pvc.yaml's own comment), so this follows that precedent
  # instead of introducing a second stateful pattern into the chart.
  #
  # WHY THIS NOW HAS PERSISTENCE AT ALL (it didn't before): this Redis was
  # originally "a disposable trigger queue, not a system of record" for
  # enricher's incident-text-changed stream alone (crates/enricher/src/
  # stream.rs) -- losing it cost nothing but promptness, since enricher's
  # hourly sweep re-finds anything a dropped event would have triggered.
  # movement-relay's movement-events stream (crates/movement-feed/src/
  # redis_stream.rs) changed that: it is the SOLE transport between
  # movement-relay (the one real Kafka client) and its two downstream
  # consumer groups, trust-consumer and full-coverage-consumer, with no
  # replay source behind it. A real incident (2026-09-04) confirmed the
  # cost of that gap live: an unrelated Helm/Flux reconcile restarted this
  # pod, wiping the stream and both consumer groups instantly (no volume,
  # no AOF/RDB at all), and trust-consumer logged NOGROUP errors on every
  # cycle until its own process restart re-ran its one-time-at-startup
  # ensure_group/XGROUP CREATE ... MKSTREAM logic. Persistence (this PVC
  # plus `--appendonly yes` below) closes that gap for both streams at
  # once.
  replicas: 1
  # Recreate, not the Deployment default RollingUpdate (INF-1). The AOF
  # lives on a single ReadWriteOnce PVC, and on a single-node cluster an
  # RWO volume mounts happily into BOTH the old and the new pod, so a
  # rolling update would run two redis-servers against the same
  # appendonlydir/ for the overlap window: writes to the old pod after the
  # new one loaded the AOF are lost, and both processes append to the same
  # incr file, corrupting the AOF for the next restart. Same reasoning as
  # every other stateful singleton in this chart (schedulefeed, aggregator,
  # notifier, api).
  strategy:
    type: Recreate
    # Explicit null: a live object that used RollingUpdate keeps its old
    # `rollingUpdate` block under server-side apply, and the API server then
    # rejects `type: Recreate` ("rollingUpdate: Forbidden"). Nulling it lets
    # the upgrade from a RollingUpdate Deployment go through.
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "distant-signal.selectorLabels" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "distant-signal.labels" (dict "root" . "component" "redis") | nindent 8 }}
      {{- if or .Values.redis.podAnnotations $acl }}
      annotations:
        {{- with .Values.redis.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $acl }}
        # A stage or user change rewrites the ACL ConfigMap; restart Redis
        # so the initContainer renders the new users.acl.
        checksum/redis-acl: {{ include "distant-signal.redisAclFile" . | trim | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "distant-signal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "distant-signal.podSecurityContext" (dict "override" .Values.redis.podSecurityContext) | nindent 8 }}
      # Same shape as schedulefeed-deployment.yaml's own `volumes:` block:
      # a plain PVC referenced by name (persistence.enabled), an
      # operator-supplied existingClaim, or an emptyDir (persistence
      # disabled -- e.g. throwaway/CI use, matching postgresql.persistence's
      # own enabled:false contract) rather than three separate volumes/
      # conditionals scattered through the container spec.
      volumes:
        - name: data
          {{- if .Values.redis.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "distant-signal.redisFullname" .) .Values.redis.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if $acl }}
        - name: acl-template
          configMap:
            name: {{ printf "%s-acl" (include "distant-signal.redisFullname" .) | trunc 63 | trimSuffix "-" }}
        # The rendered users.acl holds the passwords: memory only, never
        # on the node's disk.
        - name: acl
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- end }}
      {{- if $acl }}
      initContainers:
        # redis.acl: fill the per-user passwords into users.acl. Each
        # `>${VAR}` becomes `>password`; an empty *_PREVIOUS (no rotation in
        # progress) is dropped, any other empty password or one containing
        # whitespace fails the pod rather than starting Redis with a broken
        # file. Uses the Redis image's own sh and awk.
        - name: redis-acl
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.redis.image) | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          command:
            - sh
            - -c
            - |
              set -eu
              umask 077
              awk '
              {
                out = ""
                n = split($0, field, " ")
                for (i = 1; i <= n; i++) {
                  t = field[i]
                  if (t ~ /^>[$][{][A-Z0-9_]+[}]$/) {
                    name = substr(t, 4, length(t) - 4)
                    v = ENVIRON[name]
                    if (v == "") {
                      if (name ~ /_PREVIOUS$/) continue
                      print "redis-acl: " name " is empty" > "/dev/stderr"
                      exit 1
                    }
                    if (v ~ /[ \t]/) {
                      print "redis-acl: " name " contains whitespace" > "/dev/stderr"
                      exit 1
                    }
                    t = ">" v
                  }
                  out = (out == "") ? t : out " " t
                }
                print out
              }' /etc/redis-acl-template/users.acl.tpl > /etc/redis-acl/users.acl
          env:
            {{- if and (include "distant-signal.redisAclDefaultUserOn" .) .Values.redis.auth.enabled }}
            - name: REDIS_ACL_PASSWORD_DEFAULT
              valueFrom:
                secretKeyRef:
                  name: {{ include "distant-signal.redisAuthSecretName" . }}
                  key: {{ include "distant-signal.redisAuthSecretKey" . }}
            {{- end }}
            {{- range $line := include "distant-signal.redisAclUserLines" . | trim | splitList "\n" }}
            {{- $user := index (regexSplit "\\s+" $line 2) 0 }}
            {{- $var := include "distant-signal.redisAclPasswordVar" $user }}
            - name: {{ $var }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.redis.acl.existingSecret }}
                  key: {{ printf "%s-password" $user }}
            - name: {{ printf "%s_PREVIOUS" $var }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.redis.acl.existingSecret }}
                  key: {{ printf "%s-password-previous" $user }}
                  optional: true
            {{- end }}
          volumeMounts:
            - name: acl-template
              mountPath: /etc/redis-acl-template
              readOnly: true
            - name: acl
              mountPath: /etc/redis-acl
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      {{- end }}
      containers:
        - name: redis
          image: {{ include "distant-signal.image" (dict "root" . "image" .Values.redis.image) | quote }}
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          securityContext:
            {{- include "distant-signal.containerSecurityContext" (dict "readOnlyRootFilesystem" false) | nindent 12 }}
          ports:
            - name: redis
              containerPort: {{ .Values.redis.service.port }}
              protocol: TCP
          # `redis:7`'s entrypoint (docker-library/redis's docker-
          # entrypoint.sh) prepends `redis-server` itself whenever the first
          # arg starts with `-`, so `args` alone (no `command` override) is
          # enough to reach the real `redis-server --appendonly yes`
          # invocation -- no ConfigMap-mounted redis.conf needed, unlike
          # this chart's other config-via-file cases (e.g. schedulefeed's
          # sftp-entrypoint ConfigMap), which exist for multi-line scripts
          # redis.conf has no equivalent need for here.
          #
          # AOF, not (only) RDB: RDB's own snapshotting is async and
          # point-in-time by design -- redis's own docs are explicit that
          # you can lose everything written since the last snapshot. For a
          # stream-shaped workload (movement-events, incident-text-changed)
          # where each entry is a discrete event rather than replaceable
          # state, that gap is exactly the durability the 2026-09-04
          # incident (see the comment above `replicas: 1`) needed closed.
          # AOF's default `appendfsync everysec` bounds the loss window to
          # ~1s of writes at a small, constant disk-write cost -- acceptable
          # here given this Redis's write volume (a handful of consumer
          # groups' worth of stream entries, not a general-purpose cache).
          #
          # RDB snapshots (`--save`) are off by default -- see values.yaml's
          # `redis.save` for why AOF alone is enough and what the
          # snapshots cost. `--maxmemory`/`--maxmemory-policy` make a full
          # Redis refuse writes (backpressure onto movement-relay's Kafka
          # consumer) instead of being OOMKilled; see `redis.maxmemory`.
          args:
            - --appendonly
            - "yes"
            {{- if not (kindIs "invalid" .Values.redis.save) }}
            - --save
            - {{ .Values.redis.save | quote }}
            {{- end }}
            {{- with .Values.redis.maxmemory }}
            - --maxmemory
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.redis.maxmemoryPolicy }}
            - --maxmemory-policy
            - {{ . | quote }}
            {{- end }}
            {{- if $requirePass }}
            # redis.auth (INF-3): the kubelet substitutes $(REDIS_PASSWORD)
            # from the env below, so the value is never in the manifest.
            # redis-server rewrites its process title, so it does not show
            # in `ps` either.
            - --requirepass
            - "$(REDIS_PASSWORD)"
            {{- end }}
            {{- if $acl }}
            # redis.acl: the users rendered by the redis-acl initContainer.
            - --aclfile
            - /etc/redis-acl/users.acl
            {{- end }}
          {{- if $requirePass }}
          env:
            {{- include "distant-signal.redisPasswordEnv" . }}
            # redis-cli (the probes below) reads its password from here.
            - name: REDISCLI_AUTH
              value: "$(REDIS_PASSWORD)"
          {{- end }}
          {{- if $acl }}
          env:
            # redis-cli (the probes below, and humans: `redis-cli --user
            # ds-admin`) authenticates as ds-admin; `default` may be off.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.acl.existingSecret }}
                  key: ds-admin-password
          {{- end }}
          volumeMounts:
            - name: data
              # Redis's own default working directory (`dir` in redis.conf,
              # unset here since no redis.conf is mounted -- see the args
              # comment above) is `/data` for the official image, and both
              # its RDB dump.rdb and its AOF appendonlydir/ are written
              # relative to `dir`. No override needed: mount the volume at
              # the same path the image already treats as its data
              # directory.
              mountPath: /data
            {{- if $acl }}
            - name: acl
              mountPath: /etc/redis-acl
              readOnly: true
            {{- end }}
          # AOF replay on startup is proportional to the AOF's size. Both
          # streams here are actively consumed/trimmed (not accumulated
          # indefinitely), so replay should stay fast, but the probe
          # tolerances below are widened from this chart's pre-persistence
          # defaults (failureThreshold was unset, i.e. Kubernetes' default
          # of 3) to give a slow replay room without a hard-coded delay --
          # same reasoning postgres-statefulset.yaml's own probes already
          # use for its (much slower) startup path.
          readinessProbe:
            exec:
              {{- if $acl }}
              command: ["redis-cli", "--user", "ds-admin", "ping"]
              {{- else }}
              command: ["redis-cli", "ping"]
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              {{- if $acl }}
              command: ["redis-cli", "--user", "ds-admin", "ping"]
              {{- else }}
              command: ["redis-cli", "ping"]
              {{- end }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

# Postgres grants for Distant Signal: the single source of truth (ingest
# architecture spec §6.2–6.6; docs/postgres-app-role.md, "Stage 0b").
#
# scripts/gen-db-grants.py renders this file into postgres-grants.sql, which
# the chart's role setup Job runs after postgres-roles.sql when
# `postgresql.roles.perService.enabled` is on. Edit this file, then run
#
#   uv run scripts/gen-db-grants.py render
#
# and commit both. CI (`gen-db-grants.py check`, in the rust-test job, on a
# freshly migrated database) fails when:
#   - a table, view, sequence or function in schema public is missing here,
#     or listed here but absent from the migrated schema;
#   - postgres-grants.sql is not what this file renders to;
#   - the roles' connection limits plus the other roles' (`other_roles`)
#     exceed max_connections minus superuser_reserved_connections;
#   - a grant names an unknown role or privilege.
#
# So a migration that adds a table must classify it here in the same
# change.
#
# Roles (spec §6.3). `status`:
#   planned   not created yet; its grants below are the design target.
#   observed  phase 0b: a LOGIN role that is a member of the shared app role
#             (distant_signal_app) and has no grants of its own. It
#             inherits app's privileges but may not SET ROLE to it (WITH
#             INHERIT TRUE, SET FALSE; Postgres 16+). Nothing changes
#             functionally; pg_stat_statements and pg_stat_activity now
#             attribute each service's queries to it.
#   narrow    no longer a member of the app role: exactly the grants below
#             (phases 2 to 5, each starting from the observe-role-usage.py
#             report).
# `connection_limit` is the spec §6.6 target. The chart passes the limit it
# computes from the service's real pool instead (values.yaml
# postgresql.roles.perService), and its render-time budget check sums those.
#
# Grants: S = SELECT, I = INSERT, U = UPDATE, D = DELETE. A role in the
# `read_shared` group also gets SELECT on every table whose class is
# shared-train, ingest, derived or reference (the group's own grant), so
# its S there is implied. `{privileges: S, columns: [a, b]}` limits a
# privilege to some columns; a list of such entries (or letters) gives a role
# different columns per privilege, e.g. `[I, {privileges: S, columns: [k]}]`.
# Sequences go to every narrow role with I on the owning table (USAGE,
# SELECT). Nobody but the owner gets TRUNCATE, REFERENCES, TRIGGER or
# CREATE, and foreign-key cascades need no grant.
#
# The grants of the four observed roles come from reading the code
# (2026-10-06: crates/{aggregator,enricher,notifier}/src, non-test SQL,
# including common::public_delay). They are confirmed or corrected by the
# 7-day observe-role-usage.py report before any role is narrowed. Audited
# again for release D (2026-10-23, DS-118; docs/ingest-phase5-runbook.md):
# the code read against these rows, and the suites run with the four roles
# narrowed (scripts/test-postgres-roles.py --narrow). It moved the api's
# backlog replay to the writer (train_event_outbox) and added the
# aggregator's UPDATE (id) on trains.

version: 1

budget:
  # The chart's postgresql.config.max_connections default (and prod's).
  max_connections: 200
  superuser_reserved_connections: 3

# Roles postgres-roles.sql manages (docs/postgres-app-role.md), counted in
# the budget only. The app role is retired in phase 5.
other_roles:
  owner: {name: distant_signal_owner, connection_limit: 2}
  exporter: {name: distant_signal_exporter, connection_limit: 3}
  dump: {name: distant_signal_dump, connection_limit: 2}
  backup: {name: distant_signal_backup, connection_limit: 4}

groups:
  read_shared:
    name: distant_signal_read_shared
    doc: SELECT on every shared-train, ingest, derived and reference table.
  schema_gate:
    name: distant_signal_schema_gate
    doc: SELECT on _sqlx_migrations, for the schema gate (spec §12.2). Every login role.

roles:
  api:
    name: distant_signal_api
    status: observed
    phase: 0b
    groups: [read_shared, schema_gate]
    connection_limit: 34
    used_by: the api pools (16 per replica, plus a RollingUpdate surge pod); the api-maintenance CronJob (1B)
  aggregator:
    name: distant_signal_aggregator
    status: observed
    phase: 0b
    groups: [read_shared, schema_gate]
    connection_limit: 9
    used_by: the aggregator (main pool and the archive pool)
  enricher:
    name: distant_signal_enricher
    status: observed
    phase: 0b
    groups: [schema_gate]
    connection_limit: 4
    used_by: the enricher
  notifier:
    name: distant_signal_notifier
    status: observed
    phase: 0b
    groups: [read_shared, schema_gate]
    connection_limit: 5
    used_by: the notifier
  writer:
    name: distant_signal_writer
    # Created from 1B.9 on, used once the chart's ingestWriter connects as
    # it (postgresql.roles.perService.writer.connect). Narrow since the
    # 2026-10-08 security review (M1): as an observed member of app it
    # could `SET ROLE` to app and shed line_status's RESTRICTIVE
    # ds_grants_writer policy. Its grants below are every table its
    # handlers, loops (schedule-match, reconciliation, backlog-match, CORPUS
    # crosswalk, train_event_outbox) and dedup run, minus the unused ones
    # (L3); read_shared covers the schedule products the sweeps read.
    status: narrow
    phase: 1B
    groups: [read_shared, schema_gate]
    connection_limit: 7
    used_by: ingest-writer
  schedule_reference:
    name: distant_signal_schedule_reference
    # Narrow from the start (plan 2a.6). schedule-reference connects as it
    # with perService.schedule_reference.connect (its only sink since
    # release B).
    status: narrow
    phase: 2a
    groups: [schema_gate]
    connection_limit: 4
    used_by: schedule-reference
  stations:
    name: distant_signal_stations
    # Plan 2b.3: narrow from creation (it never was a member of app): SIU on
    # stations and ingest_freshness, nothing else. Used with
    # postgresql.roles.perService.stations.connect. The CORPUS crosswalk
    # rebuild stays with the writer's loop (spec §9.3), so no crosswalk grants.
    status: narrow
    phase: 2b
    groups: [schema_gate]
    connection_limit: 2
    used_by: poller-stations
  incidents:
    name: distant_signal_incidents
    # Created narrow (never an app member): poller-incidents' DB sink
    # (plan 2c.3), used once postgresql.roles.perService.incidents.connect.
    # Its grants are the whole of ds_store::incidents' snapshot write:
    # apply_snapshot, infer_removals, last_incidents_fetch and the gazetteer.
    status: narrow
    phase: 2c
    groups: [schema_gate]
    connection_limit: 3
    used_by: poller-incidents
  schedule_ingest:
    name: distant_signal_schedule_ingest
    # Narrow from the start (plan 2d.2). The CORPUS load rewrites the derived crosswalk in its own
    # transaction (ds_store::corpus::crosswalk::write, restricted to the
    # current `stations`), hence its corpus_* crosswalk grants and SELECT
    # on stations, which spec §6.4's table leaves out.
    status: narrow
    phase: 2d
    groups: [schema_gate]
    connection_limit: 2
    used_by: schedule-ingest (CORPUS and feed markers)
  trust_backlog:
    name: distant_signal_trust_backlog
    # Plan 3b.2: narrow from creation (it never was a member of app). Used
    # with postgresql.roles.perService.trust_backlog.connect. Beyond spec §6.4:
    # SELECT on tiploc_crs and corpus_stanox_crs, which list_stanox_crs
    # reads with the api's CORPUS fallback on (CORPUS_FALLBACK_ENABLED).
    status: narrow
    phase: 3b
    groups: [schema_gate]
    connection_limit: 4
    used_by: trust-backlog-consumer
  trust_consumer:
    name: distant_signal_trust_consumer
    # Plan 3b.4: narrow from creation (it never was a member of app). Used
    # with postgresql.roles.perService.trust_consumer.connect. Its reads (tracked
    # trains, STANOX/CRS) use it too (phase 4). SELECT only on
    # train_subscriptions (decided 2026-10-08): the events that update a
    # subscription go into train_event_outbox, which the writer's loop
    # applies (ds_store::tracking::outbox).
    # SELECT only on trains too (decided 2026-10-08): creating and marking a
    # train's row is part of a resolution, which the outbox path applies.
    status: narrow
    phase: 3b
    groups: [schema_gate]
    connection_limit: 3
    used_by: trust-consumer (train events and forward signals, direct by decision D1; its reads from phase 4)
  full_coverage_ro:
    name: distant_signal_full_coverage_ro
    # Plan 4.3/4.7: narrow from creation (never a member of app). Used with
    # postgresql.roles.perService.full_coverage_ro.connect: SELECT on the
    # line populations and STANOX/CRS only. Beyond spec §6.4: SELECT on
    # tiploc_crs and corpus_stanox_crs, which list_stanox_crs reads with the
    # api's CORPUS fallback on (CORPUS_FALLBACK_ENABLED), as 3b's
    # trust_backlog does.
    status: narrow
    phase: "4"
    groups: [schema_gate]
    connection_limit: 3
    used_by: full-coverage-consumer (reads)
  ldbws_ro:
    name: distant_signal_ldbws_ro
    # Plan 4.5/4.7: narrow from creation (never a member of app). Used with
    # postgresql.roles.perService.ldbws_ro.connect: SELECT on its three views
    # only (pin counts, custom-line stations, tracked stops), never the
    # personal tables.
    status: narrow
    phase: "4"
    groups: [schema_gate]
    connection_limit: 2
    used_by: poller-ldbws (reads)

# Every table in schema public. Classes: personal, shared-train, ingest,
# derived, reference, internal, migrations.
tables:
  # --- personal: user data. Never in read_shared.
  users: {class: personal, grants: {api: SIUD}}
  sessions: {class: personal, grants: {api: SIUD}}
  oidc_login_state: {class: personal, grants: {api: SIUD}}
  pinned_lines: {class: personal, grants: {api: SIUD, notifier: S}}
  pinned_operators: {class: personal, grants: {api: SIUD}}
  pinned_stations: {class: personal, grants: {api: SIUD}}
  custom_lines: {class: personal, grants: {api: SIUD, aggregator: S}}
  custom_line_group_grants: {class: personal, grants: {api: SIUD}}
  groups: {class: personal, grants: {api: SIUD}}
  group_invite_links: {class: personal, grants: {api: SIUD}}
  group_journeys: {class: personal, grants: {api: SIUD}}
  group_members: {class: personal, grants: {api: SIUD}}
  group_trains: {class: personal, grants: {api: SIUD}}
  journeys: {class: personal, grants: {api: SIUD, notifier: SI}}
  # writer: ds_store::trains::fill_route_into_subscribers, run by the
  # schedule-match and reconciliation loops on the transaction that gives
  # a train its route, fills a bound train leg's NULL codes (DS-144).
  journey_legs: {class: personal, grants: {api: SIUD, notifier: SIU, writer: [{privileges: S, columns: [id, kind, train_subscription_id, origin_crs, destination_crs]}, {privileges: U, columns: [origin_crs, destination_crs]}]}}
  # notifier: SELECT ... FOR UPDATE needs UPDATE.
  journey_templates: {class: personal, grants: {api: SIUD, notifier: SU}}
  journey_template_legs: {class: personal, grants: {api: SIUD, notifier: S}}
  journey_template_skipped_dates: {class: personal, grants: {api: SIUD, notifier: S}}
  push_subscriptions: {class: personal, grants: {api: SIUD, notifier: SD}}
  tracked_train_tickets: {class: personal, grants: {api: SIUD}}
  unlisted_links: {class: personal, grants: {api: SIUD}}
  # Delegated access (docs/connected-apps.md). The notifier sends the
  # grant_created web push and records it in push_notified_at.
  delegated_grants: {class: personal, grants: {api: SIUD, notifier: [{privileges: S, columns: [id, user_id, client_display_name, scopes, created_at, revoked_at, push_notified_at]}, {privileges: U, columns: [push_notified_at]}]}}
  delegated_grant_confirmations: {class: personal, grants: {api: SIUD}}
  delegated_deletions: {class: personal, grants: {api: SIUD}}
  journey_idempotency_keys: {class: personal, grants: {api: SIUD}}
  # Journey follows (DS-146): written and read by the api only. No notifier
  # grant: followers get no pushes (see the migration, 20261024100000).
  journey_follows: {class: personal, grants: {api: SIUD}}
  # Mid-journey changes (docs/superpowers/specs/2026-10-22-mid-journey-changes-design.md
  # §4.1): plan snapshots and breaks, written by the api. The notifier reads
  # open breaks, stamps notified_at/notified_severity (its push bookkeeping)
  # and reads the opt-out switch (§6.3, §6.5).
  journey_revisions: {class: personal, grants: {api: SIUD}}
  journey_revision_legs: {class: personal, grants: {api: SIUD}}
  journey_breaks: {class: personal, grants: {api: SIUD, notifier: [S, {privileges: U, columns: [notified_at, notified_severity]}]}}
  notification_preferences: {class: personal, grants: {api: SIUD, notifier: S}}
  # Bookkeeping of the tracked-trains-as-journeys migration (DS-124), for
  # its rollback script; only the owner reads it, and phase 3 drops both.
  standalone_track_conversions: {class: personal, grants: {}}
  group_train_share_moves: {class: personal, grants: {}}

  # --- shared-train: trains and their movements, shared by users.
  # aggregator: its archive's SELECT ... FOR UPDATE OF t
  # (aggregator/src/archive.rs delete_batch) needs UPDATE on at least one
  # column; DELETE does not do (checked against Postgres 16 for DS-118:
  # every row lock needs UPDATE). So UPDATE on `id` only, which it never
  # sets: no wider than the DELETE it already holds.
  # trust_consumer: no grant on trains (security review L3, 2026-10-08):
  # it reads tracked trains through the ingest_active_tracked_trains view.
  trains: {class: shared-train, grants: {api: SIUD, writer: SIU, trust_backlog: SIU, aggregator: [S, D, {privileges: U, columns: [id]}], notifier: SIU}}
  # Each user's subscriptions (user_id, pins): class personal, so not in
  # read_shared; every other role gets exactly the columns its code reads
  # and writes (security review M2, 2026-10-08):
  #   writer: the outbox applier, schedule-match, reconciliation and
  #     backlog-match (ds_store::tracking, sweeps, backlog::matching): reads
  #     the pins and status, sets status/unresolved_from/trains_id, and
  #     fills NULL pins from a train's route as it arrives
  #     (ds_store::trains::fill_route_into_subscribers, DS-144);
  #   trust_backlog: reinstatement reopens (tracking.rs
  #     reopen_subscriptions_after_reinstatement);
  #   trust_consumer: `SELECT trains_id ... WHERE id` (upsert_train_event_on);
  #   aggregator: `EXISTS ... WHERE trains_id` (prune, archive);
  #   notifier: candidates and legs (id, user_id, trains_id,
  #     notifications_enabled, the pins: a leg's route falls back to them,
  #     DS-144), create_subscription_for_train's insert and re-enable, and
  #     the NULL-pin fill on its CIF enrichment (fill_route_into_subscribers).
  train_subscriptions: {class: personal, grants: {api: SIUD, writer: [{privileges: S, columns: [id, trains_id, service_date, resolution_status, unresolved_from, pin_origin_crs, pin_scheduled_departure, pin_destination_crs, pin_skipped_stations, pin_platform, pin_planned_platform]}, {privileges: U, columns: [resolution_status, unresolved_from, trains_id, pin_origin_crs, pin_scheduled_departure, pin_destination_crs]}], trust_backlog: [{privileges: S, columns: [id, trains_id, resolution_status, unresolved_from]}, {privileges: U, columns: [resolution_status, unresolved_from]}], trust_consumer: {privileges: S, columns: [id, trains_id]}, aggregator: {privileges: S, columns: [trains_id]}, notifier: [{privileges: S, columns: [id, user_id, trains_id, notifications_enabled, pin_origin_crs, pin_scheduled_departure, pin_destination_crs]}, {privileges: I, columns: [user_id, trains_id, service_date, pin_origin_crs, pin_scheduled_departure, pin_destination_crs]}, {privileges: U, columns: [notifications_enabled, pin_origin_crs, pin_scheduled_departure, pin_destination_crs]}]}}
  # No UPDATE for anyone (security review L3): every writer inserts with
  # ON CONFLICT (trains_id, dedup_key) DO NOTHING. The conflict target
  # needs SELECT on its columns, so trust_consumer (outside read_shared)
  # gets just those.
  train_movement_events: {class: shared-train, grants: {api: S, writer: SI, trust_backlog: SI, trust_consumer: [I, {privileges: S, columns: [trains_id, dedup_key]}], aggregator: S, notifier: S}}
  # api: S only. Its track routes' backlog replays go through
  # train_event_outbox, and a schedule match no longer completes the train
  # itself (the writer's sweeps do; DS-118).
  train_current_state: {class: shared-train, grants: {api: S, writer: SIU, trust_backlog: SIU, trust_consumer: SIU, aggregator: S, notifier: S}}
  # writer: S only (security review L3): backlog-match reads, never updates.
  trust_event_backlog: {class: shared-train, grants: {api: S, writer: S, trust_backlog: SI, aggregator: SD}}
  train_reasons: {class: shared-train, grants: {api: S, trust_backlog: SIU}}
  # trust_consumer: SELECT only on the ON CONFLICT (dedup_key) target
  # (security review L3); the writer has it through read_shared.
  notifier_forward_queue: {class: shared-train, grants: {api: S, writer: SI, trust_consumer: [I, {privileges: S, columns: [dedup_key]}], notifier: S}}
  # Plan 3b.3: trust-consumer's deferred subscription-changing events; the
  # writer's train_event_outbox loop applies (SELECT ... FOR UPDATE) and
  # deletes them, or marks one rejected, then completes a train whose last
  # event is the arrival at its known destination.
  # api: INSERT on the three columns it sets (DS-118): its track routes'
  # backlog replays (ds_store::backlog::matching, ReplayWrite::Outbox) are
  # queued here for the writer to apply, since the api may only read
  # train_movement_events and train_current_state. Its SELECT covers the
  # ON CONFLICT (tracked_train_id, dedup_key) target.
  train_event_outbox: {class: internal, grants: {api: [S, {privileges: I, columns: [tracked_train_id, dedup_key, event]}], trust_consumer: SI, writer: SUD}}

  # --- internal: one component's own state.
  notifier_cursor: {class: internal, grants: {notifier: SIU, api: S}}
  train_notification_state: {class: internal, grants: {notifier: SIU, api: S}}
  line_notification_state: {class: internal, grants: {notifier: SIU, api: S}}
  journey_leg_notification_state: {class: internal, grants: {notifier: SIU, api: S}}
  # The ingest-writer's stream idempotency keys (plan 3a.3, spec §7.4):
  # inserted with each applied entry, pruned hourly after 48 h.
  ingest_dedup: {class: internal, grants: {writer: SID}}
  # The enricher's in-flight Claude Message Batches (LLM_SWEEP_MODE=batch,
  # docs/enricher-anthropic.md): inserted at submission, deleted once the
  # results are written (crates/enricher/src/batch.rs). No UPDATE.
  enricher_llm_batches: {class: internal, grants: {enricher: SID}}
  # The api's shared TfL arrivals cache (DS-136, UNLOGGED): one row per
  # stop, upserted by whichever replica refreshes it, pruned by the api
  # after a day untouched (crates/api/src/data/tfl_arrivals.rs).
  tfl_arrivals_cache: {class: internal, grants: {api: SIUD}}
  # The publish staging keys (UNLOGGED). Only schedule-reference's publish
  # uses them, as schedule_reference; the app role lost them in release B
  # (app_revokes below), with the api's /private publish routes.
  schedule_calling_points_full_publish_keys: {class: internal, grants: {schedule_reference: SID}}
  schedule_destination_departures_publish_keys: {class: internal, grants: {schedule_reference: SID}}

  # --- ingest: snapshots and feeds the producers write.
  station_samples: {class: ingest, grants: {api: S, writer: SIU, aggregator: SD, notifier: S}}
  # Targeted boards for tracked trains' own stops (poller-ldbws's second
  # lane, schema tracked-stop-boards/1); the aggregator prunes old rows.
  tracked_stop_boards: {class: ingest, grants: {api: S, writer: SIU, aggregator: SD}}
  station_full_coverage_samples: {class: ingest, grants: {api: S, writer: SIU}}
  full_coverage_line_stats: {class: ingest, grants: {api: S, writer: SIU, aggregator: SD}}
  full_coverage_line_window_stats: {class: ingest, grants: {api: S, writer: SIU, aggregator: SD}}
  island_of_ireland_lines: {class: ingest, grants: {api: S, writer: SIU}}
  island_of_ireland_stations: {class: ingest, grants: {api: S, writer: SIU}}
  island_of_ireland_station_samples: {class: ingest, grants: {api: S, writer: SIU}}
  # Transit networks (docs/superpowers/specs/2026-10-09-transit-networks-design.md
  # §8; migration 20261014100000): the writer applies the
  # ds:ingest:transit-<network> streams (ds_store::transit). The versioned
  # timetable tables are inserted per feed version and never updated; the
  # prune deletes old transit_feed_versions rows, and every versioned
  # table cascades from them (a cascade needs no grant), so the writer gets
  # no DELETE there. The api reads (batch 3); read_shared gives the
  # aggregator and notifier SELECT too, which no code uses.
  transit_networks: {class: ingest, grants: {api: S, writer: SIU}}
  transit_feed_versions: {class: ingest, grants: {api: S, writer: SIUD}}
  transit_feed_parts: {class: ingest, grants: {api: S, writer: SI}}
  transit_lines: {class: ingest, grants: {api: S, writer: SI}}
  transit_stops: {class: ingest, grants: {api: S, writer: SI}}
  transit_patterns: {class: ingest, grants: {api: S, writer: SI}}
  transit_pattern_stops: {class: ingest, grants: {api: S, writer: SI}}
  transit_trips: {class: ingest, grants: {api: S, writer: SI}}
  transit_service_days: {class: ingest, grants: {api: S, writer: SI}}
  # Upserted from each situations snapshot; absent situations deleted.
  transit_situations: {class: ingest, grants: {api: S, writer: SIUD}}
  # Replaced whole at each timetable activation.
  transit_rail_links: {class: ingest, grants: {api: S, writer: SIUD}}
  # writer: D too (spec §6.4 says SIU): the TfL upsert deletes the TfL lines
  # that left the feed. Its rows are pinned to source = 'tfl' by
  # row_policies below (plan 3c.3, D10).
  line_status: {class: ingest, grants: {api: S, writer: SIUD, aggregator: SIUD}}
  line_status_history: {class: ingest, grants: {api: S, writer: SI, aggregator: SID, notifier: S}}
  # enricher: SELECT on the table, UPDATE only on its extraction columns
  # (Q3 of docs/ingest-phase5-runbook.md): the columns its two UPDATEs set
  # (crates/enricher/src/queries.rs write_extraction and
  # carry_forward_extraction). The target; no effect while the enricher is
  # observed (a member of app, so it still holds table-wide UPDATE) until
  # 5.5 narrows it. Confirm the list against the 0b report first.
  incidents: {class: ingest, grants: {api: S, incidents: SIU, aggregator: S, enricher: [S, {privileges: U, columns: [source_text_hash, extracted_category, extracted_periods, extraction_model_version, extracted_at]}]}}
  incident_history: {class: ingest, grants: {api: S, incidents: SI, enricher: S}}
  incident_feed_state: {class: ingest, grants: {api: S, incidents: SIU}}
  ingest_freshness: {class: ingest, grants: {api: S, writer: SIU, stations: SIU, incidents: SIU}}

  # --- derived: computed from other tables.
  line_status_daily_stats: {class: derived, grants: {api: S, aggregator: SIUD}}
  line_status_half_hourly_stats: {class: derived, grants: {api: S, aggregator: SIUD}}
  line_status_daily_coverage_stats: {class: derived, grants: {api: S, aggregator: SIUD}}
  line_status_half_hourly_coverage_stats: {class: derived, grants: {api: S, aggregator: SIUD}}
  full_coverage_window_verdicts: {class: derived, grants: {api: S, aggregator: SIUD}}
  # No DELETE (security review L3): the rebuild upserts its singleton row.
  corpus_crosswalk_build: {class: derived, grants: {api: S, writer: SIU, schedule_ingest: SIU}}
  # writer, schedule_ingest: no UPDATE (security review L3): the rebuild
  # deletes every row and inserts afresh (ds_store::corpus::crosswalk::write).
  corpus_stanox_crs: {class: derived, grants: {api: S, writer: SID, schedule_ingest: SID, trust_backlog: S, full_coverage_ro: S, trust_consumer: S}}
  # notifier: named in common::public_delay's SQL (corpus fallback off), so
  # Postgres checks SELECT even when the branch is unused.
  # schedule_reference: the line population's train summaries read it
  # (crs_for_tiplocs_batch) when the CORPUS fallback is on, as the api's
  # route does; not in spec §6.4's table, which predates the summaries.
  corpus_tiploc_crs: {class: derived, grants: {api: S, writer: SID, notifier: S, schedule_ingest: SID, schedule_reference: S}}

  # --- reference: stations, codes and schedule products.
  stations: {class: reference, grants: {api: S, writer: S, stations: SIU, incidents: S, aggregator: S, schedule_ingest: S}}
  tocs: {class: reference, grants: {api: S, writer: SIU}}
  # TfL's Tube, DLR and tram stops (docs/superpowers/specs/2026-10-20-tfl-stop-lookup-design.md;
  # migration 20261020160000): the writer's tfl-stops/1 handler replaces
  # both from each daily snapshot (ds_store::tfl_stops::replace: upsert,
  # delete the stops that left, rebuild the links); the api reads them. The
  # link rows cascade from tfl_stops (no grant needed) and are never
  # updated.
  tfl_stops: {class: reference, grants: {api: S, writer: SIUD}}
  tfl_stop_crs: {class: reference, grants: {api: S, writer: SID}}
  # TfL's route sequences (DS-151; migration 20261026100000): the writer's
  # tfl-line-routes/1 handler deletes every row and inserts the snapshot
  # (ds_store::tfl_line_routes::replace, no UPDATE); the api's Tube access
  # legs read them.
  tfl_line_routes: {class: reference, grants: {api: S, writer: SID}}
  stanox_crs: {class: reference, grants: {api: S, writer: S, schedule_reference: SIUD, trust_backlog: S, trust_consumer: S, full_coverage_ro: S, notifier: S}}
  tiploc_crs: {class: reference, grants: {api: S, writer: S, schedule_reference: SIUD, notifier: S, trust_backlog: S, full_coverage_ro: S, trust_consumer: S}}
  fixed_links: {class: reference, grants: {api: S, writer: S, schedule_reference: SIUD}}
  # schedule_ingest: no UPDATE (security review L3): the load deletes every
  # row and inserts afresh (ds_store::corpus).
  corpus_locations: {class: reference, grants: {api: S, writer: S, schedule_ingest: SID}}
  # schedule_ingest: no DELETE (security review L3): the marker is an
  # ON CONFLICT (delivered_at) DO UPDATE upsert.
  corpus_deliveries: {class: reference, grants: {api: S, writer: S, schedule_ingest: SIU}}
  schedule_calling_points_full: {class: reference, grants: {api: S, schedule_reference: SIUD, aggregator: SD, notifier: S}}
  # Each train's previous working (pre-departure prediction, DS-127),
  # replaced per date by schedule-reference; the notifier predicts late starts.
  schedule_turnarounds: {class: reference, grants: {api: S, schedule_reference: SIUD, aggregator: SD, notifier: S}}
  schedule_destination_departures: {class: reference, grants: {api: S, schedule_reference: SIUD, aggregator: SD, notifier: S}}
  schedule_network_departures: {class: reference, grants: {api: S, schedule_reference: SIUD, aggregator: SD}}
  schedule_line_population: {class: reference, grants: {api: S, schedule_reference: SIUD, aggregator: SD, full_coverage_ro: S}}
  # Each line population's slim per-train summary (2026-10-08), written in
  # the same transaction as schedule_line_population by schedule-reference,
  # read by the api's line pages; the aggregator
  # prunes old dates. The one-off backfill is `ds-migrate
  # backfill-line-train-summaries`, as the schema owner (phase 5 prep, Q2;
  # the api image's own binary went in step 5.4b).
  line_train_summaries: {class: reference, grants: {api: S, schedule_reference: SIUD, aggregator: SD}}
  # Each schedule's vehicle (train, bus, ferry) per service date, published
  # by schedule-reference; the aggregator prunes old dates; the notifier skips live alerts for
  # a bus or ferry.
  schedule_services: {class: reference, grants: {api: S, schedule_reference: SIUD, aggregator: SD, notifier: S}}
  # Every TIPLOC's display name, location type and parent station, published
  # by schedule-reference (as schedule_services); read by the api only.
  tiploc_locations: {class: reference, grants: {api: S, schedule_reference: SIUD}}
  # schedule_reference: U too (spec §6.4 says SI): the marker's insert is
  # ON CONFLICT (delivery) DO UPDATE SET completed_at, which Postgres checks
  # UPDATE for even when nothing conflicts.
  schedule_reference_publishes: {class: reference, grants: {api: S, schedule_reference: SIU}}
  # schedule_ingest: SELECT only on its ON CONFLICT (delivered_at) target
  # (security review L3), which Postgres checks even for DO NOTHING.
  schedule_feed_ingests: {class: reference, grants: {api: S, schedule_ingest: [I, {privileges: S, columns: [delivered_at]}]}}

  # --- migrations: the owner's; everyone reads it through schema_gate.
  _sqlx_migrations: {class: migrations, grants: {}}

# Views. Phase 4's internal-read views (plan 4.1, spec §11.2; migration
# 20261009144000_ingest_read_views.sql) read personal tables but expose no
# user id or owner, so each reader role gets SELECT on its view only. Plain
# views run with the owner's privileges: the view grant is the whole grant.
views:
  ingest_active_tracked_trains: {class: internal, grants: {trust_consumer: S}}
  ingest_sample_station_pins: {class: internal, grants: {ldbws_ro: S}}
  ingest_custom_line_stations: {class: internal, grants: {ldbws_ro: S}}
  ingest_tracked_stop_targets: {class: internal, grants: {ldbws_ro: S}}

# Every sequence, with the table that owns it.
sequences:
  corpus_locations_id_seq: {table: corpus_locations}
  delegated_deletions_id_seq: {table: delegated_deletions}
  delegated_grants_id_seq: {table: delegated_grants}
  fixed_links_id_seq: {table: fixed_links}
  incident_history_id_seq: {table: incident_history}
  journey_breaks_id_seq: {table: journey_breaks}
  journey_legs_id_seq: {table: journey_legs}
  journey_revisions_id_seq: {table: journey_revisions}
  journey_template_legs_id_seq: {table: journey_template_legs}
  journey_templates_id_seq: {table: journey_templates}
  journeys_id_seq: {table: journeys}
  line_status_history_id_seq: {table: line_status_history}
  notifier_forward_queue_id_seq: {table: notifier_forward_queue}
  push_subscriptions_id_seq: {table: push_subscriptions}
  tracked_train_tickets_id_seq: {table: tracked_train_tickets}
  # Still named after the table's old name (tracked_trains).
  tracked_trains_id_seq: {table: train_subscriptions}
  train_current_state_id_seq: {table: train_current_state}
  train_movement_events_id_seq: {table: train_movement_events}
  trains_id_seq: {table: trains}
  trust_event_backlog_id_seq: {table: trust_event_backlog}
  train_event_outbox_id_seq: {table: train_event_outbox}

# Functions in schema public (extension members excluded), by signature.
functions:
  "analyze_publish_keys(text)": {grants: [schedule_reference]}

# What the app role (distant_signal_app, and so every observed role, which
# inherits from it) loses: every privilege on `tables`, EXECUTE on
# `functions`. postgres-roles.sql grants app DML on every table and EXECUTE
# on every routine on each run; postgres-grants.sql, run right after it,
# revokes these again. Each must be listed above, and no observed role may
# be granted it. Release B (ingest phase 5, 2026-10-12): app held these only
# for the api's /private schedule publish routes (/schedule-calling-points-full,
# /schedule-destination-departures), which are gone; schedule-reference
# publishes as schedule_reference, with its own grants above. The wider
# narrowing of app's members is step 5.5 (docs/ingest-phase5-runbook.md).
app_revokes:
  tables: [schedule_calling_points_full_publish_keys, schedule_destination_departures_publish_keys]
  functions: ["analyze_publish_keys(text)"]

# Row-level restrictions (spec §6.4, decision D10): table -> {role: SQL
# condition}. Each becomes a RESTRICTIVE policy `ds_grants_<role>` on the
# table for that role (if created), FOR ALL commands, with the condition as
# both USING and WITH CHECK: the role sees and writes only those rows,
# whatever else it is granted. A policy binds the role a session runs as,
# so a role that could `SET ROLE` to another (the app role, a group) would
# shed it: every membership the generated SQL grants is SET FALSE, and a
# role with a row policy should be narrow (as the writer is since the
# 2026-10-08 security review, M1). Its connection must also be that role:
# the chart refuses ingestWriter.streams.tfl: apply unless the writer
# connects as distant_signal_writer (M4). The table's migration enables RLS
# and adds the permissive USING (true) policy every role shares; policies
# named ds_grants_* that are no longer listed here are dropped on the next
# run.
#
# `{writes: <condition>}` instead of a bare condition restricts only the
# role's writes: RESTRICTIVE policies ds_grants_<role>_insert (WITH CHECK),
# _update (USING and WITH CHECK) and _delete (USING); its reads are
# unchanged.
row_policies:
  # The ingest-writer applies the `tfl` stream (plan 3c.3) and each transit
  # network's (`source = 'transit'`, ids `<network>:<line>`; transit spec
  # §10.4: one source for every network, pinned per stream in the handler,
  # since RLS cannot tell networks apart); the aggregator owns every other
  # line.
  line_status: {writer: "source IN ('tfl', 'transit')"}
  # Each producer writes only its own freshness rows (security review L4,
  # 2026-10-08), so a compromised one cannot push another feed's
  # fetched_at into the future (the upsert keeps GREATEST) and hide that
  # feed's staleness. Writes only: the writer's freshness gauge
  # (ingest_writer::telemetry) reads every row. Migration
  # 20261009170000_ingest_freshness_rls.sql enables RLS. These are the
  # only created roles with write grants on the table; the api and the
  # aggregator (members of app) are unrestricted.
  #   writer: ds_store::freshness::record_ingest from its handlers: tfl,
  #     tocs, the four snapshot sources (ds_store::samples::sources) and the
  #     island-of-Ireland catalogue's per-network sources
  #     (ds_store::samples::island_of_ireland), and each transit network's
  #     timetable and situations (common::transit, transit spec §8.5;
  #     metrolink and net, off by default; net has no situations source
  #     yet, NET design §8), and the TfL stops snapshot
  #     (tfl-stops, ds_store::tfl_stops) and route sequences
  #     (tfl-line-routes, ds_store::tfl_line_routes), and the tracked-stop
  #     boards snapshot (tracked-stop-boards, ds_store::samples::sources;
  #     DS-127, off by default behind pollers.ldbws.trackedStops). The
  #     ingest-writer's freshness_rls test checks every source it records
  #     against this list. The two unsuffixed
  #     island_of_ireland_* names writers recorded before the per-network
  #     split were dropped a release after it (batch 54; migration
  #     20261010100100 deletes their rows).
  ingest_freshness:
    writer:
      writes: >-
        source IN ('tfl', 'tocs', 'station-samples', 'full-coverage-stats',
        'full-coverage-window-stats', 'station-full-coverage-samples',
        'island_of_ireland_stations_gtfs', 'island_of_ireland_lines_gtfs',
        'island_of_ireland_stations_nir', 'island_of_ireland_lines_nir',
        'transit-metrolink-timetable', 'transit-metrolink-situations',
        'tfl-stops', 'tfl-line-routes', 'tracked-stop-boards',
        'transit-net-timetable', 'transit-net-situations')
    stations: {writes: "source = 'stations'"}
    incidents: {writes: "source = 'incidents'"}

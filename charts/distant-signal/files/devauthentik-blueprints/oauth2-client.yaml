# Fixed, deterministic OIDC client provisioning for this app's local dev
# IdP -- see docs/superpowers/specs/2026-08-29-dev-oidc-server-design.md's
# "Blueprints: declarative first-boot configuration" research section.
#
# client_id/client_secret below are dev-only, known-in-advance, committed
# values -- NOT real secrets. They must match crates/api's own SSO_CLIENT_ID
# / SSO_CLIENT_SECRET env vars exactly (see dev.env.example's OIDC section
# and docker-compose.authentik.yml's header comment) and, once the Helm
# path exists, the identical fixed values api-deployment.yaml computes when
# devAuthentik.enabled and api.sso.clientId/clientSecret are left empty
# (charts/distant-signal/templates/_helpers.tpl's
# distant-signal.devAuthentikClientId/
# distant-signal.devAuthentikClientSecret).
#
# `signing_key`/`authorization_flow`/`invalidation_flow` !Find lookups
# depend on Authentik's OWN default blueprints (its self-signed cert, its
# shipped default-provider-authorization-implicit-consent and
# default-provider-invalidation-flow flows) having already applied -- on a
# stone-cold first `docker compose up` this is plausibly a race, not a
# guarantee (design doc Open Questions). If this blueprint doesn't apply on
# the very first boot, restart authentik-worker (or wait for the next
# 60-minute re-apply cycle) -- this is a documented escape hatch, not
# evidence the blueprint is wrong.
#
# invalidation_flow is REQUIRED by OAuth2Provider's own serializer (not
# optional the way it might look from authorization_flow's similar shape)
# -- confirmed live: omitting it made the whole provider entry fail with
# "Serializer errors {'invalidation_flow': [ErrorDetail(string='This field
# is required.', code='required')]}", which in turn made the
# authentik_core.application entry below fail too (its own !Find for this
# provider has nothing to find), so the Application silently never existed
# at all. default-provider-invalidation-flow is Authentik's own shipped
# slug for this (blueprints/default/flow-default-provider-invalidation.yaml
# in goauthentik/authentik), not invented.
version: 1
metadata:
  name: Distant Signal (dev) - OAuth2 client and application
entries:
  - model: authentik_providers_oauth2.scopemapping
    identifiers:
      name: distant-signal-dev-groups
    attrs:
      scope_name: groups
      description: >-
        DS's own MCP access-group claim -- Authentik-native ak_groups
        membership, not a Discord- or DS-owned group system. See
        docs/superpowers/specs/2026-09-02-mcp-server-oauth-access-groups-design.md
        Decision 2. This dev instance has no built-in `groups` scope
        mapping (unlike openid/email/profile, which ship as Authentik
        defaults) -- this entry defines one.
      expression: |
        return {"groups": [group.name for group in request.user.ak_groups.all()]}
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: distant-signal-dev
    attrs:
      client_type: confidential
      client_id: distant-signal-dev
      client_secret: distant-signal-dev-local-only-not-a-real-secret
      # Driven by the same SSO_REDIRECT_URL env var crates/api itself reads
      # (see routes/auth.rs's login handler), not a second, independently
      # hardcoded copy of it -- the two used to drift on purpose (this file
      # said "fixed", dev.env.example said "already matches, no change
      # needed") until a real remote-access setup (an app reached over a
      # Tailscale hostname rather than plain localhost) proved that
      # assumption wrong: SSO_REDIRECT_URL got updated to the real
      # browser-facing callback URL, Authentik kept rejecting it because
      # this list still only had the literal `localhost` string, and
      # "matching_mode: strict" means no partial/wildcard match saves you.
      # docker-compose.authentik.yml's `&authentik-env` anchor and the
      # Helm chart's devauthentik deployments both now pass SSO_REDIRECT_URL
      # through so this stays in sync automatically. authentik-worker
      # applies blueprints, so it's the one that actually needs this var at
      # runtime -- authentik-server gets it too for consistency, since it's
      # cheap and keeps both containers' env blocks identical.
      redirect_uris:
        - url: !Env [SSO_REDIRECT_URL, "http://localhost:3000/api/auth/callback"]
          matching_mode: strict
      # OAuth2Provider.grant_types (authentik/providers/oauth2/models.py)
      # defaults to an EMPTY list, not "all" -- confirmed against the real
      # model source, not assumed. Omitting it here (as this entry
      # originally did) doesn't mean "allow the usual ones"; it means "allow
      # none at all", which is why every real authorize attempt failed with
      # "Invalid grant_type for provider" / "The request is otherwise
      # malformed" regardless of how correct redirect_uris/client_id were.
      # This app only ever does Authorization Code + PKCE (see
      # crates/api/src/auth/oidc.rs), so that's the only grant type enabled
      # -- not the full GrantType enum (which also has IMPLICIT, HYBRID,
      # REFRESH_TOKEN, CLIENT_CREDENTIALS, PASSWORD, DEVICE_CODE,
      # TOKEN_EXCHANGE), none of which this app's flow uses or should accept.
      grant_types:
        - authorization_code
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        # Defined earlier in THIS file (not an Authentik default, unlike
        # the three above) -- see the new authentik_providers_oauth2.
        # scopemapping entry's own comment.
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]
  - model: authentik_core.application
    identifiers:
      slug: distant-signal
    attrs:
      name: Distant Signal (dev)
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, distant-signal-dev]]

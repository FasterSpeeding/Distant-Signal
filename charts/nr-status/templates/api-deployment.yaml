{{/*
Fail-fast on an unusable SSO config, same pattern as
enricher-deployment.yaml's empty-baseUrl/model guard.

crates/api/src/data/config.rs declares all five SSO_* fields with
`#[arg(long, env)]` and NO default, so an api container missing any of them
never gets as far as `main` -- clap exits with "the following required
arguments were not provided" and the pod CrashLoopBackOffs. An empty-string
value is worse still: it satisfies clap, then fails either the
`ensure!(!config.sso_client_secret.is_empty())` in AppState::init or
`IssuerUrl::new("")` immediately after, with the same outcome and a less
obvious cause. Refusing to render is strictly better than either.
*/}}
{{- if not .Values.api.sso.issuerUrl }}
{{- fail "api.sso.issuerUrl is empty. Set it to your OIDC provider's issuer base URL (e.g. --set api.sso.issuerUrl=https://sso.example.com/realms/rail). The api requires SSO_ISSUER_URL and will not start without it." }}
{{- end }}
{{- if not .Values.api.sso.clientId }}
{{- fail "api.sso.clientId is empty. Set it to the OIDC client id this deployment is registered as (e.g. --set api.sso.clientId=nr-status). The api requires SSO_CLIENT_ID and will not start without it." }}
{{- end }}
{{- if and (not .Values.api.sso.clientSecret) (not .Values.api.sso.existingSecret) }}
{{- fail "api.sso.clientSecret is empty and no api.sso.existingSecret was given. Set one of them (e.g. --set api.sso.clientSecret=... , or api.sso.existingSecret pointing at a Secret holding it). The api refuses to start on an empty client secret." }}
{{- end }}
{{- if not .Values.api.sso.redirectUrl }}
{{- fail "api.sso.redirectUrl is empty. Set it to the FRONTEND origin's callback URL registered with your SSO server (e.g. --set api.sso.redirectUrl=https://status.example.com/api/auth/callback) -- not the api's own origin, or the session cookie is scoped to the wrong host. The api requires SSO_REDIRECT_URL and will not start without it." }}
{{- end }}
{{- if not .Values.api.sso.postLoginRedirectUrl }}
{{- fail "api.sso.postLoginRedirectUrl is empty. Set it to the frontend's root URL (e.g. --set api.sso.postLoginRedirectUrl=https://status.example.com/). The api requires SSO_POST_LOGIN_REDIRECT_URL and will not start without it." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nr-status.apiFullname" . }}
  labels:
    {{- include "nr-status.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "nr-status.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nr-status.labels" (dict "root" . "component" "api") | nindent 8 }}
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "nr-status.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "nr-status.podSecurityContext" (dict "override" .Values.api.podSecurityContext) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "nr-status.image" (dict "root" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- include "nr-status.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            - name: BIND_URL
              value: {{ printf "0.0.0.0:%d" (int .Values.api.service.port) | quote }}
            # PGPASSWORD must stay immediately before DATABASE_URL -- the
            # kubelet only expands $(VAR) from EARLIER entries in this list.
            {{- include "nr-status.databaseEnv" . | nindent 12 }}
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nr-status.internalTokenSecretName" . }}
                  key: {{ include "nr-status.internalTokenSecretKey" . }}
            - name: REDIS_URL
              value: {{ include "nr-status.redisUrl" . | quote }}
            - name: RUST_LOG
              value: {{ .Values.api.logLevel | quote }}
            # OIDC SSO (crates/api/src/data/config.rs: ServiceArguments).
            # All five are required with no defaults -- see the guards at
            # the top of this file. The client secret is the only one that
            # is a credential, so it alone goes through a secretKeyRef,
            # exactly like INTERNAL_TOKEN above; the other four are plain
            # URLs/identifiers that are public by construction (the browser
            # sees the issuer and redirect URLs on every sign-in anyway).
            - name: SSO_ISSUER_URL
              value: {{ .Values.api.sso.issuerUrl | quote }}
            - name: SSO_CLIENT_ID
              value: {{ .Values.api.sso.clientId | quote }}
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nr-status.ssoClientSecretName" . }}
                  key: {{ include "nr-status.ssoClientSecretKey" . }}
            - name: SSO_REDIRECT_URL
              value: {{ .Values.api.sso.redirectUrl | quote }}
            - name: SSO_POST_LOGIN_REDIRECT_URL
              value: {{ .Values.api.sso.postLoginRedirectUrl | quote }}
            - name: SESSION_TTL_DAYS
              value: {{ .Values.api.sessionTtlDays | quote }}
            # LINES_DIR is deliberately NOT set: crates/api/src/data/config.rs
            # already defaults it to /app/lines, which is exactly where
            # docker/api.Dockerfile bakes the line catalogue.
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.startup.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.path }}
              port: http
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

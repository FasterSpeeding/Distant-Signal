# Render-test values for CI (helm lint/template and
# scripts/check-ingest-bucket-chart.py). Every identifier is an obvious
# placeholder: nothing here names a real project, bucket or service account
# (decision D7). The concrete values live in Ranma-Config.
enabled: true
gcp:
  projectId: example-project
bucket:
  name: example-ds-ingest
publisher:
  members:
    - serviceAccount:publisher@example-publisher.iam.gserviceaccount.com
    - serviceAccount:scanner@example-publisher.iam.gserviceaccount.com
reader:
  member: serviceAccount:reader@example-project.iam.gserviceaccount.com
auditLogs:
  sinkWriterIdentity: serviceAccount:audit-sink@example-project.iam.gserviceaccount.com

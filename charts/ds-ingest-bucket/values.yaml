# Values for ds-ingest-bucket: the Google Cloud Storage landing zone for the
# schedule feed's bucket source, which runs alongside (or instead of) the
# schedulefeed SFTP receiver. Every resource is a Crossplane v2 namespaced
# managed resource from crossplane-contrib/provider-upjet-gcp
# (provider-gcp-storage and provider-gcp-cloudplatform; provider-gcp-monitoring
# with usageAlerts.enabled; provider-gcp-pubsub with notifications.pubsub.enabled). See README.md and
# docs/superpowers/specs/2026-10-02-schedule-feed-gcs-landing-design.md.
#
# The bucket is dedicated to timetable/CORPUS ingest (decision D9): nothing
# else ever goes in it.
#
# This file holds only generic defaults (decision D7, repo scope). Every
# project id, project number, bucket name and service-account email is set
# by Ranma-Config's HelmRelease; ci/example-values.yaml uses obvious
# placeholders. Nothing here is a secret: the chart never renders a key.

# -- Render anything at all. Off by default: the chart is not deployed
# anywhere until the adoption plan's step 3.
enabled: false

gcp:
  # -- The dedicated GCP project that owns every resource (D2). Required
  # when enabled.
  projectId: ""
  # -- The project's number. Only needed with notifications.pubsub.enabled,
  # to name the Cloud Storage service agent that publishes to the topic.
  projectNumber: ""
  # -- Bucket location. EUROPE-WEST2 (London): the publisher already runs
  # there, so its writes stay in-region, and it is the closest region to
  # the node.
  location: EUROPE-WEST2

crossplane:
  # -- The provider config every managed resource uses. Ranma-Config
  # creates it, with the controller's sealed service-account key.
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  # -- Buckets only. `Orphan` (the default) leaves both buckets in GCP when
  # their managed resource is deleted (helm uninstall, a namespace delete):
  # their management policies omit `Delete`. `Delete` lets Crossplane
  # delete them (only if empty). The buckets also carry
  # `helm.sh/resource-policy: keep`. IAM bindings, alerts and Pub/Sub
  # resources are always fully managed, so removing a member from the
  # values really revokes its access.
  deletionPolicy: Orphan

# -- Kubernetes labels added to every rendered resource.
commonLabels: {}

# -- GCP labels added to the buckets, topic and subscription, on top of
# `managed-by: ds-ingest-bucket` and `purpose: schedule-feed-ingest`. Keys
# and values: lowercase letters, digits, `_` and `-`.
labels: {}

bucket:
  # -- Globally unique bucket name. Required when enabled. 3-63 lowercase
  # letters, digits, `-` and `_`, starting and ending with a letter or
  # digit (no dots). The publisher writes at the bucket root.
  name: ""
  # -- Storage class. STANDARD: the data is read within a day of landing.
  storageClass: STANDARD
  # -- Soft-delete retention in days: 0 (off) or 7-90. The bucket holds
  # data only in transit: schedule-ingest deletes each object once it has a
  # verified local copy, and the local archive is the recovery path. 7, the
  # minimum, keeps what was deleted or overwritten restorable for a week
  # for about a cent a month, mainly so that an unexpected object (which
  # the reader deletes without downloading) can still be examined, and an
  # overwrite or delete by the publisher before we fetched can be undone.
  softDeleteRetentionDays: 7
  # Object versioning is always off (not a value): with the reader
  # deleting after a verified download, noncurrent generations would only
  # retain bytes we removed on purpose.
  encryption:
    # -- Cloud KMS key for CMEK, as projects/<p>/locations/<l>/keyRings/<r>/cryptoKeys/<k>.
    # Empty (the default and the recommendation): Google-managed
    # encryption. CMEK adds a key, a grant to the Cloud Storage service
    # agent and a monthly key cost for public timetable data.
    defaultKmsKeyName: ""
  lifecycle:
    # -- Backstop only: days after which any object still in the bucket is
    # deleted. Normally schedule-ingest deletes each object within minutes
    # of fetching it; this rule matters only when the reader is down. 7 is
    # well beyond the reader-outage alerts (ReadErrors after 15 minutes,
    # NoNewObject after 30 hours), so it never races a working reader.
    deleteAfterDays: 7
    # -- Days before an unfinished XML-API multipart upload is aborted.
    # (Unfinished JSON-API resumable uploads expire on their own after a
    # week and hold no billed storage.)
    abortIncompleteMultipartUploadDays: 1

publisher:
  # -- The publisher's principals, each bound on THIS BUCKET ONLY to every
  # role in `roles` (never on the project). Required when enabled; the
  # render fails closed without them. Each entry must be
  # `serviceAccount:<email>`: allUsers, allAuthenticatedUsers, domain:,
  # group: and user: members are refused. Placeholder form:
  # serviceAccount:publisher@example-project.iam.gserviceaccount.com
  members: []
  # -- Roles granted to each publisher member on the bucket. The default is
  # the publisher's documented requirement (spec §5, "Publisher access"):
  # objectViewer (get, list), legacyBucketReader (bucket get, list),
  # bucketViewer (bucket get) and legacyBucketWriter (create, overwrite,
  # delete, list). Roles that can change IAM or bucket settings (admin,
  # objectAdmin, legacyBucketOwner, legacyObjectOwner) are refused.
  roles:
    - roles/storage.objectViewer
    - roles/storage.legacyBucketReader
    - roles/storage.bucketViewer
    - roles/storage.legacyBucketWriter

reader:
  # -- schedule-ingest's service account in our project, as
  # `serviceAccount:<email>`. Required when enabled. Ranma-Config creates
  # it and seals its key; this chart only binds it. On the delivery bucket
  # it gets roles/storage.objectViewer (get, list) plus the custom
  # delete-only role below; with auditLogs.bucket.enabled, objectViewer on
  # the audit-log bucket. It can never create or overwrite an object.
  member: ""
  deleteRole:
    # -- Project-level custom role holding only storage.objects.delete,
    # bound to the reader on the delivery bucket only, so it can delete an
    # object after a verified download. Chosen over roles/storage.objectUser,
    # which would also let a leaked reader key create and overwrite
    # objects, i.e. plant a delivery. Rendered as a provider-gcp-cloudplatform
    # ProjectIAMCustomRole.
    roleId: dsIngestObjectDeleter

auditLogs:
  bucket:
    # -- A private bucket that receives the delivery bucket's Cloud Audit
    # Logs (Data Access and Admin Activity) from a Logging sink, so
    # schedule-ingest can ship them to Loki with the same reader key. The
    # sink and the project's Data Access audit config are Ranma-Config's.
    enabled: true
    # -- Audit-log bucket name. Empty means `<bucket.name>-audit`.
    name: ""
    # -- Days to keep audit-log objects. 400 matches the SFTP delivery
    # audit retention in Loki. (The reader only reads this bucket; it
    # never deletes here.)
    expirationDays: 400
  # -- The Logging sink's writer identity (`serviceAccount:<email>`, from
  # the sink's status), granted roles/storage.objectCreator on the
  # audit-log bucket. Empty: no binding, and the sink can't write yet.
  sinkWriterIdentity: ""

usageAlerts:
  # -- Cloud Monitoring alert policies on the delivery bucket's free
  # Cloud Storage metrics (provider-gcp-monitoring AlertPolicy). Off: needs
  # the monitoring provider and a notification channel, both Ranma's.
  enabled: false
  # -- Notification channel names (projects/<p>/notificationChannels/<id>).
  # Required when enabled.
  notificationChannels: []
  # -- Alert when the bucket holds more bytes than this. Normal is at most
  # one CIF zip (~78 MB) and a CORPUS file in transit.
  totalBytes: 536870912
  # -- Alert when the bucket holds more objects than this. Normal is 0-2.
  objectCount: 20
  # -- Alert when an hour's write requests (WriteObject, ComposeObject,
  # RewriteObject) exceed this. Normal is a handful a day.
  writeRequestsPerHour: 100
  # -- Alert when an hour has more DeleteObject requests than this. Normal
  # is the reader's one delete per delivery (lifecycle deletions are not
  # requests).
  deleteRequestsPerHour: 10
  # -- Alert when an hour's received (uploaded) bytes exceed this. Normal
  # is one ~78 MB zip a day.
  receivedBytesPerHour: 536870912
  # -- Alert when an hour's sent (downloaded) bytes exceed this. Normal is
  # our one GET and the publisher's read-back and scan of each delivery.
  sentBytesPerHour: 1073741824

notifications:
  pubsub:
    # -- OBJECT_FINALIZE notifications to a Pub/Sub topic with a pull
    # subscription that schedule-ingest pulls (outbound HTTPS only). Off:
    # the chosen design polls the bucket every few minutes (spec §6). Needs
    # gcp.projectNumber.
    enabled: false
    # -- Topic name.
    topicName: ds-ingest-events
    # -- Pull subscription name.
    subscriptionName: ds-ingest-events-schedule-ingest
    # -- Seconds a pulled message stays unacknowledged before redelivery.
    # Must exceed one ingest (1-2 minutes); the consumer also extends it.
    ackDeadlineSeconds: 600
    # -- How long the subscription keeps unacknowledged messages.
    messageRetentionDuration: 604800s

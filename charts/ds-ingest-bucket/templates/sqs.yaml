{{- /*
Optional object-created notifications (notifications.sqs.enabled, off by
default): S3 -> an SSE-SQS encrypted standard queue -> schedule-ingest
long-polls it over outbound HTTPS. Messages that fail maxReceiveCount times
move to the dead-letter queue, which schedule-ingest reports as a metric.
Only s3.amazonaws.com may send, and only for the delivery bucket in this
account. ACK sqs controller kind: sqs.services.k8s.aws/v1alpha1 Queue, whose
attributes are all strings.

S3 checks the destination when the bucket's notification configuration is
written, so the Bucket stays un-synced (and ACK retries it) until this queue
and its policy exist.
*/}}
{{- if and .Values.enabled .Values.notifications.sqs.enabled }}
{{- include "ds-ingest-bucket.validate" . }}
{{- $q := .Values.notifications.sqs }}
{{- $queueArn := include "ds-ingest-bucket.queueArn" (dict "root" . "name" $q.queueName) }}
{{- $dlqArn := include "ds-ingest-bucket.queueArn" (dict "root" . "name" $q.deadLetterQueueName) }}
{{- $denyInsecure := dict "Sid" "DenyInsecureTransport" "Effect" "Deny" "Principal" "*" "Action" "sqs:*"
  "Condition" (dict "Bool" (dict "aws:SecureTransport" "false")) }}
{{- $queuePolicy := dict "Version" "2012-10-17" "Statement" (list
  (merge (dict "Resource" $queueArn) $denyInsecure)
  (dict "Sid" "S3ObjectCreatedFromDeliveryBucket" "Effect" "Allow"
    "Principal" (dict "Service" "s3.amazonaws.com")
    "Action" "sqs:SendMessage"
    "Resource" $queueArn
    "Condition" (dict
      "ArnLike" (dict "aws:SourceArn" (include "ds-ingest-bucket.bucketArn" .))
      "StringEquals" (dict "aws:SourceAccount" (toString .Values.aws.accountId))))) }}
{{- $dlqPolicy := dict "Version" "2012-10-17" "Statement" (list (merge (dict "Resource" $dlqArn) $denyInsecure)) }}
apiVersion: sqs.services.k8s.aws/v1alpha1
kind: Queue
metadata:
  name: {{ $q.deadLetterQueueName }}
  labels:
    {{- include "ds-ingest-bucket.labels" . | nindent 4 }}
    app.kubernetes.io/component: events-dead-letter-queue
  annotations:
    {{- include "ds-ingest-bucket.ackAnnotations" . | nindent 4 }}
spec:
  queueName: {{ $q.deadLetterQueueName }}
  sqsManagedSSEEnabled: "true"
  messageRetentionPeriod: {{ $q.deadLetterRetentionSeconds | int | toString | quote }}
  redriveAllowPolicy: {{ dict "redrivePermission" "byQueue" "sourceQueueArns" (list $queueArn) | toJson | squote }}
  policy: {{ $dlqPolicy | toJson | squote }}
  tags:
    {{- include "ds-ingest-bucket.tagMap" . | nindent 4 }}
---
apiVersion: sqs.services.k8s.aws/v1alpha1
kind: Queue
metadata:
  name: {{ $q.queueName }}
  labels:
    {{- include "ds-ingest-bucket.labels" . | nindent 4 }}
    app.kubernetes.io/component: events-queue
  annotations:
    {{- include "ds-ingest-bucket.ackAnnotations" . | nindent 4 }}
spec:
  queueName: {{ $q.queueName }}
  # SSE-SQS: S3 can send to it with no KMS key policy (an AWS-managed KMS
  # key would refuse S3's SendMessage).
  sqsManagedSSEEnabled: "true"
  visibilityTimeout: {{ $q.visibilityTimeoutSeconds | int | toString | quote }}
  receiveMessageWaitTimeSeconds: {{ $q.receiveWaitTimeSeconds | int | toString | quote }}
  messageRetentionPeriod: {{ $q.messageRetentionSeconds | int | toString | quote }}
  redrivePolicy: {{ dict "deadLetterTargetArn" $dlqArn "maxReceiveCount" (int $q.maxReceiveCount) | toJson | squote }}
  policy: {{ $queuePolicy | toJson | squote }}
  tags:
    {{- include "ds-ingest-bucket.tagMap" . | nindent 4 }}
{{- end }}

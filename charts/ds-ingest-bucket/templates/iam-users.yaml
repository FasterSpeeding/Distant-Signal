{{- /*
The two IAM identities, as ACK iam controller Users with inline policies
(iam.services.k8s.aws/v1alpha1 User). Both sit under iam.path and carry the
permissions boundary, which the controller's own policy requires.

ACK cannot create access keys (the iam controller has no AccessKey kind),
so a person mints one per user after install and seals the reader's into
the distant-signal namespace; README.md, "After install".
*/}}
{{- if .Values.enabled }}
{{- include "ds-ingest-bucket.validate" . }}
{{- $bucketArn := include "ds-ingest-bucket.bucketArn" . }}
{{- $prefix := .Values.bucket.deliveryPrefix }}
{{- $objects := printf "%s/%s*" $bucketArn $prefix }}
{{- /* ---- reader: schedule-ingest ---- */}}
{{- $listActions := list "s3:ListBucket" }}
{{- if eq .Values.bucket.versioning "Enabled" }}
{{- $listActions = append $listActions "s3:ListBucketVersions" }}
{{- end }}
{{- $getActions := list "s3:GetObject" "s3:GetObjectVersion" }}
{{- $reader := list
  (dict "Sid" "ListDeliveryPrefix" "Effect" "Allow" "Action" $listActions "Resource" $bucketArn
    "Condition" (dict "StringLike" (dict "s3:prefix" (list $prefix (printf "%s*" $prefix)))))
  (dict "Sid" "ReadDeliveries" "Effect" "Allow" "Action" $getActions "Resource" $objects) }}
{{- if .Values.reader.allowDelete }}
{{- $reader = append $reader (dict "Sid" "DeleteDeliveries" "Effect" "Allow"
  "Action" (list "s3:DeleteObject" "s3:DeleteObjectVersion") "Resource" $objects) }}
{{- end }}
{{- if and .Values.accessLogs.enabled .Values.reader.readAccessLogs }}
{{- $logArn := include "ds-ingest-bucket.logBucketArn" . }}
{{- $logPrefix := .Values.accessLogs.targetPrefix }}
{{- $reader = append $reader (dict "Sid" "ListAccessLogs" "Effect" "Allow" "Action" "s3:ListBucket" "Resource" $logArn
  "Condition" (dict "StringLike" (dict "s3:prefix" (list $logPrefix (printf "%s*" $logPrefix))))) }}
{{- $reader = append $reader (dict "Sid" "ReadAccessLogs" "Effect" "Allow" "Action" "s3:GetObject"
  "Resource" (printf "%s/%s*" $logArn $logPrefix)) }}
{{- end }}
{{- if .Values.notifications.sqs.enabled }}
{{- $q := .Values.notifications.sqs }}
{{- $reader = append $reader (dict "Sid" "ConsumeObjectEvents" "Effect" "Allow"
  "Action" (list "sqs:ReceiveMessage" "sqs:DeleteMessage" "sqs:ChangeMessageVisibility" "sqs:GetQueueAttributes" "sqs:GetQueueUrl")
  "Resource" (include "ds-ingest-bucket.queueArn" (dict "root" . "name" $q.queueName))) }}
{{- $reader = append $reader (dict "Sid" "WatchDeadLetterDepth" "Effect" "Allow"
  "Action" (list "sqs:GetQueueAttributes" "sqs:GetQueueUrl")
  "Resource" (include "ds-ingest-bucket.queueArn" (dict "root" . "name" $q.deadLetterQueueName))) }}
{{- end }}
apiVersion: iam.services.k8s.aws/v1alpha1
kind: User
metadata:
  name: {{ .Values.reader.userName }}
  labels:
    {{- include "ds-ingest-bucket.labels" . | nindent 4 }}
    app.kubernetes.io/component: reader
  annotations:
    {{- include "ds-ingest-bucket.ackAnnotations" . | nindent 4 }}
spec:
  name: {{ .Values.reader.userName }}
  path: {{ .Values.iam.path }}
  permissionsBoundary: {{ .Values.iam.permissionsBoundaryArn }}
  inlinePolicies:
    schedule-ingest-read: {{ dict "Version" "2012-10-17" "Statement" $reader | toJson | squote }}
  tags:
    {{- include "ds-ingest-bucket.tagSet" . | nindent 4 }}
{{- if eq .Values.writer.mode "iamUser" }}
{{- /* ---- writer: the Rail Data Marketplace publisher ---- */}}
{{- $putActions := list "s3:PutObject" }}
{{- if .Values.writer.allowAbortMultipartUpload }}
{{- $putActions = append $putActions "s3:AbortMultipartUpload" }}
{{- end }}
{{- $writer := list (dict "Sid" "PutDeliveries" "Effect" "Allow" "Action" $putActions "Resource" $objects) }}
{{- if .Values.writer.allowList }}
{{- $writer = append $writer (dict "Sid" "ListDeliveryPrefix" "Effect" "Allow" "Action" "s3:ListBucket" "Resource" $bucketArn
  "Condition" (dict "StringLike" (dict "s3:prefix" (list $prefix (printf "%s*" $prefix))))) }}
{{- end }}
---
apiVersion: iam.services.k8s.aws/v1alpha1
kind: User
metadata:
  name: {{ .Values.writer.userName }}
  labels:
    {{- include "ds-ingest-bucket.labels" . | nindent 4 }}
    app.kubernetes.io/component: writer
  annotations:
    {{- include "ds-ingest-bucket.ackAnnotations" . | nindent 4 }}
spec:
  name: {{ .Values.writer.userName }}
  path: {{ .Values.iam.path }}
  permissionsBoundary: {{ .Values.iam.permissionsBoundaryArn }}
  inlinePolicies:
    rdm-put-deliveries: {{ dict "Version" "2012-10-17" "Statement" $writer | toJson | squote }}
  tags:
    {{- include "ds-ingest-bucket.tagSet" . | nindent 4 }}
{{- end }}
{{- end }}

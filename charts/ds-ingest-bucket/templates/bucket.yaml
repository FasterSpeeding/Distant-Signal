{{- /*
The delivery bucket the publisher pushes into, dedicated to timetable and
CORPUS ingest (D9). Private (uniform bucket-level access, public access
prevention enforced), unversioned, with a short soft delete. Data is only in
transit here: schedule-ingest deletes each object once it holds a verified
local copy, and a lifecycle rule is the backstop for a reader outage. Crossplane provider-gcp-storage kind:
storage.gcp.m.upbound.io/v1beta1 Bucket (namespaced, Crossplane v2).

No `logging` block: Cloud Storage usage logs carry no caller identity. The
object-level audit trail is Cloud Audit Logs Data Access, routed by
Ranma-Config's sink into the audit-log bucket (audit-bucket.yaml).
*/}}
{{- if .Values.enabled }}
{{- include "ds-ingest-bucket.validate" . }}
{{- $lc := .Values.bucket.lifecycle }}
apiVersion: storage.gcp.m.upbound.io/v1beta1
kind: Bucket
metadata:
  name: {{ .Values.bucket.name }}
  labels:
    {{- include "ds-ingest-bucket.labels" . | nindent 4 }}
    app.kubernetes.io/component: delivery-bucket
  annotations:
    crossplane.io/external-name: {{ .Values.bucket.name }}
    # helm uninstall leaves the managed resource, so the bucket (and the
    # deliveries in it) survive an accidental uninstall whatever the
    # management policies say.
    helm.sh/resource-policy: keep
spec:
  {{- include "ds-ingest-bucket.managedBucket" . | nindent 2 }}
  forProvider:
    {{- include "ds-ingest-bucket.privateBucket" . | nindent 4 }}
    storageClass: {{ .Values.bucket.storageClass }}
    # Off: the bucket holds data only in transit (spec §5).
    versioning:
      enabled: false
    softDeletePolicy:
      retentionDurationSeconds: {{ mul (int .Values.bucket.softDeleteRetentionDays) 86400 }}
    {{- with .Values.bucket.encryption.defaultKmsKeyName }}
    encryption:
      defaultKmsKeyName: {{ . }}
    {{- end }}
    lifecycleRule:
      # Backstop for a reader outage: schedule-ingest normally deletes each
      # object minutes after a verified download.
      - action:
          type: Delete
        condition:
          age: {{ int $lc.deleteAfterDays }}
      - action:
          type: AbortIncompleteMultipartUpload
        condition:
          age: {{ int $lc.abortIncompleteMultipartUploadDays }}
    labels:
      {{- include "ds-ingest-bucket.gcpLabels" . | nindent 6 }}
{{- end }}

id = "overground-windrush"
name = "Windrush line"
mode = "national-rail"
category = "commuter"
operators = ["LO"]

# Former East London line (extended). Core from the shared Canonbury
# curve down to Surrey Quays, then four branches: New Cross (direct); a
# New Cross Gate shared sub-trunk out to Sydenham, which itself splits
# into Crystal Palace and West Croydon; and a separate Clapham Junction
# branch from Surrey Quays. Each branch/trunk is its own `[[stations]]`
# block, ordered geographically within itself, per SCHEMA's curation rule.
#
# `overground-canonbury-curve`: this line and `overground-mildmay` both
# call at Highbury & Islington (HHY) and Canonbury (CNN) — the real curve
# of track connecting the North London and East London route alignments
# at that point — then diverge to two different, non-identical next
# stations (Windrush to Dalston Junction, DLJ; Mildmay to Dalston
# Kingsland, DLK — different CRS codes, ~350m apart, not the same
# station). Per `lines/SCHEMA.md`'s junction rule, both junction stations
# belong to the shared segment and each line's own exclusive segment
# resumes at the very next station. See `lines/overground-mildmay.toml`
# for the same explanation from that file's side, kept consistent with
# this one (same CRS codes, same segment string), matching this
# catalogue's cross-file citation convention used elsewhere (e.g.
# `lines/wcml-north-wales.toml`/`lines/tfw-north-wales-coast.toml`).
#
# Other touchpoints are station-level overlaps only, not shared segments:
# Whitechapel (ZLW, this file) already appears on
# `elizabeth-line.toml`/`elizabeth-heathrow.toml`/`elizabeth-shenfield.toml`
# — a different, exclusive segment family, no segment shared. Canada
# Water (ZCW, this file) also already appears on `elizabeth-line.toml`
# (segment `elizabeth-south-east`) — another station-level overlap the
# Task 3.0 research pass didn't call out; noted here for the same reason.
# Clapham Junction (CLJ, this file's own separate branch) is a three-way
# station-level overlap between this line, `overground-mildmay`'s own
# separate Clapham Junction branch, and the existing SWR catalogue's
# `swr-alton`/`swr-portsmouth-direct`/`swr-south-west-main` — three
# different routes converging on one station, not a shared segment.

# Shared curve with `overground-mildmay`.
[[stations]]
crs = "HHY"
role = "junction"
segment = "overground-canonbury-curve"

[[stations]]
crs = "CNN"
role = "junction"
segment = "overground-canonbury-curve"


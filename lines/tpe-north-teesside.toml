id = "tpe-north-teesside"
name = "TransPennine Express: North (Teesside)"
mode = "national-rail"
category = "main-line"
operators = [
  "TP",  # TransPennine Express (DfT Operator Ltd)
]

# Sibling of `tpe-north.toml`, added in the real-world-sanity review that
# flagged `tpe-north.toml`'s own SCOPE note ("Redcar Central/Middlesbrough...
# out of this file's scope... belong in separate line definitions if this
# catalogue ever covers them"). TPE's own current route table names its
# "North" route group as a single branded grouping that fans out beyond York
# into several distinct hourly services; per the SCHEMA.md linear-ordering
# and one-line-per-file rules, that fan cannot be modelled as one file (the
# same reasoning that forced `grand-central.toml`/`grand-central-bradford.toml`
# apart from an originally-combined, non-linear file) -- so this is a new
# sibling file, not a broadening of `tpe-north.toml` itself. See
# `tpe-north.toml`'s own header comment for the cross-references to the
# other new siblings (`tpe-north-hull.toml`, `tpe-north-scarborough.toml`).
#
# Route, live-verified 2026-09-21 via two independent sources:
#   - Wikipedia's "TransPennine Express" article, route table: "Manchester
#     Airport to Redcar Central", 1 tph, calling at Manchester Piccadilly,
#     Manchester Oxford Road, Manchester Victoria, Huddersfield, Dewsbury,
#     Leeds, York, Thirsk, Northallerton, Yarm, Eaglescliffe, Thornaby,
#     Middlesbrough, with "3 trains a day extend to/from Redcar Central to
#     Saltburn".
#   - Redcar Central's own Wikipedia article, Services section (accessed
#     2026-09-21): "TransPennine Express trains ... to Manchester Airport
#     ... via York ... all services running via Yarm" (as of September 2025),
#     and "Two evening services extend to Saltburn with the first early
#     morning departure also starting back from there" -- independently
#     corroborates both the Manchester Airport terminus and the small
#     Saltburn extension.
#
# Redcar Central-Saltburn extension: South Bank, Redcar East, Longbeck and
# Marske all sit geographically between Redcar Central and Saltburn, but are
# NOT called at by this service -- each of their own Wikipedia "Services"
# sections states plainly they are served only by Northern Trains (the
# Tees Valley line's own hourly-ish Saltburn-Darlington/Bishop Auckland
# stopper, already modelled in `northern-tees-valley.toml`). Deliberately
# left out below rather than guessed; this file's own Saltburn extension
# runs non-stop from Redcar Central.
#
# Station overlap, no shared segment name (matching `tpe-north.toml`'s own
# explicit precedent for this exact station set, adopted here for
# consistency across the whole North-route sibling group rather than
# reworked):
#   - MIA, MAN, MCO are also stations on `tpe-anglo-scottish.toml`/
#     `tpe-south.toml` (their own Manchester Airport/Oxford Road approach),
#     `wcml-manchester.toml`, `xc-manchester.toml` and various Northern
#     files -- station-overlap only in every case.
#   - MCV, HUD, LDS, YRK are also on `tpe-north.toml` (the Liverpool-
#     Newcastle service) -- genuinely the same physical Manchester
#     Victoria-Huddersfield-Leeds-York corridor `tpe-north.toml`'s own
#     header comment already describes as carrying "4 tph combined" of
#     fanned-out North Route services. Not tagged as a cross-file shared
#     trunk here: `tpe-north.toml` explicitly chose station-overlap-only
#     for this exact stretch against `northern.toml`/`cross-country.toml`,
#     and this file follows that same already-made call for consistency,
#     rather than introducing a new multi-file branching trunk (which would
#     also need to account for `tpe-north-hull.toml` diverging at LDS and
#     `tpe-north-scarborough.toml` diverging at YRK) -- flagged here as a
#     reasonable follow-up if this catalogue's shared-trunk matching is ever
#     extended to fan-out topologies, not attempted in this pass.
#   - DEW (Dewsbury) is also on `northern.toml`. THI, NTR, EAG are also on
#     `grand-central.toml`'s own Sunderland route (a different corridor
#     beyond Northallerton). RCC, SLB are also on `northern-tees-valley.toml`
#     (which already documents "also served by TPE" at Redcar Central,
#     anticipating this file). All station-overlap only.
#
# CRS codes: every new code below (MIA, MAN, MCO, DEW, THI, NTR, YRM, EAG,
# TBY, MBR, RCC, SLB where not already reused verbatim from an existing
# file) cross-checked against `https://ds.cursed.solutions/api/stations`,
# 2026-09-21. THI, NTR, EAG reused verbatim from `grand-central.toml`
# (already verified there); RCC, SLB reused verbatim from
# `northern-tees-valley.toml`.
sample_stations = ["MIA", "MCV", "YRK", "MBR", "RCC"]
destination_crs_filter = ["MIA", "RCC", "SLB"]
# Manchester Airport and Redcar Central are this route's two everyday real
# termini; Saltburn is included too since a handful of daily workings
# genuinely terminate/originate there rather than at Redcar Central (see the
# sourcing above) -- omitting it would silently drop those departures from
# LDBWS sampling.

# No match_keywords: same reasoning as `tpe-north.toml` -- "North" is too
# generic and the bare "TransPennine Express" brand is reserved for
# operator-level files, not per-route ones. Station and operator evidence
# carries this file instead.

# Same long-distance thresholds as `tpe-north.toml` and its other siblings.
[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10

# Ordered Manchester Airport -> Manchester Piccadilly -> Manchester Oxford
# Road -> Manchester Victoria -> Huddersfield -> Dewsbury -> Leeds -> York
# -> Thirsk -> Northallerton -> Yarm -> Eaglescliffe -> Thornaby ->
# Middlesbrough -> Redcar Central -> Saltburn, per the confirmed route above.
[[stations]]
crs = "MIA"
role = "terminus"
segment = "tpe-north-teesside"

[[stations]]
crs = "MAN"
role = "major"
segment = "tpe-north-teesside"

[[stations]]
crs = "MCO"
role = "minor"
segment = "tpe-north-teesside"
# Manchester Oxford Road.

[[stations]]
crs = "MCV"
role = "major"
segment = "tpe-north-teesside"

[[stations]]
crs = "HUD"
role = "major"
segment = "tpe-north-teesside"

[[stations]]
crs = "DEW"
role = "minor"
segment = "tpe-north-teesside"
# Dewsbury.

[[stations]]
crs = "LDS"
tiploc = "LEEDS"
role = "junction"
segment = "tpe-north-teesside"

[[stations]]
crs = "YRK"
tiploc = "YORK"
role = "junction"
segment = "tpe-north-teesside"
# Junction with `tpe-north.toml` (Newcastle, via the ECML/Darlington) and
# `tpe-north-scarborough.toml` (via Malton) -- this route's own exclusive
# continuation towards Teesside starts at the next station, Thirsk.

[[stations]]
crs = "THI"
role = "minor"
segment = "tpe-north-teesside"
# Thirsk -- CRS reused verbatim from `grand-central.toml`.

[[stations]]
crs = "NTR"
role = "minor"
segment = "tpe-north-teesside"
# Northallerton -- CRS reused verbatim from `grand-central.toml`.

[[stations]]
crs = "YRM"
role = "minor"
segment = "tpe-north-teesside"
# Yarm.

[[stations]]
crs = "EAG"
role = "minor"
segment = "tpe-north-teesside"
# Eaglescliffe -- CRS reused verbatim from `grand-central.toml`.

[[stations]]
crs = "TBY"
role = "minor"
segment = "tpe-north-teesside"
# Thornaby.

[[stations]]
crs = "MBR"
role = "major"
segment = "tpe-north-teesside"
# Middlesbrough -- CRS reused verbatim from `northern-tees-valley.toml`.

[[stations]]
crs = "RCC"
role = "major"
segment = "tpe-north-teesside"
# Redcar Central -- CRS reused verbatim from `northern-tees-valley.toml`,
# which already flags this station as "also served by TPE".

[[stations]]
crs = "SLB"
role = "terminus"
segment = "tpe-north-teesside"
# Saltburn -- only a handful of daily workings extend this far; see the
# sourcing note above. CRS reused verbatim from `northern-tees-valley.toml`.

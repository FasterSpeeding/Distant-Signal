id = "southern-brighton-main-line"
name = "Brighton Main Line"
mode = "national-rail"
category = "main-line"
operators = [
  "SN",  # Southern
  "GX",  # Gatwick Express - folded in here, not a separate file; see below.
]

sample_stations = ["VIC", "ECR", "GTW", "BTN"]
match_keywords = ["Brighton Main Line", "Gatwick Express"]

# ============================================================================
# SOURCING AND VERIFICATION
# ============================================================================
# Station list and calling patterns confirmed via Wikipedia's "Brighton Main
# Line", "Gatwick Express" and "Southern (train operating company)" articles,
# cross-checked against each other and against each station's own Wikipedia
# infobox for CRS codes (railwaycodes.org.uk's crs*.shtm pages were tried
# first but hit the same alphabetical-page-truncation issue already flagged
# in southeastern-metro-north-kent.toml's own sourcing comment, so the
# per-station-infobox fallback that file used was used here too). This is
# the first GTR-brand file in the catalogue (thameslink-core.toml predates
# this batch); Southern's other services - the West/East Coastway lines
# (Eastbourne, Hastings, Portsmouth) and the Oxted/Uckfield branches - are
# NOT covered here and are separate future files, mirroring how
# thameslink-core.toml's own header already promises separate branch files
# for what it doesn't cover.
#
# ============================================================================
# GATWICK EXPRESS: FOLD-IN, NOT A SEPARATE FILE
# ============================================================================
# The gap analysis describes Gatwick Express as "a single non-stop
# Victoria-Gatwick service" - that undersells its current calling pattern.
# Per Wikipedia's "Gatwick Express" article (current, as of its most recent
# revision): off-peak the branded service now runs London Victoria - Gatwick
# Airport - Haywards Heath - Brighton (2 tph, "calling at Gatwick Airport,
# Haywards Heath"), with weekday peak services (0600-0900 northbound,
# 1700-2000 southbound) additionally calling at Preston Park, Hassocks and
# Burgess Hill. Only the Sunday-only half-hourly Victoria-Gatwick Airport
# shuttle is genuinely non-stop end to end. So it is NOT strictly non-stop
# any more - but every station it calls at (VIC, GTW, HHE, PRP, HSK, BUG,
# BTN) is already a station on this file's own Brighton Main Line list
# below, i.e. it is a strict subset of this line's own calling pattern, not
# a materially divergent route. That satisfies the brief's fold-in test, so
# `GX` is added to `operators` above rather than splitting out a
# `southern-gatwick-express.toml` file. No deviation from the plan's file
# count as a result.
#
# ============================================================================
# SEGMENT NAMING - the London Bridge/Windmill Bridge Jn/East Croydon
# stretch, for Task 5.14 (lines/thameslink-southern.toml, not yet written)
# ============================================================================
# thameslink-core.toml terminates its own `thameslink-core` segment at LBG
# with the comment "Trains diverge south of London Bridge - handled by
# branch line definitions". Per Wikipedia's "Thameslink" article, one of
# those branches is real and current: an off-peak "Bedford to Brighton"
# service (2 tph) that runs "over the Brighton Main Line (via London
# Bridge)", calling at London Bridge and East Croydon en route to Gatwick
# Airport and Brighton. This is a genuine, standing, everyday service - NOT
# an occasional engineering diversion, which is the important distinction
# from Task 5.4's southeastern-metro-north-kent.toml finding for the
# UNRELATED London Bridge-Lewisham stretch (that file's own FINDING 2
# concluded Thameslink only diverts through Lewisham during Greenwich Line
# outages, so did NOT name a genuine shared trunk there). This is a
# different corridor and a different, positive, finding.
#
# Windmill Bridge Junction itself (confirmed via Wikipedia's "Quarry line"
# article as a real, named junction just north of East Croydon) is where
# the Victoria-approach and London Bridge-approach branches physically
# converge before reaching East Croydon; it has no CRS code and is not a
# passenger station, so it is not listed as a [[stations]] entry - only
# LBG and ECR (its two real-station endpoints) are.
#
# Segment name chosen for this stretch: `southern-bml-north` (covering LBG
# and ECR below). Task 5.14's implementer: reuse this exact string verbatim
# on `thameslink-southern.toml`'s own LBG/East Croydon-area stations IF your
# own independent research confirms the same genuine everyday Thameslink
# working this comment describes. This is a courtesy comment, not a
# blocking dependency - no test in this file asserts SharedSegment for this
# stretch today, since `thameslink-southern.toml` doesn't exist yet to share
# it with (same caveat southeastern-metro-north-kent.toml's own
# `southeastern-lewisham-corridor` comment states for its own hand-off).
#
# CAVEAT/lead for Task 5.14: the same Wikipedia "Thameslink" article and
# East Croydon's own infobox ("2 tph to Three Bridges via Redhill", "1 tph
# to Gatwick Airport via Redhill") suggest the real Bedford-Brighton
# service's shared running may extend further south than just to East
# Croydon - possibly as far as Gatwick Airport/Three Bridges/Brighton (via
# Redhill, not necessarily this file's own direct Quarry Line alignment).
# That is beyond this task's own scoped stretch (LBG/Windmill Bridge Jn/
# East Croydon only, per this task's brief) and beyond what this file's own
# research fully chased down - noted here so Task 5.14 doesn't miss it, not
# acted on. `southern-bml-south` (East Croydon to Brighton, below) is left
# as this line's own exclusive segment for now.
#
# ============================================================================
# STATIONS - ordered south from each London terminus; Victoria and London
# Bridge are two separate approaches that converge at Windmill Bridge Jn
# just before East Croydon (see above). Only principal/interchange stations
# are listed, matching xc-south-coast.toml's precedent ("minor intermediate
# calls are omitted; only principal stations are listed").
# ============================================================================
[[stations]]
crs = "VIC"
role = "terminus"
segment = "southern-bml-victoria"
# London Victoria. Gatwick Express's usual London terminus; Thameslink does
# not call here at all (it's a different, cross-London-core route via St
# Pancras/Blackfriars/London Bridge) - so this approach is Southern/GX-only,
# unlike the London Bridge approach below.

[[stations]]
crs = "LBG"
role = "terminus"
segment = "southern-bml-north"
# London Bridge. Also thameslink-core.toml's own terminus (its own segment
# already ends here) - station overlap only against that file's segment,
# same precedent as thameslink-core/southeastern-main-line elsewhere in this
# catalogue. See the SEGMENT NAMING comment above for why this station's OWN
# segment here (`southern-bml-north`) is named as a courtesy hand-off for
# Task 5.14, not yet an actual cross-file shared trunk.

[[stations]]
crs = "ECR"
role = "junction"
segment = "southern-bml-north"
# East Croydon. Junction station per the shared-trunk rule of thumb
# (SCHEMA.md): belongs to the shared/hand-off segment, not the exclusive
# one below it. Victoria and London Bridge approaches (via Windmill Bridge
# Jn, see above) converge here; the Quarry Line/Redhill alignment also
# diverges near here (see CAVEAT above) - not modelled separately in this
# file.

[[stations]]
crs = "GTW"
role = "major"
segment = "southern-bml-south"
# Gatwick Airport. Also served by Thameslink and Great Western Railway
# (neither modelled by this file); the exclusive segment for this line
# starts here, one station past the ECR junction, per the shared-trunk rule
# of thumb.

[[stations]]
crs = "TBD"
role = "junction"
segment = "southern-bml-south"
# Three Bridges. The Arun Valley line (toward Horsham/Littlehampton)
# diverges here; not covered by this catalogue.

[[stations]]
crs = "HHE"
role = "major"
segment = "southern-bml-south"
# Haywards Heath.

[[stations]]
crs = "BUG"
role = "minor"
segment = "southern-bml-south"
# Burgess Hill. Peak-only Gatwick Express calling point (see fold-in note
# above).

[[stations]]
crs = "HSK"
role = "minor"
segment = "southern-bml-south"
# Hassocks. Peak-only Gatwick Express calling point.

[[stations]]
crs = "PRP"
role = "minor"
segment = "southern-bml-south"
# Preston Park. Peak-only Gatwick Express calling point.

[[stations]]
crs = "BTN"
role = "terminus"
segment = "southern-bml-south"
# Brighton.

id = "southern-brighton-main-line"
name = "Brighton Main Line"
mode = "national-rail"
category = "main-line"
operators = [
  "SN",  # Southern
  "GX",  # Gatwick Express - folded in here, not a separate file; see below.
]

sample_stations = ["VIC", "ECR", "GTW", "BTN"]
match_keywords = ["Brighton Main Line", "Gatwick Express"]

# ============================================================================
# SOURCING AND VERIFICATION
# ============================================================================
# Station list (CRS codes, ordering) confirmed via Wikipedia's "Brighton Main
# Line" and "Southern (train operating company)" articles, cross-checked
# against each other and against each station's own Wikipedia infobox, with
# CRS codes independently spot-checked against railwaycodes.org.uk's
# crs*.shtm pages where those loaded (some, e.g. crsb.shtm, hit the same
# alphabetical-page-truncation issue already flagged in
# southeastern-bexleyheath.toml's/southeastern-dartford-loop.toml's own
# sourcing comment (formerly one file, southeastern-metro-north-kent.toml) -
# the per-station-infobox fallback that file used was used for those; crst.shtm
# loaded fully and independently confirms TBD). This is the first GTR-brand
# file in the catalogue (thameslink-core.toml predates this batch);
# Southern's other services - the West/East Coastway lines (Eastbourne,
# Hastings, Portsmouth) and the Oxted/Uckfield branches - are NOT covered
# here and are separate future files, mirroring how thameslink-core.toml's
# own header already promises separate branch files for what it doesn't
# cover.
#
# TWO FACTS BELOW THIS FILE'S FOLD-IN DECISION AND ITS TASK 5.14 HAND-OFF
# ARE WIKIPEDIA-ONLY SOURCED AND FALL SHORT OF THIS BATCH'S TWO-SOURCE BAR.
# COMMON.md requires cross-checking against railwaycodes.org.uk, Network
# Rail's own route pages, National Rail Enquiries, or the TOC's own site -
# not a second Wikipedia article. A real attempt was made to get a proper
# second source for both facts below: nationalrail.co.uk's own station
# detail pages for GTW/ECR/HHE/BTN load fine but only name the managing
# operator (e.g. "Station managed by Southern"), not stop-by-stop calling
# patterns or cross-operator track-sharing; gatwickexpress.com,
# southernrailway.com and thameslinkrailway.com all return HTTP 403 to
# automated fetches; networkrail.co.uk's route pages 404 at every URL tried;
# railwaycodes.org.uk's CRS/ELR tables are a codes-and-mileage reference and
# don't carry service-pattern prose at all (confirmed by checking - the ELR
# entries near "Brighton" list only mileages, e.g. "BPJ ... London Bridge
# via Redhill", nothing about which trains call where). No genuine second
# source of the required type could be reached for either fact. Per
# COMMON.md's own rule, both are flagged plainly below as unconfirmed to
# this batch's bar rather than asserted as verified - see each section.
#
# ============================================================================
# GATWICK EXPRESS: FOLD-IN, NOT A SEPARATE FILE
# ============================================================================
# The gap analysis describes Gatwick Express as "a single non-stop
# Victoria-Gatwick service" - that undersells its current calling pattern.
# Per Wikipedia's "Gatwick Express" article ONLY (cross-checked against a
# second Wikipedia article, "Southern (train operating company)", but NOT
# against a source of the type COMMON.md requires - see the SOURCING note
# above for what was tried and failed): off-peak the branded service now
# runs London Victoria - Gatwick Airport - Haywards Heath - Brighton (2 tph,
# "calling at Gatwick Airport, Haywards Heath"), with weekday peak services
# additionally calling at Preston Park, Hassocks and Burgess Hill; only the
# Sunday-only half-hourly Victoria-Gatwick Airport shuttle is genuinely
# non-stop end to end. TREAT THIS SPECIFIC CALLING-PATTERN DETAIL (the exact
# stations, the tph counts, the peak/off-peak split) AS UNCONFIRMED - it is
# below this batch's sourcing bar and should not be relied on as a verified
# fact elsewhere in this catalogue.
#
# The fold-in decision itself rests on a narrower and safer claim that
# doesn't depend on those specifics being exactly right: whatever Gatwick
# Express's precise calling pattern is, it is uncontested (effectively
# definitional to the branded service, not a specific-boundary claim) that
# it runs only between London Victoria and Brighton/Gatwick Airport over the
# Brighton Main Line, calling only at intermediate stations that are also
# principal Brighton Main Line stations - it does not serve anywhere off
# this file's own list below. So even discounting the unconfirmed specifics
# above, no station this file would need to add for Gatwick Express falls
# outside its own already-covered Brighton Main Line list, which is the
# actual test the brief sets for fold-in vs. split. On that basis `GX` is
# still added to `operators` above rather than splitting out a
# `southern-gatwick-express.toml` file - but this is a more conservative
# justification than the original "well supported" framing, and the
# specific service-pattern comments on BUG/HSK/PRP below should be read as
# Wikipedia-only detail, not confirmed fact.
#
# ============================================================================
# SEGMENT NAMING - the London Bridge/Windmill Bridge Jn/East Croydon
# stretch, for Task 5.14 (lines/thameslink-southern.toml, not yet written)
# ============================================================================
# thameslink-core.toml terminates its own `thameslink-core` segment at LBG
# with the comment "Trains diverge south of London Bridge - handled by
# branch line definitions". Per Wikipedia's "Thameslink" article ONLY
# (cross-checked against a second Wikipedia article, "Quarry line", for the
# Windmill Bridge Junction detail below, but NOT against a source of the
# type COMMON.md requires - see the SOURCING note above for what was tried
# and failed): one of those branches is described as an off-peak "Bedford to
# Brighton" service (2 tph) that runs "over the Brighton Main Line (via
# London Bridge)", calling at London Bridge and East Croydon en route to
# Gatwick Airport and Brighton.
#
# THIS IS WIKIPEDIA-ONLY SOURCED AND FALLS BELOW THIS BATCH'S CONFIRMATION
# BAR - treat it as an unconfirmed lead, not a confirmed fact. In particular,
# do NOT treat "this is a genuine standing everyday service, not an
# engineering diversion" as established the way Task 5.4's pre-split
# southeastern-metro-north-kent.toml FINDING 2 (now carried in both
# southeastern-bexleyheath.toml and southeastern-dartford-loop.toml)
# established the opposite for the unrelated London Bridge-Lewisham stretch
# (that finding rested on the same kind of single-article claim too, for
# what it's worth, but that's Task 5.4's own call, not license to treat
# this one as settled).
# Wikipedia's account here is plausible and specific enough to be worth
# recording as a lead, but it is NOT independently verified.
#
# Windmill Bridge Junction itself (per Wikipedia's "Quarry line" article,
# a real, named junction just north of East Croydon, also unconfirmed to
# the required bar) is where the Victoria-approach and London Bridge-
# approach branches are described as physically converging before reaching
# East Croydon; it has no CRS code and is not a passenger station, so it is
# not listed as a [[stations]] entry - only LBG and ECR (its two real-
# station endpoints) are.
#
# OUTCOME (Task 5.14, lines/thameslink-southern.toml): still NOT confirmed
# to this batch's required bar. Task 5.14 re-verified this working from
# scratch and found thetrainline.com's live journey-planner page (confirming
# real, current, bookable direct London Bridge-Brighton services), but that
# source is not one of COMMON.md's four approved second-source categories
# and only shows service-existence, not physical track-sharing - so it does
# not clear the bar either. `southern-bml-north` (covering LBG and ECR
# below) therefore remains this file's own segment name only; it was NOT
# reused by thameslink-southern.toml, which instead treats its own LBG/ECR
# stations as station overlap only, matching this file's own fallback
# instruction and the same treatment southeastern-bexleyheath.toml/
# southeastern-dartford-loop.toml (formerly one file,
# southeastern-metro-north-kent.toml) already gives its own unconfirmed
# Lewisham stretch. See
# thameslink-southern.toml's own BRIGHTON BRANCH header comment for the full
# writeup of what was tried and why it still doesn't clear the bar. No test
# in this file or thameslink-southern.toml asserts SharedSegment for this
# stretch, and none should be added anywhere in this catalogue until the
# underlying fact is actually confirmed by a qualifying source.
#
# CAVEAT/lead for Task 5.14 (equally unconfirmed): the same Wikipedia
# "Thameslink" article and East Croydon's own infobox ("2 tph to Three
# Bridges via Redhill", "1 tph to Gatwick Airport via Redhill") suggest the
# described Bedford-Brighton service's shared running may extend further
# south than just to East Croydon - possibly as far as Gatwick Airport/
# Three Bridges/Brighton (via Redhill, not necessarily this file's own
# direct Quarry Line alignment). That is beyond this task's own scoped
# stretch (LBG/Windmill Bridge Jn/East Croydon only, per this task's brief)
# and was not chased down further, let alone verified - noted here so Task
# 5.14 doesn't miss the lead, not acted on. `southern-bml-south` (East
# Croydon to Brighton, below) is left as this line's own exclusive segment
# for now.
#
# UPDATE (review2-se-southern): the "Redhill alignment" this caveat and the
# STATIONS section below both originally flagged as a separate, unmodelled
# stopping pattern is now modelled - see the PURLEY-HORLEY REDHILL
# ALIGNMENT section further down and the `southern-bml-redhill` segment in
# STATIONS. This does not resolve the Task 5.14 hand-off itself (still no
# non-Wikipedia source for the Thameslink Bedford-Brighton service's exact
# routing), but it does mean the real-world "disruption between East
# Croydon and Gatwick Airport" incident phrasing this line's own gap
# analysis kept surfacing now has somewhere to match: Purley, Coulsdon
# South, Merstham, Redhill, Earlswood, Salfords and Horley are all real
# intermediate stops on this line's slow/Redhill-alignment stopping
# pattern, confirmed below.
#
# ============================================================================
# STATIONS - ordered south from each London terminus; Victoria and London
# Bridge are two separate approaches that converge at Windmill Bridge Jn
# just before East Croydon (see above). Only principal/interchange stations
# are listed, matching xc-south-coast.toml's precedent ("minor intermediate
# calls are omitted; only principal stations are listed").
#
# TASK 5.4 FILL-IN (station-catalogue-completeness plan): a fresh
# route-diagram pass added two genuinely missing, currently-open, currently-
# Southern-served stations below - Clapham Junction (CLJ, Victoria approach)
# and Wivelsfield (WVF, between Haywards Heath and Burgess Hill) - see each
# entry's own comment for sourcing. Several other candidate stations
# surfaced during this research and were deliberately NOT added, each for a
# specific, checked reason rather than a blanket "principal only" omission:
#   - Purley, Coulsdon South, Merstham, Redhill, Earlswood, Salfords, Horley:
#     at the time of Task 5.4, this was treated as a genuinely different
#     physical stopping pattern and left out entirely - see the PURLEY-HORLEY
#     REDHILL ALIGNMENT section below for why that turned out to be wrong
#     (this is a real Brighton Main Line stopping pattern via the "slow"/
#     Redhill alignment, not a separate line) and how it is now modelled on
#     the new `southern-bml-redhill` segment.
#   - Balcombe (between Three Bridges and Haywards Heath): confirmed via its
#     own Wikipedia infobox as Thameslink-only ("Thameslink operates all
#     services at the station") - this file's operators are Southern/Gatwick
#     Express only, so Balcombe genuinely isn't served by any service this
#     file models.
#   - South Croydon: already deliberately modelled in
#     southern-oxted-uckfield.toml instead (that file's own header comment
#     explicitly confirms it as "NOT a station in
#     southern-brighton-main-line.toml's own list" and takes ownership of
#     it as the Oxted line's own junction point) - not re-added here.
#   - London Road (Brighton) (between Preston Park and Brighton): already
#     modelled in southern-coastway-east.toml as the East Coastway line's
#     own first stop out of Brighton, a physically different route from this
#     file's own main-line approach into Brighton - not re-added here.
# ============================================================================
[[stations]]
crs = "VIC"
role = "terminus"
segment = "southern-bml-victoria"
# London Victoria. Gatwick Express's usual London terminus; Thameslink does
# not call here at all (it's a different, cross-London-core route via St
# Pancras/Blackfriars/London Bridge) - so this approach is Southern/GX-only,
# unlike the London Bridge approach below.

[[stations]]
crs = "CLJ"
role = "junction"
segment = "southern-bml-victoria"
# Clapham Junction. TASK 5.4 FILL-IN: confirmed via Wikipedia's "Brighton
# Main Line" article and independent web-search corroboration that "the
# fastest services from Brighton to Victoria call only at East Croydon and
# Clapham Junction" - i.e. it is a genuine, principal calling point on this
# line's own Victoria approach, not a minor/non-principal stop that was
# correctly excluded. CRS code CLJ (TIPLOC CLPHMJC) reused unchanged from
# swr-south-west-main.toml, where it's already independently confirmed -
# also cross-checked directly here against nationalrail.co.uk's own
# stations/clj/details.html page. Sits strictly between VIC and East Croydon
# on the Victoria approach only (the London Bridge approach below does not
# touch it), so it inherits `southern-bml-victoria` rather than needing a
# new segment. Station overlap only with swr-south-west-main.toml's own
# `swr-trunk-waterloo` segment and the Overground files' own segments at
# this station (different physical lines/platforms converging only at the
# station building) - not a shared segment.

[[stations]]
crs = "LBG"
role = "terminus"
segment = "southern-bml-north"
# London Bridge. Also thameslink-core.toml's own terminus (its own segment
# already ends here) - station overlap only against that file's segment,
# same precedent as thameslink-core/southeastern-main-line elsewhere in this
# catalogue. See the SEGMENT NAMING comment above for why this station's OWN
# segment here (`southern-bml-north`) is only a PROPOSED courtesy hand-off
# name for Task 5.14, resting on an unconfirmed-to-bar Wikipedia-only
# finding - not a confirmed cross-file shared trunk.

[[stations]]
crs = "ECR"
role = "junction"
segment = "southern-bml-north"
# East Croydon. Junction station per the shared-trunk rule of thumb
# (SCHEMA.md): belongs to the shared/hand-off segment, not the exclusive
# one below it. Victoria and London Bridge approaches (via Windmill Bridge
# Jn, see above) converge here; the Quarry Line/Redhill alignment also
# diverges near here - now modelled below, see PURLEY-HORLEY REDHILL
# ALIGNMENT.

# ============================================================================
# PURLEY-HORLEY REDHILL ALIGNMENT (review2-se-southern) - real bug fix
# ============================================================================
# Task 5.4's own FILL-IN note (above) excluded Purley, Coulsdon South,
# Merstham, Redhill, Earlswood, Salfords and Horley as belonging to "a
# genuinely different physical stopping pattern" and treated that as
# out-of-scope new-line-work. On review that framing was wrong: this is not
# a separate line, it is this line's own "slow"/Redhill-alignment stopping
# pattern - real-world "disruption between East Croydon and Gatwick
# Airport" incident reporting is routinely about exactly this stretch, and
# Horley (HOR) was entirely absent from every file in this catalogue before
# this fix despite being a real, current, Southern-managed Brighton Main
# Line station.
#
# Independently re-verified (fresh research, not reused from the earlier
# exclusion): Wikipedia's "Brighton Main Line" article confirms the line
# "serves... the towns of Redhill, Horley, Crawley, Haywards Heath and
# Burgess Hill" - i.e. Redhill and Horley are themselves named as Brighton
# Main Line stations in the line's own top-level description, not a
# different line. Redhill's own Wikipedia article confirms it as "a major
# interchange point on the Brighton Main Line" with Merstham to the north
# and Earlswood (then Horley, then Gatwick Airport) to the south. Horley's
# own Wikipedia article confirms it is on the Brighton Main Line, managed
# by Southern, served by Southern and Thameslink, with Salfords/Redhill to
# the north and Gatwick Airport to the south. Purley's own junction role
# (Brighton Main Line, with the Caterham/Tattenham Corner branches diverging
# there) is already independently confirmed by southern-caterham.toml's own
# sourcing. All seven CRS codes below (PUR, CDS, MHM, RDH, ELD, SAF, HOR)
# were re-verified live against https://ds.cursed.solutions/api/stations -
# note ELD is "Earlswood Surrey" (distinct from an unrelated West Midlands
# Earlswood, EWD) and SAF is "Salfords (Surrey)".
#
# THE QUARRY LINE BYPASS: the reason this stretch was ever treated as a
# separate stopping pattern is real - the Quarry Line is a pair of tunnels
# (Quarry Tunnel, Merstham Tunnel) that let faster/express Brighton Main
# Line services bypass Redhill's own junction congestion entirely, diverging
# from the slow lines somewhere south of Purley/Coulsdon and rejoining
# around Earlswood/Salfords before Gatwick Airport. This fast alignment is
# what `southern-bml-south`'s existing GTW-onward station list already
# represents (ECR -> GTW directly, no Purley/Redhill stop). The station list
# below is the OTHER, calling-pattern alignment that the same "East Croydon
# to Gatwick Airport" corridor also genuinely covers - both are real,
# concurrent Brighton Main Line stopping patterns, not a replacement for
# each other. The exact tunnel-portal junction names/mileages for where the
# two alignments diverge and rejoin were not pinned down to a non-Wikipedia
# source in this pass (no CRS code exists for them either way, so nothing
# unmodelled is missing from `[[stations]]`); this comment records the
# bypass relationship for a future task that wants to chase that down
# further, per this catalogue's usual hand-off convention.
#
# SEGMENT: new `southern-bml-redhill`, this file's own name (not reused from
# any sibling file), starting immediately past the ECR junction per the
# shared-trunk rule of thumb - same convention `southern-bml-south` (the
# Quarry Line alignment) already uses for its own branch off the same
# junction. Two exclusive segments now hang off `southern-bml-north`'s own
# ECR entry, one per real alignment.
#
# STATION OVERLAP:
#   - PUR (Purley): also southern-caterham.toml's and
#     southern-tattenham-corner.toml's own station, on their shared
#     `southern-purley-branches` segment (the Caterham/Tattenham Corner
#     branches diverging off the Brighton Main Line here) - station overlap
#     only, per the xc-south-coast.toml/xc-manchester.toml precedent used
#     throughout this catalogue; this file's own `southern-bml-redhill`
#     segment name is not reused there and vice versa.
#   - RDH (Redhill): also swr-north-downs.toml's own terminus, on that
#     file's `north-downs-guildford-redhill` segment - that file's own RDH
#     comment already anticipated this exact fix ("Southern's own approach
#     into Redhill is via the separate Purley/Coulsdon South corridor...not
#     this line's own metals") and correctly treats it as station overlap
#     only, which this file's own `southern-bml-redhill` segment name
#     preserves (not reused either direction).
#   - No other CRS code below (CDS, MHM, ELD, SAF, HOR) appears in any other
#     `lines/*.toml` file (grepped catalogue-wide before drafting) - Horley
#     in particular was confirmed completely absent from the catalogue
#     before this fix, per the review that flagged this gap.
# ============================================================================
[[stations]]
crs = "PUR"
role = "junction"
segment = "southern-bml-redhill"
# Purley. Junction with the Caterham/Tattenham Corner branches - station
# overlap only with southern-caterham.toml/southern-tattenham-corner.toml,
# see PURLEY-HORLEY REDHILL ALIGNMENT above.

[[stations]]
crs = "CDS"
role = "minor"
segment = "southern-bml-redhill"
# Coulsdon South.

[[stations]]
crs = "MHM"
role = "minor"
segment = "southern-bml-redhill"
# Merstham.

[[stations]]
crs = "RDH"
role = "major"
segment = "southern-bml-redhill"
# Redhill. Major interchange (North Downs Line toward Guildford/Reading,
# Redhill-Tonbridge line toward Tonbridge, neither modelled by this file) -
# station overlap only with swr-north-downs.toml's own terminus here, see
# PURLEY-HORLEY REDHILL ALIGNMENT above.

[[stations]]
crs = "ELD"
role = "minor"
segment = "southern-bml-redhill"
# Earlswood (Surrey) - confirmed distinct from an unrelated West Midlands
# station of the same name; CRS ELD, not EWD.

[[stations]]
crs = "SAF"
role = "minor"
segment = "southern-bml-redhill"
# Salfords (Surrey).

[[stations]]
crs = "HOR"
role = "major"
segment = "southern-bml-redhill"
# Horley. Was entirely absent from every file in this catalogue before this
# fix - see PURLEY-HORLEY REDHILL ALIGNMENT above. Exclusive segment ends
# here; this alignment rejoins the Brighton Main Line's approach to Gatwick
# Airport just south of here (see the Quarry Line bypass note above), but
# Gatwick Airport itself (GTW, next) is already `southern-bml-south`'s own
# station, so no new entry is needed for it on this segment.

[[stations]]
crs = "GTW"
role = "major"
segment = "southern-bml-south"
# Gatwick Airport. Also served by Thameslink and Great Western Railway
# (neither modelled by this file); the exclusive segment for this line
# starts here, one station past the ECR junction, per the shared-trunk rule
# of thumb. Also the point where the southern-bml-redhill alignment above
# rejoins this line's own approach into Gatwick.

[[stations]]
crs = "TBD"
role = "junction"
segment = "southern-bml-south"
# Three Bridges. The Arun Valley line (toward Horsham/Littlehampton)
# diverges here; not covered by this catalogue.

[[stations]]
crs = "HHE"
role = "major"
segment = "southern-bml-south"
# Haywards Heath.

[[stations]]
crs = "WVF"
role = "minor"
segment = "southern-bml-south"
# Wivelsfield. TASK 5.4 FILL-IN: confirmed via its own Wikipedia infobox/
# article ("situated between Haywards Heath and Burgess Hill stations on
# the main line"; "managed by Southern, which is one of two companies
# serving Wivelsfield, the other being Thameslink") and independently
# cross-checked against nationalrail.co.uk's own stations/wvf/details.html
# page (CRS WVF, operator Southern). Genuinely Southern-served, unlike
# Balcombe (the Three Bridges-Haywards Heath stretch's own Thameslink-only
# station - see header comment) - not a candidate for the same exclusion.

[[stations]]
crs = "BUG"
role = "minor"
segment = "southern-bml-south"
# Burgess Hill. Wikipedia describes this as a peak-only Gatwick Express
# calling point (unconfirmed to this batch's bar - see fold-in note above);
# it is a principal Brighton Main Line station regardless.

[[stations]]
crs = "HSK"
role = "minor"
segment = "southern-bml-south"
# Hassocks. Same peak-only Gatwick Express caveat as Burgess Hill above.

[[stations]]
crs = "PRP"
role = "minor"
segment = "southern-bml-south"
# Preston Park. Same peak-only Gatwick Express caveat as Burgess Hill above.

[[stations]]
crs = "BTN"
role = "terminus"
segment = "southern-bml-south"
# Brighton.

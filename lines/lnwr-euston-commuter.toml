id = "lnwr-euston-commuter"
name = "London Northwestern Railway: Euston-Northampton"
mode = "national-rail"
category = "commuter"
operators = [
  "LM",  # West Midlands Trains, single ATOC code covering both the West
  # Midlands Railway and London Northwestern Railway brands -- per the
  # resolution already recorded in `west-coast-main-line.toml`'s own
  # `operators` comment (Task 1.0) and reused verbatim by `wmr-cross-city.toml`
  # / `wmr-snow-hill.toml` (Tasks 1.5/1.6). Independently re-checked here too:
  # a live fetch of railwaycodes.org.uk's operators/toccodes.shtm page
  # (2026-08-30) lists "LM" as the code actively used in GBTT/eNRT for both
  # "West Midlands Railway, London Northwestern Railway" (current and prior
  # franchise entries), and separately lists "LN" allocated to "London
  # Northwestern Railway" but explicitly annotated "code not yet used in
  # GBTT/eNRT, LM used for all West Midlands Trains/WM Trains services" --
  # same conclusion as Task 1.0, now confirmed a second time from this file.
]

# Route research (Step 1), fetched live 2026-08-30, cross-checked across
# multiple independent sources:
#   1. Wikipedia's "London Northwestern Railway" article's Services section
#      lists three distinct West Coast Main Line-area local/semi-fast route
#      tables run by this brand: (a) Euston-Milton Keynes Central all-stations
#      local (2tph: Harrow & Wealdstone, Bushey, Watford Junction, Kings
#      Langley, Apsley, Hemel Hempstead, Berkhamsted, Tring, Cheddington,
#      Leighton Buzzard, Bletchley); (b) Euston-Birmingham New Street
#      semi-fast (2tph, 1tph of it via Watford Junction only: Watford
#      Junction, Leighton Buzzard, Bletchley, Milton Keynes Central,
#      Wolverton, Northampton, Long Buckby, Rugby, Coventry, Canley, Tile
#      Hill, Berkswell, Hampton-in-Arden, Birmingham International, [New
#      Street]); (c) Euston-Crewe via the Trent Valley Line (1tph: Milton
#      Keynes Central, Rugby, Nuneaton, Atherstone, Tamworth, Lichfield
#      Trent Valley, Rugeley Trent Valley, Stafford, [Crewe]) -- explicitly
#      the direct/fast route, NOT via the Northampton Loop.
#   2. This file models the Northampton-bound semi-fast pattern (route (b)
#      above), truncated at Northampton -- the continuation beyond
#      Northampton to Birmingham belongs to Task 1.8's
#      `lnwr-birmingham-crewe.toml`, per this batch's task split. Station
#      CRS codes EUS/WFJ/MKC are already-curated facts, reused verbatim from
#      `west-coast-main-line.toml` (including its `tiploc` values). LBZ
#      (Leighton Buzzard), BLY (Bletchley), WOL (Wolverton) and NMP
#      (Northampton) were each independently confirmed live via their own
#      nationalrail.co.uk /stations/<CRS>/details.html page (2026-08-30) --
#      the same per-station cross-check method `wmr-cross-city.toml` used.
#      No TIPLOC could be confirmed for these four to the same standard
#      (railwaycodes.org.uk's TIPLOC tables are split across alphabetical
#      pages and weren't fetched individually for this pass), so `tiploc`
#      is omitted for them rather than guessed.
#
# LNWR-internal segment-sharing ruling (this batch's pre-flight conflict
# scan asked this task to positively check it): YES, confirmed. Comparing
# the three route tables in source 1 above, Euston, Watford Junction,
# Leighton Buzzard, Bletchley and Milton Keynes Central are common calling
# points across this line (Northampton-bound) AND route (c) (Crewe-bound,
# via the Trent Valley Line) -- i.e. every LNWR local/semi-fast working out
# of Euston runs the same physical stretch as far as Milton Keynes Central
# before diverging. This is independently corroborated by Wikipedia's "West
# Coast Main Line" article, which describes Hanslope Junction (just north of
# Milton Keynes/Wolverton) as the physical point where "the line divides
# with one pair going direct to Rugby and the other pair diverting via
# Northampton to rejoin at Rugby" -- i.e. the Crewe-bound direct/fast route
# and the Northampton Loop used by this line physically part ways just
# beyond Milton Keynes Central, matching the brief's own guess almost
# exactly ("plausibly Euston-Milton Keynes"). This is also genuinely
# LNWR-internal and distinct from the existing WCML overlap: `wcml`'s own
# `wcml-london` segment only carries EUS/WFJ/HMP/TRI (Hemel Hempstead and
# Tring are on WCML's coarser stopping pattern, not this semi-fast one),
# and doesn't model Leighton Buzzard, Bletchley or Milton Keynes Central's
# junction role at all in that granularity.
#
# Segment name chosen for the shared stretch: `lnwr-euston-trunk`, covering
# EUS through MKC below (grep-checked against every `lines/*.toml` file
# before choosing it -- no collision). Per the shared-trunk rule of thumb,
# Milton Keynes Central (the Hanslope Junction-area divergence point) stays
# on this shared segment; this line's own exclusive segment,
# `lnwr-northampton`, starts at the next station, Wolverton.
#
# NOTE FOR TASK 1.8 (`lines/lnwr-birmingham-crewe.toml`, not yet written
# when this file was authored): reuse `lnwr-euston-trunk` verbatim for
# whichever of EUS/WFJ/LBZ/BLY/MKC your file also lists, so the shared
# segment is real on both sides -- this is what makes an incident at, say,
# Leighton Buzzard propagate to both LNWR files as `SharedSegment`. One
# further wrinkle this file deliberately leaves open rather than
# pre-deciding: source 1(b) above shows the real Birmingham-bound semi-fast
# also calls at Wolverton and Northampton (this line's own exclusive
# `lnwr-northampton` segment) on its way through to Long Buckby/Rugby/
# Coventry/Birmingham -- so if your file also models a Birmingham-via-
# Northampton working stopping at WOL/NMP, those two stations may belong on
# a *shared* segment between the two files too (not exclusive to this one),
# which would mean `lnwr-northampton` should be reused rather than treated
# as this line's private segment. Evaluate that against whatever station
# granularity you choose for the Birmingham branch before deciding; don't
# assume exclusivity here without rechecking.

destination_crs_filter = ["NMP"]
sample_stations = ["EUS", "MKC", "NMP"]
# No match_keywords: no confirmed Knowledgebase-used route name for this
# specific working (the "Northampton Loop Line" name only appears in
# infrastructure-description sources, not confirmed against an actual
# incident message), and a generic word like "Northampton" would be a weak,
# ambiguous match on its own. Station and operator evidence carries it,
# same reasoning `xc-manchester.toml`/`wcml-birmingham.toml` already used.

# London Euston to Northampton, ordered south-east to north-west (source 1
# above). Minor intermediate all-stations-only calls (Harrow & Wealdstone,
# Bushey, Kings Langley, Apsley, Hemel Hempstead, Berkhamsted, Tring,
# Cheddington -- all on the separate Euston-Milton Keynes all-stations local
# pattern, route (a) above, not this semi-fast one) are omitted, following
# the "principal stations only" convention `xc-manchester.toml` and
# `wcml-birmingham.toml` already set for a semi-fast/limited-stop pattern.
[[stations]]
crs = "EUS"
tiploc = "EUSTON"
role = "terminus"
segment = "lnwr-euston-trunk"

[[stations]]
crs = "WFJ"
tiploc = "WATFDJ"
role = "major"
segment = "lnwr-euston-trunk"

[[stations]]
crs = "LBZ"
role = "minor"
segment = "lnwr-euston-trunk"

[[stations]]
crs = "BLY"
role = "minor"
segment = "lnwr-euston-trunk"

[[stations]]
crs = "MKC"
tiploc = "MKNSCEN"
role = "junction"
segment = "lnwr-euston-trunk"

[[stations]]
crs = "WOL"
role = "minor"
segment = "lnwr-northampton"

[[stations]]
crs = "NMP"
role = "terminus"
segment = "lnwr-northampton"
# Some real-world workings continue beyond here to Birmingham New Street
# via Long Buckby/Rugby/Coventry -- not modelled in this file, see Task 1.8
# note above.

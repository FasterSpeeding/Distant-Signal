id = "greater-anglia-wherry-lines"
name = "Wherry Lines (Norwich - Great Yarmouth / Lowestoft)"
mode = "national-rail"
category = "regional"
operators = ["LE"]
# LE = Greater Anglia's ATOC code, already verified and cited in
# greater-anglia-main-line.toml -- not re-derived here.

# Split out of the former `greater-anglia-norfolk-branches.toml` (real-world
# sanity review): that file bundled three unrelated, separately
# community-rail-branded Greater Anglia routes (Bittern, Wherry, Breckland)
# under a single "Norfolk Branch Lines" umbrella that nobody uses. A single
# incident on any one of the three reported as a disruption on all three.
# Split one file per real brand, matching this session's EMR/TfW split
# precedent. Station data, CRS codes and segment names below are reused
# verbatim from the original file -- redistributed, not re-researched.

sample_stations = ["GYM", "LWT"]
match_keywords = ["Wherry Lines"]

# Each of the three routes is "1 per hour in each direction" except the
# Berney Arms route's 3/day rump service -- unchanged from the original
# bundled file's reasoning (northern-lakes.toml/northern-tyne-valley.toml
# branch-line pattern): one cancellation is a large fraction of the hour's
# service, and a 5-minute delay on a short branch journey isn't yet a story
# at config.py's base thresholds.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# ## Wherry Lines (Norwich-Great Yarmouth / Norwich-Lowestoft) -- a genuine
# three-way branching structure, verified rather than assumed
#
# Live research (Wikipedia's "Wherry Lines" article, fetched raw, plus each
# individual junction station's own route-diagram fields, fetched raw)
# shows this is neither one branch nor a simple two-way split, but three
# distinct routes sharing a common Norwich-Brundall trunk, forking at TWO
# junctions:
#
# - At Brundall: the Great Yarmouth-via-Acle route diverges (Brundall's own
#   route-diagram fields give `next1=Lingwood ... (via Acle)` and
#   `next2=Buckenham ... (via Reedham)`, i.e. Brundall itself is the first
#   fork). The Wherry Lines article's own infrastructure section confirms:
#   "the two branches to Great Yarmouth that diverge from Brundall, the
#   route via Acle and from Reedham via Berney Arms, are single-tracked."
# - The remaining double-tracked spine continues Brundall-Buckenham-Cantley-
#   Reedham (this stretch carries both the Lowestoft-bound and the Berney
#   Arms-bound Great Yarmouth trains).
# - At Reedham: the second fork. Reedham's own route-diagram fields give
#   `next1=Berney Arms ... Great Yarmouth branch` and `next2=Haddiscoe ...
#   Lowestoft branch`.
# - Beyond Reedham, the Lowestoft branch continues via Haddiscoe-
#   Somerleyton-Oulton Broad North to Lowestoft.
#
# The Wherry Lines article's own service table confirms the three
# resulting routes and their frequencies: Lowestoft-Norwich (hourly, via
# Oulton Broad North/Somerleyton/Haddiscoe/Reedham/Cantley/Brundall), Great
# Yarmouth-Norwich via Acle (hourly, via Lingwood/Brundall/Brundall
# Gardens) and Great Yarmouth-Norwich via Berney Arms (3 per day, via
# Reedham/Cantley/Brundall). Buckenham (not in that summary service table,
# but confirmed as a genuine current stop by the article's own "lightly
# served" infrastructure note -- "two trains call on weekdays and
# Saturdays, with thirteen on Sundays" -- and by its own Wikipedia
# route-diagram fields) is included between Brundall and Cantley.
#
# Segments (junction-station-belongs-to-the-wider-segment pattern):
# - `wherry-trunk-brundall` (Norwich through Brundall): shared by all three
#   routes.
# - `wherry-acle-branch` (Lingwood, Acle, Great Yarmouth): exclusive to the
#   Acle route, starts at the station after the Brundall junction.
# - `wherry-trunk-reedham` (Buckenham, Cantley, Reedham): the continuing
#   spine shared by the Berney Arms and Lowestoft routes only (NOT the Acle
#   route, which has already diverged at Brundall).
# - `wherry-berney-branch` (Berney Arms only): exclusive to the Berney Arms
#   route, starts at the station after the Reedham junction.
# - `wherry-lowestoft-branch` (Haddiscoe, Somerleyton, Oulton Broad North,
#   Lowestoft): exclusive to the Lowestoft route, starts at the station
#   after the Reedham junction.
#
# All five segment names are internal to this one file, so every incident
# here resolves as this line's own `MatchScope::ExclusiveSegment`, not a
# cross-file shared trunk.
#
# Great Yarmouth (GYM) is physically the terminus of BOTH the Acle route
# and the Berney Arms route -- a genuine reconvergence. Listing it twice
# would give the same CRS two different `segment` values in one file;
# `common::LineDefinition::segment_for` (first match wins) and
# `segments.rs`'s `SegmentRegistry` (last-inserted-per-line wins, since
# `station_segments` is a HashMap keyed by `(line_id, crs)`) would then
# disagree about which segment "owns" GYM, and worse, silently depend on
# file ordering. GYM is therefore listed once, as the Acle route's
# terminus (the busier, hourly service), with a comment on the Berney Arms
# branch noting the real-world reconvergence rather than re-listing the
# CRS.
#
# CRS codes verified from each station's own Wikipedia infobox `code`
# field: Brundall Gardens (BGA), Brundall (BDA), Lingwood (LGD), Acle
# (ACL), Great Yarmouth (GYM), Buckenham (BUC), Cantley (CNY), Reedham
# (REE), Berney Arms (BYA), Haddiscoe (HAD), Somerleyton (SYT), Oulton
# Broad North (OUN), Lowestoft (LWT).
#
# Lowestoft (LWT) is also now `greater-anglia-east-suffolk.toml`'s own
# terminus (catalogued after this route was first drafted), reached from
# the south via Beccles and Oulton Broad *South* -- a genuine terminal
# convergence at Lowestoft itself, not a shared segment; see that file's
# own Overlap 2 note. Oulton Broad North (this file) and Oulton Broad South
# (that file) are two distinct, separately CRS-coded stations.
#
# ## Segment decision at Norwich: station-level overlap only, NOT a shared
# segment name
#
# Norwich is this line's own shared origin with the (now separately
# catalogued) Bittern and Breckland lines, and is also the terminus of
# `greater-anglia-main-line.toml`'s `geml-mainline` segment and
# `emr-regional.toml`'s own `emr-regional-east` segment. Per the original
# bundled file's own ruling (reusing `geml-mainline` would wrongly
# reclassify unrelated far-flung stations as shared trunk too), Norwich is
# folded into this file's own `wherry-trunk-brundall` segment (extended to
# include NRW as its first station) rather than a separate shared-with-
# siblings segment name. Since `wherry-trunk-brundall` is not reused by
# `greater-anglia-bittern-line.toml` or `greater-anglia-breckland-line.toml`
# (each has its own distinct segment names), this does NOT create an
# accidental shared trunk between the three new files -- an incident at
# Norwich still matches all of them independently, each as
# `MatchScope::ExclusiveSegment`, exactly as the original bundled file's
# own tests intended.

# --- Norwich-Brundall (shared trunk of all three routes) ---

[[stations]]
crs = "NRW"
tiploc = "NRCH"
role = "junction"
segment = "wherry-trunk-brundall"
# Terminus of greater-anglia-main-line.toml's `geml-mainline` and the
# shared origin of the (separately catalogued) Bittern and Breckland
# lines. Station-level overlap only -- see the segment-decision note above.

[[stations]]
crs = "BGA"
role = "minor"
segment = "wherry-trunk-brundall"
# Brundall Gardens.

[[stations]]
crs = "BDA"
role = "junction"
segment = "wherry-trunk-brundall"
# Brundall: the Great Yarmouth-via-Acle route diverges here. Last station
# of this trunk; the Acle route's own exclusive segment starts at the next
# station.

# --- Great Yarmouth via Acle (exclusive, hourly) ---

[[stations]]
crs = "LGD"
role = "minor"
segment = "wherry-acle-branch"

[[stations]]
crs = "ACL"
role = "minor"
segment = "wherry-acle-branch"

[[stations]]
crs = "GYM"
role = "terminus"
segment = "wherry-acle-branch"
# Great Yarmouth: also the physical terminus of the separate Berney Arms
# route below (a genuine reconvergence) -- see the segment note above for
# why GYM is listed once here rather than duplicated.

# --- Brundall-Reedham (shared trunk of the Berney Arms and Lowestoft
# routes only -- the Acle route has already diverged at Brundall) ---

[[stations]]
crs = "BUC"
role = "minor"
segment = "wherry-trunk-reedham"
# Buckenham: lightly served (two trains call on weekdays/Saturdays,
# thirteen on Sundays) but a genuine current stop.

[[stations]]
crs = "CNY"
role = "minor"
segment = "wherry-trunk-reedham"

[[stations]]
crs = "REE"
role = "junction"
segment = "wherry-trunk-reedham"
# Reedham: the Great Yarmouth-via-Berney Arms route diverges here. Last
# station of this trunk; the Berney Arms and Lowestoft routes' own
# exclusive segments start at the next station on each.

# --- Great Yarmouth via Berney Arms (exclusive, ~3/day) ---

[[stations]]
crs = "BYA"
role = "minor"
segment = "wherry-berney-branch"
# Berney Arms: one of the most remote and lightly-used stations in Britain
# (request stop, no road access). This route's real terminus is Great
# Yarmouth (GYM), already listed above under the Acle branch -- not
# duplicated here, see the segment note above.

# --- Lowestoft (exclusive, hourly) ---

[[stations]]
crs = "HAD"
role = "minor"
segment = "wherry-lowestoft-branch"

[[stations]]
crs = "SYT"
role = "minor"
segment = "wherry-lowestoft-branch"

[[stations]]
crs = "OUN"
role = "minor"
segment = "wherry-lowestoft-branch"

[[stations]]
crs = "LWT"
role = "terminus"
segment = "wherry-lowestoft-branch"
# Also greater-anglia-east-suffolk.toml's own terminus, reached from the
# south via a different physical approach -- a genuine terminal
# convergence, not a shared segment. See the note above.

id = "gwr-st-ives-bay"
name = "St Ives Bay Line"
mode = "national-rail"
category = "regional"
operators = ["GW"]

# Devon/Cornwall branch-line batch: full UK station-coverage audit found this
# real, currently-open GWR branch (St Erth - St Ives) entirely missing from
# the catalogue. Wikipedia "St Ives Bay Line" infobox: GWR operator, "Single
# track (rail) throughout", 5 stations, "Rural" character; the line
# "continues to operate as a community railway, carrying tourists as well as
# local passengers."
#
# Category: "regional", matching this catalogue's precedent for a
# single-track rural/community branch (`northern-furness.toml`,
# `scotrail-kyle.toml`), confirmed rather than assumed via the infobox's own
# "Rural" character field.

# Exclusive-segment stations only (St Erth is the shared junction with the
# Cornish Main Line, left off in favour of stations only this line reaches).
sample_stations = ["LEL", "CBB", "SIV"]

# St Erth (SER) is also a `gwr-cornish-main-line.toml` sample/CRS entry.
# `destination_crs_filter` disambiguates this branch's own LDBWS departures
# (bound for SIV) from Cornish Main Line services calling at St Erth,
# mirroring `scotrail-ayrshire.toml`'s identical use of the field at GLC.
destination_crs_filter = ["SIV"]

match_keywords = ["St Ives Bay Line"]
# One high-precision phrase -- the line's own branded/article name. Grepped
# `lines/*.toml` before starting: no other file uses "St Ives" in
# `match_keywords`.

# Single track throughout the entire line -- unlike `gwr-maritime-line.toml`
# (which has a mid-route passing loop at Penryn), this line has no passing
# loop at all, so a delayed or cancelled working anywhere on it blocks the
# whole 4-mile branch until cleared, despite a comparatively busy timetable
# (28 trains each way on weekdays per Wikipedia's own current-operations
# note). Same tuned thresholds as `northern-furness.toml`/
# `scotrail-kyle.toml`'s comparable rural single-track branches.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

[[stations]]
crs = "SER"
role = "junction"
segment = "gwr-st-ives-bay"
# St Erth: the real junction with the Cornish Main Line. Also a station
# entry (role "junction", segment "gwr-cornish-main-line") in
# `gwr-cornish-main-line.toml`, whose own comment there already flags it as
# "the junction for the St Ives Bay Line (out of this task's scope, not
# claimed here)" -- station overlap only, per this catalogue's established
# convention (`xc-south-coast.toml`/`xc-manchester.toml` precedent): no
# shared-segment name is reused here, since the two lines' own physical
# routes diverge immediately past St Erth.

[[stations]]
crs = "LTS"
role = "minor"
segment = "gwr-st-ives-bay"
# Lelant Saltings: originally opened with a large car park as a Park and
# Ride facility for St Ives, per Wikipedia; that Park and Ride function
# moved to St Erth in June 2019, but the station itself remains open and
# served (confirmed via the CRS lookup below).

[[stations]]
crs = "LEL"
role = "minor"
segment = "gwr-st-ives-bay"
# Lelant.

[[stations]]
crs = "CBB"
role = "minor"
segment = "gwr-st-ives-bay"
# Carbis Bay: called at by all trains on the line, per Wikipedia.

[[stations]]
crs = "SIV"
role = "terminus"
segment = "gwr-st-ives-bay"
# St Ives: this line's own terminus.

# === Sources (cross-checked per this batch's Global Constraints) ===
#
# Route structure, operator, character, service pattern:
#   - Wikipedia "St Ives Bay Line" (infobox + lead + body, fetched fresh for
#     this task): confirms GWR operation, single track throughout, "Rural"
#     character, "stations = 5"; confirms the ordered station list St Erth -
#     Lelant Saltings - Lelant - Carbis Bay - St Ives; confirms current
#     service level ("GWR operated 28 trains each way on weekdays, 26 on
#     Saturdays and 19 on Sundays", winter 2026 timetable) and that "all
#     trains serve Carbis Bay; approximately half call at Lelant; Lelant
#     Saltings receives just one train in each direction daily"; confirms
#     the Lelant Saltings Park and Ride history (opened, then relocated to
#     St Erth in June 2019).
#
# CRS codes: every code below was verified live against
# `https://ds.cursed.solutions/api/stations?q=<name>` during this task --
# SER "St Erth", LTS "Lelant Saltings", LEL "Lelant", CBB "Carbis Bay", SIV
# "St Ives (Cornwall)". All matched with no discrepancies.
#
# TIPLOCs are omitted throughout: none were confirmed against a live source
# during this task, matching this batch's optional-field convention.
#
# === Scope boundaries (documented, not modelled) ===
#
# - The Cornish Main Line itself (St Erth onward to Penzance, or east to
#   Plymouth): already catalogued in `gwr-cornish-main-line.toml`; not
#   re-derived here beyond the station-overlap note above.
# - Whether Lelant Saltings' single daily each-way service is formally a
#   request stop was not confirmed to this task's two-source bar; it is
#   listed here as a real, currently-served, low-frequency station rather
#   than guessed at as a request stop.

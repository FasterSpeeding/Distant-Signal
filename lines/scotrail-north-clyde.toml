id = "scotrail-north-clyde"
name = "ScotRail North Clyde Line"
mode = "national-rail"
category = "commuter"
operators = ["SR"]

# Split out of the former `scotrail-glasgow-suburban.toml` (Task 10.2 of the
# Batch 10 ScotRail line-catalogue effort) per a line-definition audit's
# recommendation (2026-09-21) that found that file -- at 62 stations, the
# largest in the whole catalogue -- bundling two independently-branded
# ScotRail lines with their own real-world identities and their own
# Wikipedia articles ("North Clyde Line" and "Argyle Line (Glasgow)") under
# one generic "Glasgow Suburban" id. This file models the North Clyde Line
# (the Glasgow Queen Street Low Level-hubbed network, with its Milngavie,
# Balloch, Helensburgh, Springburn and Airdrie branches); the Argyle Line
# (the Glasgow Central Low Level-hubbed network) is now `scotrail-
# argyle.toml`. All sourcing below is carried over unchanged from the
# original file's own research -- nothing new was fetched for the split
# itself, only redistributed to whichever line it actually documents.
#
# Original Task 10.2 background, preserved: gap analysis source
# docs/superpowers/specs/2026-08-29-line-coverage-gap-analysis.md,
# "ScotRail" section (a): "extensive Glasgow suburban electric network
# (North Clyde, Argyle Line)" -- explicitly listed separately from the
# Ayrshire Coast/Glasgow South Western Line (Ayr/Stranraer/Girvan), which
# is its own gap-analysis item and is not modelled here.
#
# Category: "commuter", per the original brief's own steer, confirmed
# rather than assumed -- this network is uniformly dense electric suburban
# working (multiple trains per hour, short inter-station hops, urban/
# suburban stopping pattern throughout), unlike `northern.toml`'s
# "operator" category and unlike `scotrail-central-belt.toml`'s "main-line"
# category (the Edinburgh-Glasgow flagship inter-city corridor).
# `thameslink-core.toml` is the closest structural comparison: a dense,
# multi-branch electric metro-style network under one TOC.

sample_stations = ["GLQ", "PTK", "DMR", "MLN"]
match_keywords = ["North Clyde Line", "North Clyde"]
# Two high-precision phrases per the curation rule against padding
# match_keywords: the line's own Wikipedia article title ("North Clyde
# Line") plus the shorter brand name used in ScotRail/Network Rail incident
# language. Neither collides with anything else in the catalogue (no other
# line uses "Clyde"). "Argyle Line" -- the original bundled file's other
# keyword -- now belongs solely to `scotrail-argyle.toml`.

# Commuter line: tighter thresholds, following `thameslink-core.toml`'s
# precedent for a dense multi-branch metro-style network -- a short delay
# on a service running every 15-30 minutes at peak is more disruptive than
# the same delay on an hourly regional service. Unchanged from the original
# bundled file (both halves of that file shared this same override block,
# and both resulting lines keep it).
[severity_overrides]
minor_delays_pct = 0.20
delay_threshold_minutes = 4

# === Sources (cross-checked per the plan's Global Constraints; carried
#     over verbatim from `scotrail-glasgow-suburban.toml`, filtered to what
#     actually documents this line's own stations) ===
#
# Route/branch structure:
#   - Wikipedia "North Clyde Line" (raw wikitext, Route and History
#     sections): confirms the line runs from Glasgow Queen Street (Low
#     Level) to four western termini -- Helensburgh Central, Balloch,
#     Dalmuir and Milngavie -- via two alternative Partick-Dalmuir
#     routings (via Singer or via Yoker); an eastern short branch to
#     Springburn with a Cumbernauld Line interchange there; and that the
#     Partick-Dalmuir/Milngavie section is also used by Argyle Line
#     services (see the scope-boundary note below for how this split
#     handles that overlap).
#   - Wikipedia "Dalmuir railway station": confirms Dalmuir is "a large,
#     five-platform interchange" where North Clyde, Argyle Line and West
#     Highland Line services meet, with onward North Clyde service to
#     Helensburgh Central and Balloch.
#   - Wikipedia "Craigendoran railway station": confirms it sits on the
#     North Clyde Line between Helensburgh Central and Cardross, and that
#     "the present layout at the junction, just east of the station,
#     consists of a loop (available to West Highland Line trains only)"
#     -- i.e. this is where the West Highland Line begins.
#   - Wikipedia "Bellgrove railway station": confirms Bellgrove is where
#     eastbound North Clyde services split three ways -- "every fifteen
#     minutes towards Airdrie, half-hourly towards Springburn and hourly
#     to Edinburgh Waverley" (the last of those is the Bathgate routing,
#     now modelled in full by `scotrail-bathgate.toml`, not this file).
#   - Wikipedia "Springburn railway station": confirms it "is a terminus
#     of the Springburn branch, a spur from Bellgrove station, on the
#     North Clyde Line" -- not a through station on the way to Airdrie.
#   - Wikipedia "Dalreoch railway station" (added in fix round 1, post-
#     review of the original file): confirms Dalreoch, not Dumbarton
#     Central, is the real Balloch/Helensburgh split point.
#   - Wikipedia "Hyndland railway station" (added in fix round 1): confirms
#     the Milngavie/Yoker/Singer split is at "Hyndland East Junction",
#     immediately west of the station.
#   - (Task 3.1, station-catalogue-completeness plan) Every individual
#     station's own Wikipedia article (infobox + succession box) for the
#     FILL-IN and BRANCH-RESEARCH stations added by that task -- see the
#     inline comments at each group below for the specific succession-box
#     citations used to establish adjacency/order.
#
# CRS codes: every code below was verified live against National Rail
# Enquiries (nationalrail.co.uk/stations/<crs>/details.html) and
# cross-checked against each station's own Wikipedia infobox where fetched.
# Several initial code guesses were wrong and caught by this verification
# pass (e.g. Balloch is BHC not BAC; Craigendoran is CGD, not the initially-
# guessed code) -- underlining why every code here was checked against a
# live source rather than assumed from memory.
#
# TIPLOCs are omitted throughout: none were confirmed against a live
# source, matching the optional-field convention already used by
# `xc-manchester.toml`/`scotrail-central-belt.toml`.

# === Segment-naming coordination with other files ===
#
# GLQ (Glasgow Queen Street) also appears in `scotrail-central-belt.toml`
# (10.1), as the high-level terminus of the Falkirk High inter-city
# routing. This file's own GLQ is the Low Level suburban hub -- an
# operationally distinct half of the same named station (different
# platforms/levels, no through-running between them), so this file
# deliberately does NOT reuse the `scotrail-central-belt` segment name for
# GLQ -- station overlap is fine, segment-sharing is a deliberate choice,
# per the `xc-south-coast.toml`/`xc-manchester.toml` precedent.
#
# `lines/scotrail-bathgate.toml` reuses this file's own
# `scotrail-north-clyde-core` (Charing Cross/GLQ/Bellgrove) and
# `scotrail-north-clyde-airdrie-branch` (Airdrie) segment names for its own
# western stations -- a genuine shared trunk, confirmed by this file's own
# Bellgrove/Airdrie sourcing above. See that file's own segment-structure
# comment for the full reasoning.
#
# `lines/scotrail-west-highland-fort-william.toml` and `lines/scotrail-
# west-highland-oban.toml` both reuse this file's own
# `scotrail-north-clyde-west-trunk` segment name (Dalmuir/Dumbarton
# Central) -- a genuine three-way shared trunk, confirmed by both West
# Highland files' own Dalmuir/Dumbarton Central sourcing (West Highland
# services "share track with the North Clyde Line" through this stretch
# before diverging near Craigendoran). See those files' own segment-
# structure comments for the full reasoning.
#
# === Scope boundary: Argyle Line's own western reach (documented, not
#     modelled) ===
#
# `scotrail-argyle.toml`'s own sourcing (Wikipedia "Argyle Line", Route
# section, carried over from this file's original research) states that
# Argyle Line services join "North Clyde metals via Singer/Westerton to
# Dalmuir/Milngavie" -- i.e. some Argyle-branded services physically run
# out over this file's own Partick-Dalmuir approach track and Milngavie
# branch, real track-sharing beyond mere station-name overlap. This split
# does not model that as a shared segment between the two files: unlike
# the West Highland trunk above (a clean, single, well-bounded stretch),
# fully representing the Argyle overlap would mean deciding, station by
# station along both the via-Yoker and via-Singer approaches and the whole
# Milngavie branch, which are genuinely still-served by Argyle Line
# workings today -- a fresh research question this split's own audit did
# not ask, and a wrong guess here risks the exact kind of invented-topology
# claim the Global Constraints warn against. Per the `xc-south-coast.toml`
# precedent ("runs over SWML metals ... but claims neither line's
# segments: both extend well beyond the shared stretch ... incidents on
# the shared track still match both lines by station"), this file keeps
# sole ownership of the Partick-Dalmuir-Milngavie corridor (it is, after
# all, one of the North Clyde Line's own four western termini per the
# Wikipedia sourcing above), and `scotrail-argyle.toml` documents this same
# open question from its own side. An incident naming one of these
# stations still matches this file by station membership regardless.

# --- West end: Milngavie branch, West Trunk, Balloch/Helensburgh branch ---

[[stations]]
crs = "PTK"
role = "junction"
segment = "scotrail-north-clyde-west-approach"
# Partick: Glasgow Subway interchange; also where Argyle Line services
# join North Clyde metals westbound towards Dalmuir/Milngavie (see the
# scope-boundary note above -- not modelled as a shared segment). Partick
# is the first stop out of Glasgow on this line's own western approach
# track.

[[stations]]
crs = "HYN"
role = "junction"
segment = "scotrail-north-clyde-west-approach"
# Hyndland: per Wikipedia's own Hyndland article, "immediately to the west
# of the station is Hyndland East Junction where the Yoker and Singer
# (including the Milngavie branch) lines diverge" -- so the physical split
# is a few hundred metres west of the station, not at the platforms
# themselves. This is Wikipedia-sourced only: a second, non-Wikipedia
# source for the "Hyndland East Junction" name/location specifically was
# not reachable within the original task's research budget (railwaycodes.
# org.uk returned 404s for the pages guessed, ScotRail's own site returned
# 403). Hyndland is used here as the nearest *confirmed* station to the
# actual divergence point, not asserted as the divergence point itself;
# exclusive segment starts at the next station, per the shared-trunk rule
# of thumb.
#
# Not tagged onto the West Highland-shared `west-trunk` segment (or its
# predecessor): West Highland Line trains run non-stop between Glasgow
# Queen Street and Dumbarton Central and do not physically call at
# Hyndland, so classifying an incident here as `MatchScope::SharedSegment`
# with the West Highland lines would be a false claim -- see the DMR/DBC
# entries below for where that genuine sharing actually starts.

[[stations]]
crs = "ANL"
role = "minor"
segment = "scotrail-north-clyde-west-approach"
# Anniesland: between Hyndland and Westerton on the via-Anniesland/
# Milngavie route (Wikipedia infobox succession; CRS cross-checked against
# National Rail Enquiries). Also a Maryhill Line terminus, but that line
# is not modelled in any `lines/*.toml` file.

[[stations]]
crs = "WES"
role = "junction"
segment = "scotrail-north-clyde-west-approach"
# Westerton: the physical fork -- Wikipedia's own succession box for this
# station names its "next" stations as "Drumchapel (westbound) and
# Bearsden (northbound)", i.e. this is Westerton Junction itself, where the
# Milngavie branch splits from the via-Singer approach route. Per the
# shared-trunk rule of thumb the junction stays on the approach segment;
# the exclusive Milngavie-branch segment starts at the next station,
# Bearsden.

[[stations]]
crs = "BRN"
role = "minor"
segment = "scotrail-north-clyde-milngavie-branch"

[[stations]]
crs = "HLF"
role = "minor"
segment = "scotrail-north-clyde-milngavie-branch"

[[stations]]
crs = "MLN"
role = "terminus"
segment = "scotrail-north-clyde-milngavie-branch"

[[stations]]
crs = "JOR"
role = "minor"
segment = "scotrail-north-clyde-west-approach"
# Jordanhill: first station on the via-Yoker route out of Hyndland
# (Wikipedia succession box: previous Hyndland, next Scotstounhill).

[[stations]]
crs = "SCH"
role = "minor"
segment = "scotrail-north-clyde-west-approach"

[[stations]]
crs = "GRS"
role = "minor"
segment = "scotrail-north-clyde-west-approach"

[[stations]]
crs = "YOK"
role = "minor"
segment = "scotrail-north-clyde-west-approach"

[[stations]]
crs = "CYK"
role = "minor"
segment = "scotrail-north-clyde-west-approach"
# Clydebank: last station on the via-Yoker route before it rejoins the
# via-Singer route at Dalmuir (Wikipedia succession box: previous Yoker,
# next Dalmuir).

[[stations]]
crs = "DMY"
role = "minor"
segment = "scotrail-north-clyde-west-approach"
# Drumry: continuation of the via-Singer route past the Westerton/
# Milngavie-branch fork (Wikipedia succession template: previous
# Drumchapel, next Singer -- Drumchapel itself not individually verified).

[[stations]]
crs = "SIN"
role = "minor"
segment = "scotrail-north-clyde-west-approach"
# Singer: last station on the via-Singer route before Dalmuir (Wikipedia
# succession box: previous Drumry, next Dalmuir).

[[stations]]
crs = "DMR"
role = "junction"
segment = "scotrail-north-clyde-west-trunk"
# Dalmuir: "a large, five-platform interchange" (Wikipedia) where North
# Clyde, Argyle Line and West Highland Line services converge. The
# via-Yoker and via-Singer approach routes above both terminate here.
# Genuine three-way shared trunk with `scotrail-west-highland-fort-
# william.toml` and `scotrail-west-highland-oban.toml` -- see the
# segment-naming coordination note above. Renamed from this line's
# original bundled `scotrail-glasgow-suburban-west-trunk` segment name as
# part of this split; both West Highland files' own DMR/DBC entries were
# updated to match.

[[stations]]
crs = "KPT"
role = "minor"
segment = "scotrail-north-clyde-west-trunk"
# Kilpatrick: on the Dalmuir-Dumbarton Central stretch itself (Wikipedia
# succession box: previous Dalmuir, next Bowling, North Clyde Line only --
# i.e. not served by the via-Yoker/via-Singer approach routes). This is the
# genuinely shared stretch, so it inherits `west-trunk`, not
# `west-approach`.

[[stations]]
crs = "BWG"
role = "minor"
segment = "scotrail-north-clyde-west-trunk"
# Bowling: same reasoning as Kilpatrick above (Wikipedia succession box:
# previous Kilpatrick, next Dumbarton East -- Dumbarton East itself not
# individually verified).

[[stations]]
crs = "DBC"
role = "junction"
segment = "scotrail-north-clyde-west-trunk"
# Dumbarton Central: on the shared west trunk, one station short of the
# actual Balloch/Helensburgh split (see Dalreoch, next). Per Wikipedia's
# Dumbarton Central article it is "the last station on the North Clyde
# line where trains on the West Highland line between Glasgow and Oban
# and Mallaig call before diverging from the line just before
# Craigendoran" -- a separate fact about West Highland services, not the
# Balloch/Helensburgh split (see Craigendoran below for that junction).
# `SegmentRegistry::is_shared` reports this segment shared between this
# file and both West Highland files -- see the segment-naming coordination
# note above.

[[stations]]
crs = "DLR"
role = "junction"
segment = "scotrail-north-clyde-west-approach"
# Dalreoch: the real Balloch/Helensburgh split point. Wikipedia's Dalreoch
# article, describing the station's own track layout: "the line diverging
# to the right becomes single track and heads to Balloch. The line to the
# left runs to Helensburgh Central." The same article confirms Dalreoch
# immediately follows Dumbarton Central (moving away from Glasgow) and
# precedes Renton (Balloch direction) / Cardross (Helensburgh direction).
# CRS code DLR cross-checked against National Rail Enquiries.
#
# Tagged `west-approach`, not `west-trunk`: Dalreoch is not physically
# traversed by West Highland Line trains, so it isn't part of the segment
# genuinely shared with the West Highland files (same reasoning as
# Hyndland/Partick above).

[[stations]]
crs = "RTN"
role = "minor"
segment = "scotrail-north-clyde-balloch-branch"
# Renton: first station on the Balloch branch out of Dalreoch (Wikipedia
# succession box: previous Dalreoch, next Alexandria; CRS cross-checked
# against National Rail Enquiries).

[[stations]]
crs = "ALX"
role = "minor"
segment = "scotrail-north-clyde-balloch-branch"
# Alexandria: last station on the Balloch branch before Balloch itself
# (Wikipedia succession box: previous Renton, next Balloch).

[[stations]]
crs = "BHC"
role = "terminus"
segment = "scotrail-north-clyde-balloch-branch"

[[stations]]
crs = "CDR"
role = "minor"
segment = "scotrail-north-clyde-helensburgh-branch"
# Cardross: on the Helensburgh branch out of Dalreoch, before Craigendoran
# (Wikipedia succession box: previous Dalreoch, next Craigendoran; CRS
# cross-checked against National Rail Enquiries).

[[stations]]
crs = "CGD"
role = "junction"
segment = "scotrail-north-clyde-helensburgh-branch"
# Craigendoran: West Highland Line begins here (loop east of the station,
# available to West Highland Line trains only, per Wikipedia).

[[stations]]
crs = "HLC"
role = "terminus"
segment = "scotrail-north-clyde-helensburgh-branch"

# --- Core: Charing Cross, Glasgow Queen Street (Low Level) ---

[[stations]]
crs = "CHC"
role = "major"
segment = "scotrail-north-clyde-core"

[[stations]]
crs = "GLQ"
role = "junction"
segment = "scotrail-north-clyde-core"
# Glasgow Queen Street (Low Level) -- distinct from the High Level terminus
# modelled in `scotrail-central-belt.toml`; see the segment-naming
# coordination note above for why this deliberately isn't shared with that
# file. Genuinely shared with `scotrail-bathgate.toml`'s own GLQ entry
# instead (same Low Level platforms) -- see that note too.

[[stations]]
crs = "HST"
role = "minor"
segment = "scotrail-north-clyde-core"
# High Street: between Glasgow Queen Street (Low Level) and Bellgrove
# (Wikipedia succession box; CRS cross-checked against National Rail
# Enquiries).

[[stations]]
crs = "BLG"
role = "junction"
segment = "scotrail-north-clyde-core"
# Bellgrove: eastbound North Clyde services split three ways here --
# Airdrie (15 min), Springburn (30 min), and Edinburgh Waverley via
# Bathgate (hourly, now modelled in full by `scotrail-bathgate.toml`, which
# reuses this exact `scotrail-north-clyde-core` segment name for its own
# Charing Cross/Glasgow Queen Street/Bellgrove entries -- a genuine shared
# segment. See that file's own sourcing for the confirmation.

# --- East end: Springburn spur, Airdrie branch ---

[[stations]]
crs = "SPR"
role = "terminus"
segment = "scotrail-north-clyde-springburn-spur"
# Springburn is a terminus of a short spur from Bellgrove, with a
# Cumbernauld Line interchange there. The Cumbernauld Line is now modelled
# by `lines/scotrail-cumbernauld.toml` (added later, reconciled during
# integration merge), which reuses this exact `scotrail-north-clyde-
# springburn-spur` segment name for its own SPR row -- a genuine
# SharedSegment pair, since this segment covers only this one station.

[[stations]]
crs = "ADR"
role = "terminus"
segment = "scotrail-north-clyde-airdrie-branch"
# Airdrie: North Clyde terminus per the original batch's pre-flight
# ruling. Real electrified track continues beyond here (Drumgelloch, then
# the Airdrie-Bathgate Line to Edinburgh) but that continuation belongs to
# `scotrail-bathgate.toml`, which now models it in full and reuses this
# exact `scotrail-north-clyde-airdrie-branch` segment name for its own
# Airdrie entry (its own service pattern continuing beyond this station,
# hence that file gives its own ADR entry `role = "junction"` rather than
# this file's `"terminus"` -- see that file's own ADR comment), making
# this a genuine shared segment between this file and `scotrail-
# bathgate.toml`.

# === Scope boundaries (documented, not modelled) ===
#
# - Ayrshire Coast / Glasgow South Western Line (Ayr/Stranraer/Girvan):
#   separate gap-analysis item, not modelled here.
# - Argyle Line's own western reach onto this file's Partick-Dalmuir-
#   Milngavie corridor: real, sourced, deliberately not modelled as a
#   shared segment -- see the scope-boundary note above.
#
# (Task 3.1, station-catalogue-completeness plan) The 19 minor intermediate
# stations previously omitted here (Jordanhill, Anniesland, Westerton,
# Bearsden, Hillfoot, Scotstounhill, Garscadden, Yoker, Clydebank, Singer,
# Drumry, Kilpatrick, Bowling, Renton, Cardross, Alexandria, High Street,
# Uddingston, Bellshill -- the last two now belonging to `scotrail-
# argyle.toml` instead) have all been researched to the two-source standard
# (Wikipedia infobox/succession box cross-checked against National Rail
# Enquiries' `nationalrail.co.uk/stations/<crs>/details.html`) and added to
# `stations` above.

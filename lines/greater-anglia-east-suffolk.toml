id = "greater-anglia-east-suffolk"
name = "East Suffolk Line (Ipswich - Lowestoft)"
mode = "national-rail"
category = "regional"
operators = ["LE"]
# LE = Greater Anglia's ATOC code, already verified and cited in
# greater-anglia-main-line.toml (Task 2.1) -- not re-derived here.

# Confirmed via Wikipedia's "East Suffolk line" article (raw wikitext):
# infobox `start = Ipswich`, `end = Lowestoft`, 12 stations, `character =
# Rural branch line`. Current service: "a regular hourly passenger service
# from Ipswich to Lowestoft". Full current station list and order confirmed
# via the article's own "Current route"/"Location list" section (raw
# wikitext, which explicitly separates the current main line from four
# long-closed branches -- Framlingham, Snape, Aldeburgh, and the historical
# Yarmouth-bound continuation via Haddiscoe High Level -- none of which are
# listed here): Ipswich - Westerfield - Woodbridge - Melton - Wickham Market
# - Saxmundham - Darsham - Halesworth - Brampton - Beccles - Oulton Broad
# South - Lowestoft (12 stations, matching the infobox count exactly).
#
# Already partially anticipated by `greater-anglia-suffolk-branches.toml`,
# which lists Westerfield (WFI) as "a station on the currently uncatalogued
# East Suffolk Line" -- confirmed as the same line, now catalogued here.
#
# `category = "regional"`, matching the infobox's own "Rural branch line"
# characterisation and a genuinely single-track-for-much-of-its-length,
# hourly service (double track only Ipswich-Woodbridge and
# Saxmundham-Halesworth per the article's own "Current route" section).

sample_stations = ["IPS", "SAX", "LWT"]
destination_crs_filter = ["LWT", "IPS"]

match_keywords = ["East Suffolk line"]
# The article's own consistently-used title; the only phrase confirmed by
# this task's research, so left at one keyword per SCHEMA.md's "don't pad"
# rule. Grepped `lines/*.toml`: no collision.

[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10
# Matches `greater-anglia-suffolk-branches.toml`'s own overrides for the
# same reasoning: an hourly single-track branch where one cancellation is a
# large fraction of the service and a short delay isn't yet a story at
# config.py's base thresholds.

# All CRS codes cross-checked against https://ds.cursed.solutions/api/stations,
# matching each station's own Wikipedia infobox. TIPLOCs are omitted
# throughout except the two shared junction stations (IPS, WFI), reused
# verbatim from `greater-anglia-main-line.toml`/`greater-anglia-suffolk-
# branches.toml`, which already cross-checked them (WFI has none recorded
# in that file, so none is added here either).
#
# ## Overlap 1: Ipswich (IPS) and Westerfield (WFI) --
# station-overlap only
#
# IPS is already a `geml-mainline`-tagged junction in
# `greater-anglia-main-line.toml` ("East Suffolk line (to Lowestoft) and the
# Felixstowe branch line both diverge here") and a `felixstowe-branch`-
# tagged junction in `greater-anglia-suffolk-branches.toml`. Reusing either
# literal segment name here would, per the hazard both of those files' own
# comments already document (`segments.rs`'s `SegmentRegistry::is_shared`
# marking a segment name shared globally by name, not scoped to the
# stations actually in common), incorrectly widen this line's own claim
# onto stations it doesn't serve (e.g. Diss, Norwich on `geml-mainline`;
# Felixstowe, Trimley on `felixstowe-branch`). This file's own segment name
# is used at IPS instead.
#
# WFI is already a `felixstowe-branch`-tagged junction in
# `greater-anglia-suffolk-branches.toml`, whose own comment already
# describes it as "the branch's real physical fork... on the currently
# uncatalogued East Suffolk Line. No overlap with any committed line" --
# true when written, now resolved by this file. Same reasoning as IPS
# above: this file's own segment name is used, not `felixstowe-branch`
# (which also spans DBR/TRM/FLX, none of which this line touches).
#
# ## Overlap 2: Lowestoft (LWT) with `greater-anglia-norfolk-branches.toml`
# -- station-overlap only, different physical approach
#
# LWT is already that file's own Wherry Lines terminus, tagged
# `wherry-lowestoft-branch` (reached from Norwich via Reedham, Haddiscoe,
# Somerleyton and Oulton Broad *North*). This line reaches the same
# physical station from the south, via Beccles and Oulton Broad *South* --
# Oulton Broad North and Oulton Broad South are two distinct, separately
# CRS-coded stations on two different approach lines that only reconverge
# at Lowestoft itself (confirmed via the East Suffolk line article's own
# "Current route" section: "the single line continues as far as Oulton
# Broad North Junction, where it joins the line from Norwich for the final
# entry to Lowestoft"). A genuine terminal convergence, not a shared
# segment -- the same pattern `c2c.toml` already establishes for Grays
# (reached independently via its own Rainham branch and Ockendon loop).
# This file's own segment name is used at LWT.
[[stations]]
crs = "IPS"
tiploc = "IPSWICH"
role = "junction"
segment = "greater-anglia-east-suffolk"
# See Overlap 1 above.

[[stations]]
crs = "WFI"
role = "junction"
segment = "greater-anglia-east-suffolk"
# Westerfield: the Felixstowe branch line diverges here. See Overlap 1
# above.

[[stations]]
crs = "WDB"
role = "minor"
segment = "greater-anglia-east-suffolk"
# Woodbridge: the line is double-track from Ipswich to here.

[[stations]]
crs = "MES"
role = "minor"
segment = "greater-anglia-east-suffolk"
# Melton (Suffolk) -- confirmed distinct from Melton Mowbray (CRS MMO),
# unrelated and not in this catalogue.

[[stations]]
crs = "WCM"
role = "minor"
segment = "greater-anglia-east-suffolk"
# Wickham Market (in Campsea Ashe, per the article's own location list). The
# closed Framlingham branch historically diverged nearby; not modelled.

[[stations]]
crs = "SAX"
role = "major"
segment = "greater-anglia-east-suffolk"
# Saxmundham: the line to Sizewell nuclear power station (freight only)
# diverges here; the closed Aldeburgh branch historically diverged here
# too. Neither modelled. The line is double-track from here to Halesworth.

[[stations]]
crs = "DSM"
role = "minor"
segment = "greater-anglia-east-suffolk"
# Darsham.

[[stations]]
crs = "HAS"
role = "minor"
segment = "greater-anglia-east-suffolk"
# Halesworth: the line reverts to single track south of here.

[[stations]]
crs = "BRP"
role = "minor"
segment = "greater-anglia-east-suffolk"
# Brampton (Suffolk).

[[stations]]
crs = "BCC"
role = "major"
segment = "greater-anglia-east-suffolk"
# Beccles: has the line's only passing loop between Halesworth and Oulton
# Broad North Junction, per the article's own "Current route" section.

[[stations]]
crs = "OUS"
role = "minor"
segment = "greater-anglia-east-suffolk"
# Oulton Broad South -- confirmed distinct from Oulton Broad North, on
# `greater-anglia-norfolk-branches.toml`'s own Wherry Lines approach to the
# same terminus. See Overlap 2 above.

[[stations]]
crs = "LWT"
role = "terminus"
segment = "greater-anglia-east-suffolk"
# Lowestoft: this line's own terminus. See Overlap 2 above for the
# station-overlap-only relationship with `greater-anglia-norfolk-branches.toml`.

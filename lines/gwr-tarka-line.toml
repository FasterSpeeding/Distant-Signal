id = "gwr-tarka-line"
name = "Tarka Line"
mode = "national-rail"
category = "regional"
operators = ["GW"]

# Devon/Cornwall branch-line batch: full UK station-coverage audit found this
# real, currently-open GWR branch (Exeter - Barnstaple) entirely missing
# from the catalogue. Wikipedia "Tarka Line" infobox/lead: GWR operator,
# also known as "North Devon Line"; "single tracked with passing loops at
# Crediton and Eggesford"; designated a Department for Transport community
# rail line in September 2006.
#
# Category: "regional", matching this catalogue's precedent for a
# single-track community-rail branch (`northern-furness.toml`), confirmed
# rather than assumed via the community-rail designation above.
#
# This file is one of three created together in this same task
# (`gwr-avocet-line.toml`, `gwr-dartmoor-line.toml`) for the three GWR local
# routes that fan out from Exeter -- see the shared-trunk research shared
# across all three below.

# Exclusive-segment stations only (mirrors `gwr-cornish-main-line.toml`'s
# sample_stations rationale). Exeter St Davids/Central are genuinely shared
# with `gwr-avocet-line.toml` and `gwr-dartmoor-line.toml` (see below), so
# left off in favour of stations unique to this line.
sample_stations = ["CDI", "EGG", "BNP"]

# Exeter St Davids/Central are shared with both `gwr-avocet-line.toml` and
# `gwr-dartmoor-line.toml`; Crediton/Yeoford are additionally shared with
# `gwr-dartmoor-line.toml` alone (see the segment comments below).
# `destination_crs_filter` disambiguates this line's own LDBWS departures
# (bound for BNP) from Avocet-bound (EXM) and Dartmoor-bound (OKE/OKI)
# services sampled at the same shared stations, mirroring
# `scotrail-ayrshire.toml`'s identical use of the field at GLC.
destination_crs_filter = ["BNP"]

match_keywords = ["Tarka Line", "North Devon Line"]
# "Tarka Line" is the line's own current branded/article name. "North Devon
# Line" is the well-established alternative name given in the same
# Wikipedia infobox/lead. Grepped `lines/*.toml` before starting: neither
# phrase collides with any existing file's `match_keywords`.

# Single track with passing loops only at Crediton and Eggesford, and a
# roughly-hourly-or-worse GWR local pattern (Wikipedia: services
# "approximately hourly in each direction", with "only two services each
# way on weekdays call[ing] at all stops" -- most trains skip request stops
# such as Yeoford, Morchard Road and Umberleigh). Comparable to
# `northern-furness.toml`'s/`scotrail-kyle.toml`'s rural single-track
# branches, so the same tuned thresholds are used.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# === Shared trunk 1: Exeter St Davids - Exeter Central, genuinely shared
#     with `gwr-avocet-line.toml` AND `gwr-dartmoor-line.toml` ===
#
# Wikipedia "Exeter Central railway station" (fetched fresh for this task):
# Avocet Line services "operate twice an hour... from Exmouth to Exeter St
# Davids (from where they continue to Paignton)"; separately, "Further
# trains operate, generally once an hour, on both the Tarka Line to
# Barnstaple ... and on the Dartmoor Line to Okehampton" calling at Exeter
# Central; and "The SWR and GWR services combine to give up to five trains
# per hour each way between Exeter Central and Exeter St Davids" -- direct,
# explicit confirmation that this two-station stretch (via St Davids Tunnel)
# is genuinely shared double-track infrastructure carrying all three GWR
# local routes (plus SWR's own West of England Line services, not yet
# catalogued -- see scope note below). Wikipedia "Newton St Cyres railway
# station" independently corroborates that both this line and the Dartmoor
# Line call further west too (see Shared trunk 2 below).
#
# Segment name `gwr-exeter-central-approach`, reused verbatim in
# `gwr-avocet-line.toml` and `gwr-dartmoor-line.toml` for the same two
# stations -- a genuine, sourced, multi-line shared trunk established
# within this same batch (mirroring `scotrail-kyle.toml`'s/
# `scotrail-far-north.toml`'s `scotrail-inverness-dingwall-trunk` precedent
# for exactly this situation).
[[stations]]
crs = "EXD"
role = "junction"
segment = "gwr-exeter-central-approach"
# Exeter St Davids: also a station entry in `cross-country.toml`,
# `gwr-cornish-main-line.toml` and `gwr-west-of-england.toml` (segment
# "xc-south-west" there, for the Bristol/Waterloo-Plymouth/Penzance
# main-line services) -- a different, non-overlapping segment name from
# this file's own `gwr-exeter-central-approach`, since this line's own
# local Barnstaple service is a distinct physical working from the
# Plymouth/Penzance expresses even though both call at the same platforms.
# Station overlap only with those files, per this catalogue's established
# convention.

[[stations]]
crs = "EXC"
role = "junction"
segment = "gwr-exeter-central-approach"
# Exeter Central: reached via St Davids Tunnel. See the shared-trunk note
# above.

# === Shared trunk 2: Newton St Cyres - Crediton - Yeoford, genuinely shared
#     with `gwr-dartmoor-line.toml` only ===
#
# Wikipedia "Newton St Cyres railway station" (fetched fresh for this
# task): "Both the Tarka Line and Dartmoor Line call at this station" --
# "Only a limited number of trains (between six and eight each way each
# day) between Barnstaple or Okehampton and Exeter Central call at Newton
# St Cyres and this is only on request." Wikipedia "Dartmoor line" and
# "Tarka Line" both independently confirm the physical junction (Coleford
# Junction, no CRS/TIPLOC of its own) sits just past Yeoford, on the
# Copplestone side: "the line runs alongside the Tarka Line to the site of
# the former Coleford Junction where it diverges west to Okehampton" and
# "The connection occurs at Coleford Junction, located between Yeoford and
# Copplestone stations." Per SCHEMA.md's shared-trunk rule of thumb, Yeoford
# (the junction station) belongs to the shared segment; this line's own
# exclusive segment starts at the next station past it, Copplestone.
#
# Segment name `gwr-crediton-yeoford-trunk`, reused verbatim in
# `gwr-dartmoor-line.toml` for the same three stations -- a second genuine
# shared trunk established within this same batch.
[[stations]]
crs = "NTC"
role = "minor"
segment = "gwr-crediton-yeoford-trunk"
# Newton St Cyres: request stop -- see the shared-trunk note above.

[[stations]]
crs = "CDI"
role = "major"
segment = "gwr-crediton-yeoford-trunk"
# Crediton: site of one of this line's two passing loops.

[[stations]]
crs = "YEO"
role = "junction"
segment = "gwr-crediton-yeoford-trunk"
# Yeoford: request stop, per Wikipedia's own "Services" section ("Yeoford
# (request)"). The real physical junction, Coleford Junction, sits
# immediately past this station on the Copplestone side -- see the
# shared-trunk note above.

# === This line's own exclusive segment ===

[[stations]]
crs = "COP"
role = "minor"
segment = "gwr-tarka-line"
# Copplestone: this line's own exclusive segment starts here, per the
# shared-trunk rule of thumb (see the Coleford Junction note above).

[[stations]]
crs = "MRD"
role = "minor"
segment = "gwr-tarka-line"
# Morchard Road: request stop.

[[stations]]
crs = "LAP"
role = "minor"
segment = "gwr-tarka-line"
# Lapford.

[[stations]]
crs = "EGG"
role = "minor"
segment = "gwr-tarka-line"
# Eggesford: site of this line's other passing loop.

[[stations]]
crs = "KGN"
role = "minor"
segment = "gwr-tarka-line"
# Kings Nympton.

[[stations]]
crs = "PMA"
role = "minor"
segment = "gwr-tarka-line"
# Portsmouth Arms.

[[stations]]
crs = "UMB"
role = "minor"
segment = "gwr-tarka-line"
# Umberleigh: request stop.

[[stations]]
crs = "CPN"
role = "minor"
segment = "gwr-tarka-line"
# Chapelton (Devon).

[[stations]]
crs = "BNP"
role = "terminus"
segment = "gwr-tarka-line"
# Barnstaple: this line's own terminus.

# === Sources (cross-checked per this batch's Global Constraints) ===
#
# Route structure, operator, character, service pattern:
#   - Wikipedia "Tarka Line" (infobox + lead + body, fetched fresh for this
#     task): confirms GWR operation, "North Devon Line" alt-name, single
#     track with passing loops at Crediton and Eggesford, community rail
#     designation (September 2006); confirms the ordered station list
#     Exeter St Davids - Newton St Cyres - Crediton - Yeoford - Copplestone
#     - Morchard Road - Lapford - Eggesford - Kings Nympton - Portsmouth
#     Arms - Umberleigh - Chapelton - Barnstaple; confirms request-stop
#     status for Yeoford, Morchard Road and Umberleigh via "Off-peak
#     services generally stop at Exeter St. Davids, Crediton, Yeoford
#     (request), Copplestone, Morchard Road (request), Eggesford and
#     Umberleigh (request)."
#   - Wikipedia "Exeter Central railway station" (fetched fresh,
#     independently of the other two files' own citation of the same
#     article): see the shared-trunk-1 note above for the exact quotes.
#   - Wikipedia "Newton St Cyres railway station" (fetched fresh, own
#     article): see the shared-trunk-2 note above for the exact quotes.
#   - Wikipedia "Dartmoor line" (raw wikitext, fetched fresh): independently
#     corroborates the Coleford Junction location relative to Yeoford/
#     Copplestone.
#
# CRS codes: every code below was verified live against
# `https://ds.cursed.solutions/api/stations?q=<name>` during this task --
# EXD "Exeter St Davids", EXC "Exeter Central", NTC "Newton St Cyres", CDI
# "Crediton", YEO "Yeoford", COP "Copplestone", MRD "Morchard Road", LAP
# "Lapford", EGG "Eggesford", KGN "Kings Nympton", PMA "Portsmouth Arms",
# UMB "Umberleigh", CPN "Chapelton (Devon)", BNP "Barnstaple". All matched
# with no discrepancies.
#
# TIPLOCs are omitted throughout: none were confirmed against a live source
# during this task, matching this batch's optional-field convention.
#
# === Scope boundaries (documented, not modelled) ===
#
# - SWR's own West of England Line (Basingstoke-Salisbury-Exeter), which
#   also calls at Exeter Central per the source quoted above: real, but
#   already flagged as a distinct, not-yet-catalogued route by
#   `gwr-west-of-england.toml`'s own naming note; not modelled here either.
# - The Great Western/South Devon main line onward from Exeter St Davids
#   (Cornish Main Line, Reading-Taunton line): already catalogued in
#   `gwr-cornish-main-line.toml`/`gwr-west-of-england.toml`/
#   `cross-country.toml`; not re-derived here beyond the EXD station-overlap
#   note above.

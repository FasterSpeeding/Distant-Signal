id = "northern-hallam-line"
name = "Hallam Line"
mode = "national-rail"
category = "regional"
operators = ["NT"]

# --- Part B (Yorkshire real-world-sanity review, 2026-09-21) ---
# Explicitly flagged as unmodelled in `northern-penistone.toml`'s own
# original scope-boundaries note ("Barnsley - Wakefield Kirkgate -
# Castleford - Leeds (the 'Hallam Line')... a real, sourced, currently-
# unmodelled Northern service"), itself sourced from Elsecar's own
# Wikipedia article: "two trains per hour to Barnsley (one continuing to
# Leeds via Castleford, the other to Huddersfield via Penistone)". This
# file fills that gap.
#
# Route and CRS verification: Wikipedia's own "Hallam Line" article (raw
# route-diagram data, fetched 2026-09-21) gives the historical infobox
# route Leeds-...-Sheffield; most of its named intermediate stations are
# long closed (Leeds Hunslet Lane, Hunslet, Stourton, Methley North/
# Junction/South, Altofts and Whitwood, Castleford Cutsyke, Horbury
# Junction, Crigglestone West, Haigh, Barnsley Court House, Wentworth,
# Ecclesfield West, Brightside, Grimesthorpe Bridge, Sheffield Wicker,
# Attercliffe Road -- each individually checked against
# https://ds.cursed.solutions/api/stations?q=<name> and confirmed to
# return no result, i.e. no live CRS/current service). The stations below
# are exactly the ones that DID return a live result: Leeds, Woodlesford,
# Castleford, Normanton, Wakefield Kirkgate, Darton, Barnsley, Wombwell,
# Elsecar, Chapeltown, Meadowhall, Sheffield (the last six reused unchanged
# from `northern-penistone.toml`'s own verified entries, not re-derived
# here). Order matches the same infobox route diagram, oldest-to-newest
# order preserved with closed stations simply dropped.
#
# Frequency: "hourly" per this task's own brief, corroborated by
# `northern-penistone.toml`'s own Elsecar citation ("two trains per hour to
# Barnsley, one continuing to Leeds"). Category "regional": no live source
# found confirming electrification on this line's own exclusive
# Leeds-Barnsley stretch (Wikipedia's own article gives no rolling-stock or
# electrification detail), so it does not meet the electrified-plus-
# frequent bar this review applied to `northern-airedale.toml`/
# `northern-wharfedale.toml`/`northern-glossop-hadfield.toml`.
#
# --- Segment/overlap decisions ---
# Barnsley through Sheffield (BNY/WOM/ELR/CLN/MHS/SHF): genuine physical
# track-sharing with `northern-penistone.toml`'s own southern approach into
# Sheffield -- both lines' trains funnel through the same Wombwell-Elsecar-
# Chapeltown-Meadowhall stretch to reach Sheffield, confirmed by that
# file's own Elsecar citation describing the Barnsley junction split
# directly. Segment `northern-barnsley-sheffield` reused verbatim from that
# file, which had its own previously-over-broad single `northern-penistone`
# segment split for this purpose as part of this same change -- see that
# file's own updated comment. Per SCHEMA.md's shared-trunk rule of thumb,
# Barnsley (the junction) carries the shared name; this file's own
# exclusive `northern-hallam-line` segment covers Normanton through Darton.
#
# Leeds through Castleford (LDS/WDS/CFD): also genuine physical
# track-sharing, this time with `northern-pontefract-line.toml`'s own
# Leeds-Goole approach -- both lines' trains run Leeds-Woodlesford-
# Castleford before diverging (this line towards Normanton/Wakefield
# Kirkgate, the Pontefract line towards Glasshoughton/Pontefract Monkhill),
# confirmed by both files' own independently-sourced Wikipedia route
# diagrams agreeing on this exact shared stretch. Segment
# `northern-leeds-castleford` shared verbatim with that file. Per the same
# shared-trunk rule of thumb, Castleford (the junction) carries the shared
# name; this file's own exclusive `northern-hallam-line` segment starts at
# the next station, Normanton.
#
# WKK (Wakefield Kirkgate) is also a `grand-central-bradford.toml` station
# (that file's own `gc-bradford` segment, a different physical approach) --
# station-overlap only, matching this catalogue's standard cross-operator
# treatment.
#
# LDS is station-overlap-only with every other Leeds-terminating file in
# this catalogue (`northern-airedale.toml`/`northern-wharfedale.toml`'s
# `northern-shipley-trunk`, `lner-leeds.toml`, `northern-harrogate-
# line.toml`, `northern-leeds-selby.toml`/`northern-leeds-york.toml`'s
# `northern-leeds-micklefield`, `northern-wakefield-line.toml`,
# `northern-huddersfield.toml`, `northern.toml`'s own `northern-yorkshire`,
# `tpe-north.toml`), each a physically distinct approach into the same
# station.
#
# MHS and SHF are also `tpe-south.toml`/`northern-wakefield-line.toml`
# stations (and several more at SHF alone -- see `northern-penistone.
# toml`'s own note); station-overlap only with all of those, same as that
# file's own treatment.
sample_stations = ["LDS", "WKK", "BNY", "SHF"]
destination_crs_filter = ["LDS", "SHF"]
match_keywords = ["Hallam Line"]
# The line's own branded/article name. Grepped clean against every other
# file's own `match_keywords` before adding.

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10
# Hourly cross-city stopping service -- same values as
# `northern-penistone.toml`'s/`northern-wakefield-line.toml`'s own
# comparable-frequency Northern stoppers.

[[stations]]
crs = "LDS"
tiploc = "LEEDS"
role = "terminus"
segment = "northern-leeds-castleford"

[[stations]]
crs = "WDS"
role = "minor"
segment = "northern-leeds-castleford"
# Woodlesford -- shared trunk with `northern-pontefract-line.toml`; see the
# top-of-file comment.

[[stations]]
crs = "CFD"
role = "junction"
segment = "northern-leeds-castleford"
# Castleford -- the Pontefract Line's own Leeds approach diverges here; see
# the top-of-file comment. This file's own exclusive segment starts at the
# next station, Normanton.

[[stations]]
crs = "NOR"
role = "minor"
segment = "northern-hallam-line"
# Normanton.

[[stations]]
crs = "WKK"
role = "major"
segment = "northern-hallam-line"
# Wakefield Kirkgate -- also a `grand-central-bradford.toml` station; see
# the top-of-file comment. Not to be confused with Wakefield Westgate
# (WKF), a different station used by `northern-wakefield-line.toml`/
# `lner-leeds.toml`.

[[stations]]
crs = "DRT"
role = "minor"
segment = "northern-hallam-line"
# Darton.

[[stations]]
crs = "BNY"
role = "junction"
segment = "northern-barnsley-sheffield"
# Barnsley -- shared trunk with `northern-penistone.toml`; see the
# top-of-file comment. This file's own exclusive segment ends at the
# previous station, Darton.

[[stations]]
crs = "WOM"
role = "minor"
segment = "northern-barnsley-sheffield"
# Wombwell.

[[stations]]
crs = "ELR"
role = "minor"
segment = "northern-barnsley-sheffield"
# Elsecar.

[[stations]]
crs = "CLN"
role = "minor"
segment = "northern-barnsley-sheffield"
# Chapeltown (South Yorkshire).

[[stations]]
crs = "MHS"
role = "major"
segment = "northern-barnsley-sheffield"
# Meadowhall.

[[stations]]
crs = "SHF"
role = "terminus"
segment = "northern-barnsley-sheffield"
# Sheffield.

role = "minor"
segment = "chatham-medway"

[[stations]]
crs = "LGF"
role = "minor"
segment = "chatham-medway"

[[stations]]
crs = "MEP"
role = "minor"
segment = "chatham-medway"

[[stations]]
crs = "SOR"
role = "minor"
segment = "chatham-medway"

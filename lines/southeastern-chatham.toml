id = "southeastern-chatham"
name = "Chatham Main Line"
mode = "national-rail"
category = "main-line"
operators = ["SE"]

sample_stations = ["VIC", "CTM", "RAM", "DVP"]
match_keywords = ["Chatham Main Line"]

# "Hastings line" is a distinct, separate Southeastern corridor (diverging
# from the SEML at Tonbridge, not from anywhere on this line) that shares no
# station with this file, so an operator-only "SE" incident naming it
# explicitly shouldn't also tag this file.
#
# REVIEW FIX (final whole-branch review of this batch): "South Eastern Main
# Line" was removed from this list. southeastern-main-line.toml (Task 5.1)
# and this file both terminate at Dover Priory - DVP is listed in both
# files' `[[stations]]` (see the DVP comment below) - and `is_excluded` in
# crates/aggregator/src/matcher.rs is a HARD VETO evaluated BEFORE station
# matching, so an incident naming both routes with
# `affected_stations = ["DVP"]` was silently vetoed on both files at once,
# returning zero matches instead of the two correct ones. The entry bought
# nothing either: `lines_affected_by` already drops every `OperatorOnly`
# match whenever any precise match exists, and this file's own
# `match_keywords` is just ["Chatham Main Line"], so no KeywordOnly false
# positive was possible. Station-CRS matching already disambiguates DVP
# correctly (see chatham_dover_branch_incident_does_not_propagate_to_seml
# in matcher.rs). "Hastings line" stays - no file models that route and it
# shares no station here, so it causes none of the above harm.
excluded_keywords = ["Hastings line"]

# London Victoria to Ramsgate and Dover Priory via Herne Hill, Bromley
# South and the Medway towns (Chatham, Gillingham). Ordered London to
# Kent coast. Verified against Wikipedia's "Chatham Main Line" article
# (lead sentence: "a railway line in England between London Victoria, and
# Dover Priory and Ramsgate... via the Medway towns") cross-checked against
# railwaycodes.org.uk's CRS-code tables (crs/crsb.shtm, crsc.shtm,
# crsd.shtm, crsf.shtm, crsg.shtm, crsh.shtm, crsk.shtm, crsl.shtm,
# crsm.shtm, crsr.shtm, crss.shtm) and, for codes that page truncated
# before reaching (Bromley South, Broadstairs, Swanley, Sole Street,
# Strood, Sittingbourne, Snowdown, Teynham, Westgate-on-Sea, Whitstable,
# Adisham, Aylesham, Shepherds Well), the individual station's own
# Wikipedia infobox instead.
#
# One code conflict was found and resolved the same way Task 5.1 flagged
# for Staplehurst/Ashford International: railwaycodes.org.uk's crsr.shtm
# fetch rendered Rochester (Kent) as "ROC", but Rochester's own Wikipedia
# infobox states "RTR" and explicitly confirms itself as "on the Chatham
# Main Line... between Sole Street and Chatham". RTR is used here as the
# better-attested code from a direct station-specific source.
#
# Route geography: this is not a simple two-way fork. Past Faversham the
# route splits into (a) the coastal loop via Whitstable/Herne Bay/
# Birchington/Westgate-on-Sea/Margate/Broadstairs to Ramsgate, which in
# reality continues on round the coast via Minster/Sandwich/Deal/Walmer/
# Martin Mill to rejoin the direct route at Dover, and (b) the direct
# inland route via Canterbury East/Bekesbourne/Adisham/Aylesham/Snowdown/
# Shepherds Well/Kearsney to Dover Priory.
#
# BRANCH-RESEARCH (Task 5.1 of the station-catalogue-completeness plan):
# the Ramsgate-onward stretch is now confirmed. Minster (MSR) is a
# junction where this route meets the separate Ashford - Canterbury West
# - Ramsgate line (not covered by this catalogue); from there the route
# continues Minster -> Sandwich (SDW) -> Deal (DEA) -> Walmer (WAM) ->
# Martin Mill (MTM), each confirmed via that station's own Wikipedia
# infobox cross-checked against a second source (nationalrail.co.uk's
# /stations/<crs>/details.html for MSR, SDW and WAM; railwaycodes.org.uk's
# crsd.shtm/crsm.shtm tables for DEA and MTM). These five stations are
# tagged with a new `chatham-deal` segment rather than continuing
# `chatham-coastal`: past Minster the route leaves the North Sea/Thames
# Estuary coast that WHI-through-RAM front and instead runs inland then
# down to the Dover Strait coast, historically the separate Dover and
# Deal Joint Railway rather than the LCDR coastal alignment north of
# Ramsgate - a genuine physical-character change, not a station strictly
# between two already-`chatham-coastal` stations. Grepped `lines/*.toml`
# first to confirm no other file already uses `chatham-deal`.
#
# What's still NOT modelled: Martin Mill's own Wikipedia infobox confirms
# its next station towards Dover is Dover Priory itself (DVP), so the
# loop does physically rejoin the direct route there. DVP is not
# duplicated as a second `[[stations]]` entry for this branch, though:
# `stations_between()` in crates/common/src/lib.rs resolves "between A
# and B" by array index, and this file already lists DVP once, as
# `chatham-dover`'s terminus after Kearsney (see that segment below). A
# second DVP entry positioned after Martin Mill would make
# `stations_between` ambiguous for any query mentioning DVP - `.position`
# only finds the first match, so one of the two branches' own
# "between ... and Dover Priory" slicing would silently include the
# other branch's stations. Rather than risk that silent corruption, this
# file keeps a single DVP entry (unchanged, still `chatham-dover`) and
# ends `chatham-deal` at Martin Mill, the last new station confirmed.
# This is the right call between two imperfect options - it preserves
# correctness for the pre-existing, more important `chatham-dover`
# CBE-to-DVP resolution - but it does NOT make the MTM-to-DVP pair
# safe: with the single DVP entry positioned at the very end of the
# file (after the whole `chatham-dover` branch), a hypothetical
# `stations_between("MTM", "DVP")` call would not return nothing, it
# would silently return MTM plus the entire unrelated `chatham-dover`
# branch (CBE, BKS, ADM, AYH, SWO, SPH, KSN) plus DVP - the same
# "silently wrong branch" failure mode described above, just landing on
# the pair that was deliberately left broken rather than the pair that
# was deliberately kept correct. DVP itself was already
# `has_station() == true` for this file before this task via the
# existing `chatham-dover` entry, so no station goes unrepresented -
# only `stations_between` queries naming both MTM (or any `chatham-deal`
# station) and DVP together are unsafe, and that risk is disclosed here
# rather than left for a future reader to discover the hard way. (This
# flat-array/branching-index limitation isn't new to this task - the
# same ambiguity already existed pre-task at the FAV divergence point
# between `chatham-coastal` and `chatham-dover`.)
#
# southeastern-highspeed.toml's own header comment (around lines 70-79)
# says it deliberately left this same stretch out too, "for consistency"
# with this file's then-unconfirmed state. That stretch is now confirmed
# here through Martin Mill (see above) - a future task extending
# southeastern-highspeed.toml's own North Kent pattern coverage should
# treat Minster/Sandwich/Deal/Walmer/Martin Mill as independently
# verified now, not still an open gap, and can decide its own
# segment/station-overlap treatment the same way it already did for
# `chatham-medway`/`chatham-coastal` (station overlap, not shared
# segment - see hs1_northkent_station_overlap_matches_both_chatham_and_hs1_as_independent_exclusive_segments
# in crates/aggregator/src/matcher.rs).
#
# Both eastern branches are covered in this ONE file (unlike Task 5.1's
# Hastings-line exclusion) because Wikipedia's own "Chatham Main Line"
# article treats Victoria-to-Dover-Priory-and-Ramsgate as a single route
# with a late split at Faversham, not two separately-named corridors the
# way SEML and the Hastings line are.
#
# Branches not covered by this catalogue, noted where they diverge:
# Bromley North branch (from Bickley), Maidstone East line (from Swanley),
# North Kent Line (from Strood), Sheerness Line (from Sittingbourne), and
# the Catford Loop Line alternative Victoria routing (from Shortlands, via
# Catford/Peckham Rye rather than Herne Hill/Brixton).
#
# FILL-IN (Task 5.1 of the station-catalogue-completeness plan): the four
# suburban/slow-line stations between Herne Hill and Bromley South (West
# Dulwich, Sydenham Hill, Penge East, Kent House) are now confirmed and
# inserted below at their true geographic position, in `chatham-london`
# (they sit on the same physical stretch as the rest of that segment - no
# new segment-boundary judgment needed). Order confirmed via each
# station's own Wikipedia infobox ("preceding station"/"following
# station" service-table fields): Herne Hill -> West Dulwich -> Sydenham
# Hill -> Penge East -> Kent House -> Beckenham Junction. CRS codes:
# WDU, PNE and KTH cross-checked against railwaycodes.org.uk's crsw.shtm/
# crsp.shtm/crsk.shtm tables; SYH's crss.shtm fetch truncated before
# reaching it (same truncation issue noted above for other S-prefixed
# codes), so SYH was instead cross-checked against nationalrail.co.uk's
# own /stations/syh/details.html page ("Sydenham Hill (SYH)").
#
# DVP (Dover Priory) is also the southeastern-main-line.toml terminus, but
# the two lines approach it from physically different directions (this
# line via Kearsney from the north; SEML via Folkestone from the
# southeast) that only converge at the station itself - station overlap
# only, no segment sharing, per the xc-south-coast.toml/xc-manchester.toml
# precedent (and the same judgment southeastern-main-line.toml already
# made for LBG/Thameslink).
#
# This is the second Southeastern file in the catalogue; none of its
# segments are shared with southeastern-main-line.toml's seml-* segments
# today. Segment names use a "chatham-" prefix (matching the file id) -
# the brief for this task doesn't require reusing seml-*'s abbreviation
# style, only internal consistency, and "chatham-" also matches this
# catalogue's more common full-word-prefix convention (northern-*,
# elizabeth-*, wcml-*, xc-*, swr-*).
[[stations]]
crs = "VIC"
role = "terminus"
segment = "chatham-london"

[[stations]]
crs = "HNH"
role = "major"
segment = "chatham-london"

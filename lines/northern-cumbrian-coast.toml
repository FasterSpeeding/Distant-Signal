id = "northern-cumbrian-coast"
name = "Cumbrian Coast Line"
mode = "national-rail"
category = "regional"
operators = ["NT"]

destination_crs_filter = ["BIF", "CAR"]
sample_stations = ["WTH", "WKG", "CAR"]
match_keywords = ["Cumbrian Coast Line"]

# Generally-hourly rural line (Barrow-Carlisle, single track for long
# stretches): same rationale as the Furness Line and the Lakes Line.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# Barrow-in-Furness to Carlisle via Whitehaven and Workington, ordered
# south-west to north-east. Shares its Barrow end with `northern-furness`
# (segment "northern-furness" — Barrow is the junction station per
# SCHEMA.md's shared-trunk rule of thumb; `northern-furness.toml`'s own
# comment flags this route as the gap this file fills). The exclusive
# stretch beyond Barrow starts at the next station north-west.
#
# --- [FILL-IN] resolved (Task 2.4, 2026-09-01): intermediate halts researched ---
# The "only principal/town stations" framing this file used to carry here
# does not hold up against SCHEMA.md, which requires every real,
# currently-open, currently-served station, not just principal/town ones.
# All 20 named candidates (Askam, Kirkby-in-Furness, Foxfield, Green Road,
# Silecroft, Bootle, Ravenglass, Drigg, Seascale, Sellafield, Braystones,
# Nethertown, St Bees, Corkickle, Parton, Harrington, Flimby, Aspatria,
# Wigton, Dalston) are real, currently-open, Northern-operated stations,
# added below at their correct geographic position. Each CRS was
# cross-checked against two independent sources: each station's own
# Wikipedia infobox/article, and National Rail Enquiries'
# nationalrail.co.uk/stations/<crs>/details.html page (which also confirmed
# current Northern operation). A WebSearch summary of Wikipedia's Cumbrian
# Coast Line article (26 stations total, Barrow-Carlisle) matches exactly:
# the 6 already listed below plus these 20 named candidates, so the old
# comment's trailing "etc." does not hide any further currently-open
# station beyond this list. Only Bootle's TIPLOC (BOOTLE) was confirmed to
# a second source; the other 19 carry no `tiploc` rather than a guessed
# one. All 20 inherit the `northern-cumbrian-coast` segment already
# covering this stretch, per SCHEMA.md's "no new segment for a station
# strictly between two already-modelled stations" rule — none of them is a
# junction to another line in this catalogue. Fetched 2026-09-01.
[[stations]]
crs = "BIF"
tiploc = "BARROW"
role = "junction"
segment = "northern-furness"

[[stations]]
crs = "ASK"
role = "minor"
segment = "northern-cumbrian-coast"
# Askam.


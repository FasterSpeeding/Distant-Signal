id = "grand-central"
name = "Grand Central"
mode = "national-rail"
category = "regional"
operators = ["GC"]
# Open-access operator (outside the 2024 Act nationalisation programme —
# pays track access charges and takes full commercial risk, per the
# gap-analysis document's "Open access operators" section). Reporting mark
# `GC` confirmed via railwaycodes.org.uk's own operator-code table ("Grand
# Central Railway Company / Grand Central, 10 December 2006 to date") and
# cross-checked against Wikipedia's "Grand Central (train operating
# company)" article, which uses the same reporting mark throughout.

# One representative intermediate station plus the terminus for each of the
# two branches, so LDBWS sampling covers both routes rather than just one.
sample_stations = ["HPL", "SUN", "HFX", "BDI"]
# Sunderland and Bradford Interchange are this file's two genuine termini —
# using them to disambiguate which branch an LDBWS service belongs to at
# the shared King's Cross-area trunk stations.
destination_crs_filter = ["SUN", "BDI"]

match_keywords = ["Grand Central"]
# "Grand Central" is also the name of Birmingham New Street's shopping
# centre (reopened under that name 24 September 2015 after redevelopment
# from "The Pallasades" — confirmed via Wikipedia's "Grand Central,
# Birmingham" article, which explicitly disambiguates it from the railway
# station itself: "not to be confused with Birmingham New Street railway
# station"). Grand Central the train operator never serves Birmingham, so
# vetoing any incident that also mentions Birmingham is a safe, purely
# defensive exclusion — the same kind of veto `elizabeth-heathrow.toml`
# already uses for "Heathrow Express"/Piccadilly line overlap.
excluded_keywords = ["Birmingham"]

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10
# Same values as the LNER open-access-adjacent branch files
# (`lner-hull.toml`, `lner-lincoln.toml`): long-distance, low-frequency
# service (six trains per day each way to Sunderland, four to Bradford
# Interchange — see below) where a single cancellation is a much bigger
# share of the day's service than on a metro-frequency line.

# ---------------------------------------------------------------------
# Route research (verified against two independent sources each; see the
# station-level comments below for the individual CRS-code citations):
#
# Both of Grand Central's routes are confirmed CURRENTLY operating, not
# historical. Grand Central's Bradford Interchange service has had a
# suspension in its history (COVID-19: withdrawn 3 April 2020, briefly
# restored, withdrawn again 6 November 2020, restored with limits in
# December 2020, suspended again 9 January-1 March 2021 — Wikipedia's
# "Grand Central (train operating company)" article), but nothing in that
# article or in Bradford Interchange's own Wikipedia article (checked
# specifically for any 2023-2026 disruption to the rail service, as
# opposed to the unrelated bus-station closure of the same name discussed
# there) indicates a current suspension. Positive evidence both routes are
# live today: the ORR granted Grand Central a further extension of its
# operating rights in March 2025 "allowing for the continuation of their
# existing services until December 2038" (Wikipedia, same article), and
# Grand Central ordered nine new 5-car Hitachi trains in April 2025 — both
# read as an operator expanding, not winding down, current service.
#
# - King's Cross-Sunderland ("North Eastern" service): six trains per day
#   each way (five on Sundays), via Hartlepool and York, all calling at
#   Hartlepool, Eaglescliffe, Northallerton, Thirsk and York; four also
#   call at Seaham; one per day (Monday-Saturday) also calls at
#   Peterborough. Confirmed via Wikipedia's "Grand Central (train
#   operating company)" article and cross-checked against Wikipedia's
#   "Sunderland railway station" article, which independently gives the
#   identical calling-point list and frequency.
# - King's Cross-Bradford Interchange ("West Riding" service): four trains
#   per day each way, via Doncaster, Pontefract Monkhill (select services
#   only), Wakefield Kirkgate, Mirfield, Brighouse, Halifax and Low Moor;
#   one per day (Monday-Saturday) also calls at Peterborough. Started 23
#   May 2010; a fourth daily service was added in December 2013. Confirmed
#   via Wikipedia's "Grand Central (train operating company)" article and
#   cross-checked against Wikipedia's "Halifax railway station" article
#   ("regular services to London King's Cross via Wakefield Kirkgate,
#   Pontefract and Doncaster") and Wikipedia's "Bradford Interchange
#   railway station" article (independently confirms "four trains per day"
#   and the 23 May 2010 start date).
#
# Both routes leave King's Cross together and run the same East Coast Main
# Line tracks as far as Doncaster (there is no other route north from
# Peterborough to York, which the Sunderland service reaches, than via the
# ECML through Doncaster — the same "physically runs over this trunk track
# even where this line's own trains don't stop" reasoning `lner-hull.toml`
# and `lner-leeds.toml` already apply to their own Doncaster-area
# divergence, since neither of Grand Central's own routes is confirmed to
# stop at Doncaster itself), before genuinely diverging: Sunderland-bound
# services continue north on the ECML to York and beyond; Bradford-bound
# services turn off onto the West Riding lines at Doncaster. This is a
# real shared trunk between Grand Central's own two routes (matching
# `swr-south-west-main.toml`'s Bournemouth+Weymouth structure), just
# entirely internal to this one file rather than shared with another line
# file — so it's modelled as one file with a shared `gc-trunk-kings-cross`
# segment and two branch segments, per the task brief's guidance.
#
# Per SCHEMA.md's junction rule, Doncaster belongs to the shared trunk,
# not either branch's exclusive segment; each branch's own exclusive
# segment starts at the next station after Doncaster.
#
# Deliberately NOT sharing `ecml-london`/`ecml-fenland`/`ecml-doncaster`
# with `lner-ecml.toml`/`lner-leeds.toml`/`lner-hull.toml`/
# `lner-lincoln.toml`, and NOT reusing `xc-yorkshire`/`northern-yorkshire`
# where this file's own King's Cross/Peterborough/Doncaster/York stations
# coincide with theirs: the plan and gap-analysis document are explicit
# that Grand Central's relationship to LNER (and to Northern/CrossCountry,
# which also touch Doncaster/York) is station-overlap-only, following the
# same `xc-south-coast.toml` precedent used throughout this catalogue —
# station-level overlap is expected and sufficient, and forcing a shared
# segment name isn't required or wanted here. Consequently, per the task
# brief, NO shared-trunk regression test against any `lner-*.toml` file is
# included below (the plan's own documented exception for this task); the
# tests below instead cover (a) an exclusive-segment incident on Grand
# Central's own territory, and (b) a same-file, self-contained check that
# an incident on the internal King's Cross-Doncaster trunk still resolves
# to Grand Central with `ExclusiveSegment` scope (since `grand-central` is
# the only line using its own `gc-trunk-kings-cross` segment name, even
# though the physical station is also — separately — on other lines' own,
# differently-named segments).
# ---------------------------------------------------------------------

[[stations]]
crs = "KGX"
role = "terminus"
segment = "gc-trunk-kings-cross"

[[stations]]
crs = "PBO"
role = "major"
segment = "gc-trunk-kings-cross"
# One train per day (Monday-Saturday) on each route calls here; both
# routes' other services run non-stop through Peterborough.

[[stations]]
crs = "DON"
tiploc = "DONC"
role = "junction"
segment = "gc-trunk-kings-cross"
# Bradford-bound services turn off the ECML onto the West Riding lines
# here. Sunderland-bound services are not confirmed to call at Doncaster,
# but physically continue north on the same ECML tracks through it (the
# only route from Peterborough to York) — see the file-level comment above
# for why it's still listed as this file's shared-trunk boundary, matching
# `lner-hull.toml`/`lner-leeds.toml`'s identical treatment of this exact
# station for their own ECML-departure branches.

[[stations]]
crs = "YRK"
tiploc = "YORK"
role = "major"
segment = "gc-sunderland"
# CRS/TIPLOC reused from `lner-ecml.toml`'s own verified YRK entry, not
# re-researched here.

[[stations]]
crs = "THI"
role = "minor"
segment = "gc-sunderland"
# CRS confirmed via Wikipedia's "Thirsk railway station" article.

[[stations]]
crs = "NTR"
role = "minor"
segment = "gc-sunderland"
# Northallerton — CRS reused from `lner-ecml.toml`'s own verified NTR
# entry (station-overlap-only with LNER's ECML spine here, same as at
# King's Cross/Peterborough/Doncaster/York above; LNER's own through
# services also call at Northallerton, but Grand Central diverges off the
# ECML immediately north of here toward Eaglescliffe, so no segment is
# shared).

[[stations]]
crs = "EAG"
role = "minor"
segment = "gc-sunderland"
# CRS confirmed via Wikipedia's "Eaglescliffe railway station" article.

[[stations]]
crs = "HPL"
role = "major"
segment = "gc-sunderland"
# CRS confirmed via Wikipedia's "Hartlepool railway station" article and
# cross-checked against Wikipedia's "Sunderland railway station" article
# (independently lists Hartlepool as a calling point on this service).

[[stations]]
crs = "SEA"
role = "minor"
segment = "gc-sunderland"
# CRS confirmed via Wikipedia's "Seaham railway station" article. Only
# four of the six daily Sunderland services call here (see file-level
# comment above) — still listed as an ordinary station on this branch,
# matching this catalogue's existing convention of not splitting a file
# over partial/select-service calling patterns (e.g. `lner-leeds.toml`'s
# Peterborough calls, `lner-lincoln.toml`'s once-daily pattern).

[[stations]]
crs = "SUN"
role = "terminus"
segment = "gc-sunderland"
# CRS confirmed via Wikipedia's "Sunderland railway station" article,
# which also independently corroborates this whole branch's calling-point
# list and frequency (six trains per day, five on Sundays, via Hartlepool
# and York) against the Grand Central operator article used above.

[[stations]]
crs = "PFM"
role = "minor"
segment = "gc-bradford"
# Pontefract Monkhill — CRS confirmed via Wikipedia's "Pontefract Monkhill
# railway station" article. Select services only (see file-level comment
# above); listed as an ordinary station on this branch regardless, same
# convention as Seaham above.

[[stations]]
crs = "WKK"
role = "major"
segment = "gc-bradford"
# CRS confirmed via Wikipedia's "Wakefield Kirkgate railway station"
# article and cross-checked against Wikipedia's "Halifax railway station"
# article, which independently names Wakefield Kirkgate on this route.

[[stations]]
crs = "MIR"
role = "minor"
segment = "gc-bradford"
# CRS confirmed via Wikipedia's "Mirfield railway station" article.

[[stations]]
crs = "BGH"
role = "minor"
segment = "gc-bradford"
# CRS confirmed via Wikipedia's "Brighouse railway station" article.

[[stations]]
crs = "HFX"
role = "major"
segment = "gc-bradford"
# CRS confirmed via Wikipedia's "Halifax railway station" article, which
# also independently corroborates this branch's route via Wakefield
# Kirkgate/Pontefract/Doncaster against the Grand Central operator article
# used above.

[[stations]]
crs = "LMR"
role = "minor"
segment = "gc-bradford"
# CRS confirmed via Wikipedia's "Low Moor railway station" article.

[[stations]]
crs = "BDI"
role = "terminus"
segment = "gc-bradford"
# CRS confirmed via Wikipedia's "Bradford Interchange railway station"
# article, which also independently corroborates this branch's frequency
# (four trains per day) and 23 May 2010 start date against the Grand
# Central operator article used above, and confirms no current suspension
# or disruption to the rail service (the station's 2024-2025 bus-station
# closure, also discussed there, is unrelated to the railway).

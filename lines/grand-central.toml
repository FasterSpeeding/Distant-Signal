id = "grand-central"
name = "Grand Central"
mode = "national-rail"
category = "regional"
operators = ["GC"]
# Open-access operator (outside the 2024 Act nationalisation programme —
# pays track access charges and takes full commercial risk, per the
# gap-analysis document's "Open access operators" section). Reporting mark
# `GC` confirmed via railwaycodes.org.uk's own operator-code table ("Grand
# Central Railway Company / Grand Central, 10 December 2006 to date") and
# cross-checked against Wikipedia's "Grand Central (train operating
# company)" article, which uses the same reporting mark throughout.

sample_stations = ["HPL", "SUN"]
# Sunderland is this file's genuine terminus — using it to disambiguate
# which branch an LDBWS service belongs to at the shared King's Cross-area
# trunk stations it shares with `grand-central-bradford.toml`.
destination_crs_filter = ["SUN"]

match_keywords = ["Grand Central"]
# "Grand Central" is also the name of Birmingham New Street's shopping
# centre (reopened under that name 24 September 2015 after redevelopment
# from "The Pallasades" — confirmed via Wikipedia's "Grand Central,
# Birmingham" article, which explicitly disambiguates it from the railway
# station itself: "not to be confused with Birmingham New Street railway
# station"). Grand Central the train operator never serves Birmingham, so
# vetoing an incident that also names the shopping centre is a safe,
# purely defensive exclusion — the same kind of veto `elizabeth-heathrow.toml`
# already uses for "Heathrow Express"/Piccadilly line overlap. Narrowed
# (final review, Fix #3) from a bare "Birmingham" match to the venue's own
# name+city phrase, so a legitimate Grand Central incident that happens to
# mention a diversion via Birmingham isn't wrongly vetoed. Duplicated
# identically on `grand-central-bradford.toml`, since both files keep the
# same brand `match_keywords`.
excluded_keywords = ["Grand Central, Birmingham"]

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10
# Same values as the LNER open-access-adjacent branch files
# (`lner-hull.toml`, `lner-lincoln.toml`): long-distance, low-frequency
# service (six trains per day each way to Sunderland — see below) where a
# single cancellation is a much bigger share of the day's service than on
# a metro-frequency line.

# ---------------------------------------------------------------------
# Route research (verified against two independent sources each; see the
# station-level comments below for the individual CRS-code citations):
#
# Confirmed CURRENTLY operating, not historical. Positive evidence this
# route is live today: the ORR granted Grand Central a further extension of
# its operating rights in March 2025 "allowing for the continuation of
# their existing services until December 2038" (Wikipedia's "Grand Central
# (train operating company)" article), and Grand Central ordered nine new
# 5-car Hitachi trains in April 2025 — both read as an operator expanding,
# not winding down, current service.
#
# King's Cross-Sunderland ("North Eastern" service): six trains per day
# each way (five on Sundays), via Hartlepool and York, all calling at
# Hartlepool, Eaglescliffe, Northallerton, Thirsk and York; four also call
# at Seaham; one per day (Monday-Saturday) also calls at Peterborough.
# Confirmed via Wikipedia's "Grand Central (train operating company)"
# article and cross-checked against Wikipedia's "Sunderland railway
# station" article, which independently gives the identical calling-point
# list and frequency.
#
# ===== Cross-file shared trunk (final review, Fix #1) =====
# This route leaves King's Cross on the same East Coast Main Line tracks as
# Grand Central's other route, King's Cross-Bradford Interchange (now
# modelled in the separate `grand-central-bradford.toml` file — the two
# routes were originally, incorrectly, combined into this one non-linear
# file; split per the final review, since SCHEMA.md's linear-ordering
# contract and this plan's own "one line per file" Global Constraint both
# require it), before genuinely diverging at Doncaster: this route
# continues north on the ECML to York and beyond, while the Bradford route
# turns off onto the West Riding lines. `gc-trunk-kings-cross` (King's
# Cross, Peterborough, Doncaster) is therefore a genuine CROSS-FILE shared
# trunk between this file and `grand-central-bradford.toml` — the same role
# `swr-trunk-waterloo` plays across `swr-south-west-main.toml`,
# `swr-portsmouth-direct.toml` and `swr-alton.toml`. The KGX/PBO/DON station
# entries below are byte-for-byte identical to `grand-central-bradford.toml`'s
# own KGX/PBO/DON entries, which is what makes the shared segment name
# genuinely meaningful rather than coincidental.
#
# Per SCHEMA.md's junction rule, Doncaster belongs to the shared trunk, not
# either branch's exclusive segment; each branch's own exclusive segment
# starts at the next station after Doncaster.
#
# Deliberately NOT sharing `ecml-london`/`ecml-fenland`/`ecml-doncaster`
# with `lner-ecml.toml`/`lner-leeds.toml`/`lner-hull.toml`/
# `lner-lincoln.toml`, and NOT reusing `xc-yorkshire`/`northern-yorkshire`
# where this file's own King's Cross/Peterborough/Doncaster/York stations
# coincide with theirs: the plan and gap-analysis document are explicit
# that Grand Central's relationship to LNER (and to Northern/CrossCountry,
# which also touch Doncaster/York) is station-overlap-only, following the
# same `xc-south-coast.toml` precedent used throughout this catalogue —
# station-level overlap is expected and sufficient, and forcing a shared
# segment name isn't required or wanted here.
# ---------------------------------------------------------------------

[[stations]]
crs = "KGX"
role = "terminus"
segment = "gc-trunk-kings-cross"

[[stations]]
crs = "PBO"
role = "major"
segment = "gc-trunk-kings-cross"
# One train per day (Monday-Saturday) on each route calls here; both
# routes' other services run non-stop through Peterborough.

[[stations]]
crs = "DON"
tiploc = "DONC"
role = "junction"
segment = "gc-trunk-kings-cross"
# Bradford-bound services (see `grand-central-bradford.toml`) turn off the
# ECML onto the West Riding lines here. Sunderland-bound services are not
# confirmed to call at Doncaster, but physically continue north on the
# same ECML tracks through it (the only route from Peterborough to York) —
# see the file-level comment above for why it's still listed as this
# file's shared-trunk boundary, matching `lner-hull.toml`/`lner-leeds.toml`'s
# identical treatment of this exact station for their own ECML-departure
# branches.

[[stations]]
crs = "YRK"
tiploc = "YORK"
role = "major"
segment = "gc-sunderland"
# CRS/TIPLOC reused from `lner-ecml.toml`'s own verified YRK entry, not
# re-researched here.

[[stations]]
crs = "THI"
role = "minor"
segment = "gc-sunderland"
# CRS confirmed via Wikipedia's "Thirsk railway station" article.

[[stations]]
crs = "NTR"
role = "minor"
segment = "gc-sunderland"
# Northallerton — CRS reused from `lner-ecml.toml`'s own verified NTR
# entry (station-overlap-only with LNER's ECML spine here, same as at
# King's Cross/Peterborough/Doncaster/York above; LNER's own through
# services also call at Northallerton, but Grand Central diverges off the
# ECML immediately north of here toward Eaglescliffe, so no segment is
# shared).

[[stations]]
crs = "EAG"
role = "minor"
segment = "gc-sunderland"
# CRS confirmed via Wikipedia's "Eaglescliffe railway station" article.

[[stations]]
crs = "HPL"
role = "major"
segment = "gc-sunderland"
# CRS confirmed via Wikipedia's "Hartlepool railway station" article and
# cross-checked against Wikipedia's "Sunderland railway station" article
# (independently lists Hartlepool as a calling point on this service).

[[stations]]
crs = "SEA"
role = "minor"
segment = "gc-sunderland"
# CRS confirmed via Wikipedia's "Seaham railway station" article. Only
# four of the six daily Sunderland services call here (see file-level
# comment above) — still listed as an ordinary station on this branch,
# matching this catalogue's existing convention of not splitting a file
# over partial/select-service calling patterns (e.g. `lner-leeds.toml`'s
# Peterborough calls, `lner-lincoln.toml`'s once-daily pattern).

[[stations]]
crs = "SUN"
role = "terminus"
segment = "gc-sunderland"
# CRS confirmed via Wikipedia's "Sunderland railway station" article,
# which also independently corroborates this whole branch's calling-point
# list and frequency (six trains per day, five on Sundays, via Hartlepool
# and York) against the Grand Central operator article used above.

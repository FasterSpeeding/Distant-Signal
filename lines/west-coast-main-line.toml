id = "wcml"
name = "West Coast Main Line"
mode = "national-rail"
category = "main-line"
operators = [
  "VT",  # Avanti West Coast (formerly Virgin Trains)
  "LM",  # London Northwestern Railway
  "LN",  # West Midlands Trains (London Northwestern services)
  "CS",  # Caledonian Sleeper
]

# South, midpoint(s), north.
sample_stations = ["EUS", "MKC", "CRE", "PRE", "CAR"]
match_keywords = ["West Coast Main Line", "WCML"]
# XC services share track but aren't WCML proper.
excluded_keywords = ["Cross Country"]

# Ordered south to north. Branches (e.g. Birmingham via Trent Valley)
# are not included here — they belong in their own line definitions
# that share operators with this one.
[[stations]]
crs = "EUS"
tiploc = "EUSTON"
role = "terminus"
segment = "wcml-london"

[[stations]]
crs = "WFJ"
tiploc = "WATFDJ"
role = "major"
segment = "wcml-london"


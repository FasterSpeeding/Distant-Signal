id = "wcml"
name = "West Coast Main Line"
mode = "national-rail"
category = "main-line"
operators = [
  "VT",  # Avanti West Coast (formerly Virgin Trains)
  # LM = West Midlands Trains, which runs both the London Northwestern
  # Railway and West Midlands Railway brands under this single ATOC code.
  # Previously this file also listed "LN" as if it were a second, distinct
  # code for London Northwestern services -- that was checked and found
  # unsupported: Network Rail's own "References and Symbols" doc (fetched
  # live 2026-08-29, https://www.networkrail.co.uk/wp-content/uploads/2020/02/NRT-References-and-Symbols.pdf)
  # lists a complete ATOC code table with a single "LM" entry covering both
  # franchises and no "LN" entry anywhere in it, independently corroborating
  # railwaycodes.org.uk's claim (the gap analysis's only source, flagged
  # there as unconfirmed to the same standard as the AW/VT finding) that
  # WMR and LNWR share "LM" and "LN" is not used in GBTT/eNRT. Two
  # independent sources now agree, so "LN" is removed as a phantom code.
  "LM",  # West Midlands Trains (West Midlands Railway + London Northwestern Railway)
  "CS",  # Caledonian Sleeper
]

# South, midpoint(s), north.
sample_stations = ["EUS", "MKC", "CRE", "PRE", "CAR"]
match_keywords = ["West Coast Main Line", "WCML"]
# XC services share track but aren't WCML proper.
excluded_keywords = ["Cross Country"]

# Ordered south to north. Branches (e.g. Birmingham via Trent Valley)
# are not included here — they belong in their own line definitions
# that share operators with this one.
[[stations]]
crs = "EUS"
tiploc = "EUSTON"
role = "terminus"
segment = "wcml-london"

[[stations]]
crs = "WFJ"
tiploc = "WATFDJ"
role = "major"
segment = "wcml-london"


id = "tfw-marches"
name = "Marches Line"
mode = "national-rail"
category = "main-line"
operators = ["AW"]

sample_stations = ["NWP", "HFD", "SHR", "CRE"]
match_keywords = ["Marches Line", "Welsh Marches Line"]

# === CORRECTION (real-world-sanity review, 2026-09-21) ===
#
# This file previously modelled its stretch north of Shrewsbury as
# Shrewsbury-Gobowen-Chirk-Ruabon-Wrexham-Chester (the separate "Shrewsbury
# to Chester Line"/Wrexham corridor), under the reasoning that TfW's own
# services table wikilinks "Marches" to the Welsh Marches line article for
# its Manchester Piccadilly-Cardiff Central service group, and that the
# Welsh Marches line article states through Holyhead-Cardiff services "use
# the Marches line from Shrewsbury southwards" -- both true statements, but
# combined into the wrong conclusion about which route north of Shrewsbury
# carries the "Marches" name and the real TfW Manchester-Cardiff flagship.
#
# Independently re-verified this review (Wikipedia's "Welsh Marches line"
# article, raw wikitext, action=raw, fetched directly): the line's own
# "Route" section states plainly, "Northbound from Shrewsbury to Crewe, the
# line runs over the LNWR-owned Crewe and Shrewsbury Railway," and lists the
# intermediate stations Yorton, Wem, Prees, Whitchurch, Wrenbury, Nantwich,
# Crewe -- i.e. the real Welsh Marches line, and the real TfW Manchester
# Piccadilly-Cardiff Central service which the article says "There is a
# generally hourly service from Manchester Piccadilly to Cardiff Central,
# Carmarthen or Milford Haven, calling at principal stations" over, runs
# Shrewsbury-Crewe, not Shrewsbury-Chester. The Shrewsbury-Chester route via
# Gobowen/Chirk/Ruabon/Wrexham is a real, separately-named Wikipedia article
# ("Shrewsbury to Chester line") that the old Holyhead-Cardiff through
# service used historically (per that article: "a through train every two
# hours between Holyhead and Cardiff"), and today carries TfW local
# Wrexham/Chester services, but it is not the "Marches Line" -- Crewe, not
# Chester, is this line's real northern end. That stretch's correct station
# data (previously here) now lives in `lines/tfw-shrewsbury-chester.toml`,
# a new, separately-branded file, rather than being deleted.
#
# Sourcing note (per the catalogue's "cross-checked against a second source"
# standard): NWP, CWM, PPL, AGV, HFD, LEO, LUD, CRV, CTT and SHR keep their
# pre-existing sourcing from before this correction (Wikipedia infobox +
# railwaycodes.org.uk, cross-checked, see git history for the original
# disclosure). The six new Shrewsbury-Crewe intermediate stations (YRT,
# WEM, PRS, WTC, WRE, NAN) were each independently confirmed two ways this
# review: (1) that station's own Wikipedia infobox "Station code" field,
# fetched directly, and (2) a live raw-HTML fetch of the relevant
# railwaycodes.org.uk per-letter CRS page (CRSy/w/p/n.shtm), quoting each
# row in full (name | CRS | NLC | TIPLOC | STANME | STANOX). Both sources
# agree exactly for all six: Yorton/YRT/YORTON, Wem/WEM/WEMM,
# Prees/PRS/PREES, Whitchurch (Shropshire)/WTC/WCHR, Wrenbury/WRE/WRENBRY,
# Nantwich/NAN/NANTWCH. Hadnall, a former stop on this same stretch between
# Shrewsbury and Yorton, was checked and confirmed closed (closed 2 May
# 1960, per its own Wikipedia article) and is not listed. CRE/CREWE is
# reused unchanged from `wcml-north-wales.toml`, itself already
# cross-checked there.
#
# Category ("main-line") and the absence of severity_overrides are
# unaffected by this correction: the Welsh Marches line's own infobox
# describes the line as "double track throughout" end to end (the article
# does not separately break out the Shrewsbury-Crewe stretch, i.e. it is
# covered by that same "double track throughout" claim), and Whitchurch's
# own article confirms it is called by both "local stopping services
# between Shrewsbury and Crewe" and the Manchester Piccadilly-Cardiff
# Central through service -- consistent with the roughly-hourly-or-better
# service pattern this file's category/severity choice already rested on.
#
# `destination_crs_filter` remains deliberately omitted, for the same
# reason as before, restated for the corrected northern end: this line's
# real through-services continue past both ends of this file's own scope --
# south of Newport towards Cardiff/Swansea, and north of Crewe up the West
# Coast Main Line towards Manchester Piccadilly (the Welsh Marches line
# article's own "Manchester Piccadilly to Cardiff Central" framing) -- so
# neither NWP nor CRE reliably distinguishes a Marches Line service from a
# same-operator service merely transiting this file's stations.
#
# Only currently open, passenger-served stations are listed, matching this
# file's pre-existing convention on the Newport-Shrewsbury stretch.
[[stations]]
crs = "NWP"
tiploc = "NWPTRTG"
role = "junction"
segment = "tfw-marches-south"
# Newport is also a junction with the South Wales Main Line and the Ebbw
# Valley Railway (per this station's own Wikipedia article); neither has a
# line file in this catalogue yet, so no shared-segment question arises
# here today -- a future South Wales Main Line file should read this
# comment and decide deliberately whether Newport itself (and only Newport,
# per the shared-trunk rule of thumb) warrants a shared segment name,
# rather than assuming either way.

[[stations]]
crs = "CWM"
tiploc = "CWMBRAN"
role = "major"
segment = "tfw-marches-south"

[[stations]]
crs = "PPL"
tiploc = "PONTYPL"
role = "major"
segment = "tfw-marches-south"
# Pontypool & New Inn.

[[stations]]
crs = "AGV"
tiploc = "ABRGVNY"
role = "major"
segment = "tfw-marches-south"

[[stations]]
crs = "HFD"
tiploc = "HEREFRD"
role = "major"
segment = "tfw-marches-south"
# Hereford: the largest station between Newport and Shrewsbury, and also
# served by Great Western Railway (Cotswold Line to London Paddington) and
# West Midlands Trains (to Birmingham New Street) -- both on separate
# routes out of Hereford, not this line, so no shared-segment question
# arises from them here.

[[stations]]
crs = "LEO"
tiploc = "LEOMNST"
role = "minor"
segment = "tfw-marches-south"

[[stations]]
crs = "LUD"
tiploc = "LUDLOW"
role = "major"
segment = "tfw-marches-south"
# Ludlow.

[[stations]]
crs = "CRV"
tiploc = "CRAVENA"
role = "junction"
segment = "tfw-heart-of-wales-shrewsbury"
# Craven Arms: physical junction with the Heart of Wales Line
# (`tfw-heart-of-wales.toml`). Segment-sharing decision (unaffected by this
# review's correction): SHARED, genuinely warranted, not
# station-overlap-only -- see `heart_of_wales_shrewsbury_shared_trunk_propagates`
# in `crates/common/src/matcher.rs` for the regression test. Two separately-
# maintained Wikipedia articles corroborate actual physical track sharing:
# the Welsh Marches line's own article states directly, "Services via the
# Heart of Wales line use the Marches line between Shrewsbury and Craven
# Arms" -- and the Heart of Wales line's own article corroborates from the
# other side: services "join the main Welsh Marches line at Craven Arms,
# from where trains continue north to terminate at Shrewsbury."

[[stations]]
crs = "CTT"
tiploc = "CSTR"
role = "minor"
segment = "tfw-heart-of-wales-shrewsbury"
# Church Stretton: an ordinary intermediate stop, not itself a junction --
# included in the shared segment because it sits on the physically-shared
# stretch between Craven Arms and Shrewsbury.

[[stations]]
crs = "SHR"
tiploc = "SHRWBY"
role = "junction"
segment = "tfw-heart-of-wales-shrewsbury"
# Shrewsbury is also a junction with the Cambrian Line (`tfw-cambrian.toml`,
# station-overlap only -- the Cambrian Line diverges west immediately) and
# the real Shrewsbury-Chester Line (`lines/tfw-shrewsbury-chester.toml`,
# the file this review's correction split out -- also station-overlap only:
# that route diverges north-west at Shrewsbury onto entirely different
# metals from this line's own Shrewsbury-Crewe stretch, sharing nothing
# beyond the station throat). Per the shared-trunk rule of thumb, the
# junction belongs to the shared segment with Heart of Wales; this line's
# own exclusive segment resumes at the next station, Yorton.

# --- Shrewsbury-Crewe: the real Marches Line stretch north of Shrewsbury,
# added by this review's correction (see the top-of-file note). Ordered
# south to north, following the Welsh Marches line article's own "Route"
# section listing verbatim. Exclusive to this line -- no other file in the
# catalogue reaches Yorton, Wem, Prees, Whitchurch, Wrenbury or Nantwich
# (grepped `lines/*.toml` before adding).
[[stations]]
crs = "YRT"
tiploc = "YORTON"
role = "minor"
segment = "tfw-marches-crewe"
# Yorton: a request stop (confirmed via this station's own Wikipedia
# article).

[[stations]]
crs = "WEM"
tiploc = "WEMM"
role = "minor"
segment = "tfw-marches-crewe"
# Wem: serves the small Shropshire market town of the same name.

[[stations]]
crs = "PRS"
tiploc = "PREES"
role = "minor"
segment = "tfw-marches-crewe"
# Prees.

[[stations]]
crs = "WTC"
tiploc = "WCHR"
role = "major"
segment = "tfw-marches-crewe"
# Whitchurch (Shropshire) -- distinct from Whitchurch (Cardiff, WHT, on
# `tfw-coryton-line.toml`) and Whitchurch (Hampshire, WCH); confirmed
# distinct CRS/TIPLOC values for all three during this review's sourcing
# pass. A market town of a size
# comparable to this file's other "major" stops (Abergavenny, Ludlow), and
# called by both local Shrewsbury-Crewe stoppers and the Manchester
# Piccadilly-Cardiff Central through service, per this station's own
# Wikipedia article.

[[stations]]
crs = "WRE"
tiploc = "WRENBRY"
role = "minor"
segment = "tfw-marches-crewe"
# Wrenbury: an unstaffed request-stop station (confirmed via this station's
# own Wikipedia article).

[[stations]]
crs = "NAN"
tiploc = "NANTWCH"
role = "major"
segment = "tfw-marches-crewe"
# Nantwich: a historic market town, the largest intermediate stop on this
# stretch.

[[stations]]
crs = "CRE"
tiploc = "CREWE"
role = "junction"
segment = "tfw-marches-crewe"
# Crewe: this line's own northern terminus in this catalogue's scope (see
# the `destination_crs_filter` note above on why real through-services
# actually continue further, up the West Coast Main Line towards Manchester
# Piccadilly), and a genuine major multi-route junction -- confirmed
# already appearing in `west-coast-main-line.toml`, `wcml-manchester.toml`,
# `wcml-liverpool.toml`, `wcml-north-wales.toml` and
# `lnwr-birmingham-crewe.toml`, all under that shared `wcml-northwest`
# trunk segment name (or, for the Birmingham line, its own name). This file
# deliberately does NOT reuse `wcml-northwest` here: this line's own
# Shrewsbury-Crewe approach is a physically distinct corridor from the WCML
# spine those files share (confirmed via the Welsh Marches line's own
# article, which describes this stretch as running "over the LNWR-owned
# Crewe and Shrewsbury Railway", a different historical company/alignment
# from the WCML proper) -- station-overlap only, the same pattern this
# catalogue already uses at Chester, Shrewsbury and other big multi-line
# hubs, not a genuine shared trunk. TIPLOC reused verbatim from
# `wcml-north-wales.toml`, itself already cross-checked there.

# Sittingbourne. The Sheerness Line's own exclusive branch (below) diverges
# here; per the shared-trunk rule of thumb the junction itself stays on the
# shared `strood-ramsgate-corridor` segment, matching swr-alton.toml's
# identical treatment of Woking.

# --- Sheerness Line's own exclusive branch, diverging from the Chatham

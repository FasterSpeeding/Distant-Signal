id = "northern-calder-valley"
name = "Calder Valley Line"
mode = "national-rail"
category = "regional"
operators = ["NT"]

destination_crs_filter = ["LDS", "BDI", "MCV"]
sample_stations = ["HFX", "TOD", "MCV"]
match_keywords = ["Calder Valley Line"]

# Leeds/Bradford Interchange to Manchester Victoria via Halifax, Sowerby
# Bridge, Todmorden and Rochdale, ordered east to west. This is a genuinely
# distinct corridor from `northern.toml`'s `northern-transpennine` segment
# (Manchester-Stalybridge-Huddersfield-Leeds, the Standedge Tunnel route):
# Wikipedia's Calder Valley line article confirms the two routes are
# physically separate, stating that "at Dryclough Junction the Huddersfield
# route leaves the main line" close to Halifax — i.e. the lines diverge onto
# different tracks rather than sharing a trunk. No segment name is shared
# with `northern-transpennine`, and this file introduces no new evidence of
# track-sharing between the two corridors, matching the gap analysis's
# framing of them as "two genuinely different Leeds-Manchester corridors,
# both Northern-operated, only one [previously] modelled."
# (docs/superpowers/specs/2026-08-29-line-coverage-gap-analysis.md, "Northern
# - is the existing 6-branch coverage actually complete?"; source:
# https://en.wikipedia.org/wiki/Calder_Valley_line)
#
# Station overlap without segment-sharing, following the `xc-manchester.toml`
# precedent ("station overlap is fine, segment-sharing is a deliberate
# choice"):
#   - LDS (Leeds) is also in `northern.toml`/`northern-yorkshire-coast.toml`
#     under segment `northern-yorkshire` (the York direction) - an unrelated
#     corridor, so no segment is shared here.
#   - MCV (Manchester Victoria) is also in `northern.toml` under segment
#     `northern-manchester` (the Liverpool/Wigan direction) - again unrelated
#     track, so no segment is shared here either.
# This whole line uses one segment, `northern-calder-valley`, because no
# other file in this catalogue currently claims any track between Bradford
# Interchange and Manchester Victoria as its own - it is a standalone
# corridor with nothing to share a trunk with. (Task 8.6's Clitheroe/Ribble
# Valley line, if it exists by the time this is read, approaches Manchester
# via Blackburn - a different corridor to the north; nothing in this
# research found a confirmed shared-trunk point between the two beyond both
# terminating at MCV, which is station-level overlap only, not a segment.)
# Per SCHEMA.md's shared-trunk rule, no test asserting shared-segment
# propagation is included for this file - it would have nothing to
# propagate to.
#
# The initial Leeds-Bradford Interchange section is technically its own
# grouping in the source material ("Leeds-Bradford lines"), separate from
# the Calder Valley line proper, which Wikipedia's own article treats as
# beginning at Bradford Interchange. Both are included here as one ordered,
# physically contiguous route (Leeds services reach Bradford Interchange via
# that initial stretch before joining the Calder Valley line proper
# westbound) since this catalogue models user-facing lines, not the
# underlying route-naming conventions. Some through services continue beyond
# Manchester Victoria towards Blackpool North; that's a separate corridor and
# out of scope here.
#
# CRS codes cross-checked against two independent sources each (Wikipedia
# station infoboxes and nationalrail.co.uk station detail pages), fetched
# 2026-08-29; LDS and MCV were already verified in-repo via `northern.toml`.
#
# --- [FILL-IN] resolved (Task 2.3, 2026-09-01): intermediate halts researched ---
# The old "only principal stations" exclusion rationale (matching
# `xc-manchester.toml`/`northern-cumbrian-coast.toml`) doesn't hold up against
# SCHEMA.md, which requires every real, currently-open, currently-served
# station, not just principal/town ones. The 9 originally-named candidates
# were checked individually, plus a completeness sweep of both stretches
# turned up 4 more not on the original list. CRS codes cross-checked against
# two independent sources each (Wikipedia station infobox/article and
# nationalrail.co.uk/stations/<crs>/details.html), fetched 2026-09-01. No
# `tiploc` is given for any of them - none were confirmed to the two-source
# bar this session (see `northern-airedale.toml`'s FRIZINHAL/SALTAIRE
# TIPLOC-guessing correction for why this matters).
#
#   - Added, real/open/served, on the Leeds-Bradford Interchange stretch:
#     Bramley (BLE) and New Pudsey (NPD).
#   - Added, real/open/served, on the Bradford Interchange-Halifax stretch:
#     Low Moor (LMR) - note its own closed-1965/reopened-2017 history.
#   - Added, real/open/served, on the Halifax-Manchester Victoria stretch:
#     Mytholmroyd (MYT), Hebden Bridge (HBD), Walsden (WDN), Littleborough
#     (LTL), Smithy Bridge (SMB), Castleton (CAS), Mills Hill (MIH) and
#     Moston (MSO) - the last two not on the original named list, found
#     during the completeness sweep of the Todmorden-Rochdale-Manchester
#     Victoria stretch (Wikipedia's Calder Valley line article lists the
#     full run "Todmorden, Walsden, Littleborough, Smithy Bridge, Rochdale,
#     Castleton, Mills Hill, Moston, Newton Heath, Miles Platting, Manchester
#     Victoria"; Newton Heath and Miles Platting are closed - see below).
#
#   - Laisterdyke (on the Leeds-Bradford Interchange stretch) is CLOSED, not
#     open, despite being on the originally-named candidate list: Wikipedia's
#     own Laisterdyke railway station article states it "was closed to
#     passengers on 4 July 1966"; platforms demolished, only the former
#     station house remains. Not added.
#   - Bowling, Wyke and Norwood Green, Lightcliffe and Hipperholme (the
#     remaining stops on the historical Bradford Interchange-Halifax route
#     per Wikipedia's Calder Valley line article) are all CLOSED (1895, 1953,
#     1965 and 1953 respectively) - Hipperholme has an active reopening
#     campaign but is not open today. None added.
#   - Greetland (closed 1962, demolished by 2009) and Elland (closed 1962;
#     Wikipedia's own Elland railway station article states preparatory
#     access works began in 2026 but "the station itself is not expected to
#     open until 2029") are both CLOSED, not open, on the Halifax-Sowerby
#     Bridge stretch. Neither added - Elland fails the "currently open" bar
#     specifically, not a sourcing-confidence question; whoever revisits this
#     file after 2029 should re-check it.
#   - Luddendenfoot (Sowerby Bridge-Mytholmroyd stretch) is CLOSED (1962).
#     Not added.
#   - Newton Heath and Miles Platting (Moston-Manchester Victoria stretch)
#     are both CLOSED (1966 and 1995 respectively); Newton Heath's own
#     Wikipedia article notes the area is now served only by a Metrolink tram
#     stop, not heavy rail. Neither added.
#
#   - Brighouse: researched and deliberately OMITTED, despite being on the
#     originally-named candidate list. Brighouse is real, open, and
#     Northern-operated, but it is NOT on either stretch this file models.
#     Wikipedia's Calder Valley line article places the triangular junction
#     for "the line via Mirfield to Dewsbury" on the Halifax-Manchester
#     stretch (west of Halifax, near Salterhebble/Greetland), stating
#     "Brighouse station is on this line" - i.e. Brighouse sits on a branch
#     that runs Leeds-Dewsbury-Mirfield-Brighouse and rejoins this file's
#     modelled corridor via that junction, never passing through Bradford
#     Interchange or Low Moor at all. Brighouse's own Wikipedia article
#     confirms this from the other end: its preceding station towards Leeds
#     is Mirfield, not Bradford Interchange or Halifax. Modelling this
#     correctly would mean adding a genuine third branch (at minimum Dewsbury
#     and Mirfield, neither of which is on either named stretch and neither
#     of which was researched this session) rather than a simple insertion
#     into the existing ordered list, and picking a defensible junction
#     insertion point - out of scope for this task, which is limited to the
#     two named stretches. Flagging for a future task if this corridor is
#     ever modelled; do not insert Brighouse into this file's flat station
#     order without also resolving that branch structure.
[[stations]]
crs = "LDS"
tiploc = "LEEDS"
role = "terminus"
segment = "northern-calder-valley"

[[stations]]
crs = "BLE"
role = "minor"
segment = "northern-calder-valley"

# --- Argyle Line: eastern branch towards Motherwell ---
#
# === Task 3.1 BRANCH-RESEARCH: the Lanarkshire branch group ===
#
# Fresh research pass (Wikipedia raw wikitext for the "Whifflet Line"
# article, and individual station infobox/succession-box pages, each CRS
# code cross-checked live against National Rail Enquiries), replacing the
# old "not independently verified" scope-boundary note. `grep`-checked
# against every other `lines/*.toml` file first: none of the 17 new CRS
# codes below appear anywhere else in the catalogue, so this whole branch
# group is exclusive to this file today, like the west-approach/
# milngavie-branch/balloch-branch/helensburgh-branch segments above.
#
# Topology (Wikipedia "Whifflet Line" infobox: start=Glasgow Central,
# end=Motherwell, "stations = 7" -- matches Carmyle, Mount Vernon,
# Baillieston, Bargeddie, Kirkwood, Whifflet, Coatbridge Central exactly,
# once the shared Glasgow Central-Rutherglen trunk above is excluded from
# the count):
#   - Whifflet spur (diverges at Rutherglen, per this file's own pre-
#     existing RUT comment): Rutherglen -> Carmyle -> Mount Vernon ->
#     Baillieston -> Bargeddie -> Kirkwood -> Whifflet -> Coatbridge
#     Central (terminus). Whifflet's own succession box lists its "next"
#     station as "Motherwell or Terminus" with no intermediate station --
#     i.e. Whifflet is itself a junction: one direction is the short
#     terminus spur to Coatbridge Central, the other rejoins this file's
#     existing Rutherglen-Motherwell route (via Uddingston/Bellshill,
#     already modelled above) with no additional stops.
#   - Hamilton Circle (diverges at Motherwell): Motherwell -> Airbles ->
#     Hamilton Central -> Hamilton West -> (Blantyre/East Kilbride Line,
#     out of scope -- see the scope-boundaries note above).
#   - Larkhall branch (feeds into Hamilton Central): Hamilton Central ->
#     Chatelherault -> Merryton -> Larkhall (terminus). Source: Chatelherault
#     and Hamilton Central's own succession boxes ("Hamilton Circle" /
#     "Larkhall Branch" route labels).
#   - Lanark branch (diverges at Motherwell, the other side from the
#     Hamilton Circle): Motherwell -> Shieldmuir -> Wishaw -> Carluke ->
#     Lanark (terminus). Source: Shieldmuir's own "Services" section --
#     "The station is served by a ... service between Lanark and Glasgow
#     Central via Motherwell, Bellshill and Cambuslang" -- and Lanark's own
#     succession box, confirming it as "the southern terminus of the
#     Argyle Line, with current services running northbound to Glasgow
#     Central only." (Wishaw's own succession box additionally shows a
#     same-named "Argyle Line" route continuing to Holytown -- that is the
#     Shotts Line, already modelled independently in
#     `scotrail-shotts.toml`, and is very likely a Wikipedia mislabelling;
#     it is not reused here.)
#
# Segment naming (SCHEMA.md's shared-trunk rule of thumb, applied fresh
# per the plan's Global Constraints, since this is a genuinely new
# segment-boundary decision, not routine infill): Rutherglen and Motherwell
# themselves stay on the existing `argyle-east` segment (the junctions);
# each new branch's own exclusive segment starts at the next station past
# its junction. Motherwell's `role` is upgraded from "major" to "junction"
# below to reflect that it is now a real fork point for two of this file's
# own segments (Hamilton Circle, Lanark branch), in addition to its
# pre-existing WCML note.

[[stations]]
crs = "RUT"
role = "junction"
segment = "scotrail-glasgow-suburban-argyle-east"
# Rutherglen: the Whifflet Line diverges here -- now modelled in full, see
# the Task 3.1 BRANCH-RESEARCH comment above.

[[stations]]
crs = "CML"
role = "minor"
segment = "scotrail-glasgow-suburban-whifflet-branch"
# Carmyle: first station on the Whifflet spur out of Rutherglen (Wikipedia
# succession box: previous Mount Vernon, next Rutherglen; CRS cross-checked
# against National Rail Enquiries).

[[stations]]
crs = "MTV"
role = "minor"
segment = "scotrail-glasgow-suburban-whifflet-branch"

[[stations]]
crs = "BIO"
role = "minor"
segment = "scotrail-glasgow-suburban-whifflet-branch"

[[stations]]
crs = "BGI"
role = "minor"
segment = "scotrail-glasgow-suburban-whifflet-branch"

[[stations]]
crs = "KWD"
role = "minor"
segment = "scotrail-glasgow-suburban-whifflet-branch"

[[stations]]
crs = "WFF"
role = "junction"
segment = "scotrail-glasgow-suburban-whifflet-branch"
# Whifflet: junction where the short Coatbridge Central terminus spur
# diverges from the through route back to this file's existing Rutherglen-
# Motherwell corridor (Wikipedia succession box: "previous = Coatbridge
# Central or Kirkwood; next = Motherwell or Terminus"). Per the
# shared-trunk rule of thumb, the junction stays on `whifflet-branch`; the
# terminus spur gets its own exclusive segment starting at the next
# station, Coatbridge Central.

[[stations]]
crs = "CBC"
role = "terminus"
segment = "scotrail-glasgow-suburban-coatbridge-spur"
# Coatbridge Central: terminus of the short spur off Whifflet (Wikipedia
# succession box: previous Whifflet, no further station). No through route
# to Hamilton Central -- the "Whifflet -> Coatbridge Central -> Hamilton
# Central" phrasing in the plan's own task description named these as
# waypoints across the whole unmodelled Lanarkshire area, not as one
# continuous physical line; the real topology is the branch group
# described in the Task 3.1 BRANCH-RESEARCH comment above.

[[stations]]
crs = "UDD"
role = "minor"
segment = "scotrail-uddingston-bellshill-trunk"
# Uddingston: on the existing Rutherglen-Motherwell route, past the
# Whifflet spur's Rutherglen fork and the (unmodelled) Cambuslang
# (Wikipedia succession box: previous Bellshill, next Cambuslang; CRS
# cross-checked against National Rail Enquiries). Cambuslang itself is a
# real, current station in the same position but was not individually
# verified within this pass, so it is left out -- its absence does not
# break `stations_between()` ordering since Rutherglen and Uddingston
# remain correctly ordered relative to each other.
#
# RESOLUTION (Task 3.1, fix round 1, post-review): `scotrail-shotts.toml`
# also lists this station -- its own pre-existing CBL comment had already
# flagged this exact scenario as a future coordination point. Verified
# (not assumed) this is genuine physical track sharing, not mere
# station-name overlap like GLC: Wikipedia's own "Shotts line" article
# states outright "The line follows the ... West Coast Main Line as far as
# Uddingston Junction where it branches off to the east. Until Holytown
# Junction the line [is] used by Argyle Line services" -- independently
# corroborated by Uddingston's own succession box (identical Bellshill/
# Cambuslang neighbours listed under BOTH a "Shotts Line" and an "Argyle
# Line" route label) and by Bellshill's own Services section, which lists
# current "additional peak trains to Anderston via Central L.L." alongside
# the Shotts-branded Edinburgh service (the December 2014 timetable change
# ended *regular daytime* through running to Partick, not peak running, so
# the physical sharing is still live today). Retagged from the exclusive
# `scotrail-glasgow-suburban-argyle-east` segment onto a new, neutral
# shared segment name, `scotrail-uddingston-bellshill-trunk` (mirroring
# `scotrail-inverness-dingwall-trunk`'s precedent for a segment owned by
# neither sibling file specifically), reused verbatim by
# `scotrail-shotts.toml`'s own UDD entry. Rutherglen and Motherwell
# themselves stay on `argyle-east` -- neither is a `[[stations]]` entry in
# `scotrail-shotts.toml`, so no sharing claim applies to them.

[[stations]]
crs = "BLH"
role = "minor"
segment = "scotrail-uddingston-bellshill-trunk"
# Bellshill: between Uddingston and Motherwell (Wikipedia succession box:
# previous Motherwell, next Uddingston).
#
# RESOLUTION (Task 3.1, fix round 1, post-review): same shared-trunk fix
# as UDD above -- see that entry's comment for the sourcing. The Shotts
# line's own "Until Holytown Junction the line [is] used by Argyle Line
# services" quote covers Bellshill too (it sits between Uddingston and
# Holytown), so this station is also retagged onto
# `scotrail-uddingston-bellshill-trunk`. Holytown (HLY) itself, the next
# station past Bellshill on `scotrail-shotts.toml`'s own line, is not a
# `[[stations]]` entry here, so the shared segment does not extend past
# Bellshill in this file today -- a note for whoever eventually verifies
# Holytown for this file, mirroring the CBL/UDD note this fix resolves.

[[stations]]
crs = "MTH"
role = "junction"
segment = "scotrail-glasgow-suburban-argyle-east"
# Motherwell: junction with the West Coast Main Line, which
# `west-coast-main-line.toml` does not currently model this far north
# (its northernmost modelled station is Carlisle) -- no live schema-level
# overlap to reconcile today.
#
# UPDATE (Task 3.1): role upgraded from "major" to "junction" -- Motherwell
# is now also the fork point for this file's own Hamilton Circle and
# Lanark branch segments (Wikipedia's own Motherwell succession box lists
# three incoming Argyle Line directions -- Whifflet, Bellshill/Uddingston,
# and, per the entries below, Airbles and Shieldmuir outbound).

[[stations]]
crs = "AIR"
role = "minor"
segment = "scotrail-glasgow-suburban-hamilton-circle"
# Airbles: first station on the Hamilton Circle out of Motherwell
# (Wikipedia succession box: previous Motherwell, next Hamilton Central;
# CRS cross-checked against National Rail Enquiries).

[[stations]]
crs = "HNC"
role = "junction"
segment = "scotrail-glasgow-suburban-hamilton-circle"
# Hamilton Central: junction where the Larkhall branch joins the Hamilton
# Circle (Wikipedia succession box names both a "Hamilton Circle" route via
# Airbles and a "Larkhall Branch" route via Chatelherault, both terminating
# here before continuing to Hamilton West). Per the shared-trunk rule of
# thumb, the junction stays on `hamilton-circle`; the Larkhall branch's own
# exclusive segment starts at the next station, Chatelherault.

[[stations]]
crs = "HNW"
role = "minor"
segment = "scotrail-glasgow-suburban-hamilton-circle"
# Hamilton West: last station on the Hamilton Circle modelled here --
# Wikipedia's own succession box continues onward to Blantyre and, beyond
# it, the East Kilbride Line, out of scope (see the scope-boundaries note

[[stations]]
crs = "WSH"
role = "minor"
segment = "scotrail-glasgow-suburban-lanark-branch"

[[stations]]
crs = "CLU"
role = "minor"
segment = "scotrail-glasgow-suburban-lanark-branch"

[[stations]]
crs = "LNK"
role = "terminus"
segment = "scotrail-glasgow-suburban-lanark-branch"
# Lanark: Wikipedia's own article confirms it "operates as the southern

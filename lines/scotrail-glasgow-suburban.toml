[[stations]]
crs = "MEY"
role = "minor"
segment = "scotrail-glasgow-suburban-larkhall-branch"

[[stations]]
crs = "LRH"
role = "terminus"
segment = "scotrail-glasgow-suburban-larkhall-branch"

[[stations]]

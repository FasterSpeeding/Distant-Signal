[[stations]]
crs = "CTE"
role = "minor"
segment = "scotrail-glasgow-suburban-larkhall-branch"
# Chatelherault: first station on the Larkhall branch out of Hamilton
# Central (Wikipedia succession box: previous Merryton, next Hamilton

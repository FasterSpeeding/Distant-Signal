#
# RESOLUTION (added when `lines/scotrail-bathgate.toml` was added): that
# file now models the Bathgate routing in full and reuses this exact
# `scotrail-glasgow-suburban-airdrie-branch` segment name for its own
# Airdrie entry (its own service pattern continuing beyond this station,
# hence that file gives its own ADR entry `role = "junction"` rather than
# this file's `"terminus"` -- see that file's own ADR comment), making
# this a genuine shared segment between `scotrail-glasgow-suburban` and
# `scotrail-bathgate`.

# --- Argyle Line: central Glasgow low-level route ---

[[stations]]
crs = "EXG"
role = "minor"

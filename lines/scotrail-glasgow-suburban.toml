id = "scotrail-glasgow-suburban"
name = "ScotRail Glasgow Suburban (North Clyde & Argyle Line)"
mode = "national-rail"
category = "commuter"
operators = ["SR"]

# Task 10.2 of the Batch 10 (ScotRail) line-catalogue effort. Gap analysis
# source: docs/superpowers/specs/2026-08-29-line-coverage-gap-analysis.md,
# "ScotRail" section (a): "extensive Glasgow suburban electric network
# (North Clyde, Argyle Line)" -- explicitly listed separately from the
# Ayrshire Coast/Glasgow South Western Line (Ayr/Stranraer/Girvan), which
# is its own future gap-analysis item and is NOT modelled here.
#
# Category: "commuter", per the brief's own steer, confirmed rather than
# assumed -- this network is uniformly dense electric suburban working
# (multiple trains per hour, short inter-station hops, urban/suburban
# stopping pattern throughout), unlike `northern.toml`'s "operator"
# category (chosen there because Northern's own network mixes trans-
# Pennine, rural and suburban character across its branches) and unlike
# `scotrail-central-belt.toml`'s "main-line" category (the Edinburgh-
# Glasgow flagship inter-city corridor). `thameslink-core.toml` is the
# closest structural comparison: a dense, multi-branch electric metro-
# style network under one TOC.

sample_stations = ["GLQ", "PTK", "DMR", "MLN", "GLC", "RUT"]
match_keywords = ["North Clyde", "Argyle Line"]
# Two high-precision phrases per the curation rule against padding
# match_keywords. Both are specific line brand names used consistently in
# ScotRail/Network Rail incident language and don't collide with anything
# else in the catalogue (no other line uses "Clyde" or "Argyle").

# Commuter line: tighter thresholds, following `thameslink-core.toml`'s
# precedent for a dense multi-branch metro-style network -- a short delay
# on a service running every 15-30 minutes at peak is more disruptive than
# the same delay on an hourly regional service.
[severity_overrides]
minor_delays_pct = 0.20
delay_threshold_minutes = 4

# === Sources (cross-checked per the plan's Global Constraints) ===
#
# Route/branch structure:
#   - Wikipedia "North Clyde Line" (raw wikitext, Route and History
#     sections): confirms the line runs from Glasgow Queen Street (Low
#     Level) to four western termini -- Helensburgh Central, Balloch,
#     Dalmuir and Milngavie -- via two alternative Partick-Dalmuir
#     routings (via Singer or via Yoker); an eastern short branch to
#     Springburn with a Cumbernauld Line interchange there; and that the
#     Partick-Dalmuir/Milngavie section is also used by Argyle Line
#     services (the shared-trunk fact this file's `west-trunk` segment is
#     built on).
#   - Wikipedia "Argyle Line" (raw wikitext, Route section): confirms the
#     line's central Glasgow low-level route (Exhibition Centre, Anderston,
#     Glasgow Green tunnels, Bridgeton, Dalmarnock), its western end
#     joining North Clyde metals via Singer/Westerton to Dalmuir/Milngavie,
#     and its eastern end reaching Rutherglen (where the Whifflet Line
#     diverges) and on to Motherwell. Operator confirmed as ScotRail (SR).
#   - Wikipedia "Dalmuir railway station": confirms Dalmuir is "a large,
#     five-platform interchange" where North Clyde, Argyle Line and West
#     Highland Line services meet, with onward North Clyde service to
#     Helensburgh Central and Balloch.
#   - Wikipedia "Craigendoran railway station": confirms it sits on the
#     North Clyde Line between Helensburgh Central and Cardross, and that
#     "the present layout at the junction, just east of the station,
#     consists of a loop (available to West Highland Line trains only)"
#     -- i.e. this is where the West Highland Line begins.
#   - Wikipedia "Bellgrove railway station": confirms Bellgrove is where
#     eastbound North Clyde services split three ways -- "every fifteen
#     minutes towards Airdrie, half-hourly towards Springburn and hourly
#     to Edinburgh Waverley" (the last of those is the Bathgate routing
#     covered by `scotrail-central-belt.toml`, not modelled here -- see
#     the Airdrie/Bathgate boundary note below).
#   - Wikipedia "Springburn railway station": confirms it "is a terminus
#     of the Springburn branch, a spur from Bellgrove station, on the
#     North Clyde Line" -- NOT a through station on the way to Airdrie, a
#     misreading this task's research initially had to correct.
#   - Wikipedia "Dalreoch railway station" (added in fix round 1, post-
#     review): confirms Dalreoch, not Dumbarton Central, is the real
#     Balloch/Helensburgh split point -- see the DBC/DLR comments below.
#   - Wikipedia "Hyndland railway station" (added in fix round 1): confirms
#     the Milngavie/Yoker/Singer split is at "Hyndland East Junction",
#     immediately west of the station -- see the HYN comment below for the
#     single-source caveat on this one.
#   - (Task 3.1, station-catalogue-completeness plan) Wikipedia "Whifflet
#     Line" (raw wikitext, infobox and Line description sections): confirms
#     the modern seven-station spur from Rutherglen to Coatbridge Central,
#     and that it was folded into the Argyle Line's own service pattern
#     from December 2014.
#   - (Task 3.1) Every individual station's own Wikipedia article (infobox
#     + succession box) for the 19 FILL-IN stations and the 17 Lanarkshire
#     BRANCH-RESEARCH stations added by this task -- see the inline
#     comments at each new group above for the specific succession-box
#     citations used to establish adjacency/order.
#
# CRS codes: every code in `stations` below was verified live against
# National Rail Enquiries (nationalrail.co.uk/stations/<crs>/details.html)
# and cross-checked against each station's own Wikipedia infobox where
# fetched. Several initial code guesses were wrong and caught by this
# verification pass (e.g. Balloch is BHC not BAC; Dalmarnock is DAK not
# DAL; Craigendoran is CGD, not the initially-guessed code; Charing Cross
# Glasgow is CHC, distinct from London Charing Cross's CHX) -- underlining
# why every code here was checked against a live source rather than
# assumed from memory.
#
# TIPLOCs are omitted throughout: none were confirmed against a live
# source during this task, matching the optional-field convention already
# used by `xc-manchester.toml`/`scotrail-central-belt.toml`.

# === Segment-naming coordination with `scotrail-central-belt.toml` (10.1) ===
#
# GLQ (Glasgow Queen Street) appears in both files. In 10.1 it's the
# high-level terminus of the Falkirk High inter-city routing; here it's
# the Low Level suburban hub. These are operationally distinct halves of
# the same named station (different platforms/levels, no through-running
# between them), so this file deliberately does NOT reuse the
# `scotrail-central-belt` segment name for GLQ -- station overlap is fine,
# segment-sharing is a deliberate choice, per the `xc-south-coast.toml`/
# `xc-manchester.toml` precedent this batch's Global Constraints cite.
#
# 10.1 also flagged that the western end of its Bathgate/North Clyde
# routing comment (Glasgow Queen Street Low Level out to Airdrie/
# Drumgelloch) runs over the same electrified infrastructure this file
# covers, and left the Haymarket/Edinburgh Waverley segment name
# `scotrail-central-belt-edinburgh-throat` available for this file to
# share IF this file's stations physically coincide with it. They don't:
# per the batch's pre-flight ruling, this file's eastern North Clyde
# branch stops at Airdrie (a real, current North Clyde terminus service
# pattern -- see the Bellgrove sourcing above), and does not model the
# Drumgelloch-Bathgate-Edinburgh continuation, which belongs to the
# Central Belt/Bathgate inter-city corridor 10.1 already flagged as an
# unmodelled gap. No station in `stations` below is a `[[stations]]` entry
# in 10.1 (10.1's Bathgate-route stations are comment-only), so no
# segment-sharing applies here. A one-line pointer comment was added to
# `scotrail-central-belt.toml` recording this resolution.
#
# No other existing `lines/*.toml` file touches North Clyde/Argyle Line
# territory (grepped before starting this task), so every segment below
# is exclusive to this file for now -- this is a genuinely standalone
# addition today, like c2c or Merseyrail, even though it has rich internal
# branch structure. The regression test added for this file therefore only
# asserts exclusive-segment non-propagation, mirroring how 10.1's own test
# handled the same "no sibling yet" situation.

# === Scope boundaries (documented, not modelled) ===
#
# - Ayrshire Coast / Glasgow South Western Line (Ayr/Stranraer/Girvan):
#   separate gap-analysis item, not modelled here.
# - East Kilbride Line: Hamilton West's own Argyle Line succession
#   continues onward to Blantyre and, beyond it, East Kilbride -- a
#   separate, currently unmodelled ScotRail line in its own right (like
#   the Cumbernauld Line off Springburn, above), not part of this file's
#   Hamilton Circle/Larkhall/Lanark research pass. Left out rather than
#   folded in without its own dedicated verification.
#
# (Task 3.1, station-catalogue-completeness plan) The 19 minor intermediate
# stations previously omitted here (Jordanhill, Anniesland, Westerton,
# Bearsden, Hillfoot, Scotstounhill, Garscadden, Yoker, Clydebank, Singer,
# Drumry, Kilpatrick, Bowling, Renton, Cardross, Alexandria, High Street,
# Uddingston, Bellshill) and the previously-unverified Lanarkshire branch
# group (Whifflet -> Coatbridge Central; the Hamilton Circle; the Larkhall
# and Lanark branches) have now all been researched to the two-source
# standard (Wikipedia infobox/succession box cross-checked against National
# Rail Enquiries' `nationalrail.co.uk/stations/<crs>/details.html`) and
# added to `stations` below -- see the dedicated sourcing comments inline
# at each new group for the specific citations and segment-boundary
# reasoning. Nothing was left out for lack of verification.

# --- West end: Milngavie branch, West Trunk, Balloch/Helensburgh branch ---
#
# (Task 3.1) The two parallel Partick-Dalmuir approach routes named in this
# file's own Sources comment above ("via Singer or via Yoker") were
# researched in full for this task, along with the Milngavie branch's own
# intermediate stations. Source: Wikipedia's "Argyle Line" article (raw
# wikitext, Routes section) states "At Dalmuir Park Junction, southeastwards
# enters the Yoker line, before rejoining at Hyndland East Junction, and
# eastwards remains on the North Clyde (officially North Electric Main
# Line) via Singer and Westerton Junction, where the ... Milngavie Branch
# joins. This route continues via Knightswood North and South junctions,
# and Hyndland." -- i.e. both the via-Yoker and via-Singer routes are
# independent paths between Hyndland and Dalmuir, and the Milngavie branch
# forks off the via-Singer route at Westerton Junction (immediately west of
# Westerton station). Per-station succession-box data (Wikipedia, each
# station's own article) and CRS codes (cross-checked live against
# National Rail Enquiries) confirm the chains below:
#   - via Anniesland/Milngavie: Hyndland -> Anniesland -> Westerton ->
#     [fork] -> Bearsden -> Hillfoot -> Milngavie (branch terminus).
#   - via Singer (continuing past the Westerton fork): Westerton ->
#     Drumchapel (not individually verified/added -- see its own gap note
#     below) -> Drumry -> Singer -> Dalmuir.
#   - via Yoker (the other, independent Hyndland-Dalmuir path): Hyndland ->
#     Jordanhill -> Scotstounhill -> Garscadden -> Yoker -> Clydebank ->
#     Dalmuir.
#   - Dalmuir-Dumbarton Central stretch (the genuine West Highland shared
#     trunk): Dalmuir -> Kilpatrick -> Bowling -> [Dumbarton East, not
#     individually verified/added] -> Dumbarton Central.
# None of these new stations are physically traversed by West Highland
# Line trains (which run non-stop Glasgow Queen Street - Dumbarton Central
# over the DMR/DBC "west-trunk" corridor), so all approach-side additions
# use the existing exclusive `west-approach` segment -- except Kilpatrick
# and Bowling, which sit ON the DMR-DBC stretch itself and so inherit the
# genuinely-shared `west-trunk` segment, consistent with Dumbarton
# Central's own sourcing below ("the last station ... where trains on the
# West Highland line ... call before diverging"). Drumchapel and Dumbarton
# East are real, current stations on these same stretches per the sources
# above, but neither was individually confirmed to the two-source CRS
# standard within this pass, so both are left out rather than guessed --
# their absence does not break `stations_between()` ordering since no
# other entry needs to sit between their immediate (now-listed) neighbours.
#
# CORRECTION (Task 3.1): Milngavie (MLN) previously sat first in this
# section, ahead of Partick and Hyndland, even though this file's own PTK
# comment (below) already asserted "Partick is the first stop out of
# Glasgow on this line's own western approach track." Now that the full
# Milngavie-branch chain is modelled, MLN is moved to its true geographic
# position at the end of that chain (after Hillfoot), and PTK/HYN move to
# the top of this section, making the file's own long-standing PTK comment
# literally true for the first time.

[[stations]]
crs = "PTK"
role = "junction"
segment = "scotrail-glasgow-suburban-west-approach"
# Partick: Glasgow Subway interchange; also where Argyle Line services
# join North Clyde metals westbound towards Dalmuir/Milngavie. Partick is
# the first stop out of Glasgow on this line's own western approach
# track.
#
# CORRECTION (post-review fix round 2): moved here from its previous
# position after HLC/CGD/BHC further down this file, which put it out of
# geographic order -- `crates/aggregator/src/aggregation.rs`'s
# `routes_from_stations` sorts an incident's affected stations by their
# position in this `[[stations]]` list to build "between A and B" route
# descriptions, and a misordered station there can produce a reversed or
# wrong-sounding range. See the HYN entry immediately below for why this
# station's segment name also changed in the same pass.

[[stations]]
crs = "HYN"
role = "junction"
segment = "scotrail-glasgow-suburban-west-approach"
# Hyndland: per Wikipedia's own Hyndland article, "immediately to the west
# of the station is Hyndland East Junction where the Yoker and Singer
# (including the Milngavie branch) lines diverge" -- so the physical split
# is a few hundred metres west of the station, not at the platforms
# themselves. This is Wikipedia-sourced only: a second, non-Wikipedia
# source for the "Hyndland East Junction" name/location specifically was
# not reachable within this task's research budget (railwaycodes.org.uk
# returned 404s for the pages guessed, ScotRail's own site returned 403).
# Hyndland is used here as the nearest *confirmed* station to the actual
# divergence point, not asserted as the divergence point itself; exclusive
# segment starts at the next station, per the shared-trunk rule of thumb
# (now Anniesland/Jordanhill -- see the Task 3.1 comment above -- rather
# than MLN directly, now that the intermediate chain is modelled).
#
# CORRECTION (post-review fix round 2): Hyndland, Dalreoch (DLR, below)
# and Partick (above) were previously all tagged onto the SAME
# `scotrail-glasgow-suburban-west-trunk` segment name used by DMR (Dalmuir)
# and DBC (Dumbarton Central) below -- the segment this file genuinely
# shares with `scotrail-west-highland-fort-william.toml` and
# `scotrail-west-highland-oban.toml`. That was wrong: `SegmentRegistry::
# is_shared` (in `crates/aggregator/src/segments.rs`) keys on segment NAME
# only, not station, so it made an incident at Hyndland, Dalreoch or
# Partick get classified as `MatchScope::SharedSegment` and surface a
# false, user-visible "also affects other lines" claim -- even though West
# Highland Line trains run non-stop between Glasgow Queen Street and
# Dumbarton Central and do not physically call at Hyndland, Dalreoch or
# Partick at all (see both West Highland files' own DMR comments: "WHL
# trains run non-stop between here and Glasgow Queen Street"). West
# Highland services only join this line's own metals from Dumbarton
# Central (DBC) onward towards Glasgow.
#
# Hyndland, Dalreoch and Partick are therefore retagged onto a new segment
# exclusive to this file, `scotrail-glasgow-suburban-west-approach`,
# splitting the old west-trunk segment at DMR/DBC: everything on this
# line's own approach track that is NOT physically traversed by West
# Highland trains is `west-approach`; DMR and DBC, and the genuinely
# shared stretch they represent, stay on `west-trunk` (unchanged --
# neither the sibling West Highland files nor their own segment name were
# touched by this fix).

[[stations]]
crs = "ANL"
role = "minor"
segment = "scotrail-glasgow-suburban-west-approach"
# Anniesland: between Hyndland and Westerton on the via-Anniesland/
# Milngavie route (Wikipedia infobox succession; CRS cross-checked against
# National Rail Enquiries). Also a Maryhill Line terminus, but that line
# is not modelled in any `lines/*.toml` file.

[[stations]]
crs = "WES"
role = "junction"
segment = "scotrail-glasgow-suburban-west-approach"
# Westerton: the physical fork -- Wikipedia's own succession box for this
# station names its "next" stations as "Drumchapel (westbound) and
# Bearsden (northbound)", i.e. this is Westerton Junction itself, where the
# Milngavie branch splits from the via-Singer approach route. Per the
# shared-trunk rule of thumb the junction stays on the approach segment;
# the exclusive Milngavie-branch segment starts at the next station,
# Bearsden.

[[stations]]
crs = "BRN"
role = "minor"
segment = "scotrail-glasgow-suburban-milngavie-branch"

[[stations]]
crs = "HLF"
role = "minor"
segment = "scotrail-glasgow-suburban-milngavie-branch"

[[stations]]
crs = "MLN"
role = "terminus"
segment = "scotrail-glasgow-suburban-milngavie-branch"
# CORRECTION (Task 3.1): moved from the top of this section -- see the
# Task 3.1 comment at the head of the West end section for why.

[[stations]]
crs = "JOR"
role = "minor"
segment = "scotrail-glasgow-suburban-west-approach"
# Jordanhill: first station on the via-Yoker route out of Hyndland
# (Wikipedia succession box: previous Hyndland, next Scotstounhill).

[[stations]]
crs = "SCH"
role = "minor"
segment = "scotrail-glasgow-suburban-west-approach"

[[stations]]
crs = "GRS"
role = "minor"
segment = "scotrail-glasgow-suburban-west-approach"

[[stations]]
crs = "YOK"
role = "minor"
segment = "scotrail-glasgow-suburban-west-approach"

[[stations]]
crs = "CYK"
role = "minor"
segment = "scotrail-glasgow-suburban-west-approach"
# Clydebank: last station on the via-Yoker route before it rejoins the
# via-Singer route at Dalmuir (Wikipedia succession box: previous Yoker,
# next Dalmuir).

[[stations]]
crs = "DMY"
role = "minor"
segment = "scotrail-glasgow-suburban-west-approach"
# Drumry: continuation of the via-Singer route past the Westerton/
# Milngavie-branch fork (Wikipedia succession template: previous
# Drumchapel, next Singer -- Drumchapel itself not individually verified,
# see the Task 3.1 comment above).

[[stations]]
crs = "SIN"
role = "minor"
segment = "scotrail-glasgow-suburban-west-approach"
# Singer: last station on the via-Singer route before Dalmuir (Wikipedia
# succession box: previous Drumry, next Dalmuir).

[[stations]]
crs = "DMR"
role = "junction"
segment = "scotrail-glasgow-suburban-west-trunk"
# Dalmuir: "a large, five-platform interchange" (Wikipedia) where North
# Clyde, Argyle Line and West Highland Line services converge. The
# via-Yoker and via-Singer approach routes above both terminate here.

[[stations]]
crs = "KPT"
role = "minor"
segment = "scotrail-glasgow-suburban-west-trunk"
# Kilpatrick: on the Dalmuir-Dumbarton Central stretch itself (Wikipedia
# succession box: previous Dalmuir, next Bowling, North Clyde Line only --
# i.e. not served by the via-Yoker/via-Singer approach routes). This is the
# "genuinely shared stretch" this file's own DBC comment below describes,
# so it inherits `west-trunk`, not `west-approach`.

[[stations]]
crs = "BWG"
role = "minor"
segment = "scotrail-glasgow-suburban-west-trunk"
# Bowling: same reasoning as Kilpatrick above (Wikipedia succession box:
# previous Kilpatrick, next Dumbarton East -- Dumbarton East itself not
# individually verified, see the Task 3.1 comment above).

[[stations]]
crs = "DBC"
role = "junction"
segment = "scotrail-glasgow-suburban-west-trunk"
# Dumbarton Central: on the shared west trunk, one station short of the
# actual Balloch/Helensburgh split (see Dalreoch, next). Per Wikipedia's
# Dumbarton Central article it is "the last station on the North Clyde
# line where trains on the West Highland line between Glasgow and Oban
# and Mallaig call before diverging from the line just before
# Craigendoran" -- a separate fact about West Highland services, not the
# Balloch/Helensburgh split (see Craigendoran below for that junction).
#
# CORRECTION (post-review, fix round 1): an earlier version of this file
# stated "Balloch and Helensburgh branches split here" at Dumbarton
# Central. That was wrong and uncited -- re-verified against Wikipedia's
# Dalreoch article (cross-checked against National Rail Enquiries for the
# CRS code), which shows the actual split is one station further out, at
# Dalreoch. Corrected below.
#
# UPDATE (Task 10.8, `lines/scotrail-west-highland-fort-william.toml`):
# that file independently re-confirmed this same West Highland Line
# sharing fact (see its own Sources comments) and reused this exact
# `scotrail-glasgow-suburban-west-trunk` segment name for its own DMR/DBC
# station entries. `SegmentRegistry::is_shared` now correctly reports this
# segment shared between `scotrail-glasgow-suburban` and
# `scotrail-west-highland-fort-william`, and
# `scotrail_west_highland_shares_glasgow_suburban_west_trunk_incident_propagates`
# in `crates/aggregator/src/matcher.rs` asserts the resulting
# `MatchScope::SharedSegment` propagation for both lines. That file's own
# GLQ entry deliberately does NOT reuse this segment (or
# `scotrail-central-belt`'s) -- see its own sourcing comments.
#
# UPDATE (Task 10.9, now merged): `lines/scotrail-west-highland-oban.toml`
# independently re-confirmed the same West Highland sharing fact --
# Dumbarton Central's own Wikipedia article explicitly names "trains ...
# between Glasgow and Oban and Mallaig," not just Fort William/Mallaig --
# and reused this exact `scotrail-glasgow-suburban-west-trunk` segment name
# for its own DMR/DBC entries too, making this a genuine three-way shared
# segment across `scotrail-glasgow-suburban`,
# `scotrail-west-highland-fort-william` and
# `scotrail-west-highland-oban`. The propagation test above now asserts all
# three line IDs. That file's own GLQ entry likewise does NOT reuse this
# segment (it gets its own line-specific terminus segment, mirroring
# `scotrail-west-highland-fort-william`'s identical GLQ boundary choice).

[[stations]]
crs = "DLR"
role = "junction"
segment = "scotrail-glasgow-suburban-west-approach"
# Dalreoch: the real Balloch/Helensburgh split point. Wikipedia's Dalreoch
# article, describing the station's own track layout: "the line diverging
# to the right becomes single track and heads to Balloch. The line to the
# left runs to Helensburgh Central." The same article confirms Dalreoch
# immediately follows Dumbarton Central (moving away from Glasgow) and
# precedes Renton (Balloch direction) / Cardross (Helensburgh direction).
# CRS code DLR cross-checked against National Rail Enquiries.
#
# Retagged (post-review fix round 2) from `scotrail-glasgow-suburban-
# west-trunk` to `scotrail-glasgow-suburban-west-approach` -- see the HYN
# comment above for the full explanation: Dalreoch, like Hyndland and
# Partick, is not physically traversed by West Highland Line trains, so it
# isn't part of the segment genuinely shared with the West Highland files.

[[stations]]
crs = "RTN"
role = "minor"
segment = "scotrail-glasgow-suburban-balloch-branch"
# Renton: first station on the Balloch branch out of Dalreoch (Wikipedia
# succession box: previous Dalreoch, next Alexandria; CRS cross-checked
# against National Rail Enquiries).

[[stations]]
crs = "ALX"
role = "minor"
segment = "scotrail-glasgow-suburban-balloch-branch"
# Alexandria: last station on the Balloch branch before Balloch itself
# (Wikipedia succession box: previous Renton, next Balloch).

[[stations]]
crs = "BHC"
role = "terminus"
segment = "scotrail-glasgow-suburban-balloch-branch"

[[stations]]
crs = "CDR"
role = "minor"
segment = "scotrail-glasgow-suburban-helensburgh-branch"
# Cardross: on the Helensburgh branch out of Dalreoch, before Craigendoran
# (Wikipedia succession box: previous Dalreoch, next Craigendoran; CRS
# cross-checked against National Rail Enquiries).

[[stations]]
crs = "CGD"
role = "junction"
segment = "scotrail-glasgow-suburban-helensburgh-branch"
# Craigendoran: West Highland Line begins here (loop east of the station,
# available to West Highland Line trains only, per Wikipedia).

[[stations]]
crs = "HLC"
role = "terminus"
segment = "scotrail-glasgow-suburban-helensburgh-branch"

# --- Core: Charing Cross, Glasgow Queen Street (Low Level) ---

[[stations]]
crs = "CHC"
role = "major"
segment = "scotrail-glasgow-suburban-core"

[[stations]]
crs = "GLQ"
role = "junction"
segment = "scotrail-glasgow-suburban-core"
# Glasgow Queen Street (Low Level) -- distinct from the High Level terminus
# modelled in `scotrail-central-belt.toml`; see the segment-naming
# coordination note above for why this deliberately isn't shared.

[[stations]]
crs = "HST"
role = "minor"
segment = "scotrail-glasgow-suburban-core"
# High Street: between Glasgow Queen Street (Low Level) and Bellgrove
# (Wikipedia succession box; CRS cross-checked against National Rail
# Enquiries).

[[stations]]
crs = "BLG"
role = "junction"
segment = "scotrail-glasgow-suburban-core"
# Bellgrove: eastbound North Clyde services split three ways here --
# Airdrie (15 min), Springburn (30 min), and Edinburgh Waverley via
# Bathgate (hourly, not modelled -- see the boundary note above).
#
# RESOLUTION (added when `lines/scotrail-bathgate.toml` was added): that
# file now models the Bathgate routing in full and reuses this exact
# `scotrail-glasgow-suburban-core` segment name for its own Charing
# Cross/Glasgow Queen Street/Bellgrove entries, making it a genuine shared

id = "swr-alton"
name = "Alton Line"
mode = "national-rail"
category = "regional"
operators = ["SW"]

destination_crs_filter = ["AON", "BTY", "FNH", "AHT"]
sample_stations = ["AHT", "FNH", "AON"]
match_keywords = ["Alton line", "Alton branch"]

# Shares Waterloo->Woking trunk; diverges at Woking via Aldershot.
[[stations]]
crs = "WAT"
tiploc = "WATRLMN"
role = "terminus"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "CLJ"
tiploc = "CLPHMJ1"
role = "junction"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "WIM"
tiploc = "WDON"
role = "major"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "SUR"
tiploc = "SURBITN"
role = "junction"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "WOK"
tiploc = "WOKING"
role = "junction"
segment = "swr-trunk-waterloo"

# DATA-AUDIT FIX: "BCE"/"BRACKNL" (Bracknell, Berkshire) was previously
# listed here but was never actually part of the Alton line - confirmed
# via real CIF data that it belongs to the entirely separate Waterloo -
# Reading-via-Ascot "Windsor lines" route. Removed outright rather than
# corrected, since Bracknell has no place on this line at all.
#
# DATA-AUDIT FIX: Ash Vale (AHV) was missing between Woking and
# Aldershot. Confirmed via Wikipedia's "Alton line" article, which lists
# only 5 real intermediate stations (Ash Vale, Aldershot, Farnham,
# Bentley, Alton), and via real CIF data showing 97% of genuine
# Woking -> Aldershot journeys call here.
# UPDATE (SWR suburban-gap batch): role corrected from "minor" to
# "junction", and segment changed from `swr-alton-branch` to a new,
# narrower `swr-ash-vale-junction` - Ash Vale is a real junction where
# `swr-ascot-aldershot.toml` (the Ascot-Ash Vale line) joins this line's
# own metals for its final approach into Aldershot, per that file's own
# sourcing. A new segment name (rather than reusing `swr-alton-branch`
# wholesale) keeps Farnham/Bentley/Alton below correctly exclusive to this
# file - swr-ascot-aldershot.toml's own trains never reach past Aldershot.
[[stations]]
crs = "AHV"
tiploc = "ASHVALE"
role = "junction"
segment = "swr-ash-vale-junction"

# Same UPDATE as AHV above: Aldershot is this file's own pass-through
# station but swr-ascot-aldershot.toml's own real terminus for "most
# trains" per that file's sourcing - a second, genuine user of this exact
# track. Segment changed from `swr-alton-branch` to `swr-ash-vale-junction`
# for the same reason as AHV.
[[stations]]
crs = "AHT"
tiploc = "ALDRSHT"
role = "major"
segment = "swr-ash-vale-junction"

[[stations]]
crs = "FNH"
tiploc = "FARNHAM"
role = "minor"
segment = "swr-alton-branch"

# DATA-AUDIT FIX: this entry previously read crs = "BTL" / tiploc =
# "BATLEY" - that's real Batley, West Yorkshire, an unrelated station
# hundreds of miles away with no connection to this line. The actual
# Alton-line station here is Bentley (Hampshire): CRS BTY, TIPLOC BNTEY
# (confirmed via railwaydata.co.uk and Wikidata).
[[stations]]
crs = "BTY"
tiploc = "BNTEY"
role = "minor"
segment = "swr-alton-branch"

[[stations]]
crs = "AON"
tiploc = "ALTON"
role = "terminus"
segment = "swr-alton-branch"

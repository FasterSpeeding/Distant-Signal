id = "tfw-heart-of-wales"
name = "Heart of Wales Line"
mode = "national-rail"
category = "regional"
operators = ["AW"]

destination_crs_filter = ["SHR", "SWA", "LLV"]
sample_stations = ["SHR", "LLO", "LLV", "SWA"]
match_keywords = ["Heart of Wales Line"]

# Sourcing note (per the catalogue's "cross-checked against a second source"
# curation standard, matching the disclosure format established for
# tfw-cambrian.toml after its task review): every CRS code below was
# confirmed from that station's own Wikipedia infobox, AND independently
# cross-checked against railwaycodes.org.uk's per-letter CRS pages and
# matches exactly. TIPLOC-refresh pass (Task 4.3,
# `docs/superpowers/plans/2026-09-01-station-catalogue-completeness.md`):
# the previous version of this note disclosed that CRV, BME, BUK, DOL, PNY,
# BHR, CIM, GTH, SUG, CYN, LNR, LLG, FFA, LLI, AMF, PTF, PTD, LLH, BYE and
# SWA were still Wikipedia-only pending a second-source pass, because
# railwaycodes.org.uk's per-letter pages repeatedly truncated before
# reaching the relevant row and a WebFetch session-usage limit cut the
# original research short. A fresh session's direct raw-HTML `curl` fetch
# of the same pages (bypassing the AI-summarized WebFetch tool that hit the
# truncation) reached every row cleanly and returned an exact CRS match for
# all 20, plus a TIPLOC for every one of them (now included below). HPT,
# KNI and KNU, previously sourced from railwaycodes.org.uk only, were this
# time also independently cross-checked against each station's own
# Wikipedia infobox and match. One genuine correction surfaced during this
# pass: KNI's TIPLOC was previously recorded as "KNIGHTON", which turns out
# to be railwaycodes.org.uk's STANME column for that row, not its TIPLOC
# column ("KNIGHTN") -- a column-misread in the original curation, fixed
# below (see that station's own comment). Llangynllo (LGO/LLU) and Cilmeri
# (CIM/GIY) each have a two-CRS-value row on railwaycodes.org.uk, the same
# pattern `tfw-valley-lines-north.toml` discloses for Lisvane & Thornhill
# and Dinas Rhondda; in both cases the value already used here (LGO, CIM)
# is confirmed as the live/primary code, so no change was needed there.
#
# TIPLOCs are now included for every station, all sourced from
# railwaycodes.org.uk's TIPLOC column directly (that field isn't shown on
# Wikipedia's infobox, so unlike the CRS codes it has only the one live
# source, matching `tfw-north-wales-coast.toml`'s convention for the same
# situation).

# Frequency confirmed via Wikipedia (Heart of Wales line article, "Services"
# table): "6 tpd to Shrewsbury" and "5 tpd to Swansea" -- roughly one train
# every 2-3 hours each way, similar order of magnitude to the Cambrian Coast
# Line's two-hourly Pwllheli branch (`tfw-cambrian.toml`) and sparser than
# Furness's hourly service (`northern-furness.toml`). The line's own
# infobox additionally confirms: "Mainly single track", Max. 60 mph,
# ~90 miles long, and Community Rail Partnership-designated. A single
# cancellation is a bigger proportional hit than on a typical hourly rural
# line, so this mirrors the Cambrian Coast Line's thresholds rather than
# Furness's.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# Per the Heart of Wales line's own Wikipedia infobox, the line's own
# infrastructure identity is officially Craven Arms-Llanelli (`start =
# Craven Arms`, `end = Llanelli`, 29 stations, confirmed via that article's
# raw wikitext). Shrewsbury and Swansea are included here as the northern
# and southern ends of the real-world timetabled through-service (matching
# this catalogue's user-facing convention and the task brief's framing,
# "Shrewsbury/Craven Arms-Swansea") even though they sit on infrastructure
# the line doesn't own outright -- see the two junction notes below.
#
# Shrewsbury to Craven Arms is shared physical track with the Welsh Marches
# Line: confirmed via two independent Wikipedia articles -- the Welsh
# Marches line article ("connection with the Heart of Wales line to
# Llanelli" at Craven Arms) and the Craven Arms railway station article
# ("situated at the junction of the Welsh Marches Line and the Heart of
# Wales Line"; "Platform 1 ... facilitates northbound trains to Shrewsbury
# and beyond as well as trains from Swansea via the Heart of Wales Line").
# Per the shared-trunk rule of thumb, the junction (Craven Arms) belongs to
# the shared segment and the exclusive segment starts at the next station,
# Broome. `tfw-marches.toml` (Task 11.5, not yet written when this file was
# authored) is expected to read this file and decide whether to reuse the
# `tfw-heart-of-wales-shrewsbury` segment name for its own Shrewsbury-Craven
# Arms stretch, given the real physical-track overlap -- that decision is
# deliberately left to Task 11.5, not made here.
#
# Llanelli to Swansea is a second, different kind of junction: per the Heart
# of Wales line's own Wikipedia article, southbound trains "use the original
# LR main line to reach the West Wales lines at Llandeilo Junction and
# thence Llanelli and Swansea, after a reversal" -- i.e. this final stretch
# runs on the separate West Wales main line, not the Heart of Wales Line's
# own dedicated single-track infrastructure. No stations are called between
# Llanelli and Swansea. No West Wales / South Wales main line file exists
# yet anywhere in this catalogue to coordinate a shared segment name with.
# (Reworded during the final whole-branch review's fix wave, Minor #2: this
# used to compare itself to Task 1.4's Chester-Holyhead situation in
# `wcml-north-wales.toml`, but that comparison is now stale -- Task 1.4 has
# since landed, on Batch 1's own worktree branch, and `tfw-north-wales-
# coast.toml`'s own parallel comment about it was already updated to match
# during this batch's Task 11.8. The West Wales/South Wales gap here is a
# separate, still-genuinely-unresolved situation of its own -- no such file
# exists for this particular gap -- not the same situation carried forward
# from Task 1.4.) `tfw-heart-of-wales-swansea` is a standalone forward bet:
# a future South Wales/West Wales line file should read this file and
# decide deliberately whether to share that segment name, rather than
# assuming either way.
#
# Only principal calling points are listed; no further request-stop halts
# are known to be omitted on this line beyond what's already listed. The
# Wikipedia infobox's "29 stations" count for Craven Arms-Llanelli
# contradicts this file's own tally, rather than corroborating it: this
# file actually enumerates 30 stations for that stretch (CRV through LLE
# inclusive, plus Shrewsbury and Swansea at the two ends) -- one more than
# Wikipedia's infobox claims. (Church Stretton, added during this same fix
# wave's Important #2, doesn't affect this count: it's geographically north
# of Craven Arms, between Shrewsbury and Craven Arms, so it falls outside
# the Craven Arms-Llanelli stretch this count covers.) This discrepancy is
# left disclosed rather than silently resolved either way -- a future
# editor re-checking the infobox's raw wikitext may find the source of the
# mismatch.
[[stations]]
crs = "SHR"
tiploc = "SHRWBY"
role = "junction"
segment = "tfw-heart-of-wales-shrewsbury"
# Shrewsbury is also a junction with the Cambrian Line (`tfw-cambrian.toml`)
# and the Wolverhampton/Chester routes, at station level only -- no track is
# shared with those since the Cambrian Line diverges west immediately.
# TIPLOC added during Task 4.3's TIPLOC-refresh pass, sourced from
# railwaycodes.org.uk directly.

[[stations]]
crs = "CTT"
tiploc = "CSTR"
role = "minor"
segment = "tfw-heart-of-wales-shrewsbury"
# Church Stretton: added during the final whole-branch review (Important
# #2) -- this file's station list previously jumped straight from
# Shrewsbury to Craven Arms, omitting this intermediate stop entirely, which
# silently broke the shared-trunk matching guarantee `tfw-marches.toml`
# establishes for this exact stretch (see that file's own Craven Arms
# comment and the `heart_of_wales_shrewsbury_shared_trunk_propagates` /
# `church_stretton_shared_trunk_propagates` tests in
# `crates/aggregator/src/matcher.rs`). CRS code confirmed independently
# (not assumed) via this station's own Wikipedia infobox: "CTT". Positioned
# here between Shrewsbury and Craven Arms per real geography -- Church
# Stretton sits "12+3/4 miles south of Shrewsbury", i.e. north of Craven
# Arms, per its own Wikipedia article, matching the south-to-north CRV ->
# CTT -> SHR ordering already used in `tfw-marches.toml`. TIPLOC added
# during Task 4.3's TIPLOC-refresh pass, sourced from railwaycodes.org.uk
# directly (this file's own convention of omitting rather than guessing
# still holds -- this value was confirmed live, not guessed).

[[stations]]
crs = "CRV"
tiploc = "CRAVENA"
role = "junction"
segment = "tfw-heart-of-wales-shrewsbury"

id = "northern-hope-valley"
name = "Hope Valley Line"
mode = "national-rail"
category = "regional"
operators = ["NT"]

destination_crs_filter = ["SHF", "MAN", "SPT"]
sample_stations = ["EDL", "HOP", "DOR"]
match_keywords = ["Hope Valley"]

# Roughly hourly stopping service across the Peak District.
[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10

# Manchester Piccadilly to Sheffield across the Peak District, ordered west to
# east. Nothing is shared with the `northern` trunk: that corridor runs from
# Manchester Victoria over the Standedge route, while this one leaves from
# Piccadilly. Sheffield is also a CrossCountry station, but only the station
# is common.
#
# --- [FILL-IN] resolved (Task 2.7, 2026-09-01): intermediate halts researched ---
# The 3 originally-named candidates (Chinley, Hathersage, Grindleford) plus
# Bamford (named in the research spec's combined Hope Valley tally, but not
# yet in this file's own comment) are all real, currently-open,
# Northern-operated stations on this line - added below. Edale (EDL) and
# Dore & Totley (DOR) were already listed before this task; only Bamford was
# missing alongside the 3 originally-named stations. Each CRS cross-checked
# against two independent sources: the station's own Wikipedia
# infobox/article, and nationalrail.co.uk/stations/<crs>/details.html
# (which also confirmed current Northern operation). No `tiploc` confirmed
# to a second source for any of the 4, so none is included.
#
# Geographic order confirmed via Wikipedia's Hope Valley line article and a
# WebSearch cross-check of Northern's published stopping pattern: Chinley
# comes immediately before Edale; Bamford, Hathersage and Grindleford come
# in that order between Hope and Dore & Totley (Hope -> Bamford ->
# Hathersage -> Grindleford -> Dore & Totley -> Sheffield).
#
# Important distinction from `emr-regional.toml` (Task 7.3): EMR's own Hope
# Valley Line service genuinely runs fast between Manchester
# Piccadilly/Stockport and Sheffield and does not call at these stations
# (a correct, deliberate exclusion for that operator, confirmed via EMR's
# own services table) - but Northern's own service here is an all-stations
# stopper, so these are real gaps on this file specifically, not there. Do
# not add these stations to `emr-regional.toml`.
#
# --- [FILL-IN] resolved (data-driven schedule audit, 2026-09-21): Manchester-end gap ---
# Ashburys (ABY), Belle Vue (BLV), Ryder Brow (RRB), Reddish North (RDN),
# Brinnington (BNT), Bredbury (BDY), Romiley (RML), Marple (MPL), Strines
# (SRN) and New Mills Central (NMC) are all real, currently-open,
# Northern-operated stations between Manchester Piccadilly and Chinley -
# added below in that geographic order. Confirmed via real CIF schedule
# data: of 34 "pure" Manchester Piccadilly<->Sheffield all-stations
# services audited, 32 run via this route (Ashburys/Reddish North) and only
# 2 via Stockport (SPT); Wikipedia's Hope Valley line article independently
# confirms this is the regular hourly Northern Trains stopping pattern. No
# `tiploc` confirmed to a second source for any of the 10, so none is
# included.
#
# FLAGGED FOR MANUAL REVIEW, not resolved by this task: SPT (Stockport) was
# already listed as the second stop after MAN before this task, but the
# schedule audit above indicates the dominant (32/34) Manchester
# Piccadilly-Sheffield stopping pattern runs via Ashburys and does not call
# at Stockport at all - Stockport sits on a physically different route
# (only 2/34 audited services), so SPT's current `role`/`segment`/position
# here likely reflects that other, minority routing rather than the
# Ashburys stopping pattern documented above. Not confident enough to
# reposition, re-segment, or remove SPT without further research, so it is
# left in its existing place unchanged; a future task should investigate
# whether SPT needs its own segment/route distinction from the Ashburys
# stations added here. Fetched 2026-09-01; audit and this comment
# 2026-09-21.
[[stations]]
crs = "MAN"
role = "terminus"
segment = "northern-hope-valley"

[[stations]]
crs = "SPT"
role = "junction"
segment = "northern-hope-valley"
# Stockport - pre-existing entry, position not re-derived by this task. See
# the FLAGGED FOR MANUAL REVIEW comment above: the schedule audit suggests
# this station belongs to a different, minority physical routing than the
# Ashburys stations added below, not the dominant Ashburys stopping
# pattern. Left in place rather than guessed at.

[[stations]]
crs = "ABY"
role = "minor"
segment = "northern-hope-valley"

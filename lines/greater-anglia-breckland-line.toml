id = "greater-anglia-breckland-line"
name = "Breckland Line (Norwich - Cambridge)"
mode = "national-rail"
category = "regional"
operators = ["LE"]
# LE = Greater Anglia's ATOC code, already verified and cited in
# greater-anglia-main-line.toml -- not re-derived here.

# Split out of the former `greater-anglia-norfolk-branches.toml` (real-world
# sanity review): that file bundled three unrelated, separately
# community-rail-branded Greater Anglia routes (Bittern, Wherry, Breckland)
# under a single "Norfolk Branch Lines" umbrella that nobody uses. Worse
# than the other two: the Breckland Line is a genuine ~60-mile Norwich-
# Cambridge secondary main line -- it also carries EMR's own separate
# Liverpool-Norwich service over the same metals (see
# `emr_poacher_line_and_emr_regional_both_match_grantham...`-style
# reasoning elsewhere in this catalogue for the general pattern) -- not a
# short branch, and calling it one under a "Norfolk Branch Lines" file
# alongside two genuinely local branches misrepresented its character. A
# single incident on any one of the three previously reported as a
# disruption on all three. Split one file per real brand, matching this
# session's EMR/TfW split precedent. Station data, CRS codes and segment
# names below are reused verbatim from the original file -- redistributed,
# not re-researched.

sample_stations = ["CBG"]
match_keywords = ["Breckland line"]
# "Breckland line" (lowercase "line") matches the infobox `name` field's own
# capitalisation exactly, unlike "Bittern Line"/"Wherry Lines" -- kept as
# attested rather than normalised, since match_keywords is matched
# case-insensitively anyway.

# Greater Anglia's own Norwich-bound service is "typically hourly", though
# several stations see far sparser calls -- unchanged from the original
# bundled file's reasoning (northern-lakes.toml/northern-tyne-valley.toml
# branch-line pattern): one cancellation is a large fraction of the hour's
# service, and a 5-minute delay on a short branch journey isn't yet a story
# at config.py's base thresholds. `category = "regional"` kept unchanged
# from the original file despite the "secondary main line" framing above --
# no research in this task revisited that categorisation call, only the
# file-structure/naming one.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# ## Breckland Line (Norwich-Cambridge)
#
# One single route that calls at both Ely and Thetford via Wymondham,
# Attleborough, Thetford AND Brandon before reaching Ely and then
# Cambridge -- not two competing routings. Wikipedia's "Breckland line"
# article's own "Route" section table gives the ordered station list from
# Norwich used here: Norwich, Wymondham, Spooner Row, Attleborough, Eccles
# Road (serving Quidenham), Harling Road (serving East Harling), Thetford,
# Brandon, Lakenheath, Shippea Hill, Ely, Cambridge North, Cambridge. The
# article is explicit that "trains pass through Waterbeach station between
# Ely and Cambridge North without stopping" -- Waterbeach is deliberately
# omitted rather than invented as a calling point. Some stations see very
# sparse service ("Spooner Row, Lakenheath and Shippea Hill" are request
# stops only; "Harling Road and Eccles Road have peak-hour only services")
# but are genuine current calling points, not closed stations, so are kept.
#
# CRS codes verified from each station's own Wikipedia infobox `code`
# field: Wymondham (WMD), Spooner Row (SPN), Attleborough (ATL), Eccles
# Road (ECS), Harling Road (HRD), Thetford (TTF), Brandon (BND), Lakenheath
# (LAK), Shippea Hill (SPP), Ely (ELY), Cambridge North (CMB), Cambridge
# (CBG).
#
# ## Segment decision at Norwich: station-level overlap only, NOT a shared
# segment name
#
# Norwich is this line's own shared origin with the (now separately
# catalogued) Bittern and Wherry lines, and is also the terminus of
# `greater-anglia-main-line.toml`'s `geml-mainline` segment and
# `emr-regional.toml`'s own `emr-regional-east` segment. Per the original
# bundled file's own ruling (reusing `geml-mainline` would wrongly
# reclassify unrelated far-flung stations as shared trunk too), Norwich is
# folded into this file's own exclusive `breckland-line` segment rather
# than a separate shared-with-siblings segment name -- consistent with the
# other single-segment-per-branch files in this split. Since
# `breckland-line` is not reused by `greater-anglia-bittern-line.toml` or
# `greater-anglia-wherry-lines.toml` (each has its own distinct segment
# names), this does NOT create an accidental shared trunk between the
# three new files -- an incident at Norwich still matches all of them
# independently, each as `MatchScope::ExclusiveSegment`, exactly as the
# original bundled file's own tests intended.
#
# ## Segment decision at Ely and Cambridge: station-level overlap only --
# a multi-way overlap, verified not assumed
#
# The Breckland Line reaches Cambridge from the north via Ely and
# Cambridge North, an entirely different, non-electrified-until-Ely
# corridor from `greater-anglia-west-anglia.toml`'s West Anglia Main Line
# approach via Bishop's Stortford, Elsenham, Newport, Audley End -- the two
# corridors share no track, only meeting at Cambridge station itself.
#
# Ely is also `xc-stansted.toml`'s own whole-route `xc-stansted` segment
# (CrossCountry's Birmingham-Stansted Airport route approaches Cambridge
# via Peterborough and Ely too, on the same Fen Line corridor this line
# uses between Ely and Cambridge North), `emr-regional.toml`'s own
# `emr-regional-east` segment, and `great-northern-kings-lynn.toml`'s own
# `gn-cambridge-kings-lynn-branch` segment. Cambridge itself is also on
# `thameslink-cambridge.toml`'s own segment and
# `greater-anglia-ipswich-cambridge.toml`'s own segment (both catalogued
# after this route was first drafted). None of these files share a
# segment name with each other at these stations -- reusing any of their
# literal segment names here would incorrectly widen this line's own claim
# onto stations it doesn't serve. So both stations get this line's own
# exclusive `breckland-line` segment name, station-level overlap only with
# every other file listed above.

[[stations]]
crs = "NRW"
tiploc = "NRCH"
role = "junction"
segment = "breckland-line"
# Terminus of greater-anglia-main-line.toml's `geml-mainline` and the
# shared origin of the (separately catalogued) Bittern and Wherry lines.
# Station-level overlap only -- see the segment-decision note above.

[[stations]]
crs = "WMD"
role = "major"
segment = "breckland-line"

[[stations]]
crs = "SPN"
role = "minor"
segment = "breckland-line"
# Spooner Row: request stop.

[[stations]]
crs = "ATL"
role = "major"
segment = "breckland-line"

[[stations]]
crs = "ECS"
role = "minor"
segment = "breckland-line"
# Eccles Road: peak-hour only service (two trains each direction, Mon-Sat).

[[stations]]
crs = "HRD"
role = "minor"
segment = "breckland-line"
# Harling Road: peak-hour only service, same pattern as Eccles Road.

[[stations]]
crs = "TTF"
role = "major"
segment = "breckland-line"

[[stations]]
crs = "BND"
role = "minor"
segment = "breckland-line"

[[stations]]
crs = "LAK"
role = "minor"
segment = "breckland-line"
# Lakenheath: request stop.

[[stations]]
crs = "SPP"
role = "minor"
segment = "breckland-line"
# Shippea Hill: request stop; some stopping trains only once a day in each
# direction.

[[stations]]
crs = "ELY"
role = "junction"
segment = "breckland-line"
# Ely: also on xc-stansted.toml's `xc-stansted` segment,
# emr-regional.toml's `emr-regional-east` segment and
# great-northern-kings-lynn.toml's `gn-cambridge-kings-lynn-branch`
# segment. Station-level overlap only -- see the segment-decision note
# above.

[[stations]]
crs = "CMB"
role = "minor"
segment = "breckland-line"
# Cambridge North: opened 2017. Trains pass through Waterbeach, between
# here and Ely, without stopping -- deliberately omitted.

[[stations]]
crs = "CBG"
role = "terminus"
segment = "breckland-line"
# Terminus of this line. Also on greater-anglia-west-anglia.toml's
# `waml-mainline` segment, xc-stansted.toml's `xc-stansted` segment,
# great-northern-kings-lynn.toml's own segment,
# thameslink-cambridge.toml's own segment and
# greater-anglia-ipswich-cambridge.toml's own segment -- all genuine
# station-level overlaps (different physical approach corridors converging
# only at this station), not shared segment names -- see the
# segment-decision note above.

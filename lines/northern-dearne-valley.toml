id = "northern-dearne-valley"
name = "Wakefield Line (Sheffield service)"
mode = "national-rail"
category = "regional"
operators = ["NT"]

# --- Naming correction, found during research (read this first) ---
# This task's brief named this line "Dearne Valley Line (Sheffield-
# Meadowhall-Mexborough-Goldthorpe-Thurnscoe-Wakefield)". That description
# does not survive verification against live sources:
#
# - Wikipedia's own "Dearne Valley line" article is a REAL, different,
#   currently-operating route: Sheffield to YORK (not Wakefield) via
#   Meadowhall, Rotherham Central, Swinton, Moorthorpe, Pontefract Baghill,
#   Sherburn-in-Elmet, Church Fenton and Ulleskelf -- three round trips a
#   day. Its own article states plainly that Goldthorpe and Thurnscoe are
#   NOT called at by these trains: "primarily served by Wakefield Line
#   trains; the two Dearne Valley line trains a day pass through without
#   stopping." So the station list this task actually names (Goldthorpe,
#   Thurnscoe, Wakefield) is not the real Dearne Valley Line's own service.
# - The real Sheffield-Meadowhall-Swinton-Bolton-on-Dearne-Goldthorpe-
#   Thurnscoe-Moorthorpe-...-Wakefield-Leeds stopping service that the
#   brief is actually describing is what Wikipedia's own "Wakefield line"
#   article names: "The Wakefield line is a railway line and service...
#   The service connects Leeds and Wakefield with Sheffield and Doncaster".
#   That article's own "Fitzwilliam-Swinton" route section is explicit that
#   this Sheffield-bound fork of the Wakefield Line and the (different)
#   Dearne Valley Line share some infrastructure but not the same trains:
#   "Part of this section is also worked as the Dearne Valley line."
# - Mexborough (MEX), also named in the brief, turns out not to be on this
#   route at all -- its own Wikipedia article places it "on the Sheffield
#   to Doncaster Line", a different route entirely, not served by the
#   Sheffield-Wakefield stopping service modelled below. Omitted rather
#   than guessed in.
#
# The task's own stable filename/id (`northern-dearne-valley`) is kept
# unchanged per the plan's own convention for this kind of correction
# (mirrors `emr-connect.toml`'s identical "kept the id, corrected the
# route" precedent), but `name` and every source below reflect the real,
# verified route: the Sheffield fork of the Wakefield line.

sample_stations = ["SHF", "SWN", "WKF"]
destination_crs_filter = ["WKF"]
# This file's own scope is Sheffield to Wakefield Westgate only -- see the
# scope note below. No match_keywords: the real "Wakefield line" brand
# covers a Y-shaped network with a second (Fitzwilliam-Doncaster) fork this
# file does not model at all (see the scope note below); using "Wakefield
# line" here would misattribute an incident on that unmodelled Doncaster
# fork to this file. Station and operator evidence carries this file
# instead.

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10
# Hourly Sheffield-Leeds-via-Moorthorpe service, confirmed via Swinton
# railway station's own Wikipedia article, Services section: "one per hour
# to Leeds via Moorthorpe and two per hour to Sheffield." Same values as
# `emr-regional.toml`'s comparable hourly cross-city stopping service.

# Sheffield to Wakefield Westgate, ordered south to north, via Meadowhall,
# Rotherham Central, Swinton, Bolton-upon-Dearne, Goldthorpe, Thurnscoe,
# Moorthorpe and Fitzwilliam. Station list and order confirmed against
# Wikipedia's "Wakefield line" article's own "Swinton-Sheffield" and
# "Fitzwilliam-Swinton" route sections (raw wikitext fetched via
# Special:Export), cross-checked against Swinton railway station's own
# article (independently corroborates the Sheffield/Leeds-via-Moorthorpe
# service pattern and frequency).
#
# --- Scope boundary: Wakefield Westgate northward, and the Doncaster fork,
# are deliberately not modelled here ---
# The real "Wakefield line" is Y-shaped: Leeds City-Fitzwilliam is a shared
# trunk, which then forks at Fitzwilliam into a Doncaster branch (South
# Elmsall, Adwick, Bentley, Doncaster) and this file's own Sheffield branch
# (Moorthorpe, Thurnscoe, Goldthorpe, Bolton-upon-Dearne, Swinton,
# Rotherham Central, Meadowhall, Sheffield). This task's own brief scopes
# the assignment to "Sheffield...Wakefield" specifically, so this file
# stops at Wakefield Westgate rather than continuing on to Leeds or
# forking to Doncaster -- both are real, sourced, documented gaps left for
# whoever picks up the wider Wakefield Line network. Sandal & Agbrigg and
# Fitzwilliam themselves ARE included below since Wikipedia's own route
# description places them on the Sheffield-bound fork's own approach to
# Wakefield Westgate, not exclusively on the Doncaster fork.
#
# --- Segment/overlap decision ---
# WKF (Wakefield Westgate) is also an `lner-leeds.toml` station (that
# file's own `lner-leeds` segment, on the King's Cross-Leeds ECML branch).
# Different physical approach into the same station (this line arrives
# from Sandal & Agbrigg to the south; LNER's approaches from Doncaster to
# the east) -- station-overlap only, no segment shared, the same
# `xc-manchester.toml` precedent cited throughout this catalogue.
#
# SHF (Sheffield) is also a `cross-country.toml`/`emr-midland-main-line.
# toml`/`emr-regional.toml` station, each via yet another different
# physical approach -- station-overlap only, matching `emr-regional.
# toml`'s own Ruling 3 for the identical situation at Sheffield/Nottingham.
#
# Every station below uses this file's own single exclusive segment,
# `northern-wakefield-sheffield` -- no genuine, currently-modelled physical
# track-sharing with any other file's own tagged stations was found on
# this specific Sheffield-Moorthorpe-Fitzwilliam-Wakefield stretch.
#
# CRS codes for every station below verified against
# https://ds.cursed.solutions/api/stations?q=<name> (one unambiguous result
# each) and cross-checked against each station's own Wikipedia infobox.
# SHF tiploc reused unchanged from `cross-country.toml`/`emr-regional.
# toml`/`emr-midland-main-line.toml`, already verified there.
[[stations]]
crs = "SHF"
tiploc = "SHEFFLD"
role = "terminus"
segment = "northern-wakefield-sheffield"

[[stations]]
crs = "MHS"
role = "minor"
segment = "northern-wakefield-sheffield"
# Meadowhall (Meadowhall Interchange).

[[stations]]
crs = "RMC"
role = "minor"
segment = "northern-wakefield-sheffield"
# Rotherham Central.

[[stations]]
crs = "SWN"
role = "major"
segment = "northern-wakefield-sheffield"
# Swinton (South Yorkshire). CRS confirmed SWN, distinct from SNN (Swinton,
# Manchester) via the cursed.solutions lookup.

[[stations]]
crs = "BTD"
role = "minor"
segment = "northern-wakefield-sheffield"
# Bolton-upon-Dearne.

[[stations]]
crs = "GOE"
role = "minor"
segment = "northern-wakefield-sheffield"
# Goldthorpe -- NOT called at by the separate, real Dearne Valley Line's
# own Sheffield-York trains (see the naming-correction note above); this
# is the Wakefield line's own stop.

[[stations]]
crs = "THC"
role = "minor"
segment = "northern-wakefield-sheffield"
# Thurnscoe -- same distinction as Goldthorpe above.

[[stations]]
crs = "MRP"
role = "minor"
segment = "northern-wakefield-sheffield"
# Moorthorpe -- also served by the real Dearne Valley Line's own
# Sheffield-York trains (that route's shared approach as far as here),
# but that line is not modelled by any file in this catalogue, so no
# segment is shared.

[[stations]]
crs = "FZW"
role = "junction"
segment = "northern-wakefield-sheffield"
# Fitzwilliam -- junction where the (unmodelled) Doncaster fork diverges;
# see the scope note above.

[[stations]]
crs = "SNA"
role = "minor"
segment = "northern-wakefield-sheffield"
# Sandal & Agbrigg.

[[stations]]
crs = "WKF"
role = "terminus"
segment = "northern-wakefield-sheffield"
# Wakefield Westgate -- this file's own northern scope boundary; see the
# scope note above. Also an `lner-leeds.toml` station; see the overlap
# note above.

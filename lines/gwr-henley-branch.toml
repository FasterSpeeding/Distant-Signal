id = "gwr-henley-branch"
name = "Henley Branch Line"
mode = "national-rail"
category = "regional"
operators = ["GW"]
# Great Western Railway, modern diesel multiple units
# (en.wikipedia.org/wiki/Henley_branch_line).

destination_crs_filter = ["HOT"]
sample_stations = ["WGV", "SHI", "HOT"]

match_keywords = ["Henley branch"]
# The line's own current name. Grepped clean against every other file's own
# match_keywords before adding — no collision. (wmr-snow-hill.toml's own
# comments separately mention "Henley-in-Arden," an unrelated Warwickshire
# town on a different route; that file's own match_keywords does not
# contain "Henley branch" or any conflicting phrase.)

# A short (4.5 mile), single-track branch with no diversionary alternative,
# roughly half-hourly off-peak (en.wikipedia.org/wiki/Henley_branch_line) —
# the same isolated-branch reasoning as gwr-marlow-branch.toml's own
# override, from this same batch.
[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10

# ============================================================================
# ROUTE AND SOURCING
# ============================================================================
# en.wikipedia.org/wiki/Henley_branch_line: this line diverges from the
# Great Western Main Line at Twyford, running Twyford - Wargrave (opened
# 1900) - Shiplake - Henley-on-Thames, single track (converted from 7 ft
# broad gauge in 1876), "trains at about 30 minute intervals off peak," with
# an enhanced service during the Henley Royal Regatta each July.
#
# --- Twyford: real shared waypoint, kept as station overlap only ---
#
# Twyford (TWY) is already gwr-thames-valley.toml's own exclusive
# `gwr-thames-valley` segment and elizabeth-line.toml's own `elizabeth-west`
# segment (both files' own comments explicitly note Twyford as this branch's
# own junction, without claiming the branch itself) — neither of which
# reaches Wargrave, Shiplake or Henley-on-Thames. Following this batch's
# established single-waypoint-overlap treatment (see gwr-marlow-branch.
# toml's MAI note for the identical shape), TWY is tagged with this line's
# own exclusive segment below rather than either sibling's.
[[stations]]
crs = "TWY"
tiploc = "TWYFORD"
role = "junction"
segment = "gwr-henley-branch"
# Twyford. Row's tiploc copied from gwr-thames-valley.toml. Real shared
# waypoint with gwr-thames-valley.toml/elizabeth-line.toml, kept as station
# overlap only — see comment above. This line's own exclusive branch begins
# here.

[[stations]]
crs = "WGV"
role = "minor"
segment = "gwr-henley-branch"
# Wargrave. Opened 1900, after the rest of the branch.

[[stations]]
crs = "SHI"
role = "minor"
segment = "gwr-henley-branch"
# Shiplake. A 30 mph speed restriction applies over Shiplake Bridge
# immediately south of here.

[[stations]]
crs = "HOT"
role = "terminus"
segment = "gwr-henley-branch"
# Henley-on-Thames.

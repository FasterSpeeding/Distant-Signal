id = "wcml-north-wales"
name = "West Coast Main Line: North Wales"
mode = "national-rail"
category = "main-line"
operators = [
  "VT",  # Avanti West Coast. Same reasoning as the other WCML branch files
  # in this batch: this is Avanti's own Euston-North Wales intercity
  # service. Transport for Wales ("AW") also runs local/regional services
  # over the Chester-Holyhead corridor (the North Wales Main/Coast Line)
  # but that's a distinct, unmodelled service group -- see the TfW-overlap
  # comment below.
]

# Route research (Step 1), fetched live 2026-08-30 and cross-checked across
# four independent sources:
#   1. Wikipedia's "Avanti West Coast" article: its routes section
#      describes "Route C -- London to Chester and North Wales" as 1tph
#      Euston-Chester calling at Stafford and Crewe, with 6 trains/day
#      continuing beyond Chester to Holyhead calling at "Flint, Prestatyn,
#      Rhyl, Colwyn Bay, Llandudno Junction and Bangor". It also notes one
#      train/day has a dividing portion serving Wrexham General (not
#      modelled here -- too infrequent and a different physical fork, same
#      convention `wcml-liverpool.toml` used for its own one-train/day
#      Hartford footnote).
#   2. Wikipedia's "North Wales Main Line" article (the Crewe-Holyhead
#      infrastructure article; note this is the same article the "North
#      Wales Coast Line" title redirects to) independently confirms
#      "principal through passenger services are London Euston to
#      Holyhead, Bangor, Chester and Wrexham General, operated by Avanti
#      West Coast", and gives the full Crewe-Holyhead station list this
#      file's calling points are drawn from (a subset -- only Avanti's own
#      calling pattern from source 1, not every local stop on the line).
#   3. Wikipedia's "West Coast Main Line" article corroborates
#      Crewe-Chester-Holyhead as a genuinely distinct physical branch (the
#      unelectrified "North Wales Main Line"), and that Avanti's
#      predecessor fleet (Super Voyagers) worked "London Euston to Chester
#      and Holyhead services" over it -- i.e. this has been a continuous
#      through service, not a new addition.
#   4. Wikipedia's "Holyhead railway station" article independently
#      confirms current-day Avanti West Coast through services: "6 trains
#      per day to London Euston, as well as 1 train per day which runs to
#      Birmingham New Street via Crewe" (the Birmingham-via-Crewe working
#      isn't modelled here, out of this file's researched scope), and
#      Avanti's own website (avantiwestcoast.co.uk, fetched live) lists
#      "Chester & North Wales Services: via Crewe, Stafford & Milton
#      Keynes" among its route groups, corroborating the operator and
#      general routing independently of Wikipedia.
# CRS codes for the new stations below (Chester through Holyhead) were each
# independently confirmed against their own Wikipedia station-article
# infobox (CTR, FLN, PRT, RHL, CWB, LLJ, BNG, HHD) -- railwaycodes.org.uk
# was attempted as the usual second-source cross-check for CRS codes but
# returned HTTP 429 (rate-limited) during this research session, so the
# station-infobox cross-check stands in for it here; every code above was
# independently confirmed via its own article, not inferred from a single
# source.
# Conclusion: a single current Avanti route, Euston to Holyhead via the
# shared WCML spine to Crewe, then Chester and the North Wales coast --
# like `wcml-liverpool.toml`, no second physically distinct branch to
# model here (the one-train/day Wrexham dividing portion is a real fork
# but too infrequent to model as a full branch). `wcml-liverpool.toml` faced
# an analogous one-train/day footnote for its own Hartford stop, but this
# audit's CIF-schedule cross-check found Avanti has since added a daily
# each-way service there from December 2025, upgrading it to a modelled
# station (see that file's HTF entry) -- no equivalent schedule upgrade was
# found for the Wrexham dividing portion, so it remains unmodeled here.

# Most Avanti Euston-Chester/North Wales trains terminate at Chester
# (1tph); only a minority (6/day) continue on to Holyhead. Both are
# legitimately "this line" (the North Wales branch, not e.g. the Liverpool
# or Manchester branches), so both termini are listed here to avoid
# under-matching the majority Chester-terminating services via LDBWS
# destination inference.
# EUS covers up-direction (London-bound) services -- both CTR and HHD are
# near-unmatchable on their own since services calling there are almost
# always continuing past or originating from further down the line, not
# terminating there in the down direction captured by a departure-board
# destination field.
destination_crs_filter = ["CTR", "HHD", "EUS"]
sample_stations = ["CTR", "HHD"]
# No match_keywords: same reasoning as the other WCML branch files in this
# batch -- neither "North Wales Main Line" nor "North Wales Coast Line" is
# confirmed against a live Knowledgebase incident to be the phrasing that
# feed actually uses (the Global Constraints and `lines/SCHEMA.md` both
# warn against padding match_keywords without that confirmation), and
# "North Wales Coast" in particular is also the name of Transport for
# Wales' own future line over the same physical corridor (see below) --
# guessing a shared-sounding phrase now risks silently mis-attributing a
# TfW-only local-service incident to this Avanti-only file. Station and
# operator evidence carries it instead, same as
# `wcml-birmingham.toml`/`wcml-manchester.toml`/`wcml-liverpool.toml`.

# ---------------------------------------------------------------------
# TfW/WCML shared corridor (read this before touching segment names here):
# The gap analysis flagged this as a CONFIRMED future overlap -- Transport
# for Wales' own North Wales Coast Line (Batch 11) covers this exact
# Chester-Holyhead corridor with its own local/regional stopping service,
# a different operator ("AW") and a different, finer station list than
# Avanti's own limited-stop calling pattern modelled below.
#
# UPDATED (2026-09-21 real-world-sanity review, reversing the original
# Batch 11 "station-overlap-only" ruling described below): this stretch
# (Chester through Holyhead) now reuses `tfw-north-wales-coast.toml`'s own
# whole-route segment name, `tfw-north-wales-coast`, directly below,
# rather than this file's own former `wcml-north-wales-branch` name. This
# is a genuine, deliberate shared-trunk claim, not a station-level
# coincidence: unlike the Chester/Wrexham-corridor "two different physical
# routes converging on one station" case elsewhere in this catalogue
# (`tfw-shrewsbury-chester.toml`'s own Chester comment), Avanti's Euston-
# Holyhead service and TfW's North Wales Coast Line genuinely run over the
# *same* double-track main line for this entire stretch -- one physical
# corridor, not two meeting at a point. TfW is this corridor's principal
# local operator (the North Wales Coast Line's own dense, all-stations
# stopping pattern versus Avanti's six-trains-a-day limited-stop service),
# so this file defers to `tfw-north-wales-coast.toml`'s segment name
# rather than the other way around. An incident on any station both files
# carry (CTR, FLN, PRT, RHL, CWB, LLJ, BNG, HHD) now correctly propagates
# to both files as `MatchScope::SharedSegment` -- a genuine improvement,
# not a regression: a track closure anywhere on this corridor really does
# affect both operators' trains, which run over the same rails end to end
# even where Avanti doesn't stop. `tfw-north-wales-coast.toml`'s own
# additional 11 stations that this file doesn't separately list (Shotton,
# Abergele & Pensarn, Conwy, Penmaenmawr, Llanfairfechan, and the five
# Anglesey stops between Bangor and Holyhead) are also on that same
# segment name. `is_shared`/`is_exclusive_to` key off the segment *name*
# across the whole catalogue, not per-station (see `lines/SCHEMA.md`'s own
# "indexed by name, not per-station" framing), so an incident at one of
# those 11 still only matches `tfw-north-wales-coast.toml` itself (this
# file has no entry at any of those CRS codes, and `match_one` requires
# `line.has_station(crs)`), but that single match is classified
# `MatchScope::SharedSegment`, not `ExclusiveSegment` -- correctly, since
# Avanti's own through service genuinely runs over that stretch of track
# too, even where it doesn't stop. See
# `chester_station_overlap_matches_both_lines_as_exclusive`/
# `llj_station_overlap_matches_both_lines_as_exclusive` (both updated,
# where both files genuinely have a matching station) and
# `north_wales_coast_own_stretch_incident_is_shared_segment_but_single_match`/
# `tfw_north_wales_coast_new_station_incident_resolves_exclusive_segment`
# (the single-file-but-still-shared case) in `crates/common/src/matcher.rs`
# for the concrete assertions.
#
# Original Batch 11 history, kept for context: this file's exclusive
# segment for this corridor used to be named `wcml-north-wales-branch` --
# deliberately WCML-prefixed (matching this batch's own naming convention:
# `wcml-birmingham-branch`, `wcml-liverpool-branch`,
# `wcml-manchester-crewe`/`-stoke`), not a bare
# `north-wales-coast`/`north-wales-main-line` name TfW's own file would be
# more likely to reach for on its own. `lines/tfw-north-wales-coast.toml`'s
# own curator, at the time, read that comment and this file's own station
# list, then chose to give TfW's line its own distinct segment name --
# station-overlap-only at Chester, confirmed mutually consistent by Batch
# 11's own final review. That was a defensible reading of the evidence
# available at the time (the note only flagged the Chester station overlap
# specifically, not the full-corridor track sharing), but the 2026-09-21
# review re-examined the whole corridor, not just the Chester endpoint,
# and found the two files' station lists overlap exactly where both
# operators' real services run (Flint, Prestatyn, Rhyl, Colwyn Bay,
# Llandudno Junction, Bangor -- precisely Avanti's own quoted calling
# pattern from source 1 above), which is stronger evidence for genuine
# track sharing than a single shared endpoint.
# ---------------------------------------------------------------------

# London Euston to Holyhead via Crewe and Chester, ordered south-east to
# north-west. EUS through CRE reuse `west-coast-main-line.toml`'s own
# `wcml-london`/`wcml-midlands`/`wcml-northwest` segment tags verbatim
# (same trunk-sharing pattern `wcml-birmingham.toml`, `wcml-manchester.toml`,
# and `wcml-liverpool.toml` already set). Crewe is the real diverging
# point: Avanti's North Wales service leaves WCML metals there for the
# North Wales Main Line via Chester (confirmed via sources 1-3 above). Per
# the shared-trunk rule of thumb in `lines/SCHEMA.md`, Crewe stays on the
# shared `wcml-northwest` segment (the same tag `wcml-manchester.toml` and
# `wcml-liverpool.toml` also reuse there for their own branches) and the
# now-shared `tfw-north-wales-coast` segment (see the TfW/WCML shared
# corridor note above) starts at the next station, Chester.
#
# Segment-name collision check (per the Global Constraints): this file's
# 8 Chester-Holyhead stations deliberately reuse
# `tfw-north-wales-coast.toml`'s own segment name verbatim (see the note
# above) rather than a WCML-prefixed name of this file's own, so no
# collision check is needed for that stretch -- the whole point is that it
# matches. Crewe itself does not collide with `wcml-manchester.toml`'s
# `wcml-manchester-crewe` segment or `wcml-liverpool.toml`'s
# `wcml-liverpool-branch` segment, even though all three diverge from the
# shared spine at the same junction station: all three are genuinely
# different physical corridors to different destinations
# (Wilmslow/Manchester, Runcorn/Liverpool, Chester/Holyhead respectively),
# so three distinct exclusive segment names there are correct, not an
# oversight.
[[stations]]
crs = "EUS"
tiploc = "EUSTON"
role = "terminus"
segment = "wcml-london"

[[stations]]
crs = "WFJ"
tiploc = "WATFDJ"
role = "major"
segment = "wcml-london"

[[stations]]
crs = "HML"
tiploc = "HEMLHMP"
role = "minor"
segment = "wcml-london"
# Hemel Hempstead. CRS/TIPLOC corrected by this audit's CIF-schedule
# cross-check -- the previous "HMP"/"HAMPTON" entry was a bogus pair; see
# `west-coast-main-line.toml`'s own HML entry for the full sourcing note.
# Kept identical across all five WCML files that carry this shared-trunk
# row.

[[stations]]
crs = "TRI"
tiploc = "TRING"
role = "minor"
segment = "wcml-london"

[[stations]]
crs = "MKC"
tiploc = "MKNSCEN"
role = "major"
segment = "wcml-midlands"

[[stations]]
crs = "RUG"
tiploc = "RUGBY"
role = "major"
segment = "wcml-midlands"

[[stations]]
crs = "NUN"
tiploc = "NNTN"
role = "minor"
segment = "wcml-midlands"

[[stations]]
crs = "TAM"
tiploc = "TMWTHLL"
role = "minor"
segment = "wcml-midlands"

[[stations]]
crs = "LTV"
tiploc = "LCHTTVL"
role = "minor"
segment = "wcml-midlands"

[[stations]]
crs = "STA"
tiploc = "STAFFRD"
role = "junction"
segment = "wcml-midlands"

[[stations]]
crs = "CRE"
tiploc = "CREWE"
role = "junction"
segment = "wcml-northwest"

# Shared North Wales corridor -- see the TfW/WCML shared corridor note
# above for the segment-name reasoning (reuses `tfw-north-wales-coast.toml`'s
# own segment name, `tfw-north-wales-coast`, rather than a WCML-prefixed
# name of this file's own). Chester is itself a real junction (a
# one-train/day dividing portion serves Wrexham General from here, per
# source 1 above) but that fork isn't modelled in this file, so Chester is
# tagged "major" rather than "junction" here.
[[stations]]
crs = "CTR"
role = "major"
segment = "tfw-north-wales-coast"

[[stations]]
crs = "FLN"
role = "minor"
segment = "tfw-north-wales-coast"

[[stations]]
crs = "PRT"
role = "minor"
segment = "tfw-north-wales-coast"

[[stations]]
crs = "RHL"
role = "minor"
segment = "tfw-north-wales-coast"

[[stations]]
crs = "CWB"
role = "minor"
segment = "tfw-north-wales-coast"

[[stations]]
crs = "LLJ"
role = "minor"
segment = "tfw-north-wales-coast"

[[stations]]
crs = "BNG"
role = "major"
segment = "tfw-north-wales-coast"

[[stations]]
crs = "HHD"
role = "terminus"
segment = "tfw-north-wales-coast"

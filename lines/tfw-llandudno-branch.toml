id = "tfw-llandudno-branch"
name = "Llandudno branch line"
mode = "national-rail"
category = "regional"
operators = ["AW"]

# Confirmed via Wikipedia's "Llandudno branch line" article (raw wikitext):
# "a three-mile railway branch to the town from the main line at Llandudno
# Junction... For many years, the branch line has been exclusively in use by
# passenger trains; there is a frequent service with through trains to
# Manchester Airport and elsewhere." Only one intermediate stop exists on
# the branch (Deganwy), confirmed via the article's own text ("Deganwy, on
# the branch line, was for some time a useful port") and independently via
# `tfw-north-wales-coast.toml`'s own comment on this exact branch ("a short
# branch via Deganwy that leaves the through route at Llandudno Junction...
# not yet written up in this catalogue"), which this file now resolves.
#
# `category = "regional"`: matches `tfw-conwy-valley.toml`'s own treatment
# of the physically continuous corridor this branch feeds (see the
# shared-junction note below), even though this branch is itself frequent
# and double-tracked (per `tfw-conwy-valley.toml`'s own infobox note,
# "double track only on the short Llandudno-Llandudno Junction stretch") --
# unlike that sparser single-track line, nothing here suggests a deviation
# from config.py's base severity thresholds, so no overrides are set.
sample_stations = ["LLJ", "DGY", "LLD"]
destination_crs_filter = ["LLD"]
# The branch's own single genuine terminus.

match_keywords = ["Llandudno branch line"]
# The article's own title, the only phrase confirmed by this task's
# research; left at one keyword per SCHEMA.md's "don't pad" rule. Grepped
# `lines/*.toml`: no collision.

# CRS codes (DGY, LLD) cross-checked against
# https://ds.cursed.solutions/api/stations, matching each station's own
# Wikipedia infobox. LLJ's own CRS/TIPLOC are reused verbatim from
# `tfw-north-wales-coast.toml`, which already cross-checked them.
#
# ## Llandudno Junction (LLJ): a three-way overlap, two different decisions
#
# LLJ already appears in `tfw-north-wales-coast.toml` (its own
# `tfw-north-wales-coast` segment) and `tfw-conwy-valley.toml` (its own
# `tfw-conwy-valley` segment, applied to that file's *entire* route as one
# whole-line segment name). Both of those files' own comments already
# anticipated this branch and explicitly left the sharing decision open.
#
# With `tfw-north-wales-coast.toml`: station-overlap only, matching that
# file's own decision at this same station regarding `tfw-conwy-valley.toml`
# ("the two lines meet only at the LLJ station itself... not a shared trunk
# of track"). The North Wales Coast Line's own Chester-Holyhead route does
# not extend onto this branch.
#
# With `tfw-conwy-valley.toml`: SHARED, deliberately, because this is a
# real, sourced, physically-continuous through-service, not just a
# same-station coincidence. The Llandudno branch line's own article states
# plainly: "The line is at the northern extremity of the train service
# between Blaenau Ffestiniog and Llandudno, marketed as the Conwy Valley
# line" -- i.e. Transport for Wales' actual Conwy Valley line service
# genuinely continues past Llandudno Junction onto this branch and all the
# way to Llandudno itself, not just to the junction. (This is a real finding
# worth flagging for the controller: `tfw-conwy-valley.toml`'s own station
# list stops at Llandudno Junction and its own comment frames that as the
# line's genuine terminus -- per this branch's own sourcing, the through-
# service's actual terminus is Llandudno. Not fixed here, since editing that
# file is outside this task's scope, but noted for a future pass.)
#
# Given that, LLJ below reuses `tfw-conwy-valley.toml`'s exact segment name,
# `tfw-conwy-valley`, verbatim -- a deliberate, genuine shared-trunk claim.
# Deganwy and Llandudno themselves are kept on this file's own exclusive
# segment rather than also being tagged `tfw-conwy-valley`: that file's own
# station list does not include either of them, and per the
# `gwr-south-wales.toml` Bristol Parkway precedent ("a single-station
# waypoint, not a multi-station trunk... reusing the shared name for
# stations the other file doesn't reach would incorrectly widen its own
# claimed exclusivity"), extending the shared name beyond the one station
# both files' current lists actually name would overreach. An incident
# reported at Llandudno Junction therefore genuinely propagates between this
# file and `tfw-conwy-valley.toml` (both `MatchScope::SharedSegment`); one
# reported at Deganwy or Llandudno themselves does not.
[[stations]]
crs = "LLJ"
tiploc = "LANDUDJ"
role = "junction"
segment = "tfw-conwy-valley"
# See the LLJ overlap note above. Station-overlap only with
# `tfw-north-wales-coast.toml`'s own (different) segment name at this same
# station; genuinely shared with `tfw-conwy-valley.toml`.

[[stations]]
crs = "DGY"
role = "minor"
segment = "tfw-llandudno-branch"
# Deganwy: historically also a small harbour, per the branch line's own
# article.

[[stations]]
crs = "LLD"
role = "terminus"
segment = "tfw-llandudno-branch"
# Llandudno: this branch's own terminus, and the destination of through
# services from Manchester (via Manchester Airport) and from Blaenau
# Ffestiniog (marketed as the Conwy Valley line) -- see the overlap note
# above.

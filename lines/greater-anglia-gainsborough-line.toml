id = "greater-anglia-gainsborough-line"
name = "Gainsborough Line (Marks Tey - Sudbury)"
mode = "national-rail"
category = "regional"
operators = ["LE"]
# LE = Greater Anglia's ATOC code, already verified and cited in
# greater-anglia-main-line.toml -- not re-derived here.

# Split out of the former `greater-anglia-suffolk-branches.toml` (real-world
# sanity review): that file bundled three unrelated, separately
# community-rail-branded Greater Anglia branches (Gainsborough, Felixstowe,
# Mayflower) under a single "Suffolk Branch Lines" umbrella that nobody
# uses, and a single incident on any one of them reported as a disruption
# on all three. Split one file per real brand, matching this session's
# EMR/TfW split precedent. Station data and CRS codes below are reused
# verbatim from the original file -- redistributed, not re-researched.

sample_stations = ["SUY"]
match_keywords = ["Gainsborough line"]

# Hourly service -- unchanged from the original bundled file's reasoning
# (northern-lakes.toml/northern-tyne-valley.toml branch-line pattern): one
# cancellation is a large fraction of the hour's service, and a 5-minute
# delay on a short branch journey isn't yet a story at config.py's base
# thresholds.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# ## Gainsborough line / Sudbury branch (Marks Tey-Sudbury)
#
# Wikipedia's "Gainsborough line" article (fetched raw; "Sudbury branch
# line" redirects to it) -- the current marketing name, commemorating
# painter Thomas Gainsborough, of the former Stour Valley Railway -- is
# explicit: "a railway branch line off the Great Eastern Main Line ... that
# links Marks Tey in Essex with Sudbury in Suffolk", single-track
# throughout, hourly service, four stations total (its own stations table
# lists Marks Tey, Chappel & Wakes Colne, Bures, Sudbury in that mileage
# order from London). CRS codes verified from each station's own Wikipedia
# infobox `code` field and cross-checked against railwaycodes.org.uk's CRS
# index pages: Chappel & Wakes Colne (CWC), Bures (BUE), Sudbury (SUY).
#
# ## Segment decision at Marks Tey: station-level overlap only with
# `greater-anglia-main-line.toml`, NOT a shared segment name
#
# Marks Tey is already a `geml-mainline`-tagged junction in
# `greater-anglia-main-line.toml` ("Gainsborough line (to Sudbury) diverges
# here"). Reusing that literal segment name here would (per that file's own
# documented hazard: `segments.rs`'s `SegmentRegistry::is_shared` marks a
# segment name shared globally by name, not scoped to the stations two
# files actually have in common) incorrectly reclassify unrelated
# `geml-mainline` stations (Diss, Norwich, etc.) as shared trunk too. So
# Marks Tey keeps this file's own exclusive `gainsborough-line` segment
# name, unchanged from the original bundled file. Station-level overlap
# only -- an incident at Marks Tey matches both lines independently, each
# as `MatchScope::ExclusiveSegment`.

[[stations]]
crs = "MKT"
role = "junction"
segment = "gainsborough-line"
# Marks Tey: also a `geml-mainline`-tagged junction in
# greater-anglia-main-line.toml. Station-level overlap only, not a shared
# segment name -- see the segment-decision note above.

[[stations]]
crs = "CWC"
role = "minor"
segment = "gainsborough-line"

[[stations]]
crs = "BUE"
role = "minor"
segment = "gainsborough-line"

[[stations]]
crs = "SUY"
role = "terminus"
segment = "gainsborough-line"

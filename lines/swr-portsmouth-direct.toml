id = "swr-portsmouth-direct"
name = "Portsmouth Direct Line"
mode = "national-rail"
category = "main-line"
operators = ["SW"]

destination_crs_filter = ["PMH", "PMS", "HAV", "PTR", "HSL", "GLD"]
sample_stations = ["GLD", "HSL", "PMS"]  # GLD is first station on the exclusive segment
match_keywords = ["Portsmouth Direct", "Portsmouth line"]

# Shares Waterloo->Woking trunk with SWML and Alton.
# Diverges at Woking; everything south of Guildford is exclusive.
[[stations]]
crs = "WAT"
tiploc = "WATRLMN"
role = "terminus"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "CLJ"
tiploc = "CLPHMJ1"
role = "junction"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "WIM"
tiploc = "WDON"
role = "major"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "SUR"
tiploc = "SURBITN"
role = "junction"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "WOK"
tiploc = "WOKING"
role = "junction"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "GLD"
tiploc = "GUILDFD"
role = "major"
segment = "swr-portsmouth-direct"

[[stations]]
crs = "HSL"
tiploc = "HASLEMR"
role = "minor"
segment = "swr-portsmouth-direct"

[[stations]]
crs = "PTR"
tiploc = "PTRSFLD"
role = "minor"
segment = "swr-portsmouth-direct"

[[stations]]
crs = "HAV"
tiploc = "HAVANT"
role = "minor"
segment = "swr-portsmouth-direct"

[[stations]]
crs = "PMS"
tiploc = "PSEA"
role = "major"
segment = "swr-portsmouth-direct"

[[stations]]
crs = "PMH"
tiploc = "PHBR"
role = "terminus"
segment = "swr-portsmouth-direct"

id = "chiltern-aylesbury"
name = "Aylesbury Line"
mode = "national-rail"
category = "commuter"
operators = ["CH"]

# Split by the real-world sanity review: this file previously also folded
# in the Marylebone-Oxford route (via Bicester Village), a physically
# distinct corridor sharing nothing with this route beyond Marylebone
# itself, into a file called "Aylesbury Line" -- geographically wrong, as
# this file's own comments already half-acknowledged. That route now has
# its own file, chiltern-oxford.toml. This file covers the Amersham route
# only, plus (added by the same review) the separate Princes
# Risborough-Aylesbury local service -- both genuinely terminate at
# Aylesbury, unlike the Oxford route.
destination_crs_filter = ["AYS", "AVP"]
sample_stations = ["AMR", "AYS", "MRS"]
match_keywords = ["Aylesbury line", "Marylebone to Aylesbury"]

# Mixed frequency along the route (the Marylebone-Amersham stretch runs
# roughly every 15-20 minutes, shared corridor with London Underground's
# Metropolitan line; the outer Amersham-Aylesbury(-Vale Parkway) stretch
# and the Princes Risborough-Aylesbury branch are much less frequent,
# closer to hourly/half-hourly). swr-alton.toml faces the same
# mixed-frequency situation on its own branch and deliberately skips
# severity_overrides rather than assert unverified numbers; this file
# follows that precedent instead of guessing thresholds.

# Marylebone to Aylesbury (via Amersham), Marylebone-Aylesbury Vale Parkway
# stopping service, plus (real-world sanity review) the separate Princes
# Risborough-Aylesbury local service. The Bicester-Oxford branch this file
# used to also fold in now lives in its own file, chiltern-oxford.toml -
# see PRINCES RISBOROUGH-AYLESBURY BRANCH below for the replacement branch.
#
# Sources: Wikipedia's "London-Aylesbury line" article (ordered station
# list Marylebone -> Harrow-on-the-Hill -> Rickmansworth -> Chorleywood ->
# Chalfont & Latimer -> Amersham -> Great Missenden -> Wendover -> Stoke
# Mandeville -> Aylesbury -> Aylesbury Vale Parkway; the line "joins the
# Metropolitan line tracks a few yards south of Harrow-on-the-Hill
# station" and shares them to Amersham), cross-checked against
# nationalrail.co.uk's per-station pages for every CRS code below (each
# page's own heading, e.g. "Aylesbury (AYS)", "Amersham (AMR)") and against
# each station's own Wikipedia infobox. Only stations actually served by
# this stopping service are listed (this is itself an all-stations local
# service, unlike chiltern-main-line.toml's "principal stations only"
# convention, so no intermediate calls are omitted here).
[[stations]]
crs = "MYB"
tiploc = "MARYLBN"
role = "terminus"
segment = "chiltern-marylebone"
# Shared trunk with chiltern-main-line.toml AND chiltern-oxford.toml: the
# Birmingham main line, this line's Aylesbury services (both the Amersham
# route and the Princes Risborough route below) and chiltern-oxford.toml's
# own Oxford service all originate here. Per chiltern-main-line.toml's own
# comment (Task 12.1), the physical divergence point for the Amersham
# route is Neasden Junction, where the Marylebone-Birmingham route peels
# off west towards Northolt Junction/High Wycombe while this line's
# Amersham-bound service continues north alongside the Underground's
# Metropolitan line via Harrow-on-the-Hill. Confirmed via two independent
# Wikipedia articles: "Great Western and Great Central Joint Railway"
# ("The split occurs at Neasden Junction... [the] Joint Line route from
# Neasden proceeds to Northolt Junction and then toward High Wycombe...
# while the original Great Central main line continued... toward Aylesbury
# and beyond") and "London-Aylesbury line" ("At Neasden Junction, the
# Chiltern Main Line diverges to the west, while the Aylesbury line
# continues north parallel to the underground lines") — plus the Chiltern
# Main Line article's own route diagram, which independently shows
# "Neasden Junction" as a real point on that corridor. Neasden Junction
# itself has no National Rail CRS code/passenger stop, so only Marylebone
# is listed here as the shared station, matching the "chiltern-marylebone"
# tag chiltern-main-line.toml already uses for its own Marylebone entry.
# Per SCHEMA.md's shared-trunk rule of thumb, an incident reported at
# Marylebone itself (not a specific onward corridor) should reasonably
# propagate to every Chiltern service in both files, which this shared tag
# achieves.

[[stations]]
crs = "HOH"
role = "major"
segment = "chiltern-aylesbury-branch"
# First station past the Neasden Junction divergence; start of this
# line's own exclusive segment. Also a major London Underground
# interchange (Metropolitan/other sub-surface lines), but that's an LU
# concern, not a second National Rail line, so no "junction" role is
# asserted for this file's purposes.

[[stations]]
crs = "RIC"
role = "minor"
segment = "chiltern-aylesbury-branch"

[[stations]]
crs = "CLW"
role = "minor"
segment = "chiltern-aylesbury-branch"

[[stations]]
crs = "CFO"
role = "major"
segment = "chiltern-aylesbury-branch"
# Also where London Underground's Chesham branch diverges from the
# Metropolitan line - an LU-only branch point that Chiltern doesn't serve,
# so no National-Rail-relevant junction is asserted here either.

[[stations]]
crs = "AMR"
tiploc = "AMERSHM"
role = "major"
segment = "chiltern-aylesbury-branch"
# Northern terminus of the shared Metropolitan line trackage - some
# Underground services terminate here while Chiltern's National Rail
# service continues alone towards Aylesbury.
# TIPLOC corrected from an earlier "AMERSHAM" (8 chars, invalid - TIPLOCs
# are max 7 chars and this was the sole 8-char outlier across the whole
# catalogue) to "AMERSHM", confirmed against railwaycodes.org.uk's crsa.shtm
# CRS/NLC/TIPLOC/STANME/STANOX table, which lists TIPLOC=AMERSHM distinct
# from the STANME column's "AMERSHAM" (the likely source of the original
# find-replace-style error).

[[stations]]
crs = "GMN"
role = "minor"
segment = "chiltern-aylesbury-branch"

[[stations]]
crs = "WND"
role = "minor"
segment = "chiltern-aylesbury-branch"

[[stations]]
crs = "SKM"
role = "minor"
segment = "chiltern-aylesbury-branch"

[[stations]]
crs = "AYS"
role = "major"
segment = "chiltern-aylesbury-branch"
# Most services terminate here, but the passenger line itself continues to
# Aylesbury Vale Parkway (below), which is the true end of the branch.

[[stations]]
crs = "AVP"
role = "terminus"
segment = "chiltern-aylesbury-branch"

# ============================================================================
# PRINCES RISBOROUGH-AYLESBURY BRANCH - added by the real-world sanity
# review: a genuine, currently-operating Chiltern local service, distinct
# from both the Amersham route above and the Oxford route (now split out
# to chiltern-oxford.toml), and previously absent catalogue-wide.
# ============================================================================
# Confirmed via each station's own Wikipedia article: Monks Risborough's
# own infobox names its line as the "Aylesbury-Princes Risborough line"
# and gives Princes Risborough as the previous station, Little Kimble as
# the next; Little Kimble's own infobox confirms the reverse (previous:
# Monks Risborough, next: Aylesbury), and states the station "is served by
# trains operated by Chiltern Railways between London Marylebone and
# Aylesbury." Both stations' operator is confirmed as Chiltern Railways.
#
# CRS codes independently verified for this task (neither appeared
# anywhere in the catalogue before now): Monks Risborough (MRS) and Little
# Kimble (LTK), each confirmed via its own Wikipedia infobox "Station
# code" field and independently cross-checked against
# railwaycodes.org.uk's own CRS index pages (both currently listed there
# as operated by "Chiltern Rail").
#
# Princes Risborough (PRR) is reused unchanged from chiltern-main-line.toml
# (CRS only, not that file's segment name - see below); it is also this
# branch's own real junction, per Little Kimble's and Monks Risborough's
# own route-diagram fields. Aylesbury (AYS) is this branch's own real
# terminus, already listed above under the Amersham branch's own
# `chiltern-aylesbury-branch` segment - a genuine reconvergence (both
# routes terminate at the same Aylesbury platforms), not re-listed here,
# matching the precedent `greater-anglia-wherry-lines.toml`'s own Great
# Yarmouth entry already sets for a same-file reconvergence.
#
# Segment decision: this branch's own exclusive stretch (PRR through LTK)
# uses this file's own new segment name, `chiltern-princes-risborough-
# aylesbury`, not chiltern-main-line.toml's own `chiltern-main-line`
# segment or chiltern-oxford.toml's own `chiltern-oxford-approach` segment
# (both of which also touch PRR) - same reasoning already established
# throughout this catalogue and elsewhere in this file:
# `SegmentRegistry::is_shared` marks a segment name shared globally by
# name, not scoped to the stations files actually have in common, and
# neither sibling segment's station set is byte-identical to this one.
# Station-level overlap only at PRR (with both chiltern-main-line.toml and
# chiltern-oxford.toml); MRS and LTK are genuinely new, no overlap.
[[stations]]
crs = "PRR"
role = "junction"
segment = "chiltern-princes-risborough-aylesbury"
# Princes Risborough. Also chiltern-main-line.toml's own station
# (`chiltern-main-line` segment) and chiltern-oxford.toml's own station
# (`chiltern-oxford-approach` segment) - station overlap only with both,
# see the note above.

[[stations]]
crs = "MRS"
role = "minor"
segment = "chiltern-princes-risborough-aylesbury"
# Monks Risborough.

[[stations]]
crs = "LTK"
role = "minor"
segment = "chiltern-princes-risborough-aylesbury"
# Little Kimble. Next station is Aylesbury (AYS), already listed above
# under the Amersham branch - a genuine reconvergence, not re-listed here,
# see the header note above.

id = "xc-south-coast"
name = "CrossCountry South Coast Line"
mode = "national-rail"
category = "main-line"
operators = ["XC"]

destination_crs_filter = ["BMH", "SOU", "RDG", "OXF", "BAN"]
sample_stations = ["BAN", "OXF", "RDG", "SOU"]
# No match_keywords: no route name the Knowledgebase uses consistently, and
# "south coast" would pull in unrelated southern operators.

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10

# Birmingham New Street to Bournemouth via Banbury, Oxford and Reading,
# ordered north to south. Shares the spine's `xc-birmingham` hub only — this
# arm leaves Birmingham eastwards via Coventry, not via University.
#
# Runs over SWML metals from Basingstoke to Bournemouth and over the Elizabeth
# line's western approach at Reading, but claims neither line's segments: both
# extend well beyond the shared stretch (`swr-swml-south` runs on to Weymouth,
# `elizabeth-west` on to Paddington). Incidents on the shared track still
# match both lines by station.
#
# Task 9.6 fill-in (2026-09-01, fresh route-diagram pass, no named starting
# list in the plan): the "minor intermediate calls are omitted" boilerplate
# below is this file's own original convention. Every candidate station was
# confirmed to the two-source bar (Wikipedia infobox/article cross-checked
# against nationalrail.co.uk's `/stations/<crs>/details.html`), fetched live
# 2026-09-01, leg by leg along this whole Birmingham-Bournemouth corridor:
#   - Coventry-Leamington Spa (Coventry to Leamington Line): Kenilworth
#     (KNW), reopened 2018, confirmed strictly between COV and LMS. "Warwick
#     (Milverton)" is a closed historical station on this same corridor;
#     today's open "Warwick" station is on the unrelated Chiltern Main Line
#     via Warwick Parkway, not this line -- correctly stays out.
#   - Leamington Spa-Banbury: no intermediate station found (confirmed via
#     Banbury's own infobox route diagram).
#   - Banbury-Oxford (Cherwell Valley Line): Kings Sutton (KGS), Heyford
#     (HYD), Tackley (TAC).
#   - Oxford-Reading: this file's own OXF-RDG adjacency runs via Didcot
#     Parkway, the only physical route. Radley (RAD), Culham (CUM),
#     Appleford (APF) and Didcot Parkway (DID) itself are reused verbatim
#     (CRS/TIPLOC) from `gwr-thames-valley.toml`'s own Didcot-Oxford branch,
#     which already curates and two-source-verifies these four --
#     station-level overlap only, no segment shared (matching this whole
#     plan's established xc-cardiff/gwr-south-wales overlap precedent).
#     South of Didcot: Cholsey (CHO), Goring & Streatley (GOR), Pangbourne
#     (PAN), Tilehurst (TLH), freshly verified here.
#   - Reading-Basingstoke (Reading to Basingstoke Line, the only physical
#     route connecting the two): Reading West (RDW, reused verbatim from
#     `gwr-thames-valley.toml` -- genuinely shared trackage with that file's
#     own Reading-Newbury branch as far as Southcote Junction, confirmed via
#     Reading West's own infobox listing both lines; station-level overlap
#     only, same pattern as the Didcot-Oxford stations above), Reading Green
#     Park (RGP, opened 2023), Mortimer (MOR), Bramley (BMY).
#   - Basingstoke-Winchester-Southampton-Bournemouth (South Western Main
#     Line, "runs over SWML metals" per the header comment above): Micheldever
#     (MIC), Shawford (SHW), Eastleigh (ESL), Southampton Airport Parkway
#     (SOA), Swaythling (SWG), St Denys (SDN), Millbrook (MBK), Redbridge
#     (RDB), Totton (TTN), Ashurst New Forest (ANF), Beaulieu Road (BEU),
#     Brockenhurst (BCU, also the Lymington branch junction -- that branch
#     itself is not modelled in this catalogue yet), Sway (SWY), New Milton
#     (NWM), Hinton Admiral (HNA), Christchurch (CHR), Pokesdown (POK). None
#     of these are claimed on `swr-south-west-main.toml`'s own
#     `swr-swml-south` segment (that file independently uses the same
#     "principal only" convention over this exact stretch) -- this task adds
#     them only to this file's own exclusive `xc-south-coast` segment, per
#     the Global Constraint that a station's real-world existence, not this
#     file's named operator's calling pattern, is the bar. All 30 new
#     stations sit strictly between two already-modelled stations on the
#     existing `xc-south-coast` segment (or, for BHM->COV's Kenilworth, the
#     exclusive segment starting immediately after the `xc-birmingham`
#     junction), so all inherit `xc-south-coast` -- no new segment name.
[[stations]]
crs = "BHM"
tiploc = "BHAMNWS"
role = "junction"
segment = "xc-birmingham"

[[stations]]
crs = "COV"
role = "major"
segment = "xc-south-coast"

[[stations]]
crs = "KNW"
role = "minor"
segment = "xc-south-coast"
# Kenilworth: reopened 2018, strictly between Coventry and Leamington Spa.

[[stations]]
crs = "LMS"
role = "minor"
segment = "xc-south-coast"

[[stations]]
crs = "BAN"
role = "minor"
segment = "xc-south-coast"

[[stations]]
crs = "KGS"
role = "minor"
segment = "xc-south-coast"
# Kings Sutton: strictly between Banbury and Heyford.

[[stations]]
crs = "HYD"
role = "minor"
segment = "xc-south-coast"
# Heyford (Lower Heyford): strictly between Kings Sutton and Tackley.

[[stations]]
crs = "TAC"
role = "minor"
segment = "xc-south-coast"
# Tackley: strictly between Heyford and Oxford.

[[stations]]
crs = "OXF"

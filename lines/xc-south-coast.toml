# verbatim from `gwr-thames-valley.toml`.

[[stations]]
crs = "DID"
tiploc = "DIDCOTP"
role = "junction"
segment = "xc-south-coast"
# Didcot Parkway: strictly between Appleford and Cholsey. Also served by

id = "gwr-atlantic-coast"
name = "Atlantic Coast Line"
mode = "national-rail"
category = "regional"
operators = ["GW"]

# Devon/Cornwall branch-line batch: full UK station-coverage audit found this
# real, currently-open GWR branch (Par - Newquay) entirely missing from the
# catalogue. Wikipedia "Atlantic Coast Line (Cornwall)" infobox/lead: "a
# 20¾ mile railway branch line in Cornwall which runs from the coastal town
# of Par to the Atlantic Ocean at Newquay"; GWR passenger operator (freight
# operator listed separately, not relevant to `operators` here per
# `gwr-cornish-main-line.toml`'s own precedent of listing only the TOC that
# defines the line); single track with two passing loops (Goonbarrow
# Junction, Goss Moor).
#
# Category: "regional", matching this catalogue's precedent for a
# single-track community-rail branch (`northern-furness.toml`), confirmed
# rather than assumed -- Wikipedia: "The line operates a community railway
# passenger service ... The local passenger service on the line was
# designated by the Department for Transport as a community rail service in
# September 2006."

# Exclusive-segment stations only (Par is the shared junction with the
# Cornish Main Line, left off in favour of stations only this line reaches).
sample_stations = ["BGL", "SCR", "NQY"]

# Par (PAR) is also a `gwr-cornish-main-line.toml` sample/CRS entry.
# `destination_crs_filter` disambiguates this branch's own LDBWS departures
# (bound for NQY) from Cornish Main Line services calling at Par, mirroring
# `scotrail-ayrshire.toml`'s identical use of the field at GLC.
destination_crs_filter = ["NQY"]

match_keywords = ["Atlantic Coast Line", "Newquay branch"]
# "Atlantic Coast Line" is the line's own current branded/article name
# (Wikipedia article title and lead). "Newquay branch" is the plain
# infrastructure-name phrasing used throughout the industry and by
# `gwr-cornish-main-line.toml`'s own comment ("the junction for the Newquay
# branch (Atlantic Coast Line)"). Grepped `lines/*.toml` before starting:
# neither phrase collides with any existing file's `match_keywords`.

# Not genuinely seasonal-only: this task's own fresh sourcing found the
# gap-analysis's assumed seasonal-only pattern is now out of date. A
# £50m-funded Mid Cornwall Metro programme (government funding announced
# January 2023, engineering completed November 2025) introduced a
# year-round hourly Par-Newquay service from 17 May 2026 -- "an hourly
# service between Par and Newquay now operates" -- with only the additional
# through London Paddington workings remaining a summer-timetable extra.
# Single track with two passing loops keeps some rural-branch delay-recovery
# risk despite the improved frequency, so tuned thresholds are still kept,
# matching `northern-furness.toml`'s comparable single-track coastal branch,
# but this file explicitly does NOT model the line as seasonal-only in
# comments or configuration, per the brief's own instruction to verify
# rather than assume that framing.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

[[stations]]
crs = "PAR"
role = "junction"
segment = "gwr-atlantic-coast"
# Par: the real junction with the Cornish Main Line. Also a station entry
# (role "major", segment "gwr-cornish-main-line") in
# `gwr-cornish-main-line.toml` -- station overlap only, per this catalogue's
# established convention (`xc-south-coast.toml`/`xc-manchester.toml`
# precedent): no shared-segment name is reused here, since the two lines'
# own physical routes diverge immediately past Par.

# St Blazey (between Par and Luxulyan) deliberately excluded: its own
# Wikipedia article confirms the station "closed to the public on 21
# September 1925" and closed completely on "29 December 1934" -- a disused
# location today (the Atlantic Coast Line article itself refers only to
# "the former St Blazey station" and St Blazey engine shed/depot, not a
# passenger stop), consistent with the line's own infobox `stations = 7`
# count (Par through Newquay below, seven stations, not eight). No current
# CRS code (confirmed via the station lookup below).

[[stations]]
crs = "LUX"
role = "minor"
segment = "gwr-atlantic-coast"
# Luxulyan.

[[stations]]
crs = "BGL"
role = "minor"
segment = "gwr-atlantic-coast"
# Bugle. Goonbarrow Junction, "just south of Bugle" per Wikipedia, is a
# passing loop used by china clay freight and passenger trains, not a
# passenger station -- no current CRS code (confirmed via the lookup below),
# not modelled as a station.

[[stations]]
crs = "ROC"
role = "minor"
segment = "gwr-atlantic-coast"
# Roche. Goss Moor, "between Roche and St Columb Road" per Wikipedia, is a
# 400m passing loop, not a passenger station -- not modelled as a station.

[[stations]]
crs = "SCR"
role = "minor"
segment = "gwr-atlantic-coast"
# St Columb Road.

[[stations]]
crs = "QUI"
role = "minor"
segment = "gwr-atlantic-coast"
# Quintrell Downs.

[[stations]]
crs = "NQY"
role = "terminus"
segment = "gwr-atlantic-coast"
# Newquay: this line's own terminus.

# === Sources (cross-checked per this batch's Global Constraints) ===
#
# Route structure, operator, character, current service pattern:
#   - Wikipedia "Atlantic Coast Line (Cornwall)" (infobox + lead + body,
#     fetched fresh for this task, including a raw-wikitext pass for the
#     infobox): confirms GWR passenger operation, single track with two
#     named passing loops, 20¾ mile length, "stations = 7"; confirms the
#     ordered station list Par - Luxulyan - Bugle - Roche - St Columb Road -
#     Quintrell Downs - Newquay; confirms community-rail designation
#     (September 2006); confirms the Mid Cornwall Metro funding (January
#     2023), engineering completion (November 2025) and new hourly service
#     start date (17 May 2026) quoted above.
#   - Wikipedia "St Blazey railway station" (fetched independently, own
#     article): confirms closure to passengers in 1925/1934, supporting this
#     file's decision not to list it as a current station.
#
# CRS codes: every code below was verified live against
# `https://ds.cursed.solutions/api/stations?q=<name>` during this task --
# PAR "Par", LUX "Luxulyan", BGL "Bugle", ROC "Roche", SCR "St Columb Road",
# QUI "Quintrell Downs", NQY "Newquay". "St Blazey" and "Goonbarrow" both
# returned no match, confirming neither has a current CRS code. All matched
# with no discrepancies.
#
# TIPLOCs are omitted throughout: none were confirmed against a live source
# during this task, matching this batch's optional-field convention.
#
# === Scope boundaries (documented, not modelled) ===
#
# - The Cornish Main Line itself (Par onward to Penzance, or east to
#   Plymouth): already catalogued in `gwr-cornish-main-line.toml`; not
#   re-derived here beyond the station-overlap note above.
# - Occasional summer-timetable through London Paddington services: real
#   (per Wikipedia's own "During the summer timetable there are some
#   through services") but not a distinct destination pattern this task
#   verified service-by-service; the line's own `destination_crs_filter`
#   above is scoped to the core Par-Newquay shuttle only.

id = "greater-anglia-braintree-branch"
name = "Braintree Branch Line (Witham - Braintree)"
mode = "national-rail"
category = "regional"
operators = ["LE"]
# LE = Greater Anglia's ATOC code, already verified and cited in
# greater-anglia-main-line.toml -- not re-derived here.

# Split out of the former `greater-anglia-essex-branches.toml` (real-world
# sanity review): that file bundled three unrelated, separately
# community-rail-branded Greater Anglia branches (Sunshine Coast, Crouch
# Valley, Braintree) under a single "Essex Branch Lines" umbrella that
# nobody uses, and a single incident on any one of them reported as a
# disruption on all three. Split one file per real brand, matching this
# session's EMR/TfW split precedent. Station data and CRS codes below are
# reused verbatim from the original file -- redistributed, not
# re-researched.

sample_stations = ["BTR"]
match_keywords = ["Braintree branch line"]

# 1tph off-peak branch -- unchanged from the original bundled file's
# reasoning (northern-lakes.toml/northern-tyne-valley.toml branch-line
# pattern): one cancellation is a large fraction of the hour's service, and
# a 5-minute delay on a short branch journey isn't yet a story at
# config.py's base thresholds.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# ## Braintree branch line (Witham-Braintree)
#
# Wikipedia's "Braintree branch line" article (fetched raw): "diverges from
# the Great Eastern Main Line at Witham and runs north-west to Braintree...
# five stations, including the two termini." CRS codes for the other four
# stations independently verified from each station's own Wikipedia
# infobox `code` field: White Notley (WNY), Cressing (CES), Braintree
# Freeport (BTP), Braintree (BTR).
#
# ## Segment decision at Witham: station-level overlap only with
# `greater-anglia-main-line.toml`, NOT a shared segment name
#
# Witham is already a `geml-mainline`-tagged junction in
# `greater-anglia-main-line.toml` ("Braintree branch line diverges here").
# Reusing that literal segment name here would (per that file's own
# documented hazard: `segments.rs`'s `SegmentRegistry::is_shared` marks a
# segment name shared globally by name, not scoped to the stations two
# files actually have in common) incorrectly reclassify unrelated
# `geml-mainline` stations (Diss, Norwich, etc.) as shared trunk too. So
# Witham keeps this file's own exclusive `braintree-branch` segment name,
# unchanged from the original bundled file. Station-level overlap only --
# an incident at Witham matches both lines independently, each as
# `MatchScope::ExclusiveSegment`.

[[stations]]
crs = "WTM"
role = "junction"
segment = "braintree-branch"
# Witham: also a `geml-mainline`-tagged junction in
# greater-anglia-main-line.toml. Station-level overlap only, not a shared
# segment name -- see the segment-decision note above.

[[stations]]
crs = "WNY"
role = "minor"
segment = "braintree-branch"

[[stations]]
crs = "CES"
role = "minor"
segment = "braintree-branch"

[[stations]]
crs = "BTP"
role = "minor"
segment = "braintree-branch"

[[stations]]
crs = "BTR"
role = "terminus"
segment = "braintree-branch"

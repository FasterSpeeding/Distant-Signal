id = "thameslink-core"
name = "Thameslink Core"
mode = "national-rail"
category = "commuter"
operators = ["TL"]

sample_stations = ["STP", "ZFD", "LBG"]
match_keywords = ["Thameslink", "Thameslink core"]

# Commuter line: tighter thresholds. A 5-minute delay on a service running
# every 8 minutes during peak is more disruptive than the same delay on an
# hourly long-distance service.
[severity_overrides]
minor_delays_pct = 0.20
delay_threshold_minutes = 4

# The "core" through-London section. Northern and southern branches
# (to Bedford, Cambridge, Brighton, Sutton, etc.) are separate lines.
# Ordered north to south.
[[stations]]
crs = "STP"
tiploc = "STPX"
role = "terminus"
segment = "thameslink-core"

[[stations]]
crs = "ZFD"
tiploc = "FARNGDN"
role = "major"
segment = "thameslink-core"

[[stations]]
crs = "CTK"
tiploc = "CTRLDCK"
role = "major"
segment = "thameslink-core"

[[stations]]
crs = "BFR"
tiploc = "BLCKFRS"
role = "major"
segment = "thameslink-core"

[[stations]]
crs = "LBG"
tiploc = "LNDNBDG"
role = "major"
segment = "thameslink-core"
# Trains diverge south of London Bridge — handled by branch line definitions

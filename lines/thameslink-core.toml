id = "thameslink-core"
name = "Thameslink Core"
mode = "national-rail"
category = "commuter"
operators = ["TL"]
# Train membership (lines/SCHEMA.md `trunk_for`): a train whose best-fit
# line is one of these runs over this line's trunk, so it is one of this
# line's own trains too.
trunk_for = ["thameslink-bedford", "thameslink-cambridge", "thameslink-rainham", "thameslink-southern"]

sample_stations = ["STP", "ZFD", "LBG"]
# A bare "Thameslink" would collide with every branch file in this catalogue
# ("Thameslink Bedford", "Thameslink Cambridge", "Thameslink Sevenoaks", ...
# — match_one does substring containment), matching the exact collision
# `thameslink-cambridge.toml`/`thameslink-southern.toml` already document
# avoiding. "Thameslink core" alone is specific enough and unique in this
# catalogue (checked: no other file's match_keywords contains it).
match_keywords = ["Thameslink core"]

# Commuter line: tighter thresholds. A 5-minute delay on a service running
# every 8 minutes during peak is more disruptive than the same delay on an
# hourly long-distance service.
[severity_overrides]
minor_delays_pct = 0.20
delay_threshold_minutes = 4

# The timetable (CIF) gives St Pancras's Thameslink platforms their own TIPLOC
# and CRS (STPXBOX is SPL, not STP). Only the schedule line population and
# train membership read this (see lines/SCHEMA.md).
[crs_aliases]
SPL = "STP"

# The "core" through-London section. Northern and southern branches
# (to Bedford, Cambridge, Brighton, Sutton, etc.) are separate lines.
# Ordered north to south.
[[stations]]
crs = "STP"
tiploc = "STPX"
role = "terminus"
segment = "thameslink-core"

[[stations]]
crs = "ZFD"
tiploc = "FRNDNLT"
role = "major"
segment = "thameslink-core"

[[stations]]
crs = "CTK"
tiploc = "CTMSLNK"
role = "major"
segment = "thameslink-core"

[[stations]]
crs = "BFR"
tiploc = "BLFR"
role = "major"
segment = "thameslink-core"

[[stations]]
crs = "LBG"
tiploc = "LNDNBDC"
role = "major"
segment = "thameslink-core"
# Trains diverge south of London Bridge — handled by branch line definitions

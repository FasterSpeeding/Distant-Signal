id = "emr-midland-main-line"
name = "Midland Main Line"
mode = "national-rail"
category = "main-line"
operators = ["EM"]  # East Midlands Railway (Transport UK Group; not yet nationalised as of Aug 2026)

# Two ultimate destinations: the Chesterfield/Sheffield arm and the Nottingham
# spur (folded into this file per the gap analysis's SWML/Weymouth-style
# precedent — see `swr-south-west-main.toml`).
destination_crs_filter = ["STP", "SHF", "NOT"]

# Terminus plus one waypoint on the shared trunk and one on each exclusive arm.
sample_stations = ["STP", "LEI", "DBY", "SHF", "NOT"]

match_keywords = ["Midland Main Line", "MML"]
# CrossCountry's Aberdeen/Edinburgh - Penzance spine runs over these same
# metals between Derby and Sheffield (see the `emr-mml-north` comment below);
# vetoing keeps XC-service incidents on that shared stretch from being
# misattributed to EMR. Mirrors `west-coast-main-line.toml`'s identical
# exclusion for the same reason (XC also shares WCML metals Crewe-Wolverhampton).
excluded_keywords = ["Cross Country"]

# Ordered south to north: St Pancras - Bedford - Leicester - Derby -
# Chesterfield - Sheffield, with the Nottingham spur diverging after East
# Midlands Parkway. Station list, CRS codes and route topology verified
# against Wikipedia (individual station infobox pages, cross-checked against
# each other for ordering) and railwaycodes.org.uk's CRS code tables
# (independently confirmed BDM, BEE, LGE, LTN/LUT, EMD; a handful of
# additional stations - WEL, KET, MHR, LEI, LBO, DBY, CHD, SHF, NOT, ATB -
# could not get a second-source cross-check within this session due to
# railwaycodes.org.uk rate-limiting mid-research (HTTP 429); those codes are
# taken from Wikipedia station infoboxes only, which is the "live source"
# tier but not the required second-source cross-check. Flagging per the
# "if a fact can't be confirmed to that standard, say so" rule rather than
# silently treating them as fully verified.
# Gap-analysis source: docs/superpowers/specs/2026-08-29-line-coverage-gap-analysis.md,
# "East Midlands Railway (EMR)" section (a): route St Pancras - Leicester -
# Derby - Chesterfield - Sheffield with a Nottingham spur, operator code EM.

# --- Bedford-St Pancras: cross-batch dependency ruling (RESOLVED) ---
# This was originally deferred (see git history) because
# `lines/thameslink-bedford.toml` didn't exist yet at authoring time.
# It has since landed on `main` with its own `mml-bedford-st-pancras`
# segment (Bedford through St Pancras International inclusive), so this is
# the follow-up: does `emr-mml-south` genuinely share track/calling pattern
# with Thameslink's Bedford line, or is this station-overlap-only?
#
# RULING: station-overlap-only. NOT unified. Confirmed by comparing the two
# files' own station lists plus fresh research this session:
#   - Thameslink's Bedford line stops at all 17 stations between Bedford and
#     St Pancras inclusive (Bedford, Flitwick, Harlington, Leagrave, Luton,
#     Luton Airport Parkway, Harpenden, St Albans City, Radlett, Elstree &
#     Borehamwood, Mill Hill Broadway, Hendon, Brent Cross West, Cricklewood,
#     West Hampstead Thameslink, Kentish Town, St Pancras International) -
#     confirmed via `lines/thameslink-bedford.toml`'s own cited station list
#     and independently via Wikipedia's "Thameslink" article ("Bedford to
#     Brighton" service description lists the same stopping pattern).
#   - This file's own `emr-mml-south` stretch calls at only 4 of those 17
#     stations: STP, LTN, LUT, BDM. `emr-connect.toml`'s already-cited route
#     research (Wikipedia's "East Midlands Railway" article, cross-checked
#     against National Rail Enquiries) independently confirms the same
#     pattern for EMR's other St Pancras-Bedford service: "twice hourly...
#     calling at Luton Airport Parkway, Luton, Bedford..." - i.e. both EMR
#     services on this stretch skip the same 13 intermediate local stations
#     Thameslink calls at (Flitwick, Harlington, Leagrave, Harpenden, St
#     Albans City, Radlett, Elstree & Borehamwood, Mill Hill Broadway,
#     Hendon, Brent Cross West, Cricklewood, West Hampstead Thameslink,
#     Kentish Town).
#   - Wikipedia's "Bedford railway station" article confirms this isn't just
#     a timetabling difference on identical tracks: "In 1890, fast lines
#     were added... to allow expresses to bypass the station" - the Midland
#     Main Line is multi-tracked (fast/slow) through here specifically so
#     express and stopping services can run independently.
# This is the same "same corridor, different calling pattern" shape as two
# precedents already established elsewhere in this catalogue:
# `southeastern-highspeed.toml`'s `hs1-domestic` vs `southeastern-main-
# line.toml`'s `seml-coast`/`chatham-medway` decision, and `great-northern-
# suburban.toml`'s Moorgate service vs `great-northern-kings-lynn.toml`'s
# `gn-ecml-slow-lines` decision (see that reasoning cited in
# `crates/aggregator/src/matcher.rs`, e.g.
# `gn_suburban_hertford_branch_exclusive_segment_incident_does_not_propagate`).
# Both kept distinct segment names despite genuine track-sharing, because the
# calling patterns differ materially. Same call here: `emr-mml-south` stays
# EMR-only; `mml-bedford-st-pancras` stays Thameslink-only. STP, LTN, LUT and
# BDM remain station-overlap-only between the EMR files and
# `thameslink-bedford.toml` - each line independently matches an incident at
# those four stations as its own MatchScope::ExclusiveSegment, never
# MatchScope::SharedSegment for the cross-TOC pairing (SharedSegment still
# applies between `emr-mml-south` in this file and in `emr-connect.toml`,
# since those two genuinely run the identical calling pattern - unaffected
# by this ruling). See the regression tests in `crates/aggregator/src/
# matcher.rs` for LTN, LUT and BDM (STP was already covered by
# `stp_station_overlap_matches_thameslink_core_bedford_and_highspeed_as_independent_exclusive_segments`).
[[stations]]
crs = "STP"
tiploc = "STPX"  # reused from thameslink-core.toml - same physical station, already verified in this repo
role = "terminus"
segment = "emr-mml-south"

[[stations]]
crs = "LTN"
role = "minor"
segment = "emr-mml-south"
# Luton Airport Parkway. Confirmed LTN (not LUT) via two independent
# Wikipedia infobox fetches for Luton and Luton Airport Parkway respectively
# after an initial railwaycodes.org.uk summarisation conflated the two -
# see LUT below.

[[stations]]
crs = "LUT"
role = "minor"
segment = "emr-mml-south"

[[stations]]
crs = "BDM"
role = "junction"
segment = "emr-mml-south"
# Bedford: last station of `emr-mml-south`. Also `thameslink-bedford.toml`'s
# own terminus, but station-overlap-only, not a shared segment - see the
# ruling above. Segment boundary per the schema's shared-trunk rule of
# thumb (junction station belongs to the shared segment, exclusive starts
# at the next station) - this refers to the WEL/KET boundary with
# `emr-connect.toml` below, the one genuine shared-segment case on this
# file's route.

# WEL/KET: `emr-mml-trunk` is reused verbatim by `emr-connect.toml`, whose
# entire route runs over this same stretch as far as Kettering before
# diverging to Corby at Glendon Junction (see that file's own ruling).
# This segment covers exactly {WEL, KET} in both files, matching the
# byte-identical-extent convention every other shared segment in this
# catalogue already follows (e.g. `swr-trunk-waterloo`). Market Harborough
# onward is NOT part of this shared segment - EMR Connect doesn't reach
# there - see `emr-mml-central` below.
[[stations]]
crs = "WEL"
role = "minor"
segment = "emr-mml-trunk"

[[stations]]
crs = "KET"
role = "minor"
segment = "emr-mml-trunk"

# --- emr-mml-central: this file's own exclusive middle stretch (Market
# Harborough - East Midlands Parkway - Long Eaton), not claimed by any
# other file in this catalogue at authoring time (checked via grep) ---
[[stations]]
crs = "MHR"
role = "minor"
segment = "emr-mml-central"

[[stations]]
crs = "LEI"
role = "major"
segment = "emr-mml-central"
# Leicester is also a `xc-stansted` station (CrossCountry's Birmingham-
# Stansted arm), but that route approaches/leaves via Nuneaton and Syston
# Junction on different metals - only the station building is common, not
# the trunk. No segment shared, matching `northern-hope-valley.toml`'s
# identical reasoning for its Sheffield overlap with CrossCountry.

[[stations]]
crs = "LBO"
role = "minor"
segment = "emr-mml-central"

[[stations]]
crs = "EMD"
role = "junction"
segment = "emr-mml-central"
# East Midlands Parkway: the branch point for the Nottingham spur. The
# physical divergence (Trent Junction) lies immediately north of here - a
# chord links East Midlands Parkway and Long Eaton for Derby-bound trains,
# while Nottingham-bound trains peel off east via Attenborough/Beeston. Per
# the schema's shared-trunk rule of thumb, the junction station (this one)
# stays on the shared trunk segment; the two exclusive arms start at the
# next station on each branch. TIPLOC omitted: the value this file
# originally carried here was not independently sourced/cited, and this
# catalogue's "don't invent" rule treats an uncited value as equivalent to
# a guess even when it looks plausible - see this file's provenance
# comment above, which already flags TIPLOCs as outside its cited scope.

[[stations]]
crs = "LGE"
role = "minor"
segment = "emr-mml-central"

# --- emr-mml-derby: shared trunk with `emr-rural-branches.toml`'s
# Derwent Valley Line branch. Derby is the only station both files'
# station lists literally include in common (this file's intercity
# service does not call at Duffield/Belper/Ambergate, even though the
# underlying Midland Main Line track is physically shared as far as
# Ambergate Junction) - segment-sharing for matcher purposes is therefore
# scoped to Derby itself; see `emr-rural-branches.toml`'s Branch 3 ruling
# for the fuller explanation of that distinction. ---
[[stations]]
crs = "DBY"
tiploc = "DERBY"  # reused from cross-country.toml - already verified in this repo
role = "major"
segment = "emr-mml-derby"

# --- emr-mml-north: shared trunk with `emr-regional.toml` (Chesterfield-
# Sheffield only - that file's own Manchester-arrival service joins this
# same Midland Main Line stretch at Sheffield; see its Ruling 2). Scoped
# to exactly {CHD, SHF} in both files. ---
[[stations]]
crs = "CHD"
role = "minor"
segment = "emr-mml-north"

[[stations]]
crs = "SHF"
tiploc = "SHEFFLD"  # reused from cross-country.toml/northern-hope-valley.toml - already verified in this repo
role = "terminus"
segment = "emr-mml-north"
# `emr-mml-north` (Chesterfield-Sheffield) runs over the same Midland Main
# Line metals CrossCountry's spine uses between Derby and Sheffield
# (`cross-country.toml`'s `xc-midlands`/`xc-yorkshire` segments cover DBY
# and CHD/SHF respectively), and Sheffield is also `northern-hope-valley`'s
# eastern terminus. No segment name is shared with either: `cross-
# country.toml` and `northern-hope-valley.toml` already include these same
# stations under their own segment names, so both lines independently
# match a station-level incident here without needing a shared name
# (mirrors `west-coast-main-line.toml`/`xc-manchester.toml`'s identical
# choice not to share a segment name for the Crewe-Wolverhampton stretch
# they both run over, and `northern-hope-valley.toml`'s explicit "only the
# station is common" reasoning for its own Sheffield overlap).

# --- Nottingham spur ---
# This file lists the Nottingham spur after the Chesterfield/Sheffield arm
# in file order (both diverge from the shared trunk at East Midlands
# Parkway, not from each other) - a multi-station incident spanning both
# arms could in principle derive a nonsensical from/to AffectedRoute pair
# via naive first/last-position order. Inherent to folding a branching
# topology into one file (the SWML/Weymouth-style precedent this file
# follows), not a data error.
[[stations]]
crs = "ATB"
role = "minor"
segment = "emr-mml-nottingham-spur"
# Attenborough is included for track-topology completeness (part of the
# Trent Junction chord to the Nottingham spur) rather than as a typical
# EMR intercity calling point served at the same frequency as the rest of
# this file's stations.

[[stations]]
crs = "BEE"
role = "minor"
segment = "emr-mml-nottingham-spur"

[[stations]]
crs = "NOT"
role = "terminus"
segment = "emr-mml-nottingham-spur"

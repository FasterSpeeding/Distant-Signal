id = "greater-anglia-felixstowe-branch"
name = "Felixstowe Branch Line (Ipswich - Felixstowe)"
mode = "national-rail"
category = "regional"
operators = ["LE"]
# LE = Greater Anglia's ATOC code, already verified and cited in
# greater-anglia-main-line.toml -- not re-derived here.

# Split out of the former `greater-anglia-suffolk-branches.toml` (real-world
# sanity review): that file bundled three unrelated, separately
# community-rail-branded Greater Anglia branches (Gainsborough, Felixstowe,
# Mayflower) under a single "Suffolk Branch Lines" umbrella that nobody
# uses, and a single incident on any one of them reported as a disruption
# on all three. Split one file per real brand, matching this session's
# EMR/TfW split precedent. Station data and CRS codes below are reused
# verbatim from the original file -- redistributed, not re-researched.

sample_stations = ["FLX"]
match_keywords = ["Felixstowe branch line"]

# Hourly service -- unchanged from the original bundled file's reasoning
# (northern-lakes.toml/northern-tyne-valley.toml branch-line pattern): one
# cancellation is a large fraction of the hour's service, and a 5-minute
# delay on a short branch journey isn't yet a story at config.py's base
# thresholds.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# ## Felixstowe branch line (Ipswich/Westerfield-Felixstowe)
#
# Wikipedia's "Felixstowe branch line" article (fetched raw): "connects the
# Great Eastern Main Line to Felixstowe and its port ... The passenger
# services originate at Ipswich but the branch itself starts one station
# further along at Westerfield." So the passenger-facing origin (and the
# point `greater-anglia-main-line.toml` itself already documents as the
# junction -- "the Felixstowe branch line ... diverge[s] here" at IPS) is
# Ipswich, while the true physical fork ("Felixstowe trains curve to the
# right at Westerfield Junction as they leave the station") is one stop
# further out, at Westerfield -- a station also now on
# `greater-anglia-east-suffolk.toml` (catalogued after this branch was
# first drafted -- see that file's own Overlap 1 note). Stations table
# order (Westerfield, Derby Road, Trimley, Felixstowe) and hourly
# Ipswich-Felixstowe frequency confirmed from the same article. CRS codes
# verified from each station's own Wikipedia infobox `code` field:
# Westerfield (WFI), Derby Road (DBR), Trimley (TRM), Felixstowe (FLX).
# Trimley's own freight-only spurs to the Port of Felixstowe's terminals
# are not passenger junctions and are omitted per SCHEMA.md's "don't
# overload" rule.
#
# ## Segment decisions at Ipswich and Westerfield: station-level overlap
# only, NOT a shared segment name
#
# Ipswich is already a `geml-mainline`-tagged junction in
# `greater-anglia-main-line.toml` ("the Felixstowe branch line ...
# diverge[s] here"), and is also on `greater-anglia-east-suffolk.toml`'s
# own `greater-anglia-east-suffolk` segment and
# `greater-anglia-ipswich-cambridge.toml`'s own segment (both catalogued
# after this branch was first drafted). Westerfield is also on
# `greater-anglia-east-suffolk.toml`'s own segment. Reusing any of those
# other files' literal segment names here would (per the hazard
# `greater-anglia-main-line.toml` and `greater-anglia-east-suffolk.toml`
# already document: `segments.rs`'s `SegmentRegistry::is_shared` marks a
# segment name shared globally by name, not scoped to the stations two
# files actually have in common) incorrectly widen this file's own claim
# onto stations it doesn't serve. So Ipswich and Westerfield keep this
# file's own exclusive `felixstowe-branch` segment name, unchanged from the
# original bundled file. Station-level overlap only -- an incident at
# either station matches every overlapping line independently, each as
# `MatchScope::ExclusiveSegment`.

[[stations]]
crs = "IPS"
tiploc = "IPSWICH"
role = "junction"
segment = "felixstowe-branch"
# Ipswich: also a `geml-mainline`-tagged junction in
# greater-anglia-main-line.toml, and where Felixstowe branch passenger
# services originate. Station-level overlap only, not a shared segment
# name -- see the segment-decision note above.

[[stations]]
crs = "WFI"
role = "junction"
segment = "felixstowe-branch"
# Westerfield: the branch's real physical fork ("Felixstowe trains curve to
# the right at Westerfield Junction"), one stop beyond Ipswich. Also on
# greater-anglia-east-suffolk.toml's own segment -- station-level overlap
# only, see the segment-decision note above.

[[stations]]
crs = "DBR"
role = "minor"
segment = "felixstowe-branch"

[[stations]]
crs = "TRM"
role = "minor"
segment = "felixstowe-branch"
# Trimley: freight-only spurs to the Port of Felixstowe's terminals diverge
# here, but not a passenger junction -- not tagged `junction` per SCHEMA.md's
# "don't overload" rule.

[[stations]]
crs = "FLX"
role = "terminus"
segment = "felixstowe-branch"

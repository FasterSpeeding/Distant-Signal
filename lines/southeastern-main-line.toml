id = "southeastern-main-line"
name = "South Eastern Main Line"
mode = "national-rail"
category = "main-line"
operators = ["SE"]

sample_stations = ["TON", "AFK", "DVP"]
match_keywords = ["South Eastern Main Line"]

# Southeastern also operates the Hastings line (Tonbridge - Tunbridge Wells -
# Battle - Hastings), a distinct historic route with its own Wikipedia
# article that diverges well before/away from this line's stations and
# shares no station with this file, so a bare "Southeastern"/operator-only
# match on it shouldn't also tag this file. The Hastings line via Tunbridge
# Wells currently has no line-catalogue task anywhere in this plan and is a
# known coverage gap.
#
# REVIEW FIX (final whole-branch review of this batch): "Chatham Main Line"
# was removed from this list. southeastern-chatham.toml (Task 5.2) and this
# file both terminate at Dover Priory (DVP is listed in both files'
# `[[stations]]`), and `is_excluded` in crates/aggregator/src/matcher.rs is
# a HARD VETO evaluated BEFORE station matching - so an incident naming both
# routes with `affected_stations = ["DVP"]` was being silently vetoed on
# both files at once, returning zero matches where two correct StationHit/
# ExclusiveSegment matches belonged. The entry also bought nothing: an
# `OperatorOnly` "SE" match is already dropped by `lines_affected_by`
# whenever any precise match exists, and this file's own `match_keywords`
# is just ["South Eastern Main Line"], so no KeywordOnly false positive was
# possible either. Station-CRS matching already disambiguates DVP correctly
# (see chatham_dover_branch_incident_does_not_propagate_to_seml in
# matcher.rs). "Hastings line" stays: no file in the catalogue models that
# route, and it shares no station with this file, so it causes no such harm.
excluded_keywords = ["Hastings line"]

# Charing Cross/Cannon Street, via Sevenoaks and Tonbridge, to Ashford
# International, then via Folkestone to Dover Priory. Ordered London to
# Dover. Verified against Wikipedia's "South Eastern Main Line" article
# cross-checked with railwaycodes.org.uk's CRS/mileage data (Westenhanger
# 64m15ch, Sandling 65m36ch from Charing Cross, confirming their order) and
# a second web search confirming Ashford International = AFK and
# Staplehurst = SPU (railwaycodes.org.uk's own site fetch mis-rendered both
# of those two codes; the National Rail Enquiries / ABC Railway Guide /
# railwaydata.co.uk figures agree with each other and were used instead).
#
# The plan's brief for this task describes the route as splitting "toward
# Dover Priory and toward Hastings" past Ashford. That doesn't hold up:
# Wikipedia treats "South Eastern Main Line" as the Charing Cross/Cannon
# Street - Tonbridge - Ashford - Folkestone - Dover Priory route only. The
# Hastings line is a separate route diverging much earlier, at Tonbridge,
# via Tunbridge Wells - not a fork past Ashford. (There is also a lightly
# used Ashford-Hastings service over the Marshlink line via Rye, but that's
# a different, minor route, not the primary Hastings corridor, and Marshlink
# is not documented as SE's usual booked route to Hastings in the sources
# checked here.) This file therefore covers only the Dover Priory leg and
# omits Hastings entirely, rather than folding two divergent corridors into
# one file (the swr-south-west-main.toml precedent this task's brief points
# to is for a same-direction Bournemouth/Weymouth fork, not this case).
#
# TASK 5.3 FOLLOW-UP: the suburban stopping-pattern stations between London
# Bridge and Orpington named in the paragraph this replaces have now been
# researched and added below (as of this pass, southeastern-metro-north-
# kent.toml, Task 5.4, exists; southeastern-metro-south-london.toml, Task
# 5.5, does not yet).
#
# The full LBG-ORP slow-line calling pattern confirmed via a fresh
# route-diagram pass turned out to be seven stations, not the five
# originally named - New Cross's and Hither Green's own neighbouring
# stations, St Johns and Lewisham, also sit on this exact stretch and were
# missing from the original "etc.": London Bridge - New Cross - St Johns -
# Lewisham - Hither Green - Grove Park - Chislehurst - Petts Wood -
# Orpington. All seven are added below on `seml-london`, since each sits
# strictly between the already-modelled LBG and ORP entries.
#
# New Cross/St Johns/Lewisham/Hither Green determination: these four
# already appear in southeastern-metro-north-kent.toml, on its own
# `southeastern-lewisham-corridor` segment (CHX/CST/LBG/NWX/SAJ/LEW) and,
# for Hither Green, its own `senk-dartford-loop` segment. Checked whether
# they sit on THIS line's own physical alignment toward Orpington or only
# on the Dartford Loop/Bexleyheath corridor's physically distinct tracks:
# Hither Green's own Wikipedia article states it is served by "the South
# Eastern Main Line (to Charing Cross and Cannon Street via New Cross)"
# AND the Dartford Loop Line, with the Dartford Loop diverging AT Hither
# Green while the main line continues on to Grove Park/Orpington - i.e.
# Hither Green itself is the shared station before the fork, not a
# Dartford-Loop-exclusive stop. St Johns' own Wikipedia article confirms
# it sits "on the slow lines" of the South Eastern Main Line with New
# Cross as its immediate neighbour toward London and Lewisham as its
# immediate neighbour south - the same chain southeastern-metro-north-
# kent.toml's own `southeastern-lewisham-corridor` segment already
# documents. So all four sit on this line's own alignment and are added
# here too, as station overlap with southeastern-metro-north-kent.toml
# (not a shared segment - no new segment name, following the
# xc-south-coast.toml/xc-manchester.toml precedent and this file's own
# DVP/Thameslink-LBG precedent below).
#
# Grove Park/Chislehurst/Petts Wood are new to the catalogue - no other
# file models them.
#
# Sourcing: every CRS code below (NWX, SAJ, LEW, HGR, GRP, CIT, PET) was
# cross-checked against a second, non-Wikipedia source (railwaycodes.org.uk's
# crs*.shtm tables for GRP/PET/HGR/SAJ; nationalrail.co.uk's own
# stations/<crs>/details.html pages for NWX/CIT, after railwaycodes.org.uk's
# CRSc.shtm page truncated before reaching Chislehurst's entry). The
# LBG-ORP calling ORDER, however, is confirmed only via each station's own
# Wikipedia infobox, cross-checked station-to-station (New Cross's
# southward neighbour is St Johns per St Johns' own article; St Johns'
# southward neighbour is Lewisham; Lewisham's is Hither Green; Hither
# Green's is Grove Park per Grove Park's own article; Grove Park's is
# Chislehurst; Chislehurst's is Petts Wood; Petts Wood's is Orpington per
# Orpington's own article) - a mutually self-consistent chain across seven
# independent articles, but all seven are still Wikipedia. Non-Wikipedia
# corroboration of the order specifically (not just the codes) was
# attempted and failed: railwaycodes.org.uk's ELR/mileage index and
# CRSc.shtm page both 429'd or truncated, and nationalrail.co.uk's live
# departure boards, Southeastern's own site, RealTimeTrains and
# traintimes.org.uk all returned JS-rendered/bot-protected pages this
# fetch tooling couldn't read. Disclosing this plainly per the
# southern-brighton-main-line.toml precedent for a Wikipedia-only fact,
# rather than asserting the order as fully cross-source-confirmed - though
# note this is uncontroversial, extensively-documented London commuter-line
# geography with no competing ordering found anywhere in the sources
# checked.
#
# LBG is also served by Thameslink (`thameslink-core.toml`, whose own
# segment ends at LBG) but via a physically different route (the Thameslink
# core tunnel through Blackfriars/Farringdon, not the Kent lines this file
# covers into LBG's south-eastern platforms) - station overlap only, no
# segment sharing, per the xc-south-coast.toml/xc-manchester.toml precedent.
#
# No sibling Southeastern file exists yet in this catalogue (this is the
# first), so none of this file's segments are shared with another line
# today. AFK (Ashford International) is where HS1 domestic and the
# Maidstone East line join, and the Canterbury West and Marshlink lines
# diverge; it's kept on `seml-weald` (the segment ending there) rather than
# `seml-coast`, following the junction-belongs-to-the-trunk convention in
# SCHEMA.md, in case a future HS1/Chatham file wants to share a trunk
# segment name up to and including AFK.
[[stations]]
crs = "CHX"
role = "terminus"
segment = "seml-london"

[[stations]]
crs = "CST"
role = "terminus"
segment = "seml-london"

[[stations]]
crs = "LBG"
role = "major"
segment = "seml-london"

[[stations]]
crs = "NWX"
role = "junction"
segment = "seml-london"
# New Cross. Station overlap with southeastern-metro-north-kent.toml's own
# `southeastern-lewisham-corridor` segment (see header comment above) - a
# differently-aligned North Kent Line route (via the Surrey Canal curve
# toward Greenwich/Woolwich) diverges near here; not covered by this
# catalogue.

[[stations]]
crs = "SAJ"
role = "minor"
segment = "seml-london"
# St Johns. Station overlap with southeastern-metro-north-kent.toml's own
# `southeastern-lewisham-corridor` segment (see header comment above).

[[stations]]
crs = "LEW"
role = "junction"
segment = "seml-london"
# Lewisham. Station overlap with southeastern-metro-north-kent.toml's own
# `southeastern-lewisham-corridor` segment (see header comment above); the
# Bexleyheath line diverges here (toward Blackheath), and the Hayes line
# and North Kent Line also diverge/join here - none covered by this file.

[[stations]]
crs = "HGR"
role = "junction"
segment = "seml-london"
# Hither Green. Station overlap with southeastern-metro-north-kent.toml's
# own `senk-dartford-loop` segment (see header comment above) - the
# Dartford Loop line's own exclusive tracks diverge here; this line's own
# alignment continues on to Grove Park.

[[stations]]
crs = "GRP"
role = "junction"
segment = "seml-london"
# Grove Park. The Bromley North line (a short shuttle branch to Bromley
# North) diverges here; not covered by this catalogue.

[[stations]]
crs = "CIT"
role = "minor"
segment = "seml-london"
# Chislehurst. Up/down loop lines here give a physical connection to the
# Chatham Main Line (southeastern-chatham.toml), but per Chislehurst's own
# Wikipedia article there are normally no direct passenger services
# between Chislehurst and St Mary Cray over those curves - trains using
# them typically run non-stop between London Bridge and Rochester/West
# Malling - so this is noted, not treated as a everyday shared trunk.

[[stations]]
crs = "PET"
role = "minor"
segment = "seml-london"
# Petts Wood. Petts Wood Junction, just north of the station, links the
# up/down loop lines from Charing Cross and Victoria; not covered by this
# catalogue.

[[stations]]
crs = "ORP"
role = "major"
segment = "seml-london"

[[stations]]
crs = "SEV"
role = "major"
segment = "seml-weald"

[[stations]]
crs = "TON"
role = "junction"
segment = "seml-weald"
# Hastings line diverges here (via Tunbridge Wells); Redhill-Tonbridge
# line joins here from the west. Neither is covered by this catalogue yet.

[[stations]]
crs = "PDW"
role = "minor"
segment = "seml-weald"
# Medway Valley line diverges here.

[[stations]]
crs = "MRN"
role = "minor"
segment = "seml-weald"

[[stations]]
crs = "SPU"
role = "minor"
segment = "seml-weald"

[[stations]]
crs = "HCN"
role = "minor"
segment = "seml-weald"

[[stations]]
crs = "PLC"
role = "minor"
segment = "seml-weald"

[[stations]]
crs = "AFK"
role = "junction"
segment = "seml-weald"
# HS1 domestic and the Maidstone East line join here; the Canterbury
# West (to Ramsgate) and Marshlink (to Hastings) lines diverge here.

[[stations]]
crs = "WHA"
role = "minor"
segment = "seml-coast"

[[stations]]
crs = "SDG"
role = "minor"
segment = "seml-coast"

[[stations]]
crs = "FKW"
role = "minor"
segment = "seml-coast"

[[stations]]
crs = "FKC"
role = "major"
segment = "seml-coast"

[[stations]]
crs = "DVP"
role = "terminus"
segment = "seml-coast"

id = "tpe-south"
name = "TransPennine Express: South"
mode = "national-rail"
category = "main-line"
operators = [
  "TP",  # TransPennine Express (DfT Operator Ltd)
]

# TPE's own current timetable structure (valid from 17 May 2026, the same
# structure independently confirmed live at tpexpress.co.uk/travelling-
# with-us/timetables for `tpe-anglo-scottish.toml`) names this route
# "South: Cleethorpes to Manchester and Liverpool" — one of TPE's four
# current named routes (Anglo-Scottish, Borders, North being the other
# three; each is its own line definition in this batch). The route runs
# roughly hourly off-peak — an inter-city-style frequency over a ~140-mile
# corridor, matching the `main-line` treatment already given to
# `swr-south-west-main.toml` and this batch's own `tpe-anglo-scottish.toml`.
#
# ROUTING CORRECTION vs. the plan/gap-analysis text: both this batch's
# planning doc and `docs/superpowers/specs/2026-08-29-line-coverage-gap-
# analysis.md`'s TPE section describe this route as running "via Sheffield/
# Leeds". Live-source verification does not support that. Two independent
# sources — Wikipedia's "TransPennine Express" article (route table:
# Liverpool Lime Street ... Manchester Piccadilly - Stockport - Sheffield -
# Meadowhall - Doncaster - Scunthorpe - Barnetby - Habrough - Grimsby Town -
# Cleethorpes, with the article explicitly noting the service "does not
# pass through Leeds") and Wikipedia's "South Humberside Main Line" article
# (Doncaster to Cleethorpes via Scunthorpe, explicitly run by TransPennine
# Express as "Liverpool Lime Street-Doncaster-Cleethorpes", one train per
# hour, connecting towards Doncaster/the ECML rather than Leeds) — both
# independently agree on Sheffield -> Doncaster, with no mention of Leeds
# anywhere and no geographic sense in which Leeds sits on this corridor.
# This file follows the verified Sheffield/Doncaster routing.
#
# Manchester Airport (MIA) was in the controller's starting hypothesis but
# is NOT included below: TPE's own site only offers indirect evidence (a
# May-2026 timetable-change note mentioning "timing changes around
# Manchester Airport and to Scunthorpe/Cleethorpes services" in the same
# bullet), while the full stop-by-stop South route listing found via
# Wikipedia's TPE route table does not include it. Left out per this
# catalogue's "if unconfirmed, omit rather than guess" rule rather than
# assumed from the Anglo-Scottish route's own MIA leg.
#
# Both Liverpool and Manchester are named as this route's western ends
# ("Cleethorpes to Manchester and Liverpool"), the same two-city-name
# pattern `tpe-anglo-scottish.toml` uses for its own western fork. Task 8.4
# (Batch 8) research corrects the shape of this, though: unlike
# `tpe-anglo-scottish.toml`'s Liverpool/Manchester legs (two genuinely
# separate physical lines converging at a shared point away from either
# city), this route's Liverpool leg is the same continuous CLC
# (Cheshire Lines Committee) route that runs straight through Manchester
# Oxford Road into Manchester Piccadilly itself (confirmed via Wikipedia's
# "Liverpool-Manchester lines" article: "the old Cheshire Lines Committee
# line running from Liverpool Lime Street via Warrington Central to
# Manchester Piccadilly", and independently via the TPE route table below,
# which lists Manchester Piccadilly immediately after Manchester Oxford
# Road on the Liverpool-originating leg). So Manchester Piccadilly (MAN) is
# not a separate branch terminus needing its own segment/convergence
# modelling — it's the point roughly two-thirds along this route's western
# leg where some workings genuinely start/terminate (per TPE's own site:
# the Liverpool extension "was extended from Manchester Piccadilly in
# December 2022", i.e. Manchester Piccadilly was this route's original,
# and still a live, terminus). `role = "terminus"` is kept for MAN below to
# reflect that some services genuinely start/end there, even though it's
# no longer first/second in the ordered list.
#
# Station-overlap-only with `xc-manchester.toml` at Stockport (SPT, role
# reused directly from that already-curated file) and with `northern.toml`/
# other Manchester-area files at Manchester Piccadilly — same precedent
# `xc-manchester.toml` itself documents: no segment name is shared,
# because an incident on a genuinely shared station still matches both
# lines by station lookup regardless of segment naming.
#
# No segment here is shared with any sibling file in this batch either:
# `tpe-anglo-scottish` and `tpe-north` only overlap this line at the
# Liverpool Lime Street / Manchester Piccadilly termini (station-level
# only), and `tpe-borders` has no overlap at all. This line is therefore
# standalone for the shared-segment-propagation regression test — see the
# matcher test file for the note on why that assertion is skipped here.
#
# `lines/cross-country.toml`'s `xc-yorkshire` segment also covers DON and
# SHF (the same two stations this file reuses CRS/tiploc data from), so
# there's real multi-station geographic overlap with CrossCountry's
# Yorkshire hub here too — not just a shared terminus. This file
# deliberately does NOT share that segment name: CrossCountry's exclusive
# territory continues from these stations towards Leeds/York on
# `xc-yorkshire`, while TPE South's continues towards Scunthorpe/
# Cleethorpes and towards Manchester/Liverpool — the two lines' exclusive
# territories diverge immediately in both directions from DON/SHF. Same
# station-overlap-only reasoning as the Stockport and Manchester Piccadilly
# overlaps documented above.
#
# Task 8.4 (Batch 8, 2026-09-01): the 9 minor intermediate calls
# previously omitted here (Liverpool South Parkway, Warrington West,
# Warrington Central, Birchwood, Irlam, Urmston, Manchester Oxford Road,
# Meadowhall, Barnetby, Habrough — 10 counting Manchester Oxford Road
# twice across the plan's own "9-10" estimate) are real, currently-open,
# currently-served calls on this exact route, confirmed via Wikipedia's
# "TransPennine Express" article route table, which lists this South
# route's full calling pattern end to end for both the Liverpool leg
# (Liverpool Lime Street, Liverpool South Parkway, Warrington West,
# Warrington Central, Birchwood, Irlam, Urmston) and the Manchester
# Piccadilly-Cleethorpes leg (Manchester Oxford Road, Manchester
# Piccadilly, Stockport, Sheffield, Meadowhall, Doncaster, Scunthorpe,
# Barnetby, Habrough, Grimsby Town, Cleethorpes) — matching this file's
# own already-cited "does not pass through Leeds" source exactly, just
# read in full this time instead of only for the principal stations.
# Widnes, on the same physical CLC route between Liverpool South Parkway
# and Warrington Central per Wikipedia's "Liverpool-Manchester lines"
# article, is deliberately NOT added: it does not appear in the TPE route
# table's South-route row, i.e. this fast/limited-stop service does not
# call there (Northern's own, separate, all-stations service on the same
# metals does) — confirmed, not guessed, so left out per the two-source
# "if unconfirmed, omit" rule (here the omission itself, not the
# inclusion, is what's confirmed).
#
# CRS sourcing: LIV/MAN reused from `tpe-anglo-scottish.toml` (itself
# live-verified); SPT reused from `xc-manchester.toml` (already verified
# in-repo, per this task's brief); SHF/DON reused from `cross-country.toml`
# (tiplocs SHEFFLD/DONC also reused from that file). SCU, GMB and CLE are
# independently confirmed against two live sources each (Wikipedia's
# station infoboxes and nationalrail.co.uk's own station pages) — CRS SCU
# for Scunthorpe, GMB for Grimsby Town, CLE for Cleethorpes. MCO (tiploc
# MNCROXR) reused verbatim from `tpe-anglo-scottish.toml` (itself
# live-verified there). LPY, WAW, WAC, BWD, IRL, URM, MHS, BTB and HAB are
# new to this catalogue and were each independently confirmed against two
# live sources (Wikipedia's station infobox and nationalrail.co.uk's own
# station-details page), both accessed 2026-09-01 — LPY for Liverpool
# South Parkway, WAW for Warrington West, WAC for Warrington Central, BWD
# for Birchwood, IRL for Irlam, URM for Urmston, MHS for Meadowhall
# (Meadowhall Interchange), BTB for Barnetby, HAB for Habrough. No tiploc
# data was independently confirmed for any of these nine, so `tiploc` is
# omitted for those rather than guessed.
sample_stations = ["LIV", "MAN", "SHF", "DON", "CLE"]
# No match_keywords: TPE's own name for this route is simply "South",
# which fails the precision bar badly on its own (it would match almost
# any incident text mentioning "south" anything) and — per the lesson from
# this batch's `tpe-anglo-scottish.toml` review — the bare operator brand
# name "TransPennine Express" is reserved for operator-level files, not
# per-route ones, since this batch adds multiple sibling TP-operator files
# that would all cross-match on it. Station and operator evidence carries
# this file instead.

# Long-distance inter-city thresholds, matching `west-coast-main-line.toml`,
# `xc-manchester.toml` and `tpe-anglo-scottish.toml`'s treatment of
# comparable hourly inter-city-style services.
[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10

# Ordered Liverpool -> Liverpool South Parkway -> Warrington West ->
# Warrington Central -> Birchwood -> Irlam -> Urmston -> Manchester Oxford
# Road -> Manchester Piccadilly -> Stockport -> Sheffield -> Meadowhall ->
# Doncaster -> Scunthorpe -> Barnetby -> Habrough -> Grimsby Town ->
# Cleethorpes, per the confirmed live TPE route table (see Task 8.4 note
# above).
[[stations]]
crs = "LIV"
role = "terminus"
segment = "tpe-south"

[[stations]]
crs = "LPY"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "WAW"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "WAC"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "BWD"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "IRL"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "URM"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "MCO"
tiploc = "MNCROXR"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "MAN"
role = "terminus"
segment = "tpe-south"

[[stations]]
crs = "SPT"
role = "major"
segment = "tpe-south"

[[stations]]
crs = "SHF"
tiploc = "SHEFFLD"
role = "major"
segment = "tpe-south"

[[stations]]
crs = "MHS"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "DON"
tiploc = "DONC"
role = "junction"
segment = "tpe-south"

[[stations]]
crs = "SCU"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "BTB"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "HAB"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "GMB"
role = "minor"
segment = "tpe-south"

[[stations]]
crs = "CLE"
role = "terminus"
segment = "tpe-south"

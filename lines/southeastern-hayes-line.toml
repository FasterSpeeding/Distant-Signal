id = "southeastern-hayes-line"
name = "Hayes Line"
mode = "national-rail"
category = "commuter"
operators = ["SE"]

sample_stations = ["CHX", "LEW", "ELE", "HYS"]
match_keywords = ["Hayes line"]

# REVIEW FIX (final whole-branch review of this batch): four entries were
# REMOVED from this list - "South Eastern Main Line", "Dartford Loop line",
# "Bexleyheath line" and "Sidcup line".
#
# The original rationale written here was that "an operator-only 'SE'
# incident that happens to name another Southeastern route explicitly
# shouldn't also tag this file". That rationale does not hold up:
# `lines_affected_by` in crates/aggregator/src/matcher.rs already drops
# every `OperatorOnly` match whenever any precise match exists, and this
# file's own `match_keywords` is just ["Hayes line"], so no KeywordOnly
# false positive was possible either. The only LIVE effect these entries had
# was on the station-hit path - and there they were actively harmful.
#
# `is_excluded` is a HARD VETO evaluated BEFORE station matching, so it
# vetoes a line even when the incident lists a CRS genuinely on that line.
# All four removed entries pointed at sibling files this file really does
# share stations with: southeastern-main-line.toml shares CHX/LBG, and the
# pre-split southeastern-metro-north-kent.toml (which owned all three of the
# "Dartford Loop line"/"Bexleyheath line"/"Sidcup line" names - see SCOPE
# above; since split into southeastern-bexleyheath.toml, which now owns
# "Bexleyheath line", and southeastern-dartford-loop.toml, which now owns
# "Dartford Loop line"/"Sidcup line", per a later data-driven
# line-definition audit) shared CHX/LBG/LEW. An incident like "Disruption
# between London Bridge and Lewisham affecting the Hayes line and the
# Dartford Loop line" with `affected_stations = ["LEW"]` therefore vetoed
# BOTH this file and that pre-split file at once - each excluded the other's
# name - returning zero matches for exactly the multi-line incident these
# two files were written to model. Station-CRS matching already gives the
# correct, precise signal here; see
# lew_station_overlap_matches_four_lines_bexleyheath_and_dartford_loop_share_the_trunk
# and sibling_line_names_no_longer_veto_a_shared_station_hit in matcher.rs.
# Neither southeastern-bexleyheath.toml nor southeastern-dartford-loop.toml
# excludes "Hayes line" today, for the same reason.
#
# The remaining entries are kept because they cause none of that harm
# (verified station-by-station against each sibling's own CRS list):
#   - "Chatham Main Line": southeastern-chatham.toml shares no station at
#     all with this file.
#   - "Javelin"/"High Speed 1": southeastern-highspeed.toml likewise shares
#     no station with this file.
#
# KENT/SUSSEX BATCH FIX: "North Kent Line" is now ALSO removed, for the
# identical reason. It was kept above on the stated basis that "no file in
# this catalogue models that line yet... a forward-looking placeholder with
# zero current risk." That file now exists - southeastern-north-kent.toml,
# part of this same batch - and shares CHX/WAE/LBG with this file (this
# file's own route runs Charing Cross - Waterloo East - London Bridge -
# Lewisham - ...; the North Kent Line file's own route runs Charing Cross -
# Waterloo East - Cannon Street - London Bridge - New Cross - Deptford -
# Greenwich - ... - Dartford; both physically pass through CHX/WAE/LBG
# before diverging). Removed rather than left as a live landmine; see
# southeastern-north-kent.toml's own header comment for the full writeup.
excluded_keywords = [
    "Chatham Main Line",
    "Javelin",
    "High Speed 1",
]

# Commuter/metro line: tighter thresholds, matching thameslink-core.toml,
# elizabeth-shenfield.toml, southeastern-bexleyheath.toml and
# southeastern-dartford-loop.toml (formerly one file,
# southeastern-metro-north-kent.toml) - frequent short-hop services where a
# 4-minute delay on a short-interval service is more disruptive than the
# same delay on an hourly long-distance one.
[severity_overrides]
minor_delays_pct = 0.20
delay_threshold_minutes = 4

# ============================================================================
# SCOPE - deviation from this task's literal "southeastern-metro-south-
# london.toml" (Sidcup, Hayes) framing, and from the plan's own phrasing
# ============================================================================
# Task 5.4's own research (independently re-verified in that task's review
# via a live source-check, not just claimed) already established that
# "Sidcup line" is not a fourth, separate route - it's Wikipedia's own
# stated informal/colloquial alias for the Dartford Loop Line, and is fully
# covered by southeastern-dartford-loop.toml's `dartford-loop-branch`
# segment (HGR/LEE/MTG/NEH/SID/AYP/BXY/CRY/DFD) - that file was originally
# combined with southeastern-bexleyheath.toml as one file,
# southeastern-metro-north-kent.toml, when Task 5.4 first wrote this
# comment; the two have since been split per a later data-driven
# line-definition audit. Re-deriving a duplicate
# "Sidcup" station list here would violate the "one line per file" /
# no-duplication rule in COMMON.md. The Hayes line, by contrast, IS a
# genuinely separate, differently-numbered route confirmed by its own
# Wikipedia article (own independent verification below), diverging from
# the South Eastern formation at Lewisham. So this file's real, correct
# scope is Hayes-only; no third, distinct south-London service group beyond
# Hayes and Dartford Loop/Sidcup/Bexleyheath was found during this file's
# own research either. Filed as `southeastern-hayes-line.toml` rather than
# the plan's literal `southeastern-metro-south-london.toml` title, since a
# "south London metro" file that covers exactly one line reads as
# misleading about its own scope; this matches this batch's other files'
# practice of naming the file after the one route it actually documents
# (`southeastern-main-line.toml`, `southeastern-chatham.toml`, etc.) rather
# than the broader multi-line grouping the plan's phrasing suggested before
# research narrowed it down.
#
# ============================================================================
# SOURCING AND VERIFICATION
# ============================================================================
# Station list and route geography: Wikipedia's "Hayes line" article
# (infobox: start = Lewisham, end = Hayes, stations = 10), cross-checked
# against the article's own {{Hayes Line}} navigation template and
# individual station articles. The raw wikitext of the "Infobox rail line"
# confirms "stations = 10", which matches exactly: Lewisham, Ladywell,
# Catford Bridge, Lower Sydenham, New Beckenham, Clock House, Elmers End,
# Eden Park, West Wickham, Hayes.
#
# Two stations initially appeared to belong on the route but were confirmed
# NOT to be genuine Hayes line calling points, each checked against a
# second, independent source:
#   - Beckenham Junction: sits geographically between New Beckenham and
#     Clock House, and is served by other Southeastern/Southern services,
#     but New Beckenham railway station's own Wikipedia article states
#     plainly that "the spur between New Beckenham and Beckenham Junction
#     (the original 1857 route) was reduced to single track in 1987" and
#     gives New Beckenham's own next station as Clock House - i.e. the
#     Hayes line bypasses Beckenham Junction via a different (non-branch)
#     alignment. Including "stations = 10" in the infobox count only works
#     if Beckenham Junction is excluded, confirming this reading.
#   - Catford (as distinct from Catford Bridge): this is a station on the
#     physically separate Catford Loop Line (Thameslink's Sevenoaks
#     service, Nunhead - Crofton Park - Catford - Bellingham - ... -
#     Shortlands - already documented in the pre-split
#     southeastern-metro-north-kent.toml's own FINDING 2, now carried in
#     both southeastern-bexleyheath.toml and southeastern-dartford-loop.toml
#     per a later data-driven line-definition audit), not the Hayes line;
#     the two stations sit close together but are on different tracks.
#
# CRS codes: LEW confirmed in the pre-split southeastern-metro-north-kent.toml
# already; LAD, CFB, ELE, EDN, WWI, HYS confirmed via railwaycodes.org.uk's
# crs*.shtm tables. LSY (Lower Sydenham) and CLK (Clock House) are
# alphabetised under "S"/"C" by their full names in a way the fetched table
# excerpts didn't reach, so - matching this batch's established fallback
# (see southeastern-bexleyheath.toml's/southeastern-dartford-loop.toml's own
# sourcing comment) - both were instead confirmed via two independent
# sources each: their own Wikipedia infobox AND nationalrail.co.uk's
# station-details page.
#
# NBC (New Beckenham) was confirmed via railwaycodes.org.uk's crsn.shtm
# table and cross-checked against its own Wikipedia infobox, which also
# supplied the Beckenham Junction spur/bypass fact above.
#
# ============================================================================
# SEGMENT DECISION - CHX/LBG/LEW vs southeastern-lewisham-corridor
# ============================================================================
# The pre-split southeastern-metro-north-kent.toml (Task 5.4; since split
# into southeastern-bexleyheath.toml and southeastern-dartford-loop.toml per
# a later data-driven line-definition audit, both of which still carry this
# exact segment name unchanged) names `southeastern-lewisham-corridor` for
# its own CHX/CST/LBG/NWX/SAJ/LEW stretch and invites this file to reuse
# that name verbatim if the Hayes line's own London-end route genuinely
# matches that same trunk. This file originally declined: the Southeastern
# TOC's own Wikipedia article gives the Hayes line's calling points as
# "Waterloo East, London Bridge, Lewisham" with no New Cross or St Johns
# stop, and St Johns railway station's own Wikipedia article explicitly
# lists which Southeastern metro routes call there (the Bexleyheath/Sidcup/
# North Kent group) while stating the Hayes line is NOT among them - so this
# file's own London-end stations (CHX, LBG, LEW) are a different, smaller
# set than the corridor's six/seven-station list, and this file's own
# not-calling-at-New-Cross/St-Johns fact was read as evidence of running on
# a physically separate pair of tracks rather than the same corridor.
#
# REVIEW FIX (shared-segment structural review, review2-shared-segments):
# that reading does not hold up. The Charing Cross/Cannon Street-Waterloo
# East-London Bridge-New Cross-St Johns-Lewisham approach is a single,
# well-documented four-track railway (fast/through and slow/local line
# pairs sharing the same formation and the same right-of-way) - the same
# kind of multi-track-but-one-corridor infrastructure `swr-trunk-waterloo`
# already models as one shared segment for SWR's own fast/slow services.
# Not calling at New Cross/St Johns means Hayes line trains use the through
# pair rather than the local pair between London Bridge and St Johns/
# Lewisham - it does not mean a physically separate route: a genuine
# incident on this stretch (a points failure, a fatality, overhead-line
# damage) generally blocks the whole four-track formation regardless of
# which pair a given service normally runs on. So CHX/WAE/LBG/LEW below now
# reuse `southeastern-lewisham-corridor` verbatim - a genuine SharedSegment
# with southeastern-main-line.toml/southeastern-bexleyheath.toml/
# southeastern-dartford-loop.toml/southeastern-north-kent.toml, all five of
# which now carry this same fix (see each file's own header comment).
# Cannon Street (CST) is still not included at all: every source checked
# describes Hayes line services as starting from Charing Cross via Waterloo
# East only, never Cannon Street - this file genuinely has no CST station,
# not a segment-naming question.
#
# Per the shared-trunk rule of thumb, LEW (the diverging junction) stays on
# `southeastern-lewisham-corridor`; the exclusive `hayes-branch` segment
# starts at the next station, Ladywell.
[[stations]]
crs = "CHX"
role = "terminus"
segment = "southeastern-lewisham-corridor"
# Also southeastern-main-line.toml's and southeastern-bexleyheath.toml's/
# southeastern-dartford-loop.toml's/southeastern-north-kent.toml's terminus
# - genuine SharedSegment, all five files now on this same segment name; see
# header comment above.

[[stations]]
crs = "WAE"
role = "minor"
segment = "southeastern-lewisham-corridor"
# Waterloo East: the first stop out of Charing Cross, confirmed by this
# file's own header sourcing (Wikipedia's calling-point list, "Charing
# Cross, Waterloo East, London Bridge, Lewisham...") but never actually
# added as a station entry until this fix -- a data-driven audit against
# real scheduled trains found 99% of confirmed hayes-line services touch
# it. Also on southeastern-main-line.toml's and
# southeastern-bexleyheath.toml's/southeastern-dartford-loop.toml's own
# London ends - genuine SharedSegment, same as CHX above.

[[stations]]
crs = "LBG"
role = "major"
segment = "southeastern-lewisham-corridor"
# Also on southeastern-main-line.toml's, southeastern-bexleyheath.toml's,
# southeastern-dartford-loop.toml's and southeastern-north-kent.toml's own
# `southeastern-lewisham-corridor` (genuine SharedSegment across all five
# files - see header comment above) and thameslink-core.toml's terminus
# (different segment name there, station overlap only with that file, per
# the xc-south-coast.toml/xc-manchester.toml precedent - Thameslink's core
# tunnel through Blackfriars/Farringdon is a physically different route
# into LBG).

[[stations]]
crs = "LEW"
role = "junction"
segment = "southeastern-lewisham-corridor"
# Lewisham. Hayes line trains reach here fast from London Bridge without
# calling at New Cross/St Johns (see header comment - now understood as a
# different pair of tracks on the same corridor, not a different corridor);
# the Dartford Loop/Bexleyheath group's own trunk (southeastern-
# bexleyheath.toml/southeastern-dartford-loop.toml) and southeastern-main-
# line.toml all now share this exact segment name here too - genuine
# SharedSegment, not station overlap; see header comment above. The North
# Kent Line (southeastern-north-kent.toml) diverges earlier, at New Cross,
# so it does not reach LEW at all.

# --- Hayes line's own exclusive branch (diverges south from Lewisham via
# the Courthill Loop) ---
[[stations]]
crs = "LAD"
role = "minor"
segment = "hayes-branch"
# Ladywell.

[[stations]]
crs = "CFB"
role = "minor"
segment = "hayes-branch"
# Catford Bridge - distinct from "Catford" station on the physically
# separate Catford Loop Line (see header comment).

[[stations]]
crs = "LSY"
role = "minor"
segment = "hayes-branch"
# Lower Sydenham.

[[stations]]
crs = "NBC"
role = "minor"
segment = "hayes-branch"
# New Beckenham. Beckenham Junction is not a Hayes line calling point - the
# spur from here toward Beckenham Junction was reduced to single track in
# 1987 and is not part of the passenger route this line follows onward to
# Clock House (see header comment).

[[stations]]
crs = "CLK"
role = "minor"
segment = "hayes-branch"
# Clock House.

[[stations]]
crs = "ELE"
role = "minor"
segment = "hayes-branch"
# Elmers End. Also a Tramlink interchange (London Trams), and the former
# junction for the Addiscombe branch, closed 1997 and converted to Tramlink
# - neither a National Rail line, so not treated as a "junction" role here.

[[stations]]
crs = "EDN"
role = "minor"
segment = "hayes-branch"
# Eden Park.

[[stations]]
crs = "WWI"
role = "minor"
segment = "hayes-branch"
# West Wickham.

[[stations]]
crs = "HYS"
role = "terminus"
segment = "hayes-branch"
# Hayes (Kent).

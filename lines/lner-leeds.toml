id = "lner-leeds"
name = "LNER Leeds Line"
mode = "national-rail"
category = "main-line"
operators = ["GR"]

# LDS and HGT are this file's own termini; not the trunk stations already
# covered by `lner-ecml.toml`'s own sample_stations.
sample_stations = ["WKF", "LDS", "HGT"]
destination_crs_filter = ["LDS", "HGT"]
# No match_keywords: "LNER"/"East Coast Main Line" are claimed by
# `lner-ecml.toml` (branch files don't re-add the generic operator brand,
# per that file's own comment). "Wakefield Westgate" and "Harrogate line"
# were both considered and rejected: Wakefield Westgate is also served by
# Northern and CrossCountry (confirmed via Wikipedia's Wakefield Westgate
# article), and the Harrogate line itself is overwhelmingly a Northern
# service (LNER runs a handful of daily workings on it — see below), so
# either phrase would pull in incidents that only affect Northern. Same
# reasoning as `xc-south-coast.toml`'s "no route name the Knowledgebase
# uses consistently" call.

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10
# Same values as `lner-ecml.toml`/`xc-south-coast.toml`: long-distance,
# roughly hourly-or-better service where a single cancellation matters more
# than on a metro-frequency line.

# King's Cross to Leeds via Wakefield Westgate, continuing to Harrogate via
# Horsforth. The King's Cross-Doncaster stretch is the same physical ECML
# spine as `lner-ecml.toml` and reuses its exact segment names
# (`ecml-london`, `ecml-fenland`, `ecml-doncaster`) verbatim, per that
# file's own comment on the DON station entry (RET/DON tiploc "DONC" and
# calling points confirmed against `lner-ecml.toml` itself, not
# re-researched here). LNER's own fast Leeds service (confirmed via
# Wikipedia's "London North Eastern Railway" article, cross-checked against
# Wikipedia's "Wakefield Line" article: LNER's Leeds trains stop at
# Peterborough, Grantham, Doncaster and Wakefield Westgate only) skips
# Retford/Newark Northgate and the Wakefield Line's own local stops
# (Outwood, Sandal & Agbrigg, Fitzwilliam, South Elmsall, Adwick, Bentley —
# Northern-only, deliberately omitted here as "minor intermediate calls",
# same convention as `xc-cardiff.toml`/`xc-south-coast.toml`); it still
# physically runs over that trunk track, so the shared segment names still
# apply for incident-matching purposes even where this line's own trains
# don't stop.
#
# Harrogate/Bradford Forster Square/Skipton fold-in (per the gap analysis's
# suggestion): LNER genuinely operates all three. Harrogate was already
# modeled as real stations; Bradford Forster Square and Skipton were
# previously left unmodeled for lack of independently-verified CRS codes for
# their shared Shipley/Keighley stretch -- this audit's CIF-schedule
# cross-check has now resolved both.
#   - Harrogate: confirmed via Wikipedia's "Harrogate line" article ("a few
#     additional workings by London North Eastern Railway starting and
#     terminating at Harrogate") and Wikipedia's "Harrogate railway
#     station" article ("LNER operates six daily services to and from
#     London King's Cross on Mondays to Saturdays... a third hourly
#     clockface service to Leeds every two hours"). Modeled below as the
#     file's own ordered extension past Leeds (LDS -> HRS -> HGT).
#   - Skipton: confirmed via Wikipedia's "Skipton railway station" article
#     ("London North Eastern Railway operates a daily return service from
#     Skipton to London King's Cross, via Leeds; the morning southbound
#     train does not run on Sundays") and cross-checked against Wikipedia's
#     "Airedale Line" article ("LNER currently operate a small number of
#     daily services... between Skipton/Bradford and London King's Cross").
#     RESOLVED: this audit's CIF-schedule cross-check confirms the 1
#     train/day return working, and the Shipley/Keighley CRS codes this file
#     previously declined to invent are already independently verified
#     in-repo -- `lines/northern-airedale.toml` (Task 8.3) models this exact
#     Leeds/Bradford-Shipley-Keighley-Skipton corridor with SHY (Shipley,
#     role `junction`), KEI (Keighley, role `major`) and SKI (Skipton, role
#     `terminus`) all two-source verified there. Reused verbatim below
#     rather than re-derived. Modeled as `lner-leeds-skipton`.
#   - Bradford Forster Square: previously left out entirely (the one source
#     that mentioned it, the Airedale Line article, flagged its own coverage
#     citation-needed). RESOLVED the same way as Skipton: this audit's
#     CIF-schedule cross-check confirms LNER genuinely runs it -- two
#     services each way (one on Sundays) -- and `northern-airedale.toml`
#     already independently verifies BDQ (Bradford Forster Square, role
#     `terminus`). Reused verbatim below. Modeled as `lner-leeds-bradford`.
#   - Both Bradford Forster Square and Skipton physically diverge from the
#     Airedale Line at Shipley, not at Leeds itself (per
#     `northern-airedale.toml`'s own header comment: "the two approaches
#     converge at Shipley"). Shipley is modeled once below, tagged
#     `junction`, on its own new `lner-leeds-airedale` segment (LNER's own
#     station overlap with `northern-shipley-trunk`, deliberately NOT
#     sharing that segment name -- same "station overlap is fine,
#     segment-sharing is a deliberate choice" precedent this file already
#     applies to LDS against Northern's segments below) -- the exclusive
#     `lner-leeds-bradford` and `lner-leeds-skipton` segments each start at
#     the next station after Shipley on their own branch, per SCHEMA.md's
#     shared-trunk rule of thumb applied within this file (same pattern
#     `wcml-manchester.toml` uses for its own Stafford/Crewe double-fork).
#
# Northern-sharing decision (`northern-yorkshire`, LDS<->YRK, shared today
# between `northern.toml` and `northern-yorkshire-coast.toml`): NOT shared.
# Researched whether LNER runs any Leeds<->York service that would
# genuinely share that physical trunk. Two independent sources say no:
# Wikipedia's "Harrogate line" article states service on that line (the
# only physical route connecting Leeds and York other than the main ECML
# route through York, which this file's Leeds branch never joins) "is
# operated by Northern, with a few additional workings by London North
# Eastern Railway starting and terminating at Harrogate" (i.e. LNER's own
# Harrogate-line workings stop short of York); Wikipedia's "Leeds railway
# station" article lists LNER's own Leeds destinations as King's Cross,
# Harrogate, Bradford Forster Square (unconfirmed, see above) and Skipton —
# no York — and separately notes CrossCountry, not LNER, as the operator
# running north to York from Leeds. LNER's only York service at all is the
# separate ECML-direct working already covered by `lner-ecml.toml`'s own
# `ecml-yorkshire` segment (King's Cross-Peterborough-Retford-Doncaster-York,
# never touching Leeds). So the premise the gap analysis flagged as a
# "genuine candidate" doesn't hold once checked: this file has no LDS<->YRK
# running to share a segment name for in the first place, and doesn't even
# list YRK as a station. What overlap does exist is station-level only, at
# LDS itself, which both `northern.toml` and `northern-yorkshire-coast.toml`
# also call at — exactly the `xc-south-coast.toml` "station overlap is
# fine, segment-sharing is a deliberate choice" situation, so LDS keeps its
# own `lner-leeds` segment tag rather than borrowing `northern-yorkshire`.
[[stations]]
crs = "KGX"
role = "terminus"
segment = "ecml-london"

[[stations]]
crs = "SVG"
role = "minor"
segment = "ecml-london"

[[stations]]
crs = "PBO"
role = "major"
segment = "ecml-fenland"

[[stations]]
crs = "GRA"
role = "minor"
segment = "ecml-fenland"

[[stations]]
crs = "NNG"
role = "junction"
segment = "ecml-fenland"

[[stations]]
crs = "RET"
role = "minor"
segment = "ecml-doncaster"

[[stations]]
crs = "DON"
tiploc = "DONC"
role = "junction"
segment = "ecml-doncaster"
# Diverges from the ECML spine onto the Wakefield Line here (Wikipedia's
# "Wakefield Line" article confirms the Doncaster-Leeds route runs via
# Wakefield Westgate). `lner-leeds` becomes the exclusive segment name from
# the next station onward, matching `lner-ecml.toml`'s own instruction on
# this station.

[[stations]]
crs = "WKF"
role = "major"
segment = "lner-leeds"

[[stations]]
crs = "LDS"
tiploc = "LEEDS"
role = "junction"
segment = "lner-leeds"
# Harrogate (via Horsforth) diverges from here directly; Bradford Forster
# Square and Skipton also diverge from Leeds-bound LNER services but their
# real physical fork point is Shipley, further on (see the file-level
# comment above for the full resolution and the Northern-sharing decision
# for this station).

[[stations]]
crs = "HRS"
role = "minor"
segment = "lner-leeds-harrogate"

[[stations]]
crs = "HGT"
role = "terminus"
segment = "lner-leeds-harrogate"

[[stations]]
crs = "SHY"
role = "junction"
segment = "lner-leeds-airedale"
# Shipley. CRS/role reused verbatim from `northern-airedale.toml`'s own
# verified SHY entry, not re-derived here -- see the file-level comment
# above. This is where LNER's Bradford Forster Square and Skipton workings
# genuinely fork.

[[stations]]
crs = "BDQ"
role = "terminus"
segment = "lner-leeds-bradford"
# Bradford Forster Square. LNER runs two services each way (one on
# Sundays) -- confirmed by this audit's CIF-schedule cross-check, resolving
# this file's previous citation-needed gap. CRS/role reused verbatim from
# `northern-airedale.toml`'s own verified BDQ entry.

[[stations]]
crs = "KEI"
role = "major"
segment = "lner-leeds-skipton"
# Keighley. CRS/role reused verbatim from `northern-airedale.toml`'s own
# verified KEI entry.

[[stations]]
crs = "SKI"
role = "terminus"
segment = "lner-leeds-skipton"
# Skipton. LNER runs 1 train per day return via Shipley and Keighley on the
# Airedale Line -- confirmed by this audit's CIF-schedule cross-check,
# resolving this file's previous "CRS codes not independently verified"
# blocker. CRS/role reused verbatim from `northern-airedale.toml`'s own
# verified SKI entry.

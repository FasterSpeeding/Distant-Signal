id = "wcml-birmingham"
name = "West Coast Main Line: Birmingham"
mode = "national-rail"
category = "main-line"
operators = [
  "VT",  # Avanti West Coast. This branch is modelled as Avanti-only: the
  # Rugby-Coventry-Birmingham stopping pattern researched for this file
  # (Wikipedia's Avanti West Coast article, cross-checked against the
  # Rugby-Birmingham-Stafford line article, both fetched live 2026-08-29)
  # lists only Avanti's own intercity calls; West Midlands Trains ("LM",
  # already on `wcml`) runs the all-stations local service over the same
  # metals but that's a distinct, unmodelled local service, not this line.
]

# EUS covers up-direction (London-bound) services -- BHM alone can't match
# trains terminating there, same defect class corrected for
# `lnwr-euston-commuter.toml`'s destination_crs_filter. WVH covers the
# through-to-Wolverhampton workings this file's own comment above already
# documents (some Avanti Birmingham services continue past New Street).
destination_crs_filter = ["BHM", "WVH", "EUS"]
sample_stations = ["COV", "BHM", "WVH"]
# No match_keywords: same reasoning as `xc-manchester.toml` -- this branch
# has no route name the Knowledgebase is confirmed to use consistently, and
# a generic word like "Birmingham" would false-positive against
# `xc-cardiff`, `xc-manchester`, `xc-south-coast`, `xc-stansted`, and
# `cross-country`, all of which also touch Birmingham New Street. Station
# and operator evidence carries it instead.

# London Euston to Birmingham New Street via Rugby and Coventry, ordered
# south-east to north-west. Shares the Euston-area and Milton
# Keynes/Rugby-area trunk with `west-coast-main-line.toml` (stations EUS
# through RUG below reuse that file's own `wcml-london`/`wcml-midlands`
# segment tags verbatim, mirroring the trunk-sharing pattern
# `swr-alton.toml` sets against `swr-south-west-main.toml`). Rugby is the
# real diverging point: Avanti's Birmingham service calls there before
# leaving WCML metals for the Rugby-Birmingham-Stafford line via Coventry
# (confirmed via Wikipedia's Avanti West Coast article, cross-checked
# against the Rugby-Birmingham-Stafford line article -- both fetched live
# 2026-08-29). Per the shared-trunk rule of thumb in `lines/SCHEMA.md`,
# Rugby stays on the shared segment and the exclusive `wcml-birmingham-branch`
# segment starts at the next station, Coventry.
#
# TASK 9.3 ADDITION (fetched live 2026-09-01): the eight minor intermediate
# calls between Coventry and Birmingham New Street named in this task's
# brief -- Canley, Tile Hill, Berkswell, Hampton-in-Arden, Marston Green,
# Lea Hall, Stechford, Adderley Park -- were previously omitted here on the
# reasoning that Avanti's own service doesn't call at them. Per this plan's
# full-coverage mandate (same precedent `gwr-cotswold.toml`'s Task 1.2 set:
# a low/limited calling frequency isn't grounds for exclusion, only genuine
# closure or non-existence is), that reasoning doesn't hold: these are real,
# currently-open, currently-served stations and belong in `stations`
# regardless of whether this file's own modelled operator (Avanti) is one of
# the services that calls there. All eight independently two-source
# verified here (Wikipedia's own station article per station, cross-checked
# against nationalrail.co.uk's live /stations/<crs>/details.html page for
# each) as open and in current use, all West Midlands Trains local stops
# (LNR/WMR-branded, 1-2 tph):
#   - Canley (CNL), Tile Hill (THL), Berkswell (BKW), Hampton-in-Arden (HIA):
#     CRS codes reused verbatim from `lnwr-birmingham-crewe.toml`, which
#     already curates these same four stations on its own exclusive
#     `lnwr-birmingham` segment (different segment name, same
#     station-overlap-without-segment-sharing pattern this file's header
#     comment above already establishes for COV/BHI/BHM against that file).
#   - Marston Green (MGN), Lea Hall (LEH), Stechford (SCF), Adderley Park
#     (ADD): investigated but left OUT of `lnwr-birmingham-crewe.toml` by
#     that file's own Task 9.2 (a sibling task in this batch) as below its
#     bar for that file's specific Euston-Birmingham semi-fast pattern --
#     that finding was about which *line* they belong on, not whether
#     they're real open stations, and doesn't apply to this file's
#     different, full-coverage station-catalogue purpose. Fresh Wikipedia +
#     nationalrail.co.uk verification here confirms all four are open,
#     current, West Midlands Trains-served stations between Birmingham
#     International and Birmingham New Street.
# Geographic order for all eight (Coventry through Birmingham New Street)
# confirmed via a fresh fetch of Wikipedia's "Rugby-Birmingham-Stafford
# line" article (the same source this file's header already cites for the
# Rugby-Coventry-Birmingham routing): Coventry, Canley, Tile Hill,
# Berkswell, Hampton-in-Arden, Birmingham International, Marston Green, Lea
# Hall, Stechford, Adderley Park, Birmingham New Street -- matching the
# insertion order below exactly. All eight sit strictly between
# already-modelled stations on the single `wcml-birmingham-branch` segment
# (Coventry through Birmingham New Street), so per `lines/SCHEMA.md`'s
# curation rules and this task's own constraints, none gets a new segment
# name -- they inherit `wcml-birmingham-branch` from their immediate
# neighbours. `wcml-birmingham-branch` remains exclusive to this file (not
# shared with `lnwr-birmingham-crewe.toml`'s differently-named
# `lnwr-birmingham` segment over the same physical track, nor with any other
# `lines/*.toml` file -- checked via grep), so no shared-trunk `MatchScope`
# assertion applies to this addition; see the regression test added to
# `crates/aggregator/src/matcher.rs` for the has_station coverage this task's
# testing convention requires instead.
#
# RESOLVED (review2 finding, 2026-09-21): Avanti's Birmingham services
# genuinely continue beyond New Street to Wolverhampton -- confirmed live via
# Wikipedia's "Avanti West Coast" article, whose own Euston-Glasgow/Edinburgh
# calling-pattern list names "Birmingham New Street, Sandwell & Dudley,
# Wolverhampton" in that order (the same Wolverhampton-Birmingham stretch
# `xc-manchester.toml`'s own 2026-09-21 route correction already models in
# full for CrossCountry's Stour Valley line service). WVH was already this
# file's own `destination_crs_filter` entry (added for exactly this gap) but
# never added to `stations` -- now fixed below.
#
# CRS/TIPLOC for CSY, TIP, DDP, SAD, SGB and SMR are reused verbatim from
# `xc-manchester.toml`'s own already-verified Stour Valley entries (same
# physical line, different operator/file) rather than re-derived. WVH itself
# re-verified live against https://ds.cursed.solutions/api/stations
# (2026-09-21), matching `xc-manchester.toml`'s existing WVH entry. All six
# intermediate stations are included per this file's own established
# full-coverage convention (see the Task 9.3 comment above: "a low/limited
# calling frequency isn't grounds for exclusion" for this exact Coventry-
# Birmingham stretch) even though Avanti's own limited-stop Wolverhampton
# working may not call at all of them -- consistent with how this file
# already treats the Coventry-Birmingham stretch, and avoids the file
# silently omitting real, open, currently-served stations strictly between
# two already-modelled points. BHM's `role` changes from "terminus" to
# "junction" below since the line now continues past it.
[[stations]]
crs = "EUS"
tiploc = "EUSTON"
role = "terminus"
segment = "wcml-london"

[[stations]]
crs = "WFJ"
tiploc = "WATFDJ"
role = "major"
segment = "wcml-london"

[[stations]]
crs = "HML"
tiploc = "HEMLHMP"
role = "minor"
segment = "wcml-london"
# Hemel Hempstead. CRS/TIPLOC corrected by this audit's CIF-schedule
# cross-check -- the previous "HMP"/"HAMPTON" entry was a bogus pair; see
# `west-coast-main-line.toml`'s own HML entry for the full sourcing note.
# Kept identical across all five WCML files that carry this shared-trunk
# row.

[[stations]]
crs = "TRI"
tiploc = "TRING"
role = "minor"
segment = "wcml-london"

[[stations]]
crs = "MKC"
tiploc = "MKNSCEN"
role = "major"
segment = "wcml-midlands"

[[stations]]
crs = "RUG"
tiploc = "RUGBY"
role = "junction"
segment = "wcml-midlands"

[[stations]]
crs = "COV"
role = "major"
segment = "wcml-birmingham-branch"

[[stations]]
crs = "CNL"
role = "minor"
segment = "wcml-birmingham-branch"

[[stations]]
crs = "THL"
role = "minor"
segment = "wcml-birmingham-branch"

[[stations]]
crs = "BKW"
role = "minor"
segment = "wcml-birmingham-branch"

[[stations]]
crs = "HIA"
role = "major"
segment = "wcml-birmingham-branch"

[[stations]]
crs = "BHI"
role = "major"
segment = "wcml-birmingham-branch"

[[stations]]
crs = "MGN"
role = "minor"
segment = "wcml-birmingham-branch"

[[stations]]
crs = "LEH"
role = "minor"
segment = "wcml-birmingham-branch"

[[stations]]
crs = "SCF"
role = "minor"
segment = "wcml-birmingham-branch"

[[stations]]
crs = "ADD"
role = "minor"
segment = "wcml-birmingham-branch"

[[stations]]
crs = "BHM"
tiploc = "BHAMNWS"
role = "junction"
segment = "wcml-birmingham-branch"

[[stations]]
crs = "SMR"
role = "minor"
segment = "wcml-birmingham-branch"
# Smethwick Rolfe Street: strictly between Birmingham New Street and
# Smethwick Galton Bridge on the Stour Valley line. CRS reused verbatim from
# `xc-manchester.toml`.

[[stations]]
crs = "SGB"
role = "minor"
segment = "wcml-birmingham-branch"
# Smethwick Galton Bridge: a genuine split-level interchange -- its
# high-level platforms carry `wmr-snow-hill.toml`'s Snow Hill route,
# station-level overlap only. CRS reused verbatim from `xc-manchester.toml`.

[[stations]]
crs = "SAD"
role = "minor"
segment = "wcml-birmingham-branch"
# Sandwell & Dudley: the one intermediate stop Avanti's own published
# Wolverhampton calling pattern names explicitly (see the sourcing note
# above). CRS reused verbatim from `xc-manchester.toml`.

[[stations]]
crs = "DDP"
role = "minor"
segment = "wcml-birmingham-branch"
# Dudley Port: strictly between Sandwell & Dudley and Tipton. CRS reused
# verbatim from `xc-manchester.toml`.

[[stations]]
crs = "TIP"
role = "minor"
segment = "wcml-birmingham-branch"
# Tipton: strictly between Dudley Port and Coseley. CRS reused verbatim from
# `xc-manchester.toml`.

[[stations]]
crs = "CSY"
role = "minor"
segment = "wcml-birmingham-branch"
# Coseley: strictly between Tipton and Wolverhampton. CRS reused verbatim
# from `xc-manchester.toml`.

[[stations]]
crs = "WVH"
role = "terminus"
segment = "wcml-birmingham-branch"
# Wolverhampton: already this file's own `destination_crs_filter` entry;
# now added to `stations` too -- see the sourcing note above.

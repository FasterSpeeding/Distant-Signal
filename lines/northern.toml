id = "northern"
name = "Northern"
mode = "national-rail"
category = "operator"
operators = ["NT"]

destination_crs_filter = ["LIV", "MCV", "LDS", "YRK", "HUD"]
sample_stations = ["LIV", "MCV", "HUD", "LDS", "YRK"]
# "Northern" alone is far too loose — it matches "northern section",
# "northbound" and the Underground's Northern line.
match_keywords = ["Northern Rail", "Northern Trains", "Northern services"]
excluded_keywords = ["Northern line", "Northern City Line"]

# --- Restructuring review (Yorkshire real-world-sanity review, 2026-09-21)
# ---
# This file was found to be an incoherent catch-all: its own station list
# stitches together four physically disconnected fragments (Liverpool-Huyton-
# Newton-le-Willows; Manchester Victoria alone; Stalybridge-Huddersfield-
# Dewsbury; Leeds-York) with no real through-service connecting any of them
# to any other, under a stale comment claiming "6 sibling files" when the
# catalogue now has 30+ Northern-family files. Two options were weighed for
# fixing this (per this task's own brief): (a) reduce this file to an
# empty/minimal operator-keyword matcher, or (b) split its genuinely coherent
# fragments into their own properly-named files.
#
# DECISION: a hybrid of both, chosen for a concrete, checked reason rather
# than by default. A full (a) -- emptying this file's own station list --
# was rejected because every one of its four fragments' segment names
# (`northern-merseyside`, `northern-manchester`, `northern-transpennine`,
# `northern-yorkshire`) is either already a genuine shared trunk with
# another file (`northern-manchester` with `northern-blackpool.toml`/
# `northern-clitheroe.toml`; `northern-yorkshire` with `northern-yorkshire-
# coast.toml`) or is exercised by name-specific `matcher.rs` regression
# tests: removing the stations here would silently flip those other files'
# own SharedSegment/ExclusiveSegment scope for no reason connected to this
# task's actual bug (the incoherent framing, not the underlying segment
# facts, which remain correct). So this file's own station list and
# segments are left unchanged -- this IS (a) in substance: an operator hub
# matcher whose station list exists to seed real shared-trunk facts for its
# sibling files at Liverpool, Manchester Victoria, Huddersfield/Dewsbury and
# Leeds/York, not to describe one single route someone could ride start to
# end.
#
# (b) is applied ADDITIVELY on top: the two fragments with enough real
# stations to deserve their own genuine, complete, correctly-named files
# now have one each -- `lines/northern-huddersfield.toml` (the real
# Huddersfield line, Manchester Victoria to Leeds, filling in Mossley,
# Greenfield, Marsden, Slaithwaite, Deighton, Mirfield, Ravensthorpe,
# Batley, Morley and Cottingley, none of which this file ever listed) and
# `lines/northern-leeds-york.toml` (the real, separate Leeds-York local
# stopper via Cross Gates/Micklefield/Church Fenton/Ulleskelf, distinct from
# this file's own direct LDS-YRK working). Both station-overlap with this
# file at their shared endpoints (MCV/SYB/HUD/DEW/LDS/YRK) without segment-
# sharing, the same "station overlap is fine, segment-sharing is a
# deliberate choice" precedent used throughout this catalogue -- see each
# new file's own top-of-file comment for the full reasoning.
#
# Northern is a network rather than a single route. This file's own four
# fragments are each a real anchor/hub point that a genuine sibling file
# forks from, not a route in themselves, ordered west to east below; the
# other arms are separate definitions sharing the NT operator code -- by
# 2026-09-21 that is 30+ files, not "6" as an earlier version of this
# comment claimed (stale even at "6": always check `ls lines/northern-*.toml`
# for the current count rather than trusting a number in this comment).
# Notable siblings anchored at each of this file's own fragments:
# `northern-blackpool`/`northern-clitheroe` (share the `northern-manchester`
# hub), `northern-yorkshire-coast`/`northern-leeds-selby`/
# `northern-leeds-york` (Leeds/York-area siblings), `northern-huddersfield`
# (the real Manchester Victoria-Leeds route this file's own Stalybridge-
# Huddersfield-Dewsbury fragment is a stub of), plus `northern-lakes`,
# `northern-furness`, `northern-hope-valley`, `northern-tyne-valley` and
# many more sharing no station with this file at all.
#
# TIPLOCs are given only where verified; the field is optional and absent
# values simply mean no TRUST/SCHEDULE correlation hint for that station.
[[stations]]
crs = "LIV"
role = "terminus"
segment = "northern-merseyside"

[[stations]]
crs = "HUY"
role = "minor"
segment = "northern-merseyside"

[[stations]]
crs = "NLW"
role = "junction"
segment = "northern-merseyside"

[[stations]]
crs = "MCV"
role = "major"
segment = "northern-manchester"
# Manchester Piccadilly (MAN) is not on this corridor: its eastbound Northern
# services run via the Hope Valley — see `northern-hope-valley`

[[stations]]
crs = "SYB"
role = "junction"
segment = "northern-transpennine"

[[stations]]
crs = "HUD"
role = "major"
segment = "northern-transpennine"

[[stations]]
crs = "DEW"
role = "minor"
segment = "northern-transpennine"

[[stations]]
crs = "LDS"
tiploc = "LEEDS"
role = "junction"
segment = "northern-yorkshire"

[[stations]]
crs = "YRK"
tiploc = "YORK"
role = "terminus"
segment = "northern-yorkshire"
# Continues to Scarborough (SCA) and, via Darlington, to Newcastle (NCL)

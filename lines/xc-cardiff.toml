id = "xc-cardiff"
name = "CrossCountry Cardiff Line"
mode = "national-rail"
category = "main-line"
operators = ["XC"]

destination_crs_filter = ["CDF", "NWP", "GCR", "NOT"]
sample_stations = ["NOT", "GCR", "NWP", "CDF"]
match_keywords = ["Gloucester to Newport"]

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10

# Nottingham to Cardiff Central, ordered north-east to south-west. Shares the
# spine's `xc-birmingham` hub and the `xc-west` trunk as far as Cheltenham
# Spa, where it diverges for Gloucester while spine services carry on via
# Standish Junction to Bristol.
#
# REVIEW2 FINDING (2026-09-21): this file previously started at Birmingham
# New Street, but XC's own published route map names this line "Nottingham -
# Cardiff", and XC runs an hourly Birmingham-Nottingham service over the same
# Derby line `cross-country.toml`'s own spine already uses between Derby and
# Birmingham. Confirmed live via Wikipedia: Nottingham's own station article
# ("CrossCountry... 1 tph to Birmingham New Street via Derby" and "1 tph to
# Cardiff Central via Derby, Birmingham New Street and Gloucester"), and each
# intermediate station's own article/infobox, cross-checked independently:
#   - Long Eaton: "CrossCountry: 1 tph to Nottingham; 1 tph to Cardiff
#     Central, via Birmingham New Street."
#   - Beeston: "CrossCountry... 1 tph to Nottingham; 1 tph to Birmingham New
#     Street, via Derby; most services continue on to Cardiff Central."
#   - Attenborough: "CrossCountry operates a small number of stopping
#     services, in the early morning and late evening, on the route between
#     Nottingham, Birmingham New Street and Cardiff Central" -- a genuine,
#     if limited, XC calling point (included per this catalogue's existing
#     precedent that low frequency alone isn't grounds for exclusion, e.g.
#     `emr-midland-main-line.toml`'s own ATB entry).
#   - East Midlands Parkway: confirmed CrossCountry does NOT call here
#     ("East Midlands Railway operates all services that stop at East
#     Midlands Parkway") -- correctly left out below, matching
#     `emr-midland-main-line.toml`'s own DBY-LGE-EMD ordering (Long Eaton
#     sits between Derby and the East Midlands Parkway junction, not on the
#     Trent Junction chord itself).
# Geographic order (Nottingham to Derby) confirmed against
# `emr-midland-main-line.toml`'s own already-verified station sequence:
# Derby - Long Eaton - [East Midlands Parkway junction, not an XC stop] -
# Attenborough - Beeston - Nottingham.
#
# NOT/BEE/ATB/LGE are new to this file's exclusive `xc-cardiff-nottingham`
# segment; DBY/BUT/TAM below now reuse `cross-country.toml`'s own
# `xc-midlands` segment name VERBATIM (byte-identical station list: DBY,
# BUT, TAM, same roles) -- a genuine shared trunk, since this is the exact
# same Derby-Birmingham stretch that file's own Aberdeen/Edinburgh-Plymouth
# spine already runs over with the same operator (XC), not a
# station-overlap-only case. `cross-country.toml`'s own TAM comment already
# documents "CrossCountry runs 2 tph to Nottingham via Derby calling here",
# confirming this same fact from that file's side. CRS/TIPLOC for
# NOT/BEE/ATB/LGE reused verbatim from `emr-midland-main-line.toml`'s own
# Nottingham-spur entries (none of the four carry a confirmed TIPLOC there
# either, so none is invented here); DBY/BUT/TAM reused verbatim from
# `cross-country.toml`. Station-overlap-only (no segment shared) with
# `emr-midland-main-line.toml`'s own `emr-mml-nottingham-spur`/
# `emr-mml-central`/`emr-mml-derby` segments at NOT/BEE/ATB/LGE/DBY -- same
# cross-operator convention this catalogue already applies everywhere else
# (checked that file's own segment names before writing this).
[[stations]]
crs = "NOT"
role = "terminus"
segment = "xc-cardiff-nottingham"

[[stations]]
crs = "BEE"
role = "minor"
segment = "xc-cardiff-nottingham"

[[stations]]
crs = "ATB"
role = "minor"
segment = "xc-cardiff-nottingham"
# Attenborough: early-morning/late-evening-only XC calls -- see the sourcing
# note above.

[[stations]]
crs = "LGE"
role = "minor"
segment = "xc-cardiff-nottingham"
# Long Eaton: strictly between Attenborough and Derby.

[[stations]]
crs = "DBY"
tiploc = "DRBY"
role = "junction"
segment = "xc-midlands"
# Derby: shared-trunk boundary with `cross-country.toml`'s own DBY entry --
# see the sourcing note above. Per SCHEMA.md's shared-trunk rule of thumb,
# this junction stays on the shared `xc-midlands` segment; this file's own
# exclusive Nottingham branch above already ended at the previous station.

[[stations]]
crs = "BUT"
role = "minor"
segment = "xc-midlands"

[[stations]]
crs = "TAM"
role = "minor"
segment = "xc-midlands"
# Tamworth (Low Level platforms) -- see `cross-country.toml`'s own TAM entry
# for the High Level/Low Level CRS-overlap note; kept byte-identical here.
#
# Task 9.4 fresh route-diagram pass (2026-09-01): re-verified the whole
# corridor against live Wikipedia route/infobox articles ("Gloucester-Newport
# line", plus each candidate station's own article) cross-checked against
# nationalrail.co.uk/stations/<crs>/details.html. Two real, currently-open,
# currently-served stations were missing from the exclusive `xc-cardiff`
# segment between Chepstow and Newport -- Caldicot (CDT) and Severn Tunnel
# Junction (STJ) -- added below at their true geographic position (confirmed
# order: Chepstow -> Caldicot -> Severn Tunnel Junction -> Newport). XC itself
# runs a limited Severn Tunnel Junction call (confirmed on that station's own
# Wikipedia article), so this isn't even a frequency-only add. All other
# candidate stations on this stretch (Oakle Street, Grange Court,
# Westbury-on-Severn Halt, Newnham, Ruddle Road Halt, Awre for Blakeney,
# Gatcombe, Severn Bridge, Tutshill for Beachley Halt, Chepstow East,
# Portskewett x2, Undy Halt) are genuinely closed/disused (Beeching-era or
# earlier); Llanwern is a proposed reopening, not yet open, so also stays
# out. Churchdown (between Cheltenham Spa and Gloucester) was also checked
# and confirmed still closed since 1964 (Wikipedia), not reopened.
#
# The shared `xc-birmingham`/`xc-west` stretch (BHM/UNI/CNM) was
# deliberately left untouched even though the same fresh pass turned up
# real, open, currently-served candidates there too (Barnt Green, Bromsgrove,
# Ashchurch for Tewkesbury, Worcestershire Parkway) -- those stations sit on
# a segment shared verbatim with `cross-country.toml`'s own `xc-birmingham`/
# `xc-west` entries (byte-identical BHM/UNI/CNM today), which was out of this
# task's single-file scope to edit. Flagging for a follow-up task scoped to
# `cross-country.toml` (or a coordinated multi-file task) rather than forking
# the shared trunk unilaterally here.
#
# RESOLVED (later cross-country.toml-scoped audit): Worcestershire Parkway
# (WOP) is now added to the shared row in both files -- CrossCountry runs
# southbound-only/select-service stops there on the Bristol-Manchester and
# Bournemouth-Manchester patterns, confirmed by this audit's CIF-schedule
# cross-check. See the WOP entry below, kept byte-identical with
# `cross-country.toml`'s own copy of this BHM/UNI/WOP/CNM stretch. Barnt
# Green, Bromsgrove and Ashchurch for Tewkesbury remain unaddressed and
# still out of this file's single-file scope.
#
# Remaining minor intermediate calls on the shared `xc-birmingham`/`xc-west`
# stretch (see above) are omitted for that reason; the exclusive
# `xc-cardiff` segment below is now a fully re-verified stopping pattern,
# not boilerplate.
[[stations]]
crs = "BHM"
tiploc = "BHAMNWS"
role = "junction"
segment = "xc-birmingham"

[[stations]]
crs = "UNI"
role = "minor"
segment = "xc-west"

[[stations]]
crs = "WOP"
role = "minor"
segment = "xc-west"
# Worcestershire Parkway. CrossCountry runs southbound-only/select-service
# stops here on both the Bristol-Manchester and Bournemouth-Manchester
# patterns -- confirmed by this audit's CIF-schedule cross-check. Kept
# byte-identical with `cross-country.toml`'s own copy of this BHM/UNI/WOP/CNM
# stretch (see the RESOLVED note above).

[[stations]]
crs = "CNM"
role = "junction"
segment = "xc-west"

[[stations]]
crs = "GCR"
role = "major"
segment = "xc-cardiff"

[[stations]]
crs = "LYD"
role = "minor"
segment = "xc-cardiff"

[[stations]]
crs = "CPW"
role = "minor"
segment = "xc-cardiff"

[[stations]]
crs = "CDT"
role = "minor"
segment = "xc-cardiff"
# Caldicot. Opened 1932 as Caldicot Halt, renamed 1969. Verified open via its
# own Wikipedia article and nationalrail.co.uk/stations/cdt/details.html
# (both fetched live 2026-09-01); not on any other line file's station list.

[[stations]]
crs = "STJ"
role = "junction"
segment = "xc-cardiff"
# Severn Tunnel Junction: where the Gloucester-Newport Line meets the South
# Wales Main Line via the Severn Tunnel. Verified open, and that CrossCountry
# itself makes a limited call here, via Wikipedia's own station article
# cross-checked against nationalrail.co.uk/stations/stj/details.html (both
# fetched live 2026-09-01). Not on gwr-south-wales.toml's own station list
# (that file's own comment already documents genuine physical track sharing
# "further up the corridor at Severn Tunnel Junction", deliberately not
# modelled there) -- no cross-file segment-name collision here.

[[stations]]
crs = "NWP"
role = "major"
segment = "xc-cardiff"

[[stations]]
crs = "CDF"
role = "terminus"
segment = "xc-cardiff"

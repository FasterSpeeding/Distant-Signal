id = "xc-cardiff"
name = "CrossCountry Cardiff Line"
mode = "national-rail"
category = "main-line"
operators = ["XC"]

destination_crs_filter = ["CDF", "NWP", "GCR"]
sample_stations = ["GCR", "NWP", "CDF"]
match_keywords = ["Gloucester to Newport"]

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10

# Birmingham New Street to Cardiff Central, ordered north-east to south-west.
# Shares the spine's `xc-birmingham` hub and the `xc-west` trunk as far as
# Cheltenham Spa, where it diverges for Gloucester while spine services carry
# on via Standish Junction to Bristol.
#
# Minor intermediate calls are omitted; only principal stations are listed.
[[stations]]
crs = "BHM"
tiploc = "BHAMNWS"
role = "junction"
segment = "xc-birmingham"

[[stations]]
crs = "UNI"
role = "minor"
segment = "xc-west"

[[stations]]
crs = "CNM"
role = "junction"
segment = "xc-west"

[[stations]]
crs = "GCR"
role = "major"
segment = "xc-cardiff"

[[stations]]
crs = "LYD"
role = "minor"
segment = "xc-cardiff"

[[stations]]
crs = "CPW"
role = "minor"
segment = "xc-cardiff"

[[stations]]
crs = "NWP"
role = "major"
segment = "xc-cardiff"

[[stations]]
crs = "CDF"
role = "terminus"
segment = "xc-cardiff"

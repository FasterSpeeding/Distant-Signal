id = "tfw-conwy-valley"
name = "Conwy Valley Line"
mode = "national-rail"
category = "regional"
operators = ["AW"]

destination_crs_filter = ["LLD", "BFF"]
sample_stations = ["LLD", "LLJ", "BYC", "BFF"]
match_keywords = ["Conwy Valley Line", "Llandudno branch line"]

# === CORRECTION (real-world-sanity review, 2026-09-21): real Llandudno
# terminus added ===
#
# This file previously stopped one station short of its real terminus.
# Independently re-verified via Wikipedia's "Conwy Valley line" article
# (its own infobox lists `start = Llandudno` and `end = Blaenau
# Ffestiniog`, and its opening sentence: "It runs from Llandudno via
# Llandudno Junction ... to Blaenau Ffestiniog"), corroborating the
# "Llandudno branch line" article's own framing already cited below (the
# branch is "at the northern extremity of the train service between
# Blaenau Ffestiniog and Llandudno, marketed as the Conwy Valley line").
# The real, single branded TfW service runs Llandudno-Llandudno
# Junction-Blaenau Ffestiniog end to end, not just Llandudno
# Junction-Blaenau Ffestiniog.
#
# Deganwy (DGY) and Llandudno (LLD) are added below, both reused verbatim
# from the now-deleted `lines/tfw-llandudno-branch.toml` -- that file's own
# station data (a short branch it modelled in isolation, Llandudno
# Junction-Deganwy-Llandudno) turned out to be entirely redundant with this
# file's own real extent, not a genuinely separate line, so it has been
# deleted rather than kept alongside this one (see the git history for its
# removal). CRS/TIPLOC sourcing for DGY and LLD is carried over unchanged
# from that file: cross-checked against https://ds.cursed.solutions/api/stations,
# matching each station's own Wikipedia infobox. LLJ's own CRS/TIPLOC and
# its `tfw-conwy-valley-llandudno-junction` segment tag are left unchanged
# below (that segment name is no longer genuinely shared with any other
# file now that `tfw-llandudno-branch.toml` is gone, but it is left as-is
# rather than folded back into the plain `tfw-conwy-valley` name, since
# touching an untouched, correctly-tagged station isn't this correction's
# job -- a future editor is free to simplify it once satisfied nothing else
# will ever need to reuse it).

# --- Full-coverage pilot (2026-09-21) ---
#
# `full_coverage_enabled = true`: this line is the first (and, as of this
# change, only) real line opted into `crates/full-coverage-consumer`'s
# TRUST-vs-schedule output actually being merged into its live
# severity/DataQuality by `aggregator::merge_full_coverage`, rather than
# staying in the shadow-only posture every catalogued line has had since
# `full-coverage-consumer` started running in production
# (docs/superpowers/specs/2026-09-04-option-b-live-consumer-design.md's
# binding shadow-mode condition, this file's own prior state confirmed
# unset). No other `lines/*.toml` file sets this field yet -- this is the
# first precedent for the syntax (a bare top-level boolean, matching
# `LineDefinition.full_coverage_enabled`'s `#[serde(default)]` deserialize
# shape in `crates/common/src/lib.rs`).
#
# Picked as the pilot line for two reasons, both checked directly against
# this repo's code and catalogue rather than assumed:
#   1. Low traffic, so a wrong full-coverage result has low user-facing
#      blast radius: six trains each way Mon-Sat (see this file's own
#      service-pattern note above), a single-track branch with only one
#      passing loop, no other line sharing any segment with this one (see
#      the "Sourcing note"/Llandudno Junction discussion above -- confirmed
#      via `grep -n segment lines/tfw-north-wales-coast.toml` that it uses
#      its own distinct segment name at LLJ, station-overlap-only).
#   2. TIPLOC-complete for what actually matters to correlation: as of the
#      2026-09-09 tiploc-schedule-matching-gap fix,
#      `crates/schedule-reference/src/main.rs`'s `lines_to_publish`/
#      `line_tiplocs` (and `crates/api/src/data/schedule_matching.rs`'s
#      `crs_to_line_ids`) resolve every station's real TIPLOC from the
#      live, CIF-derived `stanox_crs` table by CRS code at runtime -- this
#      file's own TOML `tiploc` field (below) is documentation/display
#      metadata only, never load-bearing for that resolution (see
#      `common::Station::tiploc`'s own doc comment). All stations below
#      carry a real, currently-operating CRS code cross-checked against
#      nationalrail.co.uk. This pilot was originally authored against an
#      11-station version of this file; the 2026-09-21 real-world-sanity
#      review (see the top-of-file CORRECTION note) has since added
#      Llandudno (LLD) and Deganwy (DGY) as this line's real northern
#      terminus and its immediate neighbour, bringing the total to 13.
#      9 of the original 11 stations have a TOML `tiploc` that was
#      cross-checked against a second independent source
#      (railwaycodes.org.uk) at authoring time -- still the
#      best-documented TIPLOC coverage of any rural branch line in this
#      catalogue for the stretch this pilot was actually reasoned about.
#      LLD and DGY were reused verbatim from the now-deleted
#      `tfw-llandudno-branch.toml` and carry no TOML `tiploc` either
#      (that file never sourced one), so the real, current count is 9 of
#      13 with a documented TOML tiploc -- four without: PYP and RMB (real
#      stations, Wikipedia-only CRS sourcing, see the sourcing note below)
#      plus LLD and DGY (real stations, tiploc simply never sourced). This
#      doesn't change the underlying risk assessment: the TOML `tiploc`
#      field is documentation/display metadata only, never load-bearing
#      for schedule-matching (see above), and all 13 stations -- including
#      LLD and DGY -- carry a real, currently-operating CRS code.
#
# See docs/superpowers/specs/2026-09-04-option-b-live-consumer-design.md
# and docs/superpowers/plans/2026-09-04-option-b-live-consumer-plan.md for
# the consumer this flag now actually gates the output of, and this
# branch's own comparison tool (`crates/api/src/bin/compare_full_coverage.rs`,
# backed by `crates/api/src/data/full_coverage_comparison.rs`) for how this
# pilot's real-vs-sampled agreement is meant to be checked before any
# second line is ever added here.
full_coverage_enabled = true

# Sourcing note (per the catalogue's "cross-checked against a second source"
# curation standard, matching the disclosure format established for
# tfw-cambrian.toml and tfw-heart-of-wales.toml): every CRS code below was
# confirmed from that station's own Wikipedia infobox. Of those, LLJ, GCW,
# TLC, DLG, NLR, LWR, BYC, DWD and BFF were additionally cross-checked
# against railwaycodes.org.uk's per-letter CRS pages (CRSl/g/t/d/n/b.shtm)
# and match exactly, including their TIPLOCs (LANDUDJ, GLNCNWY, TALYCFN,
# DOLGARG, NLANRST, LNRWST, BETSYCD, DLWYDLN, BLAENAU respectively -- all
# included below). PYP (Pont-y-Pant) and RMB (Roman Bridge) are Wikipedia-
# only so far: railwaycodes.org.uk's "P" and "R" per-letter pages were
# fetched and scanned in full but genuinely contain no row for either
# station name (the same "page doesn't reach the relevant row" failure mode
# disclosed in the two sibling files, though here it reads as a true
# absence rather than a truncation -- the "P" page's "Pon-" entries jump
# straight from Ponteland-family names to Pontesbury/Pontypool-family names
# with no "Pont-y-Pant" row, and the "R" page's "Rom-" entries contain only
# "Romford Junction"). Both codes are directly read from a live source and
# are not invented, but a future editor should treat PYP and RMB as pending
# a full second-source confirmation.
#
# The full station list (11 stations, Llandudno Junction to Blaenau
# Ffestiniog) plus each stop's request-stop status was confirmed via each
# station's own Wikipedia "Services" section and cross-checked against the
# line's own route-diagram template (Template:Conwy Valley Line) and the
# Conwy Valley line infobox, both fetched directly. No intermediate calls
# are omitted here -- unlike `xc-cardiff.toml` and `northern-furness.toml`,
# this line's complete current station list is short enough that every
# stop (including request stops) is enumerated below rather than
# summarised.

# Per the Conwy Valley line's own Wikipedia infobox: single track throughout
# except a passing loop at North Llanrwst (the line's only passing point),
# and double track only on the short Llandudno-Llandudno Junction stretch
# which is out of this file's scope (see the Llandudno Junction note
# below). Service pattern (confirmed via multiple individual station
# "Services" sections, e.g. Betws-y-Coed's and Dolwyddelan's): six trains
# each way Mon-Sat (most intermediate request stops slightly fewer, five
# southbound/six northbound), roughly every three hours, with a reduced
# Sunday service. This is sparser than the Cambrian Coast Line's two-hourly
# Pwllheli branch and the Heart of Wales Line's 2-3-hourly service
# (`tfw-cambrian.toml`, `tfw-heart-of-wales.toml`), so the same
# proportional-impact rationale applies at least as strongly here: this
# mirrors those two files' thresholds rather than Furness's hourly-service
# ones.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# Llandudno to Blaenau Ffestiniog, ordered north-west to south (the only
# possible order -- this is a single-track branch with no internal split).
# Llandudno and Deganwy were added by the 2026-09-21 real-world-sanity
# review's correction (see the top-of-file note); everything from Llandudno
# Junction southwards is unchanged from this file's original authoring.
#
# Llandudno Junction is a through station on the North Wales Coast Line
# (Chester-Holyhead) and also the junction for the separate Llandudno
# branch (Llandudno Junction-Llandudno via Deganwy) -- confirmed via
# Llandudno Junction's own Wikipedia article. Task 11.4
# (`lines/tfw-north-wales-coast.toml`, Chester-Holyhead, not yet written
# when this file was authored) was expected to read this file and decide
# whether to reuse the `tfw-conwy-valley` segment name at Llandudno
# Junction for a genuine cross-file shared-trunk relationship, or to give
# its own line a distinct segment name there instead -- that decision was
# deliberately left to Task 11.4, not made here. It has since done so:
# `tfw-north-wales-coast.toml` deliberately does NOT reuse `tfw-conwy-
# valley` (station-overlap only, its own reasoning documented in that
# file's own "Llandudno Junction segment-sharing decision" comment).
#
# `tfw-llandudno-branch.toml` (a later Wales/East Anglia batch addition)
# DOES genuinely share track here (TfW's own Conwy Valley service
# continues through this station to Llandudno -- see that file's own LLJ
# note), so LLJ below uses a dedicated, narrow segment name,
# `tfw-conwy-valley-llandudno-junction`, reused verbatim by that file --
# reconciled during integration merge to avoid over-broadening this file's
# whole-route `tfw-conwy-valley` segment (which covers ten other stations
# `tfw-llandudno-branch.toml` never reaches) into a false shared claim.
# Every other station below keeps the whole-route `tfw-conwy-valley` name
# (matching `northern-furness.toml`'s treatment of its own through-junction
# stations, LAN and CNF, which are tagged with that file's one whole-line
# segment name rather than a separate trunk/exclusive split).
[[stations]]
crs = "LLD"
role = "terminus"
segment = "tfw-conwy-valley"
# Llandudno: this line's real northern terminus, confirmed via the Conwy
# Valley line's own Wikipedia infobox (`start = Llandudno`). Reused from
# the now-deleted `tfw-llandudno-branch.toml`.

[[stations]]
crs = "DGY"
role = "minor"
segment = "tfw-conwy-valley"
# Deganwy: historically also a small harbour, per the Llandudno branch
# line's own Wikipedia article. Reused from the now-deleted
# `tfw-llandudno-branch.toml`.

[[stations]]
crs = "LLJ"
tiploc = "LANDUDJ"
role = "junction"
segment = "tfw-conwy-valley-llandudno-junction"

[[stations]]
crs = "GCW"
tiploc = "GLNCNWY"
role = "minor"
segment = "tfw-conwy-valley"
# Request stop (confirmed via this station's own Wikipedia "Services"
# section).

[[stations]]
crs = "TLC"
tiploc = "TALYCFN"
role = "minor"
segment = "tfw-conwy-valley"
# Request stop for northbound trains only; southbound trains call
# regardless, so the crossing keeper can operate the adjacent manual level
# crossing gates (confirmed via this station's own Wikipedia "Services"
# section).

[[stations]]
crs = "DLG"
tiploc = "DOLGARG"
role = "minor"
segment = "tfw-conwy-valley"
# Request stop.

[[stations]]
crs = "NLR"
tiploc = "NLANRST"
role = "minor"
segment = "tfw-conwy-valley"
# North Llanrwst: request stop, and the site of the line's only passing
# loop -- a working signal box here requires trains to stop and exchange
# tokens regardless of whether any passenger is boarding or alighting
# (confirmed via this station's own Wikipedia article). A distinct station
# from Llanrwst below, half a mile to the south; the original 1863 station
# for the town, per Llanrwst railway station's own Wikipedia article.

[[stations]]
crs = "LWR"
tiploc = "LNRWST"
role = "major"
segment = "tfw-conwy-valley"
# Llanrwst: opened by British Rail in 1989 to serve the town centre
# directly; a scheduled stop, not a request stop.

[[stations]]
crs = "BYC"
tiploc = "BETSYCD"
role = "major"
segment = "tfw-conwy-valley"
# Betws-y-Coed: a scheduled stop (not request), and the line's principal
# intermediate destination -- described on its own Wikipedia article as
# "an important tourist village" and bus interchange for Snowdonia
# National Park Sherpa services.

[[stations]]
crs = "PYP"
role = "minor"
segment = "tfw-conwy-valley"
# Pont-y-Pant: request stop. CRS confirmed via Wikipedia only -- see the
# sourcing note above.

[[stations]]
crs = "DWD"
tiploc = "DLWYDLN"
role = "minor"
segment = "tfw-conwy-valley"
# Dolwyddelan: request stop.

[[stations]]
crs = "RMB"
role = "minor"
segment = "tfw-conwy-valley"
# Roman Bridge: request stop. CRS confirmed via Wikipedia only -- see the
# sourcing note above.

[[stations]]
crs = "BFF"
tiploc = "BLAENAU"
role = "terminus"
segment = "tfw-conwy-valley"
# Blaenau Ffestiniog: terminus, and the interchange with the heritage
# narrow-gauge Ffestiniog Railway.

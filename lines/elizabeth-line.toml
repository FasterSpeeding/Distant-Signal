id = "elizabeth-line"
name = "Elizabeth line"
mode = "national-rail"
category = "commuter"
operators = ["XR"]

destination_crs_filter = ["ABW", "PAD", "RDG", "MAI", "HXX", "HWV", "SNF", "SRA"]
sample_stations = ["RDG", "PAD", "LST", "ABW"]
match_keywords = ["Elizabeth line", "Crossrail"]

# Metro frequencies through the core (up to 24 tph): a 4-minute delay on a
# service every 2-3 minutes is already a degraded railway, so the thresholds
# match Thameslink's rather than the main-line defaults.
[severity_overrides]
minor_delays_pct = 0.20
delay_threshold_minutes = 4

# Reading to Abbey Wood, ordered west to east. The two other arms are separate
# definitions sharing the XR operator code: `elizabeth-heathrow` (diverges at
# Hayes & Harlington, so it shares `elizabeth-trunk-west` and
# `elizabeth-central`) and `elizabeth-shenfield` (diverges east of
# Whitechapel, so it shares `elizabeth-central` only).
#
# TIPLOCs are given only where verified. The central-section stations have
# their own TIPLOCs distinct from the National Rail surface stations of the
# same name (Paddington, Liverpool Street), so they are left unset rather than
# risk correlating against the wrong platforms.
[[stations]]
crs = "RDG"
tiploc = "RDNGSTN"
role = "terminus"
segment = "elizabeth-west"

[[stations]]
crs = "TWY"
role = "minor"
segment = "elizabeth-west"

[[stations]]
crs = "MAI"
role = "minor"
segment = "elizabeth-west"

[[stations]]
crs = "TAP"
role = "minor"
segment = "elizabeth-west"
# Taplow: real, currently-served Elizabeth line stop between Maidenhead and
# Slough, missing from the original catalogue — a data-driven audit against
# real CIF schedule calling-point data found it touched by ~100-394 of ~930
# relevant services (also BNM/SLO-side LNY/IVR below); confirmed against
# Wikipedia and TfL's own official timetable.

[[stations]]
crs = "BNM"
role = "minor"
segment = "elizabeth-west"
# Burnham: see Taplow's note above.

[[stations]]
crs = "SLO"
tiploc = "SLOUGH"
role = "major"
segment = "elizabeth-west"

[[stations]]
crs = "LNY"
role = "minor"
segment = "elizabeth-west"
# Langley: real, currently-served Elizabeth line stop between Slough and West
# Drayton, missing from the original catalogue — see Taplow's note above for
# the same data-driven audit and sourcing.

[[stations]]
crs = "IVR"
role = "minor"
segment = "elizabeth-west"
# Iver: see Langley's note above.

[[stations]]
crs = "WDT"
role = "minor"
segment = "elizabeth-west"

[[stations]]
crs = "HAY"
role = "junction"
segment = "elizabeth-trunk-west"
# Heathrow branch diverges here; Reading services carry on west, which is why
# the trunk starts at this junction rather than after it

[[stations]]
crs = "STL"
role = "minor"
segment = "elizabeth-trunk-west"

[[stations]]
crs = "HAN"
role = "minor"
segment = "elizabeth-trunk-west"
# Hanwell: real, currently-served Elizabeth line stop between Southall and
# Ealing Broadway, missing from the original catalogue — a data-driven audit
# against real CIF schedule calling-point data confirmed it (also WEA/AML
# below); confirmed against Wikipedia and TfL's own official timetable.
# Shared `elizabeth-trunk-west` segment with elizabeth-heathrow.toml — added
# there identically to keep the two files' shared rows in sync (this
# catalogue's established convention, e.g. gwr-cornish-main-line.toml's and
# cross-country.toml's shared `xc-south-west` segment rows).

[[stations]]
crs = "WEA"
role = "minor"
segment = "elizabeth-trunk-west"
# West Ealing: see Hanwell's note above.

[[stations]]
crs = "EAL"
role = "major"
segment = "elizabeth-trunk-west"

[[stations]]
crs = "AML"
role = "minor"
segment = "elizabeth-trunk-west"
# Acton Main Line: real, currently-served Elizabeth line stop between Ealing
# Broadway and Paddington — see Hanwell's note above for the same
# data-driven audit, sourcing and cross-file sync convention.

[[stations]]
crs = "PAD"
role = "major"
segment = "elizabeth-central"
# Trains enter the tunnels west of Paddington; everything below is the core

[[stations]]
crs = "BDS"
role = "major"
segment = "elizabeth-central"

[[stations]]
crs = "TCR"
role = "major"
segment = "elizabeth-central"

[[stations]]
crs = "ZFD"
role = "major"
segment = "elizabeth-central"
# Interchange with the Thameslink core, but separate tracks: deliberately not
# on the `thameslink-core` segment, so incidents don't cross-propagate.

[[stations]]
crs = "LST"
role = "major"
segment = "elizabeth-central"

[[stations]]
crs = "ZLW"
role = "junction"
segment = "elizabeth-central"
# Shenfield branch diverges east of here

[[stations]]
crs = "CWX"
role = "major"
segment = "elizabeth-south-east"
# Canary Wharf. Previously catalogued as "ZCW" (Canada Water), a different
# London Overground/Jubilee line station the Elizabeth line does not serve —
# corrected by a data-driven CRS audit against the bulk stanox-crs dataset,
# `/api/stations?q=`, Wikipedia and real CIF schedule calling-point data, all
# of which place the Whitechapel-to-Custom House Elizabeth line stop at
# Canary Wharf (CWX), not Canada Water.

[[stations]]
crs = "CUS"
role = "minor"
segment = "elizabeth-south-east"

[[stations]]
crs = "WWC"
role = "major"
segment = "elizabeth-south-east"
# Woolwich. Previously catalogued as "WWA" (Woolwich Arsenal), a physically
# separate Southeastern/DLR station ~200m away — corrected by the same
# data-driven CRS audit described above (bulk stanox-crs dataset,
# `/api/stations?q=`, Wikipedia, real CIF schedule calling-point data): the
# Custom House-to-Abbey Wood Elizabeth line stop is Woolwich (WWC).

[[stations]]
crs = "ABW"
role = "terminus"
segment = "elizabeth-south-east"

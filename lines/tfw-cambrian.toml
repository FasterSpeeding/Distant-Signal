id = "tfw-cambrian"
name = "Cambrian Line"
mode = "national-rail"
category = "regional"
operators = ["AW"]

destination_crs_filter = ["AYW", "PWL", "SHR"]
sample_stations = ["SHR", "MCN", "AYW", "PWL"]
match_keywords = ["Cambrian Line", "Cambrian Coast Line"]

# `destination_crs_filter` direction-coverage note (final review Important
# #3): the original two-entry filter (`AYW`, `PWL`) only matched westbound
# departures at Shrewsbury/Machynlleth heading out to the branch termini --
# a departure FROM `AYW` or `PWL` heading back east has destination `SHR`
# (or, on some through workings, further towards Birmingham), which the
# original filter silently dropped. This is a genuine Y-shaped dead-end line
# like `tfw-conwy-valley.toml`, so that file's remedy (extend with the
# opposite-direction anchor) is the fit used here, rather than
# `tfw-marches.toml`'s omit-entirely remedy. Adding `SHR` is safe despite
# Shrewsbury also being served by `tfw-marches` and `tfw-heart-of-wales`:
# `destination_crs_filter` is only evaluated against departures sampled at
# this file's own `sample_stations` (`SHR`, `MCN`, `AYW`, `PWL`), and MCN/
# AYW/PWL are exclusive to this line -- no other catalogued line reaches
# them, so any AW departure there with destination `SHR` is unambiguously a
# Cambrian service. At `SHR` itself, a departure whose destination is also
# `SHR` is a logical impossibility (a train can't depart from and terminate
# at the same station), so including `SHR` in the filter has no effect
# there and can't misclassify a Marches or Heart of Wales departure as
# Cambrian. This still leaves a residual, smaller gap for any Cambrian
# through-working that continues past Shrewsbury to Birmingham without
# terminating at SHR (destination e.g. `BHM`/`BSI`) -- not closed here,
# since those codes aren't Cambrian-exclusive the way SHR's role in this
# filter is; left as a known residual rather than guessed at.

# Sourcing note (per the catalogue's "cross-checked against a second
# source" curation standard): every CRS code below was confirmed from that
# station's own Wikipedia infobox. Of those, SHR, WLP, NWT, CWS, MCN, DVY,
# AYW, AVY, ABH and BRM were additionally cross-checked against
# railwaycodes.org.uk and match exactly. The remaining codes -- BOW, BRH,
# TYW, FRB, MFA, HRL, PRH, MFF, PTM, CCC, PWL -- are Wikipedia-only so far;
# railwaycodes.org.uk's per-letter pages for those initials repeatedly
# rate-limited (HTTP 429) or truncated before reaching the relevant row
# during research. None of these are invented -- they're all directly
# read from a live source -- but a future editor should treat the
# Wikipedia-only subset as pending a full second-source pass rather than
# as fully cross-checked.

# Long single-track sections with limited passing loops. Aberystwyth branch
# runs near-hourly; the Pwllheli (Cambrian Coast) branch only every two
# hours, so a single cancellation is a bigger proportional hit than on a
# typical hourly rural line (cf. `northern-furness.toml`'s Furness Line
# rationale, which this mirrors).
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# Shrewsbury to Dovey Junction is the shared trunk; the line then splits at
# Dovey Junction into two branches: Aberystwyth (the "Cambrian Line" proper)
# and Pwllheli via the coast (the "Cambrian Coast Line"). Per the
# shared-trunk rule of thumb, Dovey Junction itself belongs to the trunk
# segment and each exclusive segment starts at the next station down each
# branch. No other line in this catalogue reaches Shrewsbury or shares this
# trunk yet, so `tfw-cambrian-trunk` is not (yet) a cross-file shared
# segment -- Task 11.5 (`tfw-marches.toml`, not yet written) is responsible
# for deciding whether to reuse this segment name at Shrewsbury.
#
# Station-catalogue completeness pass (Task 4.1, 2026-09-01): every coast-
# branch request-stop halt this file previously omitted for brevity --
# Penhelig, Tonfanau, Llwyngwril, Llanaber, Talybont, Dyffryn Ardudwy,
# Llanbedr, Pensarn, Llandanwg, Tygwyn, Talsarnau, Llandecwyn and Penychain
# -- is now confirmed open and listed below as its own `[[stations]]` entry
# (role = "minor"), each cross-checked CRS-code-against-a-second-source per
# this catalogue's sourcing bar (Wikipedia infobox/route-diagram, confirmed
# against that CRS's own `nationalrail.co.uk/stations/<crs>/details.html`
# page). `has_station`/`/stations/[crs]` lookups for any of these now
# resolve correctly instead of silently returning an empty disruption list.
#
# One candidate from the prior omissions list is deliberately NOT added:
# Llangelynin. Its own Wikipedia article states it is "Disused" -- closed
# 25 October 1991, "the line is still open, but trains no longer call at
# the station" -- corroborated by its absence from railwaycodes.org.uk's
# open-station listing for its initial letter and a 404 on National Rail
# Enquiries' station-details page for its former CRS. Unlike the other
# dozen halts above, this one isn't a currently-open station a passenger
# could look up, so adding it would be wrong, not merely incomplete.
#
# On the trunk, Shrewsbury-Machynlleth's several closed intermediate
# stations are confirmed gone entirely, not a missed-station gap: per the
# Cambrian Line's own Wikipedia route diagram, the only currently-open
# stations between Shrewsbury and Machynlleth are Welshpool, Newtown and
# Caersws (already listed below) -- every other former calling point on
# that stretch (Forden, Abermule, Moat Lane Junction, Carno, Talerddig,
# Llanbrynmair, Cemmes Road, and several more) closed in the 14 June 1965
# Beeching cuts and remains closed today (individually spot-checked via
# Abermule's and Carno's own Wikipedia articles); Carno has an active,
# not-yet-realised reopening campaign (reached stage 3 of Network Rail's
# New Stations Assessment Programme as of a September 2019 update) but
# isn't a currently-open station, so it stays out per this catalogue's
# "don't guess/anticipate" discipline.
#
# This file is "bundled": a shared trunk (Shrewsbury-Dovey Junction) plus
# two branches (Aberystwyth; the coast to Pwllheli) concatenated in one
# station list below, not a single continuous end-to-end route -- see the
# trunk/branch explanation above. A future reader relying on file order
# (e.g. for `stations_between`-style logic) should not assume consecutive
# entries are geographically adjacent across a branch boundary.
[[stations]]
crs = "SHR"
role = "junction"
segment = "tfw-cambrian-trunk"
# Shrewsbury is also a junction with the Welsh Marches Line and the
# Wolverhampton/Chester routes -- neither is in this catalogue yet.

[[stations]]
crs = "WLP"
role = "major"
segment = "tfw-cambrian-trunk"

[[stations]]
crs = "NWT"
role = "major"
segment = "tfw-cambrian-trunk"

[[stations]]
crs = "CWS"
role = "minor"
segment = "tfw-cambrian-trunk"

[[stations]]
crs = "MCN"
tiploc = "MCHYNLT"
role = "major"
segment = "tfw-cambrian-trunk"
# Machynlleth is TfW's Cambrian crew/train base; most through services
# join or divide their units here even though the physical track split is
# a few miles further on, at Dovey Junction.

[[stations]]
crs = "DVY"
tiploc = "DOVYJN"
role = "junction"
segment = "tfw-cambrian-trunk"
# Physical junction where the line splits. No road access; some services
# (notably certain Sunday workings) run Shrewsbury/Birmingham-Aberystwyth
# only and don't touch the coast branch at all.
#
# Sourcing note: the "split happens at Dovey Junction, not Machynlleth"
# fact -- the load-bearing decision behind where `tfw-cambrian-trunk` ends
# and the two branch segments begin -- is sourced from Dovey Junction's own
# Wikipedia article. railwaycodes.org.uk's CRS listing for DVY confirms the
# code/TIPLOC but carries no descriptive text about the junction's role,
# and Network Rail's route page for this line 404s, so this specific claim
# hasn't yet had an independent second-source confirmation, only a
# Wikipedia mirror (abcrailwayguide.uk) that itself cites Wikipedia as its
# source. Treat as high-confidence but not fully cross-checked.

# --- Aberystwyth branch (the "Cambrian Line" proper) ---

[[stations]]
crs = "BRH"
role = "minor"
segment = "tfw-cambrian-aberystwyth"
# Borth: corrected during the final whole-branch review (Important #1) from
# a prior mis-filing under the coast branch. Re-verified independently
# rather than applied on the review's say-so alone: this station's own
# Wikipedia infobox route diagram gives its preceding/following stations as
# Dovey Junction and Bow Street respectively, on the "Birmingham
# International-Aberystwyth" route -- i.e. Dovey Junction -> Borth -> Bow
# Street -> Aberystwyth, matching the ordering below. The Cambrian Coast
# Line's own separate Wikipedia article's calling points, by contrast, start
# Dovey Junction -> Aberdovey (`AVY`) -> Tywyn (`TYW`) -> ..., with no Borth
# -- confirming Borth was never a coast-branch station.

[[stations]]
crs = "BOW"
role = "minor"
segment = "tfw-cambrian-aberystwyth"
# Reopened February 2021 after closure in 1965.

[[stations]]
crs = "AYW"
role = "terminus"
segment = "tfw-cambrian-aberystwyth"

# --- Cambrian Coast Line (Dovey Junction to Pwllheli) ---

[[stations]]
crs = "PHG"
role = "minor"
segment = "tfw-cambrian-coast"
# Penhelig: unstaffed request stop on the eastern outskirts of Aberdyfi/
# Aberdovey, opened 1933. CRS confirmed via its own Wikipedia infobox
# (code = PHG) and cross-checked against nationalrail.co.uk/stations/phg/
# details.html ("Penhelig (PHG)").

[[stations]]
crs = "AVY"
role = "minor"
segment = "tfw-cambrian-coast"

[[stations]]
crs = "TYW"
role = "major"
segment = "tfw-cambrian-coast"
# Interchange with the heritage narrow-gauge Talyllyn Railway.

[[stations]]
crs = "TNF"
role = "minor"
segment = "tfw-cambrian-coast"
# Tonfanau. Request stop. CRS confirmed via Wikipedia infobox (code = TNF),
# cross-checked against nationalrail.co.uk/stations/tnf/details.html.

[[stations]]
crs = "LLW"
role = "minor"
segment = "tfw-cambrian-coast"
# Llwyngwril. Request stop. CRS confirmed via Wikipedia infobox
# (code = LLW), cross-checked against nationalrail.co.uk/stations/llw/
# details.html. Llangelynin, the closed former station between Tonfanau
# and here, is deliberately not listed -- see the sourcing note above.

[[stations]]
crs = "FRB"
role = "minor"
segment = "tfw-cambrian-coast"

[[stations]]
crs = "MFA"
role = "minor"
segment = "tfw-cambrian-coast"
# Request stop. Formerly "Barmouth Junction" -- the closed line to Ruabon
# via Bala diverged here; today it's a through station only.

[[stations]]
crs = "BRM"
role = "major"
segment = "tfw-cambrian-coast"

[[stations]]
crs = "LLA"
role = "minor"
segment = "tfw-cambrian-coast"
# Llanaber. Request stop. CRS confirmed via Wikipedia infobox (code = LLA),
# cross-checked against nationalrail.co.uk/stations/lla/details.html.

[[stations]]
crs = "TLB"
role = "minor"
segment = "tfw-cambrian-coast"
# Talybont (Gwynedd). Request stop. CRS confirmed via Wikipedia infobox
# (code = TLB), cross-checked against nationalrail.co.uk/stations/tlb/
# details.html.

[[stations]]
crs = "DYF"
role = "minor"
segment = "tfw-cambrian-coast"
# Dyffryn Ardudwy. Request stop. CRS confirmed via Wikipedia infobox
# (code = DYF), cross-checked against nationalrail.co.uk/stations/dyf/
# details.html.

[[stations]]
crs = "LBR"
role = "minor"
segment = "tfw-cambrian-coast"
# Llanbedr. Request stop. CRS confirmed via Wikipedia infobox (code = LBR),
# cross-checked against nationalrail.co.uk/stations/lbr/details.html.

[[stations]]
crs = "PES"
role = "minor"
segment = "tfw-cambrian-coast"
# Pensarn (Gwynedd) -- distinct from the other Pensarn near Abergele on the
# North Wales Coast Line. Request stop. CRS confirmed via Wikipedia infobox
# (code = PES), cross-checked against nationalrail.co.uk/stations/pes/
# details.html ("Pensarn (Gwynedd) (PES)").

[[stations]]
crs = "LDN"
role = "minor"
segment = "tfw-cambrian-coast"
# Llandanwg. Request stop. CRS confirmed via Wikipedia infobox
# (code = LDN), cross-checked against nationalrail.co.uk/stations/ldn/
# details.html.

[[stations]]
crs = "HRL"
role = "major"
segment = "tfw-cambrian-coast"

[[stations]]
crs = "TYG"
role = "minor"
segment = "tfw-cambrian-coast"
# Tygwyn. Request stop. CRS confirmed via Wikipedia infobox (code = TYG),
# cross-checked against nationalrail.co.uk/stations/tyg/details.html.

[[stations]]
crs = "TAL"
role = "minor"
segment = "tfw-cambrian-coast"
# Talsarnau. Request stop. CRS confirmed via Wikipedia infobox

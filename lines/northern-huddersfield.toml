id = "northern-huddersfield"
name = "Huddersfield Line"
mode = "national-rail"
category = "regional"
operators = ["NT"]

# --- Split out of `northern.toml` (Yorkshire real-world-sanity review,
# 2026-09-21) ---
# `northern.toml` (the "operator" catch-all) used to include a Stalybridge-
# Huddersfield-Dewsbury fragment on its own `northern-transpennine` segment,
# with no station list continuing it to either genuine end of the real
# route -- an unconnected stub, not a real, complete line. This file gives
# that real corridor -- the Huddersfield line proper, Manchester Victoria to
# Leeds -- its own genuine, complete station list and a correct name. It is
# ADDITIVE: `northern.toml` itself is deliberately left unchanged (still
# carrying its own SYB/HUD/DEW entries on `northern-transpennine`) rather
# than having those stations removed, because `northern-transpennine` is not
# shared with any other file in this catalogue and removing it risked no
# regression, but this file's own station list is far more complete (it
# fills in Mossley, Greenfield, Marsden, Slaithwaite, Deighton, Mirfield,
# Ravensthorpe, Batley, Morley and Cottingley, none of which `northern.toml`
# ever listed) and gives this real route a correct, dedicated name -- see
# `northern.toml`'s own updated top-of-file comment for the fuller
# restructuring decision.
#
# Route and CRS verification: Wikipedia's own "Huddersfield line" article
# (fetched 2026-09-21) gives the full historical route list Manchester
# Victoria-Stalybridge-Huddersfield-Leeds; each named station was
# cross-checked against https://ds.cursed.solutions/api/stations?q=<name>
# to confirm it is still open today. Several historical stops on the
# article's own list are CLOSED and correctly omitted below: Manchester
# Exchange, Miles Platting, Park, Clayton Bridge and Droylsden (all on the
# Manchester Victoria-Ashton-under-Lyne stretch); Saddleworth, Diggle,
# Golcar and Longwood & Milnsbridge (all on the Stalybridge-Huddersfield
# stretch); and Bradley (Huddersfield-Leeds stretch) -- none returned a
# result from the stations API, confirming no live CRS/current service
# exists for any of them. The remaining, currently-open stations below all
# returned exactly one unambiguous result each. TIPLOCs omitted throughout
# -- none confirmed to a second source this session.
#
# Electrification: per Wikipedia's own article, this line "is currently
# subject to the Transpennine Route Upgrade" with full electrification
# proposed but not yet complete/funded to a confirmed date -- kept
# "regional" rather than "commuter" for the same reason
# `northern-harrogate-line.toml` was (see that file's own category-check
# comment): not yet electrified end to end, despite reasonable frequency.
#
# --- Operator mix and segment/overlap decisions ---
# Per the same article, "TransPennine Express (TPE) operate the majority of
# the passenger services" on this line today, with Northern providing local
# stopping services -- this file models Northern's own `NT` service only,
# matching this catalogue's one-operator-per-file convention elsewhere
# (`hull-trains.toml` vs `lner-hull.toml` on the same King's Cross-Hull
# track, `northern-harrogate-line.toml` vs `lner-leeds.toml`'s Harrogate
# workings). `tpe-north.toml` already covers TPE's own Manchester
# Victoria-Huddersfield-Leeds-York-Newcastle "North" route over the same
# physical track (MCV/HUD/LDS all appear there too, on that file's own
# single `tpe-north` segment) -- per this catalogue's established
# cross-operator convention, station-overlap only, no segment name shared
# with that file.
#
# MIR (Mirfield) is also a `grand-central-bradford.toml` station (that
# file's own `gc-bradford` segment) -- a different physical approach
# (Grand Central's own Bradford-Wakefield-Doncaster-London route), so
# station-overlap only, no segment shared.
#
# MCV (Manchester Victoria) is also a station on `northern.toml`,
# `northern-blackpool.toml`, `northern-clitheroe.toml`,
# `northern-manchester-southport.toml` and `northern-wigan-kirkby.toml` --
# each of those departs Manchester Victoria via a different physical route
# (the West/North-West corridors, not this line's own Ashton-under-Lyne/
# Stalybridge approach), so station-overlap only, matching this catalogue's
# standing precedent for MCV throughout ("station overlap is fine,
# segment-sharing is a deliberate choice").
#
# DEW (Dewsbury) and HUD (Huddersfield) are also `northern.toml` stations
# on that file's own `northern-transpennine` segment -- see the top-of-file
# note above for why that overlap is deliberately left as station-overlap
# only (not merged into one file, not segment-shared) rather than fixed by
# editing `northern.toml`.
#
# LDS (Leeds) is station-overlap-only with every other Leeds-terminating
# file in this catalogue (`northern-airedale.toml`/`northern-wharfedale.
# toml`'s `northern-shipley-trunk`, `lner-leeds.toml`, `northern-harrogate-
# line.toml`, `northern-leeds-selby.toml`, `northern-wakefield-line.toml`,
# `northern.toml`'s own `northern-yorkshire`, `tpe-north.toml`), each a
# physically distinct approach into the same station -- this file's own
# entry keeps its own exclusive segment name throughout.
#
# Every station below uses this file's own single exclusive segment,
# `northern-huddersfield` -- no genuine, currently-modelled
# same-operator physical track-sharing was found anywhere on this route.
sample_stations = ["MCV", "HUD", "DEW", "LDS"]
destination_crs_filter = ["MCV", "LDS"]
match_keywords = ["Huddersfield line"]
# The line's own branded/article name. Grepped clean against every other
# file's own `match_keywords` before adding.

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10
# Local stopping service sharing infrastructure with TPE's own faster
# service -- tuned thresholds following `northern-harrogate-line.toml`'s
# comparable-density precedent (that file left thresholds at catalogue
# defaults; this file's own service is somewhat sparser end-to-end with a
# genuine trans-Pennine hill section, so the same lighter tuning as
# `northern-buxton-line.toml` is used instead).

[[stations]]
crs = "MCV"
role = "terminus"
segment = "northern-huddersfield"

[[stations]]
crs = "AHN"
role = "minor"
segment = "northern-huddersfield"
# Ashton-under-Lyne.

[[stations]]
crs = "SYB"
role = "major"
segment = "northern-huddersfield"
# Stalybridge -- also a `northern.toml` station on that file's own
# `northern-transpennine` segment; see the top-of-file note above.

[[stations]]
crs = "MSL"
role = "minor"
segment = "northern-huddersfield"
# Mossley -- previously absent catalogue-wide; CRS confirmed distinct from
# Mossley Hill (MSH, Liverpool) via ds.cursed.solutions/api/stations.

[[stations]]
crs = "GNF"
role = "minor"
segment = "northern-huddersfield"
# Greenfield -- previously absent catalogue-wide.

[[stations]]
crs = "MSN"
role = "minor"
segment = "northern-huddersfield"
# Marsden (Yorks) -- CRS confirmed distinct from any other Marsden via
# ds.cursed.solutions/api/stations.

[[stations]]
crs = "SWT"
role = "minor"
segment = "northern-huddersfield"
# Slaithwaite.

[[stations]]
crs = "HUD"
role = "junction"
segment = "northern-huddersfield"
# Huddersfield -- also a `northern.toml` (`northern-transpennine`),
# `northern-penistone.toml` and `tpe-north.toml` station; see the
# top-of-file note above. Tagged `junction`: the Penistone line diverges
# south here (see `northern-penistone.toml`'s own header comment).

[[stations]]
crs = "DHN"
role = "minor"
segment = "northern-huddersfield"
# Deighton.

[[stations]]
crs = "MIR"
role = "minor"
segment = "northern-huddersfield"
# Mirfield -- also a `grand-central-bradford.toml` station; see the
# top-of-file note above.

[[stations]]
crs = "RVN"
role = "minor"
segment = "northern-huddersfield"
# Ravensthorpe.

[[stations]]
crs = "DEW"
role = "major"
segment = "northern-huddersfield"
# Dewsbury -- also a `northern.toml` station on that file's own
# `northern-transpennine` segment; see the top-of-file note above.

[[stations]]
crs = "BTL"
role = "minor"
segment = "northern-huddersfield"
# Batley -- previously absent catalogue-wide.

[[stations]]
crs = "MLY"
role = "minor"
segment = "northern-huddersfield"
# Morley -- previously absent catalogue-wide.

[[stations]]
crs = "COT"
role = "minor"
segment = "northern-huddersfield"
# Cottingley -- previously absent catalogue-wide. Not to be confused with
# Cottingham (CGM) near Hull, on `hull-trains.toml`/`northern-hull-
# scarborough.toml` -- a different, similarly-named station.

[[stations]]
crs = "LDS"
tiploc = "LEEDS"
role = "terminus"
segment = "northern-huddersfield"
# Leeds -- station-overlap only with several other files; see the
# top-of-file note above.

id = "swr-south-west-main"
name = "South West Main Line"
mode = "national-rail"
category = "main-line"
operators = ["SW"]

# When sampling at trunk stations, only count services destined for stations on this line.
destination_crs_filter = ["WEY", "POO", "BMH", "SOU", "WIN", "BSK"]

# exclusive segment — gives a clean read of SWML-only services
sample_stations = ["WIN", "SOU", "BMH"]

match_keywords = [
  "South West Main Line",
  "SWML",
  "Bournemouth line",
  "Weymouth line",
]

# Trunk segments (swr-trunk-waterloo) appear in multiple SWR line definitions
# and the matcher treats incidents there as "shared trunk" events affecting all
# lines that use them. Stations south of Basingstoke are exclusive to this line
# (the Bournemouth/Weymouth corridor).
#
# DATA-AUDIT SCOPE DECISION: a data-driven schedule audit (real CIF touch
# rates) found this file previously modelled only the fast-pattern
# Winchester/Southampton/Bournemouth/Poole/Weymouth stops, with the New
# Forest/Southampton-suburbs semi-fast stopping pattern largely absent. As
# with swr-portsmouth-direct.toml (same audit, same judgment call), this
# file's own header comment never declared "fast trains only" as a
# deliberate scope boundary, so the two highest-confidence, major-station
# gaps are added below:
#   - Southampton Airport Parkway (SOA): 100% (65/65) of journeys, between
#     Winchester and Southampton.
#   - Brockenhurst (BCU): 95% (69/73) of journeys, between Southampton and
#     Bournemouth.
# CRS/TIPLOC confirmed via Wikidata's "TIPLOC code" property for each
# station.
#
# NOT added - touch rates here are all well under 50%, suggesting these are
# more likely a genuinely different/slower stopping service pattern than
# this file's fast route, not a confirmed gap in this line's own coverage:
#   New Milton / Christchurch (49% each), Pokesdown (47%), Totton (40%),
#   Sway / Hinton Admiral (36% each), Ashurst New Forest (33%), Eastleigh
#   (28%), Shawford (25%), Beaulieu Road (12%), St Denys (9%), Swaythling
#   (6%), Redbridge (3%). Left for a future task to confirm (or model as a
#   separate stopping-service line) with dedicated research, rather than
#   guessed at here.
#
# REAL-WORLD-SANITY REVIEW ADDITION: this file previously jumped straight
# from Poole to Weymouth, skipping Wareham and Dorchester South - both
# real, currently-served stations on this exact stretch that were absent
# catalogue-wide (grepped clean before adding). CRS codes verified live
# against https://ds.cursed.solutions/api/stations: Wareham (Dorset) =
# WRM, Dorchester South = DCH (distinct from Dorchester West, DCW, on the
# separate Heart of Wessex line via Yeovil - gwr-heart-of-wessex.toml, not
# this route). Station order Poole - Wareham - Dorchester South - Weymouth
# matches the line's own well-known real-world calling pattern. Wool,
# Moreton and Upwey also sit on this stretch (all served, per National
# Rail) but were not part of this task's brief and are left as a further,
# smaller documented gap rather than guessed at.
[[stations]]
crs = "WAT"
tiploc = "WATRLMN"
role = "terminus"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "CLJ"
tiploc = "CLPHMJ1"
role = "junction"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "WIM"
tiploc = "WDON"
role = "major"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "SUR"
tiploc = "SURBITN"
role = "junction"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "WOK"
tiploc = "WOKING"
role = "junction"
segment = "swr-trunk-waterloo"

[[stations]]
crs = "BSK"
tiploc = "BSNGSEB"
role = "junction"
segment = "swr-swml-south"

[[stations]]
crs = "WIN"
tiploc = "WNCHSTR"
role = "major"
segment = "swr-swml-south"

[[stations]]
crs = "SOA"
tiploc = "SOTPKWY"
role = "minor"
segment = "swr-swml-south"

[[stations]]
crs = "SOU"
tiploc = "SOTON"
role = "major"
segment = "swr-swml-south"

# UPDATE (SWR suburban-gap batch): role corrected from "minor" to
# "junction", and segment changed from `swr-swml-south` to a new, narrower
# `swr-brockenhurst-junction` - Brockenhurst is the real junction where
# `swr-lymington-branch.toml` (Lymington Town/Lymington Pier) leaves this
# line, per that file's own sourcing. A new segment name (rather than
# reusing `swr-swml-south` wholesale) keeps Winchester/Southampton/
# Bournemouth/Poole/Weymouth below correctly exclusive to this file - the
# same precise-blast-radius approach used for AHV/AHT in
# swr-alton.toml/swr-ascot-aldershot.toml (this same batch).
[[stations]]
crs = "BCU"
tiploc = "BKNHRST"
role = "junction"
segment = "swr-brockenhurst-junction"

[[stations]]
crs = "BMH"
tiploc = "BOMO"
role = "major"
segment = "swr-swml-south"

[[stations]]
crs = "POO"
tiploc = "POOLE"
role = "minor"
segment = "swr-swml-south"

[[stations]]
crs = "WRM"
role = "minor"
segment = "swr-swml-south"
# Wareham (Dorset). Added by the real-world-sanity review - see the
# DATA-AUDIT SCOPE DECISION note above.

[[stations]]
crs = "DCH"
role = "minor"
segment = "swr-swml-south"
# Dorchester South. Distinct from Dorchester West (DCW), on the separate
# Heart of Wessex line - see the note above.

[[stations]]
crs = "WEY"
tiploc = "WEYMTH"
role = "terminus"
segment = "swr-swml-south"

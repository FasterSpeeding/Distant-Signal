id = "gwr-looe-valley"
name = "Looe Valley Line"
mode = "national-rail"
category = "regional"
operators = ["GW"]

# Devon/Cornwall branch-line batch: full UK station-coverage audit found this
# real, currently-open GWR branch (Liskeard - Coombe Junction Halt - Looe)
# entirely missing from the catalogue. Wikipedia "Looe Valley Line" infobox:
# operator GWR, "Community railway" character, 8¾ miles, single track
# throughout, Class 150 stock, opened 1860-1901.
#
# Category: "regional", matching this catalogue's precedent for a short,
# single-track, community-rail-branded rural branch (`northern-furness.toml`,
# `scotrail-kyle.toml`) rather than "commuter" or "main-line" -- confirmed by
# Wikipedia's own "community railway" framing, not assumed.

# Exclusive-segment stations only (mirrors `gwr-cornish-main-line.toml`'s
# sample_stations rationale). Liskeard is the shared junction with the
# Cornish Main Line, so it's deliberately left off in favour of stations only
# this line reaches.
sample_stations = ["COE", "SDP", "LOO"]

# Liskeard (LSK) is also a `gwr-cornish-main-line.toml` sample/CRS entry.
# `destination_crs_filter` disambiguates this branch's own LDBWS departures
# (bound for LOO) from Cornish Main Line services calling at Liskeard,
# mirroring `scotrail-ayrshire.toml`'s identical use of the field at GLC.
destination_crs_filter = ["LOO"]

match_keywords = ["Looe Valley Line"]
# One high-precision phrase -- the line's own branded/article name (Wikipedia
# article title and lead: "The Looe Valley Line is an 8¾ mi community
# railway from Liskeard to Looe"). Grepped `lines/*.toml` before starting:
# no other file uses "Looe" in `match_keywords`.

# Single track throughout, one train per hour or worse for most of the day
# (15 trains/day Mon-Sat, 8/day Sundays April-October per Wikipedia's own
# "Services" section -- see Sources), plus the Coombe Junction Halt reversal
# noted below, which makes a single delay easy to compound. Same tuned
# thresholds as `northern-furness.toml`/`scotrail-kyle.toml`'s comparable
# rural single-track branches.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# === Coombe Junction Halt: real, but genuinely thin (per the audit's own
#     flag) ===
#
# Coombe Junction Halt (CRS COE) is not a normal request stop. Wikipedia's
# own "Coombe Junction Halt" article, fetched directly for this task:
# "Most trains change direction here, the train's guard operating the points
# using the ground frame, but a few in each direction continue a few yards
# further to call at Coombe Junction Halt" -- i.e. nearly every service
# reverses direction at this location, but only "just two trains a day in
# each direction Monday-Saturday" (no Sunday service) actually stop to allow
# passengers on or off. This file lists it as a genuine, currently-open,
# currently-served station (two-source confirmed: Wikipedia + the CRS
# lookup below), but documents this thin, reversal-only character explicitly
# rather than implying it behaves like the line's other request stops.
#
# All other intermediate stations (St Keyne Wishing Well Halt, Causeland,
# Sandplace) are genuine passenger request stops per the same article:
# "passengers alighting must tell the guard that they wish to do so, and
# those waiting to join must signal clearly to the driver as the train
# approaches."

[[stations]]
crs = "LSK"
role = "junction"
segment = "gwr-looe-valley"
# Liskeard: the real junction with the Cornish Main Line. Also a station
# entry (role "minor", segment "gwr-cornish-main-line") in
# `gwr-cornish-main-line.toml` -- station overlap only, per this catalogue's
# established convention (`xc-south-coast.toml`/`xc-manchester.toml`
# precedent, also followed by `scotrail-ayrshire.toml`'s GLC note): no
# shared-segment name is reused here, since the two lines' own physical
# routes diverge immediately past Liskeard and no source establishes
# further genuine track-sharing beyond both starting from the same station.

[[stations]]
crs = "COE"
role = "minor"
segment = "gwr-looe-valley"
# Coombe Junction Halt: real reversal point, thin calling pattern -- see the
# dedicated comment above.

[[stations]]
crs = "SKN"
role = "minor"
segment = "gwr-looe-valley"
# St Keyne Wishing Well Halt: request stop.

[[stations]]
crs = "CAU"
role = "minor"
segment = "gwr-looe-valley"
# Causeland: request stop. Per Wikipedia, "the oldest station on the line as
# it was opened in 1879."

[[stations]]
crs = "SDP"
role = "minor"
segment = "gwr-looe-valley"
# Sandplace: request stop.

[[stations]]
crs = "LOO"
role = "terminus"
segment = "gwr-looe-valley"
# Looe: this line's own terminus.

# === Sources (cross-checked per this batch's Global Constraints) ===
#
# Route structure, operator, character:
#   - Wikipedia "Looe Valley Line" (infobox + lead, fetched fresh for this
#     task): operator GWR, "Community railway" character, single track,
#     8¾ miles, opened 1860-1901; ordered station list Liskeard - Coombe
#     Junction Halt - St Keyne Wishing Well Halt - Causeland - Sandplace -
#     Looe (6 stations, matching the infobox `stations = 6` field); "In May
#     2019 Great Western Railway introduced an improved timetable which saw
#     15 trains a day run on the line Monday to Saturday and 8 on Sundays
#     from April until October" -- basis for this file's severity tuning.
#   - Wikipedia "Coombe Junction Halt" (fetched independently, own article):
#     confirms the reversal mechanics and the two-trains-a-day, no-Sunday
#     calling pattern quoted above; confirms request-stop status of every
#     other intermediate station via the same guard-signalling procedure
#     description.
#
# CRS codes: every code below was verified live against
# `https://ds.cursed.solutions/api/stations?q=<name>` during this task --
# LSK "Liskeard", COE "Coombe Junction Halt", SKN "St Keyne Wishing Well
# Halt", CAU "Causeland", SDP "Sandplace", LOO "Looe". All matched with no
# discrepancies.
#
# TIPLOCs are omitted throughout: none were confirmed against a live source
# during this task, matching this batch's optional-field convention.
#
# === Scope boundaries (documented, not modelled) ===
#
# - Moorswater, Lodge Farm Level Crossing, Terras Level Crossing, Buller
#   Quay: these appear on the Looe Valley Line's own route-diagram template
#   as historical infrastructure/former terminus points south of Liskeard,
#   but none is a currently-open, currently-served CRS-bearing passenger
#   station -- not modelled, per this batch's real-and-served-only bar.
# - The Cornish Main Line itself (Liskeard onward to Penzance): already
#   catalogued in `gwr-cornish-main-line.toml`; not re-derived here beyond
#   the station-overlap note above.

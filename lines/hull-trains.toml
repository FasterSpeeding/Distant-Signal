id = "hull-trains"
name = "Hull Trains"
mode = "national-rail"
category = "regional"
operators = ["HT"]
# Open-access operator (outside the 2024 Act nationalisation programme —
# pays track access charges and takes full commercial risk, per the
# gap-analysis document's "Open access operators" section). Reporting mark
# `HT` confirmed via railwaycodes.org.uk's own operator-code table ("Hull
# Trains Company / Hull Trains, First Hull Trains, 24 September 2000 to
# date") and cross-checked against Wikipedia's "Hull Trains" article
# infobox, which gives the same reporting mark.
#
# Distinct from LNER's own, separate, much sparser King's Cross-Hull
# working (operator `GR`, 1 train per day, `lner-hull.toml`, Task 6.3) —
# both terminate at Hull Paragon and share several ECML/Selby-line
# stations, but they are different operators/files, per that file's own
# comment and the gap analysis's framing of Grand Central/Hull Trains/Lumo
# as each their own file rather than folded into LNER's.

sample_stations = ["BUH", "HUL", "BEV"]
# One representative intermediate station plus the terminus for each of
# this file's two calling patterns (Hull Paragon-terminating and
# Beverley-extended), so LDBWS sampling covers both.
destination_crs_filter = ["HUL", "BEV"]

match_keywords = ["Hull Trains"]
# The operator's own brand name; unlike Grand Central's "Grand Central"
# (which collides with Birmingham New Street's shopping centre of the same
# name) or LNER's "Hull line"/"Selby line" (shared with Northern, TPE and
# this same operator), "Hull Trains" is a distinctive company name with no
# known false-positive collision, so no `excluded_keywords` veto is added.

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10
# Same values as the other open-access ECML operator files
# (`grand-central.toml`, and the LNER branch files) — long-distance service
# where a single cancellation is a bigger share of the day's service than
# on a metro-frequency line. Hull Trains' own combined frequency (7 trains
# per day each way in total, see below) is comparable to Grand Central's
# Sunderland route (6 tpd), which uses the same override values.

# ---------------------------------------------------------------------
# Route research (verified against two independent sources each; see the
# station-level comments below for individual CRS-code citations).
#
# Current route, "as of December 2025" per Wikipedia's "Hull Trains"
# article services table:
# - London King's Cross to Hull Paragon: 5 trains per day (4 on Sundays),
#   calling at Stevenage (limited — southbound only, set-down only on
#   Sundays), Grantham, Retford, Doncaster, Selby, Howden, Brough.
# - London King's Cross to Beverley: 2 trains per day, via the same
#   calling points as above, then continuing beyond Hull Paragon to
#   Cottingham and Beverley.
# Notably, Peterborough is NOT a Hull Trains calling point (absent from
# the services table) — cross-checked against Wikipedia's "Peterborough
# railway station" article, which lists LNER/Great Northern/CrossCountry/
# EMR/Greater Anglia as operators serving Peterborough but does not
# mention Hull Trains.
#
# This directly answers the gap-analysis document's "(recently expanded)"
# note on Hull Trains, which was a pointer to go verify, not a citable
# route detail on its own: the expansion is the Beverley extension, added
# incrementally to the pre-existing Hull Paragon service — one weekday
# service extended to Beverley from 4 February 2015, a weekend extension
# from December 2015, and a second daily weekday extension from May 2019
# (bringing the current total to 2 trains per day each way running through
# to Beverley). Confirmed via Wikipedia's "Hull Trains" article and
# independently cross-checked against Wikipedia's "Beverley railway
# station" article ("commenced operations to this station on 4 February
# 2015 with one service per weekday... since May 2019, this has been
# increased to two trains per day") and Wikipedia's "Cottingham railway
# station" article ("From 21 May 2017, the station began being served by
# one Hull Trains service... since May 2019, this has been increased to
# two trains per day") — three independent Wikipedia articles agree on the
# same May 2019 increase to 2 tpd. The route is not otherwise extended
# beyond Beverley (e.g. no Bridlington/Scarborough extension) — the
# services table above lists Beverley as the only terminus beyond Hull
# Paragon.
#
# Combined frequency cross-check: 5 (Hull-terminating) + 2 (Beverley) = 7
# trains per day each way, matching Wikipedia's "Hull Paragon Interchange"
# article's independent statement of "a weekday service of seven trains in
# each direction to London King's Cross" for Hull Trains.
#
# Modelled as one file with an internal main segment (King's Cross to Hull
# Paragon, carrying all services) and one internal branch segment
# (Cottingham/Beverley, carrying only the extended workings) — the same
# self-contained trunk+branch structure `grand-central.toml` uses for its
# own two genuinely diverging routes, except here the "branch" is a service
# extension past a shared terminus rather than a fork partway along the
# route. Per the task brief's standalone-operator exception (same as
# `grand-central.toml`'s own precedent for its relationship to LNER), NO
# segment name here is shared with any `lner-*.toml` file and NO
# shared-trunk regression test against LNER is included below — station-
# level overlap (Stevenage, Grantham, Retford, Doncaster, Selby, Brough,
# Hull Paragon are all also LNER/`lner-hull.toml` stations, on that file's
# own differently-named `ecml-*`/`lner-hull` segments) is expected and
# sufficient, per this batch's established pattern.
# ---------------------------------------------------------------------

[[stations]]
crs = "KGX"
role = "terminus"
segment = "ht-kings-cross-hull"
# CRS reused from `lner-ecml.toml`'s own verified KGX entry, not
# re-researched here.

[[stations]]
crs = "SVG"
role = "minor"
segment = "ht-kings-cross-hull"
# Stevenage — CRS reused from `lner-ecml.toml`'s own verified SVG entry.
# Limited stop (southbound only, set-down only on Sundays, per the
# services-table citation above); still listed as an ordinary station on
# this segment regardless, matching `grand-central.toml`'s identical
# treatment of its own select-service stations (Seaham, Pontefract
# Monkhill).

[[stations]]
crs = "GRA"
role = "minor"
segment = "ht-kings-cross-hull"
# Grantham — CRS reused from `lner-hull.toml`'s own verified GRA entry.

[[stations]]
crs = "RET"
role = "minor"
segment = "ht-kings-cross-hull"
# Retford — CRS reused from `lner-hull.toml`'s own verified RET entry.

[[stations]]
crs = "DON"
tiploc = "DONC"
role = "major"
segment = "ht-kings-cross-hull"
# Doncaster — CRS/TIPLOC reused from `lner-ecml.toml`'s own verified DON
# entry. Tagged `major` rather than `junction` here: unlike LNER's and
# Grand Central's own files, Hull Trains does not branch at Doncaster in
# this file's model — every Hull Trains service runs the same way from
# here through to Hull Paragon; the real branch point in this file is Hull
# Paragon itself (see below).

[[stations]]
crs = "SBY"
role = "minor"
segment = "ht-kings-cross-hull"
# Selby — CRS reused from `lner-hull.toml`'s own verified SBY entry.

[[stations]]
crs = "HOW"
role = "minor"
segment = "ht-kings-cross-hull"
# Howden — CRS confirmed via Wikipedia's "Howden railway station" article
# infobox and cross-checked against nationalrail.co.uk's own station
# detail page.

[[stations]]
crs = "BUH"
role = "minor"
segment = "ht-kings-cross-hull"
# Brough — CRS reused from `lner-hull.toml`'s own verified BUH entry.

[[stations]]
crs = "HUL"
role = "junction"
segment = "ht-kings-cross-hull"
# Hull Paragon — CRS reused from `lner-hull.toml`'s own verified HUL entry.
# Tagged `junction` per SCHEMA.md's rule of thumb: this is where this
# file's own routes diverge (5 of the 7 daily trains terminate here; 2
# continue on to Cottingham/Beverley), so it belongs to the shared main
# segment, not the exclusive `ht-beverley` branch — the branch's exclusive
# segment starts at the next station, Cottingham.

[[stations]]
crs = "CGM"
role = "minor"
segment = "ht-beverley"
# Cottingham — CRS confirmed via Wikipedia's "Cottingham railway station"
# article infobox and cross-checked against nationalrail.co.uk's own
# station detail page.

[[stations]]
crs = "BEV"
role = "terminus"
segment = "ht-beverley"
# Beverley — CRS confirmed via Wikipedia's "Beverley railway station"
# article infobox and cross-checked against nationalrail.co.uk's own
# station detail page.

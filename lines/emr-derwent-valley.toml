role = "minor"
segment = "emr-nottingham-lincoln"
# Carlton.

[[stations]]
crs = "NOT"
role = "junction"
segment = "emr-nottingham-lincoln"
# Nottingham: also an `emr-midland-main-line.toml`/`emr-regional.toml`/
# `emr-poacher.toml`/`emr-robin-hood.toml`/`northern-erewash-valley.toml`/
# `emr-crewe-derby.toml` station via other, physically distinct approaches
# -- station-overlap only with all of those. This file's own exclusive
# segment resumes at the next station, per the shared-trunk rule of thumb.

# --- Beeston, Long Eaton, Spondon: this file's own real physical routing
# for the Nottingham-Derby leg, per the EMR-table quote above -- see the
# HONEST DISCREPANCY FLAG in the file-level comment for why this does NOT
# reuse `emr-crewe-derby.toml`'s own `emr-crewe-derby-nottingham` segment
# name for this stretch, despite both files modelling the same general
# Derby-Nottingham corridor: the two files' own source rows disagree on the
# exact intermediate stations (Attenborough vs. Spondon), so their station
# sets are not byte-identical and cannot share a segment name under this
# catalogue's own convention. This file's own new, exclusive
# `emr-derwent-valley-nottingham` segment is used instead. Cost if wrong
# (i.e. if the two stretches really are one identical alignment): bounded,
# as with every other instance of this pattern -- an incident at Beeston or
# Long Eaton still matches `emr-crewe-derby.toml` independently via
# StationHit regardless of segment name. ---
[[stations]]
crs = "BEE"
role = "minor"
segment = "emr-derwent-valley-nottingham"
# Beeston: also an `emr-midland-main-line.toml` station (that file's own
# East-Midlands-Parkway-origin Nottingham spur, a different approach) and
# an `emr-crewe-derby.toml` station (a different, unreconciled citation of
# the same general corridor) -- see the ruling above.

[[stations]]
crs = "LGE"
role = "minor"
segment = "emr-derwent-valley-nottingham"
# Long Eaton: see the ruling above.

[[stations]]
crs = "SPO"
role = "minor"
segment = "emr-derwent-valley-nottingham"
# Spondon: absent catalogue-wide before this session's review (grep-

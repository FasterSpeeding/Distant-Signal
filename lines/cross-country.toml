id = "cross-country"
name = "CrossCountry"
mode = "national-rail"
category = "main-line"
operators = ["XC"]

# North, midpoint(s), south.
sample_stations = ["NCL", "YRK", "BHM", "BRI", "EXD"]
match_keywords = ["CrossCountry", "Cross Country"]
# No excluded_keywords: "Cross Country Route" (the Birmingham-Bristol
# infrastructure name) shows up in messages that genuinely do affect XC, so
# vetoing on it would cost more matches than it saves.

# Long-distance, roughly hourly: the same 5-minute delay matters less than it
# does on a metro-frequency line, and a single cancellation is a bigger share
# of the service.
[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10

# The Aberdeen/Edinburgh - Penzance spine, ordered north to south, covering the
# section XC runs end to end. The four arms are separate definitions sharing
# the XC operator code and the `xc-birmingham` hub segment: `xc-manchester`,
# `xc-cardiff` (which also shares `xc-west` as far as Cheltenham Spa),
# `xc-south-coast` and `xc-stansted`.
#
# TIPLOCs are given only where verified; the field is optional and absent
# values simply mean no TRUST/SCHEDULE correlation hint for that station.
[[stations]]
crs = "NCL"
tiploc = "NWCSTLE"
role = "junction"
segment = "xc-north-east"
# Continues north to Edinburgh (EDB), Glasgow Central (GLC) and Aberdeen (ABD)

[[stations]]
crs = "DHM"
role = "minor"
segment = "xc-north-east"

[[stations]]
crs = "DAR"
role = "minor"
segment = "xc-north-east"

[[stations]]
crs = "YRK"
tiploc = "YORK"
role = "major"
segment = "xc-north-east"

[[stations]]
crs = "DON"
tiploc = "DONC"
role = "junction"
segment = "xc-yorkshire"

[[stations]]
crs = "SHF"
tiploc = "SHEFFLD"
role = "major"
segment = "xc-yorkshire"

[[stations]]
crs = "CHD"
role = "minor"
segment = "xc-yorkshire"

[[stations]]
crs = "DBY"
tiploc = "DRBY"
role = "junction"
segment = "xc-midlands"

[[stations]]
crs = "BUT"
role = "minor"
segment = "xc-midlands"

[[stations]]
crs = "TAM"
role = "minor"
segment = "xc-midlands"
# Tamworth (Low Level platforms). CrossCountry runs 2 tph to Nottingham via
# Derby calling here -- confirmed by this audit's CIF-schedule cross-check.
# Same CRS "TAM" already used elsewhere in this catalogue for the High
# Level (WCML) platforms at this station (e.g. `west-coast-main-line.toml`'s
# own TAM entry, tiploc "TMWTHLL") -- legitimate CRS/station overlap between
# two physically distinct platform groups at one station, not a duplicate
# or mistake.

[[stations]]
crs = "BHM"
tiploc = "BHAMNWS"
role = "junction"
segment = "xc-birmingham"
# Birmingham New Street is the network's hub: most XC services call here and
# the Manchester, Cardiff, Reading and Stansted branches all diverge from it.

[[stations]]
crs = "UNI"
role = "minor"
segment = "xc-west"

[[stations]]
crs = "WOP"
role = "minor"
segment = "xc-west"
# Worcestershire Parkway. CrossCountry runs southbound-only/select-service
# stops here on both the Bristol-Manchester and Bournemouth-Manchester
# patterns -- confirmed by this audit's CIF-schedule cross-check. Resolves
# `xc-cardiff.toml`'s own "Task 9.4" deferred-to-cross-country.toml note
# about this shared row. Kept byte-identical with `xc-cardiff.toml`'s own
# copy of this BHM/UNI/WOP/CNM stretch.

[[stations]]
crs = "CNM"
role = "junction"
segment = "xc-west"
# Cardiff arm diverges here for Gloucester; Bristol services run via Standish Jn

[[stations]]
crs = "BPW"
role = "major"
segment = "xc-bristol"

[[stations]]
crs = "BRI"
tiploc = "BRSTLTM"
role = "junction"
segment = "xc-bristol"

# Bedminster, Parson Street, Nailsea & Backwell, Yatton, Highbridge &
# Burnham and Bridgwater: real, currently-open, currently-served stations
# on the same physical Bristol-Taunton double-track railway XC's own
# non-stop expresses already run over between BRI and TAU (this file
# previously jumped straight from one to the other) -- added by the
# real-world sanity review's GWR "Bristol" service-group pass, in sync with
# this same review's new `lines/gwr-weston-super-mare.toml` (a GWR local
# stopping service over this same corridor), which copies these six rows
# verbatim, mirroring the precedent already set by this file's own Dawlish
# Warren/Dawlish/Teignmouth/Totnes/Ivybridge additions further down (added
# "in sync with gwr-cornish-main-line.toml's own copy of this shared-trunk
# row"). en.wikipedia.org/wiki/Bristol_to_Exeter_line's own route
# description confirms this ordering (Bristol Temple Meads - Bedminster -
# Parson Street - Nailsea and Backwell - Yatton - ... - Highbridge and
# Burnham - ... - Bridgwater - ... - Taunton) and that these are today's
# real intermediate calling points on this route, not historical ones.
# CRS codes verified live against ds.cursed.solutions/api/stations
# (Bedminster=BMT, Parson Street=PSN, Nailsea & Backwell=NLS, Yatton=YAT,
# Highbridge & Burnham=HIG, Bridgwater=BWT).
#
# The Weston-super-Mare loop (Worle, Weston Milton, Weston-super-Mare
# itself) is NOT added here: Wikipedia's own account of this route
# describes a single-track loop diverging at Worle Junction and rejoining
# the main line at Uphill Junction, distinct from the double-track through
# route XC's own non-stop expresses use -- not the same "one physical
# double-track railway, different calling pattern" shape as the six
# stations above. Those three stations are exclusive to
# `gwr-weston-super-mare.toml`'s own new segment; see that file's own
# segment-naming comment for the full reasoning.
[[stations]]
crs = "BMT"
role = "minor"
segment = "xc-south-west"

[[stations]]
crs = "PSN"
role = "minor"
segment = "xc-south-west"

[[stations]]
crs = "NLS"
role = "minor"
segment = "xc-south-west"

[[stations]]
crs = "YAT"
role = "minor"
segment = "xc-south-west"

[[stations]]
crs = "HIG"
role = "minor"
segment = "xc-south-west"

[[stations]]
crs = "BWT"
role = "major"
segment = "xc-south-west"

[[stations]]
crs = "TAU"
tiploc = "TAUNTON"
role = "minor"
segment = "xc-south-west"

[[stations]]
crs = "EXD"
role = "major"
segment = "xc-south-west"

[[stations]]
crs = "DWW"
role = "minor"
segment = "xc-south-west"
# Dawlish Warren: real, currently-open sea-wall-route station between EXD
# and NTA -- never previously tagged; found by a data-driven audit and
# added here in sync with gwr-cornish-main-line.toml's own copy of this
# shared-trunk row (see that file's matching entries for the fuller note).

[[stations]]
crs = "DWL"
role = "minor"
segment = "xc-south-west"
# Dawlish: see DWW's note above.

[[stations]]
crs = "TGM"
role = "minor"
segment = "xc-south-west"
# Teignmouth: see DWW's note above.

[[stations]]
crs = "NTA"
role = "junction"
segment = "xc-south-west"
# Newton Abbot: role corrected minor -> junction (real-world sanity review)
# -- this is where XC's own Torquay/Paignton branch (below) diverges from
# its Plymouth/Penzance-bound continuation (TOT/IVY/PLY), per the
# shared-trunk rule of thumb.

# Torre, Torquay and Paignton: real, currently-open, currently-served
# stations on the Riviera Line branch to Torbay, added by the real-world
# sanity review's GWR "Bristol"/coverage-gap pass alongside this review's
# new `lines/gwr-riviera-line.toml`. en.wikipedia.org/wiki/Torquay_railway_
# station and .../Paignton_railway_station both confirm CrossCountry runs
# genuine (if limited) through services here from Bristol Temple Meads/
# Birmingham New Street -- a real, sourced shared corridor with
# gwr-riviera-line.toml's own GWR local service, not just a station-level
# coincidence, hence the new shared `gwr-riviera-line` segment name reused
# verbatim in both files (see that file's own segment-naming comment for
# the fuller reasoning). Kingskerswell and Preston Platform, the line's two
# other historical intermediate stops, were checked live against
# ds.cursed.solutions/api/stations and returned no current CRS -- both
# confirmed closed (1964 and 1914 respectively per their own Wikipedia
# articles) and correctly excluded.
[[stations]]
crs = "TRR"
role = "minor"
segment = "gwr-riviera-line"
# Torre.

[[stations]]
crs = "TQY"
role = "minor"
segment = "gwr-riviera-line"
# Torquay.

[[stations]]
crs = "PGN"
role = "minor"
segment = "gwr-riviera-line"
# Paignton. XC's own branch terminus; the main XC route continues instead
# via TOT/IVY/PLY below.

[[stations]]
crs = "TOT"
role = "minor"
segment = "xc-south-west"
# Totnes: real, currently-open station between NTA and PLY -- never
# previously tagged; see DWW's note above for the audit that found this.

[[stations]]
crs = "IVY"
role = "minor"
segment = "xc-south-west"
# Ivybridge: see Totnes's note above.

[[stations]]
crs = "PLY"
role = "junction"
segment = "xc-south-west"
# Continues to Penzance (PNZ) via Truro on a handful of daily services

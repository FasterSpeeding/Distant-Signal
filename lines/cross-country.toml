id = "cross-country"
name = "CrossCountry: North East - South West"
mode = "national-rail"
category = "main-line"
operators = ["XC"]

# Display name (review2 finding): "CrossCountry" alone is the operator's own
# brand name doing double duty as a LINE name, which sits oddly next to
# sibling files like `xc-cardiff.toml`'s "CrossCountry Cardiff Line" -- every
# other line in the catalogue is named for its route, not its operator. XC's
# own published route map describes this spine as its North East/Scotland -
# South West corridor (the "CrossCountry Route"/Voyager network diagram,
# cross-checked against the operator's own site), so the display name below
# follows that route wording instead. `id` is left unchanged (`cross-country`
# is a stable, published identifier per SCHEMA.md and isn't touched by a
# display-name-only rename), and "CrossCountry"/"Cross Country" stay in
# `match_keywords` below unchanged -- the brand name is still exactly what
# Knowledgebase incident text uses.

# North, midpoint(s), south. LDS added for the Leeds branch (review2
# finding, see the YRK/DON/LDS/WKF comments below) -- one sample per
# reconverging path either side of Sheffield.
sample_stations = ["NCL", "YRK", "LDS", "BHM", "BRI", "EXD"]
match_keywords = ["CrossCountry", "Cross Country"]
# No excluded_keywords: "Cross Country Route" (the Birmingham-Bristol
# infrastructure name) shows up in messages that genuinely do affect XC, so
# vetoing on it would cost more matches than it saves.

# Long-distance, roughly hourly: the same 5-minute delay matters less than it
# does on a metro-frequency line, and a single cancellation is a bigger share
# of the service.
[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10

# The Aberdeen/Edinburgh - Penzance spine, ordered north to south, covering the
# section XC runs end to end. The four arms are separate definitions sharing
# the XC operator code and the `xc-birmingham` hub segment: `xc-manchester`,
# `xc-cardiff` (which also shares `xc-west` as far as Cheltenham Spa),
# `xc-south-coast` and `xc-stansted`.
#
# TIPLOCs are given only where verified; the field is optional and absent
# values simply mean no TRUST/SCHEDULE correlation hint for that station.
#
# Unlike those four arms, the York-Leeds-Wakefield Westgate-Sheffield branch
# added below (review2 finding, 2026-09-21) is modelled INSIDE this file
# rather than as a sibling file: it reconverges back onto this file's own
# spine at Sheffield rather than reaching a distinct terminus, the same
# "Y-shape" shape `wcml-manchester.toml` models in one file rather than two.
# See that file's own caveat comment, which applies identically here:
# `LineDefinition::stations_between` and `routes_from_stations` (in
# `crates/aggregator/src/aggregation.rs`) do a flat, file-ordered index-range
# lookup over `stations` and are NOT branch-aware -- calling either across
# this file's two Sheffield-reconverging paths (e.g. `stations_between("DON",
# "SHF")`, which would spuriously include LDS/WKF) would produce a
# geographically wrong result. Not fixed here for the same reason
# `wcml-manchester.toml` didn't fix it: aggregator logic, not line data,
# out of this task's scope.
[[stations]]
crs = "NCL"
tiploc = "NWCSTLE"
role = "junction"
segment = "xc-north-east"
# Continues north to Edinburgh (EDB), Glasgow Central (GLC) and Aberdeen (ABD)

[[stations]]
crs = "DHM"
role = "minor"
segment = "xc-north-east"

[[stations]]
crs = "DAR"
role = "minor"
segment = "xc-north-east"

[[stations]]
crs = "YRK"
tiploc = "YORK"
role = "junction"
segment = "xc-north-east"
# Real-world-sanity review finding (2026-09-21): York is where XC's NE-SW
# spine genuinely forks in two towards Sheffield -- one path via Doncaster
# (already modelled below), the other via Leeds and Wakefield Westgate
# (previously entirely absent from every CrossCountry file; added below as
# a second branch, the same reconverging "Y-shape" technique
# `wcml-manchester.toml` already uses for its own Stafford-Stockport fork).
# Confirmed via Wikipedia's "Wakefield Westgate railway station" article
# (CrossCountry's Scotland/Aberdeen-Plymouth/Penzance service is explicitly
# named as calling there) cross-checked against `lner-leeds.toml`'s own
# already-verified LDS/WKF station data, reused verbatim below. Role
# changed from "major" to "junction" to reflect the fork.

# Branch 1: via Doncaster (the route this file already modelled). DON is
# the sole station on this exclusive branch before the two paths reconverge
# at Sheffield -- per SCHEMA.md's shared-trunk rule of thumb, the fork
# point (YRK) stays on the shared `xc-north-east` trunk above, and this
# branch's own exclusive segment starts here.
[[stations]]
crs = "DON"
tiploc = "DONC"
role = "minor"
segment = "xc-yorkshire-doncaster"

# Branch 2: via Leeds and Wakefield Westgate. CRS/TIPLOC for both reused
# verbatim from `lner-leeds.toml`'s own already-verified entries (LDS
# tiploc "LEEDS"; WKF has no confirmed TIPLOC there either, so none is
# invented here). Station-overlap-only with `lner-leeds.toml`,
# `tpe-north.toml` and the various Northern West Yorkshire files that also
# touch LDS/WKF -- no segment name shared, matching this catalogue's
# established cross-operator convention (checked each of those files'
# own LDS/WKF segment names before writing this; none is named
# `xc-yorkshire-leeds`).
[[stations]]
crs = "LDS"
tiploc = "LEEDS"
role = "major"
segment = "xc-yorkshire-leeds"

[[stations]]
crs = "WKF"
role = "minor"
segment = "xc-yorkshire-leeds"

# Both branches reconverge here. New segment name (not a reuse of the old
# `xc-yorkshire` name, which previously spanned DON through CHD as one flat
# stretch) -- same "the merged continuation gets its own name" pattern
# `wcml-manchester.toml` uses for its own `wcml-manchester-piccadilly`
# segment after its Stafford-Stockport fork reconverges.
[[stations]]
crs = "SHF"
tiploc = "SHEFFLD"
role = "major"
segment = "xc-yorkshire"

[[stations]]
crs = "CHD"
role = "minor"
segment = "xc-yorkshire"

[[stations]]
crs = "DBY"
tiploc = "DRBY"
role = "junction"
segment = "xc-midlands"

[[stations]]
crs = "BUT"
role = "minor"
segment = "xc-midlands"

[[stations]]
crs = "TAM"
role = "minor"
segment = "xc-midlands"
# Tamworth (Low Level platforms). CrossCountry runs 2 tph to Nottingham via
# Derby calling here -- confirmed by this audit's CIF-schedule cross-check.
# Same CRS "TAM" already used elsewhere in this catalogue for the High
# Level (WCML) platforms at this station (e.g. `west-coast-main-line.toml`'s
# own TAM entry, tiploc "TMWTHLL") -- legitimate CRS/station overlap between
# two physically distinct platform groups at one station, not a duplicate
# or mistake.

[[stations]]
crs = "BHM"
tiploc = "BHAMNWS"
role = "junction"
segment = "xc-birmingham"
# Birmingham New Street is the network's hub: most XC services call here and
# the Manchester, Cardiff, Reading and Stansted branches all diverge from it.

[[stations]]
crs = "UNI"
role = "minor"
segment = "xc-west"

[[stations]]
crs = "WOP"
role = "minor"
segment = "xc-west"
# Worcestershire Parkway. CrossCountry runs southbound-only/select-service
# stops here on both the Bristol-Manchester and Bournemouth-Manchester
# patterns -- confirmed by this audit's CIF-schedule cross-check. Resolves
# `xc-cardiff.toml`'s own "Task 9.4" deferred-to-cross-country.toml note
# about this shared row. Kept byte-identical with `xc-cardiff.toml`'s own
# copy of this BHM/UNI/WOP/CNM stretch.

[[stations]]
crs = "CNM"
role = "junction"
segment = "xc-west"
# Cardiff arm diverges here for Gloucester; Bristol services run via Standish Jn

[[stations]]
crs = "BPW"
role = "major"
segment = "xc-bristol"

[[stations]]
crs = "BRI"
tiploc = "BRSTLTM"
role = "junction"
segment = "xc-bristol"

[[stations]]
crs = "TAU"
tiploc = "TAUNTON"
role = "minor"
segment = "xc-south-west"

[[stations]]
crs = "EXD"
role = "major"
segment = "xc-south-west"

[[stations]]
crs = "DWW"
role = "minor"
segment = "xc-south-west"
# Dawlish Warren: real, currently-open sea-wall-route station between EXD
# and NTA -- never previously tagged; found by a data-driven audit and
# added here in sync with gwr-cornish-main-line.toml's own copy of this
# shared-trunk row (see that file's matching entries for the fuller note).

[[stations]]
crs = "DWL"
role = "minor"
segment = "xc-south-west"
# Dawlish: see DWW's note above.

[[stations]]
crs = "TGM"
role = "minor"
segment = "xc-south-west"
# Teignmouth: see DWW's note above.

[[stations]]
crs = "NTA"
role = "minor"
segment = "xc-south-west"

[[stations]]
crs = "TOT"
role = "minor"
segment = "xc-south-west"
# Totnes: real, currently-open station between NTA and PLY -- never
# previously tagged; see DWW's note above for the audit that found this.

[[stations]]
crs = "IVY"
role = "minor"
segment = "xc-south-west"
# Ivybridge: see Totnes's note above.

[[stations]]
crs = "PLY"
role = "junction"
segment = "xc-south-west"
# Continues to Penzance (PNZ) via Truro on a handful of daily services

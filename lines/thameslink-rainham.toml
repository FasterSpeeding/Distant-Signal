[[stations]]
crs = "RTR"
role = "major"
segment = "thameslink-rainham"
# Rochester.

[[stations]]
crs = "CTM"
role = "major"
segment = "thameslink-rainham"
# Chatham.

[[stations]]
crs = "GLM"
role = "major"
segment = "thameslink-rainham"
# Gillingham (Kent).

[[stations]]

# ============================================================================
# BRIGHTON BRANCH - Task 5.6 coordination (London Bridge/Windmill Bridge
# Jn/East Croydon): REVISED again by a later cross-file review
# (review2-shared-segments) - genuine SharedSegment after all.
# `brighton-main-line-north`/`brighton-main-line-south` (renamed from
# southern-brighton-main-line.toml's own `southern-bml-north`/
# `southern-bml-south`) ARE now reused verbatim below, replacing this file's
# former own name, `thameslink-brighton`.
# ============================================================================
# An earlier draft of this file reused `southern-bml-north` verbatim for
# LBG/ECR, reasoning that thetrainline.com's live journey-planner page
# (confirming ~81 direct daily London Bridge-Brighton trains, operated by
# Southern and Thameslink) was a qualifying non-Wikipedia second source. On
# review (Task 5.14's own internal review) that was judged wrong, for two
# reasons: (1) COMMON.md's approved second-source list is a closed set -
# "railwaycodes.org.uk, Network Rail's own route pages, National Rail
# Enquiries, or the TOC's own site" - and a commercial ticket retailer is
# none of those four categories; (2) thetrainline.com shows
# service-existence, not physical track-sharing or calling pattern. Two
# sibling tasks (southern-brighton-main-line.toml, southern-oxted-
# uckfield.toml) independently hit the same wall trying non-Wikipedia
# sources for this exact corridor (four failed fetch attempts documented in
# southern-brighton-main-line.toml's own SOURCING note: nationalrail.co.uk
# had no route prose, gatwickexpress.com/southernrailway.com/
# thameslinkrailway.com all returned HTTP 403, networkrail.co.uk 404'd), so
# the SharedSegment claim was withdrawn at the time.
#
# REVIEW FIX (shared-segment structural review, review2-shared-segments): a
# later cross-file review reinstated the claim, on different grounds than
# the withdrawn thetrainline.com argument. The London Bridge/Windmill Bridge
# Junction/East Croydon-to-Brighton corridor is, in general and
# uncontroversial UK railway-network terms, the Brighton Main Line itself -
# Thameslink's Bedford-Brighton service runs over the same physical
# infrastructure Southern's own Brighton Main Line file models, not a
# look-alike or occasionally-diverted route (contrast the Lewisham stretch,
# which stays correctly un-shared - see southeastern-bexleyheath.toml's own
# FINDING 2 - because that Thameslink service genuinely IS only an
# engineering-outage diversion there). The earlier sourcing-bar shortfall
# reflected this batch's fetch tooling being blocked (403s/404s) within task
# budget, not a real doubt about the underlying infrastructure fact. See
# southern-brighton-main-line.toml's own updated SEGMENT NAMING comment for
# the matching write-up on that side.
#
# Windmill Bridge Junction itself (per southern-brighton-main-line.toml's
# own comment, sourced from Wikipedia's "Quarry line" article) has no CRS
# code and is not listed here, matching that file's own treatment.
[[stations]]
crs = "LBG"
tiploc = "LNDNBDC"
role = "junction"
segment = "brighton-main-line-north"
# London Bridge. Also thameslink-core.toml's own terminus (station overlap
# only there, different segment name - see CORE BOUNDARY above) and
# southeastern-bexleyheath.toml's/southeastern-dartford-loop.toml's
# (formerly one file, southeastern-metro-north-kent.toml)/
# southeastern-main-line.toml's/southeastern-hayes-line.toml's/
# southeastern-north-kent.toml's/southern-oxted-uckfield.toml's own station
# (station overlap only with all six - see SEVENOAKS BRANCH above for why
# this file's own Sevenoaks branch does NOT reuse those Southeastern files'
# own `southeastern-lewisham-corridor` segment name at LBG). Genuine
# SharedSegment, however, with southern-brighton-main-line.toml's own
# station here - see REVIEW FIX above.

[[stations]]
crs = "ECR"
role = "junction"
segment = "brighton-main-line-north"
# East Croydon. Genuine SharedSegment with southern-brighton-main-line.toml's
# own station here (see REVIEW FIX above). Also southern-oxted-uckfield.toml's
# own station (its own `oxted-trunk` segment) - station overlap only there.

# ============================================================================
# PAST EAST CROYDON - this branch's real terminus is Brighton, not East
# Croydon, so its own stations have to be listed all the way there (the
# curation rules require ordering stations end to end). Per the shared-trunk
# rule of thumb, the exclusive-look continuation past the ECR junction is
# GTW onward - now `brighton-main-line-south` (renamed from this file's own
# `thameslink-brighton`, reused verbatim from southern-brighton-main-
# line.toml - see REVIEW FIX above and that file's own matching entries).
#
# East Croydon's own Wikipedia infobox separately lists "4 trains per hour
# to Brighton" alongside the "4 tph to Bedford via London Bridge" figure
# (the same service's two direction-labels), with no "via Redhill"
# qualifier - unlike this station's other, unrelated Thameslink services to
# Three Bridges/Horsham/Gatwick Airport, which explicitly ARE "via
# Redhill" - confirming the Brighton-bound service stays on the same
# direct/fast alignment southern-brighton-main-line.toml's own
# `brighton-main-line-south` segment models (GTW, TBD, HHE, BUG, HSK, PRP,
# BTN) rather than the separate via-Redhill stopping pattern.
[[stations]]
crs = "GTW"
role = "major"
segment = "brighton-main-line-south"
# Gatwick Airport. Also served by Great Western Railway, not modelled by
# this catalogue. Genuine SharedSegment with southern-brighton-main-
# line.toml's own station here - see REVIEW FIX above.

[[stations]]
crs = "TBD"
role = "junction"
segment = "brighton-main-line-south"
# Three Bridges. The Arun Valley line diverges here, not covered by this
# catalogue.

[[stations]]
crs = "BAB"
role = "minor"
segment = "brighton-main-line-south"
# Balcombe. Already named as part of this branch's own researched calling
# pattern in the SOURCING section above, but never turned into a station row
# until a later data-driven schedule audit caught the omission (~52-53% of
# trains calling, comparable to this branch's other included minor stops).
# Confirmed via its own Wikipedia infobox as Thameslink-only ("Thameslink
# operates all services at the station") - the same reason
# southern-brighton-main-line.toml's own header comment explicitly excludes
# it (Southern/Gatwick Express don't call here at all); this file's own
# entry is simply not matched by any other line's own station list at this
# specific stop, even though the segment name itself is shared.

[[stations]]
crs = "HHE"
role = "major"
segment = "brighton-main-line-south"
# Haywards Heath.

[[stations]]
crs = "WVF"
role = "minor"
segment = "brighton-main-line-south"
# Wivelsfield. Same SOURCING-section omission as Balcombe above, caught by
# the same audit (~52-53% of trains calling). CRS reused unchanged from
# southern-brighton-main-line.toml's own TASK 5.4 FILL-IN entry - genuinely
# Southern-served too, and now on the same shared segment name as that
# file's own entry - see REVIEW FIX above.

[[stations]]
crs = "BUG"
role = "minor"
segment = "brighton-main-line-south"
# Burgess Hill.

[[stations]]
crs = "HSK"
role = "minor"
segment = "brighton-main-line-south"
# Hassocks.

[[stations]]
crs = "PRP"
role = "minor"
segment = "brighton-main-line-south"
# Preston Park.

[[stations]]
crs = "BTN"
role = "terminus"
segment = "brighton-main-line-south"
# Brighton - this branch's own terminus. Also southern-coastway-east.toml's
# and southern-coastway-west.toml's own station (station overlap only with
# both, per the precedent those files' own header comments already set).

# ============================================================================
# HORSHAM BRANCH - added by the real-world sanity review: GTR's current
# "Bedford - Three Bridges" and "Peterborough - Horsham" services, both
# running via Redhill, had zero coverage anywhere in this catalogue despite
# being named as a real, disclosed-but-unmodelled gap in THREE already-
# committed files' own comments (southern-brighton-main-line.toml's own
# TASK 5.4 FILL-IN note, swr-north-downs.toml's RDH note, and
# southern-arun-valley.toml's own SELF-FLAGGED GAP note) - all three
# independently describing the same corridor: "London Bridge - Norwood
# Junction - East Croydon - Purley - Coulsdon South - Merstham - Redhill -
# Earlswood - Salfords - Horley - Gatwick Airport - Three Bridges - onward
# to Horsham", explicitly "via Norwood Junction and the 'slow'/Redhill
# alignment, not [the] Clapham Junction/Windmill Bridge Jn or Quarry Line
# fast alignment" the BRIGHTON branch above uses.
# ============================================================================
# This branch reconverges with the Brighton branch above at London Bridge
# and East Croydon (both already listed above, not re-listed here - see
# those entries' own comments) and again at Gatwick Airport (GTW) and Three
# Bridges (TBD), both already listed above under `thameslink-brighton` -
# also not re-listed here, matching the precedent
# greater-anglia-wherry-lines.toml's own Great Yarmouth entry already sets
# for a genuine same-file reconvergence (listing the same CRS twice in one
# file would give `LineDefinition::segment_for`/`SegmentRegistry` two
# different, order-dependent answers for which segment "owns" it). Purley
# through Horley are this branch's own genuinely exclusive stretch between
# those two reconvergence points.
#
# CRS codes independently verified for this task (none appeared anywhere in
# the catalogue before now): Coulsdon South (CDS), Merstham (MHM - not
# "MER", easy to guess wrong), Earlswood/Surrey (ELD), Salfords (SAF),
# Horley (HOR) - each confirmed via its own Wikipedia infobox "Station
# code" field and independently cross-checked against
# railwaycodes.org.uk's own CRS index pages. Purley (PUR) is reused
# unchanged from southern-caterham.toml/southern-tattenham-corner.toml
# (CRS only, not their segment names - this branch reaches Purley via the
# Brighton Main Line "slow" lines, a different approach from either of
# those two files' own Caterham/Tattenham Corner branches, which diverge
# south of Purley itself). Redhill (RDH) is reused unchanged from
# swr-north-downs.toml, whose own RDH comment already flags this exact
# situation: "also a Southern/Thameslink Brighton Main Line and Sutton Loop
# hub, not shared as a segment here... Southern's own approach into Redhill
# is via the separate Purley/Coulsdon South corridor". Crawley (CRW),
# Ifield (IFI), Faygate (FGT), Littlehaven (LVN) and Horsham (HRH) are
# reused unchanged from southern-arun-valley.toml, whose own header comment
# already names Three Bridges - Horsham as this exact unmodelled gap.
#
# Segment decision: this branch's own exclusive stretch (PUR through HRH,
# excluding the already-listed LBG/ECR/GTW/TBD reconvergence points) uses
# this file's own new segment name, `thameslink-horsham`, not any of the
# sibling files' segment names (`north-downs-guildford-redhill` at Redhill,
# `southern-arun-valley` at Crawley/Ifield/Faygate/Littlehaven/Horsham) -
# same reasoning already established throughout this catalogue:
# `SegmentRegistry::is_shared` marks a segment name shared globally by
# name, not scoped to the stations two files actually have in common, so
# reusing either sibling's name here would incorrectly widen this branch's
# own claim onto stations it doesn't serve (e.g. Reading, Guildford on
# `north-downs-guildford-redhill`; Ford, Arundel on `southern-arun-valley`).
# Station-level overlap only at CDS/MHM/ELD/SAF/HOR (genuinely new, no
# overlap), RDH (with swr-north-downs.toml), and
# CRW/IFI/FGT/LVN/HRH (with southern-arun-valley.toml).
[[stations]]
crs = "PUR"
role = "junction"
segment = "thameslink-horsham"
# Purley. Also southern-caterham.toml's and southern-tattenham-corner.toml's
# own station (their own Caterham/Tattenham Corner branches, which diverge
# south of here) - station overlap only, see the note above.

[[stations]]
crs = "CDS"
role = "minor"
segment = "thameslink-horsham"
# Coulsdon South.

[[stations]]
crs = "MHM"
role = "minor"
segment = "thameslink-horsham"
# Merstham.

[[stations]]
crs = "RDH"
role = "junction"
segment = "thameslink-horsham"
# Redhill. Also swr-north-downs.toml's own terminus (`north-downs-
# guildford-redhill` segment, a different physical approach via Reigate) -
# station overlap only, see the note above.

[[stations]]
crs = "ELD"
role = "minor"
segment = "thameslink-horsham"
# Earlswood (Surrey) - not to be confused with the unrelated Earlswood
# (West Midlands) station (CRS EWD) on wmr-snow-hill.toml.

[[stations]]
crs = "SAF"

id = "greater-anglia-mayflower-line"
name = "Mayflower Line (Manningtree - Harwich Town)"
mode = "national-rail"
category = "regional"
operators = ["LE"]
# LE = Greater Anglia's ATOC code, already verified and cited in
# greater-anglia-main-line.toml -- not re-derived here.

# Split out of the former `greater-anglia-suffolk-branches.toml` (real-world
# sanity review): that file bundled three unrelated, separately
# community-rail-branded Greater Anglia branches (Gainsborough, Felixstowe,
# Mayflower) under a single "Suffolk Branch Lines" umbrella that nobody
# uses, and a single incident on any one of them reported as a disruption
# on all three. Split one file per real brand, matching this session's
# EMR/TfW split precedent. Station data and CRS codes below are reused
# verbatim from the original file -- redistributed, not re-researched.

sample_stations = ["HWC"]
match_keywords = ["Mayflower line"]

# Hourly service -- unchanged from the original bundled file's reasoning
# (northern-lakes.toml/northern-tyne-valley.toml branch-line pattern): one
# cancellation is a large fraction of the hour's service, and a 5-minute
# delay on a short branch journey isn't yet a story at config.py's base
# thresholds.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# ## Mayflower line (Manningtree-Harwich Town)
#
# Wikipedia's "Mayflower line" article (fetched raw): "links Manningtree,
# on the Great Eastern Main Line, to Harwich Town ... six stations,
# including the two termini". Stations table (Manningtree, Mistley,
# Wrabness, Harwich International, Dovercourt, Harwich Town) gives the
# mileage order from London used here; hourly service confirmed from the
# same article. The line is double-track and electrified as far as Harwich
# International, then single-track (bidirectional) on to Harwich Town --
# infrastructure detail, not a station-list concern. CRS codes verified
# from each station's own Wikipedia infobox `code` field: Mistley (MIS),
# Wrabness (WRB), Harwich International (HPQ, formerly Harwich Parkeston
# Quay), Dovercourt (DVC), Harwich Town (HWC).
#
# ## Segment decision at Manningtree: station-level overlap only with
# `greater-anglia-main-line.toml`, NOT a shared segment name
#
# Manningtree is already a `geml-mainline`-tagged junction in
# `greater-anglia-main-line.toml` ("Mayflower line (to Harwich Town)
# diverges here"). Reusing that literal segment name here would (per that
# file's own documented hazard: `segments.rs`'s `SegmentRegistry::is_shared`
# marks a segment name shared globally by name, not scoped to the stations
# two files actually have in common) incorrectly reclassify unrelated
# `geml-mainline` stations (Diss, Norwich, etc.) as shared trunk too. So
# Manningtree keeps this file's own exclusive `mayflower-line` segment
# name, unchanged from the original bundled file. Station-level overlap
# only -- an incident at Manningtree matches both lines independently,
# each as `MatchScope::ExclusiveSegment`.

[[stations]]
crs = "MNG"
role = "junction"
segment = "mayflower-line"
# Manningtree: also a `geml-mainline`-tagged junction in
# greater-anglia-main-line.toml. Station-level overlap only, not a shared
# segment name -- see the segment-decision note above.

[[stations]]
crs = "MIS"
role = "minor"
segment = "mayflower-line"

[[stations]]
crs = "WRB"
role = "minor"
segment = "mayflower-line"

[[stations]]
crs = "HPQ"
role = "major"
segment = "mayflower-line"
# Harwich International: ferry interchange (Stena Line to Hook of Holland).

[[stations]]
crs = "DVC"
role = "minor"
segment = "mayflower-line"

[[stations]]
crs = "HWC"
role = "terminus"
segment = "mayflower-line"

id = "xc-stansted"
name = "CrossCountry Stansted Line"
mode = "national-rail"
category = "main-line"
operators = ["XC"]

destination_crs_filter = ["SSD", "CBG", "PBO", "LEI"]
sample_stations = ["LEI", "PBO", "CBG", "SSD"]
match_keywords = ["Birmingham to Stansted"]

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10

# Birmingham New Street to Stansted Airport, ordered west to east. Shares the
# spine's `xc-birmingham` hub only; it leaves Birmingham via Nuneaton and
# Leicester. Nuneaton is also a WCML station, but the two routes only cross
# there — no segment is shared.
#
# Minor intermediate calls (Melton Mowbray, Oakham, Stamford, March, Audley
# End) are omitted pending CRS verification; only principal stations are listed.
[[stations]]
crs = "BHM"
tiploc = "BHAMNWS"
role = "junction"
segment = "xc-birmingham"

[[stations]]
crs = "NUN"
tiploc = "NUNEATN"
role = "junction"
segment = "xc-stansted"

[[stations]]
crs = "LEI"
role = "major"
segment = "xc-stansted"

[[stations]]
crs = "PBO"
role = "junction"
segment = "xc-stansted"

[[stations]]
crs = "ELY"
role = "junction"
segment = "xc-stansted"

[[stations]]
crs = "CBG"
role = "major"
segment = "xc-stansted"

[[stations]]
crs = "SSD"
role = "terminus"
segment = "xc-stansted"

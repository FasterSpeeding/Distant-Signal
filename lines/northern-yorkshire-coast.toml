id = "northern-yorkshire-coast"
name = "York–Scarborough Line"
mode = "national-rail"
category = "regional"
operators = ["NT"]

destination_crs_filter = ["SCA", "YRK", "MLT"]
sample_stations = ["SCA", "SEM", "MLT"]
match_keywords = ["York to Scarborough line"]

[severity_overrides]
minor_delays_pct = 0.30
delay_threshold_minutes = 10

# --- REAL-WORLD-SANITY CORRECTION (Yorkshire review, 2026-09-21) ---
# This file's own `id` and `name` used to claim to be the "Yorkshire Coast
# Line" while modelling Leeds-York-Malton-Seamer-Scarborough. That is wrong:
# Wikipedia's own "Yorkshire Coast Line" article opens "the Hull–Scarborough
# line, also known as the Yorkshire Coast Line" -- a completely different,
# previously-uncatalogued route (Hull-Beverley-Driffield-Bridlington-Filey-
# Scarborough), now correctly modelled in the new sibling file
# `lines/northern-hull-scarborough.toml`. THIS file's own real route --
# confirmed via Wikipedia's own "York–Scarborough line" article -- is a
# different, separate corridor with its own name: the York-Scarborough
# line. `id` is kept unchanged (published for a month, per SCHEMA.md's "never
# change once published" and `crates/common/src/matcher.rs`'s own several
# regression tests keyed on this exact id-string) but `name` and
# `match_keywords` are corrected below to stop misclaiming the Hull-
# Scarborough route's own name/keywords, which would otherwise have
# misattributed that route's real-world incidents to this file.
#
# Research flag, NOT fixed here (out of this task's scope, left for a future
# task rather than guessed at): live sourcing during this correction found
# some evidence this route's current stopping service may actually be
# operated by TransPennine Express rather than Northern -- Wikipedia's own
# "York–Scarborough line" article states "Services operated along this line
# are run by TransPennine Express" with no Northern mention, and
# `lner-hull.toml`'s `Scarborough railway station` cross-check lists
# Northern's own current Scarborough services as running via Beverley/Hull/
# Doncaster (south, towards Sheffield -- see `northern-hull-scarborough.
# toml`), not via York/Malton at all. `tpe-north.toml`'s own YRK entry
# already flags "the wider 'North Route' grouping fans out to ... Scarborough
# on separate TPE services not modelled in this file" -- this file may well
# be exactly that gap. Changing `operators` here would cascade into this
# file's `northern-yorkshire` segment sharing with `northern.toml` and into
# several `matcher.rs` regression tests keyed on that sharing -- a much
# larger, separately-scoped change than this task's own route-identity fix,
# so it is deliberately NOT made here. Flagged prominently for whoever picks
# this up next.
#
# Leeds to Scarborough via York, ordered south-west to north-east. Services
# run through from Leeds, so it shares the `northern-yorkshire` trunk with the
# `northern` corridor; the exclusive section starts east of York.
#
# --- [FILL-IN] researched (Task 2.11, 2026-09-01): no real gap found ---
# The old "only principal stations are listed" framing turned out not to
# hide any real gap on this file's own exclusive York-Scarborough stretch.
# A fresh Wikipedia route-diagram read (York-Scarborough line article)
# confirms Malton and Seamer (both already listed below) are the only two
# intermediate stations still open: "most of the intermediate stations on
# the line were closed to passengers in September 1930" for capacity
# reasons. The two most-discussed reopening candidates, Haxby and
# Strensall, are each individually confirmed still closed as of this
# fetch - Haxby's own article: "construction of the new station is now
# expected to begin in April 2027" (not yet open); Strensall's own article:
# "closed on 22 September 1930" with the former station building "now a
# private residence" and no confirmed reopening date
# (https://en.wikipedia.org/wiki/Haxby_railway_station,
# https://en.wikipedia.org/wiki/Strensall_railway_station). Neither is
# added. The Leeds-York stretch (LDS/YRK) is shared-trunk track modelled
# identically (no intermediate stations either) in `lines/northern.toml`'s
# own `northern-yorkshire` segment - out of scope for this file to
# re-derive independently; not touched here. Fetched 2026-09-01.
[[stations]]
crs = "LDS"
tiploc = "LEEDS"
role = "terminus"
segment = "northern-yorkshire"

[[stations]]
crs = "YRK"
tiploc = "YORK"
role = "junction"
segment = "northern-yorkshire"

[[stations]]
crs = "MLT"
role = "minor"
segment = "northern-york-scarborough"
# Malton -- this file's own exclusive segment, renamed from the stale
# `northern-yorkshire-coast` (the old, wrong route name) as part of this
# correction. Not shared with `northern-hull-scarborough.toml`: that file's
# own route joins this one only further on, at Seamer -- see below.

[[stations]]
crs = "SEM"
role = "junction"
segment = "northern-scarborough-approach"
# Seamer -- confirmed genuine physical convergence with the real Yorkshire
# Coast Line: that line's own Wikipedia article states it "join[s] the
# York–Scarborough line at a junction near Seamer before terminating at
# Scarborough". Per SCHEMA.md's shared-trunk rule of thumb the junction
# belongs to the shared segment; `northern-hull-scarborough.toml` reuses
# this exact segment name for its own SEM/SCA entries. (Hull services no
# longer "diverge" here -- that framing was this file's own pre-correction
# guess at the Yorkshire Coast Line's junction point, since superseded by
# the sourced fact above.)

[[stations]]
crs = "SCA"
role = "terminus"
segment = "northern-scarborough-approach"
# Scarborough -- shared final approach with `northern-hull-scarborough.
# toml`; see the Seamer note above.

# === Scope boundaries (documented, not modelled) ===
#
# - IBM railway station (former, on the Wemyss Bay branch between
#   Branchton and Inverkip): closed, per the routemap template's own "e"
#   (historical) marker -- current operational route only, per the Global
#   Constraints.
# - The Paisley Canal Line and the Glasgow Airport Rail Link (cancelled
#   2009): both diverge/would have diverged from this general corridor per
#   the detailed routemap template, but neither is this line -- real,
#   documented gaps (Paisley Canal) or dead proposals (GARL), out of scope
#   here.

id = "southeastern-bromley-north"
name = "Bromley North Line"
mode = "national-rail"
category = "commuter"
operators = ["SE"]

sample_stations = ["GRP", "SUP", "BMN"]
match_keywords = ["Bromley North line"]

# ============================================================================
# SELF-FLAGGED GAP - southeastern-main-line.toml's own GRP (Grove Park)
# comment already flags this: "The Bromley North line (a short shuttle
# branch to Bromley North) diverges here; not covered by this catalogue."
# This file is that line.
#
# Note for the record: southeastern-chatham.toml's own BKL (Bickley) comment
# used to say "Bromley North branch diverges here; not covered by this
# catalogue." That was a pre-existing mix-up in that already-committed file,
# not a second real junction - every source checked for this task
# (Wikipedia's own "Bromley North Line" article, cross-checked against
# nationalrail.co.uk) independently and consistently names Grove Park, not
# Bickley, as this branch's only junction with the rest of the network:
# "connects at Grove Park railway station with the South Eastern Main
# Line." Corrected in that file's own BKL comment as part of this same
# batch (see its own updated wording) rather than left as a standing
# factual error now that this sibling file exists to contradict it.
#
# ============================================================================
# ROUTE AND SOURCING
# ============================================================================
# Confirmed via Wikipedia's "Bromley North Line" article (lead: "a less than
# 2 mi (3.2 km) long branch line in Greater London that connects at Grove
# Park railway station with the South Eastern Main Line ... served almost
# exclusively by shuttle services to and from Grove Park"; infobox: operator
# Southeastern, tracks "2", electrification "750 V DC third rail"), and
# cross-checked against nationalrail.co.uk's own /stations/sup/details.html
# and /stations/bmn/details.html pages (both confirm "Station managed by
# Southeastern"). Both CRS codes independently verified live against
# https://ds.cursed.solutions/api/stations?q=<name>.
#
# The line's own infobox states "2" (double) tracks throughout - this
# contradicts an initial assumption (repeated in this task's own brief) that
# it is single-track; disclosed here plainly rather than silently
# overridden, per this catalogue's convention for a brief's premise that
# doesn't hold up under verification (e.g. southeastern-metro-north-kent.
# toml's own FINDING 1/FINDING 2). What IS well-sourced and unambiguous is
# the *operational* shuttle pattern: since the 1990s the branch has been
# "served almost exclusively by shuttle services to and from Grove Park,"
# which is what actually justifies this file's `category = "commuter"` and
# tight severity tuning below (an infrequent, self-contained two-stop
# shuttle, not necessarily a single-track one).
#
# Only two stations belong to this branch exclusively - Sundridge Park and
# Bromley North - matching the infobox's own "stations = " scope; Grove Park
# itself is the shared junction, not one of "its own" two.
[severity_overrides]
minor_delays_pct = 0.20
delay_threshold_minutes = 4

# ============================================================================
# STATIONS - ordered Grove Park to Bromley North. One segment; this is a
# two-station shuttle with no internal branching.
# ============================================================================
[[stations]]
crs = "GRP"
role = "junction"
segment = "southeastern-bromley-north"
# Grove Park. Also southeastern-main-line.toml's own station (`seml-london`
# segment, already commented as this branch's own junction) - station
# overlap only, own segment name here, per the xc-south-coast.toml/
# xc-manchester.toml precedent used throughout this catalogue. See the note
# above re: southeastern-chatham.toml's own differing (and likely mistaken)
# BKL comment.

[[stations]]
crs = "SUP"
role = "minor"
segment = "southeastern-bromley-north"
# Sundridge Park. Exclusive segment starts here, one station past the Grove
# Park junction, per the shared-trunk rule of thumb.

[[stations]]
crs = "BMN"
role = "terminus"
segment = "southeastern-bromley-north"
# Bromley North.

id = "northern-lakes"
name = "Lakes Line"
mode = "national-rail"
category = "regional"
operators = ["NT"]

destination_crs_filter = ["WNE", "OXN"]
sample_stations = ["WNE", "KEN", "OXN"]
match_keywords = ["Lakes Line", "Windermere branch"]

# Hourly single-track branch: one cancellation is most of the hour's service,
# so reduced-service bites sooner than the 0.50 default, and a 5-minute delay
# on a 20-minute journey isn't yet a story.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# Oxenholme Lake District to Windermere, ordered south to north. Connects with
# the WCML at Oxenholme; the branch itself is exclusively Northern's, and no
# segment is shared with `wcml`.
#
# --- [FILL-IN] resolved (Task 2.8, 2026-09-01): intermediate halts researched ---
# Burneside and Staveley are both real, currently-open, Northern-operated
# stations on this line, added below between Kendal and Windermere. Each CRS
# cross-checked against two independent sources: the station's own Wikipedia
# infobox/article, and nationalrail.co.uk/stations/<crs>/details.html (which
# also confirmed current Northern operation). Order confirmed via
# Wikipedia's Windermere branch line article: Oxenholme, Kendal, Burneside,
# Staveley, Windermere - 5 stations total, matching what's now listed below.
# No `tiploc` confirmed to a second source for either, so none is included.
# Fetched 2026-09-01.
[[stations]]
crs = "OXN"
tiploc = "OXENHLM"
role = "junction"
segment = "northern-lakes"

[[stations]]
crs = "KEN"
role = "major"
segment = "northern-lakes"

[[stations]]
crs = "BUD"
role = "minor"
segment = "northern-lakes"
# Burneside.

[[stations]]
crs = "SVL"
role = "minor"
segment = "northern-lakes"
# Staveley (Cumbria) - not to be confused with the four differently-named
# Staveley stations in Derbyshire (Staveley Town/Central/Works, "The
# Lakes").

[[stations]]
crs = "WNE"
role = "terminus"
segment = "northern-lakes"

id = "overground-weaver"
name = "Weaver line"
mode = "national-rail"
category = "commuter"
operators = ["LO"]

# Former Lea Valley lines. A trunk from Liverpool Street splits into three
# branches (Enfield Town, Cheshunt, Chingford); the Enfield Town and
# Cheshunt branches themselves share a sub-trunk out to Edmonton Green.
# Each branch/trunk is its own `[[stations]]` block, ordered geographically
# within itself, per SCHEMA's curation rule.
#
# The Enfield Town/Cheshunt sub-trunk sharing is internal to this one line
# and file — SCHEMA's segment-sharing mechanism only cares about sharing
# *between different lines*, so it doesn't need a cross-line test.
#
# No genuine shared segment with any sibling Overground line. See
# `lines/overground-suffragette.toml`'s note about Seven Sisters (SVS,
# this line) vs. South Tottenham (SOT, Suffragette) being different
# stations despite proximity — cross-referenced here so the judgment call
# is documented from both sides.
#
# Also note: Liverpool Street (LST) already appears in this catalogue on
# `elizabeth-line.toml`/`elizabeth-heathrow.toml`/`elizabeth-shenfield.toml`
# — a station-level overlap the Task 3.0 research pass didn't call out;
# noted here for the same reason as the other cross-catalogue overlaps
# flagged elsewhere in this batch (station-level only, no segment shared).

# Trunk (all three branches), from Liverpool Street.
[[stations]]
crs = "LST"
role = "terminus"
segment = "overground-weaver-trunk"

[[stations]]
crs = "BET"
role = "minor"
segment = "overground-weaver-trunk"

[[stations]]
crs = "CBH"
role = "minor"
segment = "overground-weaver-trunk"

[[stations]]
crs = "LOF"
role = "minor"
segment = "overground-weaver-trunk"

[[stations]]
crs = "HAC"
role = "junction"
segment = "overground-weaver-trunk"

# Enfield Town/Cheshunt shared sub-trunk, continuing from Hackney Downs.
[[stations]]
crs = "REC"
role = "minor"
segment = "overground-weaver-edmonton-trunk"

[[stations]]
crs = "SKW"
role = "minor"
segment = "overground-weaver-edmonton-trunk"

[[stations]]
crs = "SMH"
role = "minor"
segment = "overground-weaver-edmonton-trunk"

[[stations]]
crs = "SVS"
role = "major"
segment = "overground-weaver-edmonton-trunk"

[[stations]]
crs = "BCV"
role = "minor"
segment = "overground-weaver-edmonton-trunk"

[[stations]]
crs = "WHL"
role = "minor"
segment = "overground-weaver-edmonton-trunk"

[[stations]]
crs = "SLV"
role = "minor"
segment = "overground-weaver-edmonton-trunk"

[[stations]]
crs = "EDR"
role = "junction"
segment = "overground-weaver-edmonton-trunk"

# Enfield Town branch, continuing from Edmonton Green.
[[stations]]
crs = "BHK"
role = "minor"
segment = "overground-weaver-enfield"

[[stations]]
crs = "ENF"
role = "terminus"
segment = "overground-weaver-enfield"

# Cheshunt branch, continuing from Edmonton Green.
[[stations]]
crs = "SBU"
role = "minor"

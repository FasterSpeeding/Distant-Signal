id = "northern-furness"
name = "Furness Line"
mode = "national-rail"
category = "regional"
operators = ["NT"]

destination_crs_filter = ["BIF", "LAN", "ULV"]
sample_stations = ["BIF", "ULV", "LAN"]
match_keywords = ["Furness Line"]

# Hourly coastal route: same rationale as the Lakes Line.
[severity_overrides]
minor_delays_pct = 0.30
reduced_service_pct = 0.35
delay_threshold_minutes = 10

# Lancaster to Barrow-in-Furness, ordered south-east to north-west. Joins the
# WCML at Lancaster; no segment is shared with `wcml`. The Cumbrian Coast
# route continues beyond Barrow to Whitehaven and Carlisle and belongs in its
# own definition.
#
# Minor intermediate calls are omitted; only principal stations are listed.
#
# Segment split, added when `lines/northern-cumbrian-coast.toml` was merged:
# only BIF (Barrow-in-Furness) is the real shared-trunk junction with that
# line, per SCHEMA.md's shared-trunk rule of thumb -- Batch 8's own final
# review caught that this file originally tagged ALL FOUR of its stations
# `segment = "northern-furness"`, which (once a second file also used that
# name for BIF) would have made `SegmentRegistry` treat the whole literal
# segment name as shared, silently reclassifying a Lancaster/Carnforth/
# Ulverston incident -- nowhere near Cumbrian Coast -- as SharedSegment.
# LAN/CNF/ULV now sit on their own exclusive `northern-furness-branch`
# segment instead; only BIF keeps `northern-furness` as the genuine shared
# trunk.
[[stations]]
crs = "LAN"
tiploc = "LANCSTR"
role = "junction"
segment = "northern-furness-branch"

[[stations]]
crs = "CNF"
role = "junction"
segment = "northern-furness-branch"

[[stations]]
crs = "ULV"
role = "minor"
segment = "northern-furness-branch"

[[stations]]
crs = "BIF"
role = "terminus"
segment = "northern-furness"

id = "overground-mildmay"
name = "Mildmay line"
mode = "national-rail"
category = "commuter"
operators = ["LO"]

# Former North London line core (Richmond to Stratford) plus the former
# West London line's north end (a Clapham Junction branch), converging at
# Willesden Junction. Two branches, each ordered geographically within its
# own `[[stations]]` block; the Clapham Junction branch rejoins the core
# at Willesden Junction, which is only listed once (in the core block).
#
# Primrose Hill and Mildmay Park are deliberately excluded — Primrose Hill
# closed to passengers in 1992, Mildmay Park closed in 1934, and neither
# carries any current service, despite both appearing on some older
# route diagrams.
#
# `overground-canonbury-curve`: Mildmay and the Windrush line both call at
# Highbury & Islington (HHY) and Canonbury (CNN) — the real curve of track
# connecting the North London and East London route alignments at that
# point — then diverge to two different, non-identical next stations
# (Mildmay to Dalston Kingsland, DLK; Windrush to Dalston Junction, DLJ —
# different CRS codes, ~350m apart, not the same station). Per
# `lines/SCHEMA.md`'s junction rule, both junction stations belong to the
# shared segment and each line's own exclusive segment resumes at the very
# next station.
#
# Other touchpoints are station-level overlaps only, not shared segments:
# Willesden Junction (WIJ, this file) with `overground-lioness`; Gospel Oak
# (GPO, this file) with `overground-suffragette` (which terminates there
# without continuing onto Mildmay track); Clapham Junction (CLJ, this
# file's own separate branch) with the existing `swr-alton`/
# `swr-portsmouth-direct`/`swr-south-west-main` catalogue and with
# `overground-windrush`'s own separate Clapham Junction branch; and
# Stratford (SRA, this file) with `elizabeth-shenfield`.
# All are different routes converging on shared stations, not shared
# track, matching the `xc-south-coast.toml`/Reading precedent.

# Core branch, Richmond to Stratford.
[[stations]]
crs = "RMD"
role = "terminus"
segment = "overground-mildmay-west"

[[stations]]
crs = "KWG"
role = "minor"
segment = "overground-mildmay-west"


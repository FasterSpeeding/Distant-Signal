[package]
name = "full-coverage-consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["http2"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
common = { path = "../common" }
dotenv = "0.15.0"
metrics = "0.24"
movement-feed = { path = "../movement-feed" }
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl", "sasl"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip", "query"] }
schedule-query = { path = "../schedule-query" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
trust-schema = { path = "../trust-schema" }

[dev-dependencies]
movement-feed = { path = "../movement-feed", features = ["test-util"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }

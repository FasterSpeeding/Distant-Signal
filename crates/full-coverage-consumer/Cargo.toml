[package]
name = "full-coverage-consumer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
common = { path = "../common" }
dotenvy = "0.15.7"
# POPULATION_SOURCE / STANOX_CRS_SOURCE=db (ingest architecture plan 4.3):
# the readers, the pool and the schema gate.
ds-store = { path = "../ds-store" }
health-http = { path = "../health-http" }
metrics = "0.24"
movement-feed = { path = "../movement-feed" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip", "query"] }
schedule-query = { path = "../schedule-query" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The pool type and the Postgres wait, as the other direct readers.
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
trust-schema = { path = "../trust-schema" }

[dev-dependencies]
# The DbSource tests: #[sqlx::test] databases migrated from ds-store's
# migrations.
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls", "macros", "migrate"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
movement-feed = { path = "../movement-feed", features = ["test-util"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true

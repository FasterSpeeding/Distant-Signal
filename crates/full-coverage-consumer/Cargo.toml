[package]
name = "full-coverage-consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
common = { path = "../common" }
dotenv = "0.15.0"
health-http = { path = "../health-http" }
metrics = "0.24"
movement-feed = { path = "../movement-feed" }
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl", "sasl"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip", "query"] }
schedule-query = { path = "../schedule-query" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
trust-schema = { path = "../trust-schema" }

[dev-dependencies]
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
movement-feed = { path = "../movement-feed", features = ["test-util"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "0.6"

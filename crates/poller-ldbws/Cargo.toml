[package]
name = "poller-ldbws"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
health-http = { path = "../health-http" }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { path = "../common" }
dotenvy = "0.15.7"
# SAMPLE_STATIONS_SOURCE=db (ingest architecture plan 4.5): the selection,
# the views' readers, the pool and the schema gate.
ds-store = { path = "../ds-store" }
# INGEST_SINK=http+shadow|stream (ingest architecture plan 3a.7): the
# station-samples stream producer, and its Redis client. Both already in
# the tree; ingest-stream is DB-free.
ingest-stream = { path = "../ingest-stream" }
metrics = "0.24"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# The pool type and the Postgres wait, as the other direct readers.
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
# The db-source test: a #[sqlx::test] database migrated from ds-store's
# migrations.
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls", "macros", "migrate"] }
wiremock = "0.6"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[lints]
workspace = true

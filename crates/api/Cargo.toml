[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["http2", "tracing", "multipart"] }
axum-prometheus = "0.10"
base64 = "0.22"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { path = "../common", features = ["postgres", "redis"] }
dotenvy = "0.15.7"
# Explicit, not merely transitive-via-`pdf-extract`/`lopdf`/`zip`: used
# directly by `ticket_extraction::reject_pdf_compression_bombs` to run our
# OWN bounded zlib decompression pass over a candidate PDF, ahead of
# `pdf_extract`'s/`lopdf`'s own completely unbounded one -- see that
# function's doc comment.
flate2 = "1"
glob = "0.3.3"
# `edge::serve`: the listener loop, so the HTTP/1 header-read timeout and
# HTTP/2 keep-alive can be set (API-2). Same versions axum already uses.
hyper = "1"
hyper-util = { version = "0.1.20", features = ["tokio", "server", "server-auto", "service", "http1", "http2"] }
# `setrlimit`/`getrlimit` in the ticket-parse child's `pre_exec`
# (`data::ticket_subprocess`). Already in the tree via tokio/std deps.
libc = "0.2"
# Needed only to name `log::LevelFilter` for
# `sqlx::ConnectOptions::log_slow_statements` (see `app.rs::AppState::init`)
# -- already an indirect dependency via sqlx itself, this just names it
# directly rather than reaching through sqlx's own re-export surface (which
# doesn't expose it).
log = "0.4"
# Hand-emitted counters (e.g. `api_trust_event_backlog_rejected_rows_total`).
# Same facade `axum-prometheus` already records through, so they reach the
# same recorder and `/metrics` listener.
metrics = "0.24"
oauth2 = "5.0"
openidconnect = "4.0"
pdf-extract = "0.12"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
regex = "1"
# PINNED TO 0.12 ON PURPOSE, not merely "not upgraded yet": oauth2 5.0 (via
# openidconnect 4.0) implements its `AsyncHttpClient` trait for
# reqwest 0.12's `Client`, so `auth::oidc` can only pass its client to
# `request_async` while this crate resolves the same reqwest major that
# oauth2 does. A `cargo add reqwest@0.13` for something unrelated would
# give this crate a *different* `reqwest::Client` type, and the failure
# surfaces as an unsatisfied-trait-bound error at the `request_async` call
# site with no mention of the version split. Bump this only together with
# an oauth2/openidconnect release that targets the newer reqwest.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip"] }
schedule-query = { path = "../schedule-query" }
serde = { version = "1.0.228", features = ["derive"] }
serde-inline-default = "1.0.1"
# `raw_value`: `POST`/`GET /private/schedule-line-population` and
# `GET /public/lines/{id}/trains` carry multi-MB population JSON through
# `serde_json::value::RawValue` instead of building a `Value` tree -- see
# `data::queries::upsert_schedule_line_population`'s doc comment.
serde_json = { version = "1.0.149", features = ["raw_value"] }
sha2 = "0.10"
sqlx = { version = "0.8.6", features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "tls-native-tls", "json"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "fs", "net", "tracing", "time", "process", "io-util"] }
toml = { version = "1.1.2", features = ["serde"] }
tower = "0.5.3"
tower-http = { version = "0.6.10", features = ["cors", "limit", "normalize-path", "timeout", "trace"] }
tracing = "0.1.44"
trip-planner = { path = "../trip-planner" }
trust-schema = { path = "../trust-schema" }
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
wiremock = "0.6"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[lints]
workspace = true

[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["http2", "tracing"] }
base64 = "0.22"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { path = "../common" }
dotenv = "0.15.0"
glob = "0.3.3"
oauth2 = "5.0"
openidconnect = "4.0"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# PINNED TO 0.12 ON PURPOSE, not merely "not upgraded yet": oauth2 5.0 (via
# openidconnect 4.0) implements its `AsyncHttpClient` trait for
# reqwest 0.12's `Client`, so `auth::oidc` can only pass its client to
# `request_async` while this crate resolves the same reqwest major that
# oauth2 does. A `cargo add reqwest@0.13` for something unrelated would
# give this crate a *different* `reqwest::Client` type, and the failure
# surfaces as an unsatisfied-trait-bound error at the `request_async` call
# site with no mention of the version split. Bump this only together with
# an oauth2/openidconnect release that targets the newer reqwest.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-inline-default = "1.0.1"
serde_json = "1.0.149"
sha2 = "0.10"
sqlx = { version = "0.8.6", features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "tls-native-tls", "json"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "fs", "tracing"] }
toml = { version = "1.1.2", features = ["serde"] }
tower = "0.5.3"
tower-http = { version = "0.6.10", features = ["cors", "limit", "normalize-path", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[package]
name = "trust-consumer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
common = { path = "../common" }
dotenvy = "0.15.7"
# TRACKED_TRAINS_SOURCE / STANOX_CRS_SOURCE=db (ingest architecture plan
# 4.4): the readers, the pool and the schema gate.
ds-store = { path = "../ds-store" }
health-http = { path = "../health-http" }
metrics = "0.24"
movement-feed = { path = "../movement-feed" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The pool type and the Postgres wait, as the other direct readers.
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
trust-schema = { path = "../trust-schema" }

[dev-dependencies]
# The db-source test: a #[sqlx::test] database migrated from ds-store's
# migrations.
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls", "macros", "migrate"] }
movement-feed = { path = "../movement-feed", features = ["test-util"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[lints]
workspace = true

[package]
name = "trust-backlog-consumer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.6", features = ["derive", "env"] }
common = { path = "../common" }
dotenvy = "0.15.7"
# `INGEST_SINK=db` (ingest architecture plan 3b.1): the backlog, shared
# movement and reasons writers, `list_stanox_crs`, the pool and the schema
# gate.
ds-store = { path = "../ds-store" }
health-http = { path = "../health-http" }
metrics = "0.24"
movement-feed = { path = "../movement-feed" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The ingest-writer's features (the pool type, the Postgres wait).
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
trust-schema = { path = "../trust-schema" }

[dev-dependencies]
movement-feed = { path = "../movement-feed", features = ["test-util"] }
# The DB sink tests' fixtures and cleanup.
ds-store = { path = "../ds-store", features = ["test-support"] }
# The sink tests: `HttpSink`'s api side (the routes and the token endpoint).
wiremock = "0.6"

[lints]
workspace = true

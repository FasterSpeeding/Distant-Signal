[package]
name = "notifier"
version = "0.1.0"
edition = "2024"

[dependencies]
health-http = { path = "../health-http" }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { path = "../common", features = ["postgres"] }
dotenv = "0.15.0"
futures-util = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
metrics = "0.24"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# No client feature at all: `default-features = false` drops the default
# `isahc-client` (a libcurl wrapper), and `hyper-client` is no longer used
# either -- sends go through `reqwest` below via web-push's own
# client-agnostic `request_builder` (see `send.rs::send_message` for why:
# L9, the transport's resolver must enforce the SSRF guard itself).
web-push = { version = "0.11", default-features = false }
# The push transport itself (L9 follow-up): `common`'s public-only-resolver
# client. Same version/features `common` already builds, so no new crate.
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
# `web_push::request_builder::build_request`/`parse_response` speak
# http 0.2 types; same `0.2` web-push itself pins.
http = "0.2"

[dev-dependencies]
# `PUSH_SEND_TIMEOUT` regression test (M2, 2026-09 security/bug review):
# a local wiremock server whose delayed response outlasts a short injected
# per-attempt timeout. Same version `common` already uses.
wiremock = "0.6"
# Paused (virtual) time for push-queue tests with time bounds
# (`#[tokio::test(start_paused = true)]`), so no test asserts on wall-clock
# time a loaded CI runner can blow. Same tokio, one more feature.
tokio = { version = "1.52.3", features = ["test-util"] }

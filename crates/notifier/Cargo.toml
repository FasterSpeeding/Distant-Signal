[package]
name = "notifier"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { path = "../common" }
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# `hyper-client`, not the `isahc` default -- isahc is a libcurl wrapper, and
# pulling in libcurl as a second, separate C HTTP stack (beyond OpenSSL,
# which every service in this workspace already needs) for one crate is
# avoidable; `hyper-client` needs no new system library beyond what
# `native-tls`/OpenSSL already requires. Re-verified against
# https://docs.rs/crate/web-push/0.11.0/source/Cargo.toml this session:
# `default = ["isahc-client"]`, so `default-features = false` is required
# to actually drop isahc, not just add hyper-client alongside it.
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }

[dev-dependencies]
# Same `0.2` `web-push 0.11.0` itself pins (its own `parse_response(status,
# body)` takes this crate's `StatusCode`, not a re-export of its own) --
# `send.rs`'s own test module drives that real function directly (rather
# than constructing a `web_push::WebPushError` by hand, which is impossible
# from outside that crate: its `ErrorInfo` payload type is not
# publicly reachable) to get a genuine `WebPushError` value for each status
# code its 410/404/401 classification cares about.
http = "0.2"
# `PUSH_SEND_TIMEOUT` regression test (M2, 2026-09 security/bug review):
# same wiremock-mock-server + `set_delay` + paused-clock pattern as
# `common::oauth_client`'s own `fetch_token_times_out_instead_of_hanging_forever`
# test, pinned to the identical versions that crate already uses.
wiremock = "0.6"
tokio = { version = "1.52.3", features = ["test-util"] }

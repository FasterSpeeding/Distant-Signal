[package]
name = "aggregator"
version = "0.1.0"
edition = "2024"

[dependencies]
health-http = { path = "../health-http" }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { path = "../common" }
dotenv = "0.15.0"
futures-util = "0.3"
metrics = "0.24"
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.13"

[dev-dependencies]
async-trait = "0.1"

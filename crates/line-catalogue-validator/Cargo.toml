[package]
name = "line-catalogue-validator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.6", features = ["derive", "env"] }
common = { path = "../common" }
csv = "1.4"
glob = "0.3.3"
quick-xml = { version = "0.41.0", features = ["serialize", "escape-html"] }
regex = "1.11"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
# Only with the `db` feature: `--regenerate-crs-tiploc-from-db` reads
# `corpus_locations` from DATABASE_URL. Off by default, so the fast tier CI
# runs on every PR builds no database client.
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-native-tls"], optional = true }

[features]
db = ["dep:sqlx"]

[lints]
workspace = true

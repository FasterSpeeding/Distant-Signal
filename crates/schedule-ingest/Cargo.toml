[package]
name = "schedule-ingest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
health-http = { path = "../health-http" }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { path = "../common" }
dotenvy = "0.15.7"
# The GCS bucket source (`gcs.rs`): RS256 for a service-account key's
# self-signed JWT. Already in the tree (object_store, rustls), with the same
# aws-lc-sys backend: no new crates.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys", "alloc"] }
# The bucket source: JWT segments, and GCS's base64 crc32c/md5Hash.
base64 = "0.23"
# The bucket source: CRC32C (`CRC_32_ISCSI`) of each download, checked
# against the object's metadata. Already locked.
crc = "3.3"
# The DB sink (ingest architecture plan 2d.1, `sink.rs`): the feed
# marker and CORPUS writes, their validation, the pool and the schema gate.
ds-store = { path = "../ds-store" }
# CORPUS extracts arrive gzipped (`corpus.rs`); same spec as `crates/api`.
flate2 = "1"
metrics = "0.24"
# The bucket source: MD5 of each download, checked against GCS's md5Hash
# when the object has one. Already locked (digest 0.10, as sha2).
md-5 = "0.11"
# The NLC XML CORPUS snapshot (`corpus_xml.rs`), parsed streaming; the
# workspace's version (`crates/poller-transit-schedule`), no features.
quick-xml = "0.42.0"
# The bucket source's GCS JSON API calls: the workspace's reqwest, as
# `common` builds it (`common::gcp_external_account` uses the same client).
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# SHA-256 of every delivered file (`audit.rs`); same spec as `crates/api`
# and `crates/common`.
sha2 = "0.11"
# The DB sink's pool and SQLSTATE classification; the ingest-writer's spec.
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-native-tls"] }
# `sync`: the bucket source's Pub/Sub wake-up (`bucket::Wake`).
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1.44"
# Same version/feature spec as `crates/api`'s existing direct dependency
# (deflate-only, no default features) -- the real delivery zip uses
# standard Deflate compression (confirmed via `unzip -v timetable_full.zip`
# during this crate's research), so no other compression method is needed.
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The in-process proxy in front of fake-gcs-server in the bucket source's
# end-to-end tests (`bucket_e2e_tests.rs`); `health-http`'s version, so
# already in this crate's tree.
axum = "=0.8.9"
# Renders the registered metrics in tests (the bucket source's
# registered-at-0 check); the version `common` uses.
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
tempfile = "=3.27.0"
# A fake GCS JSON API (and STS/IAM Credentials) for the bucket source's
# tests; same spec as `crates/common`.
wiremock = "=0.6.5"
# To capture `common::logging`'s JSON lines in the audit-line tests; same
# spec as `crates/common`.
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[lints]
workspace = true

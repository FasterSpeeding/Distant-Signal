[package]
name = "schedule-ingest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
health-http = { path = "../health-http" }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { path = "../common" }
dotenvy = "0.15.7"
# `INGEST_SINK=db` (ingest architecture plan 2d.1, `sink.rs`): the feed
# marker and CORPUS writes, their validation, the pool and the schema gate.
ds-store = { path = "../ds-store" }
# CORPUS extracts arrive gzipped (`corpus.rs`); same spec as `crates/api`.
flate2 = "1"
metrics = "0.24"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# SHA-256 of every delivered file (`audit.rs`); same spec as `crates/api`
# and `crates/common`.
sha2 = "0.10"
# The DB sink's pool and SQLSTATE classification; the ingest-writer's spec.
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
# Same version/feature spec as `crates/api`'s existing direct dependency
# (deflate-only, no default features) -- the real delivery zip uses
# standard Deflate compression (confirmed via `unzip -v timetable_full.zip`
# during this crate's research), so no other compression method is needed.
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
# To capture `common::logging`'s JSON lines in the audit-line tests; same
# spec as `crates/common`.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wiremock = "0.6"

[lints]
workspace = true

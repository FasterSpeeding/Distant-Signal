[package]
name = "darwin-relay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The Darwin Push Port relay (DS-152): Kafka (the RDM Push Port JSON topic)
# to the ds:ingest:darwin Redis stream, which ingest-writer applies. No
# database dependency, like the other stream producers. Every dependency is
# already in Cargo.lock.
[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
# A Push Port document inside a record's `bytes` may be base64 (gzip).
base64 = "0.23"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
common = { path = "../common", features = ["redis"] }
dotenvy = "0.15.7"
flate2 = "1"
health-http = { path = "../health-http" }
ingest-stream = { path = "../ingest-stream" }
metrics = "0.24"
# Same features as movement-relay: SASL_SSL against RDM's brokers.
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl", "sasl"] }
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true

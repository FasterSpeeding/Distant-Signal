[package]
name = "common"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6.6", features = ["derive", "env"] }
glob = "0.3.3"
metrics = "0.24"
# The listener (`http-listener`, hence hyper) only with the `http` feature;
# without it the crate still builds recorders (tests, `ds-store`).
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Only with the `postgres` feature: `common::pg`, the pool settings shared by
# the crates that hold a Postgres pool, and `common::public_delay::db` (hence
# `chrono` and `derive`). Same version and features the workspace already uses.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "derive"], optional = true }
# Only with the `redis` feature: `common::redis_conn`, the bounded
# ConnectionManager settings shared by every worker that holds a Redis
# connection. Same version and features those crates already use.
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"], optional = true }
# Only with the `http` feature (on by default): see [features].
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "native-tls", "gzip"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde-inline-default = "1.0.1"
serde_json = "1.0.149"
serde_repr = "0.1.20"
sha2 = "0.11"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "net"] }
toml = { version = "1.1.2", features = ["serde"] }
tracing = "0.1.44"
# `common::logging`: the one subscriber setup every binary shares. `json` for
# the span-field storage (`JsonFields`) behind the JSON line format.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5"

# `common::heap`: `mallopt` and `malloc_trim`, glibc only. Already in the
# tree via tokio/std.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2"

[features]
# Every service uses the defaults. `ds-store` turns them off: its normal
# dependency closure must not contain hyper or reqwest
# (scripts/check-crate-deps.py, ingest architecture spec §5.1).
default = ["http"]
# Outbound HTTP (reqwest: `ingest`, `poller_loop`,
# `gcp_external_account`, `outbound_endpoint_guard`) and the metrics HTTP
# listener (`metrics::install`, hyper via `http-listener`).
http = ["dep:reqwest", "metrics-exporter-prometheus/http-listener"]
# `common::pg` (Postgres pool settings). Enabled by api, aggregator, notifier
# and enricher; the pollers and consumers do not build sqlx.
postgres = ["dep:sqlx"]
# `common::redis_conn` (bounded Redis connection settings). Enabled by
# movement-relay, movement-feed, enricher, ingest-stream, ingest-writer and
# poller-incidents (not the api: it has had no Redis client since ingest
# phase 5, step 5.4).
redis = ["dep:redis"]
# `common::redis_group::fake::FakeConn`, a scripted Redis connection for
# other crates' unit tests (movement-feed, enricher). Test-only.
redis-test-util = ["redis"]

[dev-dependencies]
# `logging`'s test of `log`-crate events (both already in the workspace via
# tracing-subscriber's default `tracing-log` feature).
log = "=0.4.34"
tracing-log = "=0.2.0"
# Only to prove `redis_auth` URLs parse back to the same credentials in the
# redis crate the services use (already in the workspace; no new crate).
redis = { version = "1.8", default-features = false }
# `gcp_external_account`'s subject-token files (already in the workspace,
# same spec as schedule-ingest's).
tempfile = "=3.27.0"
wiremock = "=0.6.5"
tokio = { version = "=1.54.1", features = ["test-util", "io-util"] }

[lints]
workspace = true

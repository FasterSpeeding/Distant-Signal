[package]
name = "poller-incidents"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
health-http = { path = "../health-http" }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
# `postgres` and `redis`: the DB sink (plan 2c.2) -- `common::pg` and
# `common::incident_text_changed`/`common::redis_conn`.
common = { path = "../common", features = ["postgres", "redis"] }
# The DB sink: `ds_store::incidents` (apply, inference), the pool and the
# schema gate.
ds-store = { path = "../ds-store" }
dotenvy = "0.15.7"
metrics = "0.24"
quick-xml = { version = "0.41.0", features = ["serialize"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.149"
# The DB sink's tests: the HTTP sink's POST to a stand-in api.
wiremock = "0.6"

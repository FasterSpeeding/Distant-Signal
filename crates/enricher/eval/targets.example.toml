# Example targets for the enricher model-eval harness (src/eval/). Copy to
# targets.toml (git-ignored), edit, and point EVAL_TARGETS at it; see
# docs/enricher-model-eval.md. A target is one model served from one endpoint
# in one environment: the same model on two hosts is two targets.
#
# Every key except name/base_url/model is optional and defaults to what the
# enricher service itself defaults to, so an unset key benchmarks the
# deployment as it would really run. Keys mirror the service's env vars:
#
#   provider              LLM_PROVIDER: "openai" (default; any OpenAI-compatible
#                         Chat Completions endpoint) or "anthropic" (the Claude
#                         API, docs/enricher-anthropic.md)
#   base_url              LLM_BASE_URL (ends in /v1)
#   model                 LLM_MODEL
#   api_key_env           NAME of the env var holding the key (never the key)
#   request_timeout_secs  LLM_REQUEST_TIMEOUT_SECS (perf benchmark only)
#   quality_timeout_secs  request timeout for the quality eval (default 1800)
#   reclaim_min_idle_secs RECLAIM_MIN_IDLE_SECS (perf report comparison only)
#   max_tokens            LLM_MAX_TOKENS
#   reasoning_effort      LLM_REASONING_EFFORT
#   max_in_flight         LLM_MAX_IN_FLIGHT
#   rate_limit_retries    LLM_RATE_LIMIT_RETRIES
#   rate_limit_retry_secs LLM_RATE_LIMIT_RETRY_SECS
#   gateway_retries       LLM_GATEWAY_RETRIES
#   auth                  LLM_AUTH: "api-key" (default), "openai-wif-authentik"
#                         or "openai-wif-kubernetes"
#   prompt_cache          LLM_PROMPT_CACHE (anthropic): "1h" (default), "5m", "off"
#   thinking              LLM_THINKING (anthropic), e.g. "disabled"
#   anthropic_version     LLM_ANTHROPIC_VERSION (anthropic)
#
# For "anthropic", reasoning_effort is sent as output_config.effort and
# max_tokens defaults to 16000 (the Messages API requires it).
#
# api_key_env is the normal route, OpenAI included. The keyless workload
# identity modes (docs/enricher-openai.md, "Keyless auth") need a projected
# Kubernetes service-account token, so they only work from a pod in the
# cluster. Their settings go in a [targets.workload_identity] table, named
# like the service's env vars in lower case without the LLM_/OPENAI_
# prefix: identity_provider_id, service_account_id, identity_token_file,
# token_exchange_url, authentik_token_url, authentik_client_id,
# authentik_scope, token_refresh_skew_secs. For example:
#
#   auth = "openai-wif-authentik"
#   [targets.workload_identity]
#   identity_provider_id = "<identity-provider-id>"
#   service_account_id = "<openai-service-account-id>"
#   authentik_token_url = "https://sso.example.com/application/o/token/"
#   authentik_client_id = "<client-id>"
#   authentik_scope = "profile"
#
# environment is free text, but fill it in: perf numbers are meaningless
# without knowing the hardware/host they came from.

[[targets]]
name = "ollama-gpu-gemma3-12b"
environment = "Self-hosted Ollama, single consumer GPU, reached over Tailscale"
base_url = "http://ollama.example.internal:11434/v1"
model = "gemma3:12b"

[[targets]]
name = "ollama-cpu-gemma3-4b"
environment = "Developer laptop, CPU only (Ollama)"
base_url = "http://localhost:11434/v1"
model = "gemma3:4b"
# A CPU box is slow; match the timeout you would deploy with.
request_timeout_secs = 600

[[targets]]
name = "hosted-glm-low-effort"
environment = "Hosted OpenAI-compatible API (gateway cuts requests at ~302 s)"
base_url = "https://integrate.api.nvidia.com/v1"
model = "z-ai/glm-5.3"
api_key_env = "NVIDIA_API_KEY"
request_timeout_secs = 320
max_tokens = 8192
reasoning_effort = "low"
max_in_flight = 2
rate_limit_retries = 3
gateway_retries = 1

[[targets]]
name = "openai-gpt-6-luna-none"
environment = "OpenAI platform (api.openai.com, US processing), Tier 1; see docs/enricher-openai.md"
base_url = "https://api.openai.com/v1"
model = "gpt-6-luna"
api_key_env = "OPENAI_API_KEY"
# Must be "none": any other effort forbids the temperature 0 every request
# sends. No max_tokens: this model rejects it.
reasoning_effort = "none"
request_timeout_secs = 120
max_in_flight = 3
rate_limit_retries = 3
gateway_retries = 1

# The Claude API (docs/enricher-anthropic.md). Haiku 5.5 is the service's
# default model for LLM_PROVIDER=anthropic; Sonnet 5.5 is the quality
# reference to compare it with. Both at the model's default effort and
# adaptive thinking; add reasoning_effort = "low" (or thinking = "disabled"
# on Haiku) as further targets to measure the cheaper settings.
[[targets]]
name = "anthropic-claude-haiku-5-5"
environment = "Claude API (api.anthropic.com), standard tier; see docs/enricher-anthropic.md"
provider = "anthropic"
base_url = "https://api.anthropic.com/v1"
model = "claude-haiku-5-5"
api_key_env = "ANTHROPIC_API_KEY"
request_timeout_secs = 120
max_in_flight = 3
rate_limit_retries = 3
gateway_retries = 2

[[targets]]
name = "anthropic-claude-sonnet-5-5"
environment = "Claude API (api.anthropic.com), standard tier; see docs/enricher-anthropic.md"
provider = "anthropic"
base_url = "https://api.anthropic.com/v1"
model = "claude-sonnet-5-5"
api_key_env = "ANTHROPIC_API_KEY"
request_timeout_secs = 180
max_in_flight = 3
rate_limit_retries = 3
gateway_retries = 2

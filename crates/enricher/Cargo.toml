[package]
name = "enricher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
health-http = { path = "../health-http" }
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { path = "../common", features = ["postgres", "redis"] }
dotenv = "0.15.0"
metrics = "0.24"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "native-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
# Parses the model-eval harness's targets file (`src/eval/target.rs`).
toml = { version = "1.1.2", features = ["serde"] }
wiremock = "0.6"
# Workload identity tests (`src/auth.rs`, `src/config.rs`): the projected
# token file, the token-exchange metrics and the "no token in the logs" check.
tempfile = "3"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

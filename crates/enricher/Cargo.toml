[package]
name = "enricher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
health-http = { path = "../health-http" }
anyhow = "1.0.102"
# Already in the tree through reqwest: the `OpenAI` batch upload's body, so
# its 401 retry shares the bytes instead of copying the whole input file.
bytes = "1"
chrono = { version = "0.4.44", features = ["serde"] }
# Europe/London for the stated-end-time check (`src/checks.rs`).
chrono-tz = "0.10"
clap = { version = "4.6.1", features = ["derive", "env"] }
common = { path = "../common", features = ["postgres", "redis"] }
dotenvy = "0.15.7"
# The schema gate (`ds_store::schema::wait_for_schema`, plan 1B.3).
ds-store = { path = "../ds-store" }
metrics = "0.24"
# The output checks' text patterns (`src/checks.rs`).
regex = "1"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "form", "multipart", "native-tls", "gzip"] }
serde = { version = "1.0.228", features = ["derive"] }
# `raw_value`: a batch request is held as its serialised body
# (`llm::batch_api::BatchRequest`), not a `Value` tree three times its size.
serde_json = { version = "1.0.149", features = ["raw_value"] }
sqlx = { version = "0.9.0", features = ["chrono", "json", "macros", "postgres", "runtime-tokio", "tls-native-tls"] }
futures-util = "0.3"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Parses the model-eval harness's targets file (`src/eval/target.rs`), for
# `enricher eval` and its tests. Already in the image through `common`.
toml = { version = "1.1.2", features = ["serde"] }
tracing = "0.1.44"

[dev-dependencies]
wiremock = "=0.6.5"
# Workload identity tests (`src/auth.rs`, `src/config.rs`): the projected
# token file, the token-exchange metrics and the "no token in the logs" check.
tempfile = "=3.27.0"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }

[lints]
workspace = true

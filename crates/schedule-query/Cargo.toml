[package]
name = "schedule-query"
version = "0.1.0"
edition = "2024"

# Deliberately lib-only: no `main.rs`/`[[bin]]`, no dependency on `tokio`,
# `reqwest`, `sqlx`, or `rdkafka`. See src/lib.rs's module doc.
[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }

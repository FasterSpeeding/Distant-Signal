[package]
name = "ds-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The dependency rules are the ingest architecture spec's §5.1.
# scripts/check-crate-deps.py (CI's scripts-lint job) fails if this crate's
# normal dependency closure gains axum, tower, hyper, redis, reqwest,
# oauth2, openidconnect or api: no web framework, HTTP client or Redis here.
# Functions that publish to Redis today return what to publish instead, and
# the caller publishes.
#
# The whole set is declared up front (phase 1A.1), so the parallel module
# moves (1A.2-1A.12) rarely need to edit this file.
[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
# `trains`: `eta_blend::london_to_utc`.
chrono-tz = "0.10"
# No default features: they bring reqwest and the metrics HTTP listener
# (hyper). `postgres`: `common::pg`.
common = { path = "../common", default-features = false, features = ["postgres"] }
metrics = "0.24"
rand = "0.8"
schedule-query = { path = "../schedule-query" }
serde = { version = "1.0.228", features = ["derive"] }
# `raw_value`: the schedule line population is carried as raw JSON (see the
# api's `upsert_schedule_line_population`).
serde_json = { version = "1.0.149", features = ["raw_value"] }
# The api's sqlx features minus `macros` and `migrate` (spec §5.1, §5.4):
# runtime-checked `sqlx::query` only, so no compile-time query cache, and
# the migrator stays in the api until phase 1B. `derive` keeps
# `#[derive(sqlx::FromRow)]`.
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "derive", "json", "postgres", "runtime-tokio", "tls-native-tls"] }
tokio = { version = "1.52.3", features = ["sync", "time"] }
tracing = "0.1.44"
trust-schema = { path = "../trust-schema" }

[features]
# Test-only helpers for tests that stay in other crates (the api's
# `train_tracking` sweep-exclusion test reads
# `sweeps::reconciliation::enrichment_candidate_ids_for_tests`). Only the
# api's dev-dependency turns it on; no binary is built with it.
test-helpers = []

[dev-dependencies]
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
